uce than tdl the rest — the cultivation of the heart. It can sig¬ nify but little w hat a woman’s other perfections ma}' be, if she be desti¬ tute of tenderness and sensibility, or if her heart be not pure as the sj)ot- IcBs snow “that liaugs on Diana’s temple.” A wife is nothing to her husband whose heart is not bound to his by the sympathies of a kindred spirit — w liieh, like that invisible force that turns the needle to the imle, and\n\nbinds creation together, must direct to his happiness every impulse of her being, thereby knittmg soul to soul by tlie affinities of undying love. Where love reigns supreme the cares and distresses of life fade into insig¬ nificance, and all creation reflects the roseate tints of the soul’s hope and joy ; but if love bo dissipated or broken, the sun of existence is dark¬ ened, and creation relapses into chaos ; the gay panorama ol life, with its shifting lights and musical echoes, changing to the wailmg and desola¬ tion of a funeral scene.\n\nLarok.Families. — To the instances of unusually large numbers of children by one mother, may ho added that of a Lady Elphin- stone, who is said, by tradition, to have had no less tlian 30 children, of whom 37 were living nt one time. There is a story told of this lady and her husband. Lord Elphin- stone, which seems to corroborate the tradi¬ tion ; it is, that they once asked a new and somewhat bashful acquaintance to visit them, telling him that he should meet no one but their family circle. Their guest arrived shortly before dinner, and, being shown through the dining-hall on his way to the drawing.r.jom, was much disconcerted at seeing a long table laid for about 30 people, t^n remonstrating with his Imst and hostess fur having taken him in, as he thought, ho was (paietly informed that he had been told no more than the truth, for that their family party, when all assembled, only fell short of thirty bt/ one. I believe that John, 8th Lord Elphinstonc, and his lady, a daughter of the Lari of Lauilerdale, who lived in the latter part of the 17th and beginning of the 18th centuries, are the pair to whom this story refers; and though the Scotch peer¬ ages make no mention of any such pheno¬ menon in the Elphinstonc family, yet I am strongly inclined, from the goodness of the authority from which I derive the tra¬ dition, to believe it to be true. — Notes and Queries.\n\nCurran being angry in a debate one day, put his hand on his heart, saying, “lam the trusty guardian of my own honour.” “Then,” replied Sir Boyle Buach, “ I congratulate my honourable friend on the snug sinecure to which he has appointed himself.\"","4\n\nTHE MAGIC OF MILDNESS; OK,\n\nTHE MAGIC OF MILDNESS;\n\nOB,\n\nTHE POWEB OF A GENTLE SPIKIT.\n\nWild are the pamions of the mind,\n\nWhich harden while they tear and rend ;\n\nI In woman'a lore alone we tind A power to soften or to mend.\n\nWoman ! the power is thine to save\n\nFrom ruin and from sorrow’s grave !\n\nTHKcvcry-da}' life by wliicli we are Burrounded baa its romances, as well as the brain of the pot't and the no¬ velist. Not a few of the scenes which we allow to pass by unnoticed would, if contemplated through the medium and adorned by the apiwn- dages of the ready Mritcr’s wit, as¬ sume a power of interest and excite¬ ment 01 thrilling order. How many heroines among the wives and daugh¬ ters of England would be found, u ho, by noble endurance and the display of a proper spirit, have shed light upon otherwise dark and cheerless\n\n£aths, rendering themselves immortal y their conduct, and blessings to the age and country which gave them birth! Such a simple scene, from domestic and real life, I am about to unfold ; in which\n\nA silent les;03, but of sovereign use, may perchance meet the eye of mul¬ titudes of those who by a poet of the present day arc designated “ the angels of life,\" and be by them handed down, by practical exhibition, to ge¬ nerations yet unborn.\n\nTwelve years have elapsed since the circumstances which form the tale before us had their commencement. It was at the close of an autumnal day of great beauty, when a convey¬ ance halted at the entrance of a neat village in the picturesque county of Sussex. A person of gentlemanly appearance, alighting from it, di¬ rected the driver to proceed leisurely\n\ntowards the “ Mistletoe- Dough,” in¬ dicating at the same time, with a light cane which he carried, its posi¬ tion in the village, which lay bosomed in a “ boundless contiguity of shade.”\n\nThe vehicle moved on ; and the stranger, folding his arms mechani¬ cally, stood still, while his piercing eyes wandered excursively, and with an interest that was evidently heigh¬ tened by mental associations, over a beautiful valley, which lay in gather¬ ing shadow on his right hand. Tlie sim, dipping behind a elum)) of trees, yet glowed in fiery, broken fragments behind their dark and interlacing trunks. Here and there a misty exhalation wound ujiwards towards heaven, seeming to indicate the pre¬ sence of a rivulet in the sw ard below. White gables gleamed spectrally through leafy orchard-trees; and where' the grey church-tower rose up, the hovering smoke from neighbour¬ ing cottages hung like a vapoury crown around the autiijuc pile. Then' was that, both in the hour and pros¬ pect, of the most interesting and touching nature ; and the absorbed and motionless aspect of the stranger acknowledged to the full the influen¬ ces of the season and the scene.\n\nThree years lu'fore this period the present visitant had occupied nearly the same spot ; and as his mind now rapidly ran over the scenes which then and subsequently had transpired, he became absorbed in a reverie somewhat singular, considering the purpose for which he had now visited the village. It was at such an hour, in the same place, he had honestly but tremblinglv avowed his love for a village maid, tbe only daughter of a respectable gardener, and listened delightedly to her modest, ingenuous response. During the period referred to, ne had lalmured industriously, and with success, to obtain such means.","TUE TOWER OF A GENTLE SPIRIT,\n\n6\n\nand place himself in such a position, | as n ould ^ive him right to expect that , the application for the hand of her whose heart he had won would not bo rejected. Tliat application had been made, and by the parents of the maiden clicerfully responded to ; and now Alfreil Konncrslcy had come for the pur)>osc of obtaining his promised i bride, and bearing her with him to a ' neat and c anfortable home in the vi¬ cinity of t’la])ham.\n\nThe jonng man still 8t(X)d in the attitude, and under tlie influence we liave dcseribed, ■when his cogitations j were suddenly terminated by a voice of peculiar sweetness, which uttered his name, accompanied by a playful touch on his slioidder, Alfred Kcn- ncrsley turned, and in a second his aflianced bride was in his anus. Emma llaMwiii had come forth to meet her lover : and now, locked arm in arm, they entered together the re- , sidcnce of her parents, from whom i Alfn'd received such hearty greeting ! Jis his ))osiiion and their honest cha- , racter dictated.\n\nJiever had a brighter or a more joyful day opened upon this pretty village than on the following morn- ^ ing was witnessed. Greeting crowds lined the pathway wliich led up to the church ; and ns Alfred and Emma passed to and from tl>e sacred l)uilding, multiplied were the fervent wishes, simply expressed, which were breathed for their welfare.\n\nTwo years passed rapidly away, and Airs. Kcniierslcy found her com¬ forts and her cares alike increased. Two lovely children had crowned their union, and the steady perse¬ verance of lier husband had rendered them happy, and n\u003clded to their pos¬ sessions. But, alas ! a blighting mil¬ dew settled unexjK'ctedly upon her blossoming delights, 'ilie fatal mania — which about the period referred\n\nto had spread through almost every\n\nf)ortion of society — of becoming lastily rich through the medium of railroad-spec ogressing from batl to worse. I^ece8sity had before been urged as a reason whv at least two evenings in every wet'k should be devoted to companj' in the parlour of a tavern in the vicinity ; and the fond and aflectionale wife did little more than by her mild pleading eye beseech him to dis¬ continue such association. In her private moments, except only accom¬ panied by her bclovea children, she commended the domestic renegade to the proU'ction of the great Father of the numan family, and besought His influence to change his dis¬ position, and turn his heart to those whom he had deserted.\n\nAs time progressed, so were the periods of the husband and the lather’s absence from his home in¬ creased ; until, without any assigned reason, save and except his pleasure, every night, and frequently hours after a new day had dawned, he was absent from those whom love and duty rendered it imperative he should protect, cheering by his iiresence, and instructing by his counsel. Still gentle as the lamb beneath the hands of its shearers, and mild as the breath of a gentle zephyr, the affec- tionatc wife received him on his re¬ turn with delight, and redouliled her efforts to render his home the most delightful phice which labour itself might find beneath the sun.\n\nMatters were progressing with fear¬ ful rapidity towards a climax in Al¬\n\nfred Kennerslcy’s affairs ; in his con¬ duct was seen a practical illustration of the truth of the declaration, “ Bray a fool in a mortar with a pestle among wheat, yet w ill not his folly depart from him.” In one only par¬ ticular was no change experienced in his circumstances, and that was in the devoted attachment and perse vering kindness of his neglected wife. In all else a fearful wreck nas pre¬ sented. Ilis person no longer bore the stamp of the once gentlemanly tradesman. lie looked the besotted thing he had become. His heavy- eye and bloated cheek proclaimed his midnight habits, while his nervously- affected body exhibited a slovenliness which showed he had lost all self- respect.\n\n“ Dear Alfred,” ob.scrved Mrs. Keunersley one evening, as she sat lieside her husband’s bed, who by illness had been anvsted a short time in his career ; “ do be persuadeil by me, and make a resolve now, by God’s help, to shake oft\" the thraldom by which you have been held, and let us again commence the struggle of industr}'. We may — indeed we may — be yet ver}' happy.” And as , she so said, she took one of her [ husband’s hands within both of her own. and gazed upon his pallid face, like an angel of mercy bending over a prostrate sinner.\n\nI Kennersley yet retained some of I those fine sensations of humanity ’ which once he had been distin- ' guished for. The appeal made to liis feelings in such a way. and at such a time, was responded to. He returned the pressure, so gently given, and made the heart of Ins kind wife leap up in extasy, ns he replied, “ I will, Emma, I will ; only let me get over this attack, and you shall see how differently I will act.”\n\nHe did get over the attack, and","THE POWER OF A GENTLE SPIRIT.\n\n7\n\nfor almost one whole week acted differently ; but his reformation was like “ the morning cloud and the early dew tlie sun-glare of tempta¬ tion fell upon the slight humidity of his repentance, and it “ passed away.” *****\n\nMidnight had come and passed, and a strong, biting December wind' blew fiercely over the common of Clapham. The fitful blast roared j and howled among the leafless branches of the tri'cs, which here and thciv adorn in summer seasons' that suburban promenade. Now it| seemed to gather up its strength as if to i)erform some fearful work of destruction ; and, roaring like the discharge of a park of artillery', it rushed on with fearful energy from ! the higher to the lower lands. Ken- ! nersley’s dwelling seemed to receive its entire force, and rocked like a cradle beneath the weight of thC| howling storm. 1\n\nWithin that solitary abode sat the | anxious, listening, luxd ever-watchful xvife. Her youngest child lay dozitigi in her lap ; fever had attacked the little : one, and its restlessness demanded and received a fond mother’s ceaseless at- j tention. Her husband was still abstmt j at his usual midnight orgie. One! o’clock struck, still ho came not ; and ^ his gentle-spirited wife continued to wait and listen.\n\n“ Heaven preserve and turn the heart of my dear husband!” issued from her lips, as her eyes were turned with the sulxinissivci mildness of a Madonna’s towards the dwelling- place of the ‘‘blessed and only Po¬ tentate.” j\n\nStill the storm raged without, and I gloominess appeared within. No cheerful fire bbizcd within the grate, for fuel even had become scarce in j that house of sorrow. The hour of | two sounded sadly ujx)n the ears of |\n\nthe trembling watcher. Three o’clock came, and the cpiick car of Airs. Ken- nersly caught the sound of ajxproach- ing steps. She knew they were those of her “ dear Alfred.” Nearer and }'et Jiearer they came ; and a sigh, which seemed to rend the spirit from the body, broke from her. ’fhe un¬ steadiness of the trc'ad proclaimed to her too practised understanding the condition in which her husband had returned. Presently a heavy fall was heard ; and hastily laying her child upon the sofa, she flew and opened the door. Ihit all was dark ; she could discover no living object. Her brain seemed to be on fire, as alie pnjceeded a short distance towards the road, inquiring, “ Alfred, dear Alfred, is that you’r”\n\n‘‘ To be sure ; w ho do you s’po.se it is ?” was the reply, w Inch rose at a short distance from her; and she dis¬ covered the object of her solicitude upon his hands and knees, making a fruitless effort to regain his perpendi¬ cular.\n\n‘‘ O Alfred, Alfred !” cried the weeping wife ; aiid she exerted her feeble power to enable him to accom¬ plish what he aimed at ; “ w hat will be the end of these things P Come,\" she continued, ns he staggered to his feet, ‘‘ lean on my arm ; let me assist you into ( he house. There now,” she added, placing him in an arm chair, ‘‘ rest a little while. Mercy on us !” she cried as the liglit of the caudle fell upon the ghastly countenance of her husband. ‘‘ what d les this mean ?” From a wound in his forehead, which he had received in his fall, the blood flowed in a stream, giving to his face an alarming expression. The indo¬ mitable love of a woman’s ln*art i)OS- sessed Airs. Kennerslcy, ns this sight met her gaze. All but the injury ho had received was at once furgotten. She run eagerly to the kitchen, and","8\n\nTUE MAGIC OF\n\nhaving obtainod Bome water and a sponge, VI ashed away the blood which had alreatly clotted on the lower ])art of his face, and then, by bathing the wound and clearing away the dirt which it had received, soon altered the appearance of her husband's phy¬ siognomy.\n\nWith much dilhculty ^frs. Ken- nersley succeeded in getting her more than half senseless hushand to bed ; where, like an animal of the lowest order, he continued to sleep until after mid-day, and then lie awoke to receive the stunning intelligence that an execution had 'oecn served upon his property, for debts contracted to a considerable amount. The measure of Mrs. Kennersley’s misery now aji- peared to be w(>ll-nigh full. But it was not so. With a spirit so bru¬ talised as her husband’s had become, she was now prepared for almost any act. however degrading.\n\nStung to the quick by his position, he felt no compunction for that which had produced it. Not only was his base tongue let loose in foul and false charge against his innocent wife, but his hand — .spirit of domestic peace defend us ! — his coward hand was raised against her ; and more than once had evidences been borne by her of the cruelty of his changed disposition.\n\nThe home and business which he once possessed were no longer owned by him. An humbler abode was en¬ tered ; and there, without a single whisper of crimination or expres.sion of angry feeling, did the mild .and noble-spirited woman employ her .skill and energy to render home a happy place. It has been remarked Ijy the lip of infallibility, Though the vision tarry, it shall not always tarry ; it shall come, and sliall not tarry.” Long and ardently had Mrs. Xennersley prayed for the recovery\n\nMILDNESS; OR,\n\nof her husband, and her perseverance was crowned with success.\n\nDuring one of those wild ebullitions of passion which freijuently followed a season of inebriety, in which his cruel cowardice was again displayed, his anger was adilitionally roused by the circumstance of his wife’s still maintaining the same equanimity of spirit as had ever characterised her. He became more than ordinarily bois¬ terous ; he gnashed his teeth in hi.s anger, his face became thished, his entire frame became agitated as with spasmodic fury, and lie stood with clenched list ojiposite his unolfending wife, in appearance an incarnate fury : but she quailed not.\n\nA writer of eminence has said, in the poetry of truth —\n\nOh, thero’s a world of meaning; in the eye.\n\nThere is in it a magnetic influence, a species of omnipotent power, the calm, steady gaze of which no animal fero¬ city can endure : it was now expi'- rieneed. riacing one hand gently on hi.s shoulder, and looking her husband full but unupbraidingly in his face, IMr.s. Kennersley kindly and sooth iiigly observed, “ Alfred, dear Alfred, by w hat means have I incurred your displeasure ? Tell me what I have done that I should not have perfonned. or make me acmiainted with what I have omittt'd that I should have at¬ tended to, and I will instantly amend my fault.\"\n\nThe infuriated man stood dumb be¬ fore her — he felt self-convicted. Tears unhidden, and which ho possessed no power to restrain, gushed from his eyes, and rolled like large drops of rain down his pallid cheeks. The scales which had long obscured his mental vision fell off ; and, trembling like a terrified infant, he sank into a chair, and with both his hands covered his face. Tlie vietoiy was achieved ; the Magic Power of Mildness w as de-","THE POWER OF A GENTLE SPIRIT.\n\na\n\nmonstratcd, the influence of a gentle spirit was proved.\n\n“Be composed, Alfred,” said Mr.«. Kennersley, sootbingly, as witli all the fondness of a woman’s heart she hung over him. “ Tell me,” she con¬ tinued, “ by what means can I render you happy r Let me but know it, and, great as the sacrifice may be, I am ready to })rove my devotion to you. Your happiness and my own are in¬ divisible : we must both be happy or miserable.”\n\n“ Can you forgive me, Emma ?” sobbed the now really repentant man. “ Your spirit and conduct have van¬ quished, and won me forever to your¬ self. Had another spirit been dis¬ played, my ruin had been certain. The fascinations which had imi)er- ccptibly thrown their powers around me would then liave been complete. But now I see and feel my error. To you, dear Emma, and the course you have pursued, I owe the marvellous change which I feel is wrought within me. From this hour my study shall be your happiness : for in seeking it I feel assured I most certainly suf.ll\n\nsecure my own.\n\n“ Dear, dear Alfred,” exclaimed Mrs. Kennersley, “ we may, we must now be happy. Never did the full tide of pleasure so possess my heart as at this present moment. Let us think of the past no more, but of the future. Oh, we shall yet be happy !” added the delighted w ife.\n\nThe wise and proper spirit which Mrs. Kennersley had displayed to¬ wards her erring husband, and which became instrumental to his restora¬\n\ntion, was afterwards fully uiaintainttd. No reference, even in the most dis¬ tant ^ B,y, was ever made to it by her ; and Alfred was faithful to his engage¬ ment. From the period referred to, he abandoned the companions who had seduced him from his home and\n\nI\n\ndestroyed his peace and prosperity. With redoublca energy he set about repairing the evil he had done ; and as acts are easily read and inter¬ pret .'d, while
