s dames\nQui là, dans mon carrosse. . .","CYRANO (froidement):\nEt vous d'abord, à moi,\nQui vous présentera ?","LE BRET (stupéfait):\nMais qu'as-tu donc ?","CYRANO:\nTais-toi !","UN HOMME DE LETTRES (avec une écritoire):\nPuis-je avoir des détails sur ?. . .","CYRANO:\nNon.","LE BRET (lui poussant le coude):\nC'est Théophraste,\nRenaudot ! l'inventeur de la gazette.","CYRANO:\nBaste !","LE BRET:\nCette feuille où l'on fait tant de choses tenir !\nOn dit que cette idée a beaucoup d'avenir !","LE POÈTE (s'avançant):\nMonsieur. . .","CYRANO:\nEncor !","LE POÈTE:\nJe veux faire un pentacrostiche\nSur votre nom. . .","QUELQU'UN (s'avançant encore):\nMonsieur. . .","CYRANO:\nAssez !\n(Mouvement. On se range. De Guiche paraît, escorté d'officiers. Cuigy,\nBrissaille, les officiers qui sont partis avec Cyrano à la fin du\npremier acte. Cuigy vient vivement à Cyrano.)","CUIGY (à Cyrano):\nMonsieur de Guiche !\n(Murmure. Tout le monde se range):\nVient de la part du maréchal de Gassion !","DE GUICHE (saluant Cyrano):\n. . .Qui tient à vous mander son admiration\nPour le nouvel exploit dont le bruit vient de courre.","LA FOULE:\nBravo !. . .","CYRANO (s'inclinant):\nLe maréchal s'y connaît en bravoure.","DE GUICHE:\nIl n'aurait jamais cru le fait si ces messieurs\nN'avaient pu lui jurer l'avoir vu.","CUIGY:\nDe nos yeux !","LE BRET (bas à Cyrano, qui a l'air absent):\nMais. . .","CYRANO:\nTais-toi !","LE BRET:\nTu parais souffrir !","CYRANO (tressaillant et se redressant vivement):\nDevant ce monde ?. . .\n(Sa moustache se hérisse; il poitrine):\nMoi souffrir ?. . .Tu vas voir !","DE GUICHE (auquel Cuigy a parlé à l'oreille):\nVotre carière abonde\nDe beaux exploits, déjà.--Vous servez chez ces fous\nDe Gascons, n'est-ce pas ?","CYRANO:\nAux cadets, oui.","UN CADET (d'une voix terrible):\nChez nous !","DE GUICHE (regardant les Gascons, rangés derrière Cyrano):\nAh ! ah !. . .Tous ces messieurs à la mine hautaine,\nCe sont donc les fameux ?. . .","CARBON DE CASTEL-JALOUX:\nCyrano !","CYRANO:\nCapitaine ?","CARBON:\nPuisque ma compagnie est, je crois, au complet,\nVeuillez la présenter au comte, s'il vous plaît.","CYRANO (faisant deux pas vers De Guiche et montrant les cadets):\nCe sont les cadets de Gascogne\nDe Carbon de Castel-Jaloux !\nBretteurs et menteurs sans vergogne,\nCe sont les cadets de Gascogne !\nParlant blason, lambel, bastogne,\nTous plus nobles que des filous,\nCe sont les cadets de Gascogne\nDe Carbon de Castel-Jaloux:\nŒil d'aigle, jambe de cigogne,\nMoustache de chat, dents de loups,\nFendant la canaille qui grogne,\nŒil d'aigle, jambe de cigogne,\nIls vont,--coiffés d'un vieux vigogne\nDont la plume cache les trous !--\nŒil d'aigle, jambe de cigogne,\nMoustache de chat, dents de loups !\nPerce-Bedaine et Casse-Trogne\nSont leurs sobriquets les plus doux;\nDe gloire, leur âme est ivrogne !\nPerce-Bedaine et Casse-Trogne,\nDans tous les endroits où l'on cogne\nIls se donnent des rendez-vous. . .\nPerce-Bedaine et Casse-Trogne\nSont leurs sobriquets les plus doux !\nVoici les cadets de Gascogne\nQui font cocus tous les jaloux !\nO femme, adorable carogne,\nVoici les cadets de Gascogne !\nQue le vieil époux se renfrogne:\nSonnez, clairons ! chantez, coucous !\nVoici les cadets de Gascogne\nQui font cocus tous les jaloux !","DE GUICHE (nonchalamment assis dans un fauteuil que Ragueneau a vite\napporté):\nUn poète est un luxe, aujourd'hui, qu'on se donne.\n--Voulez-vous être à moi ?","CYRANO:\nNon, Monsieur, à personne.","DE GUICHE:\nVotre verve amusa mon oncle Richelieu,\nHier. Je veux vous servir auprès de lui.","LE BRET (ébloui):\nGrand Dieu !","DE GUICHE:\nVous avez bien rimé cinq actes, j'imagine ?","LE BRET (à l'oreille de Cyrano):\nTu vas faire jouer, mon cher, ton Agrippine !","DE GUICHE:\nPortez-les-lui.","CYRANO (tenté et un peu charmé):\nVraiment. . .","DE GUICHE:\nIl est des plus experts.\nIl vous corrigera seulement quelques vers. . .","CYRANO (dont le visage s'est immédiatement rembruni):\nImpossible, Monsieur; mon sang se coagule\nEn pensant qu'on y peut changer une virgule.","DE GUICHE:\nMais quand un vers lui plaît, en revanche, mon cher,\nIl le paye très cher.","CYRANO:\nIl le paye moins cher\nQue moi, lorsque j'ai fait un vers, et que je l'aime,\nJe me le paye, en me le chantant à moi-même !","DE GUICHE:\nVous êtes fier.","CYRANO:\nVraiment, vous l'avez remarqué ?","UN CADET (entrant avec, enfilés à son épée, des chapeaux aux plumets\nmiteux, aux coiffes trouées, défoncées):\nRegarde, Cyrano ! ce matin, sur le quai\nLe bizarre gibier à plumes que nous prîmes !\nLes feutres des fuyards !. . .","CARBON:\nDes dépouilles opimes !","TOUT LE MONDE (riant):\nAh ! Ah ! Ah !","CUIGY:\nCelui qui posta ces gueux, ma foi,\nDoit rager aujourd'hui.","BRISSAILLE:\nSait-on qui c'est ?","DE GUICHE:\nC'est moi.\n(Les rires s'arrêtent):\nJe les avais chargés de châtier,--besogne\nQu'on ne fait pas soi-même,--un rimailleur ivrogne.\n(Silence gêné.)","LE CADET (à mi-voix, à Cyrano, lui montrant les feutres):\nQue faut-il qu'on en fasse ? Ils sont gras. . .Un salmis ?","CYRANO (prenant l'épée où ils sont enfilés, et les faisant, dans un\nsalut, tous glisser aux pieds de De Guiche):\nMonsieur, si vous voulez les rendre à vos amis ?","DE GUICHE (se levant et d'une voix brève):\nMa chaise et mes porteurs, tout de suite: je monte.\n(A Cyrano, violemment):\nVous, Monsieur !. . .","UNE VOIX (dans la rue, criant):\nLes porteurs de monseigneur le comte\nDe Guiche !","DE GUICHE (qui s'est dominé, avec un sourire):\n. . .Avez-vous lu Don Quichot ?","CYRANO:\nJe l'ai lu.\nEt me découvre au nom de cet hurluberlu.","DE GUICHE:\nVeuillez donc méditer alors. . .","UN PORTEUR (paraissant au fond):\nVoici la chaise.","DE GUICHE:\nSur le chapitre des moulins !","CYRANO (saluant):\nChapitre treize.","DE GUICHE:\nCar, lorsqu'on les attaque, il arrive souvent. . .","CYRANO:\nJ'attaque donc des gens qui tournent à tout vent ?","DE GUICHE:\nQu'un moulinet de leurs grands bras chargés de toiles\nVous lance dans la boue !. . .","CYRANO:\nOu bien dans les étoiles !\n(De Guiche sort. On le voit remonter en chaise. Les seigneurs\ns'éloignent en chuchotant. Le Bret les réaccompagne. La foule sort.)","Scène 2.VIII.","Cyrano, Le Bret, les cadets, qui se sont attablés à droite et à gauche\net auxquels on sert à boire et à manger.","CYRANO (saluant d'un air goguenard ceux qui sortent sans oser le saluer):\nMessieurs. . .Messieurs. . .Messieurs. . .","LE BRET (désolé, redescendant, les bras au ciel):\nAh ! dans quels jolis draps.","CYRANO:\nOh ! toi ! tu vas grogner !","LE BRET:\nEnfin, tu conviendras\nQu'assassiner toujours la chance passagère,\nDevient exagéré.","CYRANO:\nHé bien oui, j'exagère !","LE BRET (triomphant):\nAh !","CYRANO:\nMais pour le principe, et pour l'exemple aussi,\nJe trouve qu'il est bon d'exagérer ainsi.","LE BRET:\nSi tu laissais un peu ton âme mousquetaire,\nLa fortune et la gloire. . .","CYRANO:\nEt que faudrait-il faire ?\nChercher un protecteur puissant, prendre un patron,\nEt comme un lierre obscur qui circonvient un tronc\nEt s'en fait un tuteur en lui léchant l'écorce,\nGrimper par ruse au lieu de s'élever par force ?\nNon, merci. Dédier, comme tous il le font,\nDes vers aux financiers ? se changer en bouffon\nDans l'espoir vil de voir, aux lèvres d'un ministre,\nNaître un sourire, enfin, qui ne soit pas sinistre ?\nNon, merci. Déjeuner, chaque jour, d'un crapaud ?\nAvoir un ventre usé par la marche ? une peau\nQui plus vite, à l'endroit des genoux, devient sale ?\nExécuter des tours de souplesse dorsale ?. . .\nNon, merci. D'une main flatter la chèvre au cou\nCependant que, de l'autre, on arrose le chou,\nEt, donneur de séné par désir de rhubarbe,\nAvoir son encensoir, toujours, dans quelque barbe ?\nNon, merci ! Se pousser de giron en giron,\nDevenir un petit grand homme dans un rond,\nEt naviguer, avec des madrigaux pour rames,\nEt dans ses voiles des soupirs de vieilles dames ?\nNon, merci ! Chez le bon éditeur de Sercy\nFaire éditer ses vers en payant ? Non, merci !\nS'aller faire nommer pape par les conciles\nQue dans des cabarets tiennent des imbéciles ?\nNon, merci ! Travailler à se construire un nom\nSur un sonnet, au lieu d'en faire d'autres ? Non,\nMerci ! Ne découvrir du talent qu'aux mazettes ?\nÊtre terrorisé par de vagues gazettes,\nEt se dire sans cesse: \"Oh, pourvu que je sois\nDans les petits papiers du Mercure François ?\". . .\nNon, merci ! Calculer, avoir peur, être blême,\nAimer mieux faire une visite qu'un poème,\nRédiger des placets, se faire présenter ?\nNon, merci ! non, merci ! non, merci ! Mais. . .chanter,\nRêver, rire, passer, être seul, être libre,\nAvoir l'œil qui regarde bien, la voix qui vibre,\nMettre, quand il vous plaît, son feutre de travers,\nPour un oui, pour un non, se battre,--ou faire un vers !\nTravailler sans souci de gloire ou de fortune,\nA tel voyage, auquel on pense, dans la lune !\nN'écrire jamais rien qui de soi ne sortît,\nEt modeste d'ailleurs, se dire: mon petit,\nSoit satisfait des fleurs, des fruits, même des feuilles,\nSi c'est dans ton jardin à toi que tu les cueilles !\nPuis, s'il advient d'un peu triompher, par hasard,\nNe pas être obligé d'en rien rendre à César,\nVis-à-vis de soi-même en garder le mérite,\nBref, dédaignant d'être le lierre parasite,\nLors même qu'on n'est pas le chêne ou le tilleul,\nNe pas monter bien haut, peut-être, mais tout seul !","LE BRET:\nTout seul, soit ! Mais non pas contre tous ! Comment diable\nAs-tu donc contracté la manie effroyable\nDe te faire toujours, partout, des ennemis ?","CYRANO:\nA force de vous voir vous faire des amis,\nEt rire à ces amis dont vous avez des foules,\nD'une bouche empruntée au derrière des poules !\nJ'aime raréfier sur mes pas les saluts,\nEt m'écrie avec joie: un ennemi de plus !","LE BRET:\nQuelle aberration !","CYRANO:\nEh bien, oui, c'est mon vice.\nDéplaire est mon plaisir. J'aime qu'on me haïsse.\nMon cher, si tu savais comme l'on marche mieux\nSous la pistolétade excitante des yeux !\nComme, sur les pourpoints, font d'amusantes taches\nLe fiel des envieux et la bave des lâches !\n--Vous, la molle amitié dont vous vous entourez,\nRessemble à ces grands cols d'Italie, ajourés\nEt flottants, dans lesquels votre cou s'effémine:\nOn y est plus à l'aise. . .et de moins haute mine,\nCar le front n'ayant pas de maintien ni de loi,\nS'abandonne à pencher dans tous les sens. Mais moi,\nLa Haine, chaque jour, me tuyaute et m'apprête\nLa fraise dont l'empois force à lever la tête;\nChaque ennemi de plus est un nouveau godron\nQui m'ajoute une gêne, et m'ajoute un rayon:\nCar, pareille en tous points à la fraise espagnole,\nLa Haine est un carcan, mais c'est une auréole !","LE BRET (après un silence, passant son bras sous le sien):\nFais tout haut l'orgueilleux et l'amer, mais, tout bas\nDis-moi tout simplement qu'elle ne t'aime pas !","CYRANO (vivement):\nTais-toi !\n(Depuis un moment, Christian est entré, s'est mêlé aux cadets; ceux-ci\nne lui adressent pas la parole; il a fini par s'asseoir seul à une\npetite table, où Lise le sert.)","Scène 2.IX.","Cyrano, Le Bret, les cadets, Christian de Neuvillette.","UN CADET (assis à une table du fond, le verre en main):\nHé ! Cyrano !\n(Cyrano se retourne):\nLe récit ?","CYRANO:\nTout à l'heure !\n(Il remonte au bras de Le Bret. Ils causent bas.)","LE CADET (se levant, et descendant):\nLe récit du combat ! Ce sera la meilleure\nLeçon\n(Il s'arrête devant la table où est Christian):\npour ce timide apprentif !","CHRISTIAN (levant la tête):\nApprentif ?","UN AUTRE CADET:\nOui, septentrional maladif !","CHRISTIAN:\nMaladif ?","PREMIER CADET (goguenard):\nMonsieur de Neuvillette, apprenez quelque chose:\nC'est qu'il est un objet, chez nous, dont on ne cause\nPas plus que de cordon dans l'hôtel d'un pendu !","CHRISTIAN:\nQu'est-ce ?","UN AUTRE CADET (d'une voix terrible):\nRegardez-moi !\n(Il pose trois fois, mystérieusement, son doigt sur son nez):\nM'avez-vous entendu ?","CHRISTIAN:\nAh ! c'est le. . .","UN AUTRE:\nChut !. . .jamais ce mot ne se profère !\n(Il montre Cyrano qui cause au fond avec Le Bret.)\nOu c'est à lui, là-bas, que l'on aurait affaire !","UN AUTRE (qui, pendant qu'il était tourné vers les premiers, est venu\nsans bruit s'asseoir sur la table, dans son dos):\nDeux nasillards par lui furent exterminés\nParce qu'il lui déplut qu'ils parlassent du nez !","UN AUTRE (d'une voix caverneuse,--surgissant de sous la table où il\ns'est glissé à quatre pattes):\nOn ne peut faire, sans défuncter avant l'âge,\nLa moindre allusion au fatal cartilage !","UN AUTRE (lui posant la main sur l'épaule):\nUn mot suffit ! Que dis-je, un mot ? Un geste, un seul !\nEt tirer son mouchoir, c'est tirer son linceul !\n(Silence. Tous autour de lui, les bras croisés, le regardent. Il se\nlève et va à Carbon de Castel-Jaloux qui, causant avec un officier, a\nl'air de ne rien voir.)","CHRISTIAN:\nCapitaine !","CARBON (se retournant et le toisant):\nMonsieur ?","CHRISTIAN:\nQue fait-on quand on trouve\nDes Méridionaux trop vantards ?. . .","CARBON:\nOn leur prouve\nQu'on peut être du Nord, et courageux.\n(Il lui tourne le dos.)","CHRISTIAN:\nMerci.","PREMIER CADET (à Cyrano):\nMaintenant, ton récit !","TOUS:\nSon récit !","CYRANO (redescendant vers eux):\nMon récit ?. . .\n(Tous rapprochent leurs escabeaux, se groupent autour de lui, tendent\nle col. Christian s'est mis à cheval sur une chaise):\nEh bien ! donc je marchais tout seul, à leur rencontre.\nLa lune, dans le ciel, luisait comme une montre,\nQuand soudain, je ne sais quel soigneux horloger\nS'étant mis à passer un coton nuager\nSur le boîtier d'argent de cette montre ronde,\nIl se fit une nuit la plus noire du monde,\nEt les quais n'étant pas du tout illuminés,\nMordious ! on n'y voyait pas plus loin. . .","CHRISTIAN:\nQue son nez.\n(Silence. Tous le monde se lève lentement. On regarde Cyrano avec\nterreur. Celui-ci s'est interrompu, stupéfait. Attente.)","CYRANO:\nQu'est-ce que c'est que cet homme-là ?","UN CADET (à mi-voix):\nC'est un homme\nArrivé ce matin.","CYRANO (faisant un pas vers Christian):\nCe matin ?","CARBON (à mi-voix):\nIl se nomme\nLe baron de Neuvil. . .","CYRANO (vivement, s'arrêtant):\nAh ! C'est bien. . .\n(Il pâlit, rougit, a encore un mouvement pour se jeter sur Christian):\nJe. . .\n(Puis, il se domine, et dit d'une voix sourde):\nTrès bien. . .\n(Il reprend):\nJe disais donc. . .\n(Avec un éclat de rage dans la voix):\nMordious !. . .\n(Il continue d'un ton naturel):\nque l'on n'y voyait rien.\n(Stupeur. On se rassied en se regardant):\nEt je marchais, songeant que pour un gueux fort mince\nJ'allais mécontenter quelque grand, quelque prince,\nQui m'aurait sûrement. . .","CHRISTIAN:\nDans le nez !. . .\n(Tout le monde se lève. Christian se balance sur sa chaise.)","CYRANO (d'une voix étranglée):\nUne dent,--\nQui m'aurait une dent. . .et qu'en somme, imprudent,\nJ'allais fourrer. . .","CHRISTIAN:\nLe nez. . .","CYRANO:\nLe doigt. . .entre l'écorce\nEt l'arbre, car ce grand pouvait être de force\nÀ me faire donner. . .'","CHRISTIAN:\nSur le nez. . .","CYRANO (essuyant la sueur à son front):\nSur les doigts.\n--Mais j'ajoutai: Marche, Gascon, fais ce que dois !\nVa, Cyrano ! Et ce disant, je me hasarde,\nQuand, dans l'ombre, quelqu'un me porte. . .","CHRISTIAN:\nUne nasarde.","CYRANO:\nJe la pare, et soudain me trouve. . .","CHRISTIAN:\nNez à nez. . .","CYRANO (bondissant vers lui):\nVentre-Saint-Gris !\n(Tous les Gascons se précipitent pour voir, arrivé sur Christian,\nil se maîtrise et continue):\navec cent braillards avinés\nQui puaient. . .","CHRISTIAN:\nÀ plein nez. . .","CYRANO (blême et souriant):\nL'oignon et la litharge !\nJe bondis, front baissé. . .","CHRISTIAN:\nNez au vent !","CYRANO:\net je charge !\nJ'en estomaque deux ! J'en empale un tout vif !\nQuelqu'un m'ajuste: Paf ! et je riposte. . .","CHRISTIAN:\nPif !","CYRANO (éclatant):\nTonnerre ! Sortez tous !\n(Tous les cadets se précipitent vers les portes.)","PREMIER CADET:\nC'est le réveil du tigre !","CYRANO:\nTous ! Et laissez-moi seul avec cet homme !","DEUXIÈME CADET:\nBigre !\nOn va le retrouver en hachis !","RAGUENEAU:\nEn hachis ?","UN AUTRE CADET:\nDans un de vos pâtés !","RAGUENEAU:\nJe sens que je blanchis,\nEt que je m'amollis comme une serviette !","CARBON:\nSortons !","UN AUTRE:\nIl n'en va pas laisser une miette !","UN AUTRE:\nCe qui va se passer ici, j'en meurs d'effroi !","UN AUTRE (refermant la porte de droite):\nQuelque chose d'épouvantable !\n(Ils sont tous sortis,--soit par le fond, soit par les\ncôtés,--quelques-uns ont disparu par l'escalier. Cyrano et Christian\nrestent face à face, et se regardent un moment.)","Scène 2.X.","Cyrano, Christian.","CYRANO:\nEmbrasse-moi !","CHRISTIAN:\nMonsieur. . .","CYRANO:\nBrave.","CHRISTIAN:\nAh ça ! mais !. . .","CYRANO:\nTrès brave. Je préfère.","CHRISTIAN:\nMe direz-vous ?. . .","CYRANO:\nEmbrasse-moi. Je suis son frère.","CHRISTIAN:\nDe qui ?","CYRANO:\nMais d'elle !","CHRISTIAN:\nHein ?. . .","CYRANO:\nMais de Roxane !","CHRISTIAN (courant à lui):\nCiel !\nVous, son frère ?","CYRANO:\nOu tout comme: un cousin fraternel.","CHRISTIAN:\nElle vous a ?. . .","CYRANO:\nTout dit !","CHRISTIAN:\nM'aime-t-elle ?","CYRANO:\nPeut-être !","CHRISTIAN (lui prenant les mains):\nComme je suis heureux, Monsieur, de vous connaître !","CYRANO:\nVoilà ce qui s'appelle un sentiment soudain.","CHRISTIAN:\nPardonnez-moi. . .","CYRANO (le regardant, et lui mettant la main sur l'épaule):\nC'est vrai qu'il est beau, le gredin !","CHRISTIAN:\nSi vous saviez, Monsieur, comme je vous admire !","CYRANO:\nMais tous ces nez que vous m'avez. . .","CHRISTIAN:\nJe les retire !","CYRANO:\nRoxane attend ce soir une lettre. . .","CHRISTIAN:\nHélas !","CYRANO:\nQuoi ?","CHRISTIAN:\nC'est me perdre que de cesser de rester coi !","CYRANO:\nComment ?","CHRISTIAN:\nLas ! je suis sot à m'en tuer de honte !","CYRANO:\nMais non, tu ne l'es pas, puisque tu t'en rends compte.\nD'ailleurs, tu ne m'as pas attaqué comme un sot.","CHRISTIAN:\nBah ! on trouve des mots quand on monte à l'assaut !\nOui, j'ai certain esprit facile et militaire,\nMais je ne sais, devant les femmes, que me taire.\nOh ! leurs yeux, quand je passe, ont pour moi des bontés. . .","CYRANO:\nLeurs cœurs n'en ont-ils plus quand vous vous arrêtez ?","CHRISTIAN:\nNon ! car je suis de ceux,--je le sais. . .et je tremble !--\nQui ne savent parler d'amour.","CYRANO:\nTiens !. . .Il me semble\nQue si l'on eût pris soin de me mieux modeler,\nJ'aurais été de ceux qui savent en parler.","CHRISTIAN:\nOh ! pouvoir exprimer les choses avec grâce !","CYRANO:\nÊtre un joli petit mousquetaire qui passe !","CHRISTIAN:\nRoxane est précieuse et sûrement je vais\nDésillusionner Roxane !","CYRANO (regardant Christian):\nSi j'avais\nPour exprime mon âme un pareil interprète !","CHRISTIAN (avec désespoir):\nIl me faudrait de l'éloquence !","CYRANO (brusquement):\nJe t'en prête !\nToi, du charme physique et vainqueur, prête-m'en:\nEt faisons à nous deux un héros de roman !","CHRISTIAN:\nQuoi ?","CYRANO:\nTe sens-tu de force à répéter les choses\nQue chaque jour je t'apprendrai ?. . .","CHRISTIAN:\nTu me proposes ?. . .","CYRANO:\nRoxane n'aura pas de désillusions !\nDis, veux-tu qu'à nous deux nous la séduisions ?\nVeux-tu sentir passer, de mon pourpoint de buffle\nDans ton pourpoint brodé, l'âme que je t'insuffle !. . .","CHRISTIAN:\nMais, Cyrano !. . .","CYRANO:\nChristian, veux-tu ?","CHRISTIAN:\nTu me fais peur !","CYRANO:\nPuisque tu crains, tout seul, de refroidir son cœur,\nVeux-tu que nous fassions--et bientôt tu l'embrases !--\nCollaborer un peu tes lèvres et mes phrases ?. . .","CHRISTIAN:\nTes yeux brillent !. . .","CYRANO:\nVeux-tu ?","CHRISTIAN:\nQuoi ! cela te ferait\nTant de plaisir ?. . .","CYRANO (avec enivrement):\nCela. . .\n(Se reprenant, et en artiste):\nCela m'amuserait !\nC'est une expérience à tenter un poète.\nVeux-tu me compléter et que je te complète ?\nTu marcheras, j'irai dans l'ombre à ton côté:\nJe serai ton esprit, tu seras ma beauté.","CHRISTIAN:\nMais la lettre qu'il faut, au plus tôt, lui remettre !\nJe ne pourrai jamais. . .","CYRANO (sortant de son pourpoint la lettre qu'il a écrite):\nTiens, la voilà, ta lettre !","CHRISTIAN:\nComment ?","CYRANO:\nHormis l'adresse, il n'y manque plus rien.","CHRISTIAN:\nJe. . .","CYRANO:\nTu peux l'envoyer. Sois tranquille. Elle est bien.","CHRISTIAN:\nVous aviez ?. . .","CYRANO:\nNous avons toujours, nous, dans nos poches,\nDes épîtres à des Chloris. . .de nos caboches,\nCar nous sommes ceux-là qui pour amante n'ont\nQue du rêve soufflé dans la bulle d'un nom !. . .\nPrends, et tu changeras en vérités ces feintes;\nJe lançais au hasard ces aveux et ces plaintes:\nTu verras se poser tous ces oiseaux errants.\nTu verras que je fus dans cette lettre--prends !--\nD'autant plus éloquent que j'étais moins sincère !\n--Prends donc, et finissons !","CHRISTIAN:\nN'est-il pas nécessaire\nDe changer quelques mots ? Écrite en divaguant,\nIra-t-elle à Roxane ?","CYRANO:\nElle ira comme un gant !","CHRISTIAN:\nMais. . .","CYRANO:\nLa crédulité de l'amour-propre est telle,\nQue Roxane croira que c'est écrit pour elle !","CHRISTIAN:\nAh ! mon ami !\n(Il se jette dans les bras de Cyrano. Ils restent embrassés.)","Scène 2.XI.","Cyrano, Christian, les Gascons, le mousquetaire, Lise.","UN CADET (entr'ouvrant la porte):\nPlus rien. . .Un silence de mort. . .\nJe n'ose regarder. . .\n(Il passe la tête):\nHein ?","TOUS LES CADETS (entrant et voyant Cyrano et Christian qui s'embrassent):\nAh !. . .Oh !. . .","UN CADET:\nC'est trop fort !\n(Consternation.)","LE MOUSQUETAIRE (goguenard):\nOuais ?. . .","CARBON:\nNotre démon est doux comme un apôtre !\nQuand sur une narine on le frappe,--il tend l'autre !","LE MOUSQUETAIRE:\nOn peut donc lui parler de son nez, maintenant ?. . .\n(Appelant Lise, d'un air triomphant):\n--Eh ! Lise ! Tu vas voir !\n(Humant l'air avec affectation):\nOh !. . .oh !. . .c'est surprenant !\nQuelle odeur !. . .\n(Allant à Cyrano, dont il regarde le nez avec impertinence):\nMais monsieur doit l'avoir reniflée ?\nQu'est-ce que cela sent ici ?. . .","CYRANO (le souffletant):\nLa giroflée !\n(Joie. Les cadets ont retrouvé Cyrano: ils font des culbutes.)","Rideau."]},{"name":"Acte III","paragraphs":["Le Baiser de Roxane.","Une petite place dans l'ancien Marais. Vieille maisons. Perspectives\nde ruelles. À droite, la maison de Roxane et le mur de son jardin que\ndébordent de larges feuillages. Au-dessus de la porte, fenêtre et\nbalcon. Un banc devant le seuil.","Du lierre grimpe au mur, du jasmin enguirlande le balcon, frissonne et\nretombe.","Par le banc et les pierres en saillie du mur, on peut facilement grimper\nau balcon.","En face, une ancienne maison de même style, brique et pierre, avec une\nporte d'entrée. Le heurtoir de cette porte est emmailloté de linge comme\nun pouce malade.","Au lever du rideau, la duègne est assise sur le banc. La fenêtre est\ngrande ouverte sur le balcon de Roxane.","Près de la duègne se tient debout Ragueneau, vêtu d'une sorte de livrée:\nil termine un récit, en s'essuyant les yeux.","Scène 3.I.","Ragueneau, la duègne, puis Roxane, Cyrano, et deux pages.","RAGUENEAU:\n. . .Et puis, elle est partie avec un mousquetaire !\nSeul, ruiné, je me pends. J'avais quitté la terre.\nMonsieur de Bergerac entre, et, me dépendant,\nMe vient à sa cousine offrir comme intendant.","LA DUÈGNE:\nMais comment expliquer cette ruine où vous êtes ?","RAGUENEAU:\nLise aimait les guerriers, et j'aimais les poètes !\nMars mangeait les gâteaux qui laissait Apollon:\n--Alors, vous comprenez, cela ne fut pas long !","LA DUÈGNE (se levant et appelant vers la fenêtre ouverte):\nRoxane, êtes-vous prête ?. . .On nous attend !","LA VOIX DE ROXANE (par la fenêtre):\nJe passe\nUne mante !","LA DUÈGNE (à Ragueneau, lui montrant la porte d'en face):\nC'est là qu'on nous attend, en face.\nChez Clomire. Elle tient bureau, dans son réduit.\nOn y lit un discours sur le Tendre, aujourd'hui.","RAGUENEAU:\nSur le Tendre ?","LA DUÈGNE (minaudant):\nMais oui !. . .\n(Criant vers la fenêtre):\nRoxane, il faut descendre,\nOu nous allons manquer le discours sur le Tendre !","LA VOIX DE ROXANE:\nJe viens !\n(On entend un bruit d'instruments à cordes qui se rapproche.)","LA VOIX DE CYRANO (chantant dans la coulisse):\nLa ! la ! la ! la !","LA DUÈGNE (surprise):\nOn nous joue un morceau ?","CYRANO (suivi de deux pages porteurs de théorbes):\nJe vous dis que la croche est triple, triple sot !","PREMIER PAGE (ironique):\nVous savez donc, Monsieur, si les croches sont triples ?","CYRANO:\nJe suis musicien, comme tous les disciples\nDe Gassendi !","LE PAGE (jouant et chantant):\nLa ! la !","CYRANO (lui arrachant le théorbe et continuant la phrase musicale):\nJe peux continuer !. . .\nLa ! la ! la ! la !","ROXANE (paraissant sur le balcon):\nC'est vous ?","CYRANO (chantant sur l'air qu'il continue):\nMoi qui viens saluer\nVos lys, et présenter mes respects à vos ro. . .ses !","ROXANE:\nJe descends !\n(Elle quitte le balcon.)","LA DUÈGNE (montrant les pages):\nQu'est-ce donc que ces deux virtuoses ?","CYRANO:\nC'est un pari que j'ai gagné sur d'Assoucy.\nNous discutions un point de grammaire.--Non !--Si !--\nQuand soudain me montrant ces deux grands escogriffes\nHabiles à gratter les cordes de leurs griffes,\nEt dont il fait toujours son escorte, il me dit:\n\"Je te parie un jour de musique !\" Il perdit.\nJusqu'à ce que Phœbus recommence son orbe,\nJ'ai donc sur mes talons ces joueurs de théorbe,\nDe tout ce que je fais harmonieux témoins !. . .\nCe fut d'abord charmant, et ce l'est déjà moins.\n(Aux musiciens):\nHep !. . .Allez de ma part jouer une pavane\nA Montfleury !. . .\n(Les pages remontent pour sortir.--A la duègne):\nJe viens demander à Roxane\nAinsi que chaque soir. . .\n(Aux pages qui sortent):\nJouez longtemps,--et faux !\n(A la duègne):\n. . .Si l'ami de son âme est toujours sans défauts ?","ROXANE (sortant de la maison):\nAh ! qu'il est beau, qu'il a d'esprit, et que je l'aime !","CYRANO (souriant):\nChristian a tant d'esprit ?. . .","ROXANE:\nMon cher, plus que vous-même !","CYRANO:\nJ'y consens.","ROXANE:\nIl ne peut exister à mon goût\nPlus fin diseur de ces jolis riens qui sont tout.\nParfois il est distrait, ses Muses sont absentes;\nPuis, tout à coup, il dit des choses ravissantes !","CYRANO (incrédule):\nNon ?","ROXANE:\nC'est trop fort ! Voilà comme les hommes sont:\nIl n'aura pas d'esprit puisqu'il est beau garçon !","CYRANO:\nIl sait parler du cœur d'une façon experte ?","ROXANE:\nMais il n'en parle pas, Monsieur, il en disserte !","CYRANO:\nIl écrit ?","ROXANE:\nMieux encor ! Écoutez donc un peu:\n(Déclamant):\nPlus tu me prends de cœur, plus j'en ai !. . .\n(Triomphante, à Cyrano):\nHé ! bien ?","CYRANO:\nPeuh !. . .","ROXANE:\nEt ceci: Pour souffrir, puisqu'il m'en faut un autre,\nSi vous gardez mon cœur, envoyez-moi le vôtre !","CYRANO:\nTantôt il en a trop et tantôt pas assez.\nQu'est-ce au juste qu'il veut, de cœur ?. . .","ROXANE (frappant du pied):\nVous m'agacez !\nC'est la jalousie. . .","CYRANO (tressaillant):\nHein !. . .","ROXANE:\n. . .d'auteur qui vous dévore !\n--Et ceci, n'est-il pas du dernier tendre encore ?\nCroyez que devers vous mon cœur ne fait qu'un cri,\nEt que si les baisers s'envoyaient par écrit,\nMadame, vous liriez ma lettre avec les lèvres !. . .","CYRANO (souriant malgré lui de satisfaction):\nHa ! ha ! ces lignes-là sont. . .hé ! hé !\n(Se reprenant et avec dédain):\nmais bien mièvres !","ROXANE:\nEt ceci. . .","CYRANO (ravi):\nVous savez donc ses lettres par cœur ?","ROXANE:\nToutes !","CYRANO (frisant sa moustache):\nIl n'y a pas à dire: c'est flatteur !","ROXANE:\nC'est un maître !","CYRANO (modeste):\nOh !. . .un maître !. . .","ROXANE (péremptoire):\nUn maître !. . .","CYRANO (saluant):\nSoit !. . .un maître !","LA DUÈGNE (qui était remontée, redescendant vivement):\nMonsieur de Guiche !\n(A Cyrano, le poussant vers la maison):\nEntrez !. . .car il vaut mieux, peut-être,\nQu'il ne vous trouve pas ici; cela pourrait\nLe mettre sur la piste. . .","ROXANE (à Cyrano):\nOui, de mon cher secret !\nIl m'aime, il est puissant, il ne faut pas qu'il sache !\nIl peut dans mes amours donner un coup de hache !","CYRANO (entrant dans la maison):\nBien ! bien ! bien !\n(De Guiche paraît.)","Scène 3.II.","Roxane, De Guiche, la duègne, à l'écart.","ROXANE (à De Guiche, lui faisant une révérence):\nJe sortais.","DE GUICHE:\nJe viens prendre congé.","ROXANE:\nVous partez ?","DE GUICHE:\nPour la guerre.","ROXANE:\nAh !","DE GUICHE:\nCe soir même.","ROXANE:\nAh !","DE GUICHE:\nJ'ai\nDes ordres. On assiège Arras.","ROXANE:\nAh. . .on assiège ?. . .","DE GUICHE:\nOui. . .Mon départ a l'air de vous laisser de neige.","ROXANE (poliment):\nOh !. . .","DE GUICHE:\nMoi, je suis navré. Vous reverrai-je ?. . .Quand ?\n--Vous savez que je suis nommé mestre de camp ?","ROXANE (indifférente):\nBravo.","DE GUICHE:\nDu régiment des gardes.","ROXANE (saisie):\nAh ? des gardes ?","DE GUICHE:\nOù sert votre cousin, l'homme aux phrases vantardes.\nJe saurai me venger de lui, là-bas.","ROXANE (suffoquée):\nComment !\nLes gardes vont là-bas ?","DE GUICHE (riant):\nTiens ! c'est mon régiment !","ROXANE (tombant assise sur le banc,--à part):\nChristian !","DE GUICHE:\nQu'avez-vous ?","ROXANE (toute émue):\nCe. . .départ. . .me désespère !\nQuand on tient à quelqu'un, le savoir à la guerre !","DE GUICHE (surpris et charmé):\nPour la première fois me dire un mot si doux,\nLe jour de mon départ !","ROXANE (changeant de ton et s'éventant):\nAlors,--vous allez vous\nVenger de mon cousin ?. . .","DE GUICHE (souriant):\nOn est pour lui ?","ROXANE:\nNon,--contre !","DE GUICHE:\nVous le voyez ?","ROXANE:\nTrès peu.","DE GUICHE:\nPartout on le rencontre\nAvec un des cadets. . .\n(Il cherche le nom):\nce Neu. . .villen. . .viller. . .","ROXANE:\nUn grand ?","DE GUICHE:\nBlond.","ROXANE:\nRoux.","DE GUICHE:\nBeau !. . .","ROXANE:\nPeuh !","DE GUICHE:\nMais bête.","ROXANE:\nIl en a l'air !\n(Changeant de tone):\n. . .Votre vengeance envers Cyrano ?--c'est peut-être\nDe l'exposer au feu, qu'il adore ?. . .Elle est piètre !\nJe sais bien, moi, ce qui lui serait sanglant !","DE GUICHE:\nC'est ?. . .","ROXANE:\nMais, si le régiment, en partant, le laissait\nAvec ses chers cadets, pendant toute la guerre,\nA Paris, bras croisés !. . .C'est la seule manière,\nUn homme comme lui, de le faire enrager:\nVous voulez le punir ? privez-le de danger.","DE GUICHE:\nUne femme ! une femme ! il n'y a qu'une femme\nPour inventer ce tour !","ROXANE:\nIl se rongera l'âme,\nEt ses amis les poings, de n'être pas au feu:\nEt vous serez vengé !","DE GUICHE (se rapprochant):\nVous m'aimez donc un peu ?\n(Elle sourit):\nJe veux voir dans ce fait d'épouser ma rancune\nUne preuve d'amour, Roxane !. . .","ROXANE:\nC'en est une.","DE GUICHE (montrant plusieurs plis cachetés):\nJ'ai les ordres sur moi qui vont être transmis\nA chaque compagnie, a l'instant même, hormis. . .\n(Il en détache un):\nCelui-ci ! C'est celui des cadets.\n(Il le met dans sa poche):\nJe le garde.\n(Riant):\nAh ! ah ! ah ! Cyrano !. . .Son humeur bataillarde !. . .\n--Vous jouez donc des tours aux gens, vous ?. . .","ROXANE (le regardant):\nQuelquefois.","DE GUICHE (tout près d'elle):\nVous m'affolez ! Ce soir--écoutez--oui, je dois\nÊtre parti. Mais fuir quand je vous sens émue !. . .\nÉcoutez. Il y a, près d'ici, dans la rue\nD'Orléans, un couvent fondé par le syndic\nDes capucins, le Père Athanase. Un laïc\nN'y peut entrer. Mais les bons Pères, je m'en charge !. . .\nIl peuvent me cacher dans leur manche: elle est large.\n--Ce sont les capucins qui servent Richelieu\nChez lui; redoutant l'oncle, ils craignent le neveu.\n--On me croira parti. Je viendrai sous le masque.\nLaissez-moi retarder d'un jour, chère fantasque !. . .","ROXANE (vivement):\nMais si cela s'apprend, votre gloire. . .","DE GUICHE:\nBah !","ROXANE:\nMais\nLe siège, Arras. . .","DE GUICHE:\nTant pis ! Permettez !","ROXANE:\nNon !","DE GUICHE:\nPermets !","ROXANE (tendrement):\nJe dois vous le défendre !","DE GUICHE:\nAh !","ROXANE:\nPartez !\n(A part):\nChristian reste.\n(Haut):\nJe vous veux héroïque,--Antoine !","DE GUICHE:\nMot céleste !\nVous aimez donc celui ?. . .","ROXANE:\nPour lequel j'ai frémi.","DE GUICHE (transporté de joie):\nAh ! je pars !\n(Il lui baise la main):\nÊtes-vous contente ?","ROXANE:\nOui, mon ami !\n(Il sort.)","LA DUÈGNE (lui faisant dans le dos une révérence comique):\nOui, mon ami !","ROXANE (à la duègne):\nTaisons ce que je viens de faire:\nCyrano m'en voudrait de lui voler sa guerre !\n(Elle appelle vers la maison):\nCousin !","Scène 3.III.","Roxane, la duègne, Cyrano.","ROXANE:\nNous allons chez Clomire.\n(Elle désigne la porte d'en face):\nAlcandre y doit\nParler, et Lysimon !","LA DUÈGNE (mettant son petit doigt dans son oreille):\nOui ! mais mon petit doigt\nDit qu'on va les manquer !","CYRANO (à Roxane):\nNe manquez pas ces singes.\n(Ils sont arrivés devant la porte de Clomire.)","LA DUÈGNE (avec ravissement):\nOh, voyez ! le heurtoir est entouré de linges !. . .\n(Au heurtoir):\nOn vous a baillonné pour que votre métal\nNe troublât pas les beaux discours,--petit brutal !\n(Elle le soulève avec des soins infinis et frappe doucement.)","ROXANE (voyant qu'on ouvre):\nEntrons !. . .\n(Du seuil, à Cyrano):\nSi Christian vient, comme je le présume,\nQu'il m'attende !","CYRANO (vivement, comme elle va disparaître):\nAh !. . .\n(Elle se retourne):\nSur quoi, selon votre coutume,\nComptez-vous aujourd'hui l'interroger !","ROXANE:\nSur. . .","CYRANO (vivement):\nSur ?","ROXANE:\nMais vous serez muet, là-dessus !","CYRANO:\nComme un mur.","ROXANE:\nSur rien !. . .Je vais lui dire: Allez ! Partez sans bride !\nImprovisez. Parlez d'amour. Soyez splendide !","CYRANO (souriant):\nBon.","ROXANE:\nChut !. . .","CYRANO:\nChut !. . .","ROXANE:\nPas un mot !. . .\n(Elle rentre et referme la porte.)","CYRANO (la saluant, la porte une fois fermée):\nEn vous remerciant.\n(La porte se rouvre et Roxane passe la tête.)","ROXANE:\nIl se préparerait !. . .","CYRANO:\nDiable, non !. . .","TOUS LES DEUX (ensemble):\nChut !. . .\n(La porte se ferme.)","CYRANO (appelant):\nChristian !","Scène 3.IV.","Cyrano, Christian.","CYRANO:\nJe sais tout ce qu'il faut. Prépare ta mémoire.\nVoici l'occasion de se couvrir de gloire.\nNe perdons pas de temps. Ne prends pas l'air grognon.\nVite, rentrons chez toi, je vais t'apprendre. . .","CHRISTIAN:\nNon !","CYRANO:\nHein ?","CHRISTIAN:\nNon ! J'attends Roxane ici.","CYRANO:\nDe quel vertige\nEs-tu frappé ? Viens vite apprendre. . .","CHRISTIAN:\nNon, te dis-je !\nJe suis las d'emprunter mes lettres, mes discours,\nEt de jouer ce rôle, et de trembler toujours !. . .\nC'était bon au début ! Mais je sens qu'elle m'aime !\nMerci. Je n'ai plus peur. Je vais parler moi-même.","CYRANO:\nOuais !","CHRISTIAN:\nEt qui te dit que je ne saurais pas ?. . .\nJe ne suis pas si bête à la fin ! Tu verras !\nMais, mon cher, tes leçons m'ont été profitables.\nJe saurai parler seul ! Et, de par tous les diables,\nJe saurai bien toujours la prendre dans mes bras !. . .\n(Apercevant Roxane, qui ressort de chez Clomire):\n--C'est elle ! Cyrano, non, ne me quitte pas !","CYRANO (le saluant):\nParlez tout seul, Monsieur.\n(Il disparaît derrière le mur du jardin.)","Scène 3.V.","Christian, Roxane, quelques précieux et précieuses, et la duègne,\nun instant.","ROXANE (sortant de la maison de Clomire avec une compagnie qu'elle\nquitte: révérences et saluts):\nBarthénoïde !--Alcandre !--Grémione !. . .","LA DUÈGNE (désespérée):\nOn a manqué le discours sur le Tendre !\n(Elle rentre chez Roxane.)","ROXANE (saluant encore):\nUrimédonte !. . .Adieu !. . .\n(Tous saluent Roxane, se resaluent entre eux, se séparent et\ns'éloignent par différentes rues. Roxane voit Christian):\nC'est vous !. . .\n(Elle va à lui):\nLe soir descend.\nAttendez. Ils sont loin. L'air est doux. Nul passant.\nAsseyons-nous. Parlez. J'écoute.","CHRISTIAN (s'assied près d'elle, sur le banc. Un silence):\nJe vous aime.","ROXANE (fermant les yeux):\nOui, parlez-moi d'amour.","CHRISTIAN:\nJe t'aime.","ROXANE:\nC'est le thème.\nBrodez, brodez.","CHRISTIAN:\nJe vous. . .","ROXANE:\nBrodez !","CHRISTIAN:\nJe t'aime tant.","ROXANE:\nSans doute ! Et puis ?","CHRISTIAN:\nEt puis. . .je serais si content\nSi vous m'aimiez !--Dis-moi, Roxane, que tu m'aimes !","ROXANE (avec une moue):\nVous m'offrez du brouet quand j'espérais des crèmes !\nDites un peu comment vous m'aimez ?. . .","CHRISTIAN:\nMais. . .beaucoup.","ROXANE:\nOh !. . .Délabyrinthez vos sentiments !","CHRISTIAN (qui s'est rapproché et dévore des yeux la nuque blonde):\nTon cou !\nJe voudrais l'embrasser !. . .","ROXANE:\nChristian !","CHRISTIAN:\nJe t'aime !","ROXANE (voulant se lever):\nEncore !","CHRISTIAN (vivement, la retenant):\nNon ! je ne t'aime pas !","ROXANE (se rasseyant):\nC'est heureux !","CHRISTIAN:\nJe t'adore !","ROXANE (se levant et s'éloignant):\nOh !","CHRISTIAN:\nOui. . .je deviens sot !","ROXANE (sèchement):\nEt cela me déplaît !\nComme il me déplairait que vous devinssiez laid.","CHRISTIAN:\nMais. . .","ROXANE:\nAllez rassembler votre éloquence en fuite !","CHRISTIAN:\nJe. . .","ROXANE:\nVous m'aimez, je sais. Adieu.\n(Elle va vers la maison.)","CHRISTIAN:\nPas tout de suite !\nJe vous dirai. . .","ROXANE (poussant la porte pour rentrer):\nQue vous m'adorez. . .oui, je sais.\nNon ! Non ! Allez-vous-en !","CHRISTIAN:\nMais je. . .\n(Elle lui ferme la porte au nez.)","CYRANO (qui depuis un moment est rentré sans être vu):\nC'est un succès.","Scène 3.VI.","Christian, Cyrano, les pages, un instant.","CHRISTIAN:\nAu secours !","CYRANO:\nNon monsieur.","CHRISTIAN:\nJe meurs si je ne rentre\nEn grâce, à l'instant même. . .","CYRANO:\nEt comment puis-je, diantre !\nVous faire à l'instant même, apprendre ?. . .","CHRISTIAN (lui saisissant le bras):\nOh ! là, tiens, vois !\n(La fenêtre du balcon s'est éclairée):","CYRANO (ému):\nSa fenêtre !","CHRISTIAN (criant):\nJe vais mourir !","CYRANO:\nBaissez la voix !","CHRISTIAN (tout bas):\nMourir !. . .","CYRANO:\nLa nuit est noire. . .","CHRISTIAN:\nEh ! bien ?","CYRANO:\nC'est réparable.\nVous ne méritez pas. . .Mets-toi là, misérable !\nLà, devant le balcon ! Je me mettrai dessous. . .\nEt je te soufflerai tes mots.","CHRISTIAN:\nMais. . .","CYRANO:\nTaisez-vous !","LES PAGES (reparaissant au fond, à Cyrano):\nHep !","CYRANO:\nChut !. . .\n(Il leur fait signe de parler bas.)","PREMIER PAGE (à mi-voix):\nNous venons de donner la sérénade\nA Montfleury !. . .","CYRANO (bas, vite):\nAllez-vous mettre en embuscade\nL'un à ce coin de rue, et l'autre à celui-ci;\nEt si quelque passant gênant vient par ici,\nJouez un air !","DEUXIÈME PAGE:\nQuel air, monsieur le gassendiste ?","CYRANO:\nJoyeux pour une femme, et pour un homme, triste !\n(Les pages disparaissent, un à chaque coin de rue.--A Christian):\nAppelle-la !","CHRISTIAN:\nRoxane !","CYRANO (ramassant des cailloux qu'il jette dans les vitres):\nAttends ! Quelques cailloux.","Scène VII.","Roxane, Christian, Cyrano, d'abord caché sous le balcon.","ROXANE (entr'ouvrant sa fenêtre):\nQui donc m'appelle ?","CHRISTIAN:\nMoi.","ROXANE:\nQui, moi ?","CHRISTIAN:\nChristian.","ROXANE (avec dédain):\nC'est vous ?","CHRISTIAN:\nJe voudrais vous parler.","CYRANO (sous le balcon, à Christian):\nBien. Bien. Presque à voix basse.","ROXANE:\nNon ! Vous parlez trop mal. Allez-vous-en !","CHRISTIAN:\nDe grâce !. . .","ROXANE:\nNon ! Vous ne m'aimez plus !","CHRISTIAN (à qui Cyrano souffle ses mots):\nM'accuser,--justes dieux !--\nDe n'aimer plus. . .quand. . .j'aime plus !","ROXANE (qui allait refermer sa fenêtre, s'arrêtant):\nTiens ! mais c'est mieux !","CHRISTIAN (même jeu):\nL'amour grandit bercé dans mon âme inquiète. . .\nQue ce. . .cruel marmot prit pour. . .barcelonnette !","ROXANE (s'avançant sur le balcon):\nC'est mieux !--Mais, puisqu'il est cruel, vous fûtes sot\nDe ne pas, cet amour, l'étouffer au berceau !","CHRISTIAN (même jeu):\nAussi l'ai-je tenté, mais. . .tentative nulle:\nCe. . .nouveau-né, Madame, est un petit. . .Hercule.","ROXANE:\nC'est mieux !","CHRISTIAN (même jeu):\nDe sorte qu'il. . .strangula comme rien. . .\nLes deux serpents. . .Orgueil et. . .Doute.","ROXANE (s'accoudant au balcon):\nAh ! c'est très bien.\n--Mais pourquoi parlez-vous de façon peu hâtive ?\nAuriez-vous donc la goutte à l'imaginative ?","CYRANO (tirant Christian sous le balcon, et se glissant à sa place):\nChut ! Cela devient trop difficile !. . .","ROXANE:\nAujourd'hui. . .\nVos mots sont hésitants. Pourquoi ?","CYRANO (parlant à mi-voix, comme Christian):\nC'est qu'il fait nuit,\nDans cette ombre, à tâtons, ils cherchent votre oreille.","ROXANE:\nLes miens n'éprouvent pas difficulté pareille.","CYRANO:\nIls trouvent tout de suite ? Oh ! cela va de soi,\nPuisque c'est dans mon cœur, eux, que je les reçois;\nOr, moi, j'ai le cœur grand, vous, l'oreille petite.\nD'ailleurs vos mots à vous, descendent: ils vont vite.\nLes miens montent, Madame: il leur faut plus de temps !","ROXANE:\nMais ils montent bien mieux depuis quelques instants.","CYRANO:\nDe cette gymnastique, ils ont pris l'habitude !","ROXANE:\nJe vous parle, en effet, d'une vraie altitude !","CYRANO:\nCerte, et vous me tueriez si de cette hauteur\nVous me laissiez tomber un mot dur sur le cœur !","ROXANE (avec un mouvement):\nJe descends.","CYRANO (vivement)\nNon !","ROXANE (lui montrant le banc qui est sous le balcon):\nGrimpez sur le banc, alors, vite !","CYRANO (reculant avec effroi dans la nuit):\nNon !","ROXANE:\nComment. . .non ?","CYRANO (que l'émotion gagne de plus en plus):\nLaissez un peu que l'on profite. . .\nDe cette occasion qui s'offre. . .de pouvoir\nSe parler doucement, sans se voir.","ROXANE:\nSans se voir ?","CYRANO:\nMais oui, c'est adorable. On se devine à peine.\nVous voyez la noirceur d'un long manteau qui traîne,\nJ'aperçois la blancheur d'une robe d'été:\nMoi je ne suis qu'une ombre, et vous qu'une clarté !\nVous ignorez pour moi ce que sont ces minutes !\nSi quelquefois je fus éloquent. . .","ROXANE:\nVous le fûtes !","CYRANO:\nMon langage jamais jusqu'ici n'est sorti\nDe mon vrai cœur. . .","ROXANE:\nPourquoi ?","CYRANO:\nParce que. . .jusqu'ici\nJe parlais à travers. . .","ROXANE:\nQuoi ?","CYRANO:\n. . .le vertige où tremble\nQuiconque est sous vos yeux !. . .Mais, ce soir, il me semble. . .\nQue je vais vous parler pour la première fois !","ROXANE:\nC'est vrai que vous avez une tout autre voix.","CYRANO (se rapprochant avec fièvre):\nOui, tout autre, car dans la nuit qui me protège\nJ'ose être enfin moi-même, et j'ose. . .\n(Il s'arrête et avec égarement):\nOù en étais-je ?\nJe ne sais. . .tout ceci,--pardonnez mon émoi,--\nC'est si délicieux,. . .c'est si nouveau pour moi !","ROXANE:\nSi nouveau ?","CYRANO (bouleversé, et essayant toujours de rattraper ses mots):\nSi nouveau. . .mais oui. . .d'être sincère:\nLa peur d'être raillé, toujours au cœur me serre. . .","ROXANE:\nRaillé de quoi ?","CYRANO:\nMais de. . .d'un élan !. . .Oui, mon cœur\nToujours, de mon esprit s'habille, par pudeur:\nJe pars pour décrocher l'étoile, et je m'arrête\nPar peur du ridicule, à cueillir la fleurette !","ROXANE:\nLa fleurette a du bon.","CYRANO:\nCe soir, dédaignons-la !","ROXANE:\nVous ne m'aviez jamais parlé comme cela !","CYRANO:\nAh ! si loin des carquois, des torches et des flèches,\nOn se sauvait un peu vers des choses. . .plus fraîches !\nAu lieu de boire goutte à goutte, en un mignon\nDé à coudre d'or fin, l'eau fade du Lignon,\nSi l'on tentait de voir comment l'âme s'abreuve\nEn buvant largement à même le grand fleuve !","ROXANE:\nMais l'esprit ?. . .","CYRANO:\nJ'en ai fait pour vous faire rester\nD'abord, mais maintenant ce serait insulter\nCette nuit, ces parfums, cette heure, la Nature,\nQue de parler comme un billet doux de Voiture !\n--Laissons, d'un seul regard de ses astres, le ciel\nNous désarmer de tout notre artificiel:\nJe crains tant que parmi notre alchimie exquise\nLe vrai du sentiment ne se volatilise,\nQue l'âme ne se vide à ces passe-temps vains,\nEt que le fin du fin ne soit la fin des fins !","ROXANE:\nMais l'esprit ?. . .","CYRANO:\nJe le hais dans l'amour ! C'est un crime\nLorsqu'on aime de trop prolonger cette escrime !\nLe moment vient d'ailleurs inévitablement,\n--Et je plains ceux pour qui ne vient pas ce moment !--\nOù nous sentons qu'en nous une amour noble existe\nQue chaque joli mot que nous disons rend triste !","ROXANE:\nEh bien ! si ce moment est venu pour nous deux,\nQuels mots me direz-vous ?","CYRANO:\nTous ceux, tous ceux, tous ceux\nQui me viendront, je vais vous les jeter, en touffe,\nSans les mettre en bouquet: je vous aime, j'étouffe,\nJe t'aime, je suis fou, je n'en peux plus, c'est trop;\nTon nom est dans mon cœur comme dans un grelot,\nEt comme tout le temps, Roxane, je frissonne,\nTout le temps, le grelot s'agite, et le nom sonne !\nDe toi, je me souviens de tout, j'ai tout aimé:\nJe sais que l'an dernier, un jour, le douze mai,\nPour sortir le matin tu changeas de coiffure !\nJ'ai tellement pris pour clarté ta chevelure\nQue, comme lorsqu'on a trop fixé le soleil,\nOn voit sur toute chose ensuite un rond vermeil,\nSur tout, quand j'ai quitté les feux dont tu m'inondes,\nMon regard ébloui pose des taches blondes !","ROXANE (d'une voix troublée):\nOui, c'est bien de l'amour. . .","CYRANO:\nCertes, ce sentiment\nQui m'envahit, terrible et jaloux, c'est vraiment\nDe l'amour, il en a toute la fureur triste !\nDe l'amour,--et pourtant il n'est pas égoïste !\nAh ! que pour ton bonheur je donnerais le mien,\nQuand même tu devrais n'en savoir jamais rien,\nS'il se pouvait, parfois, que de loin, j'entendisse\nRire un peu le bonheur né de mon sacrifice !\n--Chaque regard de toi suscite une vertu\nNouvelle, une vaillance en moi ! Commences-tu\nÀ comprendre, à présent ? voyons, te rends-tu compte ?\nSens-tu mon âme, un peu, dans cette ombre, qui monte ?. . .\nOh ! mais vraiment, ce soir, c'est trop beau, c'est trop doux !\nJe vous dis tout cela, vous m'écoutez, moi, vous !\nC'est trop ! Dans mon espoir même le moins modeste,\nJe n'ai jamais espéré tant ! Il ne me reste\nQu'à mourir maintenant ! C'est à cause des mots\nQue je dis qu'elle tremble entre les bleus rameaux !\nCar vous tremblez, comme une feuille entre les feuilles !\nCar tu trembles ! car j'ai senti, que tu le veuilles\nOu non, le tremblement adoré de ta main\nDescendre tout le long des branches du jasmin !\n(Il baise éperdument l'extrémité d'une branche pendante.)","ROXANE:\nOui, je tremble, et je pleure, et je t'aime, et suis tienne !\nEt tu m'as enivrée !","CYRANO:\nAlors, que la mort vienne !\nCette ivresse, c'est moi, moi, qui l'ai su causer !\nJe ne demande plus qu'une chose. . .","CHRISTIAN (sous le balcon):\nUn baiser !","ROXANE (se rejetant en arrière):\nHein ?","CYRANO:\nOh !","ROXANE:\nVous demandez ?","CYRANO:\nOui. . .je. . .\n(A Christian bas):\nTu vas trop vite.","CHRISTIAN:\nPuisqu'elle est si troublée, il faut que j'en profite !","CYRANO (à Roxane):\nOui, je. . .j'ai demandé, c'est vrai. . .mais justes cieux !\nJe comprends que je fus bien trop audacieux.","ROXANE (un peu déçue):\nVous n'insistez pas plus que cela ?","CYRANO:\nSi ! j'insiste. . .\nSans insister !. . .Oui, oui ! votre pudeur s'attriste !\nEh bien ! mais, ce baiser. . .ne me l'accordez pas !","CHRISTIAN (à Cyrano, le tirant par son manteau):\nPourquoi ?","CYRANO:\nTais-toi, Christian !","ROXANE (se penchant):\nQue dites-vous tout bas ?","CYRANO:\nMais d'être allé trop loin, moi-même je me gronde;\nJe me disais: tais toi, Christian !. . .\n(Les théorbes se mettent à jouer):\nUne seconde !. . .\nOn vient !\n(Roxane referme la fenêtre. Cyrano écoute les théorbes, dont l'un joue\nun air folâtre et l'autre un air lugubre):\nAir triste ? Air gai ?. . .Quel est donc leur dessein ?\nEst-ce un homme ? Une femme ?--Ah ! c'est un capucin !\n(Entre un capucin qui va de maison en maison, une lanterne à la main,\nregardant les portes.)","Scène 3.VIII.","Cyrano, Christian, un capucin.","CYRANO (au capucin):\nQuel est ce jeu renouvelé de Diogène ?","LE CAPUCIN:\nJe cherche la maison de madame. . .","CHRISTIAN:\nIl nous gêne !","LE CAPUCIN:\nMagdeleine Robin. . .","CHRISTIAN:\nQue veut-il ?. . .","CYRANO (lui montrant une rue montante):\nPar ici !\nTout droit,--toujours tout droit. . .","LE CAPUCIN\nJe vais pour vous !--Merci\nDire mon chapelet jusqu'au grain majuscule.\n(Il sort.)","CYRANO:\nBonne chance ! Mes vœux suivent votre cuculle !\n(Il redescend vers Christian.)","Scène 3.IX.","Cyrano, Christian.","CHRISTIAN:\nObtiens-moi ce baiser !. . .","CYRANO:\nNon !","CHRISTIAN:\nTôt ou tard !. . .","CYRANO:\nC'est vrai !\nIl viendra, ce moment de vertige enivré\nOù vos bouches iront l'une vers l'autre, à cause\nDe ta moustache blonde et de sa lèvre rose !\n(A lui-même):\nJ'aime mieux que ce soit à cause de. . .\n(Bruit des volets qui se rouvrent, Christian se cache sous le balcon.)","Scène 3.X.","Cyrano, Christian, Roxane.","ROXANE (s'avançant sur le balcon):\nC'est vous ?\nNous parlions de. . .de. . .d'un. . .","CYRANO:\nBaiser ! Le mot est doux.\nJe ne vois pas pourquoi votre lèvre ne l'ose;\nS'il la brûle déjà, que sera-ce la chose ?\nNe vous en faites pas un épouvantement:\nN'avez-vous pas tantôt, presque insensiblement,\nQuitté le badinage et glissé sans alarmes\nDu sourire au soupir, et du soupir aux larmes !\nGlissez encore un peu d'insensible façon:\nDes larmes au baiser il n'y a qu'un frisson !","ROXANE:\nTaisez-vous !","CYRANO:\nUn baiser, mais à tout prendre, qu'est-ce ?\nUn serment fait d'un peu plus près, une promesse\nPlus précise, un aveu qui veut se confirmer,\nUn point rose qu'on met sur l'i du verbe aimer;\nC'est un secret qui prend la bouche pour oreille,\nUn instant d'infini qui fait un bruit d'abeille,\nUne communion ayant un goût de fleur,\nUne façon d'un peu se respirer le cœur,\nEt d'un peu se goûter, au bord des lèvres, l'âme !","ROXANE:\nTaisez-vous !","CYRANO:\nUn baiser, c'est si noble, Madame,\nQue la reine de France, au plus heureux des lords,\nEn a laissé prendre un, la reine même !","ROXANE:\nAlors !","CYRANO (s'exaltant):\nJ'eus comme Buckingham des souffrances muettes,\nJ'adore comme lui la reine que vous êtes,\nComme lui je suis triste et fidèle. . .","ROXANE:\nEt tu es\nBeau comme lui !","CYRANO (à part, dégrisé):\nC'est vrai, je suis beau, j'oubliais !","ROXANE:\nEh bien ! montez cueillir cette fleur sans pareille. . .","CYRANO (poussant Christian vers le balcon):\nMonte !","ROXANE:\nCe goût de cœur. . .","CYRANO:\nMonte !","ROXANE:\nCe bruit d'abeille. . .","CYRANO:\nMonte !","CHRISTIAN (hésitant):\nMais il me semble, à présent, que c'est mal !","ROXANE:\nCet instant d'infini !. . .","CYRANO (le poussant):\nMonte donc, animal !\n(Christian s'élance, et par le banc, le feuillage, les piliers,\natteint les balustres qu'il enjambe.)","CHRISTIAN:\nAh, Roxane !\n(Il l'enlace et se penche sur ses lèvres.)","CYRANO:\nAïe ! au cœur, quel pincement bizarre !\n--Baiser, festin d'amour dont je suis le Lazare !\nIl me vient dans cette ombre une miette de toi,--\nMais oui, je sens un peu mon cœur qui te reçoit,\nPuisque sur cette lèvre où Roxane se leurre\nElle baise les mots que j'ai dits tout à l'heure !\n(On entend les théorbes):\nUn air triste, un air gai: le capucin !\n(Il feint de courir comme s'il arrivait de loin, et d'une voix claire):\nHolà !","ROXANE:\nQu'est ce ?","CYRANO:\nMoi. Je passais. . .Christian est encor là ?","CHRISTIAN (très étonné):\nTiens Cyrano !","ROXANE:\nBonjour, cousin !","CYRANO:\nBonjour, cousine !","ROXANE:\nJe descends !\n(Elle disparaît dans la maison. Au fond rentre le capucin.)","CHRISTIAN (l'apercevant):\nOh ! encor !\n(Il suit Roxane.)","Scène 3.XI.","Cyrano, Christian, Roxane, le capucin, Ragueneau.","LE CAPUCIN:\nC'est ici,--je m'obstine--\nMagdeleine Robin !","CYRANO:\nVous aviez dit: Ro-lin.","LE CAPUCIN:\nNon: Bin. B, i, n, bin !","ROXANE (paraissant sur le seuil de la maison, suivie de Ragueneau qui\nporte une lanterne, et de Christian):\nQu'est-ce ?","LE CAPUCIN:\nUne lettre.","CHRISTIAN:\nHein ?","LE CAPUCIN (à Roxane):\nOh ! il ne peut s'agir que d'une sainte chose !\nC'est un digne seigneur qui. . .","ROXANE (à Christian):\nC'est De Guiche !","CHRISTIAN:\nIl ose ?. . .","ROXANE:\nOh ! mais il ne va pas m'importuner toujours !\n(Décachetant la lettre):\nJe t'aime, et si. . .\n(A la lueur de la lanterne de Ragueneau, elle lit, à l'écart, à voix basse):\nMademoiselle,\nLes tambours\nBattent; mon régiment boucle sa soubreveste;\nIl part; moi, l'on me croit déjà parti: je reste.\nJe vous désobéis. Je suis dans ce couvent.\nJe vais venir, et vous le mande auparavant\nPar un religieux simple comme une chèvre\nQui ne peut rien comprendre à ceci. Votre lèvre\nM'a trop souri tantôt: j'ai voulu la revoir.\nÉloignez un chacun, et daignez recevoir\nL'audacieux déjà pardonné, je l'espère,\nQui signe votre très. . .et caetera. . .\n(Au capucin):\nMon Père,\nVoici ce que me dit cette lettre. Écoutez:\n(Tous se rapprochent, elle lit à haute voix):\nMademoiselle,\nIl faut souscrire aux volontés\nDu cardinal, si dur que cela vous puisse être.\nC'est la raison pourquoi j'ai fait choix, pour remettre\nCes lignes en vos mains charmantes, d'un très saint,\nD'un très intelligent et discret capucin;\nNous voulons qu'il vous donne, et dans votre demeure,\nLa bénédiction\n(Elle tourne la page):\nnuptiale sur l'heure.\nChristian doit en secret devenir votre époux;\nJe vous l'envoie. Il vous déplaît. Résignez-vous.\nSongez bien que le ciel bénira votre zèle,\nEt tenez pour tout assuré, Mademoiselle,\nLe respect de celui qui fut et qui sera\nToujours votre très humble et très. . .et cætera.","LE CAPUCIN (rayonnant):\nDigne seigneur !. . .Je l'avais dit. J'étais sans crainte !\nIl ne pouvait s'agir que d'une chose sainte !","ROXANE (bas à Christian):\nN'est-ce pas que je lis très bien les lettres ?","CHRISTIAN:\nHum !","ROXANE (haut, avec désespoir):\nAh !. . .c'est affreux !","LE CAPUCIN (qui a dirigé sur Cyrano la clarté de sa lanterne):\nC'est vous ?","CHRISTIAN:\nC'est moi !","LE CAPUCIN (tournant la lumière vers lui, et, comme si un doute lui\nvenait, en voyant sa beauté):\nMais. . .","ROXANE (vivement):\nPost-scriptum:\nDonnez pour le couvent cent vingt pistoles.","LE CAPUCIN:\nDigne,\nDigne seigneur !\n(A Roxane):\nRésignez-vous ?","ROXANE (en martyre):\nJe me résigne !\n(Pendant que Ragueneau ouvre la porte au capucin que Christian invite\nà entrer, elle dit bas à Cyrano):\nVous, retenez ici De Guiche ! Il va venir !\nQu'il n'entre pas tant que. . .","CYRANO:\nCompris !\n(Au capucin):\nPour les bénir\nIl vous faut ?. . .","LE CAPUCIN:\nUn quart d'heure.","CYRANO (les poussant tous vers la maison):\nAllez ! moi, je demeure !","ROXANE (à Christian):\nViens !. . .\n(Ils entrent.)","Scène XII.","Cyrano, seul.","CYRANO:\nComment faire perdre à De Guiche un quart d'heure.\n(Il se précipite sur le banc, grimpe au mur, vers le balcon):\nLà !. . .Grimpons !. . .J'ai mon plan !. . .\n(Les théorbes se mettent à jouer une phrase lugubre):\nHo ! c'est un homme !\n(Le trémolo devient sinistre):\nHo ! ho !\nCette fois, c'en est un !. . .\n(Il est sur le balcon, il rabaisse son feutre sur ses yeux, ôte son\népée, se drape dans sa cape, puis se penche et regarde au dehors):\nNon, ce n'est pas trop haut !. . .\n(Il enjambe les balustres et attirant à lui la longue branche d'un des\narbres qui débordent le mur du jardin, il s'y accroche des deux mains,\nprêt a se laisser tomber):\nJe vais légèrement troubler cette atmosphère !. . .","Scène 3.XIII.","Cyrano, De Guiche.","DE GUICHE (qui entre, masqué, tâtonnant dans la nuit):\nQu'est-ce que ce maudit capucin peut bien faire ?","CYRANO:\nDiable ! Et ma voix ?. . .S'il la reconnaissait ?\n(Lâchant d'une main, il a l'air de tourner une invisible clef):\nCric ! Crac !\n(Solennellement):\nCyrano, reprenez l'accent de Bergerac !. . .","DE GUICHE (regardant la maison):\nOui, c'est là. J'y vois mal. Ce masque m'importune !\n(Il va pour entrer, Cyrano saute du balcon en se tenant à la branche,\nqui plie, et le dépose entre la porte et De Guiche; il feint de tomber\nlourdement, comme si c'était de très haut, et s'aplatit par terre, où\nil reste immobile, comme étourdi. De Guiche fait un bond en arrière):\nHein ? quoi ?\n(Quand il lève les yeux, la branche s'est redressée; il ne voit que le\nciel; il ne comprend pas):\nD'où tombe donc cet homme ?","CYRANO (se mettant sur son séant, et avec l'accent de Gascogne):\nDe la lune !","DE GUICHE:\nDe la ?. . .","CYRANO (d'une voix de rêve):\nQuelle heure est-il ?","DE GUICHE:\nN'a-t-il plus sa raison ?","CYRANO:\nQuelle heure ? Quel pays ? Quel jour ? Quelle saison ?","DE GUICHE:\nMais. . .","CYRANO:\nJe suis étourdi !","DE GUICHE:\nMonsieur. . .","CYRANO:\nComme une bombe\nJe tombe de la lune !","DE GUICHE (impatienté):\nAh ça ! Monsieur !","CYRANO (se relevant, d'une voix terrible):\nJ'en tombe !","DE GUICHE (reculant):\nSoit ! soit ! vous en tombez !. . .c'est peut-être un dément !","CYRANO (marchant sur lui):\nEt je n'en tombe pas métaphoriquement !. . .","DE GUICHE:\nMais. . .","CYRANO:\nIl y a cent ans, ou bien une minute,\n--J'ignore tout à fait ce que dura ma chute !--\nJ'étais dans cette boule à couleur de safran !","DE GUICHE (haussant les épaules):\nOui. Laissez-moi passer !","CYRANO (s'interposant):\nOù suis-je ? soyez franc !\nNe me déguisez rien ! En quel lieu, dans quel site,\nViens-je de choir, Monsieur, comme un aérolithe ?","DE GUICHE:\nMorbleu !. . .","CYRANO:\nTout en cheyant je n'ai pu faire choix\nDe mon point d'arrivée,--et j'ignore où je chois !\nEst-ce dans une lune ou bien dans une terre,\nQue vient de m'entraîner le poids de mon postère ?","DE GUICHE:\nMais je vous dis, Monsieur. . .","CYRANO (avec un cri de terreur qui fait reculer de Guiche):\nHa ! grand Dieu !. . .je crois voir\nQu'on a dans ce pays le visage tout noir !","DE GUICHE (portant la main à son visage):\nComment ?","CYRANO (avec une peur emphatique):\nSuis-je en Alger ? Êtes-vous indigène ?. . .","DE GUICHE (qui a senti son masque):\nCe masque !. . .","CYRANO (feignant de se rassurer un peu):\nJe suis donc dans Venise, ou dans Gêne ?","DE GUICHE (voulant passer):\nUne dame m'attend !. . .","CYRANO (complètement rassuré):\nJe suis donc à Paris.","DE GUICHE (souriant malgré lui):\nLe drôle est assez drôle !","CYRANO:\nAh ! vous riez ?","DE GUICHE:\nJe ris,\nMais veux passer !","CYRANO (rayonnant):\nC'est à Paris que je retombe !\n(Tout à fait à son aise, riant, s'époussetant, saluant):\nJ'arrive--excusez-moi !--par la dernière trombe.\nJe suis un peu couvert d'éther. J'ai voyagé !\nJ'ai les yeux tout remplis de poudre d'astres. J'ai\nAux éperons, encor, quelques poils de planète !\n(Cueillant quelque chose sur sa manche):\nTenez, sur mon pourpoint, un cheveu de comète !. . .\n(Il souffle comme pour le faire envoler.)","DE GUICHE (hors de lui):\nMonsieur !. . .","CYRANO (au moment où il va passer, tend sa jambe comme pour y montrer\nquelque chose et l'arrête):\nDans mon mollet je rapporte une dent\nDe la Grande Ourse,--et comme, en frôlant le Trident,\nJe voulais éviter une de ses trois lances,\nJe suis allé tomber assis dans les Balances,--\nDont l'aiguille, à présent, là-haut, marque mon poids !\n(Empêchant vivement de Guiche de passer et le prenant à un bouton du\npourpoint):\nSi vous serriez mon nez, Monsieur, entre vos doigts,\nIl jaillirait du lait !","DE GUICHE:\nHein ? du lait ?. . .","CYRANO:\nDe la Voie\nLactée !. . .","DE GUICHE:\nOh ! Par l'enfer !","CYRANO:\nC'est le ciel qui m'envoie !\n(Se croisant les bras):\nNon ! croiriez-vous, je viens de le voir en tombant,\nQue Sirius, la nuit, s'affuble d'un turban ?\n(Confidentiel):\nL'autre Ourse est trop petite encor pour qu'elle morde !\n(Riant):\nJ'ai traversé la Lyre en cassant une corde !\n(Superbe):\nMais je compte en un livre écrire tout ceci,\nEt les étoiles d'or qu'en mon manteau roussi\nJe viens de rapporter à mes périls et risques,\nQuand on l'imprimera, serviront d'astérisques !","DE GUICHE:\nA la parfin, je veux. . .","CYRANO:\nVous, je vous vois venir !","DE GUICHE:\nMonsieur !","CYRANO:\nVous voudriez de ma bouche tenir\nComment la lune est faite, et si quelqu'un habite\nDans la rotondité de cette cucurbite ?","DE GUICHE (criant):\nMais non ! Je veux. . .","CYRANO:\nSavoir comment j'y suis monté.\nCe fut par un moyen que j'avais inventé.","DE GUICHE (découragé):\nC'est un fou !","CYRANO (dédaigneux):\nJe n'ai pas refait l'aigle stupide\nDe Regiomontanus, ni le pigeon timide\nD'Archytas !. . .","DE GUICHE:\nC'est un fou,--mais c'est un fou savant.","CYRANO:\nNon, je n'imitai rien de ce qu'on fit avant !\n(De Guiche a réussi à passer et il marche vers la porte de Roxane.\nCyrano le suit, prêt a l'empoigner):\nJ'inventai six moyens de violer l'azur vierge !","DE GUICHE (se retournant):\nSix ?","CYRANO (avec volubilité):\nJe pouvais, mettant mon corps nu comme un cierge,\nLa caparaçonner de fioles de cristal\nToutes pleines des pleurs d'un ciel matutinal,\nEt ma personne, alors, au soleil exposée,\nL'astre l'aurait humée en humant la rosée !","DE GUICHE (surpris et faisant un pas vers Cyrano):\nTiens ! Oui, cela fait un !","CYRANO (reculant pour l'entraîner de l'autre côté):\nEt je pouvais encor\nFaire engouffrer du vent, pour prendre mon essor,\nEn raréfiant l'air dans un coffre de cèdre\nPar des miroirs ardents, mis en icosaèdre !","DE GUICHE (fait encore un pas):\nDeux !","CYRANO (reculant toujours):\nOu bien, machiniste autant qu'artificier,\nSur une sauterelle aux détentes d'acier,\nMe faire, par des feux successifs de salpêtre,\nLancer dans les prés bleus où les astres vont paître !","DE GUICHE (le suivant, sans s'en douter, et comptant sur ses doigts):\nTrois !","CYRANO:\nPuisque la fumée a tendance à monter,\nEn souffler dans un globe assez pour m'emporter !","DE GUICHE (même jeu, de plus en plus étonné):\nQuatre !","CYRANO:\nPuisque Phœbé, quand son arc est le moindre,\nAime sucer, ô bœufs, votre moëlle. . .m'en oindre !","DE GUICHE (stupéfait):\nCinq !","CYRANO (qui en parlant l'a amené jusqu'à l'autre côté de la place, près\nd'un banc):\nEnfin, me plaçant sur un plateau de fer,\nPrendre un morceau d'aimant et le lancer en l'air !\nÇa, c'est un bon moyen: le fer se précipite,\nAussitôt que l'aimant s'envole, à sa poursuite;\nOn relance l'aimant bien vite, et cadédis !\nOn peut monter ainsi indéfiniment.","DE GUICHE:\nSix !\n--Mais voilà six moyens excellents !. . .Quel système\nChoisîtes-vous des six, Monsieur ?","CYRANO:\nUn septième !","DE GUICHE:\nPar exemple ! Et lequel ?","CYRANO:\nJe vous le donne en cent !. . .","DE GUICHE:\nC'est que ce mâtin-là devient intéressant !","CYRANO (faisant le bruit des vagues avec de grands gestes mystérieux):\nHouüh ! houüh !","DE GUICHE:\nEh bien !","CYRANO:\nVous devinez ?","DE GUICHE:\nNon !","CYRANO:\nLa marée !. . .\nA l'heure où l'onde par la lune est attirée,\nJe me mis sur la sable--après un bain de mer--\nEt la tête partant la première, mon cher,\n--Car les cheveux, surtout, gardent l'eau dans leur frange !--\nJe m'enlevai dans l'air, droit, tout droit, comme un ange.\nJe montais, je montais doucement, sans efforts,\nQuand je sentis un choc !. . .Alors. . .","DE GUICHE (entraîné par la curiosité, et s'asseyant sur le banc):\nAlors ?","CYRANO:\nAlors. . .\n(Reprenant sa voix naturelle):\nLe quart d'heure est passé, Monsieur, je vous délivre:\nLe mariage est fait.","DE GUICHE (se relevant d'un bond):\nÇà, voyons, je suis ivre !. . .\nCette voix ?\n(La porte de la maison s'ouvre, des laquais paraissent portant des\ncandélabres allumés. Lumière. Cyrano ôte son chapeau au bord abaissé):\nEt ce nez--Cyrano ?","CYRANO (saluant):\nCyrano.\n--Ils viennent à l'instant d'échanger leur anneau.","DE GUICHE:\nQui cela ?\n(Il se retourne.--Tableau. Derrière les laquais, Roxane et Christian\nse tiennent par la main. Le capucin les suit en souriant. Ragueneau\nélève aussi un flambeau. La duègne ferme la marche, ahurie, en petit\nsaut de lit):\nCiel !","Scène 3.XIV.","Les mêmes, Roxane, Christian, le capucin, Ragueneau, laquais, la duègne.","DE GUICHE (à Roxane):\nVous ?\n(Reconnaissant Christian avec stupeur):\nLui ?\n(Saluant Roxane avec admiration):\nVous êtes des plus fines !\n(A Cyrano):\nMes compliments, Monsieur l'inventeur des machines:\nVotre récit eût fait s'arrêter au portail\nDu paradis, un saint ! Notez-en le détail,\nCar vraiment cela peut resservir dans un livre !","CYRANO (s'inclinant):\nMonsieur, c'est un conseil que je m'engage à suivre.","LE CAPUCIN (montrant les amants à De Guiche et hochant avec satisfaction\nsa grande barbe blanche):\nUn beau couple, mon fils, réuni là par vous !","DE GUICHE (le regardant d'un œil glacé):\nOui.\n(A Roxane):\nVeuillez dire adieu, Madame, à votre époux.","ROXANE:\nComment ?","DE GUICHE (à Christian):\nLe régiment déjà se met en route.\nJoignez-le !","ROXANE:\nPour aller à la guerre ?","DE GUICHE:\nSans doute !","ROXANE:\nMais, Monsieur, les cadets n'y vont pas !","DE GUICHE:\nIls iront.\n(Tirant le papier qu'il avait mis dans sa poche):\nVoici l'ordre.\n(A Christian):\nCourez le porter, vous, baron.","ROXANE (se jetant dans les bras de Christian):\nChristian !","DE GUICHE (ricanant, à Cyrano):\nLa nuit de noce est encore lointaine !","CYRANO (à part):\nDire qu'il croit me faire énormément de peine !","CHRISTIAN (à Roxane):\nOh ! tes lèvres encor !","CYRANO:\nAllons, voyons, assez !","CHRISTIAN (continuant à embrasser Roxane):\nC'est dur de la quitter. . .Tu ne sais pas. . .","CYRANO (cherchant à l'entraîner):\nJe sais.\n(On entend au loin des tambours qui battent une marche.)","DE GUICHE (qui est remonté au fond):\nLe régiment qui part !","ROXANE (à Cyrano, en retenant Christian qu'il essaye toujours d'entraîner):\nOh !. . .je vous le confie !\nPromettez-moi que rien ne va mettre sa vie\nEn danger !","CYRANO:\nJ'essaierai. . .mais ne peux cependant\nPromettre. . .","ROXANE (même jeu):\nPromettez qu'il sera très prudent !","CYRANO:\nOui, je tâcherai, mais. . .","ROXANE (même jeu):\nQu'à ce siège terrible\nIl n'aura jamais froid !","CYRANO:\nJe ferai mon possible.\nMais. . .","ROXANE (même jeu):\nQu'il sera fidèle !","CYRANO:\nEh oui ! sans doute, mais. . .","ROXANE (même jeu):\nQu'il m'écrira souvent !","CYRANO (s'arrêtant):\nÇa,--je vous le promets !","Rideau."]},{"name":"Acte IV","paragraphs":["Les Cadets de Gascogne.","Le poste qu'occupe la compagnie de Carbon de Castel-Jaloux au siège\nd'Arras.","Au fond, talus traversant toute la scène. Au delà s'aperçoit un horizon\nde plaine: le pays couvert de travaux de siège. Les murs d'Arras et la\nsilhouette de ses toits sur le ciel, très loin.","Tentes; armes éparses; tambours, etc.--Le jour va se lever. Jaune\nOrient.--Sentinelles espacées. Feux.","Roulés dans leurs manteaux, les Cadets de Gascogne dorment. Carbon de\nCastel-Jaloux et Le Bret veillent. Ils sont très pâles et très maigris.\nChristian dort, parmi les autres, dans sa cape, au premier plan, le\nvisage éclairé par un feu. Silence.","Scène 4.I.","Christian, Carbon de Castel-Jaloux, Le Bret, les cadets, puis Cyrano.","LE BRET:\nC'est affreux !","CARBON:\nOui. Plus rien.","LE BRET:\nMordious !","CARBON (lui faisant signe de parler plus bas):\nJure en sourdine !\nTu vas les réveiller.\n(Aux cadets):\nChut ! Dormez !\n(A Le Bret):\nQui dort dîne !","LE BRET:\nQuand on a l'insomnie on trouve que c'est peu !\nQuelle famine !\n(On entend au loin quelques coups de feu.)","CARBON:\nAh ! maugrébis des coups de feu !. . .\nIls vont me réveiller mes enfants !\n(Aux cadets qui lèvent la tête):\nDormez !\n(On se recouche. Nouveaux coups de feu plus rapprochés.)","UN CADET (s'agitant):\nDiantre !\nEncore ?","CARBON:\nCe n'est rien ! C'est Cyrano qui rentre !\n(Les têtes qui s'étaient relevées se recouchent.)","UNE SENTINELLE (au dehors):\nVentrebieu ! qui va là ?","LA VOIX DE CYRANO:\nBergerac !","LA SENTINELLE (qui est sur le talus):\nVentrebieu !\nQui va là ?","CYRANO (paraissant sur la crête):\nBergerac, imbécile !\n(Il descend. Le Bret va au-devant de lui, inquiet):","LE BRET:\nAh ! grand Dieu !","CYRANO (lui faisant signe de ne réveiller personne):\nChut !","LE BRET:\nBlessé ?","CYRANO:\nTu sais bien qu'ils ont pris l'habitude\nDe me manquer tous les matins !","LE BRET:\nC'est un peu rude,\nPour porter une lettre, à chaque jour levant,\nDe risquer !","CYRANO (s'arrêtant devant Christian):\nJ'ai promis qu'il écrirait souvent !\n(Il le regarde):\nIl dort. Il est pâli. Si la pauvre petite\nSavait qu'il meurt de faim. . .Mais toujours beau !","LE BRET:\nVa vite\nDormir !","CYRANO:\nNe grogne pas, Le Bret !. . .Sache ceci:\nPour traverser les rangs espagnols, j'ai choisi\nUn endroit où je sais, chaque nuit, qu'ils sont ivres.","LE BRET:\nTu devrais bien un jour nous rapporter des vivres.","CYRANO:\nIl faut être léger pour passer !--Mais je sais\nQu'il y aura ce soir du nouveau. Les Français\nMangeront ou mourront,--si j'ai bien vu. . .","LE BRET:\nRaconte !","CYRANO:\nNon. Je ne suis pas sûr. . .vous verrez !","CARBON:\nQuelle honte,\nLorsqu'on est assiégeant, d'être affamé !","LE BRET:\nHélas !\nRien de plus compliqué que ce siège d'Arras:\nNous assiégeons Arras,--nous-mêmes, pris au piège,\nLe cardinal infant d'Espagne nous assiège. . .","CYRANO:\nQuelqu'un devrait venir l'assiéger à son tour.","LE BRET:\nJe ne ris pas.","CYRANO:\nOh ! oh !","LE BRET:\nPenser que chaque jour\nVous risquez une vie, ingrat, comme la vôtre,\nPour porter. . .\n(Le voyant qui se dirige vers une tente):\nOù vas-tu ?","CYRANO:\nJ'en vais écrire une autre.\n(Il soulève la toile et disparaît.)","Scène 4.II.","Les mêmes, moins Cyrano.","(Le jour s'est un peu levé. Lueurs roses. La ville d' Arras se dore à\nl'horizon. On entend un coup de canon immédiatement suivi d'une\nbatterie de tambours, très au loin, vers la gauche. D'autres tambours\nbattent plus près. Les batteries vont se répondant, et se rapprochant,\néclatent presque en scène et s'éloignent vers la droite, parcourant le\ncamp. Rumeurs de réveil. Voix lointaines d'officiers.)","CARBON (avec un soupir):\nLa diane !. . .Hélas !\n(Les cadets s'agitent dans leurs manteaux, s'étirent):\nSommeil succulent, tu prends fin !. . .\nJe sais trop quel sera leur premier cri !","UN CADET (se mettant sur son séant):\nJ'ai faim !","UN AUTRE:\nJe meurs !","TOUS:\nOh !","CARBON:\nLevez-vous !","TROISIÈME CADET:\nPlus un pas !","QUATRIÈME CADET:\nPlus un geste !","LE PREMIER (se regardant dans un morceau de cuirasse):\nMa langue est jaune: l'air du temps est indigeste !","UN AUTRE:\nMon tortil de baron pour un peu de Chester !","UN AUTRE:\nMoi, si l'on ne veut pas fournir à mon gaster\nDe quoi m'élaborer une pinte de chyle,\nJe me retire sous ma tente--comme Achille !","UN AUTRE:\nOui, du pain !","CARBON (allant à la tente où est entré Cyrano, à mi-voix):\nCyrano !","D'AUTRES:\nNous mourons !","CARBON (toujours à mi-voix, à la porte de la tente):\nAu secours !\nToi qui sais si gaiement leur répliquer toujours,\nViens les ragaillardir !","DEUXIÈME CADET (se précipitant vers le premier qui mâchonne quelque chose):\nQu'est-ce que tu grignotes !","LE PREMIER:\nDe l'étoupe à canon que dans les bourguignotes\nOn fait frire en la graisse à graisser les moyeux,\nLes environs d'Arras sont très peu giboyeux !","UN AUTRE (entrant):\nMoi, je viens de chasser !","UN AUTRE (même jeu):\nJ'ai pêché, dans la Scarpe !","TOUS (debout, se ruant sur les deux nouveaux venus):\nQuoi !--Que rapportez-vous ?--Un faisan ?--Une carpe ?--\nVite, vite, montrez !","LE PÊCHEUR:\nUn goujon !","LE CHASSEUR:\nUn moineau !","TOUS (exaspérés):\nAssez !--Révoltons-nous !","CARBON:\nAu secours, Cyrano !\n(Il fait maintenant tout à fait jour.)","Scène 4.III.","Les mêmes, Cyrano.","CYRANO (sortant de sa tente, tranquille, une plume à l'oreille, un livre\nà la main):\nHein ?\n(Silence. Au premier cadet):\nPourquoi t'en vas-tu, toi, de ce pas qui traîne ?","LE CADET:\nJ'ai quelque chose, dans les talons, qui me gêne !. . .","CYRANO:\nEt quoi donc ?","LE CADET:\nL'estomac !","CYRANO:\nMoi de même, pardi !","LE CADET:\nCela doit te gêner ?","CYRANO:\nNon, cela me grandit.","DEUXIÈME CADET:\nJ'ai les dents longues !","CYRANO:\nTu n'en mordras que plus large.","UN TROISIÈME:\nMon ventre sonne creux !","CYRANO:\nNous y battrons la charge.","UN AUTRE:\nDans les oreilles, moi, j'ai des bourdonnements.","CYRANO:\nNon, non; ventre affamé, pas d'oreilles: tu mens !","UN AUTRE:\nOh ! manger quelque chose,--à l'huile !","CYRANO (le décoiffant et lui mettant son casque dans la main):\nTa salade.","UN AUTRE:\nQu'est-ce qu'on pourrait bien dévorer ?","CYRANO (lui jetant le livre qu'il tient à la main):\nL'Iliade.","UN AUTRE:\nLe ministre, à Paris, fait ses quatre repas !","CYRANO:\nIl devrait t'envoyer du perdreau ?","LE MÊME:\nPourquoi pas ?\nEt du vin !","CYRANO:\nRichelieu, du Bourgogne, if you please ?","LE MÊME:\nPar quelque capucin !","CYRANO:\nL'éminence qui grise ?","UN AUTRE:\nJ'ai des faims d'ogre !","CYRANO:\nEh ! bien !. . .tu croques le marmot !","LE PREMIER CADET (haussant les épaules):\nToujours le mot, la pointe !","CYRANO:\nOui, la pointe, le mot !\nEt je voudrais mourir, un soir, sous un ciel rose,\nEn faisant un bon mot, pour une belle cause !\n--Oh ! frappé par la seule arme noble qui soit,\nEt par un ennemi qu'on sait digne de soi,\nSur un gazon de gloire et loin d'un lit de fièvres,\nTomber la pointe au cœur en même temps qu'aux lèvres !","CRIS DE TOUS:\nJ'ai faim !","CYRANO (se croisant les bras):\nAh çà ! mais vous ne pensez qu'à manger ?. . .\n--Approche, Bertrandou le fifre, ancien berger;\nDu double étui de cuir tire l'un de tes fifres,\nSouffle, et joue à ce tas de goinfres et de piffres\nCes vieux airs du pays, au doux rythme obsesseur,\nDont chaque note est comme une petite sœur,\nDans lesquels restent pris des sons de voix aimées,\nCes airs dont la lenteur est celle des fumées\nQue le hameau natal exhale de ses toits,\nCes airs dont la musique a l'air d'être en patois !. . .\n(Le vieux s'assied et prépare son fifre):\nQue la flûte, aujourd'hui, guerrière qui s'afflige,\nSe souvienne un moment, pendant que sur sa tige\nTes doigts semblent danser un menuet d'oiseau,\nQu'avant d'être d'ébène, elle fut de roseau;\nQue sa chanson l'étonne, et qu'elle y reconnaisse\nL'âme de sa rustique et paisible jeunesse !. . .\n(Le vieux commence à jouer des airs languedociens):\nÉcoutez, les Gascons. . .Ce n'est plus, sous ses doigts,\nLe fifre aigu des camps, c'est la flûte des bois !\nCe n'est plus le sifflet du combat, sous ses lèvres,\nC'est le lent galoubet de nos meneurs de chèvres !. . .\nÉcoutez. . .C'est le val, la lande, la forêt,\nLe petit pâtre brun sous son rouge béret,\nC'est la verte douceur des soirs sur la Dordogne,\nÉcoutez, les Gascons: c'est toute la Gascogne !\n(Toutes les têtes se sont inclinées;--tous les yeux rêvent;--et des\nlarmes sont furtivement essuyées, avec un revers de manche, un coin de\nmanteau.)","CARBON (à Cyrano, bas):\nMais tu les fais pleurer !","CYRANO:\nDe nostalgie !. . .Un mal\nPlus noble que la faim !. . . pas physique: moral !\nJ'aime que leur souffrance ait changé de viscère,\nEt que ce soit leur cœur, maintenant, qui se serre !","CARBON:\nTu vas les affaiblir en les attendrissant !","CYRANO (qui a fait signe au tambour d'approcher):\nLaisse donc ! Les héros qu'ils portent dans leur sang\nSont vite réveillés ! Il suffit. . .\n(Il fait un geste. Le tambour roule.)","TOUS (se levant et se précipitant sur leurs armes):\nHein ?. . .Quoi ?. . .Qu'est-ce ?","CYRANO (souriant):\nTu vois, il a suffi d'un roulement de caisse !\nAdieu, rêves, regrets, vieille province, amour. . .\nCe qui du fifre vient s'en va par le tambour !","UN CADET (qui regarde au fond):\nAh ! Ah ! Voici monsieur de Guiche.","TOUS LES CADETS (murmurant):\nHou. . .","CYRANO (souriant):\nMurmure\nFlatteur !","UN CADET:\nIl nous ennuie !","UN AUTRE:\nAvec, sur son armure,\nSon grand col de dentelle, il vient faire le fier !","UN AUTRE:\nComme si l'on portait du linge sur du fer !","LE PREMIER:\nC'est bon lorsque à son cou l'on a quelque furoncle !","LE DEUXIÈME:\nEncore un courtisan !","UN AUTRE:\nLe neveu de son oncle !","CARBON:\nC'est un Gascon pourtant !","LE PREMIER:\nUn faux !. . .Méfiez-vous !\nParce que, les Gascons. . .ils doivent être fous:\nRien de plus dangereux qu'un Gascon raisonnable.","LE BRET:\nIl est pâle !","UN AUTRE:\nIl a faim. . .autant qu'un pauvre diable !\nMais comme sa cuirasse a des clous de vermeil,\nSa crampe d'estomac étincelle au soleil !","CYRANO (vivement):\nN'ayons pas l'air non plus de souffrir ! Vous, vos cartes,\nVos pipes et vos dés. . .\n(Tous rapidement se mettent à jouer sur des tambours, sur des\nescabeaux et par terre, sur leurs manteaux, et ils allument de longues\npipes de pétun):\nEt moi, je lis Descartes.\n(Il se promène de long en large et lit dans un petit livre qu'il a\ntiré de sa poche.--Tableau.--De Guiche entre. Tout le monde a l'air\nabsorbé et content. Il est très pâle. Il va vers Carbon.)","Scène 4.IV.","Les mêmes, de Guiche.","DE GUICHE (à Carbon):\nAh !--Bonjour !\n(Ils s'observent tous les deux. A part, avec satisfaction):\nIl est vert.","CARBON (de même):\nIl n'a plus que les yeux.","DE GUICHE (regardant les cadets):\nVoici donc les mauvaises têtes ?. . .Oui, messieurs,\nIl me revient de tous côtés qu'on me brocarde\nChez vous, que les cadets, noblesse montagnarde,\nHobereaux béarnais, barons périgourdins,\nN'ont pour leur colonel pas assez de dédains,\nM'appellent intrigant, courtisan,--qu'il les gêne\nDe voir sur ma cuirasse un col en point de Gêne,--\nEt qu'ils ne cessent pas de s'indigner entre eux\nQu'on puisse être Gascon et ne pas être gueux !\n(Silence. On joue. On fume):\nVous ferai-je punir par votre capitaine ?\nNon.","CARBON:\nD'ailleurs, je suis libre et n'inflige de peine. . .","DE GUICHE:\nAh ?","CARBON:\nJ'ai payé ma compagnie, elle est à moi.\nJe n'obéis qu'aux ordres de guerre.","DE GUICHE:\nAh ?. . .Ma foi !\nCela suffit.\n(S'adressant aux cadets):\nJe peux mépriser vos bravades.\nOn connaît ma façon d'aller aux mousquetades;\nHier, à Bapaume, on vit la furie avec quoi\nJ'ai fait lâcher le pied au comte de Bucquoi;\nRamenant sur ses gens les miens en avalanche,\nJ'ai chargé par trois fois !","CYRANO (sans lever le nez de son livre):\nEt votre écharpe blanche ?","DE GUICHE (surpris et satisfait):\nVous savez ce détail ?. . .En effet, il advint,\nDurant que je faisais ma caracole afin\nDe rassembler mes gens la troisième charge,\nQu'un remous de fuyards m'entraîna sur la marge\nDes ennemis; j'étais en danger qu'on me prît\nEt qu'on m'arquebusât, quand j'eus le bon esprit\nDe dénouer et de laisser couler à terre\nL'écharpe qui disait mon grade militaire;\nEn sorte que je pus, sans attirer les yeux,\nQuitter les Espagnols, et revenant sur eux,\nSuivi de tous les miens réconfortés, les battre !\n--Eh bien ! que dites-vous de ce trait ?\n(Les cadets n'ont pas l'air d'écouter; mais ici les cartes et les\ncornets à dés restent en l'air, la fumée des pipes demeure dans les\njoues: attente.)","CYRANO:\nQu'Henri quatre\nN'eût jamais consenti, le nombre l'accablant,\nA se diminuer de son panache blanc.\n(Joie silencieuse. Les cartes s'abattent. Les dés tombe. La fumée\ns'échappe.)","DE GUICHE:\nL'adresse a réussi, cependant !\n(Même attente suspendant les jeux et les pipes.)","CYRANO:\nC'est possible.\nMais on n'abdique pas l'honneur d'être une cible.\n(Cartes, dés, fumées, s'abattent, tombent, s'envolent avec une\nsatisfaction croissante):\nSi j'eusse été présent quand l'écharpe coula\n--Nos courages, monsieur, diffèrent en cela--\nJe l'aurais ramassée et me la serais mise.","DE GUICHE:\nOui, vantardise, encor, de gascon !","CYRANO:\nVantardise ?. . .\nPrêtez-la-moi. Je m'offre à monter, dès ce soir,\nA l'assaut, le premier, avec elle en sautoir.","DE GUICHE:\nOffre encor de gascon ! Vous savez que l'écharpe\nResta chez l'ennemi, sur les bords de la Scarpe,\nEn un lieu que depuis la mitraille cribla,--\nOù nul ne peut aller la chercher !","CYRANO (tirant de sa poche l'écharpe blanch
