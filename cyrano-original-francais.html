<script type="application/json" id="texte">[{"name":"Titre, dédicace et personnages","paragraphs":["This etext was prepared by Sue Asscher","CYRANO DE BERGERAC","Edmond Rostand","Comédie Héroïque en Cinq Actes\nen vers","Représentée à Paris, sur le Théâtre de la Porte-Saint-Martin\nle 28 décembre 1897","C'est à l'âme de CYRANO que je voulais dédier ce poème.","Mais puisqu'elle a passé en vous, COQUELIN, c'est à vous\nque je le dédie.","E. R.","Personnages:","CYRANO DE BERGERAC\nCHRISTIAN DE NEUVILLETTE\nCOMTE DE GUICHE\nRAGUENEAU\nLE BRET\nCARBON DE CASTEL-JALOUX\nLES CADETS\nLIGNIÈRE\nDE VALVERT\nUN MARQUIS\nDEUXIÈME MARQUIS\nTROISIÈME MARQUIS\nMONTFLEURY\nBELLEROSE\nJODELET\nCUIGY\nBRISSAILLE\nUN FÂCHEUX\nUN MOUSQUETAIRE\nUN AUTRE\nUN OFFICIER ESPAGNOL\nUN CHEVAU-LÉGER\nLE PORTIER\nUN BOURGEOIS\nSON FILS\nUN TIRE-LAINE\nUN SPECTATEUR\nUN GARDE\nBERTRANDOU LE FIFRE\nLE CAPUCIN\nDEUX MUSICIENS\nLES POÈTES\nLES PATISSIERS\nROXANE\nSŒUR MARTHE\nLISE\nLA DISTRIBUTRICE\nMÈRE MARGUERITE DE JÉSUS\nLA DUÈGNE\nSŒUR CLAIRE\nUNE COMÉDIENNE\nLA SOUBRETTE\nLES PAGES\nLA BOUQUETIÈRE","La foule, bourgeois, marquis, mousquetaires, tire-laine, pâtissiers,\npoètes, cadets gascons, comédiens, violons, pages, enfants, soldats,\nespagnols, spectateurs, spectatrices, précieuses, comédiennes,\nbourgeoises, religieuses, etc.","(Les quatre premiers actes en 1640, le cinquième en 1655.)"]},{"name":"Acte I","paragraphs":["Une Représentation à l'Hôtel de Bourgogne.","La salle de l'Hôtel de Bourgogne, en 1640. Sorte de hangar de jeu de\npaume aménagé et embelli pour des représentations.","La salle est un carré long; on la voit en biais, de sorte qu'un de ses\ncôtés forme le fond qui part du premier plan, à droite, et va au dernier\nplan, à gauche, faire angle avec la scène, qu'on aperçoit en pan coupé.","Cette scène est encombrée, des deux côtés, le long des coulisses, par\ndes banquettes. Le rideau est formé par deux tapisseries qui peuvent\ns'écarter. Au-dessus du manteau d'Arlequin, les armes royales. On\ndescend de l'estrade dans la salle par de larges marches. De chaque côté\nde ces marches, la place des violons. Rampe de chandelles.","Deux rangs superposés de galeries latérales: le rang supérieur est\ndivisé en loges. Pas de sièges au parterre, qui est la scène même du\nthéâtre; au fond de ce parterre, c'est-à-dire à droite, premier plan,\nquelques bancs formant gradins et, sous un escalier qui monte vers des\nplaces supérieures, et dont on ne voit que le départ, une sorte de\nbuffet orné de petits lustres, de vases fleuris, de verres de cristal,\nd'assiettes de gâteaux, de flacons, etc.","Au fond, au milieu, sous la galerie de loges, l'entrée du théâtre.\nGrande porte qui s'entre-bâille pour laisser passer les spectateurs. Sur\nles battants de cette porte, ainsi que dans plusieurs coins et au-dessus\ndu buffet, des affiches rouges sur lesquelles on lit: La Clorise.","Au lever du rideau, la salle est dans une demi-obscurité, vide encore.\nLes lustres sont baissés au milieu du parterre, attendant d'être\nallumés.","Scène 1.I.","Le public, qui arrive peu à peu. Cavaliers, bourgeois, laquais, pages,\ntire-laine, le portier, etc., puis les marquis, Cuigy, Brissaille, la\ndistributrice, les violons, etc.","(On entend derrière la porte un tumulte de voix, puis un cavalier\nentre brusquement.)","LE PORTIER (le poursuivant):\nHolà ! vos quinze sols !","LE CAVALIER:\nJ'entre gratis !","LE PORTIER:\nPourquoi ?","LE CAVALIER:\nJe suis chevau-léger de la maison du Roi !","LE PORTIER (à un autre cavalier qui vient d'entrer):\nVous ?","DEUXIÈME CAVALIER:\nJe ne paye pas !","LE PORTIER:\nMais. . .","DEUXIÈME CAVALIER:\nJe suis mousquetaire.","PREMIER CAVALIER (au deuxième):\nOn ne commence qu'à deux heures. Le parterre\nEst vide. Exerçons-nous au fleuret.\n(Ils font des armes avec des fleurets qu'ils ont apportés.)","UN LAQUAIS (entrant):\nPst. . .Flanquin. . . !","UN AUTRE (déjà arrivé):\nChampagne ?. . .","LE PREMIER (lui montrant des jeux qu'il sort de son pourpoint):\nCartes. Dés.\n(Il s'assied par terre):\nJouons.","LE DEUXIÈME (même jeu):\nOui, mon coquin.","PREMIER LAQUAIS (tirant de sa poche un bout de chandelle qu'il allume\net colle par terre):\nJ'ai soustrait à mon maître un peu de luminaire.","UN GARDE (à une bouquetière qui s'avance):\nC'est gentil de venir avant que l'on n'éclaire !. . .\n(Il lui prend la taille.)","UN DES BRETTEURS (recevant un coup de fleuret):\nTouche !","UN DES JOUEURS:\nTrèfle !","LE GARDE (poursuivant la fille):\nUn baiser !","LA BOUQUETIÈRE (se dégageant):\nOn voit !. . .","LE GARDE (l'entraînant dans les coins sombres):\nPas de danger !","UN HOMME (s'asseyant par terre avec d'autres porteurs de provisions\nde bouche):\nLorsqu'on vient en avance, on est bien pour manger.","UN BOURGEOIS (conduisant son fils):\nPlaçons-nous là, mon fils.","UN JOUEUR:\nBrelan d'as !","UN HOMME (tirant une bouteille de sous son manteau et s'asseyant aussi):\nUn ivrogne\nDoit boire son bourgogne. . .\n(il boit):\nÀ l'hôtel de Bourgogne !","LE BOURGEOIS (à son fils):\nNe se croirait-on pas en quelque mauvais lieu ?\n(Il montre l'ivrogne du bout de sa canne):\nBuveurs. . .\n(En rompant, un des cavaliers le bouscule):\nBretteurs !\n(Il tombe au milieu des joueurs):\nJoueurs !","LE GARDE (derrière lui, lutinant toujours la femme):\nUn baiser !","LE BOURGEOIS (éloignant vivement son fils):\nJour de Dieu !\n--Et penser que c'est dans une salle pareille\nQu'on joua du Rotrou, mon fils.","LE JEUNE HOMME:\nEt du Corneille !","UNE BANDE DE PAGES (se tenant par la main, entre en farandole et chante):\nTra la la la la la la la la la la lère. . .","LE PORTIER (sévèrement aux pages):\nLes pages, pas de farce !. . .","PREMIER PAGE (avec une dignité blessée):\nOh ! Monsieur ! ce soupçon !. . .\n(Vivement au deuxième, dès que le portier a tourné le dos):\nAs-tu de la ficelle ?","LE DEUXIÈME:\nAvec un hameçon.","PREMIER PAGE:\nOn pourra de là-haut pêcher quelque perruque.","UN TIRE-LAINE (groupant autour de lui plusieurs hommes de mauvaise mine):\nOr çà, jeunes escrocs, venez qu'on vous éduque:\nPuis donc que vous volez pour la première fois. . .","DEUXIÈME PAGE (criant à d'autres pages déjà placés aux galeries supérieures):\nHep ! Avez-vous des sarbacanes ?","TROISIÈME PAGE (d'en haut):\nEt des pois !\n(Il souffle et les crible de pois.)","LE JEUNE HOMME (à son père):\nQue va-t-on nous jouer ?","LE BOURGEOIS:\nClorise.","LE JEUNE HOMME:\nDe qui est-ce ?","LE BOURGEOIS:\nDe monsieur Balthazar Baro. C'est une pièce !. . .\n(Il remonte au bras de son fils.)","LE TIRE-LAINE (à ses acolytes):\n. . .La dentelle surtout des canons, coupez-la !","UN SPECTATEUR (à un autre, lui montrant une encoignure élevée):\nTenez, à la première du Cid, j'étais là !","LE TIRE-LAINE (faisant avec ses doigts le geste de subtiliser):\nLes montres. . .","LE BOURGEOIS (redescendant, à son fils):\nVous verrez des acteurs très illustres. . .","LE TIRE-LAINE (faisant le geste de tirer par petites secousses furtives):\nLes mouchoirs. . .","LE BOURGEOIS:\nMontfleury. . .","QUELQU'UN (criant de la galerie supérieure):\nAllumez donc les lustres !","LE BOURGEOIS:\n. . .Bellerose, L'Epy, la Beaupré, Jodelet !","UN PAGE (au parterre):\nAh ! voici la distributrice !","LA DISTRIBUTRICE (paraissant derrière le buffet):\nOranges, lait,\nEau de frambroise, aigre de cèdre !\n(Brouhaha à la porte.)","UNE VOIX DE FAUSSET:\nPlace, brutes !","UN LAQUAIS (s'étonnant):\nLes marquis !. . .au parterre ?. . .","UN AUTRE LAQUAIS:\nOh ! pour quelques minutes.\n(Entre une bande de petits marquis.)","UN MARQUIS (voyant la salle à moitié vide):\nHé quoi ! Nous arrivons ainsi que les drapiers,\nSans déranger les gens ? sans marcher sur les pieds ?\nAh, fi ! fi ! fi !\n(Is se trouve devant d'autres gentilshommes entrés peu avant):\nCuigy ! Brissaille !\n(Grandes embrassades.)","CUIGY:\nDes fidèles !. . .\nMais oui, nous arrivons devant que les chandelles. . .","LE MARQUIS:\nAh, ne m'en parlez pas ! Je suis dans une humeur. . .","UN AUTRE:\nConsole-toi, marquis, car voici l'allumeur !","LA SALLE (saluant l'entrée de l'allumeur):\nAh !. . .\n(On se groupe autour des lustres qu'il allume. Quelques personnes ont\npris place aux galeries. Lignière entre au parterre, donnant le bras à\nChristian de Neuvillette. Lignière, un peu débraillé, figure d'ivrogne\ndistingué. Christian, vêtu élégamment, mais d'une façon un peu\ndémodée, paraît préoccupé et regarde les loges.)","Scène 1.II.","Les mêmes, Christian, Lignière, puis Ragueneau et Le Bret.","CUIGY:\nLignière !","BRISSAILLE (riant):\nPas encor gris !. . .","LIGNIÈRE (bas à Christian):\nJe vous présente ?\n(Signe d'assentiment de Christian):\nBaron de Neuvillette.\n(Saluts.)","LA SALLE (acclamant l'ascension du premier lustre allumé):\nAh !","CUIGY (à Brissaille, en regardant Christian):\nLa tête est charmante.","PREMIER MARQUIS (qui a entendu):\nPeuh !. . .","LIGNIÈRE (présentant à Christian):\nMessieurs de Cuigy, de Brissaille. . .","CHRISTIAN (s'inclinant):\nEnchanté !. . .","PREMIER MARQUIS (au deuxième):\nIl est assez joli, mais n'est pas ajusté\nAu dernier goût.","LIGNIÈRE (à Cuigy):\nMonsieur débarque de Touraine.","CHRISTIAN:\nOui, je suis à Paris depuis vingt jours à peine.\nJ'entre aux gardes demain, dans les Cadets.","PREMIER MARQUIS (regardant les personnes qui entrent dans les loges):\nVoilà\nLa présidente Aubry !","LA DISTRIBUTRICE:\nOranges, lait. . .","LES VIOLONS (s'accordant):\nLa. . .la. . .","CUIGY (à Christian, lui désignant la salle qui se garnit):\nDu monde !","CHRISTIAN:\nEh, oui, beaucoup,","PREMIER MARQUIS:\nTout le bel air !\n(Ils nomment les femmes à mesure qu'elles entrent, très parées, dans\nles loges. Envois de saluts, réponses de sourires.)","DEUXIÈME MARQUIS:\nMesdames\nDe Guéméné. . .","CUIGY:\nDe Bois-Dauphin. . .","PREMIER MARQUIS:\nQue nous aimâmes. . .","BRISSAILLE:\nDe Chavigny. . .","DEUXIÈME MARQUIS:\nQui de nos cœurs va se jouant !","LIGNIÈRE:\nTiens, monsieur de Corneille est arrivé de Rouen.","LE JEUNE HOMME (à son père):\nL'Académie est là ?","LE BOURGEOIS:\nMais. . .j'en vois plus d'un membre;\nVoici Boudu, Boissat, et Cureau de la Chambre;\nPorchères, Colomby, Bourzeys, Bourdon, Arbaud. . .\nTous ces noms dont pas un ne mourra, que c'est beau !","PREMIER MARQUIS:\nAttention ! nos précieuses prennent place:\nBarthénoïde, Urimédonte, Cassandace,\nFélixérie. . .","DEUXIÈME MARQUIS (se pâmant):\nAh ! Dieu ! leurs surnoms sont exquis !\nMarquis, tu les sais tous ?","PREMIER MARQUIS:\nJe les sais tous, marquis !","LIGNIÈRE (prenant Christian à part):\nMon cher, je suis entré pour vous rendre service:\nLa dame ne vient pas. Je retourne à mon vice !","CHRISTIAN (suppliant):\nNon !. . .Vous, qui chansonnez et la ville et la cour,\nRestez: vous me direz pour qui je meurs d'amour.","LE CHEF DES VIOLONS (frappant sur son pupitre, avec son archet):\nMessieurs les violons !. . .\n(Il lève son archet.)","LA DISTRIBUTRICE:\nMacarons, citronnée. . .\n(Les violons commencent à jouer.)","CHRISTIAN:\nJ'ai peur qu'elle ne soit coquette et raffinée,\nJe n'ose lui parler car je n'ai pas d'esprit.\nLe langage aujourd'hui qu'on parle et qu'on écrit,\nMe trouble. Je ne suis qu'un bon soldat timide.\n--Elle est toujours à droite, au fond: la loge vide.","LIGNIÈRE (faisant mine de sortir):\nJe pars.","CHRISTIAN (le retenant encore):\nOh ! non, restez !","LIGNIÈRE:\nJe ne peux. D'Assoucy\nM'attend au cabaret. On meurt de soif, ici.","LA DISTRIBUTRICE (passant devant lui avec un plateau):\nOrangeade ?","LIGNIÈRE:\nFi !","LA DISTRIBUTRICE:\nLait ?","LIGNIÈRE:\nPouah !","LA DISTRIBUTRICE:\nRivesalte ?","LIGNIÈRE:\nHalte !\n(A Christian):\nJe reste encore un peu.--Voyons ce rivesalte ?\n(Il s'assied près du buffet. La distributrice lui verse du rivesalte.)","CRIS (dans le public à l'entrée d'un petit homme grassouillet et réjoui):\nAh ! Ragueneau !. . .","LIGNIÈRE (à Christian):\nLe grand rôtisseur Ragueneau.","RAGUENEAU (costume de pâtissier endimanché, s'avançant vivement vers\nLignière):\nMonsieur, avez-vous vu monsieur de Cyrano ?","LIGNIÈRE (présentant Ragueneau à Christian):\nLe pâtissier des comédiens et des poètes !","RAGUENEAU (se confondant):\nTrop d'honneur. . .","LIGNIÈRE:\nTaisez-vous, Mécène que vous êtes !","RAGUENEAU:\nOui, ces messieurs chez moi se servent. . .","LIGNIÈRE:\nA crédit.\nPoète de talent lui-même. . .","RAGUENEAU:\nIls me l'ont dit.","LIGNIÈRE:\nFou de vers !","RAGUENEAU:\nIl est vrai que pour une odelette. . .","LIGNIÈRE:\nVous donnez une tarte. . .","RAGUENEAU:\nOh ! une tartelette !","LIGNIÈRE:\nBrave homme, il s'en excuse ! Et pour un triolet\nNe donnâtes-vous pas ?. . .","RAGUENEAU:\nDes petits pains !","LIGNIÈRE (sévèrement):\nAu lait.\n--Et le théâtre, vous l'aimez ?","RAGUENEAU:\nJe l'idolâtre.","LIGNIÈRE:\nVous payez en gâteaux vos billets de théâtre !\nVotre place, aujourd'hui, là, voyons, entre nous,\nVous a coûté combien ?","RAGUENEAU:\nQuatre flans. Quinze choux.\n(Il regarde de tous côtés):\nMonsieur de Cyrano n'est pas là ? Je m'étonne.","LIGNIÈRE:\nPourquoi ?","RAGUENEAU:\nMontfleury joue !","LIGNIÈRE:\nEn effet, cette tonne\nVa nous jouer ce soir le rôle de Phédon.\nQu'importe à Cyrano ?","RAGUENEAU:\nMais vous ignorez donc ?\nIl fit à Montfleury, messieurs, qu'il prit en haine,\nDéfense, pour un mois, de reparaître en scène.","LIGNIÈRE (qui en est à son quatrième petit verre):\nEh bien ?","RAGUENEAU:\nMontfleury joue !","CUIGY (qui s'est rapproché de son groupe):\nIl n'y peut rien.","RAGUENEAU:\nOh ! oh !\nMoi, je suis venu voir !","PREMIER MARQUIS:\nQuel est ce Cyrano ?","CUIGY:\nC'est un garcon versé dan les colichemardes.","DEUXIÈME MARQUIS:\nNoble ?","CUIGY:\nSuffisamment. Il est cadet aux gardes.\n(Montrant un gentilhomme qui va et vient dans la salle comme s'il\ncherchait quelqu'un):\nMais son ami Le Bret peut vous dire. . .\n(Il appelle):\nLe Bret !\n(Le Bret descend vers eux):\nVous cherchez Bergerac ?","LE BRET:\nOui, je suis inquiet !. . .","CUIGY:\nN'est-ce pas que cet homme est des moins ordinaires ?","LE BRET (avec tendresse):\nAh, c'est le plus exquis des êtres sublunaires !","RAGUENEAU:\nRimeur !","CUIGY:\nBretteur !","BRISSAILLE:\nPhysicien !","LE BRET:\nMusicien !","LIGNIÈRE:\nEt quel aspect hétéroclite que le sien !","RAGENEAU:\nCertes, je ne crois pas que jamais nous le peigne\nLe solennel monsieur Philippe de Champaigne;\nMais bizarre, excessif, extravagant, falot,\nIl eût fourni, je pense, à feu Jacques Callot\nLe plus fol spadassin à mettre entre ses masques:\nFeutre à panache triple et pourpoint à six basques,\nCape que par derrière, avec pompe, l'estoc\nLève, comme une queue insolente de coq,\nPlus fier que tous les Artabans dont la Gascogne\nFut et sera toujours l'alme Mère Gigogne,\nIl promène, en sa fraise à la Pulcinella,\nUn nez !. . .Ah ! messeigneurs, quel nez que ce nez-là !. . .\nOn ne peut voir passer un pareil nasigère\nSans s'écrier: \"Oh ! non, vraiment, il exagère !\"\nPuis on sourit, on dit: \"Il va l'enlever. . .\" Mais\nMonsieur de Bergerac ne l'enlève jamais.","LE BRET (hochant la tête):\nIl le porte,--et pourfend quiconque le remarque !","RAGUENEAU (fièrement):\nSon glaive est la moitié des ciseaux de la Parque !","PREMIER MARQUIS (haussant les épaules):\nIl ne viendra pas !","RAGUENEAU:\nSi !. . .Je parie un poulet\nA la Ragueneau !","LE MARQUIS (riant):\nSoit !\n(Rumeurs d'admiration dan la salle. Roxane vient de paraître dans sa\nloge. Elle s'assied sur le devant, sa duègne prend place au fond.\nChristian, occupé à payer la distributrice, ne regarde pas.)","DEUXIÈME MARQUIS (avec des petit cris):\nAh, messieurs ! mais elle est\nÉpouvantablement ravissante !","PREMIER MARQUIS:\nUne pêche\nQui sourirait avec une fraise !","DEUXIÈME MARQUIS:\nEt si fraîche\nQu'on pourrait, l'approchant, prendre un rhume de cœur !","CHRISTIAN (lève la tête, aperçoit Roxane, et saisit vivement Lignière\npar le bras):\nC'est elle !","LIGNIÈRE (regardant):\nAh ! c'est elle ?. . .","CHRISTIAN:\nOui. Dites vite. J'ai peur.","LIGNIÈRE (dégustant son rivesalte à petits coups):\nMagdaleine Robin, dite Roxane.--Fine.\nPrécieuse.","CHRISTIAN:\nHélas !","LIGNIÈRE:\nLibre. Orpheline. Cousine\nDe Cyrano,--dont on parlait. . .\n(A ce moment, un seigneur très élégant, le cordon bleu en sautoir,\nentre dans la loge et, debout, cause un instant avec Roxane.)","CHRISTIAN (tressaillant):\nCet homme ?. . .","LIGNIÈRE (qui commence à être gris, clignant de l'œil):\nHé ! hé !. . .\n--Comte de Guiche. Épris d'elle. Mais marié\nA la nièce d'Armand de Richelieu. Désire\nFaire épouser Roxane à certain triste sire,\nUn monsieur de Valvert, vicomte. . .et complaisant.\nElle n'y souscrit pas, mais de Guiche est puissant:\nIl peut persécuter une simple bourgeoise.\nD'ailleurs j'ai dévoilé sa manœuvre sournoise\nDans une chanson qui. . .Ho ! il doit m'en vouloir !\n--La fin était méchante. . .Écoutez. . .\n(Il se lève en titubant, le verre haut, prêt a chanter.)","CHRISTIAN:\nNon. Bonsoir.","LIGNIÈRE:\nVous allez ?","CHRISTIAN:\nChez monsieur de Valvert !","LIGNIÈRE:\nPrenez garde:\nC'est lui qui vous tuera !\n(Lui désignant du coin de l'œil Roxane):\nRestez. On vous regarde.","CHRISTIAN:\nC'est vrai !\n(Il reste en contemplation. Le groupe de tire-laine, à partir de ce\nmoment, le voyant la tête en l'air et bouche bée, se rapproche de\nlui.)","LIGNIÈRE:\nC'est moi qui pars. J'ai soif ! Et l'on m'attend\n--Dans les tavernes !\n(Il sort, zigzaguant.)","LE BRET (qui a fait le tour de la salle, revenant vers Ragueneau, d'une\nvoix rassurée):\nPas de Cyrano.","RAGUENEAU (incrédule):\nPourtant. . .","LE BRET:\nAh ! je veux espérer qu'il n'a pas vu l'affiche !","LA SALLE:\nCommencez ! Commencez !","Scène 1.III.","Les mêmes, moins Lignière; De Guiche, Valvert, puis Montfleury.","UN MARQUIS (voyant de Guiche, qui descend de la loge de Roxane, traverse\nle parterre, entouré de seigneurs obséquieux, parmi lesquels le vicomte\nde Valvert):\nQuelle cour, ce de Guiche !","UN AUTRE:\nFi !. . .Encore un Gascon !","LE PREMIER:\nLe Gascon souple et froid,\nCelui qui réussit !. . .Saluons-le, crois-moi.\n(Ils vont vers de Guiche.)","DEUXIÈME MARQUIS:\nLes beaux rubans ! Quelle couleur, comte de Guiche ?\nBaise-moi-ma-mignonne ou bien Ventre-de-biche ?","DE GUICHE:\nC'est couleur Espagnol malade.","PREMIER MARQUIS:\nLa couleur\nNe ment pas, car bientôt, grâce à votre valeur,\nL'Espagnol ira mal, dans les Flandres !","DE GUICHE:\nJe monte\nSur scène. Venez-vous ?\n(Il se dirige, suivi de tous les marquis et gentilshommes, vers le\nthéâtre. Il se retourne et appelle):\nViens, Valvert !","CHRISTIAN (qui les écoute et les observe, tressaille en entendant ce nom):\nLe vicomte !\nAh ! je vais lui jeter à la face mon. . .\n(Il met la main dans sa poche, et y rencontre celle d'un tire-laine en\ntrain de le dévaliser. Il se retourne):\nHein ?","LE TIRE-LAINE:\nAy !. . .","CHRISTIAN (sans le lâcher):\nJe cherchais un gant !","LE TIRE-LAINE (avec un sourire piteux):\nVous trouvez une main.\n(Changeant de ton, bas et vite):\nLâchez-moi. Je vous livre un secret.","CHRISTIAN (le tenant toujours):\nQuel ?","LE TIRE-LAINE:\nLignière. . .\nQui vous quitte. . .","CHRISTIAN (de même):\nEh ! bien ?","LE TIRE-LAINE:\n. . .touche à son heure dernière.\nUne chanson qu'il fit blessa quelqu'un de grand,\nEt cent hommes--j'en suis--ce soir sont postés !. . .","CHRISTIAN:\nCent !\nPar qui ?","LE TIRE-LAINE:\nDiscrétion. . .","CHRISTIAN (haussant les épaules):\nOh !","LE TIRE-LAINE (avec beaucoup de dignité):\nProfessionnelle !","CHRISTIAN:\nOù seront-ils postés ?","LE TIRE-LAINE:\nÀ la porte de Nesle.\nSur son chemin. Prévenez-le !","CHRISTIAN (qui lui lâche enfin le poignet):\nMais où le voir !","LE TIRE-LAINE:\nAllez courir tous les cabarets: le Pressoir\nD'Or, la Pomme de Pin, la Ceinture qui craque,\nLes Deux Torches, les Trois Entonnoirs,--et dans chaque,\nLaissez un petit mot d'écrit l'avertissant.","CHRISTIAN:\nOui, je cours ! Ah ! les gueux ! Contre un seul homme, cent !\n(Regardant Roxane avec amour):\nLa quitter. . .elle !\n(Avec fureur, Valvert):\nEt lui !. . .--Mais il faut que je sauve\nLignière !. . .\n(Il sort en courant.--De Guiche, le vicomte, les marquis, tous les\ngentilshommes ont disparu derrière le rideau pour prendre place sur\nles banquettes de la scène. Le parterre est complètement rempli. Plus\nune place vide aux galeries et aux loges.)","LA SALLE:\nCommencez.","UN BOURGEOIS (dont la perruque s'envole au bout d'une ficelle, pêchée\npar un page de la galerie supérieure):\nMa perruque !","CRIS DE JOIE:\nIl est chauve !. . .\nBravo, les pages !. . .Ha ! ha ! ha !. . .","LE BOURGEOIS (furieux, montrant le poing):\nPetit gredin !","RIRES ET CRIS (qui commencent très fort et vont décroissant):\nHa ! ha ! ha ! ha ! ha ! ha !\n(Silence complet.)","LE BRET (étonné):\nCe silence soudain ?. . .\n(Un spectateur lui parle bas):\nAh ?","LE SPECTATEUR:\nLa chose me vient d'être certifiée.","MURMURES (qui courent):\nChut !--Il paraît ?. . .--Non !. . .--Si !--Dans la loge grillée.--\nLe Cardinal !--Le Cardinal ?--Le Cardinal !","UN PAGE:\nAh ! diable, on ne va pas pouvoir se tenir mal !. . .\n(On frappe sur la scène. Tout le monde s'immobilise. Attente.)","LA VOIX D'UN MARQUIS (dans le silence, derrière le rideau):\nMouchez cette chandelle !","UN AUTRE MARQUIS (passant la tête par la fente du rideau):\nUne chaise !\n(Une chaise est passée, de main en main, au-dessus des têtes. Le\nmarquis la prend et disparaît, non sans avoir envoyé quelques baisers\naux loges.)","UN SPECTATEUR:\nSilence !\n(On refrappe les trois coups. Le rideau s'ouvre. Tableau. Les marquis\nassis sur les côtés, dans des poses insolentes. Toile de fond\nreprésentant un décor bleuâtre de pastorale. Quatre petits lustres de\ncristal éclairent la scène. Les violons jouent doucement.)","LE BRET (à Ragueneau, bas):\nMontfleury entre en scène ?","RAGUENEAU (bas aussi):\nOui, c'est lui qui commence.","LE BRET:\nCyrano n'est pas là.","RAGUENEAU:\nJ'ai perdu mon pari.","LE BRET:\nTant mieux ! tant mieux !\n(On entend un air de musette, et Montfleury paraît en scène, énorme,\ndans un costume de berger de pastorale, un chapeau garni de roses\npenché sur l'oreille, et soufflant dans une cornemuse enrubannée.)","LE PARTERRE (applaudissant):\nBravo, Montfleury ! Montfleury !","MONTFLEURY (après avoir salué, jouant le rôle de Phédon):\nHeureux qui loin des cours, dans un lieu solitaire,\nSe prescrit à soi-même un exil volontaire,\nEt qui, lorsque Zéphire a soufflé sur les bois. . .","UNE VOIX (au milieu du parterre):\nCoquin, ne t'ai-je pas interdit pour un mois ?\n(Stupeur. Tout le monde se retourne. Murmures.)","VOIX DIVERSES:\nHein ?--Quoi ?--Qu'est-ce ?. . .\n(On se lève dans les loges, pour voir.)","CUIGY:\nC'est lui !","LE BRET (terrifié):\nCyrano !","LA VOIX:\nRoi des pitres !\nHors de scène a l'instant !","TOUTE LA SALLE (indignée):\nOh !","MONTFLEURY:\nMais. . .","LA VOIX:\nTu récalcitres ?","VOIX DIVERSES (du parterre, des loges):\nChut !--Assez !--Montfleury, jouez !--Ne craignez rien !. . .","MONTFLEURY (d'une voix mal assurée):\nHeureux qui loin des cours dans un lieu sol. . .","LA VOIX (plus menaçante):\nEh bien !\nFaudra-t-il que je fasse, ô Monarque des drôles,\nUne plantation de bois sur vos épaules ?\n(Une canne au bout d'un bras jaillit au-dessus des têtes.)","MONTFLEURY (d'une voix de plus en plus faible):\nHeureux qui. . .\n(La canne s'agite.)","LA VOIX:\nSortez !","LE PARTERRE:\nOh !","MONTFLEURY (s'étranglant):\nHeureux qui loin des cours. . .","CYRANO (surgissant du parterre, debout sur une chaise, les bras croisés,\nson feutre en bataille, la moustache hérissée, le nez terrible):\nAh ! je vais me fâcher !. . .\n(Sensation à sa vue.)","Scène 1.IV.","Les mêmes, Cyrano, puis Bellerose, Jodelet.","MONTFLEURY (aux marquis):\nVenez à mon secours,\nMessieurs !","UN MARQUIS (nonchalamment):\nMais jouez donc !","CYRANO:\nGros homme, si tu joues\nJe vais être obligé de te fesser les joues !","LE MARQUIS:\nAssez !","CYRANO:\nQue les marquis se taisent sur leurs bancs,\nOu bien je fais tâter ma canne à leurs rubans !","TOUS LES MARQUIS (debout):\nC'en est trop !. . .Montfleury. . .","CYRANO:\nQue Montfleury s'en aille,\nOu bien je l'essorille et le désentripaille !","UNE VOIX:\nMais. . .","CYRANO:\nQu'il sorte !","UNE AUTRE VOIX:\nPourtant. . .","CYRANO:\nCe n'est pas encor fait ?\n(Avec le geste de retrousser ses manches):\nBon ! je vais sur la scène en guise de buffet,\nDécouper cette mortadelle d'Italie !","MONTFLEURY (rassemblant toute sa dignité):\nEn m'insultant, Monsieur, vous insultez Thalie !","CYRANO (très poli):\nSi cette Muse, à qui, Monsieur, vous n'êtes rien,\nAvait l'honneur de vous connaître, croyez bien\nQu'en vous voyant si gros et bête comme une urne,\nElle vous flanquerait quelque part son cothurne.","LE PARTERRE:\nMontfleury ! Montfleury !--La pièce de Baro !--","CYRANO (à ceux qui crient autour de lui):\nJe vous en prie, ayez pitié de mon fourreau:\nSi vous continuez, il va rendre sa lame !\n(Le cercle s'élargit.)","LA FOULE (reculant):\nHé ! là !. . .","CYRANO (à Montfleury):\nSortez de scène !","LA FOULE (se rapprochant et grondant):\nOh ! oh !","CYRANO (se retournant vivement):\nQuelqu'un réclame ?\n(Nouveau recul.)","UNE VOIX (chantant au fond):\nMonsieur de Cyrano\nVraiment nous tyrannise,\nMalgré ce tyranneau\nOn jouera la Clorise.","TOUTE LA SALLE (chantant):\nLa Clorise, la Clorise !. . .","CYRANO:\nSi j'entends une fois encor cette chanson,\nJe vous assomme tous.","UN BOURGEOIS:\nVous n'êtes pas Samson !","CYRANO:\nVoulez-vous me prêter, Monsieur, votre mâchoire ?","UNE DAME (dans les loges):\nC'est inouï !","UN SEIGNEUR:\nC'est scandaleux !","UN BOURGEOIS:\nC'est vexatoire !","UN PAGE:\nCe qu'on s'amuse !","LE PARTERRE:\nKss !--Montfleury !--Cyrano !","CYRANO:\nSilence !","LE PARTERRE (en délire):\nHi han ! Bêê ! Ouah, ouah ! Cocorico !","CYRANO:\nJe vous. . .","UN PAGE:\nMiâou !","CYRANO:\nJe vous ordonne de vous taire !\nEt j'adresse un défi collectif au parterre !\n--J'inscris les noms !--Approchez-vous, jeunes héros !\nChacun son tour ! Je vais donner des numéros !--\nAllons, quel est celui qui veut ouvrir la liste ?\nVous, Monsieur ? Non ! Vous ? Non ! Le premier duelliste,\nJe l'expédie avec les honneurs qu'on lui doit !\n--Que tous ceux qui veulent mourir lèvent le doigt.\n(Silence):\nLa pudeur vous défend de voir ma lame nue ?\nPas un nom ?--Pas un doigt ?--C'est bien. Je continue.\n(Se retournant vers la scène où Montfleury attend avec angoisse):\nDonc, je désire voir le théâtre guéri\nDe cette fluxion. Sinon. . .\n(La main à son épée):\nle bistouri !","MONTFLEURY:\nJe. . .","CYRANO (descend de sa chaise, s'assied au milieu du rond qui s'est\nformé, s'installe comme chez lui):\nMes mains vont frapper trois claques, pleine lune !\nVous vous éclipserez à la troisième.","LE PARTERRE (amusé):\nAh ?. . .","CYRANO (frappant dans ses mains):\nUne !","MONTFLEURY:\nJe. . .","UNE VOIX (des loges):\nRestez !","LE PARTERRE:\nRestera. . .restera pas. . .","MONTFLEURY:\nJe crois,\nMessieurs. . .","CYRANO:\nDeux !","MONTFLEURY:\nJe suis sûr qu'il vaudrait mieux que. . .","CYRANO:\nTrois !\n(Montfleury disparaît comme dans une trappe. Tempête de rires, de\nsifflets et de huées.)","LA SALLE:\nHu !. . .hu !. . .Lâche !. . .Reviens !. . .","CYRANO (épanoui, se renverse sur sa chaise, et croise ses jambes):\nQu'il revienne, s'il l'ose !","UN BOURGEOIS:\nL'orateur de la troupe !\n(Bellerose s'avance et salue.)","LES LOGES:\nAh !. . .Voilà Bellerose !","BELLEROSE (avec élégance):\nNobles seigneurs. . .","LE PARTERRE:\nNon ! Non ! Jodelet !","JODELET (s'avance, et, nasillard):\nTas de veaux !","LE PARTERRE:\nAh ! Ah ! Bravo ! très bien ! bravo !","JODELET:\nPas de bravos !\nLe gros tragédien dont vous aimez le ventre\nS'est senti. . .","LE PARTERRE:\nC'est un lâche !","JODELET:\nIl dut sortir !","LE PARTERRE:\nQu'il rentre !","LES UNS:\nNon !","LES AUTRES:\nSi !","UN JEUNE HOMME (à Cyrano):\nMais à la fin, monsieur, quelle raison\nAvez-vous de haïr Montfleury ?","CYRANO (gracieux, toujours assis):\nJeune oison,\nJ'ai deux raisons, dont chaque est suffisante seule.\nPrimo: c'est un acteur déplorable, qui gueule,\nEt qui soulève avec des han ! de porteur d'eau,\nLe vers qu'il faut laisser s'envoler !--Secundo:\nEst mon secret. . .","LE VIEUX BOURGEOIS (derrière lui):\nMais vous nous privez sans scrupule\nDe la Clorise ! Je m'entête. . .","CYRANO (tournant sa chaise vers le bourgeois, respecteusement):\nVieille mule !\nLes vers du vieux Baro valant moins que zéro,\nJ'interromps sans remords !","LES PRÉCIEUSES (dans les loges):\nHa !--Ho !--Notre Baro !\nMa chère !--Peut-on dire ?. . .Ah ! Dieu !. . .","CYRANO (tournant sa chaise vers les loges, galant):\nBelles personnes,\nRayonnez, fleurissez, soyez des échansonnes\nDe rêve, d'un sourire enchantez un trépas,\nInspirez-nous des vers. . .mais ne les jugez pas !","BELLEROSE:\nEt l'argent qu'il va falloir rendre !","CYRANO (tournant sa chaise vers la scène):\nBellerose,\nVous avez dit la seule intelligente chose !\nAu manteau de Thespis je ne fais pas de trous:\n(Il se lève, et lançant un sac sur la scène):\nAttrapez cette bourse au vol, et taisez-vous !","LA SALLE (éblouie):\nAh !. . .Oh !. . .","JODELET (ramassant prestement la bourse et la soupesant):\nA ce prix-là, monsieur, je t'autorise\nA venir chaque jour empêcher la Clorise !. . .","LA SALLE\nHu !. . .Hu !. . .","JODELET:\nDussions-nous même ensemble être hués !. . .","BELLEROSE:\nIl faut évacuer la salle !. . .","JODELET:\nÉvacuez !. . .\n(On commence à sortir, pendant que Cyrano regarde d'un air satisfait.\nMais la foule s'arrête bientôt en entendant la scène suivante, et la\nsortie cesse. Les femmes qui, dans les loges, étaient déjà debout,\nleur manteau remis, s'arrêtent pour écouter, et finissent par se\nrasseoir.)","LE BRET (à Cyrano):\nC'est fou !. . .","UN FÂCHEUX (qui s'est approché de Cyrano):\nLe comédien Montfleury ! quel scandale !\nMais il est protégé par le duc de Candale !\nAvez-vous un patron ?","CYRANO:\nNon !","LE FÂCHEUX:\nVous n'avez pas ?. . .","CYRANO:\nNon !","LE FÂCHEUX:\nQuoi, pas un grand seigneur pour couvrir de son nom ?. . .","CYRANO (agacé):\nNon, ai-je dit deux fois. Faut-il donc que je trisse ?\nNon, pas de protecteur. . .\n(La main à son épée):\nmais une protectrice !","LE FÂCHEUX:\nMais vous allez quitter la ville ?","CYRANO:\nC'est selon.","LE FÂCHEUX:\nMais le duc de Candale a le bras long !","CYRANO:\nMoins long\nQue n'est le mien. . .\n(Montrant son épée):\nquand je lui mets cette rallonge !","LE FÂCHEUX:\nMais vous ne songez pas à prétendre. . .","CYRANO:\nJ'y songe.","LE FÂCHEUX:\nMais. . .","CYRANO:\nTournez les talons, maintenant.","LE FÂCHEUX:\nMais. . .","CYRANO:\nTournez !\n--Ou dites-moi pourquoi vous regardez mon nez.","LE FÂCHEUX (ahuri):\nJe. . .","CYRANO (marchant sur lui):\nQu'a-t-il d'étonnant ?","LE FÂCHEUX (reculant):\nVotre Grâce se trompe. . .","CYRANO:\nEst-il mol et ballant, monsieur, comme une trompe ?. . .","LE FÂCHEUX (même jeu):\nJe n'ai pas. . .","CYRANO:\nOu crochu comme un bec de hibou ?","LE FÂCHEUX:\nJe. . .","CYRANO:\nY distingue-t-on une verrue au bout ?","LE FÂCHEUX:\nMais. . .","CYRANO:\nOu si quelque mouche, à pas lents, s'y promène ?\nQu'a-t-il d'hétéroclite ?","LE FÂCHEUX:\nOh !. . .","CYRANO:\nEst-ce un phénomène ?","LE FÂCHEUX:\nMais d'y porter les yeux j'avais su me garder !","CYRANO:\nEt pourquoi, s'il vous plaît, ne pas le regarder ?","LE FÂCHEUX:\nJ'avais. . .","CYRANO:\nIl vous dégoûte alors ?","LE FÂCHEUX:\nMonsieur. . .","CYRANO:\nMalsaine\nVous semble sa couleur ?","LE FÂCHEUX:\nMonsieur !","CYRANO:\nSa forme, obscène ?","LE FÂCHEUX:\nMais du tout !. . .","CYRANO:\nPourquoi donc prendre un air dénigrant ?\n--Peut-être que monsieur le trouve un peu trop grand ?","LE FÂCHEUX (balbutiant):\nJe le trouve petit, tout petit, minuscule !","CYRANO:\nHein ? comment ? m'accuser d'un pareil ridicule ?\nPetit, mon nez ? Holà !","LE FÂCHEUX:\nCiel !","CYRANO:\nÉnorme, mon nez !\n--Vil camus, sot camard, tête plate, apprenez\nQue je m'enorgueillis d'un pareil appendice,\nAttendu qu'un grand nez est proprement l'indice\nD'un homme affable, bon, courtois, spirituel,\nLibéral, courageux, tel que je suis, et tel\nQu'il vous est interdit à jamais de vous croire,\nDéplorable maraud ! car la face sans gloire\nQue va chercher ma main en haut de votre col,\nEst aussi dénuée. . .\n(Il le soufflette.)","LE FÂCHEUX:\nAï !","CYRANO:\nDe fierté, d'envol,\nDe lyrisme, de pittoresque, d'étincelle,\nDe somptuosité, de Nez enfin, que celle. . .\n(Il se retourne par les épaules, joignant le geste à la parole):\nQue va chercher ma botte au bas de votre dos !","LE FÂCHEUX (se sauvant):\nAu secours ! A la garde !","CYRANO:\nAvis donc aux badauds\nQui trouveraient plaisant mon milieu de visage,\nEt si le plaisantin est noble, mon usage\nEst de lui mettre, avant de le laisser s'enfuir,\nPas devant, et plus haut, du fer, et non du cuir !","DE GUICHE (qui est descendu de la scène, avec les marquis):\nMais à la fin il nous ennuie !","LE VICOMTE DE VALVERT (haussant les épaules):\nIl fanfaronne !","DE GUICHE:\nPersonne ne va donc lui répondre ?. . .","LE VICOMTE:\nPersonne ?\nAttendez ! Je vais lui lancer un de ces traits !. . .\n(Il s'avance vers Cyrano qui l'observe, et se campant devant lui d'un\nair fat):\nVous. . .vous avez un nez. . .heu. . .un nez. . .très grand.","CYRANO (gravement):\nTrès !","LE VICOMTE (riant):\nHa !","CYRANO (imperturbable):\nC'est tout ?. . .","LE VICOMTE:\nMais. . .","CYRANO:\nAh ! non ! c'est un peu court, jeune homme !\nOn pouvait dire. . .Oh ! Dieu !. . .bien des choses en somme. . .\nEn variant le ton,--par exemple, tenez:\nAgressif: \"Moi, monsieur, si j'avais un tel nez\nIl faudrait sur-le-champ que je me l'amputasse !\"\nAmical: \"Mais il doit tremper dans votre tasse !\nPour boire, faites-vous fabriquer un hanap !\"\nDescriptif: \"C'est un roc !. . .c'est un pic !. . .c'est un cap !\nQue dis-je, c'est un cap ?. . .C'est une péninsule !\"\nCurieux: \"De quoi sert cette oblongue capsule ?\nD'écritoire, monsieur, ou de boîte à ciseaux ?\"\nGracieux: \"Aimez-vous à ce point les oiseaux\nQue paternellement vous vous préoccupâtes\nDe tendre ce perchoir à leur petites pattes ?\"\nTruculent: \"Ça, monsieur, lorsque vous pétunez,\nLa vapeur du tabac vous sort-elle du nez\nSans qu'un voisin ne crie au feu de cheminée ?\"\nPrévenant: \"Gardez-vous, votre tête entraînée\nPar ce poids, de tomber en avant sur le sol !\"\nTendre: \"Faites-lui faire un petit parasol\nDe peur que sa couleur au soleil ne se fane !\"\nPédant: \"L'animal seul, monsieur, qu'Aristophane\nAppelle Hippocampelephantocamélos\nDut avoir sous le front tant de chair sur tant d'os !\"\nCavalier: 'Quoi, l'ami, ce croc est à la mode ?\nPour pendre son chapeau, c'est vraiment très commode !'\nEmphatique: \"Aucun vent ne peut, nez magistral,\nT'enrhumer tout entier, excepté le mistral !\"\nDramatique: \"C'est la Mer Rouge quand il saigne !\"\nAdmiratif: \"Pour un parfumeur, quelle enseigne !\"\nLyrique: \"Est-ce une conque, êtes-vous un triton ?\"\nNaïf: \"Ce monument, quand le visite-t-on ?\"\nRespectueux: \"Souffrez, monsieur, qu'on vous salue,\nC'est là ce qui s'appelle avoir pignon sur rue !\"\nCampagnard: \"Hé, ardé ! C'est-y un nez ? Nanain !\nC'est queuqu'navet géant ou ben queuqu'melon nain !\"\nMilitaire: \"Pointez contre cavalerie !\"\nPratique: \"Voulez-vous le mettre en loterie ?\nAssurément, monsieur, ce sera le gros lot !\"\nEnfin, parodiant Pyrame en un sanglot:\n\"Le voilà donc ce nez qui des traits de son maître\nA détruit l'harmonie ! Il en rougit, le traître !\"\n--Voilà ce qu'à peu près, mon cher, vous m'auriez dit\nSi vous aviez un peu de lettres et d'esprit:\nMais d'esprit, ô le plus lamentable des êtres,\nVous n'en eûtes jamais un atome, et de lettres\nVous n'avez que les trois qui forment le mot: sot !\nEussiez-vous eu, d'ailleurs, l'invention qu'il faut\nPour pouvoir là, devant ces nobles galeries,\nMe servir toutes ces folles plaisanteries,\nQue vous n'en eussiez pas articulé le quart\nDe la moitié du commencement d'une, car\nJe me les sers moi-même, avec assez de verve,\nMais je ne permets pas qu'un autre me les serve.","DE GUICHE (voulant emmener le vicomte pétrifié):\nVicomte, laissez donc !","LE VICOMTE (suffoqué):\nCes grands airs arrogants !\nUn hobereau qui. . .qui. . .n'a même pas de gants !\nEt qui sort sans rubans, sans bouffettes, sans ganses !","CYRANO:\nMoi, c'est moralement que j'ai mes élégances.\nJe ne m'attife pas ainsi qu'un freluquet,\nMais je suis plus soigné si je suis moins coquet;\nJe ne sortirais pas avec, par négligence,\nUn affront pas très bien lavé, la conscience\nJaune encor de sommeil dans le coin de son œil,\nUn honneur chiffonné, des scrupules en deuil.\nMais je marche sans rien sur moi qui ne reluise,\nEmpanaché d'indépendance et de franchise;\nCe n'est pas une taille avantageuse, c'est\nMon âme que je cambre ainsi qu'en un corset,\nEt tout couvert d'exploits qu'en rubans je m'attache,\nRetroussant mon esprit ainsi qu'une moustache,\nJe fais, en traversant les groupes et les ronds,\nSonner les vérités comme des éperons.","LE VICOMTE:\nMais, monsieur. . .","CYRANO:\nJe n'ai pas de gants ?. . .la belle affaire !\nIl m'en restait un seul. . .d'une très vieille paire !\n--Lequel m'était d'ailleurs encor fort importun:\nJe l'ai laissé dans la figure de quelqu'un.","LE VICOMTE:\nMaraud, faquin, butor de pied plat ridicule !","CYRANO (ôtant son chapeau et saluant comme si le vicomte venait de se\nprésenter):\nAh ?. . .Et moi, Cyrano-Savinien-Hercule\nDe Bergerac.\n(Rires.)","LE VICOMTE (exaspéré):\nBouffon !","CYRANO (poussant un cri comme lorsqu'on est saisi d'une crampe):\nAy !. . .","LE VICOMTE (qui remontait, se retournant):\nQu'est-ce encor qu'il dit ?","CYRANO (avec des grimaces de douleur):\nIl faut la remuer car elle s'engourdit. . .\n--Ce que c'est que de la laisser inoccupée !--\nAy !. . .","LE VICOMTE:\nQu'avez-vous ?","CYRANO:\nJ'ai des fourmis dans mon épée !","LE VICOMTE (tirant la sienne):\nSoit !","CYRANO:\nJe vais vous donner un petit coup charmant.","LE VICOMTE (méprisant):\nPoète !. . .","CYRANO:\nOui, monsieur, poète ! et tellement,\nQu'en ferraillant je vais--hop !--à l'improvisade,\nVous composer une ballade.","LE VICOMTE:\nUne ballade ?","CYRANO:\nVous ne vous doutez pas de ce que c'est, je crois ?\nLe vicomte:\nMais. . .","CYRANO (récitant comme une leçon):\nLa ballade, donc, se compose de trois\nCouplets de huit vers. . .","LE VICOMTE (piétinant):\nOh !","CYRANO (continuant):\nEt d'un envoi de quatre. . .","LE VICOMTE:\nVous. . .","CYRANO:\nJe vais tout ensemble en faire une et me battre,\nEt vous toucher, monsieur, au dernier vers.","LE VICOMTE:\nNon !","CYRANO:\nNon ?\n(Déclamant):\nBallade du duel qu'en l'hôtel bourguignon\nMonsieur de Bergerac eut avec un bélître !","LE VICOMTE:\nQu'est-ce que c'est que ça, s'il vous plaît ?","CYRANO:\nC'est le titre.","LA SALLE (surexcitée au plus haut point):\nPlace !--Très amusant !--Rangez-vous !--Pas de bruits !\n(Tableau. Cercle de curieux au parterre, les marquis et les officiers\nmêlés aux bourgeois et aux gens du peuple; les pages grimpés sur des\népaules pour mieux voir. Toutes les femmes debout dans les loges. A\ndroite, De Guiche et ses gentilshommes. A gauche, Le Bret, Ragueneau,\nCuigy, etc.)","CYRANO (fermant une seconde les yeux):\nAttendez !. . .je choisis mes rimes. . .Là, j'y suis.\n(Il fait ce qu'il dit, à mesure):\nJe jette avec grâce mon feutre,\nJe fais lentement l'abandon\nDu grand manteau qui me calfeutre,\nEt je tire mon espadon;\nÉlégant comme Céladon,\nAgile comme Scaramouche,\nJe vous préviens, cher Mirmydon,\nQu'à la fin de l'envoi je touche !\n(Premiers engagements de fer):\nVous auriez bien dû rester neutre;\nOù vais-je vous larder, dindon ?. . .\nDans le flanc, sous votre maheutre ?. . .\nAu cœur, sous votre bleu cordon ?. . .\n--Les coquilles tintent, ding-don !\nMa pointe voltige: une mouche !\nDécidément. . .c'est au bedon,\nQu'à la fin de l'envoi, je touche.\nIl me manque une rime en eutre. . .\nVous rompez, plus blanc qu'amidon ?\nC'est pour me fournir le mot pleutre !\n--Tac ! je pare la pointe dont\nVous espériez me faire don;--\nJ'ouvre la ligne,--je la bouche. . .\nTiens bien ta broche, Laridon !\nA la fin de l'envoi, je touche.\n(Il annonce solennellement):\nEnvoi.\nPrince, demande à Dieu pardon !\nJe quarte du pied, j'escarmouche,\nJe coupe, je feinte. . .\n(Se fendant):\nHé ! là, donc !\n(Le vicomte chancelle; Cyrano salue):\nA la fin de l'envoi, je touche !\n(Acclamations. Applaudissements dans les loges. Des fleurs et des\nmouchoirs tombent. Les officiers entourent et félicitent Cyrano.\nRagueneau danse d'enthousiasme. Le Bret est heureux et navré. Les amis\ndu vicomte le soutiennent et l'emmènent.)","LA FOULE (en un long cri):\nAh !. . .","UN CHEVAU-LÉGER:\nSuperbe !","UNE FEMME:\nJoli !","RAGUENEAU:\nPharamineux !","UN MARQUIS:\nNouveau !. . .","LE BRET:\nInsensé !","BOUSCULADE (autour de Cyrano. On entend):\n. . .Compliments !. . .félicite. . .bravo. . .","VOIX DE FEMME:\nC'est un héros !. . .","UN MOUSQUETAIRE (s'avançant vivement vers Cyrano, la main tendue):\nMonsieur, voulez-vous me permettre ?. . .\nC'est tout à fait très bien, et je crois m'y connaître;\nJ'ai du reste exprimé ma joie en trépignant !. . .\n(Il s'éloigne.)","CYRANO (à Cuigy):\nComment s'appelle donc ce monsieur ?","CUIGY:\nD'Artagnan.","LE BRET (à Cyrano, lui prenant le bras):\nÇà, causons !. . .","CYRANO:\nLaisse un peu sortir cette cohue. . .\n(A Bellerose):\nJe peux rester ?","BELLEROSE (respecteusement):\nMais oui !. . .\n(On entend des cris au dehors.)","JODELET (qui a regardé):\nC'est Montfleury qu'on hue !","BELLEROSE (solennellement):\nSic transit !. . .\n(Changeant de ton, au portier et au moucheur de chandelles):\nBalayez. Fermez. N'éteignez pas.\nNous allons revenir après notre repas,\nRépéter pour demain une nouvelle farce.\n(Jodelet et Bellerose sortent, après de grands saluts à Cyrano.)","LE PORTIER (à Cyrano):\nVous ne dînez donc pas ?","CYRANO:\nMoi ?. . .Non.\n(Le portier se retire.)","LE BRET (à Cyrano):\nParce que ?","CYRANO (fièrement):\nParce. . .\n(Changeant de ton, en voyant que le portier est loin):\nQue je n'ai pas d'argent !. . .","LE BRET (faisant le geste de lancer un sac):\nComment ! le sac d'écus ?. . .","CYRANO:\nPension paternelle, en un jour, tu vécus !","LE BRET:\nPour vivre tout un mois, alors ?. . .","CYRANO:\nRien ne me reste.","LE BRET:\nJeter ce sac, quelle sottise !","CYRANO:\nMais quel geste !. . .","LA DISTRIBUTRICE (toussant derrière son petit comptoir):\nHum !. . .\n(Cyrano et Le Bret se retournent. Elle s'avance intimidée):\nMonsieur. . .Vous savoir jeûner. . .le cœur me fend. . .\n(Montrant le buffet):\nJ'ai là tout ce qu'il faut. . .\n(Avec élan):\nPrenez !","CYRANO (se découvrant):\nMa chère enfant,\nEncor que mon orgeuil de Gascon m'interdise\nD'accepter de vos doigts la moindre friandise,\nJ'ai trop peur qu'un refus ne vous soit un chagrin,\nEt j'accepterai donc. . .\n(Il va au buffet et choisit):\nOh ! peu de chose !--un grain\nDe ce raisin. . .\n(Elle veut lui donner la grappe, il cueille un grain):\nUn seul !. . .ce verre d'eau. . .\n(Elle veut y verser du vin, il l'arrête):\nlimpide !\n--Et la moitié d'un macaron !\n(Il rend l'autre moitié.)","LE BRET:\nMais c'est stupide !","LA DISTRIBUTRICE:\nOh ! quelque chose encor !","CYRANO:\nOui. La main à baiser.\n(Il baise, comme la main d'une princesse, la main qu'elle lui tend.)","LA DISTRIBUTRICE:\nMerci, monsieur.\n(Révérence):\nBonsoir.\n(Elle sort.)","Scène 1.V.","Cyrano, Le Bret, puis le portier.","CYRANO (à Le Bret):\nJe t'écoute causer.\n(Il s'installe devant le buffet et rangeant devant lui le macaron):\nDîner !. . .\n(. . .le verre d'eau):\nBoisson !. . .\n(. . .le grain de raisin):\nDessert !. . .\n(Il s'assied):\nLà, je me mets à table !\n--Ah !. . .j'avais une faim, mon cher, épouvantable !\n(Mangeant):\n--Tu disais ?","LE BRET:\nQue ces fats aux grands airs belliqueux\nTe fausseront l'esprit si tu n'écoutes qu'eux !. . .\nVa consulter des gens de bon sens, et t'informe\nDe l'effet qu'a produit ton algarade.","CYRANO (achevant son macaron):\nÉnorme.","LE BRET:\nLe Cardinal. . .","CYRANO (s'épanouissant):\nIl était là, le Cardinal ?","LE BRET:\nA dû trouver cela. . .","CYRANO:\nMais très original.","LE BRET:\nPourtant. . .","CYRANO:\nC'est un auteur. Il ne peut lui déplaire\nQue l'on vienne troubler la pièce d'un confrère.","LE BRET:\nTu te mets sur les bras, vraiment, trop d'ennemis !","CYRANO (attaquant son grain de raisin):\nCombien puis-je, à peu près, ce soir, m'en être mis ?","LE BRET:\nQuarante-huit. Sans compter les femmes.","CYRANO:\nVoyons, compte !","LE BRET:\nMontfleury, le bourgeois, de Guiche, le vicomte,\nBaro, l'Académie. . .","CYRANO:\nAssez ! tu me ravis !","LE BRET:\nMais où te mènera la façon dont tu vis ?\nQuel système est le tien ?","CYRANO:\nJ'errais dans un méandre;\nJ'avais trop de partis, trop compliqués, à prendre;\nJ'ai pris. . .","LE BRET:\nLequel ?","CYRANO:\nMais le plus simple, de beaucoup.\nJ'ai décidé d'être admirable, en tout, pour tout !","LE BRET (haussant les épaules):\nSoit !--Mais enfin, à moi, le motif de ta haine\nPour Montfleury, le vrai, dis-le-moi !","CYRANO (se levant):\nCe Silène,\nSi ventru que son doigt n'atteint pas son nombril,\nPour les femmes encor se croit un doux péril,\nEt leur fait, cependant qu'en jouant il bredouille,\nDes yeux de carpe avec ses gros yeux de grenouille !. . .\nEt je le hais depuis qu'il se permit, un soir,\nDe poser son regard, sur celle. . .Oh ! j'ai cru voir\nGlisser sur une fleur une longue limace !","LE BRET (stupéfait):\nHein ? Comment ? Serait-il possible ?. . .","CYRANO (avec un rire amer):\nQue j'aimasse ?. . .\n(Changeant de ton et gravement):\nJ'aime.","LE BRET:\nEt peut-on savoir ? tu ne m'as jamais dit ?. . .","CYRANO:\nQui j'aime ?. . .Réfléchis, voyons. Il m'interdit\nLe rêve d'être aimé même par une laide,\nCe nez qui d'un quart d'heure en tous lieux me précède;\nAlors, moi, j'aime qui ?. . .Mais cela va de soi !\nJ'aime--mais c'est forcé !--la plus belle qui soit !","LE BRET:\nLa plus belle ?. . .","CYRANO:\nTout simplement, qui soit au monde !\nLa plus brillante, la plus fine,\n(Avec accablement):\nla plus blonde !","LE BRET:\nEh ! mon Dieu, quelle est donc cette femme ?. . .","CYRANO:\nUn danger\nMortel sans le vouloir, exquis sans y songer,\nUn piège de nature, une rose muscade\nDans laquelle l'amour se tient en embuscade !\nQui connaît son sourire a connu le parfait.\nElle fait de la grâce avec rien, elle fait\nTenir tout le divin dans un geste quelconque,\nEt tu ne saurais pas, Vénus, monter en conque,\nNi toi, Diane, marcher dans les grands bois fleuris,\nComme elle monte en chaise et marche dans Paris !. . .","LE BRET:\nSapristi ! je comprends. C'est clair !","CYRANO:\nC'est diaphane.","LE BRET:\nMagdeleine Robin, ta cousine ?","CYRANO:\nOui,--Roxane.","LE BRET:\nEh bien, mais c'est au mieux ! Tu l'aimes ? Dis-le-lui !\nTu t'es couvert de gloire à ses yeux aujourd'hui !","CYRANO:\nRegarde-moi, mon cher, et dis quelle espérance\nPourrait bien me laisser cette protubérance !\nOh ! je ne me fais pas d'illusion !--Parbleu,\nOui, quelquefois, je m'attendris, dans le soir bleu;\nJ'entre en quelque jardin où l'heure se parfume;\nAvec mon pauvre grand diable de nez je hume\nL'avril,--je suis des yeux, sous un rayon d'argent,\nAu bras d'un cavalier, quelque femme, en songeant\nQue pour marcher, à petits pas, dans de la lune,\nAussi moi j'aimerais au bras en avoir une,\nJe m'exalte, j'oublie. . .et j'aperçois soudain\nL'ombre de mon profil sur le mur du jardin !","LE BRET (ému):\nMon ami !. . .","CYRANO:\nMon ami, j'ai de mauvaises heures !\nDe me sentir si laid, parfois, tout seul. . .","LE BRET (vivement, lui prenant la main):\nTu pleures ?","CYRANO:\nAh ! non, cela, jamais ! Non, ce serait trop laid,\nSi le long de ce nez une larme coulait !\nJe ne laisserai pas, tant que j'en serai maître,\nLa divine beauté des larmes se commettre\nAvec tant de laideur grossière !. . .Vois-tu bien,\nLes larmes, il n'est rien de plus sublime, rien,\nEt je ne voudrais pas qu'excitant la risée,\nUne seule, par moi, fût ridiculisée !. . .","LE BRET:\nVa, ne t'attriste pas ! L'amour n'est que hasard !","CYRANO (secouant la tête):\nNon ! J'aime Cléopâtre: ai-je l'air d'un César ?\nJ'adore Bérénice: ai-je l'aspect d'un Tite ?","LE BRET:\nMais ton courage ! ton esprit !--Cette petite\nQui t'offrait là, tantôt, ce modeste repas,\nSes yeux, tu l'as bien vu, ne te détestaient pas !","CYRANO (saisi):\nC'est vrai !","LE BRET:\nHé ! bien ! alors ?. . .Mais, Roxane, elle-même,\nToute blême a suivi ton duel !","CYRANO:\nToute blême ?","LE BRET:\nSon cœur et son esprit déjà sont étonnés !\nOse, et lui parle, afin. . .","CYRANO:\nQu'elle me rie au nez ?\nNon !--C'est la seule chose au monde que je craigne !","LE PORTIER (introduisant quelqu'un à Cyrano):\nMonsieur, on vous demande. . .","CYRANO (voyant la duègne):\nAh ! mon Dieu ! Sa duègne !","Scène 1.VI.","Cyrano, Le Bret, la duègne.","LA DUÈGNE (avec un grand salut):\nDe son vaillant cousin on désire savoir\nOù l'on peut, en secret, le voir.","CYRANO (bouleversé):\nMe voir ?","LA DUÈGNE (avec une révérence):\nVous voir.\n--On a des choses à vous dire.","CYRANO:\nDes ?. . .","LA DUÈGNE (nouvelle révérence):\nDes choses !","CYRANO (chancelant):\nAh, mon Dieu !","LA DUÈGNE:\nL'on ira, demain, aux primes roses\nD'aurore,--ouïr la messe à Saint-Roch.","CYRANO (se soutenant sur Le Bret):\nAh ! mon Dieu !","LA DUÈGNE:\nEn sortant,--où peut-on entrer, causer un peu ?","CYRANO (affolé):\nOù ?. . .Je. . .mais. . .Ah ! mon Dieu !. . .","LA DUÈGNE:\nDites vite.","CYRANO:\nJe cherche !. . .","LA DUÈGNE:\nOù ?","CYRANO:\nChez. . .chez. . .Ragueneau. . .le pâtissier. . .","LA DUÈGNE:\nIl perche ?","CYRANO:\nDans la rue--Ah ! mon Dieu, mon Dieu !--Saint-Honoré !","LA DUÈGNE (remontant):\nOn ira. Soyez-y. Sept heures.","CYRANO:\nJ'y serai.\n(La duègne sort.)","Scène 1.VII.","Cyrano, Le Bret, puis les comédiens, les comédiennes, Cuigy, Brissaille,\nLignière, le portier, les violons.)","CYRANO (tombant dans les bras de Le Bret):\nMoi !. . .D'elle !. . .Un rendez-vous !. . .","LE BRET:\nEh bien ! tu n'es plus triste ?","CYRANO:\nAh ! pour quoi que ce soit, elle sait que j'existe !","LE BRET:\nMaintenant, tu vas être calme ?","CYRANO (hors de lui):\nMaintenant. . .\nMais je vais être frénétique et fulminant !\nIl me faut une armée entière a déconfire !\nJ'ai dix cœurs; j'ai vingt bras; il ne peut me suffire\nDe pourfendre des nains. . .\n(Il crie à tue-tête):\nIl me faut des géants !\n(Depuis un moment, sur la scène, au fond, des ombres de comédiens et\nde comédiennes s'agitent, chuchotent: on commence à répéter. Les\nviolons ont repris leur place.)","UNE VOIX (de la scène):\nHé ! pst ! là-bas ! Silence ! on répète céans !","CYRANO (riant):\nNous partons !\n(Il remonte; par la grande porte du fond; entrent Cuigy, Brissaille,\nplusieurs officiers, qui soutiennent Lignière complètement ivre.)","CUIGY:\nCyrano !","CYRANO:\nQu'est-ce ?","CUIGY:\nUne énorme grive\nQu'on t'apporte !","CYRANO (le reconnaissant):\nLignière !. . .Hé, qu'est-ce qui t'arrive ?","CUIGY:\nIl te cherche !","BRISSAILLE:\nIl ne peut rentrer chez lui !","CYRANO:\nPourquoi ?","LIGNIÈRE (d'une voix pâteuse, lui montrant un billet tout chiffonné):\nCe billet m'avertit. . .cent hommes contre moi. . .\nA cause de. . .chanson. . .grand danger me menace. . .\nPorte de Nesle. . .Il faut, pour rentrer, que j'y passe. . .\nPermets-moi donc d'aller coucher sous. . .sous ton toit !","CYRANO:\nCent hommes, m'as-tu dit ? Tu coucheras chez toi !","LIGNIÈRE (épouvanté):\nMais. . .","CYRANO (d'une voix terrible, lui montrant la lanterne allumée que le\nportier balance en écoutant curieusement cette scène):\nPrends cette lanterne !. . .\n(Lignière saisit précipitamment la lanterne):\nEt marche !--Je te jure\nQue c'est moi qui ferai ce soir ta couverture !. . .\n(Aux officiers):\nVous, suivez à distance, et vous serez témoins !","CUIGY:\nMais cent hommes !. . .","CYRANO:\nCe soir, il ne m'en faut pas moins !\n(Les comédiens et les comédiennes, descendus de scène, se sont\nrapprochés dans leurs divers costumes.)","LE BRET:\nMais pourquoi protéger. . .","CYRANO:\nVoilà Le Bret qui grogne !","LE BRET:\nCet ivrogne banal ?. . .","CYRANO (frappant sur l'épaule de Lignière):\nParce que cet ivrogne,\nCe tonneau de muscat, ce fût de rossoli,\nFit quelque chose un jour de tout à fait joli:\nAu sortir d'une messe ayant, selon le rite,\nVu celle qu'il aimait prendre de l'eau bénite,\nLui que l'eau fait sauver, courut au bénitier,\nSe pencha sur sa conque et le but tout entier !. . .","UNE COMÉDIENNE (en costume de soubrette):\nTiens, c'est gentil, cela !","CYRANO:\nN'est-ce pas, la soubrette ?","LA COMÉDIENNE (aux autres):\nMais pourquoi sont-ils cent contre un pauvre poète ?","CYRANO:\nMarchons !\n(Aux officiers):\nEt vous, messieurs, en me voyant charger,\nNe me secondez pas, quel que soit le danger !","UNE AUTRE COMÉDIENNE (sautant de la scène):\nOh ! mais, moi, je vais voir !","CYRANO:\nVenez !. . .","UNE AUTRE (sautant aussi, à un vieux comédien):\nViens-tu, Cassandre ?. . .","CYRANO:\nVenez tous, le Docteur, Isabelle, Léandre,\nTous ! Car vous allez joindre, essaim charmant et fol,\nLa farce italienne à ce drame espagnol,\nEt, sur son ronflement tintant un bruit fantasque,\nL'entourer de grelots comme un tambour de basque !. . .","TOUTES LES FEMMES (sautant de joie):\nBravo !--Vite, une mante !--Un capuchon !","JODELET:\nAllons !","CYRANO (aux violons):\nVous nous jouerez un air, messieurs les violons !\n(Les violons se joignent au cortège qui se forme. On s'empare des\nchandelles allumées de la rampe et on se les distribue. Cela devient\nune retraite aux flambeaux):\nBravo ! des officiers, des femmes en costume,\nEt, vingt pas en avant. . .\n(Il se place comme il dit):\nMoi, tout seul, sous la plume\nQue la gloire elle-même à ce feutre piqua,\nFier comme un Scipion triplement Nasica !. . .\n--C'est compris ? Défendu de me prêter main-forte !--\nOn y est ?. . .Un, deux, trois ! Portier, ouvre la porte !\n(Le portier ouvre à deux battants. Un coin du vieux Paris pittoresque\net lunaire paraît):\nAh !. . .Paris fuit, nocturne et quasi nébuleux;\nLe clair de lune coule aux pentes des toits bleus;\nUn cadre se prépare, exquis, pour cette scène;\nLà-bas, sous des vapeurs en écharpe, la Seine,\nComme un mystérieux et magique miroir,\nTremble. . .Et vous allez voir ce que vous allez voir !","TOUS:\nA la porte de Nesle !","CYRANO (debout sur le seuil):\nA la porte de Nesle !\n(Se retournant avant de sortir, à la soubrette):\nNe demandiez-vous pas pourquoi, mademoiselle,\nContre ce seul rimeur cent hommes furent mis ?\n(Il tire l'épée et, tranquillement):\nC'est parce qu'on savait qu'il est de mes amis !\n(Il sort. Le cortège,--Lignière zigzaguant en tête,--puis les\ncomédiennes aux bras des officiers,--puis les comédiens gambadant,--se\nmet en marche dans la nuit au son des violons, et à la lueur falote\ndes chandelles.)","Rideau."]},{"name":"Acte II","paragraphs":["La Rôtisserie Des Poètes.","La boutique de Ragueneau, rôtisseur-pâtissier, vaste ouvroir au coin\nde la rue Saint-Honoré et de la rue de l'Arbre-Sec qu'on aperçoit\nlargement au fond, par le vitrage de la porte, grises dans les\npremières lueurs de l'aube.","À gauche, premier plan, comptoir surmonté d'un dais en fer forgé,\nauquel sont accrochés des oies, des canards, des paons blancs. Dans de\ngrands vases de faïence de hauts bouquets de fleurs naïves,\nprincipalement des tournesols jaunes. Du même côté, second plan,\nimmense cheminée devant laquelle, entre de monstrueux chenets, dont\nchacun supporte une petite marmite, les rôtis pleurent dans les\nlèchefrites.","À droite, premier plan avec porte. Deuxième plan, un escalier montant\nà une petite salle en soupente, dont on aperçoit l'intérieur par des\nvolets ouverts; une table y est dressée, un menu lustre flamand y\nluit: c'est un réduit où l'on va manger et boire. Une galerie de bois,\nfaisant suite à l'escalier, semble mener à d'autres petites salles\nanalogues.","Au milieu de la rôtisserie, un cercle en fer que l'on peut faire\ndescendre avec une corde, et auquel de grosses pièces sont accrochées,\nfait un lustre de gibier.","Les fours, dans l'ombre, sous l'escalier, rougeoient. Des cuivres\nétincellent. Des broches tournent. Des pièces montées pyramident, des\njambons pendent. C'est le coup de feu matinal. Bousculade de marmitons\neffarés, d'énormes cuisiniers et de minuscules gâte-sauces.\nFoisonnement de bonnets à plume de poulet ou à aile de pintade. On\napporte, sur des plaques de tôle et des clayons d'osier, des\nquinconces de brioches, des villages de petits-fours.","Des tables sont couvertes de gâteaux et de plats. D'autres, entourées\nde chaises, attendent les mangeurs et les buveurs. Une plus petite,\ndans un coin, disparaît sous les papiers. Ragueneau y est assis au\nlever du rideau; il écrit.","Scène 2.I.","Ragueneau, pâtissiers, puis Lise; Ragueneau, à la petite table,\nécrivant d'un air inspiré, et comptant sur ses doigts.","PREMIER PATISSIER (apportant une pièce montée):\nFruits en nougat !","DEUXIÈME PATISSIER (apportant un plat):\nFlan !","TROISIÈME PATISSIER (apportant un rôti paré de plumes):\nPaon !","QUATRIÈME PATISSIER (apportant une plaque de gâteaux):\nRoinsoles !","CINQUIÈME PATISSIER (apportant une sorte de terrine):\nBœuf en daube !","RAGUENEAU (cessant d'écrire et levant la tête):\nSur les cuivres, déjà, glisse l'argent de l'aube !\nÉtouffe en toi le dieu qui chante, Ragueneau !\nL'heure du luth viendra,--c'est l'heure du fourneau !\n(Il se lève. A un cuisinier):\nVous, veuillez m'allonger cette sauce, elle est courte !","LE CUISINIER:\nDe combien ?","RAGUENEAU:\nDe trois pieds.\n(Il passe.)","LE CUISINIER:\nHein ?","PREMIER PATISSIER:\nLa tarte !","DEUXIÈME PATISSIER:\nLa tourte !","RAGUENEAU (devant la cheminée):\nMa Muse, éloigne-toi, pour que tes yeux charmants\nN'aillent pas se rougir au feu de ces sarments !\n(A un pâtissier, lui montrant des pains):\nVous avez mal placé la fente de ces miches:\nAu milieu la césure,--entre les hémistiches !\n(A un autre, lui montrant un pâté inachevé):\nA ce palais de croûte, il faut, vous, mettre un toit. . .\n(A un jeune apprenti, qui, assis par terre, embroche des volailles):\nEt toi, sur cette broche interminable, toi,\nLe modeste poulet et la dinde superbe,\nAlterne-les, mon fils, comme le vieux Malherbe\nAlternait les grands vers avec les plus petits,\nEt fais tourner au feu des strophes de rôtis !","UN AUTRE APPRENTI (s'avançant avec un plateau recouvert d'une assiette):\nMaître, en pensant à vous, dans le four, j'ai fait cuire\nCeci, qui vous plaira, je l'espère.\n(Il découvre le plateau, on voit une grande lyre de pâtisserie.)","RAGUENEAU (ébloui):\nUne lyre !","L'APPRENTI:\nEn pâte de brioche.","RAGUENEAU (ému):\nAvec des fruits confits !\nL'APPRENTI:\nEt les cordes, voyez, en sucre je les fis.","RAGUENEAU (lui donnant de l'argent):\nVa boire à ma santé !\n(Apercevant Lise qui entre):\nChut ! ma femme ! Circule,\nEt cache cet argent !\n(A Lise, lui montrant la lyre d'un air gêné):\nC'est beau ?","LISE:\nC'est ridicule !\n(Elle pose sur le comptoir une pile de sacs en papier.)","RAGUENEAU:\nDes sacs ?. . .Bon. Merci.\n(Il les regarde):\nCiel ! Mes livres vénérés !\nLes vers de mes amis ! déchirés ! démembrés !\nPour en faire des sacs à mettre des croquantes. . .\nAh ! vous renouvelez Orphée et les bacchantes !","LISE (sèchement):\nEt n'ai-je pas le droit d'utiliser vraiment\nCe que laissent ici, pour unique paiement,\nVos méchants écriveurs de lignes inégales !","RAGUENEAU:\nFourmi !. . .n'insulte pas ces divines cigales !","LISE:\nAvant de fréquenter ces gens-là, mon ami,\nVous ne m'appeliez pas bacchante,--ni fourmi !","RAGUENEAU:\nAvec des vers, faire cela !","LISE:\nPas autre chose.","RAGUENEAU:\nQue faites-vous, alors, madame, avec la prose ?","Scène 2.II.","Les mêmes, deux enfants, qui viennent d'entrer dans la pâtisserie.","RAGUENEAU:\nVous désirez, petits ?","PREMIER ENFANT:\nTrois pâtés.","RAGUENEAU (les servant):\nLà, bien roux. . .\nEt bien chauds.","DEUXIÈME ENFANT:\nS'il vous plaît, enveloppez-les-nous ?","RAGUENEAU (saisi, à part):\nHélas ! un de mes sacs !\n(Aux enfants):\nQue je les enveloppe ?. . .\n(Il prend un sac et au moment d'y mettre les pâtés, il lit):\nTel Ulysse, le jour qu'il quitta Pénélope. . .\nPas celui-ci !. . .\n(Il le met de côté et en prend un autre. Au moment d'y mettre les\npâtés, il lit):\nLe blond Phœbus. . . Pas celui-là !\n(Même jeu.)","LISE (impatientée):\nEh bien ! qu'attendez-vous ?","RAGUENEAU:\nVoilà, voilà, voilà !\n(Il en prend un troisième et se résigne):\nLe sonnet à Philis !. . .mais c'est dur tout de même !","LISE:\nC'est heureux qu'il se soit décidé !\n(Haussant les épaules):\nNicodème !\n(Elle monte sur une chaise et se met à ranger des plats sur une crédence.)","RAGUENEAU (profitant de ce qu'elle tourne le dos, rappelle les enfants\ndéjà à la porte):\nPst !. . .Petits !. . .Rendez-moi le sonnet à Philis,\nAu lieu de trois pâtés je vous en donne six.\n(Les enfants lui rendent le sac, prennent vivement les gâteaux et\nsortent. Ragueneau, défripant le papier, se met à lire en déclamant):\nPhilis !. . . Sur ce doux nom, une tache de beurre !. . .\nPhilis !. . .\n(CYRANO entre brusquement.)","Scène 2.III.","Ragueneau, Lise, Cyrano, puis le mousquetaire.","CYRANO:\nQuelle heure est-il ?","RAGUENEAU (le saluant avec empressement):\nSix heures.","CYRANO (avec émotion):\nDans une heure !\n(Il va et vient dans la boutique.)","RAGUENEAU (le suivant):\nBravo ! J'ai vu. . .","CYRANO:\nQuoi donc !","RAGUENEAU:\nVotre combat !. . .","CYRANO:\nLequel ?","RAGUENEAU:\nCelui de l'hôtel de Bourgogne !","CYRANO (avec dédain):\nAh !. . .Le duel !","RAGUENEAU (admiratif):\nOui, le duel en vers !. . .","LISE:\nIl en a plein la bouche !","CYRANO:\nAllons ! tant mieux !","RAGUENEAU (se fendant avec une broche qu'il a saisi):\nA la fin de l'envoi, je touche !. . .\nA la fin de l'envoi, je touche !. . .Que c'est beau !\n(Avec un enthousiasme croissant):\nA la fin de l'envoi. . .","CYRANO:\nQuelle heure, Ragueneau ?","RAGUENEAU (restant fendu pour regarder l'horloge):\nSix heures cinq !. . .. . .je touche !\n(Il se relève):\n. . .Oh ! faire une ballade !","LISE (à Cyrano, qui en passant devant son comptoir lui a serré\ndistraitement la main):\nQu'avez-vous à la main ?","CYRANO:\nRien. Une estafilade.","RAGUENEAU:\nCourûtes-vous quelque péril ?","CYRANO:\nAucun péril.","LISE (le menaçant du doigt):\nJe crois que vous mentez !","CYRANO:\nMon nez remuerait-il ?\nIl faudrait que ce fût pour un mensonge énorme !\n(Changeant de ton):\nJ'attends ici quelqu'un. Si ce n'est pas sous l'orme,\nVous nous laisserez seuls.","RAGUENEAU:\nC'est que je ne peux pas;\nMes rimeurs vont venir. . .","LISE (ironique):\nPour leur premier repas.","CYRANO:\nTu les éloigneras quand je te ferai signe. . .\nL'heure ?","RAGUENEAU:\nSix heures dix.","CYRANO (s'asseyant nerveusement à la table de Ragueneau et prenant du\npapier):\nUne plume ?. . .","RAGUENEAU (lui offrant celle qu'il a à son oreille):\nDe cygne.","UN MOUSQUETAIRE (superbement moustachu, entre et d'une voix de stentor):\nSalut !\n(Lise remonte vivement vers lui.)","CYRANO (se retournant):\nQu'est-ce ?","RAGUENEAU:\nUn ami de ma femme. Un guerrier\nTerrible,--à ce qu'il dit !. . .","CYRANO (reprenant la plume et éloignant du geste Ragueneau):\nChut !. . .\nÉcrire,--plier,--\n(A lui-même):\nLui donner,--me sauver. . .\n(Jetant la plume):\nLâche !. . .Mais que je meure,\nSi j'ose lui parler, lui dire un seul mot. . .\n(A Ragueneau):\nL'heure ?","RAGUENEAU:\nSix et quart !. . .","CYRANO (frappant sa poitrine):\n--un seul mot de tous ceux que j'ai là !\nTandis qu'en écrivant. . .\n(Il reprend la plume):\nEh bien ! écrivons-la,\nCette lettre d'amour qu'en moi-même j'ai faite\nEt refaite cent fois, de sorte qu'elle est prête,\nEt que mettant mon âme à côté du papier,\nJe n'ai tout simplement qu'à la recopier.\n(Il écrit.--Derrière le vitrage de la porte on voit s'agiter des\nsilhouettes maigres et hésitantes.)","Scène 2.IV.","Ragueneau, Lise, le mousquetaire, Cyrano, à la petite table, écrivant,\nles poètes, vêtus de noir, les bas tombants, couverts de boue.","LISE (entrant, à Ragueneau):\nLes voici vos crottés !","PREMIER POÈTE (entrant, à Ragueneau):\nConfrère !. . .","DEUXIÈME POÈTE (de même, lui secouant les mains):\nCher confrère !","TROISIÈME POÈTE:\nAigle des pâtissiers !\n(Il renifle):\nÇa sent bon dans votre aire,","QUATRIÈME POÈTE:\nO Phœbus-Rôtisseur !","CINQUIÈME POÈTE:\nApollon maître-queux !. . .","RAGUENEAU (entouré, embrassé, secoué):\nComme on est tout de suite à son aise avec eux !. . .","PREMIER POÈTE:\nNous fûmes retardés par la foule attroupée\nA la porte de Nesle !. . .","DEUXIÈME POÈTE:\nOuverts à coups d'épée,\nHuit malandrins sanglants illustraient les pavés !","CYRANO (levant une seconde la tête):\nHuit ?. . .Tiens, je croyais sept.\n(Il reprend sa lettre.)","RAGUENEAU (à Cyrano):\nEst-ce que vous savez\nLe héros du combat ?","CYRANO (négligemment):\nMoi ?. . .Non !","LISE (au mousquetaire):\nEt vous ?","LE MOUSQUETAIRE (se frisant la moustache):\nPeut-être !","CYRANO (écrivant, à part,--on l'entend murmurer de temps en temps):\nJe vous aime. . .","PREMIER POÈTE:\nUn seul homme, assurait-on, sut mettre\nToute une bande en fuite !. . .","DEUXIÈME POÈTE:\nOh ! c'etait curieux !\nDes piques, des bâtons jonchaient le sol !. . .","CYRANO (écrivant):\n. . .vos yeux. . .","TROISIÈME POÈTE:\nOn trouvait des chapeaux jusqu'au quai des Orfèvres !","PREMIER POÈTE:\nSapristi ! ce dut être un féroce. . .","CYRANO (même jeu):\n. . .vos lèvres. . .","PREMIER POÈTE:\nUn terrible géant, l'auteur de ces exploits !","CYRANO (même jeu):\n. . .Et je m'évanouis de peur quand je vous vois.","DEUXIÈME POÈTE (happant un gâteau):\nQu'as-tu rimé de neuf, Ragueneau ?","CYRANO (même jeu):\n. . .qui vous aime. . .\n(Il s'arrête au moment de signer, et se lève, mettant sa lettre dans\nson pourpoint):\nPas besoin de signer. Je la donne moi-même.","RAGUENEAU (au deuxième poète):\nJ'ai mis une recette en vers.","TROISIÈME POÈTE (s'installant près d'un plateau de choux à la crème):\nOyons ces vers !","QUATRIÈME POÈTE (regardant une brioche qu'il a prise):\nCette brioche a mis son bonnet de travers.\n(Il la décoiffe d'un coup de dent.)","PREMIER POÈTE:\nCe pain d'épice suit le rimeur famélique,\nDe ses yeux en amande aux sourcils d'angélique !\n(Il happe le morceau de pain d'épice.)","DEUXIÈME POÈTE:\nNous écoutons.","TROISIÈME POÈTE (serrant légèrement un chou entre ses doigts):\nCe chou bave sa crème. Il rit.","DEUXIÈME POÈTE (mordant à même la grande lyre de pâtisserie):\nPour la première fois la Lyre me nourrit !","RAGUENEAU (qui s'est préparé à réciter, qui a toussé, assuré son bonnet,\npris une pose):\nUne recette en vers. . .","DEUXIÈME POÈTE (au premier, lui donnant un coup de coude):\nTu déjeunes ?","PREMIER POÈTE (au deuxième):\nTu dînes !","RAGUENEAU:\nComment on fait les tartelettes amandines.\nBattez, pour qu'ils soient mousseux,\nQuelques œufs;\nIncorporez à leur mousse\nUn jus de cédrat choisi;\nVersez-y\nUn bon lait d'amande douce;\nMettez de la pâte à flan\nDans le flanc\nDe moules à tartelette;\nD'un doigt preste, abricotez\nLes côtés;\nVersez goutte à gouttelette\nVotre mousse en ces puits, puis\nQue ces puits\nPassent au four, et, blondines,\nSortant en gais troupelets,\nCe sont les\nTartelettes amandines !","LES POÈTES (la bouche pleine):\nExquis ! Délicieux !","UN POÈTE (s'étouffant):\nHomph !\n(Ils remontent vers le fond, en mangeant.)","CYRANO (qui a observé s'avance vers Ragueneau):\nBercés par ta voix,\nNe vois-tu pas comme ils s'empiffrent ?","RAGUENEAU (plus bas, avec un sourire):\nJe le vois. . .\nSans regarder, de peur que cela ne les trouble;\nEt dire ainsi mes vers me donne un plaisir double,\nPuisque je satisfais un doux faible que j'ai\nTout en laissant manger ceux qui n'ont pas mangé !","CYRANO (lui frappant sur l'épaule):\nToi, tu me plais !. . .\n(Ragueneau va rejoindre ses amis. Cyrano le suit des yeux, puis, un\npeu brusquement):\nHé là, Lise ?\n(Lise, en conversation tendre avec le mousquetaire, tressaille et\ndescend vers Cyrano):\nCe capitaine. . .\nVous assiège ?","LISE (offensée):\nOh ! mes yeux, d'une œillade hautaine,\nSavent vaincre quiconque attaque mes vertus.","CYRANO:\nEuh ! pour des yeux vainqueurs, je les trouve battus.","LISE (suffoquée):\nMais. . .","CYRANO (nettement):\nRagueneau me plaît. C'est pourquoi, dame Lise,\nJe défends que quelqu'un le ridicoculise.","LISE:\nMais. . .","CYRANO (qui a élevé la voix assez pour être entendu du galant):\nA bon entendeur. . .\n(Il salue le mousquetaire, et va se mettre en observation, à la porte\ndu fond, après avoir regardé l'horloge.)","LISE (au mousquetaire qui a simplement rendu son salut à Cyrano):\nVraiment, vous m'étonnez !. . .\nRépondez. . .sur son nez. . .","LE MOUSQUETAIRE:\nSur son nez. . .sur son nez. . .\n(Il s'éloigne vivement, Lise le suit.)","CYRANO (de la porte du fond, faisant signe à Ragueneau d'emmener les\npoètes):\nPst !. . .","RAGUENEAU (montrant aux poètes la porte de droite):\nNous serons bien mieux par là. . .","CYRANO (s'impatientant):\nPst ! pst !. . .","RAGUENEAU (les entraînant):\nPour lire\nDes vers. . .","PREMIER POÈTE (désespéré, la bouche pleine):\nMais les gâteaux !. . .","DEUXIÈME POÈTE:\nEmportons-les !\n(Ils sortent tous derrière Ragueneau, processionellement, et après\navoir fait une râfle de plateaux.)","Scène 2.V.","Cyrano, Roxane, la duègne.","CYRANO:\nJe tire\nMa lettre si je sens seulement qu'il y a\nLe moindre espoir !. . .\n(Roxane, masquée, suivie de la duègne, paraît derrière le vitrage. Il\nouvre vivement la porte):\nEntrez !. . .\n(Marchant sur la duègne):\nVous, deux mots, duègna !","LA DUÈGNE:\nQuatre.","CYRANO:\nÊtes-vous gourmande ?","LA DUÈGNE:\nA m'en rendre malade.","CYRANO (prenant vivement des sacs de papier sur le comptoir):\nBon. Voici deux sonnets de monsieur Benserade. . .","LA DUÈGNE (piteuse):\nHeu !. . .","CYRANO:\n. . .que je vous remplis de darioles.","LA DUÈGNE (changeant de figure):\nHou !","CYRANO:\nAimez-vous le gâteau qu'on nomme petit chou ?","LA DUÈGNE (avec dignité):\nMonsieur, j'en fais état, lorsqu'il est à la crème.","CYRANO:\nJ'en plonge six pour vous dans le sein d'un poème\nDe Saint-Amant ! Et dans ces vers de Chapelain\nJe dépose un fragment, moins lourd, de poupelin.\n--Ah ! Vous aimez les gâteaux frais ?","LA DUÈGNE:\nJ'en suis férue !","CYRANO (lui chargeant les bras de sacs remplis):\nVeuillez aller manger tous ceux-ci dans la rue.","LA DUÈGNE:\nMais. . .","CYRANO (la poussant dehors):\nEt ne revenez qu'après avoir fini !\n(Il referme la porte, redescend vers Roxane, et s'arrête, découvert,\nà une distance respectueuse.)","Scène 2.VI.","Cyrano, Roxane, la duègne, un instant.","CYRANO:\nQue l'instant entre tous les instants soit béni,\nOù, cessant d'oublier qu'humblement je respire\nVous venez jusqu'ici pour me dire. . .me dire ?. . .","ROXANE (qui s'est démasquée):\nMais tout d'abord merci, car ce drôle, ce fat\nQu'au brave jeu d'épée, hier, vous avez fait mat,\nC'est lui qu'un grand seigneur. . .épris de moi. . .","CYRANO:\nDe Guiche ?","ROXANE (baissant les yeux):\nCherchait à m'imposer . . .comme mari. . .","CYRANO:\nPostiche ?\n(Saluant):\nJe me suis donc battu, madame, et c'est tant mieux,\nNon pour mon vilain nez, mais bien pour vos beaux yeux.","ROXANE:\nPuis. . .je voulais. . .Mais pour l'aveu que je viens faire,\nIl faut que je revoie en vous le. . .presque frère,\nAvec qui je jouais, dans le parc--près du lac !. . .","CYRANO:\nOui. . .vous veniez tous les étés à Bergerac !","ROXANE:\nLes roseaux fournissaient le bois pour vos épées ?. . .","CYRANO:\nEt les maïs, les cheveux blonds pour vos poupées !","ROXANE:\nC'était le temps des jeux. . .","CYRANO:\nDes mûrons aigrelets. . .","ROXANE:\nLe temps où vous faisiez tout ce que je voulais !. . .","CYRANO:\nRoxane, en jupons courts, s'appelait Madeleine. . .","ROXANE:\nJ'étais jolie, alors ?","CYRANO:\nVous n'étiez pas vilaine.","ROXANE:\nParfois, la main en sang de quelque grimpement,\nVous accouriez !--Alors, jouant à la maman,\nJe disais d'une voix qui tâchait d'être dure:\n(Elle lui prend la main):\n'Qu'est-ce que c'est encor que cette égratignure ?'\n(Elle s'arrête stupéfaite):\nOh ! C'est trop fort ! Et celle-ci !\n(Cyrano veut retirer sa main):\nNon ! Montrez-la !\nHein ? à votre âge, encor !--Où t'es-tu fait cela ?","CYRANO:\nEn jouant, du côté de la porte de Nesle.","ROXANE (s'asseyant à une table, et trempant son mouchoir dans un verre\nd'eau):\nDonnez !","CYRANO (s'asseyant aussi):\nSi gentiment ! Si gaiement maternelle !","ROXANE:\nEt, dites-moi,--pendant que j'ôte un peu le sang,--\nIls étaient contre vous ?","CYRANO:\nOh ! pas tout à fait cent.","ROXANE:\nRacontez !","CYRANO:\nNon. Laissez. Mais vous, dites la chose\nQue vous n'osiez tantôt me dire. . .","ROXANE (sans quitter sa main):\nA présent, j'ose,\nCar le passé m'encouragea de son parfum !\nOui, j'ose maintenant. Voilà. J'aime quelqu'un.","CYRANO:\nAh !. . .","ROXANE:\nQui ne le sait pas d'ailleurs.","CYRANO:\nAh !. . .","ROXANE:\nPas encore.","CYRANO:\nAh !. . .","ROXANE:\nMais qui va bientôt le savoir, s'il l'ignore.","CYRANO:\nAh !. . .","ROXANE:\nUn pauvre garçon qui jusqu'ici m'aima\nTimidement, de loin, sans oser le dire. . .","CYRANO:\nAh !. . .","ROXANE:\nLaissez-moi votre main, voyons, elle a la fièvre.--\nMais moi, j'ai vu trembler les aveux sur sa lèvre.","CYRANO:\nAh !. . .","ROXANE (achevant de lui faire un petit bandage avec son mouchoir):\nEt figurez-vous, tenez, que, justement\nOui, mon cousin, il sert dans votre régiment !","CYRANO:\nAh !. . .","ROXANE (riant):\nPuisqu'il est cadet dans votre compagnie !","CYRANO:\nAh !. . .","ROXANE:\nIl a sur son front de l'esprit, du génie,\nIl est fier, noble, jeune, intrépide, beau. . .","CYRANO (se levant tout pâle):\nBeau !","ROXANE:\nQuoi ? Qu'avez-vous ?","CYRANO:\nMoi, rien. . .C'est. . .c'est. . .\n(Il montre sa main, avec un sourire):\nC'est ce bobo.","ROXANE:\nEnfin, je l'aime. Il faut d'ailleurs que je vous die\nQue je ne l'ai jamais vu qu'à la Comédie. . .","CYRANO:\nVous ne vous êtes donc pas parlé ?","ROXANE:\nNos yeux seuls.","CYRANO:\nMais comment savez-vous, alors ?","ROXANE:\nSous les tilleuls\nDe la place Royale, on cause. . .Des bavardes\nM'ont renseignée. . .","CYRANO:\nIl est cadet ?","ROXANE:\nCadet aux gardes.","CYRANO:\nSon nom ?","ROXANE:\nBaron Christian de Neuvillette.","CYRANO:\nHein ?. . .\nIl n'est pas aux cadets.","ROXANE:\nSi, depuis ce matin:\nCapitaine Carbon de Castel-Jaloux.","CYRANO:\nVite,\nVite, on lance son cœur !. . .Mais, ma pauvre petite. . .","LA DUÈGNE (ouvrant la porte du fond):\nJ'ai fini les gâteaux, monsieur de Bergerac !","CYRANO:\nEh bien ! lisez les vers imprimés sur le sac !\n(La duègne disparaît):\n. . .Ma pauvre enfant, vous qui n'aimez que beau langage,\nBel esprit,--si c'était un profane, un sauvage.","ROXANE:\nNon, il a les cheveux d'un héros de d'Urfe !","CYRANO:\nS'il était aussi maldisant que bien coiffé !","ROXANE:\nNon, tous les mots qu'il dit sont fins, je le devine !","CYRANO:\nOui, tous les mots sont fins quand la moustache est fine.\n--Mais si c'était un sot !. . .","ROXANE (frappant du pied):\nEh bien ! j'en mourrais, là !","CYRANO (après un temps):\nVous m'avez fait venir pour me dire cela ?\nJe n'en sens pas très bien l'utilité, madame.","ROXANE:\nAh, c'est que quelqu'un hier m'a mis la mort dans l'âme,\nEt me disant que tous, vous êtes tous Gascons\nDans votre compagnie. . .","CYRANO:\nEt que nous provoquons\nTous les blancs-becs qui, par faveur, se font admettre\nParmis les purs Gascons que nous sommes, sans l'être ?\nC'est ce qu'on vous a dit ?","ROXANE:\nEt vous pensez si j'ai\nTremblé pour lui !","CYRANO (entre ses dents):\nNon sans raison !","ROXANE:\nMais j'ai songé\nLorsque invincible et grand, hier, vous nous apparûtes,\nChâtiant ce coquin, tenant tête à ces brutes,--\nJ'ai songé: s'il voulait, lui que tous ils craindront. . .","CYRANO:\nC'est bien, je défendrai votre petit baron.","ROXANE:\nOh ! n'est-ce pas que vous allez me le défendre ?\nJ'ai toujours eu pour vous une amitié si tendre.","CYRANO:\nOui, oui.","ROXANE:\nVous serez son ami ?","CYRANO:\nJe le serai.","ROXANE:\nEt jamais il n'aura de duel ?","CYRANO:\nC'est juré.","ROXANE:\nOh ! je vous aime bien. Il faut que je m'en aille.\n(Elle remet vivement son masque, une dentelle sur son front, et,\ndistraitement):\nMais vous ne m'avez pas raconté la bataille\nDe cette nuit. Vraiment ce dut être inouï !. . .\n--Dites-lui qu'il m'écrive.\n(Elle lui envoie un petit baiser de la main):\nOh ! je vous aime !","CYRANO:\nOui, oui.","ROXANE:\nCent hommes contre vous ? Allons, adieu.--Nous sommes\nDe grands amis !","CYRANO:\nOui, oui.","ROXANE:\nQu'il m'écrive !--Cent hommes !--\nVous me direz plus tard. Maintenant, je ne puis.\nCent hommes ! Quel courage !","CYRANO (la saluant):\nOh ! j'ai fait mieux depuis.\n(Elle sort. Cyrano reste immobile, les yeux à terre. Un silence. La\nporte de droite s'ouvre. Ragueneau passe sa tête.)","Scène 2.VII.","Cyrano, Ragueneau, les poètes, Carbon de Castel-Jaloux, les cadets, la\nfoule, etc., puis De Guiche.","RAGUENEAU:\nPeut-on rentrer ?","CYRANO (sans bouger):\nOui. . .\n(Ragueneau fait signe et ses amis rentrent. En même temps, à la porte\ndu fond paraît Carbon de Castel-Jaloux, costume de capitaine aux\ngardes, qui fait de grands gestes en apercevant Cyrano.)","CARBON DE CASTEL-JALOUX:\nLe voilà !","CYRANO (levant la tête):\nMon capitaine !. . .","CARBON (exultant):\nNotre héros ! Nous savons tout ! Une trentaine\nDe mes cadets sont là !. . .","CYRANO (reculant):\nMais. . .","CARBON (voulant l'entraîner):\nViens ! on veut te voir !","CYRANO:\nNon !","CARBON:\nIl boivent en face, à la Croix du Trahoir.","CYRANO:\nJe. . .","CARBON (remontant à la porte, et criant à la cantonade, d'une voix de\ntonnerre):\nLe héros refuse. Il est d'humeur bourrue !","UNE VOIX (au dehors):\nAh ! Sandious !\n(Tumulte au dehors, bruit d'épées et de bottes qui se rapprochent.)","CARBON (se frottant les mains):\nLes voici qui traversent la rue !","LES CADETS (entrant dans la rôtisserie):\nMille dious !--Capdedious !--Mordious !--Pocapdedious !","RAGUENEAU (reculant épouvanté):\nMessieurs, vous êtes donc tous de Gascogne !","LES CADETS:\nTous !","UN CADET (à Cyrano):\nBravo !","CYRANO:\nBaron !","UN AUTRE (lui secouant les mains):\nVivat !","CYRANO:\nBaron !","TROISIÈME CADET:\nQue je t'embrasse !","CYRANO:\nBaron !. . .","PLUSIEURS GASCONS:\nEmbrassons-le !","CYRANO (ne sachant auquel répondre):\nBaron !. . .baron !. . .de grâce. . .","RAGUENEAU:\nVous êtes tous barons, messieurs ?","LES CADETS:\nTous ?","RAGUENEAU:\nLe sont-ils ?. . .","PREMIER CADET:\nOn ferait une tour rien qu'avec nos tortils !","LE BRET (entrant, et courant à Cyrano):\nOn te cherche ! Une foule en délire conduite\nPar ceux qui cette nuit marchèrent à ta suite. . .","CYRANO (épouvanté):\nTu ne leur as pas dit où je me trouve ?. . .","LE BRET (se frottant les mains):\nSi !","UN BOURGEOIS (entrant suivi d'un groupe):\nMonsieur, tout le Marais se fait porter ici !\n(Au dehors la rue s'est remplie de monde. Des chaises à porteurs, des\ncarrosses s'arrêtent.)","LE BRET (bas, souriant, à Cyrano):\nEt Roxane ?","CYRANO (vivement):\nTais-toi !","LA FOULE (criant dehors):\nCyrano !. . .\n(Une cohue se précipite dans la pâtisserie. Bousculade. Acclamations.)","RAGUENEAU (debout sur une table):\nMa boutique\nEst envahie ! On casse tout ! C'est magnifique !","DES GENS (autour de Cyrano):\nMon ami. . .mon ami. . .","CYRANO:\nJe n'avais pas hier\nTant d'amis !","LE BRET (ravi):\nLe succès !","UN PETIT MARQUIS (accourant, les mains tendues):\nSi tu savais, mon cher. . .","CYRANO:\nSi tu ?. . .Tu ?. . .Qu'est-ce donc qu'ensemble nous gardâmes ?","UN AUTRE:\nJe veux vous présenter, Monsieur, à quelque
