e et la lui tendant):\nLa voilà.\n(Silence. Les cadets étouffent leurs rires dans les cartes et dans les\ncornets à dés. De Guiche se retourne, les regarde: immédiatement ils\nreprennent leur gravité, leurs jeux; l'un d'eux sifflote avec\nindifférence l'air montagnard joué par le fifre.)","DE GUICHE (prenant l'écharpe):\nMerci. Je vais, avec ce bout d'étoffe claire,\nPouvoir faire un signal,--que j'hésitais à faire.\n(Il va au talus, y grimpe, et agite plusieurs fois l'écharpe en l'air.)","TOUS:\nHein !","LA SENTINELLE (en haut du talus):\nCet homme, là-bas qui se sauve en courant !. . .","DE GUICHE (redescendant):\nC'est un faux espion espagnol. Il nous rend\nDe grands services. Les renseignements qu'il porte\nAux ennemis sont ceux que je lui donne, en sorte\nQue l'on peut influer sur leurs décisions.","CYRANO:\nC'est un gredin !","DE GUICHE (se nouant nonchalamment son écharpe):\nC'est très commode. Nous disions ?. . .\n--Ah ! J'allais vous apprendre un fait. Cette nuit même,\nPour nous ravitailler tentant un coup suprême,\nLe maréchal s'en fut vers Dourlens, sans tambours;\nLes vivandiers du Roi sont là; par les labours\nIl les joindra; mais pour revenir sans encombre,\nIl a pris avec lui des troupes en tel nombre\nQue l'on aurait beau jeu, certe, en nous attaquant:\nLa moitié de l'armée est absente du camp !","CARBON:\nOui, si les Espagnols savaient, ce serait grave.\nMais ils ne savent pas ce départ ?","DE GUICHE:\nIls le savent.\nIls vont nous attaquer.","CARBON:\nAh !","DE GUICHE:\nMon faux espion\nM'est venu prévenir de leur agression.\nIl ajouta: \"J'en peux déterminer la place;\nSur quel point voulez-vous que l'attaque se fasse ?\nJe dirai que de tous c'est le moins défendu,\nEt l'effort portera sur lui.\"--J'ai répondu:\n\"C'est bon. Sortez du camp. Suivez des yeux la ligne:\nCe sera sur le point d'où je vous ferai signe.\"","CARBON (aux cadets):\nMessieurs, préparez-vous !\n(Tous se lèvent. Bruit d'épées et de ceinturons qu'on boucle.)","DE GUICHE:\nC'est dans une heure.","PREMIER CADET:\nAh !. . .bien !. . .\n(Ils se rasseyent tous. On reprend la partie interrompue.)","DE GUICHE (à Carbon):\nIl faut gagner du temps. Le maréchal revient.","CARBON:\nEt pour gagner du temps ?","DE GUICHE:\nVous aurez l'obligeance\nDe vous faire tuer.","CYRANO:\nAh ! voilà la vengeance ?","DE GUICHE:\nJe ne prétendrai pas que si je vous aimais\nJe vous eusse choisis vous et les vôtres, mais,\nComme à votre bravoure on n'en compare aucune,\nC'est mon Roi que je sers en servant ma rancune.","CYRANO (saluant):\nSouffrez que je vous sois, monsieur, reconnaissant.","DE GUICHE (saluant):\nJe sais que vous aimez vous battre un contre cent.\nVous ne vous plaindrez pas de manquer de besogne.\n(Il remonte, avec Carbon.)","CYRANO (aux cadets):\nEh bien donc ! nous allons au blason de Gascogne,\nQui porte six chevrons, messieurs, d'azur et d'or,\nJoindre un chevron de sang qui lui manquait encor !\n(De Guiche cause bas avec Carbon de Castel-Jaloux, au fond. On donne\ndes ordres. La résistance se prépare. Cyrano va vers Christian qui est\nresté immobile, les bras croisés.)","CYRANO (lui mettant la main sur l'épaule):\nChristian ?","CHRISTIAN (secouant la tête):\nRoxane !","CYRANO:\nHélas !","CHRISTIAN:\nAu moins, je voudrais mettre\nTout l'adieu de mon cœur dans une belle lettre !. . .","CYRANO:\nJe me doutais que ce serait pour aujourd'hui.\n(Il tire un billet de son pourpoint):\nEt j'ai fait tes adieux.","CHRISTIAN:\nMontre !. . .","CYRANO:\nTu veux ?. . .","CHRISTIAN (lui prenant la lettre):\nMais oui !\n(Il l'ouvre, lit et s'arrête):\nTiens !","CYRANO:\nQuoi ?","CHRISTIAN:\nCe petit rond ?. . .","CYRANO (reprenant la lettre vivement, et regardant d'un air naïf):\nUn rond ?. . .","CHRISTIAN:\nC'est une larme !","CYRANO:\nOui. . .Poète, on se prend à son jeu, c'est le charme !. . .\nTu comprends. . .ce billet,--c'était très émouvant:\nJe me suis fait pleurer moi-même en l'écrivant.","CHRISTIAN:\nPleurer ?. . .","CYRANO:\nOui. . .parce que. . .mourir n'est pas terrible.\nMais. . .ne plus la revoir jamais. . .voilà l'horrible !\nCar enfin je ne la. . .\n(Christian le regarde):\nnous ne la. . .\n(Vivement):\ntu ne la. . .","CHRISTIAN (lui arrachant la lettre):\nDonne-moi ce billet !\n(On entend une rumeur, au loin, dans le camp.)","LA VOIX D'UNE SENTINELLE:\nVentrebieu, qui va là ?\n(Coups de feu. Bruits de voix. Grelots.)","CARBON:\nQu'est-ce ?. . .","LA SENTINELLE (qui est sur le talus):\nUn carrosse !\n(On se précipite pour voir.)","CRIS:\nQuoi ! Dans le camp ?--Il y entre !\n--Il a l'air de venir de chez l'ennemi !--Diantre !\nTirez !--Non ! Le cocher a crié !--Crié quoi ?--\nIl a crié: Service du Roi !\n(Tout le monde est sur le talus et regarde au dehors. Les grelots se\nrapprochent.)","DE GUICHE:\nHein ? Du Roi !. . .\n(On redescend, on s'aligne.)","CARBON:\nChapeau bas, tous !","DE GUICHE (à la cantonade):\nDu Roi !--Rangez-vous, vile tourbe,\nPour qu'il puisse décrire avec pompe sa courbe !\n(Le carrosse entre au grand trot. Il est couvert de boue et de\npoussière. Les rideaux sont tirés. Deux laquais derrière. Il s'arrête\nnet.)","CARBON (criant):\nBattez aux champs !\n(Roulement de tambours. Tous les cadets se découvrent.)","DE GUICHE:\nBaissez le marchepied !\n(Deux hommes se précipitent. La portière s'ouvre.)","ROXANE (sautant du carrosse):\nBonjour !\n(Le son d'une voix de femme relève d'un seul coup tout ce monde\nprofondément incliné.--Stupeur.)","Scène 4.V.","Les mêmes, Roxane.","DE GUICHE:\nService du Roi ! Vous ?","ROXANE:\nMais du seul roi, l'Amour !","CYRANO:\nAh ! grand Dieu !","CHRISTIAN (s'élancant):\nVous ! Pourquoi ?","ROXANE:\nC'était trop long, ce siège !","CHRISTIAN:\nPourquoi ?. . .","ROXANE:\nJe te dirai !","CYRANO (qui, au son de sa voix, est resté cloué immobile, sans oser\ntourner les yeux vers elle):\nDieu ! La regarderai-je ?","DE GUICHE:\nVous ne pouvez rester ici !","ROXANE (gaiement):\nMais si ! mais si !\nVoulez-vous m'avancer un tambour ?. . .\n(Elle s'assied sur un tambour qu'on avance):\nLà, merci !\n(Elle rit):\nOn a tiré sur mon carrosse !\n(Fièrement):\nUne patrouille !\n--Il a l'air d'être fait avec une citrouille,\nN'est-ce pas ? comme dans le conte, et les laquais\nAvec des rats.\n(Envoyant des lèvres un baiser à Christian):\nBonjour !\n(Les regardant tous):\nVous n'avez pas l'air gais !\n--Savez-vous que c'est loin, Arras ?\n(Apercevant Cyrano):\nCousin, charmée !","CYRANO (a'avançant):\nAh çà ! comment ?. . .","ROXANE:\nComment j'ai retrouvé l'armée ?\nOh ! mon Dieu, mon ami, mais c'est tout simple: j'ai\nMarché tant que j'ai vu le pays ravagé.\nAh ! ces horreurs, il a fallu que je les visse\nPour y croire ! Messieurs, si c'est là le service\nDe votre Roi, le mien vaut mieux !","CYRANO:\nVoyons, c'est fou !\nPar où diable avez-vous bien pu passer ?","ROXANE:\nPar où ?\nPar chez les Espagnols.","PREMIER CADET:\nAh ! qu'elles sont malignes !","DE GUICHE:\nComment avez-vous fait pour traverser leurs lignes ?","LE BRET:\nCela dut être très difficile !. . .","ROXANE:\nPas trop.\nJ'ai simplement passé dans mon carrosse, au trot.\nSi quelque hidalgo montrait sa mine altière,\nJe mettais mon plus beau sourire à la portière,\nEt ces messieurs étant, n'en déplaise aux Français,\nLes plus galantes gens du monde,--je passais !","CARBON:\nOui, c'est un passe-port, certes, que ce sourire !\nMais on a fréquemment dû vous sommer de dire\nOù vous alliez ainsi, madame ?","ROXANE:\nFréquemment.\nAlors je répondais: \"Je vais voir mon amant.\"\n--Aussitôt l'Espagnol à l'air le plus féroce\nRefermait gravement la porte du carrosse,\nD'un geste de la main à faire envie au Roi\nRelevait les mousquets déjà braqués sur moi,\nEt superbe de grâce, à la fois, et de morgue,\nL'ergot tendu sous la dentelle en tuyau d'orgue,\nLe feutre au vent pour que la plume palpitât,\nS'inclinait en disant: \"Passez, señorita !\"","CHRISTIAN:\nMais, Roxane. . .","ROXANE:\nJ'ai dit: mon amant, oui. . .pardonne !\nTu comprends, si j'avais dit: mon mari, personne\nNe m'eût laissé passer !","CHRISTIAN:\nMais. . .","ROXANE:\nQu'avez-vous ?","DE GUICHE:\nIl faut\nVous en aller d'ici !","ROXANE:\nMoi ?","CYRANO:\nBien vite !","LE BRET:\nAu plus tôt !","CHRISTIAN:\nOui !","ROXANE:\nMais comment ?","CHRISTIAN (embarrassé):\nC'est que. . .","CYRANO (de même):\nDans trois quarts d'heure. . .","DE GUICHE (de même):\n. . .ou quatre. . .","CARBON (de même):\nIl vaut mieux. . .","LE BRET (de même):\nVous pourriez. . .","ROXANE:\nJe reste. On va se battre.","TOUS:\nOh ! non !","ROXANE:\nC'est mon mari !\n(Elle se jette dans les bras de Christian):\nQu'on me tue avec toi !","CHRISTIAN:\nMais quels yeux vous avez !","ROXANE:\nJe te dirai pourquoi !","DE GUICHE (désespéré):\nC'est un poste terrible !","ROXANE (se retournant):\nHein ! terrible ?","CYRANO:\nEt la preuve\nC'est qu'il nous l'a donné !","ROXANE (à De Guiche):\nAh ! vous me vouliez veuve ?","DE GUICHE:\nOh ! je vous jure !. . .","ROXANE:\nNon ! Je suis folle à présent !\nEt je ne m'en vais plus !--D'ailleurs, c'est amusant.","CYRANO:\nEh quoi ! la précieuse était une héroïne ?","ROXANE:\nMonsieur de Bergerac, je suis votre cousine.","UN CADET:\nNous vous défendrons bien !","ROXANE (enfiévrée de plus en plus):\nJe le crois, mes amis !","UN AUTRE (avec enivrement):\nTout le camp sent l'iris !","ROXANE:\nEt j'ai justement mis\nUn chapeau qui fera très bien dans la bataille !. . .\n(Regardant de Guiche):\nMais peut-être est-il temps que le comte s'en aille:\nOn pourrait commencer.","DE GUICHE:\nAh ! c'en est trop ! Je vais\nInspecter mes canons, et reviens. . .Vous avez\nLe temps encor: changez d'avis !","ROXANE:\nJamais !\n(De Guiche sort.)","Scène 4.VI.","Les mêmes, moins De Guiche.","CHRISTIAN (suppliant):\nRoxane !. . .","ROXANE:\nNon !","PREMIER CADET (aux autres):\nElle reste !","TOUS (se précipitant, se bousculant, s'astiquant):\nUn peigne !--Un savon !--Ma basane\nEst trouée: une aiguille !--Un ruban !--Ton miroir !--\nMes manchettes !--Ton fer à moustache !--Un rasoir !. . .","ROXANE (à Cyrano qui la supplie encore):\nNon ! rien ne me fera bouger de cette place !","CARBON (après s'être, comme les autres, sanglé, épousseté, avoir brossé\nson chapeau, redressé sa plume et tiré ses manchettes, s'avance vers\nRoxane, et cérémonieusement):\nPeut-être siérait-il que je vous présentasse,\nPuisqu'il en est ainsi, quelques de ces messieurs\nQui vont avoir l'honneur de mourir sous vos yeux.\n(Roxane s'incline et elle attend, debout au bras de Christian. Carbon\nprésente):\nBaron de Peyrescous de Colignac !","LE CADET (saluant):\nMadame. . .","CARBON (continuant):\nBaron de Casterac de Cahuzac.--Vidame\nDe Malgouyre Estressac Lésbas d'Escarabiot.--\nChevalier d'Antignac-Juzet.--Baron Hillot\nDe Blagnac-Saléchan de Castel Crabioules. . .","ROXANE:\nMais combien avez-vous de noms, chacun ?","LE BARON HILLOT:\nDes foules !","CARBON (à Roxane):\nOuvrez la main qui tient votre mouchoir.","ROXANE (ouvre la main et le mouchoir tombe):\nPourquoi ?\n(Toute la compagnie fait le mouvement de s'élancer pour le ramasser.)","CARBON (le ramassant vivement):\nMa compagnie était sans drapeau ! Mais ma foi,\nC'est le plus beau du camp qui flottera sur elle !","ROXANE (souriant):\nIl est un peu petit.","CARBON (attachant le mouchoir à la hampe de sa lance de capitaine):\nMais il est en dentelle !","UN CADET (aux autres):\nJe mourrais sans regret ayant vu ce minois,\nSi j'avais seulement dans le ventre une noix !. . .","CARBON (qui l'a entendu, indigné):\nFi ! parler de manger lorsqu'une exquise femme !. . .","ROXANE:\nMais l'air du camp est vif et, moi-même, m'affame:\nPâtés, chaud-froids, vins fins:--mon menu, le voilà !\n--Voulez-vous m'apporter tout cela !\n(Consternation.)","UN CADET:\nTout cela !","UN AUTRE:\nOù le prendrions-nous, grand Dieu ?","ROXANE (tranquillement):\nDans mon carrosse.","TOUS:\nHein ?","ROXANE:\nMais il faut qu'on serve et découpe, et désosse !\nRegardez mon cocher d'un peu plus près, messieurs,\nEt vous reconnaîtrez un homme précieux:\nChaque sauce sera, si l'on veut, réchauffée !","LES CADETS (se ruant vers le carrosse):\nC'est Ragueneau !\n(Acclamations):\nOh ! Oh !","ROXANE (les suivant des yeux):\nPauvre gens !","CYRANO (lui baisant la main):\nBonne fée !","RAGUENEAU (debout sur le siège comme un charlatan en place publique):\nMessieurs !. . .\n(Enthousiasme.)","LES CADETS:\nBravo ! Bravo !","RAGUENEAU:\nLes Espagnols n'ont pas,\nQuand passaient tant d'appas, vu passer le repas !\n(Applaudissements.)","CYRANO (bas à Christian):\nHum ! hum ! Christian !","RAGUENEAU:\nDistraits par la galanterie\nIls n'ont pas vu. . .\n(Il tire de son siège un plat qu'il élève):\nla galantine !. . .\n(Applaudissements. La galantine passe de mains en mains.)","CYRANO (bas à Christian):\nJe t'en prie,\nUn seul mot !. . .","RAGUENEAU:\nEt Vénus sut occuper leur œil\nPour que Diane en secret, pût passer. . .\n(Il brandit un gigot):\nson chevreuil !\n(Enthousiasme. Le gigot est saisi par vingt mains tendues.)","CYRANO (bas à Christian):\nJe voudrais te parler !","ROXANE (aux cadets qui redescendent, les bras chargés de victuailles):\nPosez cela par terre !\n(Elle met le couvert sur l'herbe, aidée des deux laquais\nimperturbables qui étaient derrière le carrosse):","ROXANE (à Christian, au moment où Cyrano allait l'entraîner à part):\nVous, rendez-vous utile ?\n(Christian vient l'aider. Mouvement d'inquiétude de Cyrano.)","RAGUENEAU:\nUn paon truffé !","PREMIER CADET (épanoui, qui descend en coupant une large tranche de\njambon):\nTonnerre !\nNous n'aurons pas couru notre dernier hasard\nSans faire un gueuleton. . .\n(Se reprenant vivement en voyant Roxane):\npardon ! un balthazar !","RAGUENEAU (lançant les coussins du carrosse):\nLes coussins sont remplis d'ortolans !\n(Tumulte. On éventre les coussins. Rires. Joie.)","TROISIÈME CADET:\nAh ! Viédaze !","RAGUENEAU (lançant des flacons de vin rouge):\nDes flacons de rubis !--\n(De vin blanc):\nDes flacons de topaze !","ROXANE (jetant une nappe pliée à la figure de Cyrano):\nDéfaites cette nappe !. . .Eh ! hop ! Soyez léger !","RAGUENEAU (brandissant une lanterne arrachée):\nChaque lanterne est un petit garde-manger !","CYRANO (bas à Christian, pendant qu'ils arrangent la nappe ensemble):\nIl faut que je te parle avant que tu lui parles !","RAGUENEAU (de plus en plus lyrique):\nLe manche de mon fouet est un saucisson d'Arles !","ROXANE (versant du vin, servant):\nPuisqu'on nous fait tuer, morbleu ! nous nous moquons\nDu reste de l'armée !--Oui ! tout pour les Gascons !\nEt si De Guiche vient, personne ne l'invite !\n(Allant de l'un à l'autre):\nLà, vous avez le temps.--Ne manger pas si vite !--\nBuvez un peu.--Pourquoi pleurez-vous ?","PREMIER CADET:\nC'est trop bon !. . .","ROXANE:\nChut !--Rouge ou blanc ?--Du pain pour monsieur de Carbon !\n--Un couteau !--Votre assiette !--Un peu de croûte ?--Encore ?\nJe vous sers !--Du bourgogne ?--Une aile ?","CYRANO (qui la suit, les bras chargés de plats, l'aidant à servir):\nJe l'adore !","ROXANE (allant vers Christian):\nVous ?","CHRISTIAN:\nRien.","ROXANE:\nSi ! ce biscuit, dans du muscat. . .deux doigts !","CHRISTIAN (essayant de la retenir):\nOh ! dites-moi pourquoi vous vîntes ?","ROXANE:\nJe me dois\nA ces malheureux. . .Chut ! Tout à l'heure !. . .","LE BRET (qui était remonté au fond, pour passer, au bout d'une lance, un\npain à la sentinelle du talus):\nDe Guiche !","CYRANO:\nVite, cachez flacon, plat, terrine, bourriche !\nHop !--N'ayons l'air de rien !. . .\n(A Ragueneau):\nToi, remonte d'un bond\nSur ton siège !--Tout est caché ?. . .\n(En un clin d'œil tout a été repoussé dans les tentes, ou caché sous\nles vêtements, sous les manteaux, dans les feutres.--De Guiche entre\nvivement--et s'arrête, tout d'un coup, reniflant.--Silence.)","Scène 4.VII.","Les mêmes, De Guiche.","DE GUICHE:\nCela sent bon.","UN CADET (chantonnant d'un air détaché):\nTo lo lo !. . .","DE GUICHE (s'arrêtant et le regardant):\nQu'avez-vous, vous ?. . .Vous êtes tout rouge !","LE CADET:\nMoi ?. . .Mais rien. C'est le sang. On va se battre: il bouge !","UN AUTRE:\nPoum. . .poum. . .poum. . .","DE GUICHE (se retournant):\nQu'est cela ?","LE CADET (légèrement gris):\nRien ! C'est une chanson !\nUne petite. . .","DE GUICHE:\nVous êtes gai, mon garçon !","LE CADET:\nL'approche du danger !","DE GUICHE (appelant Carbon de Castel-Jaloux, pour donner un ordre):\nCapitaine ! je. . .\n(Il s'arrête en le voyant):\nPeste !\nVous avez bonne mine aussi !","CARBON (cramoisi, et cachant une bouteille derrière son dos, avec an\ngeste évasif):\nOh !. . .","DE GUICHE:\nIl me reste\nUn canon que j'ai fait porter. . .\n(Il montre un endroit dans la coulisse):\nlà, dans ce coin,\nEt vos hommes pourront s'en servir au besoin.","UN CADET (se dandinant):\nCharmante attention !","UN AUTRE (lui souriant gracieusement):\nDouce sollicitude !","DE GUICHE:\nAh ça ! mais ils sont fous !--\n(Sèchement):\nN'ayant pas l'habitude\nDu canon, prenez garde au recul.","LE PREMIER CADET:\nAh ! pfftt !","DE GUICHE (allant à lui, furieux):\nMais !. . .","LE CADET:\nLe canon des Gascons ne recule jamais !","DE GUICHE (le prenant par le bras et le secouant):\nVous êtes gris !. . .De quoi ?","LE CADET (superbe):\nDe l'odeur de la poudre !","DE GUICHE (haussant les épaules, le repousse et va vivement à Roxane):\nVite, à quoi daignez-vous, madame, vous résoudre ?","ROXANE:\nJe reste !","DE GUICHE:\nFuyez !","ROXANE:\nNon !","DE GUICHE:\nPuisqu'il en est ainsi,\nQu'on me donne un mousquet !","CARBON:\nComment ?","DE GUICHE:\nJe reste aussi.","CYRANO:\nEnfin, Monsieur ! voilà de la bravoure pure !","PREMIER CADET:\nSeriez-vous un Gascon malgré votre guipure ?","ROXANE:\nQuoi !. . .","DE GUICHE:\nJe ne quitte pas une femme en danger.","DEUXIÈME CADET (au premier):\nDis donc ! Je crois qu'on peut lui donner à manger !\n(Toutes les victuailles reparaissent comme par enchantement.)","DE GUICHE (dont les yeux s'allument):\nDes vivres !","UN TROISIÈME CADET:\nIl en sort de sous toutes les vestes !","DE GUICHE (se maîtrisant, avec hauteur):\nEst-ce que vous croyez que je mange vos restes ?","CYRANO (saluant):\nVous faites des progrès !","DE GUICHE (fièrement, et à qui échappe sur le dernier mot une légère\npointe d'accent):\nJe vais me battre à jeun !","PREMIER CADET (exultant de joie):\nA jeung ! Il vient d'avoir l'accent !","DE GUICHE (riant):\nMoi ?","LE CADET:\nC'en est un !\n(Ils se mettent tous à danser.)","CARBON DE CASTEL-JALOUX (qui a disparu depuis un moment derrière le\ntalus, reparaissant sur la crête):\nJ'ai rangé mes piquiers, leur troupe est résolue !\n(Il montre une ligne de piques qui dépasse la crête.)","DE GUICHE (à Roxane, en s'inclinant):\nAcceptez-vous ma main pour passer leur revue ?. . .\n(Elle la prend, ils remontent vers le talus. Tous le monde se découvre\net les suit.)","CHRISTIAN (allant à Cyrano, vivement):\nParle vite !\n(Au moment où Roxane paraît sur la crête, les lances disparaissent,\nabaissées pour le salut, un cri s'élève: elle s'incline.)","LES PIQUIERS (au dehors):\nVivat !","CHRISTIAN:\nQuel était ce secret ?. . .","CYRANO:\nDans le cas où Roxane. . .","CHRISTIAN:\nEh bien ?. . .","CYRANO:\nTe parlerait\nDes lettres ?. . .","CHRISTIAN:\nOui, je sais !. . .","CYRANO:\nNe fais pas la sottise\nDe t'étonner. . .","CHRISTIAN:\nDe quoi ?","CYRANO:\nIl faut que je te dise !. . .\nOh ! mon Dieu, c'est tout simple, et j'y pense aujourd'hui\nEn la voyant. Tu lui. . .","CHRISTIAN:\nParle vite !","CYRANO:\nTu lui. . .\nAs écrit plus souvent que tu ne crois.","CHRISTIAN:\nHein ?","CYRANO:\nDame !\nJe m'en étais chargé: j'interprétais ta flamme !\nJ'écrivais quelquefois sans te dire: j'écris !","CHRISTIAN:\nAh ?","CYRANO:\nC'est tout simple !","CHRISTIAN:\nMais comment t'y es-tu pris,\nDepuis qu'on est bloqué pour ?. . .","CYRANO:\nOh !. . .avant l'aurore\nJe pouvais traverser. . .","CHRISTIAN (se croisant les bras):\nAh ! c'est tout simple encore ?\nEt qu'ai-je écrit de fois par semaine ?. . .Deux ?--Trois ?--\nQuatre ?--","CYRANO:\nPlus.","CHRISTIAN:\nTous les jours ?","CYRANO:\nOui, tous les jours.--Deux fois.","CHRISTIAN (violemment):\nEt cela t'enivrait, et l'ivresse était telle\nQue tu bravais la mort. . .","CYRANO (voyant Roxane qui revient):\nTais-toi ! Pas devant elle !\n(Il rentre vivement dans sa tente.)","Scène 4.VIII.","Roxane, Christian; au fond, allées et venues de cadets. Carbon et De\nGuiche donnent des ordres.","ROXANE (courant à Christian):\nEt maintenant, Christian !. . .","CHRISTIAN (lui prenant les mains):\nEt maintenant, dis-moi\nPourquoi, par ces chemins effroyables, pourquoi\nA travers tous ces rangs de soudards et de reîtres,\nTu m'a rejoint ici ?","ROXANE:\nC'est à cause des lettres !","CHRISTIAN:\nTu dis ?","ROXANE:\nTant pis pour vous si je cours ces dangers !\nCe sont vos lettres qui m'ont grisée ! Ah ! songez\nCombien depuis un mois vous m'en avez écrites,\nEt plus belles toujours !","CHRISTIAN:\nQuoi ! pour quelques petites\nLettres d'amour. . .","ROXANE:\nTais-toi ! Tu ne peux pas savoir !\nMon Dieu, je t'adorais, c'est vrai, depuis qu'un soir,\nD'une voix que je t'ignorais, sous ma fenêtre,\nTon âme commença de se faire connaître. . .\nEh bien ! tes lettres, c'est, vois-tu, depuis un mois,\nComme si tout le temps je l'entendais, ta voix\nDe ce soir-là, si tendre, et qui vous enveloppe !\nTant pis pour toi, j'accours. La sage Pénélope\nNe fût pas demeurée à broder sous son toit,\nSi le seigneur Ulysse eût écrit comme toi,\nMais pour le joindre, elle eût, aussi folle qu'Hélène,\nEnvoyé promener ses pelotons de laine !. . .","CHRISTIAN:\nMais. . .","ROXANE:\nJe lisais, je relisais, je défaillais,\nJ'étais à toi. Chacun de ces petits feuillets\nÉtait comme un pétale envolé de ton âme.\nOn sent à chaque mot de ces lettres de flamme\nL'amour puissant, sincère. . .","CHRISTIAN:\nAh ! sincère et puissant ?\nCela se sent, Roxane ?. . .","ROXANE:\nOh ! si cela se sent !","CHRISTIAN:\nEt vous venez ?. . .","ROXANE:\nJe viens (ô mon Christian, mon maître !\nVous me relèveriez si je voulais me mettre\nA vos genoux, c'est donc mon âme que j'y mets,\nEt vous ne pourrez plus la relever jamais !)\nJe viens te demander pardon (et c'est bien l'heure\nDe demander pardon, puisqu'il se peut qu'on meure !)\nDe t'avoir fait d'abord, dans ma frivolité,\nL'insulte de t'aimer pour ta seule beauté !","CHRISTIAN (avec épouvante):\nAh ! Roxane !","ROXANE:\nEt plus tard, mon ami, moins frivole,\n--Oiseau qui saute avant tout à fait qu'il s'envole,--\nTa beauté m'arrêtant, ton âme m'entraînant,\nJe t'aimais pour les deux ensemble !. . .","CHRISTIAN:\nEt maintenant ?","ROXANE:\nEh bien ! toi-même enfin l'emporte sur toi-même,\nEt ce n'est plus que pour ton âme que je t'aime !","CHRISTIAN (reculant):\nAh ! Roxane !","ROXANE:\nSois donc heureux. Car n'être aimé\nQue pour ce dont on est un instant costumé,\nDoit mettre un cœur avide et noble à la torture;\nMais ta chère pensée efface ta figure,\nEt la beauté par quoi tout d'abord tu me plus,\nMaintenant j'y vois mieux. . .et je ne la vois plus !","CHRISTIAN:\nOh !. . .","ROXANE:\nTu doutes encor d'une telle victoire ?. . .","CHRISTIAN (douloureusement):\nRoxane !","ROXANE:\nJe comprends, tu ne peux pas y croire,\nA cet amour ?. . .","CHRISTIAN:\nJe ne veux pas de cet amour !\nMoi, je veux être aimé plus simplement pour. . .","ROXANE:\nPour\nCe qu'en vous elles ont aimé jusqu'à cette heure ?\nLaissez-vous donc aimer d'une façon meilleure !","CHRISTIAN:\nNon ! c'était mieux avant !","ROXANE:\nAh ! tu n'y entends rien !\nC'est maintenant que j'aime mieux, que j'aime bien !\nC'est ce qui te fait toi, tu m'entends, que j'adore !\nEt moins brillant. . .","CHRISTIAN:\nTais-toi !","ROXANE:\nJe t'aimerais encore !\nSi toute ta beauté tout d'un coup s'envolait. . .","CHRISTIAN:\nOh ! ne dis pas cela !","ROXANE:\nSi, je le dis !","CHRISTIAN:\nQuoi ? laid ?","ROXANE:\nLaid ! je le jure !","CHRISTIAN:\nDieu !","ROXANE:\nEt ta joie est profonde ?","CHRISTIAN (d'une voix étouffée):\nOui. . .","ROXANE:\nQu'as-tu ?","CHRISTIAN (la repoussant doucement):\nRien. Deux mots à dire: une seconde. . .","ROXANE:\nMais ?. . .","CHRISTIAN (lui montrant un groupe de cadets, au fond):\nA ces pauvres gens mon amour t'enleva:\nVa leur sourire un peu puisqu'ils vont mourir. . .va !","ROXANE (attendrie):\nCher Christian !. . .\n(Elle remonte vers les Gascons qui s'empressent repectueusement autour\nd'elle.)","Scène 4.IX.","Christian, Cyrano; au fond Roxane causant avec Carbon et quelques cadets.","CHRISTIAN (appelant vers la tente de Cyrano):\nCyrano ?","CYRANO (reparaissant, armé pour la bataille):\nQu'est-ce ? Te voilà blême !","CHRISTIAN:\nElle ne m'aime plus !","CYRANO:\nComment ?","CHRISTIAN:\nC'est toi qu'elle aime !","CYRANO:\nNon !","CHRISTIAN:\nElle n'aime plus que mon âme !","CYRANO:\nNon !","CHRISTIAN:\nSi !\nC'est donc bien toi qu'elle aime,--et tu l'aimes aussi !","CYRANO:\nMoi ?","CHRISTIAN:\nJe le sais.","CYRANO:\nC'est vrai.","CHRISTIAN:\nComme un fou.","CYRANO:\nDavantage.","CHRISTIAN:\nDis-le-lui !","CYRANO:\nNon !","CHRISTIAN:\nPourquoi ?","CYRANO:\nRegarde mon visage !","CHRISTIAN:\nElle m'aimerait laid !","CYRANO:\nElle te l'a dit !","CHRISTIAN:\nLà !","CYRANO:\nAh ! je suis bien content qu'elle t'ait dit cela !\nMais va, va, ne crois pas cette chose insensée !\n--Mon Dieu, je suis content qu'elle ait eu la pensée\nDe la dire,--mais va, ne la prend pas au mot,\nVa, ne deviens pas laid: elle m'en voudrait trop !","CHRISTIAN:\nC'est ce que je veux voir !","CYRANO:\nNon, non !","CHRISTIAN:\nQu'elle choisisse !\nTu vas lui dire tout !","CYRANO:\nNon, non ! Pas ce supplice.","CHRISTIAN:\nJe tuerais ton bonheur parce que je suis beau ?\nC'est trop injuste !","CYRANO:\nEt moi, je mettrais au tombeau\nLe tien parce que, grâce au hasard qui fait naître,\nJ'ai le don d'exprimer. . .ce que tu sens peut-être ?","CHRISTIAN:\nDis-lui tout !","CYRANO:\nIl s'obstine à me tenter, c'est mal !","CHRISTIAN:\nJe suis las de porter en moi-même un rival !","CYRANO:\nChristian !","CHRISTIAN:\nNotre union--sans témoins--clandestine,\n--Peut se rompre,--si nous survivons !","CYRANO:\nIl s'obstine !. . .","CHRISTIAN:\nOui, je veux être aimé moi-même, ou pas du tout !\n--Je vais voir ce qu'on fait, tiens ! Je vais jusqu'au bout\nDu poste; je reviens: parle, et qu'elle préfère\nL'un de nous deux !","CYRANO:\nCe sera toi !","CHRISTIAN:\nMais. . .je l'espère !\n(Il appelle):\nRoxane !","CYRANO:\nNon ! Non !","ROXANE (accourant):\nQuoi ?","CHRISTIAN:\nCyrano vous dira\nUne chose importante. . .\n(Elle va vivement à Cyrano. Christian sort.)","Scène 4.X.","Roxane, Cyrano, puis Le Bret, Carbon de Castel-Jaloux, les cadets,\nRagueneau, de Guiche, etc.","ROXANE:\nImportante ?","CYRANO (éperdu):\nIl s'en va !. . .\n(A Roxane):\nRien !. . .Il attache,--oh ! Dieu ! vous devez le connaître !--\nDe l'importance à rien !","ROXANE (vivement):\nIl a douté peut-être\nDe ce que j'ai dit là ?. . .J'ai vu qu'il a douté !. . .","CYRANO (lui prenant la main):\nMais avez-vous bien dit, d'ailleurs, la vérité ?","ROXANE:\nOui, oui, je l'aimerais même. . .\n(Elle hésite une seconde.)","CYRANO (souriant tristement):\nLe mot vous gêne\nDevant moi ?","ROXANE:\nMais. . .","CYRANO:\nIl ne me fera pas de peine !\n--Même laid ?","ROXANE:\nMême laid !\n(Mousqueterie au dehors):\nAh ! tiens, on a tiré !","CYRANO (ardemment):\nAffreux ?","ROXANE:\nAffreux !","CYRANO:\nDéfiguré !","ROXANE:\nDéfiguré !","CYRANO:\nGrotesque ?","ROXANE:\nRien ne peut me le rendre grotesque !","CYRANO:\nVous l'aimeriez encore ?","ROXANE:\nEt davantage presque !","CYRANO (perdant la tête, à part):\nMon Dieu, c'est vrai, peut-être, et le bonheur est là !\n(A Roxane):\nJe. . .Roxane. . .écoutez !. . .","LE BRET (entrant rapidement, appelle à mi-voix):\nCyrano !","CYRANO (se retournant):\nHein ?","LE BRET:\nChut !\n(Il lui dit un mot tout bas.)","CYRANO (laissant échapper la main de Roxane, avec un cri):\nAh !. . .","ROXANE:\nQu'avez vous ?","CYRANO (à lui-même, avec stupeur):\nC'est fini.\n(Détonations nouvelles.)","ROXANE:\nQuoi ? Qu'est-ce encore ? On tire ?\n(Elle remonte pour regarder au dehors.)","CYRANO:\nC'est fini, jamais plus je ne pourrai le dire !","ROXANE (voulant s'élancer):\nQue se passe-t-il ?","CYRANO (vivement, l'arrêtant):\nRien !\n(Des cadets sont entrés, cachant quelque chose qu'ils portent, et ils\nforment un groupe empêchant Roxane d'approcher.)","ROXANE:\nCes hommes ?","CYRANO (l'éloignant):\nLaissez-les !. . .","ROXANE:\nMais qu'alliez-vous me dire avant ?. . .","CYRANO:\nCe que j'allais\nVous dire ?. . .rien, oh ! rien, je le jure, madame !\n(Solennellement):\nJe jure que l'esprit de Christian, que son âme\nÉtaient. . .\n(Se reprenant avec terreur):\nsont les plus grands. . .","ROXANE:\nÉtaient ?\n(Avec un grand cri):\nAh !. . .\n(Elle se précipite et écarte tout le monde.)","CYRANO:\nC'est fini !","ROXANE (voyant Christian couché dans son manteau):\nChristian !","LE BRET (à Cyrano):\nLe premier coup de feu le l'ennemi !\n(Roxane se jette sur le corps de Christian. Nouveaux coups de feu.\nCliquetis. Rumeurs. Tambours.)","CARBON DE CASTEL-JALOUX (l'épée au poing):\nC'est l'attaque ! Aux mousquets !\n(Suivi des cadets, il passe de l'autre côté du talus.)","ROXANE:\nChristian !","LA VOIX DE CARBON (derrière le talus):\nQu'on se dépêche !","ROXANE:\nChristian !","CARBON:\nAlignez-vous !","ROXANE:\nChristian !","CARBON:\nMesurez. . .mèche !\n(Ragueneau est accouru, apportant de l'eau dans un casque.)","CHRISTIAN (d'une voix mourante):\nRoxane !. . .","CYRANO (vite et bas à l'oreille de Christian, pendant que Roxane affolée\ntrempe dans l'eau, pour le panser, un morceau de linge arraché à sa\npoitrine):\nJ'ai tout dit. Ce toi qu'elle aime encor !\n(Christian ferme les yeux.)","ROXANE:\nQuoi, mon amour ?","CARBON:\nBaguette haute !","ROXANE (à Cyrano):\nIl n'est pas mort ?. . .","CARBON:\nOuvrez la charge avec les dents !","ROXANE:\nJe sens sa joue\nDevenir froide, là, contre la mienne !","CARBON:\nEn joue !","ROXANE:\nUne lettre sur lui !\n(Elle l'ouvre):\nPour moi !","CYRANO (à part):\nMa lettre !","CARBON:\nFeu !\n(Mousqueterie. Cris. Bruit de bataille.)","CYRANO (voulant dégager sa main que tient Roxane agenouillée):\nMais, Roxane, on se bat !","ROXANE (le retenant):\nRestez encore un peu.\nIl est mort. Vous étiez le seul à le connaître.\n(Elle pleure doucement):\n--N'est-ce pas que c'était un être exquis, un être\nMerveilleux ?","CYRANO (debout, tête nue):\nOui, Roxane.","ROXANE:\nUn poète inouï.\nAdorable ?","CYRANO:\nOui, Roxane.","ROXANE:\nUn esprit sublime ?","CYRANO:\nOui,\nRoxane !","ROXANE:\nUn cœur profond, inconnu du profane,\nUne âme magnifique et charmante ?","CYRANO (fermement):\nOui, Roxane !","ROXANE (se jetant sur le corps de Christian):\nIl est mort !","CYRANO (à part, tirant l'épée):\nEt je n'ai qu'à mourir aujourd'hui,\nPuisque, sans le savoir, elle me pleure en lui !\n(Trompettes au loin.)","DE GUICHE (qui reparaît sur le talus, décoiffé, blessé au front, d'une\nvoix tonnante):\nC'est le signal promis ! Des fanfares de cuivres !\nLes Français vont rentrer au camp avec des vivres !\nTenez encore un peu !","ROXANE:\nSur sa lettre, du sang,\nDes pleurs !","UNE VOIX (au dehors, criant):\nRendez-vous !","VOIX DES CADETS:\nNon !","RAGUENEAU (qui, grimpé sur son carrosse, regarde la bataille par-dessus\nle talus):\nLe péril va croissant !","CYRANO (à de Guiche, lui montrant Roxane):\nEmportez-la ! Je vais charger !","ROXANE (baisant la lettre, d'une voix mourante):\nSon sang ! ses larmes !. . .","RAGUENEAU (sautant à bas du carrosse pour courir vers elle):\nElle s'évanouit !","DE GUICHE (sur le talus, aux cadets, avec rage):\nTenez bon !","UNE VOIX (au dehors):\nBas les armes !","VOIX DES CADETS:\nNon !","CYRANO (à de Guiche):\nVous avez prouvé, Monsieur, votre valeur:\n(Lui montrant Roxane):\nFuyez en la sauvant !","DE GUICHE (qui court à Roxane et l'enlève dans ses bras):\nSoit ! Mais on est vainqueur\nSi vous gagnez du temps !","CYRANO:\nC'est bon !\n(Criant vers Roxane que de Guiche, aidé de Ragueneau, emporte évanouie):\nAdieu, Roxane !\n(Tumulte. Cris. Des cadets reparaissent blessés et viennent tomber en\nscène. Cyrano se précipitant au combat est arrêté sur la crête par\nCarbon de Castel-Jaloux, couvert de sang.)","CARBON:\nNous plions ! J'ai reçu deux coups de pertuisane !","CYRANO (criant aux Gascons):\nHardi ! Reculès pas, drollos !\n(A Carbon, qu'il soutient):\nN'ayez pas peur !\nJ'ai deux morts à venger: Christian et mon bonheur !\n(Ils redescendent. Cyrano brandit la lance où est attaché le mouchoir\nde Roxane):\nFlotte, petit drapeau de dentelle à son chiffre !\n(Il la plante en terre; il crie aux cadets):\nToumbé dèssus ! Escrasas lous !\n(Au fifre):\nUn air de fifre !\n(Le fifre joue. Des blessés se relèvent. Des cadets dégringolant le\ntalus, viennent se grouper autour de Cyrano et du petit drapeau. Le\ncarrosse se couvre et se remplit d'hommes, se hérisse d'arquebuses, se\ntransforme en redoute.)","UN CADET (paraissant, à reculons, sur la crête, se battant toujours, crie):\nIls montent le talus !\n(et tombe mort.)","CYRANO:\nOn va les saluer !\n(Le talus se couronne en un instant d'une rangée terrible d'ennemis.\nLes grands étendards des Impériaux se lèvent):\nFeu !\n(Décharge générale.)","CRI (dans les rangs ennemis):\nFeu !\n(Riposte meurtrière. Les cadets tombent de tous côtés.)","UN OFFICIER ESPAGNOL (se découvrant):\nQuels sont ces gens qui se font tous tuer ?","CYRANO (récitant debout au milieu des balles):\nCe sont les cadets de Gascogne,\nDe Carbon de Castel-Jaloux;\nBretteurs et menteurs sans vergogne. . .\n(Il s'élance, suivi des quelques survivants):\nCe sont les cadets. . .\n(Le reste se perd dans la bataille.)","Rideau."]},{"name":"Acte V","paragraphs":["La Gazette de Cyrano.","Quinze ans après, en 1655. Le parc du couvent que les Dames de la Croix\noccupaient à Paris.","Superbes ombrages. A gauche, la maison; vaste perron sur lequel ouvrent\nplusieurs portes. Un arbre énorme au milieu de la scène, isolé au milieu\nd'une petite place ovale. A droite, premier plan, parmi de grands buis,\nun banc de pierre demi-circulaire.","Tout le fond du théâtre est traversé par une allée de marroniers qui\naboutit à droite, quatrième plan, à la porte d'une chapelle entre-vue\nparmi les branches. A travers le double rideau d'arbres de cette allée,\non aperçoit des fuites de pelouses, d'autres allées, des bosquets, les\nprofondeurs du parc, le ciel.","La chapelle ouvre une porte latérale sur une colonnade enguirlandée de\nvigne rougie, qui vient se perdre à droite, au premier plan, derrière\nles buis.","C'est l'automne. Toute la frondaison est rousse au-dessus des pelouses\nfraîches. Taches sombres des buis et des ifs restés verts. Une plaque de\nfeuilles jaunes sous chaque arbre. Les feuilles jonchent toute la scène,\ncraquent sous les pas dans les allées, couvrent à demi le perron et les\nbancs.","Entre le banc de droite et l'arbre, un grand métier à broder devant\nlequel une petite chaise a été apportée. Paniers pleins d'écheveaux et\nde pelotons. Tapisserie commencée.","Au lever du rideau, des sœurs vont et viennent dans le parc;\nquelques-unes sont assises sur le banc autour d'une religieuse plus\nâgée. Des feuilles tombent.","Scène 5.I.","Mère Marguerite, Sœur Marthe, Sœur Claire, les sœurs.","SŒUR MARTHE (à Mère Marguerite):\nSœur Claire a regardé deux fois comment allait\nSa cornette, devant la glace.\nMÈRE MARGUERITE (à sœur Claire):\nC'est très laid.","SŒUR CLAIRE:\nMais sœur Marthe a repris un pruneau de la tarte,\nCe matin: je l'ai vu.\nMÈRE MARGUERITE (à sœur Marthe):\nC'est très vilain, sœur Marthe.","SŒUR CLAIRE:\nUn tout petit regard !","SŒUR MARTHE:\nUn tout petit pruneau !\nMÈRE MARGUERITE (sévèrement):\nJe le dirai, ce soir, à monsieur Cyrano.","SŒUR CLAIRE (épouvantée):\nNon, il va se moquer !","SŒUR MARTHE:\nIl dira que les nonnes\nSont très coquettes !","SŒUR CLAIRE:\nTrès gourmandes !","MÈRE MARGUERITE (souriant):\nEt très bonnes.","SŒUR CLAIRE:\nN'est-ce pas, Mère Marguerite de Jésus,\nQu'il vient, le samedi, depuis dix ans !","MÈRE MARGUERITE:\nEt plus !\nDepuis que sa cousine à nos béguins de toile\nMêla le deuil mondain de sa coiffe de voile,\nQui chez nous vint s'abattre, il y a quatorze ans,\nComme un grand oiseau noir parmi les oiseaux blancs !","SŒUR MARTHE:\nLui seul, depuis qu'elle a pris chambre dans ce cloître,\nSait distraire un chagrin qui ne veut pas décroître.","TOUTES LES SŒURS:\nIl est si drôle !--C'est amusant quand il vient !\n--Il nous taquine !--Il est gentil !--Nous l'aimons bien !\n--Nous fabriquons pour lui des pâtes d'angélique !","SŒUR MARTHE:\nMais enfin, ce n'est pas un très bon catholique !","SŒUR CLAIRE:\nNous le convertirons.","LES SŒURS:\nOui ! oui !","MÈRE MARGUERITE:\nJe vous défends\nDe l'entreprendre encor sur ce point, mes enfants.\nNe le tourmentez pas: il viendrait moins peut-être !","SŒUR MARTHE:\nMais. . .Dieu !. . .","MÈRE MARGUERITE:\nRassurez-vous: Dieu doit bien le connaître.","SŒUR MARTHE:\nMais chaque samedi, quand il vient d'un air fier,\nIl me dit en entrant: 'Ma sœur, j'ai fait gras, hier !'","MÈRE MARGUERITE:\nAh ! il vous dit cela ?. . .Eh bien ! la fois dernière\nIl n'avait pas mangé depuis deux jours !","SŒUR MARTHE:\nMa Mère !","MÈRE MARGUERITE:\nIl est pauvre.","SŒUR MARTHE:\nQui vous l'a dit ?","MÈRE MARGUERITE:\nMonsieur Le Bret.","SŒUR MARTHE:\nOn ne le secourt pas ?","MÈRE MARGUERITE:\nNon, il se fâcherait.\n(Dans une allée du fond, on voit apparaître Roxane, vêtue de noir,\navec la coiffe des veuves et de long voiles; de Guiche, magnifique et\nvieillissant, marche auprès d'elle. Ils vont à pas lents. Mère\nMarguerite se lève):\n--Allons, il faut rentrer. . .Madame Madeleine,\nAvec un visiteur, dans le parc se promène.","SŒUR MARTHE (bas à sœur Claire):\nC'est le duc-maréchal de Grammont ?","SŒUR CLAIRE (regardant):\nOui, je crois.","SŒUR MARTHE:\nIl n'était plus venu la voir depuis des mois !","LES SŒURS:\nIl est très pris !--La cour !--Les camps !","SŒUR CLAIRE:\nLes soins du monde !\n(Elles sortent. De Guiche et Roxane descendent en silence et\ns'arrêtent près du métier. Un temps.)","Scène 5.II.","Roxane; le duc de Grammont, ancien comte de Guiche, puis Le Bret et\nRagueneau.","LE DUC:\nEt vous demeurerez ici, vainement blonde,\nToujours en deuil ?","ROXANE:\nToujours.","LE DUC:\nAussi fidèle ?","ROXANE:\nAussi.","LE DUC (après un temps):\nVous m'avez pardonné ?","ROXANE (simplement, regardant la croix du couvent):\nPuisque je suis ici.\n(Nouveau silence.)","LE DUC:\nVraiment c'était un être ?. . .","ROXANE:\nIl fallait le connaître !","LE DUC:\nAh ! Il fallait ?. . .Je l'ai trop peu connu, peut-être !\n. . .Et son dernier billet, sur votre cœur, toujours ?","ROXANE:\nComme un doux scapulaire, il pend à ce velours.","LE DUC:\nMême mort, vous l'aimez ?","ROXANE:\nQuelquefois il me semble\nQu'il n'est mort qu'à demi, que nos cœurs sont ensemble,\nEt que son amour flotte, autour de moi, vivant !","LE DUC (après un silence encore):\nEst-ce que Cyrano vient vous voir ?","ROXANE:\nOui, souvent.\n--Ce vieil ami, pour moi, remplace les gazettes.\nIl vient; c'est régulier; sous cet arbre où vous êtes\nOn place son fauteuil, s'il fait beau; je l'attends\nEn brodant; l'heure sonne; au dernier coup, j'entends\n--Car je ne tourne plus même le front !--sa canne\nDescendre le perron; il s'assied; il ricane\nDe ma tapisserie éternelle; il me fait\nLa chronique de la semaine, et. . .\n(Le Bret paraît sur le perron):\nTiens, Le Bret !\n(Le Bret descend):\nComment va notre ami ?","LE BRET:\nMal.","LE DUC:\nOh !","ROXANE (au duc):\nIl exagère !","LE BRET:\nTout ce que j'ai prédit: l'abandon, la misère !. . .\nSes épîtres lui font des ennemis nouveaux !\nIl attaque les faux nobles, les faux dévots,\nLes faux braves, les plagiaires,--tout le monde.","ROXANE:\nMais son épée inspire une terreur profonde.\nOn ne viendra jamais à bout de lui.","LE DUC (hochant la tête):\nQui sait ?","LE BRET:\nCe que je crains, ce n'est pas les attaques, c'est\nLa solitude, la famine, c'est Décembre\nEntrant à pas de loup dans son obscure chambre:\nVoilà les spadassins qui plutôt le tueront !\n--Il serre chaque jour, d'un cran, son ceinturon.\nSon pauvre nez a pris des tons de vieil ivoire.\nIl n'a plus qu'un petit habit de serge noire.","LE DUC:\nAh ! celui-là n'est pas parvenu !--C'est égal,\nNe le plaignez pas trop.","LE BRET (avec un sourire amer):\nMonsieur le maréchal !. . .","LE DUC:\nNe le plaignez pas trop: il a vécu sans pactes,\nLibre dans sa pensée autant que dans ses actes.","LE BRET (de même):\nMonsieur le duc !. . .","LE DUC (hautainement):\nJe sais, oui: j'ai tout; il n'a rien. . .\nMais je lui serrerais bien volontiers la main.\n(Saluant Roxane):\nAdieu.","ROXANE:\nJe vous conduis.\n(Le duc salue Le Bret et se dirige avec Roxane vers le perron.)","LE DUC (s'arrêtant, tandis qu'elle monte):\nOui, parfois, je l'envie.\n--Voyez-vous, lorsqu'on a trop réussi sa vie,\nOn sent,--n'ayant rien fait, mon Dieu, de vraiment mal !--\nMille petits dégoûts de soi, dont le total\nNe fait pas un remords, mais une gêne obscure;\nEt les manteaux de duc traînent dans leur fourrure,\nPendant que des grandeurs on monte les degrés,\nUn bruit d'illusions sèches et de regrets,\nComme, quand vous montez lentement vers ces portes,\nVotre robe de deuil traîne des feuilles mortes.","ROXANE (ironique):\nVous voilà bien rêveur ?. . .","LE DUC:\nEh ! oui !\n(Au moment de sortir, brusquement):\nMonsieur Le Bret !\n(A Roxane):\nVous permettez ? Un mot.\n(Il va à Le Bret, et à mi-voix):\nC'est vrai: nul n'oserait\nAttaquer votre ami; mais beaucoup l'ont en haine;\nEt quelqu'un me disait, hier, au jeu, chez la Reine:\n\"Ce Cyrano pourrait mourir d'un accident.\"","LE BRET:\nAh ?","LE DUC:\nOui. Qu'il sorte peu. Qu'il soit prudent.","LE BRET (levant les bras au ciel):\nPrudent !\nIl va venir. Je vais l'avertir. Oui, mais !. . .","ROXANE (qui est restée sur le perron, à une sœur qui s'avance vers elle):\nQu'est-ce ?","LA SŒUR:\nRagueneau vent vous voir, Madame.","ROXANE:\nQu'on le laisse\nEntrer.\n(Au duc et à Le Bret):\nIl vient crier misère. Étant un jour\nParti pour être auteur, il devint tour à tour\nChantre. . .","LE BRET:\nÉtuviste. . .","ROXANE:\nActeur. . .","LE BRET:\nBedeau. . .","ROXANE:\nPerruquier. . .","LE BRET:\nMaître\nDe théorbe. . .","ROXANE:\nAujourd'hui que pourrait-il bien être ?","RAGUENEAU (entrant précipitamment):\nAh ! Madame !\n(Il aperçoit Le Bret):\nMonsieur !","ROXANE (souriant):\nRacontez vos malheurs\nA Le Bret. Je reviens.","RAGUENEAU:\nMais, Madame. . .\n(Roxane sort sans l'écouter, avec le duc. Il redescend vers le Bret.)","Scène 5.III.","Le Bret, Ragueneau.","RAGUENEAU:\nD'ailleurs,\nPuisque vous êtes là, j'aime mieux qu'elle ignore !\n--J'allais voir votre ami tantôt. J'étais encore\nA vingt pas de chez lui. . .quand je le vois de loin,\nQui sort. Je veux le joindre. Il va tourner le coin\nDe la rue. . .et je cours. . .lorsque d'une fenêtre\nSous laquelle il passait--est-ce un hasard ?. . .peut-être !--\nUn laquais laisse choir une pièce de bois.","LE BRET:\nLes lâches !. . .Cyrano !","RAGUENEAU:\nJ'arrive et je le vois. . .","LE BRET:\nC'est affreux !","RAGUENEAU:\nNotre ami, Monsieur, notre poète,\nJe le vois, là, par terre, un grand trou dans la tête !","LE BRET:\nIl est mort ?","RAGUENEAU:\nNon ! mais. . .Dieu ! je l'ai porté chez lui.\nDans sa chambre. . .Ah ! sa chambre ! il faut voir ce réduit !","LE BRET:\nIl souffre ?","RAGUENEAU:\nNon, Monsieur, il est sans connaissance,","LE BRET:\nUn médecin ?","RAGUENEAU:\nIl en vint un par complaisance,","LE BRET:\nMon pauvre Cyrano !--Ne disons pas cela\nTout d'un coup à Roxane !--Et ce docteur ?","RAGUENEAU:\nIl a\nParlé,--je ne sais plus,--de fièvre, de méninges !. . .\nAh ! si vous le voyiez--la tête dans des linges !. . .\nCourons vite !--Il n'y a personne à son chevet !--\nC'est qu'il pourrait mourir, Monsieur, s'il se levait !","LE BRET (l'entraînant vers la droite):\nPassons par là ! Viens, c'est plus court ! Par la chapelle !","ROXANE (paraissant sur le perron et voyant Le Bret s'éloigner par la\ncolonnade qui mène a la petite porte de la chapelle):\nMonsieur Le Bret !\n(Le Bret et Ragueneau se sauvent sans répondre):\nLe Bret s'en va quand on l'appelle ?\nC'est quelque histoire encor de ce bon Ragueneau !\n(Elle descend le perron.)","Scène 5.IV.","Roxane seule, puis deux sœurs, un instant.","ROXANE:\nAh ! que ce dernier jour de septembre est donc beau !\nMa tristesse sourit. Elle qu'Avril offusque,\nSe laisse décider par l'automne, moins brusque.\n(Elle s'assied à son métier. Deux sœurs sortent de la maison et\napportent un grand fauteuil sous l'arbre):\nAh ! voici le fauteuil classique où vient s'asseoir\nMon vieil ami !","SŒUR MARTHE:\nMais c'est le meilleur du parloir !","ROXANE:\nMerci, ma sœur.\n(Les sœurs s'éloignent):\nIl va venir.\n(Elle s'installe. On entend sonner l'heure):\nLà. . .l'heure sonne.\n--Mes écheveaux !--L'heure a sonné ? Ceci m'étonne !\nSerait-il en retard pour la première fois ?\nLa sœur tourière doit--mon dé ?. . .là, je le vois !--\nL'exhorter à la pénitence.\n(Un temps):\nElle l'exhorte !\n--Il ne peut plus tarder.--Tiens ! une feuille morte !--\n(Elle repousse du doigt la feuille tombée sur son métier):\nD'ailleurs, rien ne pourrait.--Mes ciseaux ?. . .dans mon sac !--\nL'empêcher de venir !","UNE SŒUR (paraissant sur le perron):\nMonsieur de Bergerac.","Scène 5.V.","Roxane, Cyrano et, un moment, sœur Marthe.","ROXANE (sans se retourner):\nQu'est-ce que je disais ?. . .\n(Et elle brode. Cyrano, très pâle, le feutre enfoncé sur les yeux,\nparaît. La sœur qui l'a introduit rentre. Il se met à descendre le\nperron lentement, avec un effort visible pour se tenir debout, et en\ns'appuyant sur sa canne. Roxane travaille à sa tapisserie):\nAh ! ces teintes fanées. . .\nComment les rassortir ?\n(A Cyrano, sur un ton d'amicale gronderie):\nDepuis quatorze années,\nPour la première fois, en retard !","CYRANO (qui est parvenu au fauteuil et s'est assis, d'une voix gaie,\ncontrastant avec son visage):\nOui, c'est fou !\nJ'enrage. Je fus mis en retard, vertuchou !. . .","ROXANE:\nPar ?. . .","CYRANO:\nPar une visite assez inopportune.","ROXANE (distraite, travaillant):\nAh ! oui ! quelque fâcheux ?","CYRANO:\nCousine, c'était une\nFâcheuse.","ROXANE:\nVous l'avez renvoyée ?","CYRANO:\nOui, j'ai dit:\nExcusez-moi, mais c'est aujourd'hui samedi,\nJour où je dois me rendre en certaine demeure;\nRien ne m'y fait manquer: repassez dans une heure !","ROXANE (légèrement):\nEh bien ! cette personne attendra pour vous voir:\nJe ne vous laisse pas partir avant ce soir.","CYRANO (avec douceur):\nPeut-être un peu plus tôt faudra-t-il que je parte.\n(Il ferme les yeux et se tait un instant. Sœur Marthe traverse le\nparc de la chapelle au perron. Roxane l'aperçoit, lui fait un petit\nsigne de tête.)","ROXANE (à Cyrano):\nVous ne taquinez pas sœur Marthe ?","CYRANO (vivement, ouvrant les yeux):\nSi !\n(Avec une grosse voix comique):\nSœur Marthe !\nApprochez !\n(La sœur glisse vers lui):\nHa ! ha ! ha ! Beaux yeux toujours baissés !","SŒUR MARTHE (levant les yeux en souriant):\nMais. . .\n(Elle voit sa figure et fait un geste d'étonnement):\nOh !","CYRANO (bas, lui montrant Roxane):\nChut ! Ce n'est rien !--\n(D'une voix fanfaronne. Haut):\nHier, j'ai fait gras.","SŒUR MARTHE:\nJe sais.\n(A part):\nC'est pour cela qu'il est si pâle !\n(Vite et bas):\nAu réfectoire\nVous viendrez tout à l'heure, et je vous ferai boire\nUn grand bol de bouillon. . .Vous viendrez ?","CYRANO:\nOui, oui, oui.","SŒUR MARTHE:\nAh ! vous êtes un peu raisonnable, aujourd'hui !","ROXANE (qui les entend chuchoter):\nElle essaye de vous convertir ?","SŒUR MARTHE:\nJe m'en garde !","CYRANO:\nTiens, c'est vrai ! Vous toujours si saintement bavarde,\nVous ne me prêchez pas ? c'est étonnant, ceci !. . .\n(Avec une fureur bouffonne):\nSabre de bois ! Je veux vous étonner aussi !\nTenez, je vous permets. . .\n(Il a l'air de chercher une bonne taquinerie, et de la trouver):\nAh ! la chose est nouvelle ?. . .\nDe. . .de prier pour moi, ce soir, à la chapelle.","ROXANE:\nOh ! oh !","CYRANO (riant):\nSœur Marthe est dans la stupéfaction !","SŒUR MARTHE (doucement):\nJe n'ai pas attendu votre permission.\n(Elle rentre.)","CYRANO (revenant à Roxane, penchée sur son métier):\nDu diable si je peux jamais, tapisserie,\nVoir ta fin !","ROXANE:\nJ'attendais cette plaisanterie.\n(A ce moment un peu de brise fait tomber les feuilles.)","CYRANO:\nLes feuilles !","ROXANE (levant la tête, et regardant au loin, dans les allées):\nElles sont d'un blond vénitien.\nRegardez-les tomber.","CYRANO:\nComme elles tombent bien !\nDans ce trajet si court de la branche à la terre,\nComme elles savent mettre une beauté dernière,\nEt malgré leur terreur de pourrir sur le sol,\nVeulent que cette chute ait la grâce d'un vol !","ROXANE:\nMélancolique, vous ?","CYRANO (se reprenant):\nMais pas du tout, Roxane !","ROXANE:\nAllons, laissez tomber les feuilles de platane. . .\nEt racontez un peu ce qu'il y a de neuf.\nMa gazette ?","CYRANO:\nVoici !","ROXANE:\nAh !","CYRANO (de plus en plus pâle, et luttant contre la douleur):\nSamedi, dix-neuf:\nAyant mangé huit fois du raisiné de Cette,\nLe Roi fut pris de fièvre; à deux coups de lancette\nSon mal fut condamné pour lèse-majesté,\nEt cet auguste pouls n'a plus fébricité !\nAu grand bal, chez la reine, on a brûlé, dimanche,\nSept cent soixante-trois flambeaux de cire blanche;\nNos troupes ont battu, dit-on, Jean l'Autrichien;\nOn a pendu quatre sorciers; le petit chien\nDe madame d'Athis a dû prendre un clystère. . .","ROXANE:\nMonsieur de Bergerac, voulez-vous bien vous taire !","CYRANO:\nLundi. . .rien. Lygdamire a changé d'amant.","ROXANE:\nOh !","CYRANO (dont le visage s'altère de plus en plus):\nMardi, toute la cour est à Fontainebleau.\nMercredi, la Montglat dit au comte de Fiesque:\nNon ! Jeudi: Mancini, Reine de France,--ou presque !\nLe vingt-cinq, la Monglat à de Fiesque dit: Oui;\nEt samedi, vingt-six. . .\n(Il ferme les yeux. Sa tête tombe. Silence.)","ROXANE (surprise de ne plus rien entendre, se retourne, le regarde, et\nse levant effrayée):\nIl est évanoui ?\n(Elle court vers lui en criant):\nCyrano !","CYRANO (rouvrant les yeux, d'une voix vague):\nQu'est-ce ?. . .Quoi ?. . .\n(Il voit Roxane penchée sur lui et, vivement, assurant son chapeau sur\nsa tête et reculant avec effroi dans son fauteuil):\nNon ! non ! je vous assure,\nCe n'est rien ! Laissez-moi !","ROXANE:\nPourtant. . .","CYRANO:\nC'est ma blessure\nD'Arras. . .qui. . .quelquefois. . .vous savez. . .","ROXANE:\nPauvre ami !","CYRANO:\nMais ce n'est rien. Cela va finir.\n(Il sourit avec effort):\nC'est fini.","ROXANE (debout près de lui):\nChacun de nous a sa blessure: j'ai la mienne.\nToujours vive, elle est là, cette blessure ancienne,\n(Elle met la main sur sa poitrine):\nElle est là, sous la lettre au papier jaunissant\nOù l'on peut voir encor des larmes et du sang !\n(Le crépuscule commence à venir.)","CYRANO:\nSa lettre !. . .N'aviez-vous pas dit qu'un jour, peut-être,\nVous me la feriez lire ?","ROXANE:\nAh ! vous voulez ?. . .Sa lettre ?","CYRANO:\nOui. . .Je veux. . .Aujourd'hui. . .","ROXANE (lui donnant le sachet pendu à son cou):\nTenez !","CYRANO (le prenant):\nJe peux ouvrir ?","ROXANE:\nOuvrez. . .lisez !. . .\n(Elle revient à son métier, le replie, range ses laines.)","CYRANO (lisant):\nRoxane, adieu, je vais mourir !. . .","ROXANE (s'arrêtant, étonnée):\nTout haut ?","CYRANO (lisant):\nC'est pour ce soir, je crois, ma bien-aimée !\nJ'ai l'âme lourde encor d'amour inexprimée,\nEt je meurs ! jamais plus, jamais mes yeux grisés,\nMes regards dont c'était. . .","ROXANE:\nComment vous la lisez,\nSa lettre !","CYRANO (continuant):\n. . .dont c'était les frémissantes fêtes,\nNe baiseront au vol les gestes que vous faites;\nJ'en revois un petit qui vous est familier\nPour toucher votre front, et je voudrais crier. . .","ROXANE (troublée):\nComme vous la lisez,--cette lettre !\n(La nuit vient insensiblement.)","CYRANO:\nEt je crie:\nAdieu !. . .","ROXANE:\nVous la lisez. . .","CYRANO:\nMa chère, ma chérie,\nMon trésor. . .","ROXANE (rêveuse):\nD'une voix. . .","CYRANO:\nMon amour !. . .","ROXANE:\nD'une voix. . .\n(Elle tressaille):\nMais. . .que je n'entends pas pour la première fois !\n(Elle s'approche tout doucement, sans qu'il s'en aperçoive, passe\nderrière le fauteuil, se penche sans bruit, regarde la\nlettre.--L'ombre augmente.)","CYRANO:\nMon cœur ne vous quitta jamais une seconde,\nEt je suis et serai jusque dans l'autre monde\nCelui qui vous aima sans mesure, celui. . .","ROXANE (lui posant la main sur l'épaule):\nComment pouvez-vous lire à présent ? Il fait nuit.\n(Il tressaille, se retourne, la voit là tout près, fait un geste\nd'effroi, baisse la tête. Un long silence. Puis, dans l'ombre\ncomplètement venue, elle dit avec lenteur, joignant les mains):\nEt pendant quatorze ans, il a joué ce rôle\nD'être le vieil ami qui vient pour être drôle !","CYRANO:\nRoxane !","ROXANE:\nC'était vous !","CYRANO:\nNon, non, Roxane, non !","ROXANE:\nJ'aurais dû deviner quand il disait mon nom !","CYRANO:\nNon, ce n'était pas moi !","ROXANE:\nC'était vous !","CYRANO:\nJe vous jure. . .","ROXANE:\nJ'aperçois toute la généreuse imposture:\nLes lettres, c'était vous. . .","CYRANO:\nNon !","ROXANE:\nLes mots chers et fous,\nC'était vous. . .","CYRANO:\nNon !","ROXANE:\nLa voix dans la nuit, c'était vous !","CYRANO:\nJe vous jure que non !","ROXANE:\nL'âme, c'était la vôtre !","CYRANO:\nJe ne vous aimais pas.","ROXANE:\nVous m'aimiez !","CYRANO (se débattant):\nC'était l'autre !","ROXANE:\nVous m'aimiez !","CYRANO (d'une voix qui faiblit):\nNon !","ROXANE:\nDéjà vous le dites plus bas !","CYRANO:\nNon, non, mon cher amour, je ne vous aimais pas !","ROXANE:\nAh ! que de choses qui sont mortes. . .qui sont nées !\n--Pourquoi vous être tu pendant quatorze années,\nPuisque sur cette lettre où, lui, n'était pour rien,\nCes pleurs étaient de vous ?","CYRANO (lui tendant la lettre):\nCe sang était le sien.","ROXANE:\nAlors pourquoi laisser ce sublime silence\nSe briser aujourd'hui ?","CYRANO:\nPourquoi ?. . .\n(Le Bret et Ragueneau entrent en courant.)","Scène 5.VI.","Les mêmes, Le Bret et Ragueneau.","LE BRET:\nQuelle imprudence !\nAh ! j'en étais bien sûr ! il est là !","CYRANO (souriant et se redressant):\nTiens, parbleu !","LE BRET:\nIl s'est tué, Madame, en se levant !","ROXANE:\nGrand Dieu !\nMais tout à l'heure alors. . .cette faiblesse ?. . .cette ?. . .","CYRANO:\nC'est vrai ! je n'avais pas terminé ma gazette:\n. . .Et samedi, vingt-six, une heure avant dîné,\nMonsieur de Bergerac est mort assassiné.\n(Il se découvre; on voit sa tête entourée de linges.)","ROXANE:\nQue dit-il ?--Cyrano !--Sa tête enveloppée !. . .\nAh, que vous a-t-on fait ? Pourquoi ?","CYRANO:\n\"D'un coup d'épée,\nFrappé par un héros, tomber la pointe au cœur !\". . .\n--Oui, je disais cela !. . .Le destin est railleur !. . .\nEt voilà que je suis tué dans une embûche,\nPar derrière, par un laquais, d'un coup de bûche !\nC'est très bien. J'aurai tout manqué, même ma mort.","RAGUENEAU:\nAh, Monsieur !. . .","CYRANO:\nRagueneau ne pleure pas si fort !. . .\n(Il lui tend la main):\nQu'est-ce que tu deviens, maintenant, mon confrère ?","RAGUENEAU (à travers ses larmes):\nJe suis moucheur de. . .de. . .chandelles, chez Molière.","CYRANO:\nMolière !","RAGUENEAU:\nMais je veux le quitter, dès demain:\nOui, je suis indigné !. . .Hier, on jouer Scapin,\nEt j'ai vu qu'il vous a pris une scène !","LE BRET:\nEntière !","RAGUENEAU:\nOui, Monsieur, le fameux: \"Que Diable allait-il faire ?. . .\"","LE BRET (furieux):\nMolière te l'a pris !","CYRANO:\nChut ! chut ! Il a bien fait !. . .\n(A Ragueneau):\nLa scène, n'est-ce pas, produit beaucoup d'effet ?","RAGUENEAU (sanglotant):\nAh ! Monsieur, on riait ! on riait !","CYRANO:\nOui, ma vie\nCe fut d'être celui qui souffle--et qu'on oublie !\n(A Roxane):\nVous souvient-il du soir où Christian vous parla\nSous le balcon ? Eh bien ! toute ma vie est là:\nPendant que je restais en bas, dans l'ombre noire,\nD'autres montaient cueillir le baiser de la gloire !\nC'est justice, et j'approuve au seuil de mon tombeau:\nMolière a du génie et Christian était beau !\n(A ce moment, la cloche de la chapelle ayant tinté, on voit passer au\nfond, dans l'allée, les religieuses se rendant à l'office):\nQu'elles aillent prier puisque leur cloche sonne !","ROXANE (se relevant pour appeler):\nMa sœur ! ma sœur !","CYRANO (la retenant):\nNon ! non ! n'allez chercher personne:\nQuand vous reviendriez, je ne serais plus là.\n(Les religieuses sont entrées dans la chapelle, on entend l'orgue):\nIl me manquait un peu d'harmonie. . .en voilà.","ROXANE:\nJe vous aime, vivez !","CYRANO:\nNon ! car c'est dans le conte\nQue lorsqu'on dit: Je t'aime ! au prince plein de honte,\nIl sent sa laideur fondre à ces mots de soleil. . .\nMais tu t'apercevrais que je reste pareil.","ROXANE:\nJ'ai fait votre malheur ! moi ! moi !","CYRANO:\nVous ?. . .au contraire !\nJ'ignorais la douceur féminine. Ma mère\nNe m'a pas trouvé beau. Je n'ai pas eu de sœur.\nPlus tard, j'ai redouté l'amante à l'œil moqueur.\nJe vous dois d'avoir eu, tout au moins, une amie.\nGrâce à vous une robe a passé dans ma vie.","LE BRET (lui montrant le clair de lune qui descend à travers les branches):\nTon autre amie est là, qui vient te voir !","CYRANO (souriant à la lune):\nJe vois.","ROXANE:\nJe n'aimais qu'un seul être et je le perds deux fois !","CYRANO:\nLe Bret, je vais monter dans la lune opaline,\nSans qu'il faille inventer, aujourd'hui, de machine. . .","LE BRET:\nQue dites-vous ?","CYRANO:\nMais oui, c'est là, je vous le dis,\nQue l'on va m'envoyer faire mon paradis\nPlus d'une âme que j'aime y doit être exilée,\nEt je retrouverai Socrate et Galilée !","LE BRET (se révoltant):\nNon, non ! C'est trop stupide à la fin, et c'est trop\nInjuste ! Un tel poète ! Un cœur si grand, si haut !\nMourir ainsi !. . .Mourir !. . .","CYRANO:\nVoilà Le Bret qui grogne !","LE BRET (fondant en larmes):\nMon cher ami. . .","CYRANO (se soulevant, l'œil égaré):\nCe sont les cadets de Gascogne. . .\n--La masse élémentaire. . .Eh oui !. . .voilà le hic. . .","LE BRET:\nSa science. . .dans son délire !","CYRANO:\nCopernic\nA dit. . .","ROXANE:\nOh !","CYRANO:\nMais aussi que diable allait-il faire,\nMais que diable allait-il faire en cette galère ?. . .\nPhilosophe, physicien,\nRimeur, bretteur, musicien,\nEt voyageur aérien,\nGrand riposteur du tac au tac,\nAmant aussi--pas pour son bien !--\nCi-gît Hercule-Savinien\nDe Cyrano de Bergerac,\nQui fut tout, et qui ne fut rien,\n. . .Mais je m'en vais, pardon, je ne peux faire attendre:\nVous voyez, le rayon de lune vient me prendre !\n(Il se retombé assis, les pleurs de Roxane le rappellent à la réalité,\nil la regarde, et caressant ses voiles):\nJe ne veux pas que vous pleuriez moins ce charmant,\nCe bon, ce beau Christian; mais je veux seulement\nQue lorsque le grand froid aura pris mes vertèbres,\nVous donniez un sens double à ces voiles funèbres,\nEt que son deuil sur vous devienne un peu mon deuil.","ROXANE:\nJe vous jure !. . .","CYRANO (est secoué d'un grand frisson et se lève brusquement):\nPas là ! non ! pas dans ce fauteuil !\n(On veut s'élancer vers lui):\n--Ne me soutenez pas !--Personne !\n(Il va s'adosser à l'arbre):\nRien que l'arbre !\n(Silence):\nElle vient. Je me sens déjà botté de marbre,\n--Ganté de plomb !\n(Il se raidit):\nOh ! mais !. . .puisqu'elle est en chemin,\nJe l'attendrai debout,\n(Il tire l'épée):\net l'épée à la main !","LE BRET:\nCyrano !","ROXANE (défaillante):\nCyrano !\n(Tous reculent épouvantés.)","CYRANO:\nJe crois qu'elle regarde. . .\nQu'elle ose regarder mon nez, cette Camarde\n(Il lève son épée):\nQue dites-vous ?. . .C'est inutile ?. . .Je le sais !\nMais on ne se bat pas dans l'espoir du succès !\nNon ! non ! c'est bien plus beau lorsque c'est inutile !\n--Qu'est-ce que c'est tous ceux-là ?--Vous êtes mille ?\nAh ! je vous reconnais, tous mes vieux ennemis !\nLe Mensonge ?\n(Il frappe de son épée le vide):\nTiens, tiens !--Ha ! ha ! les Compromis !\nLes Préjugés, les Lâchetés !. . .\n(Il frappe):\nQue je pactise ?\nJamais, jamais !--Ah ! te voilà, toi, la Sottise !\n--Je sais bien qu'à la fin vous me mettrez à bas;\nN'importe: je me bats ! je me bats ! je me bats !\n(Il fait des moulinets immenses et s'arrête haletant):\nOui, vous m'arrachez tout, le laurier et la rose !\nArrachez ! Il y a malgré vous quelque chose\nQue j'emporte, et ce soir, quand j'entrerai chez Dieu,\nMon salut balaiera largement le seuil bleu,\nQuelque chose que sans un pli, sans une tache,\nJ'emporte malgré vous,\n(Il s'élance l'épée haute):\net c'est. . .\n(L'épée s'échappe de ses mains, il chancelle, tombe dans les bras de\nLe Bret et de Ragueneau.)","ROXANE (se penchant sur lui et lui baisant le front):\nC'est ?. . .","CYRANO (rouvre les yeux, la reconnaît et dit en souriant):\nMon panache.","Rideau.","End of the Project Gutenberg EBook of Cyrano de Bergerac, by Edmond Rostand"]}]</script>
<script>'use strict';
const $=id=>document.getElementById(id);
const KEY='ophelia-cyrano-original-francais-read-only-v1';
const state={page:0,size:20,night:false,bookmark:-1};
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let pages=[],sections=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function countWords(text){return (text.match(/\S+/g)||[]).length;}
function paginate(parts){
 const result=[];
 for(let section=0;section<parts.length;section++){
  let group=[],words=0;
  const flush=()=>{if(group.length){result.push({section,paragraphs:group});group=[];words=0}};
  for(const par of parts[section].paragraphs){
   const size=countWords(par);
   if(words+size>300&&group.length)flush();
   if(size>350){
    
    const lines=par.split('\n');let chunk='',n=0;
    for(const line of lines){const w=countWords(line);if(n+w>290&&chunk){group.push(chunk);flush();chunk='';n=0}chunk+=(chunk?'\n':'')+line;n+=w}
    if(chunk){group.push(chunk);words+=n}
   }else{group.push(par);words+=size}
  }
  flush();
 }
 return result;
}
function render(scroll=true){
 if(!pages.length)return;
 state.page=Math.min(Math.max(0,Number(state.page)||0),pages.length-1);
 const page=pages[state.page],part=sections[page.section];
 const box=$('reading');box.replaceChildren();
 const heading=document.createElement('h2');heading.textContent=part.name;box.append(heading);
 for(const paragraph of page.paragraphs){const p=document.createElement('p');p.lang='fr';p.className='notranslate';p.setAttribute('translate','no');p.textContent=paragraph;box.append(p)}
 $('section').value=String(page.section);
 $('pages').textContent='Page '+(state.page+1)+' / '+pages.length;
 const percent=Math.round((state.page+1)/pages.length*100);
 $('progress').textContent=percent+' % lu';$('bar').style.width=percent+'%';
 $('prev').disabled=state.page===0;$('next').disabled=state.page===pages.length-1;
 $('bookmark').textContent=state.bookmark===state.page?'♥ Signet':'♡ Signet';
 document.documentElement.style.setProperty('--size',state.size+'px');
 document.body.classList.toggle('night',state.night);
 save();
 if(scroll)document.querySelector('article').scrollIntoView({behavior:'instant',block:'start'});
}
$('prev').onclick=()=>{if(state.page>0){state.page--;render()}};
$('next').onclick=()=>{if(state.page<pages.length-1){state.page++;render()}};
$('section').onchange=()=>{const p=pages.findIndex(page=>page.section===Number($('section').value));if(p>=0){state.page=p;render()}};
$('smaller').onclick=()=>{state.size=Math.max(15,state.size-1);render(false)};
$('larger').onclick=()=>{state.size=Math.min(30,state.size+1);render(false)};
$('dark').onclick=()=>{state.night=!state.night;render(false)};
$('bookmark').onclick=()=>{state.bookmark=state.page;save();render(false);$('message').textContent='Signet enregistré à la page '+(state.page+1)};
$('return').onclick=()=>{if(state.bookmark>=0){state.page=state.bookmark;render()}else $('message').textContent='Aucun signet enregistré.'};
document.addEventListener('keydown',e=>{if(e.target.closest('button,select,input'))return;if(e.key==='ArrowRight'&&state.page<pages.length-1){state.page++;render()}else if(e.key==='ArrowLeft'&&state.page>0){state.page--;render()}});

sections=JSON.parse($('texte').textContent);
pages=paginate(sections);
$('section').replaceChildren(...sections.map((part,i)=>new Option(part.name,i)));
render(false);
</script></body></html>
