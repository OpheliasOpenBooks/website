name: Import original French Notre-Dame de Paris
on:
  push:
    paths:
      - '.github/workflows/import-notre-dame-original-french.yml'
      - 'scripts/import_notre_dame_original_french.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive complete public-domain French novel
        run: python3 scripts/import_notre_dame_original_french.py
      - name: Save original French edition locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/notre-dame-de-paris-original-francais.txt
          git diff --staged --quiet || (git commit -m "Archive Hugo's French Notre-Dame de Paris original" && git push)
