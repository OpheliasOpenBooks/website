name: Publish The Squatter and the Don public-domain text
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_squatter_and_don.py'
      - '.github/workflows/publish-squatter-and-don.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate complete public-domain edition
        run: python scripts/build_squatter_and_don.py
      - name: Commit locally hosted complete text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/squatter-and-the-don.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish full 1885 Squatter and the Don source for local reader"
            git push
          fi
