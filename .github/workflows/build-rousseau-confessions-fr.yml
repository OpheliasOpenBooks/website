name: Build hosted French Rousseau Confessions
on:
  push:
    paths:
      - 'scripts/build-rousseau-confessions-fr.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-french-text:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Prepare all twelve historic French books
        run: python scripts/build-rousseau-confessions-fr.py
      - name: Publish hosted edition
        run: |
          git config user.name 'Ophelia Library Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/books/rousseau-confessions-fr-part-*.json public/books/rousseau-confessions-fr-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Host complete French original of Rousseau Confessions, books I-XII'
            git push
          fi
