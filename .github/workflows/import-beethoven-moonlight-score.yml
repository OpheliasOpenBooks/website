name: Import complete Moonlight Sonata sheet music
on:
  push:
    paths:
      - '.github/workflows/import-beethoven-moonlight-score.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate complete three-movement PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/scores
          curl --fail --location --retry 3 --retry-delay 2 --max-time 90 \
            --user-agent "Mozilla/5.0" \
            "https://www.mutopiaproject.org/ftp/BeethovenLv/O27/moonlight/moonlight-a4.pdf" \
            --output public/scores/beethoven-moonlight-sonata-complete.pdf
          test "$(head -c 4 public/scores/beethoven-moonlight-sonata-complete.pdf)" = '%PDF'
          test "$(stat -c%s public/scores/beethoven-moonlight-sonata-complete.pdf)" -gt 40000
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pages="$(pdfinfo public/scores/beethoven-moonlight-sonata-complete.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" -eq 23
      - name: Commit complete score to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scores/beethoven-moonlight-sonata-complete.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Host complete openly licensed Beethoven Moonlight Sonata score locally"
            git push
          fi
