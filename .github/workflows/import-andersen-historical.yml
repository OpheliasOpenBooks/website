name: Archive the authentic 1888 Andersen book cover
on:
  push:
    paths:
      - '.github/workflows/import-andersen-historical.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch original public-domain 1888 book-cover scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/art
          curl --fail --location --retry 4 --retry-delay 2 --max-time 110 \
            --user-agent 'OpheliasOpenBook/1.0 (public-domain literary archive; GitHub Pages)' \
            'https://upload.wikimedia.org/wikipedia/commons/a/a3/Hans_Andersen%27s_Fairy_Tales_%281888%29_-_cover.jpg' \
            -o public/art/hans-andersens-fairy-tales-1888-historical-cover.jpg
          test "$(head -c 3 public/art/hans-andersens-fairy-tales-1888-historical-cover.jpg | od -An -tx1 | tr -d ' \n')" = 'ffd8ff'
          test "$(stat -c%s public/art/hans-andersens-fairy-tales-1888-historical-cover.jpg)" -gt 50000
      - name: Optimize faithful historical scan for web display
        shell: bash
        run: |
          python -m pip install -q Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          path=Path('public/art/hans-andersens-fairy-tales-1888-historical-cover.jpg')
          scan=Image.open(path).convert('RGB')
          scan.thumbnail((750,1100),Image.Resampling.LANCZOS)
          scan.save(path,format='JPEG',quality=83,optimize=True,progressive=True)
          print('Historic cover kept intact; dimensions:',scan.size,'bytes:',path.stat().st_size)
          assert path.stat().st_size < 900000
          PY
      - name: Commit historically sourced cover
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/art/hans-andersens-fairy-tales-1888-historical-cover.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Host authentic 1888 Andersen fairy-tales cover"
            git push
          fi
