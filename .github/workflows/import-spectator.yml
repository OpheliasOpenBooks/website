name: Publish The Spectator complete essays
on:
  push:
    paths:
      - 'scripts/import_spectator.py'
      - '.github/workflows/import-spectator.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and verify all 635 essays
        run: python scripts/import_spectator.py
      - name: Validate reader scripts
        run: |
          python - <<'PY'
          import pathlib,re,json
          for n,first,last in [(1,1,202),(2,203,416),(3,417,635)]:
              p=pathlib.Path('the-spectator.html' if n==1 else f'the-spectator-volume-{n}.html')
              h=p.read_text()
              sections=json.loads(pathlib.Path(f'public/books/spectator/volume-{n}.json').read_text())
              assert [int(re.match(r'Essay (\d+)',s['name'])[1]) for s in sections if s['name'].startswith('Essay ')]==list(range(first,last+1))
              for i,js in enumerate(re.findall(r'<script>(.*?)</script>',h,re.S)):pathlib.Path(f'/tmp/spectator-{n}-{i}.js').write_text(js)
          PY
          for f in /tmp/spectator-*.js; do node --check "$f"; done
          python scripts/build_sitemap.py
      - name: Commit verified books and collection
        run: |
          git config user.name "Ophelia Library Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/spectator/ public/art/spectator-1891-titleplate.svg the-spectator*.html SOURCES-the-spectator.md catalog.html benjamin-franklins-childhood-library.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish all 635 Spectator essays in Franklin's Childhood Library"
            git push
          fi
