name: Verify original Strickland scans
on:
  push:
    paths:
      - 'scripts/probe-queens-sources.mjs'
      - '.github/workflows/probe-queens-sources.yml'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-queens-sources.mjs
