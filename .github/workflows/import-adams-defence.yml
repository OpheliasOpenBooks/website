name: Import and verify John Adams Defence (1787–88)
on:
  push:
    paths:
      - '.github/workflows/import-adams-defence.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Import, verify all 3 volumes, and prepare native reader
        run: python scripts/import_adams_defence.py
      - name: Verify only complete hosted books reach the catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          files=[root/'public'/'texts'/'adams-defence'/f'volume-{i}.txt' for i in (1,2,3)]
          assert all(p.exists() for p in files)
          assert all(len(p.read_text(encoding='utf-8').split())>n for p,n in zip(files,(35000,35000,42000)))
          assert (root/'a-defence-of-the-constitutions-john-adams.html').exists()
          assert 'a-defence-of-the-constitutions-john-adams.html' in (root/'catalog.html').read_text()
          print("All three complete volumes are locally present. Safe to publish.")
          PY
      - name: Publish only after import and verification
        run: |
          git config user.name "Ophelia Library Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/import_adams_defence.py public/texts/adams-defence/ public/art/adams-defence-1787-titlepage.svg a-defence-of-the-constitutions-john-adams.html catalog.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete 1787–88 Adams Defence: three volumes and self-hosted reader"
            git push
          fi
