name: Import 1930 Freud public-domain text (one time)
on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  import-text:
    if: github.event_name != 'issues' || github.event.issue.title == 'Import verified Freud 1930 edition'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout library
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import Joan Riviere 1930 English edition
        run: python3 scripts/import_freud_1930.py
      - name: Commit verified sections
        run: |
          git config user.name "Ophelia's Open Book"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/civilization-and-its-discontents
          if ! git diff --cached --quiet; then
            git commit -m "Import complete 1930 Civilization and Its Discontents text (Joan Riviere)"
            git push
          fi
