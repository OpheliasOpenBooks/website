name: Cache Mrs Beeton original 1861 title page
on:
  push:
    paths:
      - 'scripts/cache-beeton-cover.mjs'
      - '.github/workflows/beeton-cover.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/cache-beeton-cover.mjs
      - name: Commit original title-page illustration if downloaded
        run: |
          if [ -f public/art/mrs-beeton-1861-title-page.jpg ]; then
            git config user.name "Ophelia Library Import"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/art/mrs-beeton-1861-title-page.jpg
            if ! git diff --cached --quiet; then
              git commit -m "Host authentic 1861 Mrs Beeton illustrated title page locally"
              git push origin HEAD:main
            fi
          fi
