name: Import Adam Bede historical art
on:
  push:
    paths:
      - ".github/workflows/import-adam-bede-art.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save documented public-domain 1861 illustration
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request
          url='https://upload.wikimedia.org/wikipedia/commons/9/99/Dinah_Morris_preaching_on_the_common_by_Edward_Henry_Corbould.jpg'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'OpheliasOpenBooks/1.0 public-domain art archiving'}),timeout=45) as r:
              data=r.read()
          if not(data[:2]==b'\xff\xd8' and data[-2:]==b'\xff\xd9' and 200000<len(data)<3000000):
              raise SystemExit('Unexpected historical image data')
          path=pathlib.Path('public/art/adam-bede-dinah-morris-corbould-1861.jpg')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(data)
          print('Saved historical public-domain art:',len(data),'bytes')
          PY
      - name: Commit historical artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/adam-bede-dinah-morris-corbould-1861.jpg
          git diff --staged --quiet || (git commit -m "Archive historic 1861 Adam Bede illustration" && git push)
