name: Archive Orlando 1928 original illustrations and index
on:
  push:
    paths:
      - ".github/workflows/import-orlando-1928-media.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import public-domain original book plates and first-edition index
        run: python3 scripts/import_orlando_1928_media.py
      - name: Commit original 1928 media and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/orlando/images public/books/orlando/index.xhtml
          git diff --staged --quiet || (git commit -m "Restore original Orlando 1928 photographs and mock-biographical index" && git push)
