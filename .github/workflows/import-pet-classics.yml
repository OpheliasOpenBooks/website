name: Host complete historic dog and cat books
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-pet-classics.yml'
      - 'scripts/import-pet-classics.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ophelia-import-pet-classics
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'OpheliasOpenBooks/website'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public library
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare text importer
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve, verify, and locally host both unabridged public-domain texts
        run: node scripts/import-pet-classics.mjs
      - name: Publish verified animal-care classics
        run: |
          git config user.name "Ophelia Library Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/my-dog-and-i/ public/books/the-book-of-the-cat/ index.html
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Publish fully hosted dog and cat classics (1897 and 1903)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
