name: Host Gibbon's complete Roman Empire history
on:
  push:
    paths:
      - '.github/workflows/import-gibbon.yml'
      - 'scripts/import_gibbon.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve, verify and split all 71 chapters into hosted reader files
        run: python3 scripts/import_gibbon.py
      - name: Commit the six-volume public-domain text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/gibbon-*.json
          git diff --staged --quiet || (git commit -m "Host all six Gibbon volumes and 71 chapters" && git push)
