name: Publish complete John Adams Discourses on Davila
on:
  push:
    paths:
      - '.github/workflows/import-adams-davila.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parser
        run: python -m pip install beautifulsoup4
      - name: Import complete source and build familiar Ophelia reader
        run: python scripts/import_adams_davila.py
      - name: Refuse partial or externally-hosted reader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          text=(root/'public/texts/adams-davila/complete.txt').read_text(encoding='utf-8')
          html=(root/'discourses-on-davila-john-adams.html').read_text(encoding='utf-8')
          catalog=(root/'catalog.html').read_text(encoding='utf-8')
          assert len(text.split())>=30000
          assert 'XXXI.' in text and 'POSTSCRIPT.' in text and 'PREFACE.' in text and 'NOTES.' in text
          assert 'Liberty Fund, Inc.' not in text
          assert 'FOUR LETTERS:' not in text
          assert 'discourses-on-davila-john-adams.html' in catalog
          assert all('id="'+id+'"' in html for id in ['section','page','voice','speed','size','autoturn','settings-toggle','bookmark','play'])
          assert "public/texts/adams-davila/complete.txt" in html
          assert "ophelia-narration.js" in html
          print('All thirty-one discourses with Ophelia reading controls verified.',flush=True)
          PY
      - name: Commit verified complete reader and catalog
        run: |
          git config user.name "Ophelia Library Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/import_adams_davila.py public/texts/adams-davila/ public/art/adams-discourses-on-davila-1805-titlepage.svg discourses-on-davila-john-adams.html catalog.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete Discourses on Davila with standard Ophelia narration"
            git push
          fi
