name: Import Petrarch's English and Italian poetry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-petrarch.yml'
      - 'scripts/import-petrarch.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: petrarch-import-verified
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'OpheliasOpenBooks/website'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve and verify original full English and Italian editions
        run: node scripts/import-petrarch.mjs
      - name: Commit both locally hosted readings, authentic engraving, and catalog card
        run: |
          git config user.name "Ophelia Library Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/petrarch/ index.html
          if [ -f public/art/petrarch-1879-engraving.jpg ]; then git add public/art/petrarch-1879-engraving.jpg; fi
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Host Petrarch's historic English poems and original Italian Canzoniere"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
