name: Import Andersen Fairy Tales public-domain volume
on:
  push:
    paths:
      - '.github/workflows/import-andersen-fairy-tales.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-andersen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare story parser
        run: python -m pip install -q requests beautifulsoup4
      - name: Import and verify the complete Gutenberg 27200 collection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, Tag
          import json, re, requests
          base=Path('public/books/andersen-tales-27200')
          base.mkdir(parents=True,exist_ok=True)
          urls=[
           'https://www.gutenberg.org/files/27200/27200-h/27200-h.htm',
           'https://readingroo.ms/2/7/2/0/27200/27200-h/27200-h.htm',
           'https://www.gutenberg.org/cache/epub/27200/pg27200-images.html'
          ]
          raw=None
          for url in urls:
           try:
            r=requests.get(url,timeout=60,headers={'User-Agent':'OpheliasOpenBook/1.0 (public domain digital library)'})
            r.raise_for_status()
            if len(r.content)>400000 and b'A STORY' in r.content.upper() and b'SNOW QUEEN' in r.content.upper():
             raw=r.content
             print('Source downloaded:',url,'bytes:',len(raw)); break
           except Exception as e: print('Unavailable:',url,str(e)[:170])
          if raw is None: raise RuntimeError('Unable to retrieve complete public-domain source')
          soup=BeautifulSoup(raw,'html.parser')
          heads=soup.find_all('h3')
          start=next((i for i,h in enumerate(heads) if ' '.join(h.get_text(' ',strip=True).upper().split())=='A STORY'),None)
          if start is None: raise RuntimeError('First story heading not detected')
          def clean(text):return re.sub(r'\s+',' ',text).strip()
          def paginate(paragraphs, target=350):
           pages=[];page=[];count=0
           for p in paragraphs:
            if len(p.split())>target+100:
             bits=re.split(r'(?<=[.!?])\s+(?=[“"A-Z])',p)
             parts=[];frag=[];total=0
             for bit in bits:
              words=len(bit.split())
              if total and total+words>target:
               parts.append(' '.join(frag));frag=[];total=0
              frag.append(bit);total+=words
             if frag:parts.append(' '.join(frag))
            else:parts=[p]
            for part in parts:
             n=len(part.split())
             if count and count+n>target:
              pages.append(page);page=[];count=0
             page.append(part);count+=n
           if page:pages.append(page)
           return pages
          stories=[]
          for heading in heads[start:]:
           title=clean(heading.get_text(' ',strip=True))
           if not title or len(title)>130 or 'PROJECT GUTENBERG' in title.upper():break
           paragraphs=[]
           for el in heading.next_elements:
            if not isinstance(el,Tag):continue
            if el.name in ('h1','h2','h3'):break
            if el.name not in ('p','h4','h5'):continue
            t=clean(el.get_text('',strip=False))
            if 'End of the Project Gutenberg EBook' in t or 'END OF THIS PROJECT GUTENBERG' in t:break
            if t:paragraphs.append(t)
           total=sum(len(p.split()) for p in paragraphs)
           if total<100:
            print('Skipped short non-story heading:',title,total);continue
           pages=paginate(paragraphs)
           fn='tale-'+str(len(stories)+1).zfill(3)+'.json'
           (base/fn).write_text(json.dumps({'title':title.title(),'pages':pages},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
           stories.append({'title':title.title(),'file':fn,'pages':len(pages),'words':total})
          assert len(stories)>=100,('Not enough stories',len(stories))
          check=' '.join(s['title'].lower() for s in stories)
          for name in ['snow queen','little mermaid','ugly duckling','emperor','wild swans','tinder-box']:
           assert name in check,('Missing story',name)
          total=sum(x['words'] for x in stories)
          assert total>200000,('Suspiciously little text',total)
          index={'title':'Fairy Tales of Hans Christian Andersen','author':'Hans Christian Andersen','language':'en','source':'https://www.gutenberg.org/ebooks/27200','edition':'Project Gutenberg eBook 27200: complete public-domain English collection as published','storyCount':len(stories),'wordCount':total,'stories':stories}
          Path('public/books/andersen-fairy-tales-27200-index.json').write_text(json.dumps(index,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('VERIFIED',len(stories),'stories',total,'words; first',stories[0]['title'],'last',stories[-1]['title'])
          PY
      - name: Commit the verified stories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/andersen-tales-27200/ public/books/andersen-fairy-tales-27200-index.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive full Andersen Fairy Tales English collection as lazily loaded stories"
            git push
          fi
