name: Strickland twelve-volume integrity audit
on:
  push:
    paths:
      - 'lives-of-the-queens-of-england.html'
      - 'public/books/lives-of-the-queens-of-england/**'
      - 'tests/strickland-integrity.test.cjs'
      - '.github/workflows/strickland-integrity.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/strickland-integrity.test.cjs
