name: Import complete Radcliffe Italian volume III
on:
  push:
    paths:
      - '.github/workflows/import-the-italian-volume-3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-book:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download public-domain 1797 third volume and verify chapter structure
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, urllib.request, time
          urls=[
            'https://www.fadedpage.com/link.php?file=20250925.txt',
            'https://www.fadedpage.com/books/20250925/20250925.txt',
            'https://www.fadedpage.com/books/20250925.txt',
          ]
          raw=None
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (OpheliasOpenBooks public domain import)'})
              with urllib.request.urlopen(req,timeout=65) as r:
                b=r.read()
              t=b.decode('utf-8-sig',errors='replace').replace('\r\n','\n').replace('\r','\n')
              if len(t)>100000 and 'Schedoni' in t and 'Ellena' in t and 'CHAPTER XIII' in t.upper() and 'THE ITALIAN' in t.upper():
                raw=t; print('Verified text via',url,'characters',len(t))
                break
              print('Invalid text:',url,len(t))
            except Exception as e:
              print('Source temporarily unavailable:',url,type(e).__name__,str(e)[:200])
              time.sleep(2)
          if raw is None: raise SystemExit('No complete volume III text available; refusing to publish an incomplete book.')
          p=pathlib.Path('public/books/the-italian-volume-3-source.txt')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(raw,encoding='utf-8')
          print('Preserved complete source text',p)
          PY
      - name: Commit verified complete third volume
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/books/the-italian-volume-3-source.txt
          if ! git diff --staged --quiet; then
            git commit -m 'Archive Radcliffe The Italian public-domain 1797 third volume'
            git push
          fi
