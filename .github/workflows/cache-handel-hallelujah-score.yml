name: Archive Handel Hallelujah complete public-domain score
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-handel-hallelujah-score.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF validator
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Archive complete Hallelujah chorus SATB and orchestral score
        shell: bash
        run: |
          python3 - <<'PY'
          import io, pathlib, urllib.request, zipfile
          from pypdf import PdfReader
          dest=pathlib.Path('public/scores/handel-messiah-hallelujah-complete-score.pdf')
          dest.parent.mkdir(parents=True,exist_ok=True)
          def check(data):
              if not data.startswith(b'%PDF-'):
                  raise ValueError('Not a PDF')
              return len(PdfReader(io.BytesIO(data)).pages)
          if dest.exists():
              data=dest.read_bytes()
              if check(data)==21:
                  print('Already archived validated complete 21-page orchestral score')
                  raise SystemExit(0)
          url='https://www.mutopiaproject.org/ftp/HandelGF/hallelujah/hallelujah-let-pdfs.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'OpheliasOpenBook/1.0 PublicDomainSheetMusicArchive','Accept':'application/zip,application/octet-stream,*/*'})
          with urllib.request.urlopen(req,timeout=75) as response:
              data=response.read(15000000)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              pdfs=[]
              for filename in archive.namelist():
                  if filename.lower().endswith('.pdf') and not filename.endswith('/'):
                      content=archive.read(filename)
                      try: count=check(content)
                      except Exception as exc:
                          print('Skipping invalid PDF',filename,exc)
                          continue
                      print('Score candidate:',filename,'pages:',count)
                      pdfs.append((filename,count,content))
              valid=[x for x in pdfs if x[1]==21]
              if not valid:
                  raise SystemExit('Expected complete 21-page combined chorus/orchestra score not found in official Mutopia archive')
              valid.sort(key=lambda x:(('combined' in x[0].lower()) or ('score' in x[0].lower()),len(x[2])),reverse=True)
              filename,pages,content=valid[0]
              print('Archiving',filename,'pages',pages)
              dest.write_bytes(content)
          print('Validated and saved complete public-domain 21-page conductor score at',dest)
          PY
      - name: Commit and publish validated score
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scores/handel-messiah-hallelujah-complete-score.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Host complete public-domain Handel Hallelujah SATB and orchestra score"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
