name: Import complete Montesquieu Spirit of Laws
on:
  push:
    paths:
      - '.github/workflows/import-spirit-of-laws.yml'
      - 'scripts/import_spirit_of_laws.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve and verify public-domain complete English edition
        run: python3 scripts/import_spirit_of_laws.py
      - name: Publish text archive in website repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/spirit-of-laws-montesquieu-nugent-prichard-1914.txt
          git diff --staged --quiet || (git commit -m "Host complete Montesquieu Spirit of Laws English edition" && git push)
