name: Narration regression checks

on:
  push:
    paths:
      - 'public/js/ophelia-narration.js'
      - 'tests/*.cjs'
      - '*.html'
      - 'public/books/capital-volume-*.json'
      - '.github/workflows/narration-checks.yml'
  workflow_dispatch:

jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check grammatical speech normalization and pacing
        run: node tests/narration.test.cjs
      - name: Check all speaking reader pages for shared implementation
        run: node tests/library-reader-audit.cjs
      - name: Verify Emerson volumes, essays and reading pagination
        run: node tests/emerson-essays.test.cjs
      - name: Verify the full 1927 Giants in the Earth novel and reader
        run: node tests/giants-in-the-earth.test.cjs
      - name: Verify complete three-part Heart of Darkness and reader
        run: node tests/heart-of-darkness.test.cjs
      - name: Verify Arrowsmith's 40 complete chapters and pagination
        run: node tests/arrowsmith.test.cjs
      - name: Verify unabridged 1929 All Quiet on the Western Front translation
        run: node tests/all-quiet-on-the-western-front.test.cjs
      - name: Verify complete 67-chapter Vanity Fair, its parser and narration
        run: node tests/vanity-fair.test.cjs
      - name: Verify all 365 War and Peace chapters and two epilogues
        run: node tests/war-and-peace.test.cjs

      - name: Verify all three complete volumes of Capital
        run: node tests/capital-volumes.test.cjs

      - name: Verify complete Veblen edition and preface
        run: node tests/theory-of-the-leisure-class.test.cjs

      - name: Verify Kenilworth complete locally hosted novel and reader
        run: node tests/kenilworth.test.cjs

      - name: Verify complete 28-chapter The Talisman novel and reader
        run: node tests/the-talisman.test.cjs

      - name: Verify complete 35-chapter The Spy novel and reader
        run: node tests/the-spy.test.cjs

      - name: Verify full Fathers and Sons English translation
        run: node tests/fathers-and-sons.test.cjs

      - name: Verify all three complete Katherine Mansfield story collections
        run: node tests/katherine-mansfield-short-stories.test.cjs
