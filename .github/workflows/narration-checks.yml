name: Narration regression checks

on:
  push:
    paths:
      - 'public/js/ophelia-narration.js'
      - 'tests/*.cjs'
      - '*.html'
      - '.github/workflows/narration-checks.yml'
  workflow_dispatch:

jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check grammatical speech normalization and pacing
        run: node tests/narration.test.cjs
      - name: Check all speaking reader pages for shared implementation
        run: node tests/library-reader-audit.cjs
      - name: Verify Emerson volumes, essays and reading pagination
        run: node tests/emerson-essays.test.cjs
      - name: Verify the full 1927 Giants in the Earth novel and reader
        run: node tests/giants-in-the-earth.test.cjs
      - name: Verify complete three-part Heart of Darkness and reader
        run: node tests/heart-of-darkness.test.cjs
