name: Narration regression checks

on:
  push:
    paths:
      - 'public/js/ophelia-narration.js'
      - 'tests/narration.test.cjs'
      - '.github/workflows/narration-checks.yml'
  workflow_dispatch:

jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check grammatical speech normalization and pacing
        run: node tests/narration.test.cjs
