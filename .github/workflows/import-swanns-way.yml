name: Import Swann's Way public-domain text
on:
  push:
    paths:
      - '.github/workflows/import-swanns-way.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and verify full public-domain text
        run: python3 scripts/import_swanns_way.py
      - name: Commit complete book to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books/swanns-way.json
          git diff --staged --quiet || (git commit -m "Import full 1922 Swann's Way into local library" && git push)
