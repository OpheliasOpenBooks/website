name: Import Jefferson parliamentary manual and verify all 53 sections
# Revision: extract verified 1812 author-revised public-domain edition
on:
  push:
    paths:
      - '.github/workflows/import-jefferson-parliamentary.yml'
      - 'scripts/import_jefferson_parliamentary.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical HTML parser
        run: python -m pip install beautifulsoup4
      - name: Import all 53 original sections, preserving public-domain wording
        run: |
          set -o pipefail
          python scripts/import_jefferson_parliamentary.py 2>&1 | tee /tmp/jefferson-manual-import.log
      - name: Record source diagnostics if source or validation fails
        if: failure()
        run: |
          mkdir -p scripts/diagnostics
          cp /tmp/jefferson-manual-import.log scripts/diagnostics/jefferson-manual-import-error.log || echo "No importer log was produced." > scripts/diagnostics/jefferson-manual-import-error.log
          git config user.name "Ophelia Library Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/diagnostics/jefferson-manual-import-error.log
          git commit -m "Record Jefferson parliamentary manual verification issue" || true
          git push || true
      - name: Validate complete self-hosted edition and standard controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          text=(root/'public/texts/jefferson-parliamentary-manual/complete.txt').read_text(encoding='utf-8')
          html=(root/'a-manual-of-parliamentary-practice-jefferson.html').read_text(encoding='utf-8')
          catalog=(root/'catalog.html').read_text(encoding='utf-8')
          sections=re.findall(r'(?m)^SECTION\s+([IVXLCDM]+)\.$', text)
          assert len(sections)==53 and sections[0]=='I' and sections[-1]=='LIII'
          assert len(text.split())>=17000
          assert text.count('PREFACE.')>=1 and 'IMPEACHMENT.' in text
          assert 'id="settings-toggle"' in html and 'id="voice"' in html
          assert 'ophelia-narration.js' in html
          assert 'a-manual-of-parliamentary-practice-jefferson.html' in catalog
          print(f'Validated 53 consecutive sections ({len(text.split()):,} words), hosted reader and catalog.')
          PY
      - name: Publish verified edition
        run: |
          git config user.name "Ophelia Library Importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/import_jefferson_parliamentary.py public/texts/jefferson-parliamentary-manual/ a-manual-of-parliamentary-practice-jefferson.html public/art/jefferson-manual-1801-titlepage.svg catalog.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete 53-section Jefferson parliamentary manual with Ophelia narration"
            git push
          fi
