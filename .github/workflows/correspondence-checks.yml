name: Victorian correspondence safety checks
on:
  push:
    paths:
      - 'correspondence-worker/**'
      - 'public/js/ophelia-correspondence.js'
      - 'public/css/correspondence.css'
      - 'public/correspondence-config.js'
      - 'correspondence.html'
      - 'editor-desk.html'
      - 'editors-inbox.html'
      - 'tests/correspondence.test.cjs'
      - '.github/workflows/correspondence-checks.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/correspondence.test.cjs
