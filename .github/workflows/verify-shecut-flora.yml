name: Verify Shecut Flora Carolinaeensis original scan and text
on:
  push:
    paths:
      - '.github/workflows/verify-shecut-flora.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-1806-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check 1806 original public-domain scan and OCR options
        run: |
          python - <<'PY'
          import urllib.request, json
          urls=[
           'https://archive.org/metadata/2571053R.nlm.nih.gov',
           'https://archive.org/download/2571053R.nlm.nih.gov/2571053R.nlm.nih.gov_djvu.txt',
           'https://archive.org/download/2571053R.nlm.nih.gov/2571053R.nlm.nih.gov_full_text.txt',
           'https://www.biodiversitylibrary.org/itemtext/2571053R',
          ]
          for url in urls:
           try:
            r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'OpheliasOpenBook/1.0 public domain research'}),timeout=28)
            b=r.read(2000000)
            text=b.decode('utf8','replace')
            print('PROBE',url,'STATUS',r.status,'LENGTH',len(b),'FIRST',repr(text[:600]),flush=True)
            if 'metadata/' in url and text.lstrip().startswith('{'):
             j=json.loads(text)
             print('ARCHIVE',j.get('is_dark'),j.get('metadata',{}).get('title'),json.dumps([(f.get('name'),f.get('size')) for f in j.get('files',[]) if 'txt' in f.get('name','').lower() or 'pdf' in f.get('name','').lower()][:25]),flush=True)
           except Exception as e:print('FAILED',url,repr(e),flush=True)
          PY
      - name: Download original 1806 scan and assess embedded text (non-OCR)
        run: |
          python - <<'PY'
          import urllib.request
          u='https://upload.wikimedia.org/wikipedia/commons/d/dd/Flora_Carolinaeensis_-_or%2C_A_historical%2C_medical%2C_and_economical_display_of_the_vegetable_kingdom_-_according_to_the_Linnaean_%28IA_2571053R.nlm.nih.gov%29.pdf'
          try:
            r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'OpheliasOpenBook/1.0 (public domain historical botany library)'}),timeout=120)
            with open('/tmp/shecut.pdf','wb') as out:
              while 1:
                chunk=r.read(1048576)
                if not chunk: break
                out.write(chunk)
            import os
            print('PDF FETCH STATUS',r.status,'BYTES',os.stat('/tmp/shecut.pdf').st_size,flush=True)
          except Exception as e:print('PDF FETCH FAILED',repr(e),flush=True)
          PY
          if [ -f /tmp/shecut.pdf ]; then
            pdfinfo /tmp/shecut.pdf | grep -E "Pages:|File size:|Title:|Producer:|Creator:|PDF version:"
            pdftotext -layout /tmp/shecut.pdf /tmp/shecut.txt
            python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/shecut.txt').read_text(errors='replace')
          print('PDF EXTRACT STATS',len(s),len(s.split()),'FORMFEEDS',s.count('\f'),'FIRST',repr(s[:3500]),flush=True)
          print('PDF EXTRACT MIDDLE',repr(s[len(s)//2:len(s)//2+1200]),flush=True)
          print('PDF EXTRACT END',repr(s[-3500:]),flush=True)
          print('EXTRACT KEYWORDS',[(x,len(re.findall(x,s,re.I))) for x in ['ACACIA','CHAPTER','ANDROMEDA','EUPATORIUM','FUS','DEDICATION','SUBSCRIBERS','INDEX']],flush=True)
          PY
          fi
