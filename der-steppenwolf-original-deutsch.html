 nicht mehr\num den Krieg und die Zeitungen kümmern. Und du?“","O nein, auch ich war bereit.","Wir gingen zusammen – es war unser erster gemeinsamer Gang in der Stadt\n– in ein Musikaliengeschäft und sahen Grammophone an, klappten sie auf\nund zu, ließen sie uns vorspielen, und als wir eines davon sehr passend\nund nett und wohlfeil gefunden hatten, wollte ich es kaufen, aber so\nschnell war Hermine nicht fertig. Sie hielt mich zurück, und ich mußte\nerst noch einen zweiten Laden mit ihr aufsuchen und auch dort alle\nSysteme und Größen vom teuersten bis zum billigsten ansehen und anhören,\nund erst jetzt war sie damit einverstanden, in den ersten Laden\nzurückzugehen und den dort gefundenen Apparat zu kaufen.","„Siehst du,“ sagte ich, „das hätten wir einfacher haben können.“","„Meinst du? Und dann hätten wir vielleicht morgen den gleichen Apparat\nin einem andern Schaufenster um zwanzig Franken billiger ausgestellt\ngesehen. Und außerdem macht Einkaufen Spaß, und was Spaß macht, muß man\nauskosten. Du mußt noch viel lernen.“","Mit einem Dienstmann brachten wir unsern Einkauf in meine Wohnung.","Hermine betrachtete mein Wohnzimmer genau, lobte den Ofen und den Diwan,\nprobierte die Stühle, nahm Bücher in die Hand, blieb lang vor der\nPhotographie meiner Geliebten stehen. Das Grammophon hatten wir zwischen\nBücherhaufen auf eine Kommode gestellt. Und nun begann mein Unterricht.\nSie ließ einen Foxtrott spielen, machte mir die ersten Schritte vor,\nnahm meine Hand und begann, mich zu führen. Ich trabte gehorsam mit,\nstieß an Stühle, hörte auf ihre Befehle, verstand sie nicht, trat sie\nauf die Füße und war ebenso ungeschickt wie pflichteifrig. Nach dem\nzweiten Tanz warf sie sich in den Diwan und lachte wie ein Kind.","„Mein Gott, wie steif du bist! Geh doch einfach vor dich hin, wie wenn\ndu spazierengehst! Anstrengungen sind gar nicht nötig. Ich glaube, dir\nist sogar schon heiß geworden? Na, ruhen wir fünf Minuten aus! Schau’,\ndas Tanzen ist, wenn man es kann, gerade so einfach wie das Denken, und\nzu lernen ist es viel leichter. Du wirst jetzt weniger ungeduldig\ndarüber werden, daß die Menschen sich das Denken nicht angewöhnen\nwollen, sondern lieber den Herrn Haller einen Landesverräter heißen und\nruhig den nächsten Krieg kommen lassen.“","Nach einer Stunde ging sie fort, mit der Versicherung, das nächste Mal\nwerde es schon besser gehen. Ich dachte darüber anders und war sehr\nenttäuscht über meine Dummheit und Schwerfälligkeit, ich hatte, wie mir\nschien, in dieser Stunde überhaupt nichts gelernt und glaubte nicht\ndaran, daß es ein andermal besser gehen werde. Nein, zum Tanzen mußte\nman Fähigkeiten mitbringen, die mir vollkommen fehlten: Fröhlichkeit,\nUnschuld, Leichtsinn, Schwung. Nun, ich hatte es mir ja längst gedacht.","Aber siehe, beim nächsten Mal ging es in der Tat besser und begann mir\nsogar Spaß zu machen, und am Schluß der Stunde behauptete Hermine, den\nFoxtrott könne ich jetzt. Aber als sie daraus folgerte, nun müsse ich\nmorgen mit ihr in einem Restaurant tanzen gehen, erschrak ich heftig und\nwehrte mich mit Leidenschaft. Kühl erinnerte sie mich an mein Gelübde\ndes Gehorsams und bestellte mich für morgen zum Tee ins Hotel Balances.","An jenem Abend saß ich zu Hause, wollte lesen und konnte nicht. Ich\nhatte Angst vor morgen; der Gedanke war mir entsetzlich, daß ich alter,\nscheuer und empfindlicher Sonderling nicht nur eines dieser öden\nmodernen Tee- und Tanzlokale mit Jazzmusik besuchen, sondern mich dort\nunter den fremden Menschen als Tänzer zeigen sollte, ohne noch irgend\netwas zu können. Und ich gestehe, daß ich über mich selber lachte und\nmich vor mir selber geschämt habe, als ich allein in meinem stillen\nStudierzimmer den Apparat aufzog und laufen ließ und leise, auf Socken,\ndie Schritte meines Fox repetierte.","Im Hotel Balances andern Tages spielte eine kleine Kapelle, es wurde Tee\nund Whisky serviert. Ich versuchte Hermine zu bestechen, setzte ihr\nKuchen vor, versuchte, sie zu einer Flasche guten Wein einzuladen, aber\nsie blieb unerbittlich.","„Du bist heute nicht zum Vergnügen hier. Es ist Tanzstunde.“","Ich mußte zwei-, dreimal mit ihr tanzen, und zwischenein machte sie mich\nmit dem Saxophonbläser bekannt, einem dunklen, schönen, jungen Menschen\nvon spanischer oder südamerikanischer Herkunft, der, wie sie sagte, alle\nInstrumente spielen und alle Sprachen der Welt sprechen konnte. Dieser\nSeñor schien mit Hermine sehr gut bekannt und befreundet zu sein, er\nhatte zwei Saxophone von verschiedener Größe vor sich stehen, die er\nabwechselnd blies, während seine schwarzen gleißenden Augen aufmerksam\nund vergnügt die Tanzenden studierten. Zu meiner eigenen Verwunderung\nempfand ich gegen diesen harmlosen, hübschen Musikanten etwas wie\nEifersucht, nicht Liebeseifersucht, denn von Liebe war ja zwischen mir\nund Hermine gar nicht die Rede, aber eine mehr geistige\nFreundschaftseifersucht, denn er schien mir des Interesses und der\nauffallenden Auszeichnung, ja Verehrung, die sie für ihn zeigte, nicht\nso recht würdig zu sein. Komische Bekanntschaften muß ich da machen,\ndachte ich mißmutig.","Dann wurde Hermine einmal ums andre zum Tanz gebeten, ich blieb allein\nbeim Tee sitzen, hörte der Musik zu, einer Art von Musik, die ich bisher\nnicht hatte ausstehen können. Lieber Gott, dachte ich, nun soll ich also\nhier eingeführt und heimisch werden, in dieser mir so fremden und\nwiderwärtigen, in dieser bisher von mir so sorgfältig gemiedenen, so\ntief verachteten Welt der Bummler und Vergnügungsmenschen, in dieser\nglatten, klischierten Welt der Marmortischchen, der Jazzmusik, der\nKokotten, der Handlungsreisenden! Betrübt sog ich meinen Tee und starrte\nin die halbelegante Menge. Zwei schöne Mädchen zogen meine Blicke an,\nbeide gute Tänzerinnen, denen ich mit Bewunderung und Neid nachblickte,\nwie sie elastisch, schön, fröhlich und sicher dahintanzten.","Da erschien Hermine wieder und war mit mir unzufrieden. Ich sei nicht\nhier, schalt sie, um ein solches Gesicht zu machen und regungslos am\nTeetisch zu sitzen, ich möge mir jetzt bitte einen Ruck geben und\ntanzen. Wie, ich kenne niemanden? Das sei ganz unnötig. Ob denn gar\nkeine Mädchen da seien, die mir gefielen?","Ich zeigte ihr die eine, schönere, die eben in unsrer Nähe stand und in\nihrem hübschen Sammetröckchen, mit den kurzgeschnittenen kräftigen\nBlondhaaren und den vollen, fraulichen Armen entzückend aussah. Hermine\nbestand darauf, daß ich sofort hingehe und sie auffordere. Ich wehrte\nmich verzweifelt.","„Ich kann doch nicht!“ sagte ich unglücklich. „Ja, wenn ich ein hübscher\njunger Kerl wäre! Aber so ein alter steifer Trottel, der nicht einmal\ntanzen kann – sie würde mich ja auslachen!“","Verächtlich sah Hermine mich an.","„Und ob _ich_ dich auslache, ist dir natürlich einerlei. Was du für ein\nFeigling bist! Das Ausgelachtwerden riskiert ein jeder, der sich einem\nMädchen nähert; das ist der Einsatz. Also riskiere, Harry, und im\nschlimmsten Fall laß dich eben auslachen – sonst ist es mit meinem\nGlauben an deinen Gehorsam vorbei.“","Sie gab nicht nach. Beklommen stand ich auf und ging auf das schöne\nMädchen zu, als eben die Musik wieder anfing.","„Ich bin eigentlich nicht frei,“ sagte sie und blickte mich neugierig\naus den großen frischen Augen an, „aber mein Tänzer scheint in der Bar\ndrüben hängenzubleiben. Na, kommen Sie!“","Ich umfaßte sie und tat die ersten Schritte, noch verwundert darüber,\ndaß sie mich nicht weggeschickt hatte, da merkte sie schon, wie es mit\nmir stehe, und übernahm die Führung. Sie tanzte wunderbar, und mich nahm\nes mit, ich vergaß für Augenblicke alle meine Tanzpflichten und Regeln,\nschwamm einfach mit, fühlte die straffen Hüften, die raschen\ngeschmeidigen Knie meiner Tänzerin, sah ihr in das junge, strahlende\nGesicht, gestand ihr, daß ich heute zum erstenmal in meinem Leben tanze.\nSie lächelte und ermunterte mich und antwortete auf meine entzückten\nBlicke und schmeichelnden Worte wunderbar geschmeidig, nicht mit Worten,\naber mit leisen entzückenden Bewegungen, die uns näher und reizender\nzusammenbrachten. Fest hielt ich die rechte Hand über ihrer Taille,\nfolgte beglückt und eifrig den Bewegungen ihrer Beine, ihrer Arme, ihrer\nSchultern, trat ihr zu meinem Erstaunen kein einziges Mal auf die Füße,\nund als die Musik zu Ende war, blieben wir beide stehen und klatschten,\nbis der Tanz nochmals gespielt wurde und ich nochmals eifrig, verliebt\nund andächtig den Ritus vollzog.","Als der Tanz zu Ende war, allzu früh, zog das schöne Sammetmädchen sich\nzurück, und plötzlich stand Hermine neben mir, die uns zugesehen hatte.","„Merkst du was?“ lachte sie lobend. „Hast du entdeckt, daß Frauenbeine\nkeine Tischbeine sind? Na, bravo! Den Fox kannst du jetzt, Gott sei\nDank, morgen gehen wir auf den Boston los, und in drei Wochen ist\nMaskenball in den Globussälen.“","Es war Tanzpause, wir hatten uns gesetzt, und nun kam auch der hübsche\njunge Herr Pablo, der Saxophonbläser, nickte uns zu und setzte sich\nneben Hermine. Er schien mit ihr sehr gut Freund zu sein. Mir aber,\ngestehe ich, wollte bei jenem ersten Zusammensein dieser Herr durchaus\nnicht gefallen. Schön war er, das war nicht zu leugnen, schön von Wuchs\nund schön von Gesicht, weitere Vorzüge aber konnte ich an ihm nicht\nentdecken. Auch das mit der Vielsprachigkeit machte er sich leicht, er\nsprach nämlich überhaupt nichts, nur Worte wie bitte, danke, jawohl,\ngewiß, hallo und ähnliche, die er allerdings in mehreren Sprachen\nkonnte. Nein, er sprach nichts, der Señor Pablo, und er schien auch\nnicht eben viel zu denken, dieser hübsche Caballero. Seine Beschäftigung\nwar das Saxophonblasen in der Jazzkapelle, und diesem Berufe schien er\nmit Liebe und Leidenschaft obzuliegen, manchmal klatschte er während des\nMusizierens auch plötzlich in die Hände oder erlaubte sich andere\nBegeisterungsausbrüche, stieß etwa laute gesungene Worte aus wie: „o o o\no, ha ha, hallo!“ Sonst aber war er sichtlich zu nichts andrem in der\nWelt, als um schön zu sein, den Frauen zu gefallen, die Kragen und\nSchlipse neuester Mode zu tragen, auch viele Ringe an den Fingern. Seine\nUnterhaltung bestand darin, daß er bei uns saß, uns anlächelte, auf\nseine Armbanduhr sah und Zigaretten drehte, worin er sehr geschickt war.\nSeine dunklen schönen Kreolenaugen, seine schwarzen Locken verbargen\nkeine Romantik, keine Probleme, keine Gedanken – aus der Nähe besehen,\nwar der schöne exotische Halbgott ein vergnügter und etwas verwöhnter\nJunge mit angenehmen Manieren, nichts weiter. Ich sprach mit ihm über\nsein Instrument und über Klangfarben in der Jazzmusik, er mußte sehen,\ndaß er es mit einem alten Genießer und Kenner in musikalischen Dingen zu\ntun habe. Aber darauf ging er gar nicht ein, und während ich, aus\nHöflichkeit gegen ihn oder eigentlich gegen Hermine, etwas wie eine\nmusiktheoretische Rechtfertigung des Jazz unternahm, lächelte er harmlos\nan mir und meinen Anstrengungen vorüber, und vermutlich war es ihm\nvöllig unbekannt, daß es vor und außer Jazz auch noch einige andere\nMusik gegeben habe. Nett war er, nett und artig, hübsch lächelte er aus\nseinen großen leeren Augen; aber zwischen ihm und mir schien es nichts\nGemeinsames zu geben – nichts von dem, was ihm etwa wichtig und heilig\nwar, könnte es auch für mich sein, wir kamen aus entgegengesetzten\nErdteilen, hatten kein Wort unsrer Sprachen gemeinsam. (Aber später\nerzählte mir Hermine Merkwürdiges. Sie erzählte, daß Pablo nach jenem\nGespräch ihr über mich gesagt habe, sie möchte doch mit diesem Menschen\nrecht sorgsam umgehen, er sei ja so sehr unglücklich. Und als sie\nfragte, woraus er das schließe, habe er gesagt: „Armer, armer Mensch.\nSieh seine Augen an! Kann nicht lachen.“)","Als nun der Schwarzäugige sich empfohlen hatte und die Musik wieder\nanfing, stand Hermine auf. „Jetzt könntest du wieder einmal mit mir\ntanzen, Harry. Oder magst du nicht mehr?“","Auch mit ihr tanzte ich nun leichter, freier und fröhlicher, wenn auch\nnicht so unbeschwert und selbstvergessen wie mit jener andern. Hermine\nließ mich führen und paßte sich zart und leicht wie ein Blumenblatt an,\nund auch bei ihr fand und fühlte ich jetzt alle jene bald\nentgegenkommenden, bald wegfliehenden Schönheiten, auch sie duftete nach\nWeib und Liebe, auch ihr Tanz sang zart und innig das holde lockende\nLied des Geschlechts – und doch konnte ich auf dies alles nicht ganz\nfrei und heiter antworten, konnte mich nicht völlig vergessen und\nhingeben. Hermine stand mir allzu nah, sie war mein Kamerad, meine\nSchwester, war meinesgleichen, sie glich mir selbst und glich meinem\nJugendfreund Hermann, dem Schwärmer, dem Dichter, dem glühenden Genossen\nmeiner geistigen Übungen und Ausschweifungen.","„Ich weiß es,“ sagte sie nachher, als ich davon sprach, „ich weiß es\nwohl. Ich werde dich zwar doch noch in mich verliebt machen, aber das\nhat keine Eile. Vorerst sind wir Kameraden, wir sind Leute, welche\nFreunde zu werden hoffen, weil wir einander erkannt haben. Jetzt wollen\nwir beide voneinander lernen und miteinander spielen. Ich zeige dir mein\nkleines Theater, ich lehre dich tanzen und ein bißchen vergnügt und dumm\nsein, und du zeigst mir deine Gedanken und etwas von deinem Wissen.“","„Ach, Hermine, da ist nicht viel zu zeigen, du weißt ja viel mehr als\nich. Was bist du für ein merkwürdiger Mensch, du Mädchen! Überall\nverstehst du mich und bist mir voraus. Bin ich dir denn etwas? Bin ich\ndir denn nicht langweilig?“","Sie sah mit verdunkeltem Blick zu Boden.","„So höre ich dich nicht gerne reden. Denke an den Abend, wo du kaputt\nund verzweifelt aus deiner Qual und Einsamkeit heraus mir über den Weg\ngelaufen und mein Kamerad geworden bist! Warum denn, glaubst du, habe\nich dich damals erkennen und verstehen können?“","„Warum, Hermine? Sag’ es mir!“","„Weil ich bin wie du. Weil ich gerade so allein bin wie du und das Leben\nund die Menschen und mich selber gerade so wenig lieben und ernst nehmen\nkann wie du. Es gibt ja immer einige solche Menschen, die vom Leben das\nHöchste verlangen und sich mit seiner Dummheit und Roheit schlecht\nabfinden können.“","„Du, du!“ rief ich tief verwundert. „Ich verstehe dich, Kamerad, niemand\nversteht dich so wie ich. Und doch bist du mir ein Rätsel. Du wirst ja\nmit dem Leben so spielend fertig, du hast ja diese wunderbare\nHochachtung vor den kleinen Dingen und Genüssen, du bist eine solche\nKünstlerin im Leben. Wie kannst du am Leben leiden? Wie kannst du\nverzweifeln?“","„Ich verzweifle nicht, Harry. Aber am Leben leiden – o ja, darin bin ich\nerfahren. Du wunderst dich, daß ich nicht glücklich bin, weil ich doch\ntanzen kann und mich an der Oberfläche des Lebens so gut auskenne. Und\nich, Freund, wundere mich, daß du vom Leben so enttäuscht bist, da du\ndoch gerade in den schönsten und tiefsten Dingen heimisch bist, im\nGeist, in der Kunst, im Denken! Darum haben wir einander angezogen,\ndarum sind wir Geschwister. Ich werde dich lehren, zu tanzen und zu\nspielen und zu lächeln und doch nicht zufrieden zu sein. Und werde von\ndir lernen, zu denken und zu wissen und doch nicht zufrieden zu sein.\nWeißt du, daß wir beide Kinder des Teufels sind?“","„Ja, das sind wir. Der Teufel ist der Geist, und seine unglücklichen\nKinder sind wir. Wir sind aus der Natur herausgefallen und hängen im\nLeeren. Aber nun fällt mir etwas ein: in dem Steppenwolftraktat, von dem\nich dir erzählt habe, steht etwas darüber, daß es nur eine Einbildung\nvon Harry sei, wenn er glaubt, eine oder zwei Seelen zu haben, aus einer\noder zwei Persönlichkeiten zu bestehen. Jeder Mensch bestehe aus zehn,\naus hundert, aus tausend Seelen.“","„Das gefällt mir sehr“, rief Hermine. „Bei dir zum Beispiel ist das\nGeistige sehr hoch ausgebildet, und dafür bist du in allerlei kleinen\nLebenskünsten sehr zurückgeblieben. Der Denker Harry ist hundert Jahre\nalt, aber der Tänzer Harry ist kaum erst einen halben Tag alt. Den\nwollen wir jetzt weiterbringen und alle seine kleinen Brüderlein, die\nebenso klein und dumm und unerwachsen sind wie er.“","Lächelnd sah sie mich an. Und fragte leise, mit veränderter Stimme:","„Und wie hat denn Maria dir gefallen?“","„Maria? Wer ist das?“","„Das ist die, mit der du getanzt hast. Ein schönes Mädchen, ein sehr\nschönes Mädchen. Du warst ein wenig in sie verliebt, soviel ich sehen\nkonnte.“","„Kennst du sie denn?“","„O ja, wir kennen uns recht gut. Ist dir viel an ihr gelegen?“","„Sie gefiel mir, und ich war froh, daß sie mit meinem Tanzen so\nnachsichtig war.“","„Na, wenn das alles ist! Du solltest ihr ein wenig den Hof machen,\nHarry. Sie ist sehr hübsch und tanzt so gut, und verliebt bist du ja\nauch schon in sie. Ich glaube, du wirst Erfolg haben.“","„Ach, das ist nicht mein Ehrgeiz.“","„Jetzt lügst du ein wenig. Ich weiß ja, du hast irgendwo in der Welt\neine Geliebte sitzen und siehst sie alle halbe Jahre einmal, um dich\ndann mit ihr zu streiten. Es ist ja sehr hübsch von dir, wenn du dieser\nmerkwürdigen Freundin treu bleiben willst, aber erlaube mir, das nicht\nso ganz ernst zu nehmen! Ich habe dich überhaupt im Verdacht, daß du die\nLiebe furchtbar ernst nimmst. Das magst du tun, du magst auf deine\nideale Art lieben, soviel du willst, es ist deine Sache, ich habe dafür\nnicht zu sorgen. Wofür ich aber zu sorgen habe, das ist, daß du die\nkleinen, leichten Künste und Spiele im Leben etwas besser erlernst, auf\ndiesem Gebiet bin ich deine Lehrerin und werde dir eine bessere Lehrerin\nsein, als deine ideale Geliebte es war, darauf verlasse dich! Du hast es\nrecht nötig, wieder einmal bei einem hübschen Mädchen zu schlafen,\nSteppenwolf.“","„Hermine,“ rief ich gepeinigt, „sieh mich doch an, ich bin ein alter\nMann!“","„Ein kleiner Junge bist du. Und ebenso, wie du zu bequem warst, um\ntanzen zu lernen, bis es beinah zu spät war, so warst du auch zu bequem,\num lieben zu lernen. Ideal und tragisch lieben, o Freund, das kannst du\ngewiß vortrefflich, ich zweifle nicht daran, alle Achtung davor! Du\nwirst nun lernen, auch ein wenig gewöhnlich und menschlich zu lieben.\nDer Anfang ist ja gemacht, man kann dich schon bald an einen Ball gehen\nlassen. Nun, den Boston mußt du erst noch lernen, damit beginnen wir\nmorgen. Ich komme um drei Uhr. Wie hat dir übrigens die Musik hier\ngefallen?“","„Ausgezeichnet.“","„Siehst du, das ist auch ein Fortschritt, du hast zugelernt. Bisher hast\ndu alle diese Tanz- und Jazzmusik nicht leiden können, sie war dir zu\nwenig ernsthaft und tief, und nun hast du gesehen, daß man sie gar nicht\nernst zu nehmen braucht, daß sie aber sehr nett und entzückend sein\nkann. Übrigens, ohne Pablo wäre die ganze Kapelle nichts. Er führt sie,\ner heizt ein.“","* * * * *","Wie das Grammophon die Luft von asketischer Geistigkeit in meinem\nStudierzimmer verdarb, wie die amerikanischen Tänze fremd und störend,\nja vernichtend in meine gepflegte Musikwelt drangen, so drang von allen\nSeiten Neues, Gefürchtetes, Auflösendes in mein bisher so scharf\numrissenes und so streng abgeschlossenes Leben. Der Steppenwolftraktat\nund Hermine hatten recht mit ihrer Lehre von den tausend Seelen, täglich\nzeigten sich neben all den alten auch noch einige neue Seelen in mir,\nmachten Ansprüche, machten Lärm, und ich sah nun deutlich wie ein Bild\nvor mir den Wahn meiner bisherigen Persönlichkeit. Die paar Fähigkeiten\nund Übungen, in denen ich zufällig stark war, hatte ich allein gelten\nlassen und hatte das Bild eines Harry gemalt und das Leben eines Harry\ngelebt, der eigentlich nichts war als ein sehr zart ausgebildeter\nSpezialist für Dichtung, Musik und Philosophie – den ganzen Rest meiner\nPerson, das ganze übrige Chaos von Fähigkeiten, Trieben, Strebungen\nhatte ich als lästig empfunden und mit dem Namen Steppenwolf belegt.","Indessen war diese Bekehrung von meinem Wahn, diese Auflösung meiner\nPersönlichkeit keineswegs nur ein angenehmes und amüsantes Abenteuer,\nsie war im Gegenteil oft bitter schmerzhaft, oft nahezu unerträglich.\nDas Grammophon klang oft wahrhaft teuflisch inmitten dieser Umgebung, wo\nalles auf so andre Töne gestimmt war. Und manchmal, wenn ich in\nirgendeinem Moderestaurant zwischen allen den eleganten Lebemann- und\nHochstaplerfiguren meine Onesteps tanzte, kam ich mir wie ein Verräter\nan allem vor, was mir je im Leben ehrwürdig und heilig gewesen war.\nHätte Hermine mich nur acht Tage allein gelassen, so wäre ich diesen\nmühsamen und lächerlichen Lebemannsversuchen alsbald wieder entflohen.\nAber Hermine war immer da; obwohl ich sie nicht jeden Tag sah, war ich\ndoch stets von ihr gesehen, geleitet, bewacht, begutachtet, – auch alle\nmeine wütenden Auflehnungs- und Fluchtgedanken las sie mir lächelnd vom\nGesicht.","Mit der fortschreitenden Zerstörung dessen, was ich früher meine\nPersönlichkeit genannt hatte, begann ich auch zu verstehen, warum ich\ntrotz aller Verzweiflung den Tod so entsetzlich hatte fürchten müssen,\nund begann zu merken, daß auch diese scheußliche und schmähliche\nTodesfurcht ein Stück meiner alten, bürgerlichen, verlogenen Existenz\nwar. Dieser bisherige Herr Haller, der begabte Autor, der Kenner Mozarts\nund Goethes, der Verfasser lesenswerter Betrachtungen über die\nMetaphysik der Kunst, über Genie und Tragik, über Menschlichkeit, der\nmelancholische Einsiedler in seiner mit Büchern überfüllten Klause,\nwurde Zug für Zug der Selbstkritik ausgeliefert und bewährte sich\nnirgends. Dieser begabte und interessante Herr Haller hatte zwar\nVernunft und Menschlichkeit gepredigt und gegen die Roheit des Krieges\nprotestiert, er hatte sich aber während des Krieges nicht an die Wand\nstellen und erschießen lassen, wie es die eigentliche Konsequenz seines\nDenkens gewesen wäre, sondern hatte irgendeine Anpassung gefunden, eine\näußerst anständige und edle natürlich, aber doch eben einen Kompromiß.\nEr war ferner ein Gegner der Macht und Ausbeutung, aber er hatte auf der\nBank mehrere Wertpapiere von industriellen Unternehmungen liegen, deren\nZinsen er ohne alle Gewissensbisse verzehrte. Und so stand es mit allem.\nHarry Haller hatte sich zwar wundervoll als Idealist und Weltverächter,\nals wehmütiger Einsiedler und als grollender Prophet verkleidet, im\nGrunde aber war er ein Bourgeois, fand ein Leben wie das Herminens\nverwerflich, ärgerte sich über die im Restaurant vertanen Nächte, über\ndie ebendort vergeudeten Taler, hatte ein schlechtes Gewissen und sehnte\nsich keineswegs nach seiner Befreiung und Vollendung, sondern sehnte\nsich im Gegenteil heftig zurück in die bequemen Zeiten, als seine\ngeistigen Spielereien ihm noch Spaß gemacht und Ruhm eingebracht hatten.\nGenau so sehnten sich die von ihm verachteten und verhöhnten\nZeitungsleser nach der idealen Zeit vor dem Kriege zurück, weil das\nbequemer war, als aus dem Erlittenen zu lernen. Pfui Teufel, er war zum\nErbrechen, dieser Herr Haller! Und dennoch klammerte ich mich an ihn\noder an seine schon sich auflösende Larve, an sein Kokettieren mit dem\nGeistigen, an seine Bürgerfurcht vor dem Ungeordneten und Zufälligen\n(wozu auch der Tod gehörte) und verglich den werdenden neuen Harry,\ndiesen etwas schüchternen und komischen Dilettanten der Tanzsäle,\nhöhnisch und voll Neid mit jenem einstigen, verlogen-idealen Harrybild,\nan welchem er inzwischen alle fatalen Züge entdeckt hatte, die ihn\ndamals an des Professors Goethe-Radierung so sehr gestört hatten. Er\nselbst, der alte Harry, war genau solch ein bürgerlich idealisierter\nGoethe gewesen, so ein Geistesheld mit allzu edlem Blick, von\nErhabenheit, Geist und Menschlichkeit strahlend wie von Brillantine und\nbeinahe über den eigenen Seelenadel gerührt! Teufel, dies holde Bild\nhatte nun allerdings arge Löcher bekommen, kläglich war der ideale Herr\nHaller demontiert worden! Wie ein von Straßenräubern geplünderter\nWürdenträger in zerfetzten Hosen sah er aus, der klug daran getan hätte,\njetzt die Rolle des Abgerissenen zu lernen, der aber seine Lumpen trug,\nals hingen noch Orden dran, und die verlorene Würde weinerlich weiter\nprätendierte.","Immer wieder traf ich mit dem Musikanten Pablo zusammen, und mein Urteil\nüber ihn mußte schon darum revidiert werden, weil Hermine ihn so gern\nhatte und seine Gesellschaft eifrig suchte. Ich hatte Pablo in meinem\nGedächtnis als eine hübsche Null verzeichnet, einen kleinen, etwas\neitlen Beau, ein vergnügtes und problemloses Kind, das mit Freude in\nseine Jahrmarktstrompete faucht und mit Lob und Schokolade leicht zu\nregieren ist. Aber Pablo fragte nicht nach meinen Urteilen, sie waren\nihm ebenso gleichgültig wie meine musikalischen Theorien. Höflich und\nfreundlich hörte er mich an, immerzu lächelnd, gab jedoch nie eine\nwirkliche Antwort. Dagegen schien ich trotzdem sein Interesse erregt zu\nhaben, er gab sich sichtlich Mühe, mir zu gefallen und mir Wohlwollen zu\nzeigen. Als ich bei einem dieser ergebnislosen Gespräche einmal gereizt\nund beinahe grob wurde, sah er mir bestürzt und traurig ins Gesicht,\nnahm meine linke Hand und streichelte sie, und bot mir aus einer kleinen\nvergoldeten Dose etwas zum Schnupfen an, das werde mir gut tun. Ich\nfragte Hermine mit einem Blick, sie nickte ja, und ich nahm und\nschnupfte. In der Tat wurde ich in kurzem frischer und munterer,\nwahrscheinlich war etwas Kokain in dem Pulver gewesen. Hermine erzählte\nmir, daß Pablo viele solche Mittel habe, die er auf geheimen Wegen\nerhalte, die er zuweilen Freunden vorsetze und in deren Mischung und\nDosierung er ein Meister sei: Mittel zum Betäuben von Schmerzen, zum\nSchlafen, zur Erzeugung schöner Träume, zum Lustigmachen, zum\nVerliebtmachen.","Einmal traf ich ihn auf der Straße, am Kai, und er schloß sich mir ohne\nweiteres an. Diesmal gelang es mir endlich, ihn zum Sprechen zu bringen.","„Herr Pablo,“ sagte ich zu ihm, der mit einem dünnen schwarz und\nsilbernen Stöckchen spielte, „Sie sind ein Freund von Hermine, dies ist\nder Grund, weshalb ich mich für Sie interessiere. Aber Sie machen mir,\ndas muß ich sagen, die Unterhaltung nicht eben leicht. Ich habe mehrmals\nden Versuch gemacht, mit Ihnen über Musik zu sprechen – es hätte mich\ninteressiert, Ihre Meinung, Ihren Widerspruch, Ihr Urteil zu hören; aber\nSie haben es verschmäht, mir auch nur die geringste Antwort zu geben.“","Er lachte mich herzlich an und blieb diesmal die Antwort nicht schuldig,\nsondern sagte gleichmütig: „Sehen Sie, es hat nach meiner Meinung gar\nkeinen Wert, über Musik zu sprechen. Ich spreche niemals über Musik. Was\nhätte ich Ihnen denn auch antworten sollen auf Ihre sehr klugen und\nrichtigen Worte? Sie hatten ja so sehr recht mit allem, was Sie sagten.\nAber sehen Sie, ich bin Musikant, nicht Gelehrter, und ich glaube nicht,\ndaß in der Musik das Rechthaben den geringsten Wert hat. Es kommt ja in\nder Musik nicht darauf an, daß man recht hat, daß man Geschmack und\nBildung hat und all das.“","„Nun ja. Aber auf was denn kommt es an?“","„Darauf, daß man musiziert, Herr Haller, daß man so gut und so viel und\nso intensiv wie möglich musiziert! Das ist es, Monsieur. Wenn ich\nsämtliche Werke von Bach und Haydn im Kopf habe und die gescheitesten\nSachen darüber sagen kann, so ist damit noch keinem Menschen gedient.\nWenn ich aber mein Blaserohr nehme und einen zügigen Shimmy spiele, so\nmag der Shimmy gut sein oder schlecht, er wird doch den Leuten Freude\nmachen, er fährt ihnen in die Beine und ins Blut. Darauf allein kommt es\nan. Sehen Sie einmal in einem Ballsaal die Gesichter an in dem\nAugenblick, wo nach einer längeren Pause die Musik wieder loslegt – wie\nda die Augen blitzen, die Beine zucken, die Gesichter zu lachen\nanfangen! Das ist es, wofür man musiziert.“","„Sehr gut, Herr Pablo. Aber es gibt nicht bloß sinnliche Musik, es gibt\nauch geistige. Es gibt nicht bloß die, die im Augenblick gerade gespielt\nwird, sondern auch unsterbliche, die weiterlebt, auch wenn sie nicht\ngerade gespielt wird. Es kann jemand allein in seinem Bett liegen und in\nseinen Gedanken eine Melodie aus der Zauberflöte oder aus der\nMatthäuspassion erwecken, dann findet Musik statt, ohne daß ein einziger\nMensch in eine Flöte bläst oder eine Geige streicht.“","„Gewiß, Herr Haller. Auch der Yearning und der Valencia wird jede Nacht\nvon vielen einsamen und träumerischen Menschen stumm reproduziert; noch\ndas ärmste Schreibmaschinenmädel in seinem Bureau hat den letzten\nOnestep im Kopf und trommelt ihre Tasten nach seinem Takt. Sie haben\nrecht, alle diese einsamen Menschen, ich gönne ihnen allen ihre stumme\nMusik, sei es der Yearning oder die Zauberflöte oder der Valencia! Aber\nwoher nehmen denn diese Menschen ihre einsame, stumme Musik? Sie holen\nsie bei uns, bei den Musikanten, sie muß zuerst gespielt und gehört und\nins Blut gegangen sein, eh einer daheim in seiner Kammer an sie denken\nund von ihr träumen kann.“","„Einverstanden“, sagte ich kühl. „Dennoch geht es nicht an, Mozart und\nden neusten Foxtrott auf eine Stufe zu stellen. Und es ist nicht\neinerlei, ob Sie den Leuten göttliche und ewige Musik vorspielen oder\nbillige Eintagsmusik.“","Als Pablo die Erregtheit in meiner Stimme wahrnahm, machte er alsbald\nsein liebstes Gesicht, strich mir kosend über den Arm und gab seiner\nStimme eine unglaubliche Sanftheit.","„Ach, lieber Herr, mit den Stufen mögen Sie ja ganz recht haben. Ich\nhabe gewiß nichts dagegen, daß Sie Mozart und Haydn und den Valencia auf\njede Ihnen beliebende Stufe stellen! Mir ist das ganz einerlei, ich habe\nüber die Stufen nicht zu entscheiden, ich werde nicht hierüber gefragt.\nDer Mozart wird vielleicht auch noch in hundert Jahren gespielt werden\nund der Valencia vielleicht schon in zwei Jahren nicht mehr – ich\nglaube, das können wir ruhig dem lieben Gott überlassen, er ist gerecht\nund hat unser aller Lebensdauer in der Hand, auch die jedes Walzers und\njedes Foxtrott, er wird sicher das Richtige tun. Wir Musikanten aber,\nwir müssen das Unsere tun, das, was unsere Pflicht und Aufgabe ist: wir\nmüssen das spielen, was gerade im Augenblick von den Leuten begehrt\nwird, und wir müssen es so gut und schön und eindringlich spielen wie\nnur möglich.“","Seufzend gab ich es auf. Diesem Menschen war nicht beizukommen.","* * * * *","In manchen Augenblicken war Altes und Neues, war Schmerz und Lust,\nFurcht und Freude ganz wunderlich durcheinander gemischt. Bald war ich\nim Himmel, bald in der Hölle, meistens in beiden zugleich. Der alte\nHarry und der neue lebten bald im bittern Streit, bald im Frieden\nmiteinander. Der alte Harry schien manchmal ganz und gar tot zu sein,\ngestorben und begraben, und plötzlich stand er dann wieder da, befahl\nund tyrannisierte und wußte alles besser, und der neue, kleine, junge\nHarry schämte sich, schwieg und ließ sich an die Wand drücken. Zu andern\nStunden nahm der junge Harry den alten an der Kehle und drückte wacker\nzu, es gab viel Gestöhne, viel Todeskampf, viel Gedanken an das\nRasiermesser.","Oft aber schlug Leid und Glück in einer Welle über mir zusammen. Ein\nsolcher Augenblick war der, in dem ich wenige Tage nach meinem ersten\nöffentlichen Tanzversuch am Abend mein Schlafzimmer betrat und zu meinem\nnamenlosen Erstaunen, Befremden, Schreck und Entzücken die schöne Maria\nin meinem Bett liegen fand.","Von allen Überraschungen, denen Hermine mich bisher ausgesetzt hatte,\nwar dies die heftigste. Denn daran zweifelte ich keinen Augenblick, daß\n_sie_ es war, die mir diesen Paradiesvogel zugesandt habe. Ich war an\njenem Abend ausnahmsweise nicht mit Hermine zusammen gewesen, sondern\nhatte im Münster eine gute Aufführung alter Kirchenmusik angehört – es\nwar ein schöner und wehmütiger Ausflug in mein ehemaliges Leben gewesen,\nin die Gefilde meiner Jugend, in die Gebiete des idealen Harry. Im hohen\ngotischen Raum der Kirche, deren schöne Netzgewölbe im Spiel der wenigen\nLichter geisterhaft lebendig hin und wider schwangen, hatte ich Stücke\nvon Buxtehude, Pachelbel, Bach, Haydn gehört, war die geliebten alten\nWege wieder gegangen, hatte die herrliche Stimme einer Bachsängerin\nwieder gehört, mit der ich einst befreundet gewesen war und viele\naußerordentliche Aufführungen erlebt hatte. Die Stimmen der alten Musik,\nihre unendliche Würde und Heiligkeit hatte mir alle Erhebungen,\nEntzückungen und Begeisterungen der Jugend wachgerufen, traurig und\nversunken saß ich im hohen Chor der Kirche, für eine Stunde zu Gast in\ndieser edlen, seligen Welt, die einst meine Heimat gewesen war. Bei\neinem Haydnschen Duett waren mir plötzlich die Tränen gekommen, ich\nhatte den Schluß des Konzertes nicht abgewartet, hatte auf das\nWiedersehen mit der Sängerin verzichtet (oh, wieviel strahlende Abende\nhatte ich einst nach solchen Konzerten mit den Künstlern hingebracht!),\nhatte mich aus dem Münster hinweggeschlichen und in den nächtlichen\nGassen müde gelaufen, wo da und dort hinter den Fenstern der Restaurants\nJazzkapellen die Melodien meines jetzigen Lebens spielten. Oh, was für\nein trübes Irrsal war aus meinem Leben geworden!","Lange hatte ich auf diesem Nachtgang auch über mein merkwürdiges\nVerhältnis zur Musik nachgedacht und hatte, einmal wieder, dies ebenso\nrührende wie fatale Verhältnis zur Musik als das Schicksal der ganzen\ndeutschen Geistigkeit erkannt. Im deutschen Geist herrscht das\nMutterrecht, die Naturgebundenheit in Form einer Hegemonie der Musik,\nwie sie nie ein andres Volk gekannt hat. Wir Geistigen, statt uns\nmannhaft dagegen zu wehren und dem Geist, dem Logos, dem Wort Gehorsam\nzu leisten und Gehör zu verschaffen, träumen alle von einer Sprache ohne\nWorte, welche das Unaussprechliche sagt, das Ungestaltbare darstellt.\nStatt sein Instrument möglichst treu und redlich zu spielen, hat der\ngeistige Deutsche stets gegen das Wort und gegen die Vernunft frondiert\nund mit der Musik geliebäugelt. Und in der Musik, in wunderbaren seligen\nTongebilden, in wunderbaren holden Gefühlen und Stimmungen, welche nie\nzur Verwirklichung gedrängt wurden, hat der deutsche Geist sich\nausgeschwelgt und die Mehrzahl seiner tatsächlichen Aufgaben versäumt.\nWir Geistigen alle waren in der Wirklichkeit nicht zu Hause, waren ihr\nfremd und feind, darum war auch in unsrer deutschen Wirklichkeit, in\nunsrer Geschichte, unsrer Politik, unsrer öffentlichen Meinung die Rolle\ndes Geistes eine so klägliche. Nun ja, oft hatte ich diesen Gedanken\ndurchgedacht, nicht ohne zuweilen eine heftige Sehnsucht danach zu\nfühlen, einmal Wirklichkeit mit zu gestalten, einmal ernsthaft und\nverantwortlich tätig zu sein, statt immer bloß Ästhetik zu treiben und\ngeistiges Kunstgewerbe. Es endete aber immer mit der Resignation, mit\nder Ergebung ins Verhängnis. Die Herren Generäle und Schwerindustriellen\nhatten ganz recht: es war nichts los mit uns „Geistigen“, wir waren eine\nentbehrliche, wirklichkeitsfremde, verantwortungslose Gesellschaft von\ngeistreichen Schwätzern. Pfui Teufel! Rasiermesser!","So von Gedanken und vom Nachklang der Musik erfüllt, das Herz schwer von\nTrauer und verzweifelter Sehnsucht nach Leben, nach Wirklichkeit, nach\nSinn, nach unwiederbringlich Verlorenem, war ich endlich heimgekehrt,\nhatte meine Treppen erstiegen, hatte im Wohnzimmer Licht gemacht und\nvergebens ein wenig zu lesen versucht, hatte an die Verabredung gedacht,\ndie mich zwang, morgen abend zu Whisky und Tanz in die Cécil-Bar zu\ngehen, und hatte nicht nur gegen mich selbst, sondern auch gegen Hermine\nGroll und Bitterkeit empfunden. Mochte sie es gut und herzlich meinen,\nmochte sie ein wundervolles Wesen sein – sie hätte mich doch damals\nlieber zugrunde gehen lassen sollen, statt mich in diese wirre, fremde,\nflirrende Spielwelt hinein- und hinabzuziehen, wo ich doch immer ein\nFremder bleiben würde und wo das Beste in mir verkam und Not litt!","Und so hatte ich traurig mein Licht gelöscht, traurig mein Schlafzimmer\naufgesucht, traurig mit dem Entkleiden begonnen, da machte ein\nungewohnter Duft mich stutzig, es roch leicht nach Parfüm, und\numblickend sah ich in meinem Bett die schöne Maria liegen, lächelnd,\netwas bange, mit großen blauen Augen.","„Maria!“ sagte ich. Und mein erster Gedanke war, daß meine Hauswirtin\nmir kündigen würde, wenn sie das wüßte.","„Ich bin gekommen“, sagte sie leise. „Sind Sie mir böse?“","„Nein, nein. Ich weiß, Hermine hat Ihnen den Schlüssel gegeben. Nun ja.“","„Oh, Sie sind böse darüber. Ich gehe wieder.“","„Nein, schöne Maria, bleiben Sie! Nur bin ich gerade heut abend sehr\ntraurig, lustig sein kann ich heute nicht, das kann ich dann morgen\nvielleicht wieder.“","Ich hatte mich etwas zu ihr hinabgebeugt, da faßte sie meinen Kopf mit\nihren beiden großen, festen Händen, zog ihn herab und küßte mich lange.\nDann setzte ich mich zu ihr aufs Bett, hielt ihre Hand, bat sie, leise\nzu reden, da man uns nicht hören dürfe, und sah in ihr schönes volles\nGesicht hinab, das fremd und wunderbar wie eine große Blume da auf\nmeinem Kissen lag. Langsam zog sie meine Hand an ihren Mund, zog sie\nunter die Decke und legte sie auf ihre warme, still atmende Brust.","„Du brauchst nicht lustig zu sein,“ sagte sie, „Hermine hat mir schon\ngesagt, daß du Kummer hast. Das versteht ja jeder. Gefalle ich dir denn\nnoch, du? Neulich beim Tanzen warst du sehr verliebt.“","Ich küßte sie auf Augen, Mund, Hals und Brüste. Eben noch hatte ich an\nHermine gedacht, bitter und mit Vorwürfen. Nun hielt ich ihr Geschenk in\nHänden und war dankbar. Die Liebkosungen Marias taten der wunderbaren\nMusik nicht weh, die ich heut gehört hatte, sie waren ihrer würdig und\nihre Erfüllung. Langsam zog ich die Decke von der schönen Frau, bis ich\nmit meinen Küssen zu ihren Füßen gelangt war. Als ich mich zu ihr legte,\nlächelte ihr Blumengesicht mich allwissend und gütig an.","In dieser Nacht, an Marias Seite, schlief ich nicht lange, aber tief und\ngut wie ein Kind. Und zwischen den Schlafzeiten trank ich ihre schöne\nheitere Jugend und erfuhr im leisen Plaudern eine Menge wissenswerter\nDinge über ihr und Herminens Leben. Ich hatte über diese Art von Wesen\nund Leben sehr wenig gewußt, nur beim Theater hatte ich früher\ngelegentlich ähnliche Existenzen, Frauen wie Männer, angetroffen, halb\nKünstler, halb Lebewelt. Jetzt erst sah ich ein wenig in diese\nmerkwürdigen, diese seltsam unschuldigen, seltsam verdorbenen Leben\nhinein. Diese Mädchen, von Hause meist arm, zu klug und zu hübsch, um\nihr ganzes Leben einzig auf irgendeinen schlecht bezahlten\nund freudlosen Broterwerb zu stellen, lebten alle bald von\nGelegenheitsarbeit, bald von ihrer Anmut und Liebenswürdigkeit. Sie\nsaßen zuweilen ein paar Monate an einer Schreibmaschine, waren zeitweise\ndie Geliebten wohlhabender Lebemänner, bekamen Taschengelder und\nGeschenke, lebten zu Zeiten in Pelz, Auto und Grand Hôtel, zu andern\nZeiten in Dachkammern und waren zur Ehe zwar unter Umständen durch ein\nhohes Angebot zu gewinnen, im ganzen aber keineswegs auf sie erpicht.\nManche von ihnen waren in der Liebe ohne Begehrlichkeit und gaben ihre\nGunst nur widerwillig und unter Feilschen um den höchsten Preis. Andre,\nund zu ihnen gehörte Maria, waren ungewöhnlich liebesbegabt und\nliebesbedürftig, die meisten auch in der Liebe mit beiden Geschlechtern\nerfahren; sie lebten einzig der Liebe wegen und hatten stets neben den\noffiziellen und zahlenden Freunden noch andre Liebesbeziehungen blühen.\nEmsig und geschäftig, sorgenvoll und leichtsinnig, klug und doch\nbesinnungslos lebten diese Schmetterlinge ihr ebenso kindliches wie\nraffiniertes Leben, unabhängig, nicht für jeden käuflich, vom Glück und\nguten Wetter das Ihre erwartend, ins Leben verliebt und doch viel\nweniger an ihm hängend als die Bürger, stets bereit, einem\nMärchenprinzen in sein Schloß zu folgen, stets mit halbem Bewußtsein\neines schweren und traurigen Endes gewiß.","Maria lehrte mich – in jener wunderlichen ersten Nacht und in den\nfolgenden Tagen – vieles, nicht nur holde neue Spiele und Beglückungen\nder Sinne, sondern auch neues Verständnis, neue Einsichten, neue Liebe.\nDie Welt der Tanz- und Vergnügungslokale, der Kinos, der Bars und\nHotelteehallen, die für mich, den Einsiedler und Ästheten, noch immer\netwas Minderwertiges, Verbotenes und Entwürdigendes hatte, war für\nMaria, für Hermine und ihre Kameradinnen die Welt schlechthin, war weder\ngut noch böse, weder begehrens- noch hassenswert, in dieser Welt blühte\nihr kurzes sehnsüchtiges Leben, in ihr waren sie heimisch und erfahren.\nSie liebten einen Champagner oder eine Spezialplatte im Grill Room, wie\nunsereiner einen Komponisten oder Dichter liebte, und sie verschwendeten\nan einen neuen Tanzschlager oder an das sentimentale, schmalzige Lied\neines Jazzsängers dieselbe Begeisterung, Ergriffenheit und Rührung wie\nunsereiner an Nietzsche oder an Hamsun. Maria erzählte mir von jenem\nhübschen Saxophonbläser Pablo und sprach von einem amerikanischen\n_song_, den er ihnen zuweilen gesungen habe, und sie sprach davon mit\neiner Hingerissenheit, Bewunderung und Liebe, die mich rührte und\nergriff weit mehr als die Ekstasen irgendeines Hochgebildeten über\nausgesucht vornehme Kunstgenüsse. Ich war bereit mitzuschwärmen, sei der\n_song_, wie er wolle; Marias liebevolle Worte, ihr sehnsüchtig\naufblühender Blick riß breite Breschen in meine Ästhetik. Wohl gab es\neiniges Schöne, einiges wenige auserlesen Schöne, das mir über jeden\nStreit und Zweifel erhaben schien, obenan Mozart, aber wo war die\nGrenze? Hatten wir Kenner und Kritiker nicht alle als Jünglinge\nKunstwerke und Künstler glühend geliebt, die uns heute zweifelhaft und\nfatal erschienen? War es uns nicht mit Liszt, mit Wagner, vielen sogar\nmit Beethoven so gegangen? War nicht Marias blühende Kinderrührung über\nden _song_ aus Amerika ein ebenso reines, schönes, über jeden Zweifel\nerhabenes Kunsterlebnis wie die Ergriffenheit irgendeines Studienrats\nüber den Tristan oder die Ekstase eines Dirigenten bei der Neunten\nSymphonie? Und stimmte das nicht merkwürdig gut zu den Ansichten des\nHerrn Pablo und gab ihm recht?","Diesen Pablo, den Schönen, schien auch Maria sehr zu lieben!","„Er ist ein schöner Mensch,“ sagte ich, „auch mir gefällt er sehr. Aber\nsag’ mir, Maria, wie kannst du daneben auch noch mich liebhaben, einen\nlangweiligen alten Kerl, der nicht hübsch ist und schon graue Haare\nbekommt und kein Saxophon blasen und keine englischen Liebeslieder\nsingen kann?“","„Rede nicht so häßlich!“ schalt sie. „Es ist doch ganz natürlich. Auch\ndu gefällst mir, auch du hast etwas Hübsches, Liebes und Besonderes, du\ndarfst nicht anders sein, als du bist. Man soll über diese Sachen nicht\nreden und Rechenschaft verlangen. Schau’, wenn du mir den Hals oder das\nOhr küßt, dann spüre ich, daß du mich gern hast, daß ich dir gefalle; du\nkannst so auf eine Art küssen, ein bißchen wie schüchtern, und das sagt\nzu mir: er hat dich gern, er ist dir dafür dankbar, daß du hübsch bist.\nDas habe ich sehr, sehr gern. Und dann wieder bei einem andern Mann habe\nich gerade das Gegenteil gern, daß er sich nichts aus mir zu machen\nscheint und mich so küßt, als sei es eine Gnade von ihm.“","Wieder schliefen wir ein. Wieder erwachte ich, ohne aufgehört zu haben,\nsie mit den Armen zu umschlingen, meine schöne, schöne Blume.","Und wunderlich! – beständig blieb die schöne Blume dennoch das Geschenk,\ndas mir Hermine gemacht hatte! Beständig stand jene hinter ihr, war\nmaskenhaft von ihr umschlossen! Und zwischenein plötzlich dachte ich an\nErika, an meine ferne böse Geliebte, an meine arme Freundin. Sie war\nkaum weniger hübsch als Maria, wenn auch nicht so blühend und erlöst,\nund an kleinen genialen Liebeskünsten ärmer, und sie stand eine Weile\nals Bild vor mir, deutlich und schmerzlich, geliebt und tief in mein\nSchicksal verwoben, und sank wieder dahin, in Schlaf, in Vergessenheit,\nin halb betrauerte Ferne.","Und so stiegen viele Bilder meines Lebens in dieser schönen, zärtlichen\nNacht vor mir auf, der ich solange leer und arm und bilderlos gelebt\nhatte. Jetzt, vom Eros zauberhaft erschlossen, sprang die Quelle der\nBilder tief und reich, und für Augenblicke stand das Herz mir still vor\nEntzücken und vor Trauer darüber, wie reich der Bildersaal meines\nLebens, wie voll hoher ewiger Sterne und Sternbilder die Seele des armen\nSteppenwolfes gewesen sei. Es schaute Kindheit und Mutter zart und\nverklärt wie ein fernes, unendlich blau entrücktes Stück Gebirge\nherüber, es klang ehern und klar der Chor meiner Freundschaften, mit dem\nsagenhaften Hermann beginnend, dem Seelenbruder Herminens; duftend und\nunirdisch, wie feucht aus dem Wasser heraufblühende Seeblumen, schwammen\ndie Bildnisse vieler Frauen heran, die ich geliebt, die ich begehrt und\nbesungen, von denen ich nur wenige erreicht und zu eigen zu haben\nversucht hatte. Auch meine Frau erschien, mit der ich manche Jahre\ngelebt, die mich Kameradschaft, Konflikt, Resignation gelehrt hatte, zu\nder trotz aller Lebensungenüge ein tiefes Vertrauen in mir lebendig\ngeblieben war bis zu dem Tage, da sie mich, irr und krank geworden, in\nplötzlicher Flucht und wilder Auflehnung verließ – und ich erkannte, wie\nsehr ich sie geliebt und wie tief ich ihr vertraut haben mußte, daß ihr\nVertrauensbruch mich so schwer und fürs Leben hatte treffen können.","Diese Bilder – es waren Hunderte, mit und ohne Namen – waren alle wieder\nda, stiegen jung und neu aus dem Brunnen dieser Liebesnacht, und ich\nwußte wieder, was ich lang im Elend vergessen hatte, daß sie der Besitz\nund Wert meines Lebens waren und unzerstörbar fortbestanden,\nsterngewordene Erlebnisse, die ich vergessen und doch nicht vernichten\nkonnte, deren Reihe die Sage meines Lebens, deren Sternglanz der\nunzerstörbare Wert meines Daseins war. Mein Leben war mühsam, irrläufig\nund unglücklich gewesen, es führte zu Verzicht und Verneinung, es war\nbitter vom Schicksalssalz alles Menschentums, aber es war reich, stolz\nund reich gewesen, auch noch im Elend ein Königsleben. Mochte das\nStückchen Weges bis zum Untergang vollends noch so kläglich vertan\nwerden, der Kern dieses Lebens war edel, es hatte Gesicht und Rasse, es\nging nicht um Pfennige, es ging um die Sterne.","Es ist schon wieder eine Weile her, und vieles ist seither geschehen und\nanders geworden, ich kann mich nur noch an weniges Einzelne aus jener\nNacht erinnern, an einzelne Worte zwischen uns, an einzelne Gebärden und\nTaten tiefer Liebeszärtlichkeit, an sternhelle Augenblicke des Erwachens\naus schwerem Schlaf der Liebesermattung. Aber jene Nacht war es, in der\nzum erstenmal wieder seit der Zeit meines Niedergangs mein eigenes Leben\nmich mit den unerbittlich strahlenden Augen anblickte, wo ich den Zufall\nwieder als Schicksal, das Trümmerfeld meines Daseins wieder als\ngöttliches Fragment erkannte. Meine Seele atmete wieder, mein Auge sah\nwieder, und für Augenblicke ahnte ich glühend, daß ich nur die\nzerstreute Bilderwelt zusammenzuraffen, daß ich nur mein Harry\nHallersches Steppenwolfleben als Ganzes zum Bilde zu erheben brauche, um\nselber in die Welt der Bilder einzugehen und unsterblich zu sein. War\ndenn nicht dies das Ziel, nach welchem jedes Menschenleben einen Anlauf\nund Versuch bedeutete?","Am Morgen mußte ich Maria, nachdem sie mein Frühstück geteilt hatte, aus\ndem Hause schmuggeln, und es gelang. Noch am selben Tage mietete ich für\nsie und mich in einem nahen Stadtteil ein Zimmerchen, das nur für unsre\nZusammenkünfte bestimmt war.","Meine Tanzlehrerin Hermine erschien pflichtgetreu, und ich mußte den\nBoston lernen. Sie war streng und unerbittlich und erließ mir keine\nStunde, denn es war beschlossen, daß ich mit ihr den nächsten Maskenball\nbesuchen werde. Sie hatte mich um Geld für ihr Kostüm gebeten, über das\nsie aber jede Auskunft verweigerte. Sie zu besuchen oder auch nur zu\nwissen, wo sie wohne, war mir noch immer verboten.","Diese Zeit vor dem Maskenball, etwa drei Wochen, war außerordentlich\nschön. Maria schien mir die erste wirkliche Geliebte zu sein, die ich je\ngehabt hatte. Immer hatte ich von den Frauen, die ich geliebt hatte,\nGeist und Bildung verlangt, ohne je ganz zu merken, daß auch die\ngeistvollste und verhältnismäßig gebildetste Frau niemals dem Logos in\nmir Antwort gab, sondern stets ihm entgegenstand; ich brachte meine\nProbleme und Gedanken zu den Frauen mit, und völlig unmöglich hätte es\nmir geschienen, ein Mädchen länger als eine Stunde zu lieben, das kaum\nein Buch gelesen hatte, kaum wußte, was Lesen ist, und einen\nTschaikowski von einem Beethoven nicht hätte unterscheiden können. Maria\nhatte keine Bildung, sie hatte diese Umwege und Ersatzwelten nicht\nnötig, ihre Probleme wuchsen alle unmittelbar aus den Sinnen. Mit den\nihr gegebenen Sinnen, mit ihrer besonderen Figur, ihren Farben, ihrem\nHaar, ihrer Stimme, ihrer Haut, ihrem Temperament so viel Sinnen- und\nLiebesglück als irgend möglich zu erringen, für jede Fähigkeit, für jede\nBiegung ihrer Linien, jede zarteste Modellierung ihres Körpers beim\nLiebenden Antwort, Verständnis und lebendiges, beglückendes Gegenspiel\nzu finden und hervorzuzaubern, dies war ihre Kunst und Aufgabe. Schon\nbei jenem ersten schüchternen Tanz mit ihr hatte ich das empfunden,\nhatte diesen Duft einer genialen, entzückend hochkultivierten\nSinnlichkeit gewittert und war von ihr bezaubert gewesen. Gewiß auch war\nes kein Zufall, daß Hermine, die Allwissende, mir diese Maria zugeführt\nhatte. Ihr Duft und ihre ganze Signatur war sommerlich, war rosenhaft.","Ich hatte nicht das Glück, Marias einziger oder bevorzugter Geliebter zu\nsein, ich war einer von mehreren. Oft hatte sie keine Zeit für mich,\nmanchmal eine Stunde am Nachmittag, wenige Male eine Nacht. Sie wollte\nkein Geld von mir nehmen, dahinter steckte wohl Hermine. Aber Geschenke\nnahm sie gerne, und wenn ich ihr etwa ein neues kleines Portemonnaie aus\nrotlackiertem Leder schenkte, durften auch zwei, drei Goldstücke darin\nstecken. Übrigens mit dem roten Geldbeutelchen wurde ich von ihr sehr\nausgelacht! Es war entzückend, aber es war ein Ladenhüter, verschollene\nMode. In diesen Dingen, von welchen ich bisher weniger gewußt und\nverstanden hatte als von irgendeiner Eskimosprache, lernte ich von Maria\nviel. Ich lernte vor allem, daß diese kleinen Spielzeuge, Mode- und\nLuxussachen nicht bloß Tand und Kitsch sind und eine Erfindung\ngeldgieriger Fabrikanten und Händler, sondern berechtigt, schön,\nmannigfaltig, eine kleine oder vielmehr große Welt von Dingen, welche\nalle den einzigen Zweck haben, der Liebe zu dienen, die Sinne zu\nverfeinern, die tote Umwelt zu beleben und zauberhaft mit neuen\nLiebesorganen zu begaben, vom Puder und Parfüm bis zum Tanzschuh, vom\nFingerring bis zur Zigarettendose, von der Gürtelschnalle bis zur\nHandtasche. Diese Tasche war keine Tasche, der Geldbeutel kein\nGeldbeutel, Blumen keine Blumen, der Fächer kein Fächer, alles war\nplastisches Material der Liebe, der Magie, der Reizung, war Bote,\nSchleichhändler, Waffe, Schlachtruf.","Wen Maria eigentlich liebe, darüber dachte ich oftmals nach. Am meisten,\nglaube ich, liebte sie den Jüngling Pablo vom Saxophon, mit den\nverlorenen schwarzen Augen und den langen, bleichen, edlen und\nmelancholischen Händen. Ich hätte diesen Pablo in der Liebe für etwas\nschläfrig, verwöhnt und passiv gehalten, aber Maria versicherte mir, daß\ner zwar nur langsam in Glut zu bringen, dann aber gespannter, härter,\nmännlicher und fordernder sei als irgendein Boxer oder Herrenreiter. Und\nso erfuhr und wußte ich Geheimes über diesen und jenen, vom Jazzmusiker,\nvom Schauspieler, von manchen Frauen, von Mädchen und Männern unsres\nMilieus, wußte allerlei Geheimnisse, sah unter der Oberfläche\nVerbindungen und Feindschaften, wurde langsam (ich, der ich in dieser\nWelt ein völlig beziehungsloser Fremdkörper gewesen war) vertraut und\neinbezogen. Auch über Hermine erfuhr ich viel. Besonders aber kam ich\nnun häufig mit Herrn Pablo zusammen, den Maria sehr liebte. Zuweilen\nbrauchte sie auch von seinen geheimen Mitteln, auch mir verschaffte sie\nje und je diese Genüsse, und immer stand Pablo mir mit besonderem Eifer\nzu Diensten. Einmal sagte er es mir ohne Umschweife: „Sie sind so viel\nunglücklich, das ist nicht gut, man soll nicht so sein. Tut mir leid.\nNehmen Sie leichte Opiumpfeife.“ Mein Urteil über diesen frohen, klugen,\nkindlichen und dabei unergründlichen Menschen änderte sich beständig,\nwir wurden Freunde, nicht selten nahm ich etwas von seinen Mitteln an.\nEtwas belustigt sah er meiner Verliebtheit in Maria zu. Einmal\nveranstaltete er ein „Fest“ auf seinem Zimmer, der Mansarde eines\nVorstadthotels. Es gab dort nur _einen_ Stuhl, Maria und ich mußten auf\ndem Bett sitzen. Er gab uns zu trinken, einen aus drei Fläschchen\nzusammengegossenen, geheimnisvollen, wunderbaren Likör. Und dann, als\nich sehr guter Laune geworden war, schlug er uns leuchtenden Auges vor,\neine Liebesorgie zu dreien zu feiern. Ich lehnte brüsk ab, mir war\ndergleichen nicht möglich, doch schielte ich immerhin einen Augenblick\nzu Maria hinüber, wie sie sich dazu verhalte, und obwohl sie meiner\nAblehnung sofort zustimmte, sah ich doch das Glimmen in ihren Augen und\nspürte ihr Bedauern über den Verzicht. Pablo war enttäuscht über meine\nAblehnung, aber nicht verletzt. „Schade,“ sagte er, „Harry bedenkt\nzuviel moralisch. Nichts zu machen. Wäre doch so schön gewesen, so sehr\nschön! Aber ich weiß Ersatz.“ Wir bekamen jeder einige Züge Opium zu\nrauchen, und regungslos sitzend, bei offenen Augen, erlebten wir alle\ndrei die von ihm suggerierte Szene, wobei Maria vor Entzücken zitterte.\nAls ich mich nachher ein wenig unwohl fühlte, legte mich Pablo aufs\nBett, gab mir einige Tropfen Medizin, und als ich für einige Minuten die\nAugen schloß, spürte ich auf jedem Augenlid einen ganz flüchtigen,\ngehauchten Kuß. Ich nahm ihn hin, als sei ich der Meinung, er komme von\nMaria. Aber ich wußte wohl, daß er von ihm war.","Und eines Abends überraschte er mich noch mehr. Er erschien in meiner\nWohnung, erzählte mir, daß er zwanzig Franken brauche und daß er mich um\ndies Geld bitte. Er biete mir dafür an, diese Nacht statt seiner über\nMaria zu verfügen.","„Pablo,“ sagte ich erschrocken, „Sie wissen nicht, was Sie da sagen.\nSeine Geliebte an einen andern für Geld abtreten, das gilt bei uns für\ndas Allerschimpflichste. Ich habe Ihren Vorschlag nicht gehört, Pablo.“","Mitleidig sah er mich an. „Sie wollen nicht, Herr Harry. Gut. Sie machen\nimmer sich selber Schwierigkeiten. Dann schlafen Sie also heute Nacht\nnicht bei Maria, wenn Ihnen das lieber ist, und geben Sie mir das Geld\nso, Sie werden es zurückbekommen. Ich brauche es notwendig.“","„Wofür denn?“","„Für Agostino – wissen Sie, das ist der Kleine von der zweiten Violine.\nEr ist schon acht Tage krank, und niemand sieht nach ihm, Geld hat er\nkeinen Pfennig, und jetzt ist auch meines ausgegangen.“","Aus Neugierde, und ein wenig auch zur Selbstbestrafung, ging ich mit zu\nAgostino, dem er Milch und Medizin in seine Dachkammer brachte, eine\nrecht elende Dachkammer, dem er das Bett frisch aufschüttelte, das\nZimmer lüftete und eine hübsche kunstgerechte Kompresse um den\nfiebernden Kopf machte, alles rasch und zart und sachkundig, wie eine\ngute Krankenschwester. Am gleichen Abend sah ich ihn, bis in die\nMorgenstunden, in der City-Bar musizieren.","Mit Hermine sprach ich oft lange und sachlich über Maria, über ihre\nHände, Schultern, Hüften, über ihre Art zu lachen, zu küssen, zu tanzen.","„Hat sie dir das schon gezeigt?“ fragte Hermine einmal und beschrieb mir\nein besonderes Spiel der Zunge beim Kuß. Ich bat sie, es mir doch selbst\nzu zeigen, doch wies sie mich ernsthaft ab. „Das kommt später,“ sagte\nsie, „noch bin ich nicht deine Geliebte.“","Ich fragte sie, woher sie denn Marias Kußkünste und manche geheime, nur\ndem liebenden Mann bekannte Besonderheiten ihres Leibes kenne.","„Oh,“ rief sie, „wir sind doch Freunde. Glaubst du denn, wir hätten\nGeheimnisse voreinander? Ich habe oft genug bei ihr geschlafen und mit\nihr gespielt. Nun ja, du hast da ein schönes Mädchen erwischt, die kann\nmehr als andre.“","„Ich glaube doch, Hermine, daß auch ihr noch Geheimnisse voreinander\nhabt. Oder hast du ihr auch über mich alles gesagt, was du weißt?“","„Nein, das sind andere Sachen, die sie nicht verstehen würde. Maria ist\nwunderbar, du hast Glück gehabt, aber zwischen dir und mir gibt es\nDinge, von denen sie keine Ahnung hat. Ich habe ihr viel über dich\ngesagt, natürlich, viel mehr, als dir damals lieb gewesen wäre – ich\nmußte sie doch für dich verführen! Aber verstehen, Freund, so wie ich\ndich verstehe, wird Maria dich nie und keine andere. Ich habe auch von\nihr noch einiges zugelernt – ich weiß über dich, soweit Maria dich\nkennt, Bescheid. Ich kenne dich beinah so gut, wie wenn wir oft\nmiteinander geschlafen hätten.“","Als ich wieder mit Maria zusammenkam, war es mir wunderlich und\ngeheimnisvoll, zu wissen, daß sie Hermine ebenso an ihrem Herzen gehabt\nhatte wie mich, daß sie deren Glieder, Haar und Haut genau so befühlt,\ngeküßt, gekostet und geprüft habe, wie die meinen. Neue, indirekte,\nkomplizierte Beziehungen und Verbindungen tauchten vor mir auf, neue\nLiebes- und Lebensmöglichkeiten, und ich dachte an die tausend Seelen\ndes Steppenwolftraktates.","* * * * *","In jener kurzen Zeit, zwischen meinem Bekanntwerden mit Maria und dem\ngroßen Maskenball, war ich geradezu glücklich und hatte dabei doch\nniemals das Gefühl, dies sei nun eine Erlösung, eine erreichte\nSeligkeit, sondern spürte sehr deutlich, daß dies alles Vorspiel und\nVorbereitung sei, daß alles heftig nach vorwärts dränge, daß das\nEigentliche erst komme.","Vom Tanzen hatte ich so viel gelernt, daß es mir nun möglich schien, den\nBall mitzumachen, von dem mit jedem Tage mehr die Rede war. Hermine\nhatte ein Geheimnis, sie blieb fest dabei, mir nicht zu verraten, in\nwelcher Maskentracht sie erscheinen werde. Ich werde sie schon erkennen,\nmeinte sie, und sollte ich es daran fehlen lassen, so werde sie mir\nhelfen, aber vorher dürfe ich nichts wissen. So war sie auch gar nicht\nneugierig auf meine Maskenpläne, und ich beschloß, mich gar nicht zu\nkostümieren. Maria, als ich sie zum Ball einladen wollte, erklärte mir,\ndaß sie für dies Fest schon einen Kavalier habe, besaß auch wirklich\nschon eine Eintrittskarte, und ich sah etwas enttäuscht, daß ich das\nFest nun allein werde besuchen müssen. Es war der vornehmste Kostümball\nder Stadt, der alljährlich in den Globussälen von der Künstlerschaft\nveranstaltet wurde.","In diesen Tagen sah ich Hermine wenig, aber am Tag vor dem Ball war sie\neine Weile bei mir – sie kam, um ihre Eintrittskarte abzuholen, die ich\nbesorgt hatte – und saß friedlich bei mir in meinem Zimmer, und da kam\nes zu einem Gespräch, das mir merkwürdig war und tiefen Eindruck machte.","„Es geht dir jetzt eigentlich recht gut,“ sagte sie, „das Tanzen bekommt\ndir. Wer dich vier Wochen nicht mehr gesehen hat, würde dich kaum\nwiederkennen.“","„Ja,“ gab ich zu, „es ist mir seit Jahren nicht so gut gegangen. Das\nkommt alles von dir, Hermine.“","„Oh, nicht von deiner schönen Maria?“","„Nein. Auch die hast ja du mir geschenkt. Sie ist wunderbar.“","„Sie ist die Geliebte, die du brauchtest, Steppenwolf. Hübsch, jung,\nguter Laune, in der Liebe sehr klug und nicht jeden Tag zu haben. Wenn\ndu sie nicht mit andern teilen müßtest, wenn sie bei dir nicht immer\nbloß ein flüchtiger Gast wäre, ginge es nicht so gut.“","Ja, auch das mußte ich zugeben.","„Also hast du jetzt eigentlich alles, was du brauchst?“","„Nein, Hermine, so ist es nicht. Ich habe etwas sehr Schönes und\nEntzückendes, eine große Freude, einen lieben Trost. Ich bin geradezu\nglücklich ...“","„Na also! Was willst du mehr?“","„Ich will mehr. Ich bin mit Glücklichsein nicht zufrieden, ich bin nicht\ndafür geschaffen, es ist nicht meine Bestimmung. Meine Bestimmung ist\ndas Gegenteil.“","„Also unglücklich sein? Nun, das hast du ja reichlich gehabt, damals,\nals du wegen des Rasiermessers nicht mehr nach Hause gehen konntest.“","„Nein, Hermine, es ist doch anders. Damals war ich, zugegeben, sehr\nunglücklich. Aber es war ein dummes Unglück, ein unfruchtbares.“","„Warum denn?“","„Weil ich sonst nicht diese Angst vor dem Tode hätte haben müssen, den\nich mir doch wünschte! Das Unglück, das ich brauche und ersehne, ist\nanders; es ist so, daß es mich mit Begier leiden und mit Wollust sterben\nläßt. Das ist das Unglück oder Glück, auf das ich warte.“","„Ich verstehe dich. Darin sind wir Geschwister. Aber was hast du gegen\ndas Glück, das du jetzt, mit Maria, gefunden hast? Warum bist du nicht\nzufrieden?“","„Ich habe nichts gegen dieses Glück, o nein, ich liebe es, ich bin ihm\ndankbar. Es ist schön wie ein Sonnentag mitten in einem Regensommer.\nAber ich spüre, daß es nicht dauern kann. Auch dies Glück ist\nunfruchtbar. Es macht zufrieden, aber Zufriedenheit ist keine Speise für\nmich. Es schläfert den Steppenwolf ein, es macht ihn satt. Aber es ist\nkein Glück, um darum zu sterben.“","„Also gestorben muß sein, Steppenwolf?“","„Ich glaube, ja! Ich bin sehr zufrieden mit meinem Glück, ich kann es\nnoch eine ganze Weile ertragen. Aber wenn das Glück mir manchmal eine\nStunde Zeit läßt, zum Wachwerden und zum Sehnsuchthaben, dann geht alle\nmeine Sehnsucht nicht dahin, dies Glück immer zu behalten, sondern\nwieder zu leiden, nur schöner und weniger ärmlich als früher. Ich sehne\nmich nach Leiden, die mich bereit und willig machen zum Sterben.“","Hermine sah mir zärtlich in die Augen, mit dem dunklen Blick, der so\nplötzlich bei ihr erscheinen konnte. Herrliche, furchtbare Augen!\nLangsam, die Worte einzeln suchend und nebeneinander stellend, sagte sie\n– so leise, daß ich mich anstrengen mußte, um es zu hören:","„Ich will dir heut etwas sagen, etwas, was ich schon lange weiß, und\nauch du weißt es schon, aber vielleicht hast du es dir selber noch nicht\ngesagt. Ich sage dir jetzt, was ich über mich und dich und über unser\nSchicksal weiß. Du, Harry, bist ein Künstler und Denker gewesen, ein\nMensch voll Freude und Glauben, immer auf der Spur des Großen und\nEwigen, nie mit dem Hübschen und Kleinen zufrieden. Aber je mehr das\nLeben dich geweckt und zu dir selber gebracht hat, desto größer ist\ndeine Not geworden, desto tiefer bist du in Leiden, Bangigkeit und\nVerzweiflung geraten, bis an den Hals, und alles, was du einst Schönes\nund Heiliges gekannt und geliebt und verehrt hast, all dein einstiger\nGlaube an die Menschen und an unsre hohe Bestimmung, hat dir nicht\nhelfen können und ist wertlos geworden und in Scherben gegangen. Dein\nGlaube fand keine Luft mehr zum Atmen. Und Ersticken ist ein harter Tod.\nIst es richtig, Harry? Ist das dein Schicksal?“","Ich nickte, nickte, nickte.","„Du hattest ein Bild vom Leben in dir, einen Glauben, eine Forderung, du\nwarst zu Taten, Leiden und Opfern bereit – und dann merktest du\nallmählich, daß die Welt gar keine Taten und Opfer und dergleichen von\ndir verlangt, daß das Leben keine heroische Dichtung ist, mit\nHeldenrollen und dergleichen, sondern eine bürgerliche gute Stube, wo\nman mit Essen und Trinken, Kaffee und Strickstrumpf, Tarockspiel und\nRadiomusik vollkommen zufrieden ist. Und wer das andere will und in sich\nhat, das Heldenhafte und Schöne, die Verehrung der großen Dichter oder\ndie Verehrung der Heiligen, der ist ein Narr und ein Ritter Don\nQuichotte. Gut. Und mir ist es ebenso gegangen, mein Freund! Ich war ein\nMädchen von guten Gaben und dafür bestimmt, nach einem hohen Vorbild zu\nleben, hohe Forderungen an mich zu stellen, würdige Aufgaben zu\nerfüllen. Ich konnte ein großes Los auf mich nehmen, die Frau eines\nKönigs sein, die Geliebte eines Revolutionärs, die Schwester eines\nGenies, die Mutter eines Märtyrers. Und das Leben hat mir nur eben\nerlaubt, eine Kurtisane von leidlich gutem Geschmack zu werden – schon\ndas ist mir schwer genug gemacht worden! So ist es mir gegangen. Ich war\neine Weile trostlos, und ich habe lange Zeit die Schuld an mir selber\ngesucht. Das Leben, dachte ich, muß doch schließlich immer recht haben,\nund wenn das Leben meine schönen Träume verhöhnte, so dachte ich, es\nwerden eben meine Träume dumm gewesen sein und unrecht gehabt haben.\nAber das half gar nichts. Und weil ich gute Augen und Ohren hatte und\nauch etwas neugierig war, sah ich mir das sogenannte Leben recht genau\nan, meine Bekannten und Nachbarn, fünfzig und mehr Menschen und\nSchicksale, und da sah ich, Harry: meine Träume hatten recht gehabt,\ntausendmal recht, ebenso wie deine. Das Leben aber, die Wirklichkeit,\nhatte unrecht. Daß eine Frau von meiner Art keine andere Wahl fand, als\nan einer Schreibmaschine im Dienst eines Geldverdieners ärmlich und\nsinnlos zu altern, oder einen solchen Geldverdiener um seines Geldes\nwillen zu heiraten, oder aber eine Art von Dirne zu werden, das war\nebensowenig richtig, als daß ein Mensch wie du einsam, scheu und\nverzweifelt nach dem Rasiermesser greifen muß. Bei mir war das Elend\nvielleicht mehr materiell und moralisch, bei dir mehr geistig – der Weg\nwar der gleiche. Glaubst du, ich könne deine Angst vor dem Foxtrott,\ndeinen Widerwillen gegen die Bars und Tanzdielen, dein Sichsträuben\ngegen Jazzmusik und all den Kram nicht verstehen? Allzu gut versteh’ ich\nsie, und ebenso deinen Abscheu vor der Politik, deine Trauer über das\nGeschwätz und verantwortungslose Getue der Parteien, der Presse, deine\nVerzweiflung über den Krieg, über den gewesenen und über die kommenden,\nüber die Art, wie man heute denkt, liest, baut, Musik macht, Feste\nfeiert, Bildung betreibt! Recht hast du, Steppenwolf, tausendmal recht,\nund doch mußt du untergehen. Du bist für diese einfache, bequeme, mit so\nwenigem zufriedene Welt von heute viel zu anspruchsvoll und hungrig, sie\nspeit dich aus, du hast für sie eine Dimension zuviel. Wer heute leben\nund seines Lebens froh werden will, der darf kein Mensch sein wie du und\nich. Wer statt Gedudel Musik, statt Vergnügen Freude, statt Geld Seele,\nstatt Betrieb echte Arbeit, statt Spielerei echte Leidenschaft verlangt,\nfür den ist diese hübsche Welt hier keine Heimat ...“","Sie blickte zu Boden und sann.","„Hermine,“ rief ich zärtlich, „Schwester, wie gute Augen du hast! Und\ndoch hast du mich den Foxtrott gelehrt! Aber wie meinst du das: daß\nMenschen wie wir, Menschen mit einer Dimension zuviel, hier nicht leben\nkönnen? An was liegt das? Ist das nur in unsrer heutigen Zeit so? Oder\nwar das immer?“","„Ich weiß nicht. Ich will zur Ehre der Welt annehmen, es sei bloß unsere\nZeit, es sei bloß eine Krankheit, ein momentanes Unglück. Die Führer\narbeiten stramm und erfolgreich auf den nächsten Krieg los, wir anderen\ntanzen unterdessen Foxtrott, verdienen Geld und essen Pralinés – in\neiner solchen Zeit muß ja die Welt recht bescheiden aussehen. Hoffen\nwir, daß andere Zeiten besser waren und wieder besser sein werden,\nreicher, weiter, tiefer. Aber uns ist damit nicht geholfen. Und\nvielleicht ist es immer so gewesen ...“","„Immer so wie heute? Immer nur eine Welt für Politiker, Schieber,\nKellner und Lebemänner, und keine Luft für Menschen?“","„Nun ja, ich weiß es nicht, niemand weiß das. Es ist auch einerlei. Aber\nich denke jetzt an deinen Liebling, mein Freund, von dem du mir zuweilen\nerzählt und auch Briefe vorgelesen hast, an Mozart. Wie war es denn mit\ndem? Wer hat zu seinen Zeiten die Welt regiert, den Rahm abgeschöpft,\nden Ton angegeben und etwas gegolten: Mozart oder die Geschäftemacher,\nMozart oder die flachen Dutzendmenschen? Und wie ist er gestorben und\nbegraben worden? Und so, meine ich, ist es vielleicht immer gewesen und\nwird immer sein, und das, was sie in den Schulen ‚Weltgeschichte‘ heißen\nund was man da auswendig lernen muß für die Bildung, mit allen den\nHelden, Genies, großen Taten und Gefühlen – das ist bloß ein Schwindel,\nvon den Schullehrern erfunden, für Bildungszwecke und damit die Kinder\nwährend der vorgeschriebenen Jahre doch mit etwas beschäftigt sind.\nImmer ist es so gewesen und wird immer so sein, daß die Zeit und die\nWelt, das Geld und die Macht den Kleinen und Flachen gehört, und den\nandern, den eigentlichen Menschen, gehört nichts. Nichts als der Tod.“","„Sonst gar nichts?“","„Doch, die Ewigkeit.“","„Du meinst den Namen, den Ruhm bei der Nachwelt?“","„Nein, Wölfchen, nicht den Ruhm – hat denn der einen Wert? Und glaubst\ndu denn, daß alle wirklich echten und vollen Menschen berühmt geworden\nund der Nachwelt bekannt seien?“","„Nein, natürlich nicht.“","„Also, der Ruhm ist es nicht. Der Ruhm existiert nur so für die Bildung,\ner ist eine Angelegenheit der Schullehrer. Der Ruhm ist es nicht, o\nnein! Aber das, was ich Ewigkeit nenne. Die Frommen nennen es Reich\nGottes. Ich denke mir: wir Menschen alle, wir Anspruchsvolleren, wir mit\nder Sehnsucht, mit der Dimension zuviel, könnten gar nicht leben, wenn\nes nicht außer der Luft dieser Welt auch noch eine andre Luft zu atmen\ngäbe, wenn nicht außer der Zeit auch noch die Ewigkeit bestünde, und die\nist das Reich des Echten. Dazu gehört die Musik von Mozart und die\nGedichte deiner großen Dichter, es gehören die Heiligen dazu, die Wunder\ngetan, die den Märtyrertod erlitten und den Menschen ein großes Beispiel\ngegeben haben. Aber es gehört zur Ewigkeit ebenso das Bild jeder echten\nTat, die Kraft jedes echten Gefühls, auch wenn niemand davon weiß und es\nsieht und aufschreibt und für die Nachwelt aufbewahrt. Es gibt in der\nEwigkeit keine Nachwelt, nur Mitwelt.“","„Du hast recht“, sagte ich.","„Die Frommen“, fuhr sie nachdenklich fort, „haben doch am meisten davon\ngewußt. Sie haben darum die Heiligen aufgestellt und das, was sie ‚die\nGemeinschaft der Heiligen‘ heißen. Die Heiligen, das sind die echten\nMenschen, die jüngeren Brüder des Heilands. Zu ihnen unterwegs sind wir\nunser Leben lang, mit jeder guten Tat, mit jedem tapferen Gedanken, mit\njeder Liebe. Die Gemeinschaft der Heiligen, die wurde in früheren Zeiten\nvon den Malern dargestellt in einem goldenen Himmel, strahlend, schön\nund friedevoll – sie ist nichts andres als das, was ich vorher die\n‚Ewigkeit‘ genannt habe. Es ist das Reich jenseits der Zeit und des\nScheins. Dorthin gehören wir, dort ist unsre Heimat, dorthin strebt\nunser Herz, Steppenwolf, und darum sehnen wir uns nach dem Tod. Dort\nfindest du deinen Goethe wieder und deinen Novalis und den Mozart, und\nich meine Heiligen, den Christoffer, den Philipp von Neri und alle. Es\ngibt viele Heilige, die zuerst arge Sünder waren, auch die Sünde kann\nein Weg zur Heiligkeit sein, die Sünde und das Laster. Du wirst lachen,\naber ich denke mir oft, daß vielleicht auch mein Freund Pablo ein\nversteckter Heiliger sein könnte. Ach Harry, wir müssen durch so viel\nDreck und Unsinn tappen, um nach Hause zu kommen! Und wir haben niemand,\nder uns führt, unser einziger Führer ist das Heimweh.“","Ihre letzten Worte hatte sie wieder ganz leise gesprochen, und jetzt war\nes friedlich still in dem Zimmer, die Sonne war am Untergehen und machte\ndie Goldschriften auf den vielen Bücherrücken meiner Bibliothek\nschimmern. Ich nahm Herminens Kopf in meine Hände, küßte sie auf die\nStirn und lehnte ihn Wange an Wange zu mir, geschwisterlich, so blieben\nwir einen Augenblick. Am liebsten wäre ich so geblieben und heute nicht\nmehr ausgegangen. Aber für diese Nacht, die letzte vor dem großen Ball,\nhatte Maria sich mir versprochen.","Auf dem Wege zu ihr aber dachte ich nicht an Maria, sondern nur an das,\nwas Hermine gesagt hatte. Dies alles waren, so schien mir, vielleicht\nnicht ihre eigenen Gedanken, sondern die meinigen, die die Hellsichtige\ngelesen und eingeatmet hatte und die sie mir wiedergab, so daß sie nun\nGestalt hatten und neu vor mir standen. Daß sie den Gedanken der\nEwigkeit ausgesprochen hatte, besonders dafür war ich ihr in jener\nStunde tief dankbar. Ich brauchte ihn, ich konnte ohne ihn nicht leben\nund auch nicht sterben. Das heilige Jenseits, das Zeitlose, die Welt des\newigen Wertes, der göttlichen Substanz war mir heute von meiner Freundin\nund Tanzlehrerin wiedergeschenkt worden. Ich mußte an meinen Goethetraum\ndenken, an das Bild des alten Weisen, der so unmenschlich gelacht und\nseinen unsterblichen Spaß mit mir getrieben hatte. Nun erst verstand ich\nGoethes Lachen, das Lachen der Unsterblichen. Es war ohne Gegenstand,\ndies Lachen, es war nur Licht, nur Helligkeit, es war das, was\nübrigbleibt, wenn ein echter Mensch durch die Leiden, Laster, Irrtümer,\nLeidenschaften und Mißverständnisse der Menschen hindurchgegangen und\nins Ewige, in den Weltraum durchgestoßen ist. Und die „Ewigkeit“ war\nnichts andres als die Erlösung der Zeit, war gewissermaßen ihre Rückkehr\nzur Unschuld, ihre Rückverwandlung in den Raum.","Ich suchte Maria an dem Ort, wo wir an unsern Abenden zu speisen\npflegten, doch war sie noch nicht gekommen. In dem stillen\nVorstadtkneipchen saß ich wartend am gedeckten Tisch, mit meinen\nGedanken noch bei unsrem Gespräch. Alle diese Gedanken, die da zwischen\nHermine und mir aufgetaucht waren, erschienen mir so tief vertraut, so\naltbekannt, so aus meiner eigensten Mythologie und Bilderwelt geschöpft!\nDie Unsterblichen, wie sie im zeitlosen Raume leben, entrückt, Bild\ngeworden und die kristallne Ewigkeit wie Äther um sie gegossen, und die\nkühle, sternhaft strahlende Heiterkeit dieser außerirdischen Welt –\nwoher denn war dies alles mir so vertraut? Ich sann, und es fielen mir\nStücke aus Mozarts „Cassations“, aus Bachs „Wohltemperiertem Klavier“\nein, und überall in dieser Musik schien mir diese kühle sternige\nHelligkeit zu leuchten, diese Ätherklarheit zu schwingen. Ja, das war\nes, diese Musik war so etwas wie zu Raum gefrorene Zeit, und über ihr\nschwang unendlich eine übermenschliche Heiterkeit, ein ewiges göttliches\nLachen. Oh, und dazu paßte ja auch der alte Goethe meines Traumes so\ngut! Und plötzlich hörte ich dies unergründliche Lachen um mich her,\nhörte die Unsterblichen lachen. Bezaubert saß ich, bezaubert suchte ich\naus der Westentasche meinen Bleistift hervor, suchte nach Papier, fand\ndie Weinkarte vor mir liegen, drehte sie um und schrieb auf ihre\nRückseite, schrieb Verse, die ich erst andern Tags in meiner Tasche\nwiederfand. Sie lauteten:","Die Unsterblichen","Immer wieder aus der Erde Tälern\nDampft zu uns empor des Lebens Drang,\nWilde Not, berauschter Überschwang,\nBlutiger Rauch von tausend Henkersmählern,\nKrampf der Lust, Begierde ohne Ende,\nMörderhände, Wuchererhände, Beterhände,\nAngst- und lustgepeitschter Menschenschwarm\nDunstet schwül und faulig, roh und warm,\nAtmet Seligkeit und wilde Brünste,\nFrißt sich selbst und speit sich wieder aus,\nBrütet Kriege aus und holde Künste,\nSchmückt mit Wahn das brennende Freudenhaus,\nSchlingt und zehrt und hurt sich durch die grellen\nJahrmarktsfreuden ihrer Kinderwelt,\nHebt für jeden neu sich aus den Wellen,\nWie sie jedem einst zu Kot zerfällt.","Wir dagegen haben uns gefunden\nIn des Äthers sterndurchglänztem Eis,\nKennen keine Tage, keine Stunden,\nSind nicht Mann noch Weib, nicht jung noch Greis.\nEure Sünden sind und eure Ängste,\nEuer Mord und eure geilen Wonnen\nSchauspiel uns gleichwie die kreisenden Sonnen,\nJeder einzige Tag ist uns der längste.\nStill zu eurem zuckenden Leben nickend,\nStill in die sich drehenden Sterne blickend\nAtmen wir des Weltraums Winter ein,\nSind befreundet mit dem Himmelsdrachen,\nKühl und wandellos ist unser ewiges Sein,\nKühl und sternhell unser ewiges Lachen.","Dann kam Maria, und nach einer heitern Mahlzeit ging ich mit ihr in\nunser Zimmerchen. Sie war an diesem Abend schöner, wärmer und inniger\nals je und gab mir Zärtlichkeiten und Spiele zu kosten, die ich als das\nLetzte an Hingabe empfand.","„Maria,“ sagte ich, „du bist heut verschwenderisch wie eine Göttin.\nMach’ uns beide nicht ganz tot, morgen ist doch der Maskenball. Was\nwirst du morgen für einen Kavalier haben? Ich fürchte, mein liebes\nBlümchen, es sei ein Märchenprinz und du werdest von ihm entführt und\nnie mehr zu mir zurückfinden. Du liebst mich heute beinahe so, wie gute\nLiebende es beim Abschied tun, beim letztenmal.“","Sie schmiegte die Lippen ganz in mein Ohr und flüsterte:","„Sprich nicht, Harry! Jedesmal kann das letztemal sein. Wenn Hermine\ndich nimmt, kommst du nicht mehr zu mir. Vielleicht nimmt sie dich\nmorgen.“","Nie habe ich das charakteristische Gefühl jener Tage, jene wunderlich\nbittersüße Doppelstimmung heftiger empfunden als in jener Nacht vor dem\nBall. Es war Glück, was ich empfand: die Schönheit und Hingabe Marias,\ndas Genießen, Betasten, Einatmen von hundert feinen holden\nSinnlichkeiten, die ich erst so spät, als alternder Mensch, hatte\nkennenlernen, das Plätschern in einer sanften, wiegenden Welle von\nGenuß. Und doch war das nur die Schale: innen war alles voll Bedeutung,\nSpannung, Schicksal, und während ich liebevoll und zärtlich mit den\nsüßen, rührenden Kleinigkeiten der Liebe beschäftigt war, scheinbar in\nlauter lauem Glücke schwamm, spürte ich im Herzen, wie mein Schicksal\nHals über Kopf nach vorwärts strebte, jagend und schlagend wie ein\nscheues Roß, dem Abgrund entgegen, dem Sturz entgegen, voll Angst, voll\nSehnsucht, voll Hingabe an den Tod. So wie ich noch vor kurzem mich mit\nScheu und Furcht gegen den angenehmen Leichtsinn der nur sinnlichen\nLiebe gewehrt, wie ich vor Marias lachender, sich zu verschenken\nbereiter Schönheit Angst gespürt hatte, so spürte ich jetzt Angst vor\ndem Tode – aber eine Angst, welche schon wußte, daß sie bald zu Hingabe\nund Erlösung werden würde.","Während wir schweigend in die geschäftigen Spiele unsrer Liebe vertieft\nwaren und einander inniger angehörten als jemals, nahm meine Seele\nAbschied von Maria, Abschied von alle dem, was sie mir bedeutet hatte.\nDurch sie hatte ich gelernt, noch einmal vor dem Ende mich kindlich dem\nSpiel der Oberfläche anzuvertrauen, flüchtigste Freuden zu suchen, Kind\nund Tier zu sein in der Unschuld des Geschlechts – ein Zustand, den ich\nin meinem früheren Leben nur als seltene Ausnahme gekannt hatte, denn\nSinnenleben und Geschlecht hatten für mich fast immer den bittern\nBeigeschmack von Schuld gehabt, den süßen, aber bangen Geschmack der\nverbotenen Frucht, vor der ein geistiger Mensch auf der Hut sein muß.\nJetzt hatten Hermine und Maria mir diesen Garten in seiner Unschuld\ngezeigt, dankbar war ich sein Gast gewesen – aber es wurde bald Zeit für\nmich, weiterzugehen, es war zu hübsch und warm in diesem Garten. Weiter\num die Krone des Lebens zu werben, weiter die endlose Schuld des Lebens\nzu büßen war mir bestimmt. Ein leichtes Leben, eine leichte Liebe, ein\nleichter Tod – das war nichts für mich.","Aus Andeutungen der Mädchen schloß ich, daß für den Ball morgen, oder im\nAnschluß an ihn, ganz besondere Genüsse und Ausschweifungen geplant\nwaren. Vielleicht war dies der Schluß, vielleicht hatte Maria recht mit\nihrer Ahnung, und wir lagen heut zum letztenmal beisammen, vielleicht\nbegann morgen der neue Schicksalsgang? Ich war voll brennender\nSehnsucht, voll erstickender Angst, und ich klammerte mich wild an\nMaria, lief noch einmal flackernd und gierig durch alle Pfade und\nDickichte ihres Gartens, verbiß mich noch einmal in die süße Frucht des\nParadiesbaumes.","* * * * *","Den versäumten Schlaf dieser Nacht holte ich am Tage nach. Ich fuhr am\nMorgen ins Bad, fuhr nach Hause, todmüde, machte mein Schlafzimmer\ndunkel, fand beim Entkleiden mein Gedicht in der Tasche, vergaß es\nwieder, legte mich sogleich nieder, vergaß Maria, Hermine und den\nMaskenball und schlief den ganzen Tag hindurch. Als ich am Abend\naufstand, fiel mir erst während des Rasierens wieder ein, daß in einer\nStunde schon der Maskenball beginne und ich ein Frackhemd heraussuchen\nmüsse. In guter Laune machte ich mich fertig und ging aus, um zunächst\neinmal zu essen.","Es war der erste Maskenball, den ich mitmachen sollte. In frühern Zeiten\nhatte ich zwar solche Feste je und je besucht, sie zuweilen auch hübsch\ngefunden, aber ich hatte nicht getanzt und war nur Zuschauer gewesen,\nund die Begeisterung, mit der ich andre davon hatte erzählen, sich\ndarauf hatte freuen hören, war mir immer komisch erschienen. He
