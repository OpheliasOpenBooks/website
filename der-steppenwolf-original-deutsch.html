 konnte. Vermutlich war\ndieses Bild nicht dümmer als alle Bilder dieser Art, alle diese von\nfleißigen Kunsthandwerkern hergestellten holden Heilande, Apostel,\nHeroen, Geisteshelden und Staatsmänner, vielleicht wirkte es nur durch\neine gewisse virtuose Gekonntheit so aufreizend auf mich; sei dem wie\nihm wolle, auf jeden Fall schrie mir, der ich schon hinlänglich gereizt\nund geladen war, diese eitle und selbstgefällige Darstellung des alten\nGoethe sogleich als ein fataler Mißklang entgegen und zeigte mir, daß\nich hier nicht am richtigen Orte sei. Hier waren schön stilisierte\nAltmeister und nationale Größen zu Hause, keine Steppenwölfe.","Wäre jetzt der Hausherr eingetreten, so wäre es mir vielleicht geglückt,\nunter annehmbaren Vorwänden meinen Rückzug auszuführen. Es kam jedoch\nseine Frau herein, und ich ergab mich ins Geschick, obwohl ich Unheil\nahnte. Wir begrüßten uns, und dem ersten Mißklang folgten lauter neue.\nDie Frau beglückwünschte mich zu meinem guten Aussehen, während mir nur\nallzu bewußt war, wie sehr ich in den Jahren seit unsrer letzten\nBegegnung gealtert war; schon bei ihrem Händedruck hatte der Schmerz in\nden Gichtfingern mich fatal daran erinnert. Ja, und dann fragte sie, wie\nes denn meiner lieben Frau gehe, und ich mußte ihr sagen, daß meine Frau\nmich verlassen habe und unsre Ehe geschieden sei. Wir waren froh, als\nder Professor eintrat. Auch er begrüßte mich herzlich, und die\nSchiefheit und Komik der Situation fand alsbald den denkbar hübschesten\nAusdruck. Er hielt eine Zeitung in Händen, das Blatt, auf das er\nabonniert war, eine Zeitung der Militaristen- und Kriegshetzepartei, und\nnachdem er mir die Hand gegeben hatte, deutete er auf das Blatt und\nerzählte, darin stehe etwas über einen Namensvetter von mir, einen\nPublizisten Haller, der ein übler Kerl und vaterlandsloser Geselle sein\nmüsse, er habe sich über den Kaiser lustig gemacht und sich zu der\nAnsicht bekannt, daß sein Vaterland am Entstehen des Krieges um nichts\nminder schuldig sei als die feindlichen Länder. Was das für ein Kerl\nsein müsse! Na, hier kriege der Bursche es gesagt, die Redaktion habe\ndiesen Schädling recht schneidig erledigt und an den Pranger gestellt.\nWir gingen jedoch zu anderem über, als er sah, daß dies Thema mich nicht\ninteressiere, und die beiden dachten wirklich nicht von ferne an die\nMöglichkeit, daß jenes Scheusal vor ihnen sitzen könne, und doch war es\nso, das Scheusal war ich selbst. Na, wozu Lärm machen und die Leute\nbeunruhigen! Ich lachte in mich hinein, gab aber jetzt die Hoffnung\nverloren, an diesem Abend noch etwas Angenehmes zu erleben. Ich habe den\nAugenblick deutlich in Erinnerung. In diesem Augenblick nämlich, während\nder Professor vom Vaterlandsverräter Haller sprach, verdichtete sich in\nmir das schlimme Gefühl von Depression und Verzweiflung, das sich seit\nder Begräbnisszene in mir angehäuft und immer verstärkt hatte, zu einem\nwüsten Druck, zu einer körperlich (im Unterleib) fühlbaren Not, einem\nwürgend angstvollen Schicksalsgefühl. Es lag etwas gegen mich auf der\nLauer, fühlte ich, es beschlich mich von hinten eine Gefahr. Zum Glück\nkam jetzt die Meldung, daß das Essen bereitstehe. Wir gingen ins\nSpeisezimmer, und während ich mich bemühte, immer wieder irgend etwas\nHarmloses zu sagen oder zu fragen, aß ich mehr, als ich gewohnt war, und\nfühlte mich von Augenblick zu Augenblick jämmerlicher. Mein Gott, dachte\nich beständig, warum strengen wir uns denn so an? Deutlich fühlte ich,\ndaß auch meine Gastgeber sich gar nicht wohl fühlten und daß ihre\nMunterkeit ihnen Mühe mache, sei es nun, daß ich so lähmend wirkte, sei\nes, daß sonst eine Verstimmung im Hause war. Sie fragten mich nach\nlauter Dingen, auf welche eine aufrichtige Antwort nicht zu geben war,\nbald hatte ich mich richtig festgelogen und kämpfte mit dem Ekel bei\njedem Wort. Schließlich begann ich, um abzulenken, von dem Begräbnis zu\nerzählen, dessen Zuschauer ich heut gewesen war. Aber ich traf den Ton\nnicht, meine Anläufe zum Humor wirkten verstimmend, wir kamen mehr und\nmehr auseinander, in mir lachte der Steppenwolf mit grinsendem Gebiß,\nund beim Nachtisch waren wir alle drei recht schweigsam.","Wir kehrten in jenes erste Zimmer zurück, um Kaffee und Schnaps zu\ntrinken, vielleicht würde uns das ein wenig aufhelfen. Aber da fiel der\nDichterfürst mir wieder ins Auge, obwohl er beiseite auf eine Kommode\ngestellt worden war. Ich kam nicht los von ihm, und, nicht ohne warnende\nStimmen in mir zu vernehmen, nahm ich ihn wieder in die Hand und begann\nmich mit ihm auseinanderzusetzen. Ich war wie besessen von dem Gefühl,\ndaß die Situation unerträglich sei, daß es mir jetzt gelingen müsse,\nmeine Wirte entweder zu erwärmen, mitzureißen und auf meinen Ton zu\nstimmen oder aber vollends eine Explosion herbeizuführen.","„Hoffen wir,“ sagte ich, „daß Goethe nicht wirklich so ausgesehen hat!\nDiese Eitelkeit und edle Pose, diese mit den verehrten Anwesenden\nliebäugelnde Würde und unter der männlichen Oberfläche diese Welt von\nholdester Sentimentalität! Man kann ja gewiß viel gegen ihn haben, auch\nich habe oft viel gegen den alten Wichtigtuer, aber ihn _so_\ndarzustellen, nein, das geht doch zu weit.“","Die Hausfrau schenkte den Kaffee vollends ein, mit einem tief leidenden\nGesicht, dann eilte sie aus dem Zimmer, und ihr Mann eröffnete mir, halb\nverlegen, halb vorwurfsvoll, dies Goethebild gehöre seiner Frau und\nwerde von ihr ganz besonders geliebt. „Und selbst wenn Sie objektiv\nrecht hätten, was ich übrigens bestreite, durften Sie sich doch nicht so\nkraß ausdrücken.“","„Da haben Sie recht“, gab ich zu. „Es ist leider eine Gewohnheit, ein\nLaster von mir, mich immer für den möglichst krassen Ausdruck zu\nentscheiden, was übrigens Goethe in seinen guten Stunden auch getan hat.\nDieser süße spießige Salongoethe freilich hätte nie einen krassen, einen\nechten, unmittelbaren Ausdruck gebraucht. Ich bitte Sie und Ihre Frau\nsehr um Entschuldigung – sagen Sie ihr bitte, daß ich Schizophrene bin.\nUnd zugleich bitte ich um Erlaubnis, mich empfehlen zu dürfen.“","Der betretene Herr erhob zwar noch einige Einwände, kam auch wieder\ndarauf zu sprechen, wie schön und anregend unsre einstigen Unterredungen\ngewesen seien, ja, daß meine Vermutungen über Mithras und Krischna ihm\ndamals tiefen Eindruck gemacht hätten und daß er gehofft habe, auch\nheute wieder ... und so weiter. Ich dankte ihm und sagte, daß dies sehr\nfreundliche Worte seien, daß aber leider mein Interesse für Krischna\nebenso wie meine Lust zu wissenschaftlichen Gesprächen ganz und gar\ngeschwunden sei, daß ich ihn heute mehrmals angelogen habe, so sei ich\nzum Beispiel nicht seit einigen Tagen hier in der Stadt, sondern seit\nvielen Monaten, lebe aber für mich allein und sei nicht mehr für den\nVerkehr in besseren Häusern geeignet, denn erstens sei ich stets sehr\nschlechter Laune und mit Gicht behaftet und zweitens meistens betrunken.\nFerner, um reinen Tisch zu schaffen und wenigstens nicht als Lügner\nwegzugehen, müsse ich dem verehrten Herrn erklären, daß er mich heute\nrecht sehr beleidigt habe. Er habe sich jene dumme, stiernackige, eines\nbeschäftigungslosen Offiziers, nicht aber eines Gelehrten würdige\nStellung eines reaktionären Blattes zu Hallers Meinungen zu eigen\ngemacht. Dieser „Bursche“ und vaterlandslose Geselle Haller aber sei ich\nselber, und es stünde besser um unser Land und um die Welt, wenn\nwenigstens die paar denkfähigen Menschen sich zu Vernunft und\nFriedensliebe bekennten, statt blind und besessen auf einen neuen Krieg\nloszusteuern. So, und damit Gott befohlen.","Und so erhob ich mich, nahm Abschied von Goethe und dem Professor, riß\ndraußen meine Sachen vom Kleiderhaken und lief davon. Laut heulte in\nmeiner Seele der schadenfrohe Wolf, ein gewaltiges Theater fand zwischen\nden beiden Harrys statt. Denn, das war mir sofort klar, diese\nunerquickliche Abendstunde hatte für mich viel mehr Bedeutung als für\nden indignierten Professor; für ihn war sie eine Enttäuschung und ein\nkleines Ärgernis, für mich aber war sie ein letztes Mißlingen und\nDavonlaufen, war mein Abschied von der bürgerlichen, der moralischen,\nder gelehrten Welt, war ein vollkommener Sieg des Steppenwolfes. Und es\nwar ein Abschiednehmen als Flüchtling und Besiegter, eine\nBankrotterklärung vor mir selber, ein Abschied ohne Trost, ohne\nÜberlegenheit, ohne Humor. Ich hatte von meiner ehemaligen Welt und\nHeimat, von Bürgerlichkeit, Sitte, Gelehrsamkeit nicht anders Abschied\ngenommen als der Mann mit dem Magengeschwür vom Schweinebraten. Wütend\nlief ich unter den Laternen hin, wütend und todestraurig. Was war das\nfür ein trostloser, beschämender, böser Tag gewesen, vom Morgen bis zum\nAbend, vom Friedhof bis zur Szene beim Professor! Wozu? Warum? Hatte es\neinen Sinn, noch mehr solche Tage auf sich zu laden, noch mehr solche\nSuppen auszufressen? Nein! Und so würde ich denn heut nacht der Komödie\nein Ende machen. Geh heim, Harry, und schneide dir die Kehle durch! Lang\ngenug hast du damit gewartet.","Hin und her lief ich durch die Straßen, vom Elend geritten. Natürlich\nwar es dumm von mir gewesen, den guten Leuten ihren Salonschmuck zu\nbespucken, es war dumm und unartig, aber ich konnte und konnte nun\neinmal nicht anders, ich konnte dies zahme, verlogene, artige Leben\nnicht mehr ertragen. Und da ich, wie es schien, auch die Einsamkeit\nnicht mehr ertragen konnte, da auch meine eigene Gesellschaft mir so\nunsäglich verhaßt und zum Ekel geworden war, da ich im luftleeren Raum\nmeiner Hölle erstickend um mich schlug, was gab es da noch für einen\nAusweg? Es gab keinen. O Vater und Mutter, o ferne heilige Feuer meiner\nJugend, o ihr tausend Freuden, Arbeiten und Ziele meines Lebens! Nichts\nvon allem war mir geblieben, nicht einmal Reue, nur Ekel und Schmerz.\nNie, so schien mir, hatte das bloße Lebenmüssen so weh getan wie in\ndieser Stunde.","In einer trostlosen Vorstadtkneipe ruhte ich einen Augenblick aus, trank\nWasser und Kognak, lief wieder weiter, vom Teufel gejagt, die steilen\nkrummen Gassen der Altstadt hinauf und hinab, durch die Alleen, über den\nBahnhofplatz. Fortreisen! dachte ich, ging in den Bahnhof, starrte auf\ndie Fahrpläne an den Wänden, trank etwas Wein, versuchte, mich zu\nbesinnen. Immer näher, immer deutlicher begann ich das Gespenst zu\nsehen, vor dem ich mich fürchtete. Es war die Heimkehr, die Rückkehr in\nmeine Stube, das Stillhaltenmüssen vor der Verzweiflung! Dem entging ich\nnicht, auch wenn ich noch viele Stunden herumlief, nicht der Rückkehr zu\nmeiner Tür, zum Tisch mit den Büchern, zum Diwan mit dem Bild meiner\nGeliebten darüber, nicht dem Augenblick, da ich das Rasiermesser\nabziehen und mir die Kehle durchschneiden mußte. Immer deutlicher tat\ndies Bild sich vor mir auf, und immer deutlicher, mit rasend klopfendem\nHerzen, fühlte ich die Angst aller Ängste: die Todesfurcht! Ja, ich\nhatte eine grauenhafte Furcht vor dem Tode. Obwohl ich keinen andern\nAusweg sah, obwohl Ekel, Leid und Verzweiflung rings um mich getürmt\nstanden, obwohl nichts mehr mich zu locken, mir Freude und Hoffnung zu\nmachen imstande war, graute mir doch unaussprechlich vor der\nHinrichtung, vor dem letzten Augenblick, vor dem kalten klaffenden\nSchnitt ins eigene Fleisch!","Ich sah keinen Weg, dem Gefürchteten zu entrinnen. Würde im Kampf\nzwischen Verzweiflung und Feigheit heute auch vielleicht die Feigheit\nsiegen, morgen und jeden Tag würde von neuem die Verzweiflung vor mir\nstehen, noch erhöht durch die Selbstverachtung. Ich würde so lange das\nMesser zur Hand nehmen und wieder wegwerfen, bis es endlich doch einmal\ngetan war. Dann lieber heute noch! Vernünftig sprach ich mir selber zu,\nwie einem geängstigten Kind, aber das Kind hörte nicht, es lief davon,\nes wollte leben. Zuckend riß es mich weiter durch die Stadt, in weiten\nBogen umkreiste ich meine Wohnung, stets die Heimkehr im Sinn, stets sie\nverzögernd. Da und dort blieb ich in einer Kneipe hängen, einen Becher\nlang, zwei Becher lang, dann jagte es mich weiter, im weiten Kreise um\ndas Ziel, um das Rasiermesser, um den Tod herum. Todmüde saß ich\nzuweilen auf einer Bank, auf einem Brunnenrand, auf einem Prellstein,\nhörte mein Herz klopfen, wischte mir den Schweiß von der Stirn, lief\nwieder weiter, voll tödlicher Angst, voll flackernder Sehnsucht nach\nLeben.","So zog es mich, spät in der Nacht, in einer entlegenen und mir wenig\nbekannten Vorstadt, in ein Wirtshaus hinein, hinter dessen Fenstern\nheftige Tanzmusik erscholl. Überm Tor las ich im Hineingehen ein altes\nSchild: Zum schwarzen Adler. Drinnen war Freinacht, lautes\nMenschengetümmel, Rauch, Weindunst und Geschrei, im hintern Saale wurde\ngetanzt, dort wütete die Tanzmusik. Ich blieb im vordern Raume, wo\nlauter einfache, zum Teil ärmlich gekleidete Leute sich aufhielten,\nwährend hinten im Ballsaal auch elegante Erscheinungen zu erspähen\nwaren. Vom Gedränge durch den Raum gestoßen, ward ich neben dem Büfett\nan einen Tisch gedrängt, ein hübsches bleiches Mädchen saß auf der\nWandbank, in einem dünnen, tief ausgeschnittenen Ballkleidchen, eine\nverwelkte Blume im Haar. Das Mädchen blickte mich, als es mich kommen\nsah, aufmerksam und freundlich an, lächelnd rückte es ein wenig beiseite\nund machte mir Platz.","„Darf ich?“ fragte ich und setzte mich neben sie.","„Gewiß, du darfst,“ sagte sie, „wer bist du denn?“","„Danke,“ sagte ich, „ich kann unmöglich nach Hause gehen, ich kann\nnicht, ich kann nicht, ich will hierbleiben, bei Ihnen, wenn Sie es\nerlauben. Nein, ich kann nicht heimgehen.“","Sie nickte, als verstünde sie mich, und indem sie nickte, betrachtete\nich die Locke, die von ihrer Stirn am Ohr vorbeifiel, und ich sah, daß\ndie welke Blume eine Kamelie war. Von drüben schmetterte die Musik, am\nBüfett riefen die Kellnerinnen hastig ihre Bestellungen aus.","„Bleib nur hier“, sagte sie mit einer Stimme, die mir wohl tat. „Warum\nkannst du denn nicht heimgehen?“","„Ich kann nicht. Zu Hause wartet etwas auf mich – nein, ich kann nicht,\nes ist zu schrecklich.“","„Dann laß es warten und bleib da. Komm, wische dir erst die Brille ab,\ndu kannst ja gar nichts sehen. So, gib dein Taschentuch. Was wollen wir\ndenn trinken? Burgunder?“","Sie wischte mir meine Brille ab; nun sah ich sie erst deutlich, das\nbleiche feste Gesicht mit dem blutrot gemalten Mund, mit den hellen\ngrauen Augen, mit der glatten kühlen Stirn, mit der kurzen straffen\nLocke vorm Ohr. Gütig und ein klein wenig spöttisch nahm sie sich meiner\nan, bestellte Wein, stieß mit mir an und sah dabei auf meine Schuhe\nhinunter.","„Mein Gott, woher kommst du denn? Du siehst aus, wie wenn du zu Fuß von\nParis gekommen wärst. So kommt man doch nicht an einen Ball.“","Ich sagte ja und nein, lachte ein wenig, ließ sie reden. Sie gefiel mir\nsehr, und ich war darüber verwundert, denn solche junge Mädchen hatte\nich bisher gemieden und eher mit Mißtrauen betrachtet. Und sie war genau\nso mit mir, wie es in diesem Augenblick für mich gut war – oh, und so\nist sie auch seither zu jeder Stunde mit mir gewesen. Sie behandelte\nmich so schonend, wie ich es nötig hatte, und so spöttisch, wie ich es\nnötig hatte. Sie bestellte ein belegtes Brot und befahl mir, es zu\nessen. Sie schenkte mir ein und hieß mich einen Schluck trinken, aber\nnicht zu rasch. Dann lobte sie meine Folgsamkeit.","„Du bist brav,“ meinte sie ermunternd, „du machst es einem nicht schwer.\nWollen wir wetten, daß es lange her ist, seit du zum letztenmal jemandem\nhast gehorchen müssen?“","„Ja, Sie haben die Wette gewonnen. Woher wußten Sie denn das?“","„Keine Kunst. Gehorchen ist wie Essen und Trinken – wer es lang entbehrt\nhat, dem geht nichts darüber. Nicht wahr, du gehorchst mir gern?“","„Sehr gern. Sie wissen alles.“","„Du machst es einem leicht. Vielleicht, Freund, könnte ich dir auch\nsagen, was das ist, was daheim auf dich wartet und wovor du solche Angst\nhast. Aber du weißt es ja selber, wir brauchen nicht davon zu reden,\ngelt? Dummes Zeug! Entweder einer hängt sich auf, nun ja, dann hängt er\nsich eben auf, er wird Grund dazu haben. Oder er lebt noch, und dann hat\ner sich bloß um das Leben zu kümmern. Nichts ist einfacher.“","„Oh,“ rief ich, „wenn das so einfach wäre! Ich habe mich, bei Gott,\ngenug um das Leben gekümmert, und es hat nichts genützt. Sich aufhängen\nist vielleicht schwer, ich weiß es nicht. Aber leben ist viel, viel\nschwerer! Weiß Gott, wie schwer es ist!“","„Nun, du wirst sehen, daß es kinderleicht ist. Den Anfang haben wir\nschon gemacht, du hast deine Brille geputzt, hast gegessen, hast\ngetrunken. Jetzt gehen wir und bürsten deine Hosen und Schuhe ein wenig,\nsie haben es nötig. Und dann wirst du einen Shimmy mit mir tanzen.“","„Da sehen Sie,“ rief ich eifrig, „daß ich doch recht hatte! Nichts tut\nmir mehr leid, als einen Befehl von Ihnen nicht ausführen zu können.\nAber diesen kann ich nicht ausführen. Ich kann keinen Shimmy tanzen, und\nauch keinen Walzer und keine Polka und wie die Dinger alle heißen, ich\nhabe nie in meinem Leben tanzen gelernt. Sehen Sie jetzt, daß doch nicht\nalles so einfach ist, wie Sie meinen?“","Das schöne Mädchen lächelte mit seinen blutroten Lippen und schüttelte\nden festen, knabenhaft frisierten Kopf. Indem ich sie ansah, wollte mir\nscheinen, sie gleiche der Rosa Kreisler, dem ersten Mädchen, in das ich\nmich einst als Knabe verliebt hatte, aber die war ja bräunlich und\ndunkelhaarig gewesen. Nein, ich wußte nicht, an wen dies fremde Mädchen\nmich erinnerte, ich wußte nur, es war etwas aus sehr früher Jugend, aus\nder Knabenzeit.","„Langsam,“ rief sie, „langsam! Du kannst also nicht tanzen? Überhaupt\nnicht? Nicht einmal einen Onestep? Und dabei behauptest du, weiß Gott,\nwelche Mühe du dir mit dem Leben gegeben habest! Da hast du geflunkert,\nJunge, das sollte man in deinem Alter nicht mehr tun. Ja, wie kannst du\nsagen, du habest dir mit dem Leben Mühe gegeben, wenn du nicht einmal\ntanzen willst?“","„Wenn ich es doch nicht kann! Ich habe es nie gelernt.“","Sie lachte.","„Aber lesen und schreiben hast du gelernt, gelt, und rechnen und\nwahrscheinlich auch noch Latein und Französisch und allerlei solche\nSachen? Ich will wetten, du bist zehn oder zwölf Jahre in der Schule\ngesessen und hast womöglich auch noch studiert und hast vielleicht sogar\nden Doktortitel und kannst Chinesisch oder Spanisch. Oder nicht? Also.\nAber das bißchen Zeit und Geld für ein paar Tanzstunden hast du nicht\naufgebracht! Na!“","„Es waren meine Eltern,“ rechtfertigte ich mich, „sie haben mich Latein\nund Griechisch und all das Zeug lernen lassen. Aber tanzen lernen ließen\nsie mich nicht, es war bei uns nicht Mode, meine Eltern haben selber nie\ngetanzt.“","Ganz kalt sah sie mich an, voller Verachtung, und wieder sprach aus\nihrem Gesicht etwas, was mich an frühe Jugendzeiten erinnerte.","„So, also deine Eltern müssen schuldig sein! Hast du sie auch gefragt,\nob du heut abend in den Schwarzen Adler gehen dürfest? Hast du? Sie sind\nschon lange tot, sagst du? Na also! Wenn du aus lauter Folgsamkeit in\ndeiner Jugend nicht hast tanzen lernen wollen – meinetwegen! Obwohl ich\nnicht glaube, daß du damals so ein Musterknabe warst. Aber nachher – was\nhast du denn nachher alle die Jahre lang getrieben?“","„Ach,“ gestand ich, „ich weiß es selber nicht mehr. Ich habe studiert,\nMusik gemacht, Bücher gelesen, Bücher geschrieben, Reisen gemacht –“","„Merkwürdige Ansichten, die du vom Leben hast! Du hast also immer\nschwierige und komplizierte Sachen getrieben, und die einfachen hast du\ngar nicht gelernt? Keine Zeit? Keine Lust? Na meinetwegen, Gott sei Dank\nbin ich nicht deine Mutter. Aber dann so tun, als hättest du das Leben\ndurchprobiert und nichts daran gefunden, nein, das geht nicht!“","„Schelten Sie nicht!“ bat ich. „Ich weiß schon, daß ich verrückt bin.“","„Ach was, sing mir keine Lieder vor! Du bist keineswegs verrückt, Herr\nProfessor, du bist mir sogar viel zu wenig verrückt! Du bist so auf eine\ndumme Art gescheit, scheint mir, richtig wie ein Professor. Komm, iß\nnoch ein Brötchen! Nachher erzählst du weiter.“","Sie besorgte mir nochmals ein Brötchen, tat etwas Salz daran, strich ein\nwenig Senf darauf, schnitt ein Stückchen für sich selber ab und hieß\nmich essen. Ich aß. Ich hätte alles getan, was sie mich geheißen hätte,\nalles außer Tanzen. Es tat ungeheuer wohl, jemand zu gehorchen, neben\njemand zu sitzen, der einen ausfragte, einem befahl, einen ausschalt.\nHätte der Professor oder seine Frau das vor ein paar Stunden getan, es\nwäre mir viel erspart geblieben. Aber nein, es war gut so, es wäre mir\nviel entgangen!","„Wie heißt du eigentlich?“ fragte sie plötzlich.","„Harry.“","„Harry? Ein Bubenname! Und ein Bub bist du auch, Harry, trotz den paar\ngrauen Flecken im Haar. Du bist ein Bub, und du solltest jemand haben,\nder ein wenig nach dir schaut. Vom Tanzen sage ich nichts mehr. Aber wie\ndu frisiert bist! Hast du denn keine Frau, keinen Schatz?“","„Ich habe keine Frau mehr, wir sind geschieden. Einen Schatz habe ich\nschon, aber er wohnt nicht hier, ich sehe ihn nur selten, wir kommen\nnicht sehr gut miteinander aus.“","Sie pfiff leise durch die Zähne.","„Du scheinst ein recht schwieriger Herr zu sein, daß keine bei dir\nbleibt. Aber sag’ jetzt: was war denn heut abend Besonderes los, daß du\nso vergeistert in der Welt herumgelaufen bist? Krach gehabt? Geld\nverspielt?“","Das war nun schwierig zu sagen.","„Sehen Sie,“ fing ich an, „es war eigentlich eine Kleinigkeit. Ich war\neingeladen, bei einem Professor – ich selber bin aber keiner –, und\neigentlich hätte ich gar nicht hingehen sollen, ich bin es nicht mehr\ngewohnt, so bei Leuten zu sitzen und zu schwatzen, ich habe es verlernt.\nIch ging auch schon in das Haus hinein mit dem Gefühl, es werde nicht\ngut gehen – als ich meinen Hut aufhängte, kam mir schon der Gedanke, ich\nwürde ihn vielleicht schon bald wieder brauchen. Ja, und bei diesem\nProfessor also, da stand auf dem Tisch so ein Bild herum, ein dummes\nBild, das mich ärgerte ...“","„Was für ein Bild? Warum ärgerte?“ unterbrach sie mich.","„Ja, es war ein Bild, das den Goethe vorstellte – wissen Sie, den\nDichter Goethe. Er war aber darauf nicht so, wie er wirklich ausgesehen\nhat – das weiß man nämlich überhaupt nicht genau, er ist seit hundert\nJahren tot. Sondern irgendein moderner Maler hatte den Goethe da so\nzurechtfrisiert, wie er sich ihn vorstellt, und dieses Bild ärgerte mich\nund war mir scheußlich zuwider – ich weiß nicht, ob Sie das verstehen?“","„Kann ich sehr gut verstehen, sei ohne Sorge. Weiter!“","„Schon vorher war ich mit dem Professor uneins; er ist, wie die\nProfessoren fast alle, ein großer Patriot und hat während des Krieges\nbrav mitgeholfen, das Volk anzulügen – im besten Glauben natürlich. Ich\naber bin ein Kriegsgegner. Na, einerlei. Also weiter. Ich hätte ja das\nBild gar nicht anzusehen brauchen ...“","„Hättest du allerdings nicht.“","„Aber erstens tat es mir wegen Goethe leid, der ist mir nämlich sehr,\nsehr lieb, und dann war es so, daß ich dachte – – nun, ich dachte oder\nfühlte etwa so: da sitze ich nun bei Leuten, die ich für meinesgleichen\nansehe und von denen ich dachte, auch sie werden den Goethe ähnlich wie\nich lieben und sich etwa ein ähnliches Bild von ihm machen wie ich, und\nnun haben sie da dieses geschmacklose, verfälschte, versüßte Bild stehen\nund finden es herrlich und merken gar nicht, daß der Geist dieses Bildes\ngenau das Gegenteil von Goethes Geist ist. Sie finden das Bild\nwunderbar, und meinetwegen können sie das ja auch – aber für mich ist\ndann auf einmal alles Vertrauen zu diesen Leuten, alle Freundschaft für\nsie und alles Gefühl von Verwandtschaft und Zusammengehören aus und\nvorbei. Übrigens war die Freundschaft ohnehin nicht groß. Also da wurde\nich wütend und traurig und sah, daß ich ganz allein war und niemand mich\nverstand. Begreifen Sie?“","„Leicht zu begreifen, Harry. Und dann? Hast du ihnen das Bild an die\nKöpfe gehauen?“","„Nein, ich habe geschimpft und bin fortgelaufen, ich wollte nach Hause,\naber – –“","„Aber da wäre keine Mama gewesen, um den dummen Buben zu trösten oder\nauszuschelten. Nun ja, Harry, du tust mir beinah leid, du bist ein\nKindskopf ohnegleichen.“","Gewiß, das sah ich ein, wie mir schien. Sie gab mir ein Glas Wein zu\ntrinken. Sie war in der Tat wie eine Mama mit mir. Zwischenein aber sah\nich für Augenblicke, wie schön und jung sie war.","„Also,“ fing sie dann wieder an, „also der Goethe ist vor hundert Jahren\ngestorben, und der Harry hat ihn sehr gern, und er macht sich eine\nwunderbare Vorstellung von ihm, wie er ausgesehen haben mag, und dazu\nhat Harry auch das Recht, nicht? Aber der Maler, der auch für den Goethe\nschwärmt und sich ein Bild von ihm macht, der hat kein Recht dazu, und\nder Professor auch nicht, und überhaupt niemand, denn das paßt Harry\nnicht, er verträgt das nicht, er muß dann schimpfen und davonlaufen!\nWenn er klug wäre, so würde er über den Maler und den Professor einfach\nlachen. Wenn er verrückt wäre, würde er ihnen ihren Goethe ins Gesicht\nschmeißen. Da er aber bloß ein kleiner Bub ist, läuft er heim und will\nsich aufhängen – –. Ich habe deine Geschichte gut verstanden, Harry. Es\nist eine komische Geschichte. Sie macht mich lachen. Halt, trink nicht\nso rasch! Burgunder trinkt man langsam, er macht sonst zu heiß. Aber dir\nmuß man alles sagen, kleiner Bub.“","Ihr Blick war streng und mahnend wie der einer sechzigjährigen\nGouvernante.","„O ja,“ bat ich zufrieden, „sagen Sie mir nur alles.“","„Was soll ich dir sagen?“","„Alles, was Sie mögen.“","„Gut, ich sage dir etwas. Seit einer Stunde hörst du, daß ich du zu dir\nsage, und du sagst immer noch Sie zu mir. Immer Lateinisch und\nGriechisch, immer möglichst kompliziert! Wenn ein Mädchen du zu dir sagt\nund sie dir nicht zuwider ist, dann sagst du auch du zu ihr. So, da hast\ndu etwas zugelernt. Und zweitens: seit einer halben Stunde weiß ich, daß\ndu Harry heißt. Ich weiß es, weil ich dich gefragt habe. Du aber willst\nnicht wissen, wie ich heiße.“","„O doch, sehr gern will ich es wissen.“","„Zu spät, Kleiner! Wenn wir uns einmal wiedersehen, kannst du wieder\nfragen. Heut sag’ ich’s nicht mehr. So, und jetzt will ich tanzen.“","Da sie Miene machte aufzustehen, sank plötzlich meine Stimmung tief, ich\nbekam Angst, sie würde gehen und mich allein lassen, und dann würde\nalles wieder, wie es vorher gewesen war. Wie ein vorübergehend\nverschwundener Zahnschmerz plötzlich wieder da ist und wie Feuer brennt,\nso war in einem Augenblick die Angst und das Grauen wieder da. O Gott,\nhatte ich denn vergessen können, was auf mich wartete? War denn etwas\nanders geworden?","„Halt,“ rief ich flehend, „gehen Sie – geh nicht fort! Natürlich kannst\ndu tanzen, soviel du willst, aber bleib nicht lange fort, komm wieder,\nkomm wieder!“","Lachend stand sie auf. Ich hatte sie mir stehend größer gedacht, sie war\nschlank, aber nicht groß. Wieder erinnerte sie mich an jemand – an wen?\nEs war nicht zu finden.","„Du kommst wieder?“","„Ich komme wieder, aber es kann eine Weile dauern, eine halbe Stunde\noder auch eine ganze. Ich will dir was sagen: mach’ die Augen zu und\nschlafe ein wenig; das ist, was du nötig hast.“","Ich machte ihr Platz, und sie ging; ihr Röckchen streifte meine Knie, im\nGehen blickte sie in einen runden, winzig kleinen Taschenspiegel, zog\ndie Augenbrauen hoch, wischte mit einem winzigen Puderquästchen über ihr\nKinn und verschwand im Tanzsaal. Ich blickte um mich: fremde Gesichter,\nrauchende Männer, verschüttetes Bier auf dem Marmortisch, Geschrei und\nGekreische überall, nebenan die Tanzmusik. Ich solle schlafen, hatte sie\ngesagt. Ach, gutes Kind, du hast eine Ahnung von meinem Schlaf, der\nscheuer ist als ein Wiesel! In diesem Jahrmarkt schlafen, am Tisch\nsitzend, zwischen den klappernden Bierkrügen! Ich nippte am Wein, zog\neine Zigarre aus der Tasche, sah mich nach Streichhölzern um, aber\neigentlich war mir nichts am Rauchen gelegen, ich legte die Zigarre vor\nmir auf den Tisch. „Mach’ die Augen zu“, hatte sie zu mir gesagt. Weiß\nGott, woher das Mädchen diese Stimme hatte, diese etwas tiefe, gute\nStimme, eine mütterliche Stimme. Es war gut, dieser Stimme zu gehorchen,\nich hatte es erfahren. Gehorsam machte ich die Augen zu, lehnte den Kopf\nan die Wand, hörte hundert heftige Geräusche mich umtosen, lächelte über\ndie Idee, an diesem Ort zu schlafen, beschloß, an die Saaltür zu gehen\nund einen Blick in den Tanzsaal zu erhaschen – ich mußte doch mein\nschönes Mädchen tanzen sehen –, bewegte unterm Stuhl die Füße, fühlte\nerst jetzt, wie unendlich müde ich vom stundenlangen Umherirren war, und\nblieb sitzen. Und da schlief ich schon, dem mütterlichen Befehl getreu,\nschlief gierig und dankbar und träumte, träumte klarer und hübscher, als\nich seit langem geträumt hatte. Mir träumte:","Ich saß und wartete in einem altmodischen Vorzimmer. Zuerst wußte ich\nnur, daß ich bei einer Exzellenz angemeldet sei, dann fiel mir ein, daß\nes ja Herr von Goethe sei, von dem ich empfangen werden sollte. Leider\nwar ich nicht ganz als Privatmann hier, sondern als Korrespondent einer\nZeitschrift, das störte mich sehr, und ich konnte nicht begreifen,\nwelcher Teufel mich in diese Situation hineingeritten habe. Außerdem\nbeunruhigte mich ein Skorpion, der soeben noch sichtbar gewesen war und\nan meinem Bein hochzuklettern versucht hatte. Ich hatte mich zwar gegen\ndas kleine schwarze Kriechtier gewehrt und geschüttelt, wußte aber\nnicht, wo es jetzt stecke, und wagte nirgends hinzugreifen.","Auch war ich nicht ganz sicher, ob man mich nicht aus Versehen, statt\nbei Goethe, bei Matthisson angemeldet habe, den ich aber im Traum mit\nBürger verwechselte, denn ich schrieb ihm die Gedichte an Molly zu.\nÜbrigens wäre mir ein Zusammentreffen mit Molly höchst erwünscht\ngewesen, ich dachte sie mir wundervoll, weich, musikalisch, abendlich.\nWäre ich nur nicht im Auftrag jener verwünschten Redaktion dagesessen!\nMein Unmut hierüber stieg mehr und mehr und übertrug sich allmählich\nauch auf Goethe, gegen den ich nun mit einemmal alle möglichen Bedenken\nund Vorwürfe hatte. Das konnte eine schöne Audienz geben! Der Skorpion\naber, wenn auch gefährlich und vielleicht in meiner nächsten Nähe\nversteckt, war doch vielleicht nicht so schlimm; er konnte, so schien\nmir, vielleicht auch Freundliches bedeuten, es schien mir sehr möglich,\ndaß er irgend etwas mit Molly zu tun habe, eine Art Bote von ihr sei\noder ihr Wappentier, ein schönes, gefährliches Wappentier der\nWeiblichkeit und der Sünde. Konnte das Tier nicht vielleicht Vulpius\nheißen? Aber da riß ein Diener die Tür auf, ich erhob mich und ging\nhinein.","Da stand der alte Goethe, klein und sehr steif, und richtig hatte er\neinen dicken Ordensstern auf seiner Klassikerbrust. Immer noch schien er\nzu regieren, immer noch Audienzen zu empfangen, immer noch die Welt von\nseinem Weimarer Museum aus zu kontrollieren. Denn kaum hatte er mich\nerblickt, so nickte er ruckend mit dem Kopf wie ein alter Rabe und\nsprach feierlich: „Nun, ihr jungen Leute, ihr seid ja wohl mit uns und\nunseren Bemühungen recht wenig einverstanden?“","„Ganz richtig“, sagte ich, von seinem Ministerblick durchkältet. „Wir\njungen Leute sind in der Tat nicht mit Ihnen einverstanden, alter Herr.\nSie sind uns zu feierlich, Exzellenz, und zu eitel und wichtigtuerisch\nund zu wenig aufrichtig. Dies dürfte das Wesentliche sein: zu wenig\naufrichtig.“","Der kleine alte Mann bewegte den strengen Kopf etwas nach vorn, und\nindem sein harter, amtlich gefalteter Mund sich in einem kleinen Lächeln\nentspannte und entzückend lebendig wurde, schlug mir plötzlich das Herz,\ndenn es fiel mir auf einmal das Gedicht ein „Dämmrung senkte sich von\noben“ und daß dieser Mann und dieser Mund es sei, aus dem die Worte\njenes Gedichtes gekommen waren. Eigentlich war ich in diesem Augenblick\nschon vollkommen entwaffnet und übermannt und wäre am liebsten vor ihn\nhingekniet. Aber ich hielt mich stramm und hörte aus seinem lächelnden\nMunde die Worte: „Ei, also der Unaufrichtigkeit zeihen Sie mich? Was das\nfür Worte sind! Wollen Sie sich nicht näher erklären?“","Gerne wollte ich das, sehr gerne.","„Sie haben, Herr von Goethe, gleich allen großen Geistern die\nFragwürdigkeit, die Hoffnungslosigkeit des Menschenlebens deutlich\nerkannt und gefühlt: die Herrlichkeit des Augenblicks und sein elendes\nVerwelken, die Unmöglichkeit, eine schöne Höhe des Gefühls anders zu\nbezahlen als durch die Kerkerhaft des Alltags, die brennende Sehnsucht\nnach dem Reich des Geistes, die mit der ebenso brennenden und ebenso\nheiligen Liebe zur verlornen Unschuld der Natur in ewigem tödlichen\nKampfe liegt, dies ganze furchtbare Schweben im Leeren und Ungewissen,\ndies Verurteiltsein zum Vergänglichen, niemals Vollgültigen, ewig\nVersuchhaften und Dilettantischen – kurz, die ganze Aussichtslosigkeit,\nVerstiegenheit und brennende Verzweiflung des Menschseins. Dies alles\nhaben Sie gekannt, sich je und je auch dazu bekannt, und dennoch haben\nSie mit Ihrem ganzen Leben das Gegenteil gepredigt, haben Glauben und\nOptimismus geäußert, haben sich und andern eine Dauer und einen Sinn\nunsrer geistigen Anstrengungen vorgespiegelt. Sie haben die Bekenner der\nTiefe, die Stimmen der verzweifelten Wahrheit abgelehnt und unterdrückt,\nin sich selbst ebenso wie in Kleist und Beethoven. Sie haben\njahrzehntelang so getan, als sei das Anhäufen von Wissen, von\nSammlungen, das Schreiben und Sammeln von Briefen, als sei Ihre ganze\nWeimarer Altersexistenz in der Tat ein Weg, um den Augenblick zu\nverewigen, den Sie doch nur mumifizieren konnten, um die Natur zu\nvergeistigen, die Sie doch nur zur Maske stilisieren konnten. Das ist\ndie Unaufrichtigkeit, die wir Ihnen vorwerfen.“","Nachdenklich blickte der alte Geheimrat mir in die Augen, sein Mund\nlächelte noch immer.","Dann fragte er zu meiner Verwunderung: „Die Zauberflöte von Mozart muß\nIhnen dann wohl recht sehr zuwider sein?“","Und noch ehe ich protestieren konnte, fuhr er fort: „Die Zauberflöte\nstellt das Leben als einen köstlichen Gesang dar, sie preist unsere\nGefühle, die doch vergänglich sind, wie etwas Ewiges und Göttliches, sie\nstimmt weder dem Herrn von Kleist noch dem Herrn Beethoven zu, sondern\npredigt Optimismus und Glauben.“","„Ich weiß, ich weiß!“ rief ich wütend. „Weiß Gott, wie Sie gerade auf\ndie Zauberflöte verfallen sind, die mir das Liebste auf der Welt ist!\nAber Mozart ist nicht zweiundachtzig Jahre alt geworden und hat nicht in\nseinem persönlichen Leben diese Ansprüche an Dauer, an Ordnung, an\nsteife Würde gestellt wie Sie! Er hat sich nicht so wichtig gemacht! Er\nhat seine göttlichen Melodien gesungen und ist arm gewesen und ist früh\ngestorben, arm, verkannt – –“","Der Atem ging mir aus. Tausend Dinge hätten jetzt in zehn Worten gesagt\nwerden müssen, ich begann an der Stirn zu schwitzen.","Goethe aber sagte sehr freundlich: „Daß ich zweiundachtzig Jahre alt\ngeworden bin, mag immerhin unverzeihlich sein. Mein Vergnügen daran war\nindessen geringer, als Sie denken mögen. Sie haben recht: ein großes\nVerlangen nach Dauer hat mich stets erfüllt, ich habe stets den Tod\ngefürchtet und bekämpft. Ich glaube, der Kampf gegen den Tod, das\nunbedingte und eigensinnige Lebenwollen ist der Antrieb, aus welchem\nalle hervorragenden Menschen gehandelt und gelebt haben. Daß man am Ende\ndennoch sterben muß, dies hingegen, mein junger Freund, habe ich mit\nzweiundachtzig Jahren ebenso bündig bewiesen, wie wenn ich als\nSchulknabe gestorben wäre. Wenn es zu meiner Rechtfertigung dienen kann,\nmöchte ich dies noch sagen: in meiner Natur ist viel Kindliches gewesen,\nviel Neugierde und Spieltrieb, viel Lust zum Zeitvergeuden. Nun, und da\nhabe ich eben etwas lange gebraucht, bis ich einsah, es müsse des\nSpielens einmal genug sein.“","Während er dies sagte, lächelte er ganz durchtrieben, geradezu\nschlingelhaft. Seine Gestalt war größer geworden, die steife Haltung und\ndie krampfhafte Würde im Gesicht war verschwunden. Und die Luft um uns\nher war jetzt ganz voll von lauter Melodien, lauter Goetheliedern, ich\nhörte Mozarts „Veilchen“ und Schuberts „Füllest wieder Busch und Tal“\ndeutlich heraus. Und Goethes Gesicht war jetzt rosig und jung und lachte\nund glich bald dem Mozart, bald dem Schubert wie ein Bruder, und der\nStern auf seiner Brust bestand aus lauter Wiesenblumen, eine gelbe\nPrimel blühte froh und feist aus seiner Mitte hervor.","Es paßte mir nicht ganz, daß der alte Mann sich meinen Fragen und\nAnklagen auf eine so scherzhafte Art entziehen wollte, und ich blickte\nihn vorwurfsvoll an. Da neigte er sich vor und brachte seinen Mund, den\nschon ganz kindlich gewordenen Mund, dicht an mein Ohr und flüsterte\nleise in mein Ohr hinein: „Mein Junge, du nimmst den alten Goethe viel\nzu ernst. Alte Leute, die schon gestorben sind, muß man nicht ernst\nnehmen, man tut ihnen sonst unrecht. Wir Unsterblichen lieben das\nErnstnehmen nicht, wir lieben den Spaß. Der Ernst, mein Junge, ist eine\nAngelegenheit der Zeit; er entsteht, soviel will ich dir verraten, aus\neiner Überschätzung der Zeit. Auch ich habe den Wert der Zeit einst\nüberschätzt, darum wollte ich hundert Jahre alt werden. In der Ewigkeit\naber, siehst du, gibt es keine Zeit; die Ewigkeit ist bloß ein\nAugenblick, gerade lang genug für einen Spaß.“","In der Tat war kein ernstes Wort mehr mit dem Mann zu reden, er tänzelte\nvergnügt und gelenkig auf und nieder und ließ die Primel aus seinem\nStern bald wie eine Rakete herausschießen, bald klein werden und\nverschwinden. Während er mit seinen Tanzschritten und Figuren glänzte,\nmußte ich denken, daß dieser Mann es wenigstens nicht versäumt habe,\ntanzen zu lernen. Er konnte es wundervoll. Da fiel der Skorpion mir\nwieder ein, oder vielmehr Molly, und ich rief Goethe zu: „Sagen Sie, ist\nMolly nicht da?“","Goethe lachte laut. Er ging zu seinem Tisch, schloß ein Schubfach auf,\nnahm eine kostbare lederne oder samtene Dose heraus, öffnete sie und\nhielt sie mir unter die Augen. Da lag klein, tadellos und schimmernd ein\nwinziges Frauenbein auf dem dunklen Samt, ein entzückendes Bein, im Knie\nein wenig gebogen, der Fuß nach unten gestreckt, in die zierlichsten\nZehen spitz auslaufend.","Ich streckte die Hand aus und wollte das kleine Bein an mich nehmen, das\nmich ganz verliebt machte, aber sowie ich mit zwei Fingern zugreifen\nwollte, schien das Spielzeug sich mit einem winzigen Zuck zu bewegen,\nund es kam mir plötzlich der Verdacht, dies könne der Skorpion sein.\nGoethe schien das zu begreifen, schien sogar gerade dies gewollt und\nbezweckt zu haben, diese tiefe Verlegenheit, diesen zuckenden Zwiespalt\nvon Begehren und Angst. Er hielt mir das reizende Skorpiönchen ganz nahe\nvors Gesicht, sah mich danach verlangen, sah mich davor zurückschaudern,\nund dies schien ihm ein großes Vergnügen zu machen. Während er mich mit\ndem holden gefährlichen Ding neckte, war er wieder ganz alt geworden,\nuralt, tausend Jahre alt, mit schneeweißem Haar, und sein welkes\nGreisengesicht lachte still und lautlos, lachte heftig in sich hinein\nmit einem abgründigen Greisenhumor.","* * * * *","Als ich erwachte, hatte ich den Traum vergessen, erst später fiel er mir\nwieder ein. Ich hatte wohl gegen eine Stunde geschlafen, mitten in Musik\nund Getriebe, am Wirtstisch, nie hätte ich das für möglich gehalten. Das\nliebe Mädchen stand vor mir, eine Hand auf meiner Schulter.","„Gib mir zwei oder drei Mark,“ sagte sie, „ich habe drüben etwas\nverzehrt.“","Ich gab ihr meinen Geldbeutel, sie ging damit und kam bald wieder.","„So, jetzt kann ich noch ein kleines Weilchen bei dir sitzen, dann muß\nich gehen, ich habe eine Verabredung.“","Ich erschrak. „Mit wem denn?“ fragte ich schnell.","„Mit einem Herrn, kleiner Harry. Er hat mich in die Odeon-Bar\neingeladen.“","„Oh, ich dachte, du würdest mich nicht allein lassen.“","„Dann hättest eben _du_ mich einladen müssen. Es ist dir einer\nzuvorgekommen. Nun, du sparst hübsch Geld dabei. Kennst du das Odeon?\nNach Mitternacht nur Champagner. Klubsessel, Negerkapelle, sehr fein.“","Dies alles hatte ich nicht bedacht.","„Ach,“ sagte ich bittend, „laß dich doch von mir einladen! Ich hielt das\nfür selbstverständlich, wir sind doch Freunde geworden. Laß dich\neinladen, wohin du willst, ich bitte dich.“","„Das ist nett von dir. Aber schau’, ein Wort ist ein Wort, ich habe\nangenommen, und ich werde hingehen. Gib dir keine Mühe mehr! Komm, nimm\nnoch einen Schluck, wir haben ja noch Wein in der Flasche. Den trinkst\ndu aus und gehst dann hübsch nach Hause und schläfst. Versprich mir’s.“","„Nein, du, nach Hause kann ich nicht gehen.“","„Ach du, mit deinen Geschichten! Bist du noch immer nicht mit dem Goethe\nfertig? (In diesem Augenblick fiel mir der Goethetraum wieder ein.) Aber\nwenn du wirklich nicht heimgehen kannst, dann bleib hier im Haus, es\nsind Fremdenzimmer da. Soll ich dir eins besorgen?“","Ich war damit zufrieden und fragte, wo ich sie wiedersehen könne. Wo sie\ndenn wohne? Das sagte sie mir nicht. Ich solle nur ein wenig suchen,\ndann fände ich sie schon.","„Darf ich dich nicht einladen?“","„Wohin?“","„Wohin du magst, und wann du magst.“","„Gut. Am Dienstag zum Abendessen im Alten Franziskaner, im ersten Stock.\nAuf Wiedersehen!“","Sie gab mir die Hand, und erst jetzt fiel diese Hand mir auf, eine Hand,\ndie ganz zu ihrer Stimme paßte, schön und voll, klug und gütig. Sie\nlachte spöttisch, als ich ihr die Hand küßte.","Und im letzten Augenblick wandte sie sich nochmals zu mir um und sagte:\n„Ich will dir noch etwas sagen, wegen des Goethe. Schau’, so, wie es dir\nmit dem Goethe gegangen ist, daß du das Bild von ihm nicht vertragen\nkonntest, so geht es mir manchmal mit den Heiligen.“","„Den Heiligen? Bist du so fromm?“","„Nein, ich bin nicht fromm, leider, aber ich bin es einmal gewesen und\nwerde es einmal wieder sein. Man hat ja keine Zeit zum Frommsein.“","„Keine Zeit? Braucht man denn Zeit dazu?“","„O ja. Zum Frommsein braucht man Zeit, man braucht sogar noch mehr:\nUnabhängigkeit von der Zeit! Du kannst nicht ernstlich fromm sein und\nzugleich in der Wirklichkeit leben und sie auch noch ernst nehmen: die\nZeit, das Geld, die Odeon-Bar und all das.“","„Ich verstehe. Aber wie ist das mit den Heiligen?“","„Ja, da gibt es manche Heilige, die habe ich besonders gern: den Stefan,\nden heiligen Franz und andere. Von ihnen sehe ich nun manchmal Bilder\nund auch vom Heiland und der Muttergottes, solche verlogene,\nverfälschte, verdummte Bilder, und die kann ich gerade so wenig\nausstehen wie du jenes Goethebild. Wenn ich so einen süßen dummen\nHeiland oder heiligen Franz sehe und sehe, wie andere diese Bilder schön\nund erbaulich finden, dann spüre ich es wie eine Beleidigung des\nrichtigen Heilands und denke: ach, wozu hat er gelebt und so furchtbar\ngelitten, wenn den Leuten schon so ein dummes Bild von ihm genügt! Aber\nich weiß trotzdem, daß auch _mein_ Heiland- oder Franzbild bloß ein\nMenschenbild ist und an das Urbild nicht hinreicht, daß dem Heiland\nselbst mein inneres Heilandbild gerade so dumm und unzulänglich\nvorkommen würde wie mir jene süßlichen Nachbilder. Ich sage dir das\nnicht, um dir in deiner Verstimmung und Wut gegen das Goethebild recht\nzu geben, nein, du bist da im Unrecht. Ich sage es bloß, um dir zu\nzeigen, daß ich dich verstehen kann. Ihr Gelehrte und Künstler habt ja\nallerlei aparte Sachen in euren Köpfen, aber ihr seid Menschen wie\nandre, und auch wir andern haben unsre Träume und Spiele im Kopf. Ich\nhabe nämlich gemerkt, gelehrter Herr, daß du ein bißchen in Verlegenheit\nkamst, wie du mir deine Goethegeschichte erzählen solltest – du mußtest\ndich anstrengen, um deine idealen Sachen so einem einfachen Mädchen\nverständlich zu machen. Nun, und da möchte ich dir doch zeigen, daß du\ndich nicht so anzustrengen brauchst. Ich verstehe dich schon. So, und\njetzt Schluß! Du gehörst ins Bett.“","Sie ging, und mich führte ein greiser Hausdiener zwei Treppen hinauf,\nvielmehr, erst fragte er nach meinem Gepäck, und als er hörte, es sei\nkeines da, mußte ich das, was er „Schlafgeld“ nannte, vorausbezahlen.\nDann brachte er mich, durch ein altes finstres Treppenhaus, in eine\nKammer hinauf und ließ mich allein. Da stand ein dürres Holzbett, sehr\nkurz und hart, und an der Wand hing ein Säbel und ein farbiges Bildnis\nvon Garibaldi, auch ein verwelkter Kranz von einer Vereinsfeier. Für ein\nNachthemd hätte ich viel gegeben. Wenigstens war Wasser und ein kleines\nHandtuch da, ich konnte mich waschen, dann legte ich mich in den\nKleidern aufs Bett, ließ das Licht brennen und hatte Zeit zum\nNachdenken. Also mit Goethe war ich jetzt in Ordnung. Herrlich, daß er\nim Traum zu mir gekommen war! Und dieses wunderbare Mädchen – wenn ich\ndoch ihren Namen gewußt hätte! Plötzlich ein Mensch, ein lebendiger\nMensch, der die trübe Glasglocke meiner Abgestorbenheit zerschlug und\nmir die Hand hereinstreckte, eine gute, schöne, warme Hand! Plötzlich\nwieder Dinge, die mich etwas angingen, an die ich mit Freude, mit Sorge,\nmit Spannung denken konnte! Plötzlich eine Türe offen, durch die das\nLeben zu mir hereinkam! Ich konnte vielleicht wieder leben, ich konnte\nvielleicht wieder ein Mensch werden. Meine Seele, in der Kälte\neingeschlafen und nahezu erfroren, atmete wieder, schlug schläfrig mit\nkleinen schwachen Flügeln. Goethe war bei mir gewesen. Ein Mädchen hatte\nmich essen, trinken, schlafen geheißen, hatte mir Freundliches erwiesen,\nhatte mich ausgelacht, hatte mich einen dummen kleinen Jungen genannt.\nUnd sie hatte mir auch, die wunderbare Freundin, von den Heiligen\nerzählt und mir gezeigt, daß ich sogar in meinen wunderlichsten\nVerstiegenheiten gar nicht allein und unverstanden und eine krankhafte\nAusnahme sei, daß ich Geschwister habe, daß man mich verstehe. Ob ich\nsie wiedersehen würde? Ja, gewiß, sie war zuverlässig. „Ein Wort ist ein\nWort.“","Und schon schlief ich wieder, schlief vier, fünf Stunden. Es war zehn\nUhr vorüber, als ich aufwachte, in zerknitterten Kleidern, zerschlagen,\nmüde, die Erinnerung an irgend etwas Gräßliches von gestern im Kopf,\naber lebendig, hoffnungsvoll, voll guter Gedanken. Bei der Heimkehr in\nmeine Wohnung empfand ich nichts mehr von den Schrecken, die diese\nHeimkehr gestern für mich gehabt hatte.","Auf der Treppe, oberhalb der Araukarie, traf ich mit der „Tante“\nzusammen, meiner Vermieterin, die ich selten zu Gesicht bekam, deren\nfreundliches Wesen mir aber sehr gefiel. Die Begegnung war mir nicht\nangenehm, ich war immerhin etwas verwahrlost und übernächtig, nicht\ngekämmt und nicht rasiert. Ich grüßte und wollte vorübergehen.\nSonst respektierte sie mein Verlangen nach Alleinbleiben und\nNichtbeachtetwerden stets, heut aber schien in der Tat zwischen mir und\nder Umwelt ein Schleier zerrissen, eine Schranke gefallen zu sein – sie\nlachte und blieb stehen.","„Sie haben gebummelt, Herr Haller, Sie waren ja heut nacht gar nicht im\nBett. Sie werden schön müde sein!“","„Ja,“ sagte ich und mußte auch lachen, „es ging heut nacht etwas lebhaft\nzu, und weil ich den Stil Ihres Hauses nicht stören wollte, schlief ich\nin einem Hotel. Mein Respekt vor der Ruhe und Achtbarkeit Ihres Hauses\nist groß, manchmal komme ich mir darin sehr wie ein Fremdkörper vor.“","„Spotten Sie nicht, Herr Haller!“","„Oh, ich spotte bloß über mich selber.“","„Eben das sollten Sie nicht tun. Sie sollen sich in meinem Haus nicht\nals ‚Fremdkörper‘ fühlen. Sie sollen leben, wie es Ihnen gefällt, und\ntreiben, was Sie mögen. Ich habe schon manche sehr, sehr achtbare Mieter\ngehabt, Juwelen an Achtbarkeit, aber keiner war ruhiger und hat uns\nweniger gestört als Sie. Und jetzt – wollen Sie einen Tee haben?“","Ich widerstand nicht. In ihrem Salon mit den schönen Großväterbildern\nund Großvätermöbeln bekam ich Tee vorgesetzt, und wir schwatzten ein\nwenig, die freundliche Frau erfuhr, ohne eigentlich zu fragen, dies und\njenes aus meinem Leben und meinen Gedanken und hörte zu mit der Mischung\nvon Achtung und mütterlichem Nicht-ganz-ernst-nehmen, welche kluge\nFrauen für die Verschrobenheiten der Männer haben. Es war auch von ihrem\nNeffen die Rede, und sie zeigte mir in einem Nebenzimmer dessen neueste\nFeierabendarbeit, einen Radioapparat. Da saß der fleißige junge Mensch\nan seinen Abenden und stocherte eine solche Maschine zusammen,\nhingerissen von der Idee der Drahtlosigkeit, anbetend auf frommen Knien\nvor dem Gott der Technik, welcher es fertiggebracht hat, nach\nJahrtausenden Dinge zu entdecken und höchst unvollkommen darzustellen,\nwelche jeder Denker schon immer gewußt und klüger benutzt hat. Wir\nsprachen darüber, denn die Tante neigt ein klein wenig zur Frömmigkeit,\nund religiöse Gespräche sind ihr nicht unlieb. Ich sagte ihr, die\nAllgegenwart aller Kräfte und Taten sei den alten Indern sehr wohl\nbekannt gewesen und die Technik habe lediglich ein kleines Stück dieser\nTatsache dadurch ins allgemeine Bewußtsein gebracht, daß sie dafür,\nnämlich für die Tonwellen, einen vorerst noch grauenhaft unvollkommenen\nEmpfänger und Sender konstruiert habe. Die Hauptsache jener alten\nErkenntnis, die Unwirklichkeit der Zeit, sei bisher von der Technik noch\nnicht bemerkt worden, schließlich werde aber natürlich auch sie\n„entdeckt“ werden und den geschäftigen Ingenieuren in die Finger\ngeraten. Man werde, vielleicht schon sehr bald, entdecken, daß nicht nur\ngegenwärtige, augenblickliche Bilder und Geschehnisse uns beständig\numfluten, so, wie die Musik aus Paris und Berlin jetzt in Frankfurt oder\nZürich hörbar gemacht wird, sondern daß alles je Geschehene ganz ebenso\nregistriert und vorhanden sei und daß wir wohl eines Tages, mit oder\nohne Draht, mit oder ohne störende Nebengeräusche, den König Salomo und\nden Walther von der Vogelweide werden sprechen hören. Und daß dies\nalles, ebenso wie heute die Anfänge des Radios, den Menschen nur dazu\ndienen werde, von sich und ihrem Ziele weg zu fliehen und sich mit einem\nimmer dichteren Netz von Zerstreuung und nutzlosem Beschäftigtsein zu\numgeben. Aber ich sagte alle diese mir geläufigen Dinge nicht mit dem\ngewohnten Ton von Erbitterung und Hohn gegen die Zeit und gegen die\nTechnik, sondern scherzhaft und spielend, und die Tante lächelte, und\nwir saßen wohl eine Stunde beisammen, tranken Tee und waren zufrieden.","Auf Dienstag abend hatte ich das schöne, merkwürdige Mädchen aus dem\nSchwarzen Adler eingeladen, und die Zeit bis dahin herumzubringen,\nmachte mir nicht wenig Mühe. Und als endlich der Dienstag gekommen war,\nwar mir die Wichtigkeit meiner Beziehung zu dem unbekannten Mädchen bis\nzum Erschrecken klar geworden. Ich dachte nur an sie, ich erwartete\nalles von ihr, ich war bereit, ihr alles zu opfern und zu Füßen zu\nlegen, ohne doch im mindesten in sie verliebt zu sein. Ich brauchte mir\nnur vorzustellen, sie würde unsere Verabredung brechen oder vergessen\nkönnen, dann sah ich deutlich, wie es mit mir stand; dann wäre die Welt\nwieder leer, wäre ein Tag so grau und wertlos wie der andre, wäre um\nmich her wieder die ganze grauenvolle Stille und Erstorbenheit gewesen\nund kein Ausgang aus dieser schweigsamen Hölle als das Rasiermesser. Und\ndas Rasiermesser war mir in diesen paar Tagen um nichts lieber geworden,\nes hatte nichts von seinen Schrecken verloren. Dies eben war ja das\nHäßliche: ich hatte eine tiefe, herzerdrückende Angst vor dem Schnitt\ndurch meine Kehle, ich fürchtete mich vor dem Sterben mit ebenso wilder,\nzäher, sich wehrender und bäumender Kraft, als wenn ich der gesundeste\nMensch und mein Leben ein Paradies gewesen wäre. Ich erkannte meinen\nZustand mit voller, rücksichtsloser Deutlichkeit und erkannte, daß die\nunerträgliche Spannung zwischen Nichtlebenkönnen und Nichtsterbenkönnen\nes war, die mir die Unbekannte, die kleine hübsche Tänzerin aus dem\nSchwarzen Adler, so wichtig machte. Sie war das kleine Fensterchen, das\nwinzige lichte Loch in meiner finstern Angsthöhle. Sie war die Erlösung,\nder Weg ins Freie. Sie mußte mich leben lehren oder sterben lehren, sie\nmit ihrer festen und hübschen Hand mußte mein erstarrtes Herz antasten,\ndamit es unter der Berührung des Lebens entweder aufblühe oder in Asche\nzerfalle. Woher sie diese Kräfte nahm, woher die Magie ihr kam, aus\nwelchen geheimnisvollen Gründen ihr diese tiefe Bedeutung für mich\nerwachsen war, darüber konnte ich nicht nachdenken, es war auch\neinerlei; mir lag nichts daran, dies zu wissen. An keinem Wissen, an\nkeiner Einsicht war mir mehr das mindeste gelegen, eben damit war ich ja\nüberfüttert, eben darin lag die schärfste und höhnendste Qual und\nSchmach für mich, daß ich meinen eigenen Zustand so deutlich sah, seiner\nso sehr bewußt war. Ich sah diesen Kerl, dieses Vieh von Steppenwolf vor\nmir wie eine Fliege im Netz und sah zu, wie sein Schicksal der\nEntscheidung zutrieb, wie er verstrickt und wehrlos im Netze hing, wie\ndie Spinne zum Zubeißen bereit war, wie eine rettende Hand ebenso nahe\nschien. Ich hätte über die Zusammenhänge und Ursachen meines Leidens,\nmeiner Seelenkrankheit, meiner Verhextheit und Neurose die klügsten und\neinsichtsvollsten Sachen sagen können, die Mechanik war mir\ndurchsichtig. Aber nicht Wissen und Verstehen war es, was mir not tat,\nwonach ich mich so verzweifelt sehnte, sondern Erleben, Entscheidung,\nStoß und Sprung.","Obwohl ich in jenen paar Tagen des Wartens niemals daran zweifelte, daß\nmeine Freundin ihr Wort halten werde, war ich am letzten Tage doch sehr\nerregt und ungewiß; nie im Leben habe ich ungeduldiger auf den Abend\neines Tages gewartet. Und während die Spannung und Ungeduld mir beinahe\nunerträglich wurde, tat sie zugleich doch wunderbar wohl: unausdenklich\nschön und neu war es für mich, den Ernüchterten, der seit langer Zeit\nauf nichts gewartet, sich auf nichts gefreut hatte – wunderbar war es,\ndiesen ganzen Tag voll Unruhe, Bangigkeit und heftiger Erwartung hin und\nher zu rennen, sich die Begegnung, die Gespräche, die Ergebnisse des\nAbends im voraus auszudenken, sich dafür zu rasieren und anzukleiden\n(mit besonderer Sorgfalt, neuem Hemd, neuer Krawatte, neuen\nSchuhnesteln). Mochte dies kluge und geheimnisvolle kleine Mädchen sein,\nwer sie wollte, mochte sie auf diese oder auf jene Weise in diese\nBeziehung zu mir geraten sein, mir war es einerlei; sie war da, das\nWunder war geschehen, daß ich nochmals einen Menschen und ein neues\nInteresse am Leben gefunden hatte! Wichtig war nur, daß dies weiterging,\ndaß ich mich dieser Anziehung überließ, diesem Stern folgte.","Unvergeßlicher Augenblick, als ich sie wiedersah! Ich saß an einem\nkleinen Tisch des alten behaglichen Restaurants, den ich unnötigerweise\nvorher telephonisch bestellt hatte, studierte die Speisekarte und hatte\nim Wasserglase zwei schöne Orchideen stehen, die ich für meine Freundin\ngekauft hatte. Ich mußte eine ganze Weile auf sie warten, fühlte mich\naber ihres Kommens sicher und war nicht mehr erregt. Und nun kam sie,\nblieb vor der Garderobe stehen und grüßte mich nur durch einen\naufmerksamen, etwas prüfenden Blick aus ihren hellgrauen Augen.\nMißtrauisch kontrollierte ich, wie sich der Kellner gegen sie benehme.\nNein, Gott sei Dank, keine Vertraulichkeit, kein Mangel an Distanz, er\nwar tadellos höflich. Und doch kannten sie sich, sie nannte ihn Emil.","Als ich ihr die Orchideen gab, war sie erfreut und lachte. „Das ist\nhübsch von dir, Harry. Du wolltest mir ein Geschenk machen, nicht wahr,\nund wußtest nicht recht, was wählen, du wußtest nicht so ganz, wieweit\ndu eigentlich berechtigt seiest, mich zu beschenken, ob ich nicht\nbeleidigt sein werde, und da hast du denn Orchideen gekauft, das sind\nbloß Blumen und sind doch hübsch teuer. Also danke schön. Übrigens will\nich dir gleich sagen: ich will nicht von dir beschenkt werden. Ich lebe\nvon den Männern, aber von dir will ich nicht leben. Aber wie du dich\nverändert hast! Man kennt dich nicht wieder. Neulich hast du ausgesehen,\nals hätte man dich grade vom Strick abgeschnitten, und jetzt bist du\nschon beinah wieder ein Mensch. Hast du übrigens meinen Befehl\nausgeführt?“","„Welchen Befehl?“","„So vergeßlich? Ich meine, ob du jetzt Foxtrott tanzen kannst? Du hast\nmir gesagt, daß du dir nichts Besseres wünschest, als Befehle von mir zu\nerhalten, dir sei nichts lieber, als mir zu gehorchen. Erinnerst du\ndich?“","„O ja, und dabei soll es bleiben! Es war mir Ernst.“","„Und doch hast du noch nicht tanzen gelernt?“","„Kann man denn das so schnell, bloß in ein paar Tagen?“","„Natürlich. Fox kannst du in einer Stunde lernen, Boston in zwei. Tango\ngeht länger, aber den brauchst du gar nicht.“","„Aber jetzt muß ich endlich deinen Namen wissen!“","Sie blickte mich eine Weile schweigend an.","„Du kannst ihn vielleicht erraten. Es wäre mir sehr lieb, wenn du ihn\nerraten würdest. Paß einmal auf und sieh mich gut an! Ist dir noch nicht\naufgefallen, daß ich manchmal ein Knabengesicht habe? Zum Beispiel\njetzt?“","Ja, indem ich jetzt ihr Gesicht genau betrachtete, mußte ich ihr recht\ngeben, es war ein Knabengesicht. Und als ich mir eine Minute Zeit ließ,\nbegann das Gesicht zu mir zu sprechen und erinnerte mich an meine eigene\nKnabenzeit und an meinen damaligen Freund, der hatte Hermann geheißen.\nEinen Augenblick schien sie ganz in diesen Hermann verwandelt.","„Wenn du ein Knabe wärst,“ sagte ich staunend, „müßtest du Hermann\nheißen.“","„Wer weiß, vielleicht bin ich einer und bin bloß verkleidet“, sagte sie\nspielerisch.","„Heißt du Hermine?“","Sie nickte strahlend, froh über mein Erraten. Eben kam die Suppe, wir\nbegannen zu essen, und sie wurde kindlich vergnügt. Von allem, was mir\nan ihr gefiel und mich bezauberte, war dies das hübscheste und\neigenartigste, daß sie ganz plötzlich vom tiefsten Ernst zur drolligsten\nLustigkeit übergehen konnte und umgekehrt und sich dabei gar nicht\nänderte und verzerrte, es war wie bei einem begabten Kinde. Jetzt war\nsie eine Weile lustig, neckte mich mit dem Foxtrott, stieß mich sogar\nmit den Füßen an, lobte das Essen mit Eifer, bemerkte, daß ich mir mit\ndem Anziehen Mühe gegeben habe, hatte aber noch eine Menge an meinem\nÄußeren auszusetzen.","Zwischenein fragte ich sie: „Wie hast du das gemacht, daß du plötzlich\nwie ein Knabe aussahest und daß ich deinen Namen erraten konnte?“","„Oh, das hast alles du selber gemacht. Begreifst du das nicht, du\ngelehrter Herr: daß ich dir darum gefalle und für dich wichtig bin, weil\nich wie eine Art Spiegel für dich bin, weil in mir innen etwas ist, was\ndir Antwort gibt und dich versteht? Eigentlich sollten alle Menschen\nfüreinander solche Spiegel sein und einander so antworten und\nentsprechen, aber solche Käuze wie du sind eben wunderlich und verlaufen\nsich leicht in eine Verzauberung, daß sie in den Augen andrer Menschen\nnichts mehr sehen und lesen können, daß es sie nichts mehr angeht. Und\nwenn dann so ein Kauz plötzlich doch wieder ein Gesicht findet, das ihn\nwirklich anschaut, in dem er etwas wie Antwort und Verwandtschaft spürt,\nja, dann hat er natürlich eine Freude.“","„Du weißt alles, Hermine“, rief ich erstaunt. „Es ist genau so, wie du\nsagst. Und doch bist du so ganz und gar anders als ich! Du bist ja mein\nGegenteil; du hast alles, was mir fehlt.“","„So kommt es dir vor,“ sagte sie lakonisch, „und das ist gut.“","Und jetzt floß über ihr Gesicht, das mir in der Tat wie ein\nZauberspiegel war, eine schwere Wolke von Ernst, plötzlich sprach dies\nganze Gesicht nur noch Ernst, nur noch Tragik, bodenlos wie aus den\nleeren Augen einer Maske. Langsam, Wort für Wort wie widerwillig\nhergebend, sagte sie:","„Du, vergiß nicht, was du zu mir gesagt hast! Du hast gesagt, ich solle\ndir befehlen, und es würde dir eine Freude sein, allen meinen Befehlen\nzu gehorchen. Vergiß das nicht! Du mußt wissen, kleiner Harry: so, wie\nes dir mit mir geht, daß mein Gesicht dir Antwort gibt, daß etwas in mir\ndir entgegenkommt und dir Vertrauen macht – ebenso geht es mir auch mit\ndir. Als ich dich neulich im Schwarzen Adler hereinkommen sah, so müd\nund abwesend und schon beinah nicht mehr auf dieser Welt, da spürte ich\ngleich: der wird mir gehorchen, der sehnt sich danach, daß ich ihm\nbefehle! Und das werde ich auch tun, darum habe ich dich angesprochen,\nund darum sind wir Freunde geworden.“","Sie sprach so voll schweren Ernstes, so unter hohem Druck der Seele, daß\nich nicht ganz mitkam und sie zu beruhigen und abzulenken suchte. Sie\nschüttelte das nur mit einem Zucken der Augenbrauen von sich, sah mich\nzwingend an und fuhr fort, mit ganz kalter Stimme: „Du mußt dein Wort\nhalten, Kleiner, das sage ich dir, oder du sollst es bereuen. Du wirst\nviele Befehle von mir erhalten und wirst ihnen folgen, hübsche Befehle,\nangenehme Befehle, es wird dir eine Lust sein, ihnen zu gehorchen. Und\nzuletzt wirst du auch meinen letzten Befehl erfüllen, Harry.“","„Ich werde“, sagte ich halb willenlos. „Was wird dein letzter Befehl für\nmich sein?“ Ich ahnte ihn aber schon, Gott weiß warum.","Sie schüttelte sich wie unter einem leichten Frostschauer und schien aus\nihrer Versunkenheit langsam zu erwachen. Ihre Augen ließen mich nicht\nlos. Sie wurde plötzlich noch finsterer.","„Es wäre klug von mir, dir das nicht zu sagen. Ich will aber nicht klug\nsein, Harry, diesmal nicht. Ich will etwas ganz anderes. Paß auf, hör’\nzu! Du wirst es hören, wirst es wieder vergessen, wirst darüber lachen,\nwirst darüber weinen. Paß auf, Kleiner! Ich will mit dir um Leben und\nTod spielen, Brüderchen, und ich will dir meine Karten, noch eh wir\nanfangen zu spielen, offen zeigen.“","Wie schön war ihr Gesicht, wie überirdisch, als sie das sagte! In den\nAugen kühl und hell schwamm wissende Trauer, diese Augen schienen schon\nalles irgend erdenkliche Leid gelitten und ja dazu gesagt zu haben. Der\nMund sprach schwer und wie behindert, etwa so, wie man spricht, wenn\neinem großer Frost das Gesicht erstarrt hat; aber zwischen den Lippen,\nin den Mundwinkeln, im Spiel der nur selten sichtbar werdenden\nZungenspitze floß, im Widerspruch zu Blick und Stimme, lauter süße\nspielende Sinnlichkeit, inniges Lustverlangen. In die stille glatte\nStirn hing eine kurze Locke herab, von dort aus, von dieser Stirnecke\nmit der Locke her, strömte von Zeit zu Zeit wie lebendiger Atem jene\nWelle von Knabenähnlichkeit, von hermaphrodisischer Magie. Angstvoll\nhörte ich ihr zu, und doch wie betäubt, wie nur halb anwesend.","„Du hast mich gern“, fuhr sie fort, „aus dem Grunde, den ich dir schon\ngesagt habe: ich habe deine Einsamkeit durchbrochen, ich habe dich\ngerade vor dem Tor der Hölle aufgefangen und wieder aufgeweckt. Aber ich\nwill mehr von dir, viel mehr. Ich will dich in mich verliebt machen.\nNein, widersprich mir nicht, laß mich reden! Du hast mich sehr gern, das\nspüre ich, und du bist mir dankbar, aber in mich verliebt bist du nicht.\nIch will machen, daß du es wirst, das gehört zu meinem Beruf; ich lebe\nja davon, daß ich Männer in mich verliebt machen kann. Aber paß gut auf,\nich tue das nicht darum, weil ich gerade dich so entzückend fände. Ich\nbin nicht in dich verliebt, Harry, so wenig, wie du in mich. Aber ich\nbrauche dich, wie du mich brauchst. Du brauchst mich jetzt, im\nAugenblick, weil du verzweifelt bist und einen Stoß nötig hast, der dich\nins Wasser wirft und dich wieder lebendig macht. Du brauchst mich, um\ntanzen zu lernen, lachen zu lernen, leben zu lernen. Ich aber brauche\ndich, nicht heute, später, auch zu etwas sehr Wichtigem und Schönem. Ich\nwerde dir, wenn du in mich verliebt sein wirst, meinen letzten Befehl\ngeben, und du wirst gehorchen, und das wird für dich und mich gut sein.“","Sie hob eine von den braunvioletten, grüngeäderten Orchideen ein wenig\nim Glase, beugte ihr Gesicht einen Augenblick darüber und starrte die\nBlume an.","„Du wirst es nicht leicht haben, aber du wirst es tun. Du wirst meinen\nBefehl erfüllen _und wirst mich töten_. Das ist es. Frage nicht mehr!“","Mit dem Blick noch bei der Orchidee, verstummte sie, ihr Gesicht\nentspannte sich, wie eine aufgehende Blumenknospe entrollte es sich aus\nDruck und Spannung, und plötzlich stand ein entzückendes Lächeln auf\nihren Lippen, während die Augen noch einen Augenblick starr und gebannt\nblieben. Und jetzt schüttelte sie den Kopf mit der kleinen Bubenlocke,\ntrank einen Schluck Wasser, sah plötzlich wieder, daß wir am Essen waren\nund fiel mit freudigem Appetit über die Speisen her.","Ich hatte Wort für Wort ihrer unheimlichen Rede deutlich gehört, hatte\nsogar ihren „letzten Befehl“ erraten, noch ehe sie ihn aussprach, und\nwar über das „Du wirst mich töten“ nicht mehr erschrocken. Alles, was\nsie sagte, klang mir überzeugend und schicksalhaft, ich nahm es an und\nwehrte mich nicht dagegen, und doch war alles, trotz dem grauenhaften\nErnst, mit dem sie gesprochen hatte, für mich ohne volle Wirklichkeit\nund Ernsthaftigkeit. Ein Teil meiner Seele sog ihre Worte auf und\nglaubte ihnen, ein andrer Teil meiner Seele nickte begütigend und nahm\nzur Kenntnis, daß also doch auch diese so kluge, gesunde und sichere\nHermine ihre Phantasien und Dämmerzustände habe. Kaum war ihr letztes\nWort gesprochen, so überzog eine Schicht von Unwirklichkeit und\nUnwirksamkeit die ganze Szene.","Immerhin konnte ich nicht mit derselben seiltänzerischen Leichtigkeit\nwie Hermine den Sprung ins Wahrscheinliche und Wirkliche zurück tun.","„Also ich werde dich einmal töten?“ fragte ich, leise nachträumend,\nwährend sie schon wieder lachte und voll Eifer ihr Geflügel zerschnitt.","„Natürlich,“ nickte sie obenhin, „genug davon, es ist Essenszeit. Harry,\nsei nett und bestelle mir noch ein wenig grünen Salat! Hast du denn\nkeinen Appetit? Ich glaube, du mußt alles erst lernen, was sich bei\nandern Menschen von selber versteht, sogar die Freude am Essen. Also\nsieh, Kleiner, dies hier ist ein Entenbeinchen, und wenn man das helle\nhübsche Fleisch vom Knochen löst, dann ist das ein Fest, und es muß\neinem dabei gerade so appetitlich und spannend und dankbar ums Herz\nsein, wie einem Verliebten, wenn er seinem Mädchen zum erstenmal aus der\nJacke hilft. Hast du verstanden? Nicht? Du bist ein Schaf. Paß auf, ich\ngebe dir ein Stück von diesem schönen Entenbeinchen, du wirst sehen. So,\nmach’ den Mund auf! – Oh, was für ein Scheusal du bist! Jetzt hat er,\nweiß Gott, zu den andern Leuten hinübergeschielt, ob sie es nicht sehen,\nwenn er einen Bissen von meiner Gabel kriegt! Sei ohne Sorge, du\nverlorener Sohn, ich werde dir keine Schande machen. Aber wenn du zu\ndeinem Vergnügen erst die Erlaubnis anderer Leute brauchst, dann bist du\nwirklich ein armer Tropf.“","Immer unwirklicher wurde die vorige Szene, immer unglaublicher, daß\ndiese Augen noch vor Minuten so schwer und grauenvoll gestarrt hatten.\nOh, darin war Hermine wie das Leben selbst: stets nur Augenblick, nie im\nvoraus zu berechnen. Jetzt aß sie, und das Entenbein und der Salat, die\nTorte und der Likör wurde ernst genommen, wurde zum Gegenstand von\nFreude und Urteil, von Gespräch und Phantasie. War der Teller\nweggetragen, so begann ein neues Kapitel. Diese Frau, die mich so\nvollkommen durchschaut hatte, die mehr über das Leben zu wissen schien\nals alle Weisen, betrieb das Kindsein, das kleine Lebensspiel des\nAugenblicks mit einer Kunst, die mich ohne weiteres zu ihrem Schüler\nmachte. Mochte das nun hohe Weisheit sein oder einfachste Naivität: wer\nso dem Augenblick zu leben verstand, wer so gegenwärtig lebte und so\nfreundlich-sorgsam jede kleine Blume am Weg, jeden kleinen spielerischen\nAugenblickswert zu schätzen wußte, dem konnte das Leben nichts anhaben.\nUnd dieses frohe Kind mit seinem guten Appetit, mit seiner spielerischen\nFeinschmeckerei sollte zugleich eine Träumerin und Hysterikerin sein,\ndie sich den Tod wünschte, oder eine wachsame Rechnerin, die mich bewußt\nund kühlen Herzens verliebt und zu ihrem Sklaven machen wollte? Das\nkonnte nicht sein. Nein, sie war einfach so ganz dem Augenblick ergeben,\ndaß sie, ebenso wie jedem lustigen Einfall, auch jedem flüchtigen\ndunklen Schauer aus fernen Seelentiefen her offenstand und ihn sich\nausleben ließ.","Diese Hermine, die ich heut zum zweiten Male sah, wußte alles von mir,\nes schien mir nicht möglich, je vor ihr ein Geheimnis zu haben. Es\nmochte sein, daß sie mein geistiges Leben vielleicht nicht ganz\nverstanden hätte; in meine Beziehungen zur Musik, zu Goethe, zu Novalis\noder Baudelaire vermöchte sie mir möglicherweise nicht zu folgen – aber\nauch dies war sehr fraglich, wahrscheinlich würde auch dies ihr keine\nMühe machen. Und wenn auch – was war denn von meinem „geistigen Leben“\nnoch übrig? Lag das nicht alles in Scherben und hatte seinen Sinn\nverloren? Aber meine anderen, meine persönlichsten Probleme und\nAnliegen, die würde sie alle verstehen, daran zweifelte ich nicht. Bald\nwürde ich mit ihr über den Steppenwolf, über den Traktat, über alles und\nalles reden, was bisher nur für mich allein existiert, worüber ich nie\nmit einem Menschen ein Wort gesprochen hatte. Ich konnte nicht\nwiderstehen, gleich zu beginnen.","„Hermine,“ sagte ich, „mir ist neulich etwas Wunderliches begegnet. Da\ngab ein Unbekannter mir ein kleines gedrucktes Büchlein, ein Ding wie\nein Jahrmarktsheft, und darin stand meine ganze Geschichte und alles,\nwas mich angeht, genau beschrieben. Sag’, ist das nicht merkwürdig?“","„Wie heißt denn das Büchlein?“ fragte sie leichthin.","„Es heißt ‚Traktat vom Steppenwolf‘.“","„Oh, Steppenwolf ist großartig! Und der Steppenwolf bist du? Das sollst\ndu sein?“","„Ja, ich bin es. Ich bin einer, der halb ein Mensch ist und halb ein\nWolf, oder der sich das einbildet.“","Sie gab keine Antwort. Sie sah mir mit forschender Aufmerksamkeit in die\nAugen, sah auf meine Hände, und für einen Moment kam in ihren Blick und\nihr Gesicht wieder der tiefe Ernst und die düstere Leidenschaftlichkeit\nvon vorhin. Ich glaubte, ihre Gedanken zu erraten, ob ich nämlich Wolf\ngenug sei, um ihren „letzten Befehl“ vollziehen zu können.","„Es ist natürlich eine Einbildung von dir“, sagte sie, sich zurück ins\nHeitere wandelnd, „oder, wenn du willst, eine Poesie. Aber es hat etwas.\nHeute bist du kein Wolf, aber neulich, wie du da in den Saal\nhereinkamst, wie vom Mond gefallen, da warst du schon so ein Stück\nBestie, gerade das hat mir gefallen.“","Sie unterbrach sich mit einem plötzlichen Einfall und sagte wie\nbetroffen: „Das klingt so dumm, so ein Wort wie ‚Bestie‘ oder\n‚Raubtier‘! Man sollte nicht so von den Tieren reden. Sie sind ja oft\nschrecklich, aber sie sind doch viel richtiger als die Menschen.“","„Was ist ‚richtig‘? Wie meinst du das?“","„Nun, sieh dir doch ein Tier an, eine Katze, einen Hund, einen Vogel\noder gar eins von den schönen großen Tieren im Zoologischen, einen Puma\noder eine Giraffe! Du mußt doch sehen, daß sie alle richtig sind, daß\ngar kein einziges Tier in Verlegenheit ist oder nicht weiß, was es tun\nund wie es sich benehmen soll. Sie wollen dir nicht schmeicheln, sie\nwollen dir nicht imponieren. Kein Theater. Sie sind, wie sie sind, wie\nSteine und Blumen oder wie Sterne am Himmel. Verstehst du?“","Ich verstand.","„Meistens sind Tiere traurig“, fuhr sie fort. „Und wenn ein Mensch sehr\ntraurig ist, nicht weil er Zahnweh hat oder Geld verloren, sondern weil\ner einmal für eine Stunde spürt, wie alles ist, das ganze Leben, und er\nist dann richtig traurig, dann sieht er immer ein wenig einem Tier\nähnlich – er sieht dann traurig aus, aber richtiger und schöner als\nsonst. So ist es, und so hast du ausgesehen, Steppenwolf, als ich dich\nzuerst gesehen habe.“","„Nun, Hermine, und was denkst du über jenes Buch, in dem ich beschrieben\nstehe?“","„Ach weißt du, ich mag nicht immer denken. Wir sprechen ein andermal\ndavon. Du kannst es mir ja einmal zu lesen geben. Oder nein, wenn ich\neinmal wieder zum Lesen kommen sollte, dann gib mir eins von den\nBüchern, die du selber geschrieben hast.“","Sie bat um Kaffee und schien eine Weile unaufmerksam und zerstreut, dann\nplötzlich strahlte sie und schien mit ihren Grübeleien zu einem Ziel\ngelangt zu sein.","„Hallo,“ rief sie freudig, „jetzt hab’ ich’s!“","„Was denn?“","„Das mit dem Foxtrott, ich mußte die ganze Zeit daran denken. Also sag’:\nhast du ein Zimmer, in dem wir zwei hie und da eine Stunde tanzen\nkönnten? Es kann klein sein, das macht nichts, bloß darf nicht gerade\nirgendeiner unter dir wohnen, der dann heraufkommt und Skandal macht,\nwenn es über ihm ein wenig wackelt. Also gut, sehr gut! Dann kannst du\nzu Hause tanzen lernen.“","„Ja,“ sagte ich schüchtern, „desto besser. Aber ich dachte, man brauche\nauch Musik dazu.“","„Natürlich braucht man. Also paß auf, die Musik wirst du dir kaufen, das\nkostet höchstens soviel wie ein Tanzkurs bei einer Lehrerin. Die\nLehrerin sparst du, die mache ich selber. Dann haben wir Musik, sooft\nwir wollen, und das Grammophon bleibt uns obendrein.“","„Das Grammophon?“","„Selbstverständlich. Du kaufst so einen kleinen Apparat und ein paar\nTanzplatten dazu ...“","„Herrlich,“ rief ich, „und wenn es dir wirklich gelingt, mir das Tanzen\nbeizubringen, dann bekommst du das Grammophon als Honorar.\nEinverstanden?“","Ich sagte das sehr forsch, aber es kam nicht von Herzen. In meinem\nStudierstübchen mit den Büchern konnte ich mir einen solchen, mir\nkeineswegs sympathischen Apparat nicht vorstellen, und auch gegen das\nTanzen hatte ich vieles einzuwenden. So gelegentlich, hatte ich gedacht,\nkonnte man es ja einmal probieren, obwohl ich überzeugt war, ich sei\nviel zu alt und steif und würde es nicht mehr lernen. Aber nun so Schlag\nauf Schlag, das war mir zu rasch und heftig, und ich spürte alles in mir\nWiderstand leisten, was ich als alter verwöhnter Musikkenner gegen\nGrammophone, Jazz und moderne Tanzmusiken einzuwenden hatte. Daß jetzt\nin meiner Stube, neben Novalis und Jean Paul, in meiner Gedankenklause\nund Zuflucht amerikanische Tanzschlager erklingen und ich dazu tanzen\nsollte, das war eigentlich mehr, als ein Mensch von mir verlangen\nkonnte. Aber es war ja nicht „ein Mensch“, der es verlangte; es war\nHermine, und sie hatte zu befehlen. Ich gehorchte. Natürlich gehorchte\nich.","Wir trafen uns am nächsten Nachmittag in einem Café. Hermine saß schon\ndort, als ich kam, trank Tee und zeigte mir lächelnd eine Zeitung, in\nder sie meinen Namen entdeckt hatte. Es war eines der reaktionären\nHetzblätter meiner Heimat, in welchen immer von Zeit zu Zeit heftige\nSchmähartikel gegen mich die Runde machten. Ich war während des Krieges\nKriegsgegner gewesen, ich hatte nach dem Kriege gelegentlich zu Ruhe,\nGeduld, Menschlichkeit und Selbstkritik gemahnt und mich gegen die\ntäglich schärfer, törichter und wilder werdende nationalistische\nHetzerei gewehrt. Da stand nun wieder solch ein Angriff, schlecht\ngeschrieben, halb vom Redakteur selbst verfaßt, halb aus den vielen\nähnlichen Aufsätzen der ihm nahestehenden Presse zusammengestohlen.\nNiemand schreibt bekanntlich so schlecht wie die Verteidiger alternder\nIdeologien, niemand treibt sein Handwerk mit weniger Sauberkeit und\nMühewaltung. Den Aufsatz hatte Hermine gelesen und hatte daraus\nerfahren, daß Harry Haller ein Schädling und vaterlandsloser Geselle sei\nund daß es natürlich mit dem Vaterland nicht anders als übel stehen\nkönne, solange solche Menschen und solche Gedanken geduldet würden und\ndie Jugend zu sentimentalen Menschheitsgedanken statt zur kriegerischen\nRache am Erbfeind erzogen werde.","„Bist du das?“ fragte Hermine und zeigte auf meinen Namen. „Nun, da hast\ndu dir ordentlich Feinde gemacht, Harry. Ärgert es dich?“","Ich las einige Zeilen, es war das Gewohnte, jedes einzelne dieser\nklischierten Schmähworte war mir seit Jahren bis zum Überdruß bekannt.","„Nein,“ sagte ich, „es ärgert mich nicht, ich bin längst daran gewöhnt.\nIch habe ein paarmal die Meinung geäußert, jedes Volk und sogar jeder\neinzelne Mensch müsse, statt sich mit verlogenen politischen\n„Schuldfragen“ in Schlummer zu wiegen, bei sich selber nachforschen, wie\nweit es selbst durch Fehler, Versäumnisse und üble Gewohnheiten mit am\nKriege und an allem andern Weltelend schuldig sei, das sei der einzige\nWeg, um den nächsten Krieg vielleicht zu vermeiden. Das verzeihen sie\nmir nicht, denn natürlich sind sie selber vollkommen unschuldig: der\nKaiser, die Generäle, die Großindustriellen, die Politiker, die\nZeitungen – niemand hat sich das geringste vorzuwerfen, niemand hat\nirgendeine Schuld! Man könnte meinen, es stehe alles herrlich in der\nWelt, nur liegen ein Dutzend Millionen totgeschlagener Menschen in der\nErde. Und sieh, Hermine, wenn solche Schmähartikel mich auch nicht mehr\närgern können, manchmal machen sie mich doch traurig. Zwei Drittel von\nmeinen Landsleuten lesen diese Art von Zeitungen, lesen jeden Morgen und\nAbend diese Töne, werden jeden Tag bearbeitet, ermahnt, verhetzt,\nunzufrieden und böse gemacht, und das Ziel und Ende von dem allem ist\nwieder der Krieg, ist der nächste, kommende Krieg, der wohl noch\nscheußlicher sein wird, als dieser es war. Alles das ist klar und\neinfach, jeder Mensch könnte es begreifen, könnte in einer einzigen\nStunde Nachdenkens dasselbe Ergebnis finden. Aber keiner will das,\nkeiner will den nächsten Krieg vermeiden, keiner will sich und seinen\nKindern die nächste Millionenschlächterei ersparen, wenn er es nicht\nbilliger haben kann. Eine Stunde nachdenken, eine Weile in sich gehen\nund sich fragen, wie weit man selber an der Unordnung und Bosheit in der\nWelt teil hat und mitschuldig ist – sieh, das will niemand! Und so wird\nes also weitergehen, und der nächste Krieg wird von vielen tausend\nMenschen Tag für Tag mit Eifer vorbereitet. Es hat mich, seit ich es\nweiß, gelähmt und zur Verzweiflung gebracht, es gibt für mich kein\n„Vaterland“ und keine Ideale mehr, das ist alles ja bloß Dekoration für\ndie Herren, die das nächste Schlachten vorbereiten. Es hat keinen Sinn,\nirgend etwas Menschliches zu denken, zu sagen, zu schreiben, es hat\nkeinen Sinn, gute Gedanken in seinem Kopf zu bewegen – auf zwei, drei\nMenschen, welche das tun, kommen Tag für Tag tausend Zeitungen,\nZeitschriften, Reden, öffentliche und geheime Sitzungen, die alle das\nGegenteil anstreben und auch erreichen.“","Hermine hatte mit Teilnahme zugehört.","„Ja,“ sagte sie nun, „da hast du schon recht. Natürlich wird es wieder\nKrieg geben, man braucht keine Zeitungen zu lesen, um das zu wissen.\nDarüber kann man natürlich traurig sein, einen Wert hat das aber nicht.\nEs ist gerade so, wie wenn einer darüber traurig ist, daß er trotz allem\nund allem, was er dagegen tun mag, unweigerlich einmal wird sterben\nmüssen. Der Kampf gegen den Tod, lieber Harry, ist immer eine schöne,\nedle, wunderbare und ehrwürdige Sache, also auch der Kampf gegen den\nKrieg. Aber er ist auch immer eine hoffnungslose Donquichotterie.“","„Das ist vielleicht wahr,“ rief ich heftig, „aber mit solchen Wahrheiten\nwie der, daß wir doch alle bald sterben müssen und also alles wurst und\negal ist, macht man das ganze Leben flach und dumm. Ja sollen wir denn\nalso alles wegwerfen, auf allen Geist, auf alles Streben, auf alle\nMenschlichkeit verzichten, den Ehrgeiz und das Geld weiter regieren\nlassen und bei einem Glas Bier die nächste Mobilmachung abwarten?“","Merkwürdig war der Blick, mit dem Hermine mich nun ansah, ein Blick voll\nBelustigung, voll Spott und Schelmerei und verständnisvoller\nKameradschaft und zugleich so voll Schwere, Wissen und abgründigem\nErnst!","„Das sollst du nicht“, sagte sie ganz mütterlich. „Dein Leben wird auch\ndadurch nicht flach und dumm, wenn du weißt, daß dein Kampf erfolglos\nsein wird. Es ist viel flacher, Harry, wenn du für etwas Gutes und\nIdeales kämpfst und nun meinst, du müssest es auch erreichen. Sind denn\nIdeale zum Erreichen da? Leben wir denn, wir Menschen, um den Tod\nabzuschaffen? Nein, wir leben, um ihn zu fürchten und dann wieder zu\nlieben, und gerade seinetwegen glüht das bißchen Leben manchmal eine\nStunde lang so schön. Du bist ein Kind, Harry. Sei jetzt folgsam und\nkomm mit mir, wir haben heut viel zu tun. Ich werde mich heut
