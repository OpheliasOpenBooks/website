<aside><h2>Lecture</h2><label for="section">Abschnitte</label><select id="section"></select><div class="progress"><span id="bar"></span></div><p class="status" id="progress"></p><div class="actions"><button id="smaller" aria-label="Réduire le texte">A−</button><button id="larger" aria-label="Agrandir le texte">A+</button><button id="dark">Mode nuit</button></div><div class="actions"><button id="bookmark">♡ Signet</button><button id="return">Revenir au signet</button></div><p class="hint" id="message" role="status"></p><p class="hint">Texte original public domain · <a href="https://www.gutenberg.org/ebooks/75802">Project Gutenberg #75802</a> · Lecture seulement, sans narration.</p></aside></main>
<script type="application/json" id="texte">[{"name":"Der Steppenwolf · vollständiger Text","paragraphs":["Hermann Hesse\nGesammelte Werke","Der Steppenwolf","Von\nHermann Hesse","S. Fischer / Verlag / Berlin","36. bis 40. Auflage 1931\nEinbandentwurf: E. R. Weiß\nAlle Rechte, besonders das der Übersetzung, vorbehalten\nCopyright 1927 by S. Fischer Verlag A.-G., Berlin\nPrinted in Germany","Der Steppenwolf","Vorwort des Herausgebers","Dieses Buch enthält die uns gebliebenen Aufzeichnungen jenes Mannes,\nwelchen wir mit einem Ausdruck, den er selbst mehrmals gebrauchte, den\n„Steppenwolf“ nannten. Ob sein Manuskript eines einführenden Vorwortes\nbedürfe, sei dahingestellt; mir jedenfalls ist es ein Bedürfnis, den\nBlättern des Steppenwolfes einige beizufügen, auf denen ich versuche,\nmeine Erinnerung an ihn aufzuzeichnen. Es ist nur wenig, was ich über\nihn weiß, und namentlich ist seine ganze Vergangenheit und Herkunft mir\nunbekannt geblieben. Doch habe ich von seiner Persönlichkeit einen\nstarken und, wie ich trotz allem sagen muß, sympathischen Eindruck\nbehalten.","Der Steppenwolf war ein Mann von annähernd fünfzig Jahren, der vor\neinigen Jahren eines Tages im Hause meiner Tante vorsprach und nach\neinem möblierten Zimmer suchte. Er mietete die Mansarde oben im\nDachstock und die kleine Schlafkammer daneben, kam nach einigen Tagen\nmit zwei Koffern und einer großen Bücherkiste wieder und hat neun oder\nzehn Monate bei uns gewohnt. Er lebte sehr still und für sich, und wenn\nnicht die nachbarliche Lage unsrer Schlafräume manche zufällige\nBegegnung auf Treppe und Korridor herbeigeführt hätte, wären wir wohl\nüberhaupt nicht miteinander bekannt geworden, denn gesellig war dieser\nMann nicht, er war in einem hohen, von mir bisher bei niemandem\nbeobachteten Grade ungesellig, er war wirklich, wie er sich zuweilen\nnannte, ein Steppenwolf, ein fremdes, wildes und auch scheues, sogar\nsehr scheues Wesen aus einer anderen Welt als der meinigen. In wie tiefe\nVereinsamung er sich auf Grund seiner Anlage und seines Schicksals\nhineingelebt hatte und wie bewußt er diese Vereinsamung als sein\nSchicksal erkannte, dies erfuhr ich allerdings erst aus den von ihm hier\nzurückgelassenen Aufzeichnungen; doch habe ich ihn immerhin schon vorher\ndurch manche kleine Begegnungen und Gespräche einigermaßen kennengelernt\nund fand das Bild, das ich aus seinen Aufzeichnungen von ihm gewann, im\nGrunde übereinstimmend mit dem freilich blasseren und lückenhafteren,\nwie es sich mir aus unsrer persönlichen Bekanntschaft ergeben hatte.","Zufällig war ich in dem Augenblick zugegen, wo der Steppenwolf zum\nerstenmal unser Haus betrat und bei meiner Tante sich einmietete. Er kam\nin der Mittagszeit, die Teller standen noch auf dem Tisch, und ich hatte\nnoch eine halbe Stunde Freizeit, ehe ich in mein Bureau gehen mußte. Ich\nhabe den sonderbaren und sehr zwiespältigen Eindruck nicht vergessen,\nden er mir beim ersten Begegnen machte. Er kam durch die Glastür, wo er\nvorher die Glocke gezogen hatte, herein, und die Tante fragte ihn im\nhalbdunkeln Flur, was er wünsche. Er aber, der Steppenwolf, hatte seinen\nscharfen kurzhaarigen Kopf witternd in die Höhe gereckt, schnupperte mit\nder nervösen Nase um sich her und sagte, noch ehe er Antwort gab oder\nseinen Namen nannte: „Oh, hier riecht es gut.“ Er lächelte dazu, und\nmeine gute Tante lächelte auch, ich aber fand diese Begrüßungsworte eher\nkomisch und hatte etwas gegen ihn.","„Nun ja,“ sagte er, „ich komme wegen des Zimmers, das Sie zu vermieten\nhaben.“","Erst als wir alle drei die Treppe zum Dachboden hinaufstiegen, konnte\nich den Mann genauer ansehen. Er war nicht sehr groß, hatte aber den\nGang und die Kopfhaltung von großgewachsenen Menschen, er trug einen\nmodernen bequemen Wintermantel und war im übrigen anständig, aber\nunsorgfältig gekleidet, glatt rasiert und mit ganz kurzem Kopfhaar, das\nhier und dort ein wenig grau flimmerte. Sein Gang gefiel mir anfangs gar\nnicht, er hatte etwas Mühsames und Unentschlossenes, das nicht zu dem\nscharfen, heftigen Profil und auch nicht zum Ton und Temperament seiner\nRede paßte. Erst später merkte und erfuhr ich, daß er krank war und daß\ndas Gehen ihm Mühe machte. Mit einem eigentümlichen Lächeln, das mir\ndamals ebenfalls unangenehm war, betrachtete er die Treppe, die Wände\nund Fenster und die alten hohen Schränke im Treppenhaus, dies alles\nschien ihm zu gefallen und schien ihm doch zugleich irgendwie\nlächerlich. Überhaupt machte der ganze Mann den Eindruck, als komme er\naus einer fremden Welt, etwa aus überseeischen Ländern, zu uns und finde\nhier alles zwar hübsch, aber ein wenig komisch. Er war, wie ich nicht\nanders sagen kann, höflich, ja freundlich, er war auch mit dem Haus, dem\nZimmer, dem Preis für Miete und Frühstück und allem sofort und ohne\nEinwände einverstanden, und dennoch war um den ganzen Mann herum eine\nfremde und, wie mir scheinen wollte, ungute oder feindliche Atmosphäre.\nEr mietete das Zimmer, mietete noch die Schlafkammer zu, ließ sich über\nHeizung, Wasser, Bedienung und Hausordnung unterrichten, hörte alles\naufmerksam und freundlich an, war mit allem einverstanden, bot auch\nsogleich eine Vorauszahlung auf die Miete an, und doch schien er bei\nalledem nicht recht dabei zu sein, schien sich selber in seinem Tun\nkomisch zu finden und nicht ernst zu nehmen, so, als sei es ihm seltsam\nund neu, ein Zimmer zu mieten und mit Leuten Deutsch zu sprechen,\nwährend er eigentlich und im Innern mit ganz anderen Sachen beschäftigt\nwäre. So etwa war mein Eindruck, und er wäre kein guter gewesen, wenn er\nnicht durch allerlei kleine Züge durchkreuzt und korrigiert worden wäre.\nVor allem war es das Gesicht des Mannes, das mir von Anfang an gefiel;\ntrotz jenem Ausdruck von Fremdheit gefiel es mir, es war ein vielleicht\netwas eigenartiges und auch trauriges Gesicht, aber ein waches, sehr\ngedankenvolles, durchgearbeitetes und vergeistigtes. Und dann kam, um\nmich versöhnlicher zu stimmen, dazu, daß seine Art von Höflichkeit und\nFreundlichkeit, obwohl sie ihm etwas Mühe zu machen schien, doch ganz\nohne Hochmut war – im Gegenteil, es war darin etwas beinah Rührendes,\netwas wie Flehendes, wofür ich erst später die Erklärung fand, das mich\naber sofort ein wenig für ihn einnahm.","Noch ehe die Besichtigung der beiden Räume und die andern Verhandlungen\nbeendet waren, war meine Mittagszeit abgelaufen, und ich mußte in mein\nGeschäft gehen. Ich empfahl mich und überließ ihn der Tante. Als ich am\nAbend wiederkam, erzählte sie mir, der Fremde habe gemietet und werde\ndieser Tage einziehen, er habe nur darum gebeten, seine Ankunft nicht\npolizeilich zu melden, da ihm, einem kränklichen Mann, diese\nFormalitäten und das Herumstehen in Polizeischreibstuben und so weiter\nunerträglich seien. Ich erinnere mich noch genau daran, wie das mich\ndamals stutzig machte und wie ich meine Tante davor warnte, auf diese\nBedingung einzugehen. Gerade zu dem Unvertrauten und Fremden, das der\nMann an sich hatte, schien mir diese Scheu vor der Polizei allzu gut zu\npassen, um nicht als verdächtig aufzufallen. Ich legte meiner Tante dar,\ndaß sie auf dies ohnehin etwas eigentümliche Ansinnen, dessen Erfüllung\nunter Umständen recht widerliche Folgen für sie haben könne, einem\nvöllig Fremden gegenüber unter keinen Umständen eingehen dürfe. Aber da\nstellte sich heraus, daß die Tante ihm die Erfüllung seines Wunsches\nschon zugesagt hatte und daß sie überhaupt sich von dem fremden Menschen\nschon hatte einfangen und bezaubern lassen; denn sie hat niemals Mieter\naufgenommen, zu denen sie nicht in irgendein menschliches, freundliches\nund tantenhaftes oder vielmehr mütterliches Verhältnis treten konnte,\nwas denn auch von manchen früheren Mietern reichlich ausgenützt worden\nist. Und in den ersten Wochen blieb es denn auch so, daß ich an dem\nneuen Mieter mancherlei auszusetzen hatte, während meine Tante ihn\njedesmal mit Wärme in Schutz nahm.","Da diese Sache mit dem Unterlassen der polizeilichen Meldung mir nicht\ngefiel, wollte ich wenigstens erfahren, was die Tante über den Fremden,\nüber seine Herkunft und Absichten wisse. Und da wußte sie schon dies und\njenes, obwohl er nach meinem Weggang um Mittag nur noch ganz kurz\ndageblieben war. Er hatte ihr gesagt, er gedenke sich einige Monate in\nunsrer Stadt aufzuhalten, die Bibliotheken zu benützen und die\nAltertümer der Stadt anzusehen. Eigentlich paßte es der Tante nicht, daß\ner nur für so kurze Zeit mieten wollte, aber er hatte sie offenbar schon\nfür sich gewonnen, trotz seinem etwas sonderbaren Auftreten. Kurz, die\nZimmer waren vermietet, und meine Einwände kamen zu spät.","„Warum hat er wohl das gesagt, daß es hier so gut rieche?“ fragte ich.","Da sagte meine Tante, welche manchmal recht gute Ahnungen hat: „Das weiß\nich ganz genau. Es riecht hier bei uns nach Sauberkeit und Ordnung und\nnach einem freundlichen und anständigen Leben, und das hat ihm gefallen.\nEr sieht aus, wie wenn er daran nicht mehr gewöhnt wäre und es entbehrt\nhätte.“","Nun ja, dachte ich, meinetwegen. „Aber,“ sagte ich, „wenn er an ein\nordentliches und anständiges Leben nicht gewöhnt ist, wie soll dann das\nwerden? Was willst du machen, wenn er unreinlich ist und alles verdreckt\noder wenn er zu allen Nachtstunden besoffen heimkommt?“","„Das werden wir ja sehen“, sagte sie und lachte, und ich ließ es gut\nsein.","Und in der Tat waren meine Befürchtungen unbegründet. Der Mieter, obwohl\ner keineswegs ein ordentliches und vernünftiges Leben führte, hat uns\nnicht belästigt noch geschädigt, wir denken noch heute gerne an ihn. Im\nInnern aber, in der Seele, hat dieser Mann uns beide, die Tante und\nmich, doch sehr viel gestört und belästigt, und offen gesagt, bin ich\nnoch lange nicht mit ihm fertig. Ich träume nachts manchmal von ihm und\nfühle mich durch ihn, durch die bloße Existenz eines solchen Wesens, im\nGrunde gestört und beunruhigt, obwohl er mir geradezu lieb geworden ist.","Zwei Tage später brachte ein Fuhrmann die Sachen des Fremden, der Harry\nHaller hieß. Ein sehr schöner Lederkoffer machte mir einen guten\nEindruck, und ein großer flacher Kabinenkoffer schien auf frühere weite\nReisen zu deuten, wenigstens war er beklebt mit den vergilbten\nFirmenzetteln von Hotels und Transportgesellschaften verschiedener, auch\nüberseeischer Länder.","Dann erschien er selbst, und es begann die Zeit, in der ich diesen\nsonderbaren Mann allmählich kennenlernte. Anfangs tat ich von meiner\nSeite nichts dazu. Obwohl ich mich für Haller von der ersten Minute an,\nin der ich ihn sah, interessierte, tat ich in den ersten paar Wochen\ndoch keinen Schritt, um ihn anzutreffen oder ins Gespräch mit ihm zu\nkommen. Dagegen habe ich allerdings, dies muß ich gestehen, schon von\nallem Anfang an den Mann ein wenig beobachtet, auch zuweilen während\nseiner Abwesenheit sein Zimmer betreten und überhaupt aus Neugierde ein\nklein wenig Spionage getrieben.","Über das Äußere des Steppenwolfes habe ich einige Angaben schon gemacht.\nEr machte durchaus und gleich beim ersten Anblick den Eindruck eines\nbedeutenden, eines seltenen und ungewöhnlich begabten Menschen, sein\nGesicht war voll Geist, und das außerordentlich zarte und bewegliche\nSpiel seiner Züge spiegelte ein interessantes, höchst bewegtes, ungemein\nzartes und sensibles Seelenleben. Wenn man mit ihm sprach und er, was\nnicht immer der Fall war, die Grenzen des Konventionellen überschritt\nund aus seiner Fremdheit heraus persönliche, eigene Worte sagte, dann\nmußte unsereiner sich ihm ohne weiteres unterordnen, er hatte mehr\ngedacht als andre Menschen und hatte in geistigen Angelegenheiten jene\nbeinah kühle Sachlichkeit, jenes sichere Gedachthaben und Wissen, wie es\nnur wahrhaft geistige Menschen haben, welchen jeder Ehrgeiz fehlt,\nwelche niemals zu glänzen oder den andern zu überreden oder recht zu\nbehalten wünschen.","Eines solchen Ausspruches, welcher aber nicht einmal ein Ausspruch war,\nsondern lediglich in einem Blick bestand, erinnere ich mich aus\nder letzten Zeit seines Hierseins. Da hatte ein berühmter\nGeschichtsphilosoph und Kulturkritiker, ein Mann von europäischem Namen,\neinen Vortrag in der Aula angekündigt, und es war mir gelungen, den\nSteppenwolf, der erst gar keine Lust dazu hatte, zum Besuch des Vortrags\nzu überreden. Wir gingen zusammen hin und saßen im Hörsaal\nnebeneinander. Als der Redner seine Kanzel bestieg und seine Ansprache\nbegann, enttäuschte er manche Zuhörer, welche eine Art von Propheten in\nihm vermutet hatten, durch die etwas geschniegelte und eitle Art seines\nAuftretens. Als er nun zu reden begann und zum Beginn den Zuhörern\neinige Schmeicheleien sagte und für ihr zahlreiches Erscheinen dankte,\nda warf mir der Steppenwolf einen ganz kurzen Blick zu, einen Blick der\nKritik über diese Worte und über die ganze Person des Redners, oh, einen\nunvergeßlichen und furchtbaren Blick, über dessen Bedeutung man ein\nganzes Buch schreiben könnte! Der Blick kritisierte nicht bloß jenen\nRedner und machte den berühmten Mann durch seine zwingende, obwohl\nsanfte Ironie zunichte, das war das Wenigste daran. Der Blick war viel\neher traurig als ironisch, er war sogar abgründig und hoffnungslos\ntraurig; eine stille, gewissermaßen sichere, gewissermaßen schon\nGewohnheit und Form gewordene Verzweiflung war der Inhalt dieses\nBlickes. Er durchleuchtete mit seiner verzweifelten Helligkeit nicht\nbloß die Person des eitlen Redners, ironisierte und erledigte die\nSituation des Augenblicks, die Erwartung und Stimmung des Publikums, den\netwas anmaßenden Titel der angekündigten Ansprache – nein, der Blick des\nSteppenwolfes durchdrang unsre ganze Zeit, das ganze betriebsame Getue,\ndie ganze Streberei, die ganze Eitelkeit, das ganze oberflächliche Spiel\neiner eingebildeten, seichten Geistigkeit – ach, und leider ging der\nBlick noch tiefer, ging noch viel weiter als bloß auf Mängel und\nHoffnungslosigkeiten unsrer Zeit, unsrer Geistigkeit, unsrer Kultur. Er\nging bis ins Herz alles Menschentums, er sprach beredt in einer einzigen\nSekunde den ganzen Zweifel eines Denkers, eines vielleicht Wissenden aus\nan der Würde, am Sinn des Menschenlebens überhaupt. Dieser Blick sagte:\n„Schau’, solche Affen sind wir! Schau’, so ist der Mensch!“ und alle\nBerühmtheit, alle Gescheitheit, alle Errungenschaften des Geistes, alle\nAnläufe zu Erhabenheit, Größe und Dauer im Menschlichen fielen zusammen\nund waren ein Affenspiel!","Ich habe damit weit vorgegriffen und, eigentlich gegen meinen Plan und\nWillen, im Grunde schon das Wesentliche über Haller gesagt, während es\nursprünglich meine Absicht war, sein Bild nur allmählich, im Erzählen\nmeines stufenweisen Bekanntwerdens mit ihm, zu enthüllen.","Nachdem ich nun denn so vorgegriffen habe, erübrigt es sich, noch weiter\nüber die rätselhafte „Fremdheit“ Hallers zu sprechen und im einzelnen zu\nberichten, wie ich allmählich die Gründe und Bedeutungen dieser\nFremdheit, dieser außerordentlichen und furchtbaren Vereinsamung ahnte\nund erkannte. Es ist besser so, denn ich möchte meine eigene Person\nmöglichst im Hintergrunde lassen. Ich will nicht meine Bekenntnisse\nvortragen oder Novellen erzählen oder Psychologie treiben, sondern\nlediglich als Augenzeuge etwas zum Bild des eigentümlichen Mannes\nbeitragen, der diese Steppenwolfmanuskripte hinterlassen hat.","Schon beim allerersten Anblick, als er durch die Glastür der Tante\nhereintrat, den Kopf so vogelartig reckte und den guten Geruch des\nHauses rühmte, war mir irgendwie das Besondere an diesem Manne\naufgefallen, und meine erste naive Reaktion darauf war Widerwille\ngewesen. Ich spürte (und meine Tante, die im Gegensatz zu mir ja ganz\nund gar kein intellektueller Mensch ist, spürte ziemlich genau dasselbe)\n– ich spürte, daß der Mann krank sei, auf irgendeine Art geistes- oder\ngemüts- oder charakterkrank, und wehrte mich dagegen mit dem Instinkt\ndes Gesunden. Diese Abwehr wurde im Lauf der Zeit abgelöst durch\nSympathie, beruhend auf einem großen Mitleid mit diesem tief und dauernd\nLeidenden, dessen Vereinsamung und inneres Sterben ich mit ansah. In\ndieser Periode kam mir mehr und mehr zum Bewußtsein, daß die Krankheit\ndieses Leidenden nicht auf irgendwelchen Mängeln seiner Natur beruhe,\nsondern im Gegenteil nur auf dem nicht zur Harmonie gelangten großen\nReichtum seiner Gaben und Kräfte. Ich erkannte, daß Haller ein Genie des\nLeidens sei, daß er, im Sinne mancher Aussprüche Nietzsches, in sich\neine geniale, eine unbegrenzte, furchtbare Leidensfähigkeit\nherangebildet habe. Zugleich erkannte ich, daß nicht Weltverachtung,\nsondern Selbstverachtung die Basis seines Pessimismus sei, denn so\nschonungslos und vernichtend er von Institutionen oder Personen reden\nkonnte, nie schloß er sich aus, immer war er selbst der erste, gegen den\ner seine Pfeile richtete, war er selbst der erste, den er haßte und\nverneinte ...","Hier muß ich eine psychologische Anmerkung einfügen. Obgleich ich über\ndas Leben des Steppenwolfes sehr wenig weiß, habe ich doch allen Grund\nzu vermuten, daß er von liebevollen, aber strengen und sehr frommen\nEltern und Lehrern in jenem Sinne erzogen wurde, der das „Brechen des\nWillens“ zur Grundlage der Erziehung macht. Dieses Vernichten der\nPersönlichkeit und Brechen des Willens nun war bei diesem Schüler nicht\ngelungen, dazu war er viel zu stark und hart, viel zu stolz und geistig.\nStatt seine Persönlichkeit zu vernichten, war es nur gelungen, ihn sich\nselbst hassen zu lehren. Gegen sich selber, gegen dies unschuldige und\nedle Objekt richtete er nun zeitlebens die ganze Genialität seiner\nPhantasie, die ganze Stärke seines Denkvermögens. Denn darin war er,\ntrotz allem, durch und durch Christ und durch und durch Märtyrer, daß er\njede Schärfe, jede Kritik, jede Bosheit, jeden Haß, dessen er fähig war,\nvor allem und zuerst auf sich selbst losließ. Was die anderen, was die\nUmwelt betraf, so machte er beständig die heldenhaftesten und ernstesten\nVersuche, sie zu lieben, ihnen gerecht zu werden, ihnen nicht weh zu\ntun, denn das „Liebe deinen Nächsten“ war ihm ebenso tief eingebläut wie\ndas Hassen seiner selbst, und so war sein ganzes Leben ein Beispiel\ndafür, daß ohne Liebe zu sich selbst auch die Nächstenliebe unmöglich\nist, daß der Selbsthaß genau dasselbe ist und am Ende genau dieselbe\ngrausige Isoliertheit und Verzweiflung erzeugt wie der grelle Egoismus.","Aber es wird nun Zeit, daß ich meine Gedanken hintanstelle und von\nWirklichkeiten spreche. Das erste also, was ich über Herrn Haller in\nErfahrung brachte, teils durch meine Spionage, teils durch Bemerkungen\nmeiner Tante, bezog sich auf die Art seiner Lebensführung. Daß er ein\nGedanken- und Büchermensch war und keinen praktischen Beruf ausübte, war\nbald zu sehen. Er lag immer sehr lange im Bett, oft stand er erst kurz\nvor Mittag auf und ging im Schlafrock die paar Schritte von der\nSchlafkammer zu seinem Wohnzimmer hinüber. Dies Wohnzimmer, eine große\nund freundliche Mansarde mit zwei Fenstern, sah schon nach wenigen Tagen\nanders aus als zur Zeit, da es von andern Mietern bewohnt gewesen war.\nEs füllte sich, und mit der Zeit wurde es immer voller. An den Wänden\nwurden Bilder aufgehängt, Zeichnungen angeheftet, zuweilen aus\nZeitschriften ausgeschnittene Bilder, die häufig wechselten. Eine\nsüdliche Landschaft, Photographien aus einem deutschen Landstädtchen,\noffenbar der Heimat Hallers, hingen da, farbige, leuchtende Aquarelle\ndazwischen, von denen wir erst spät erfuhren, daß er selbst sie gemalt\nhatte. Dann die Photographie einer hübschen jungen Frau oder eines\njungen Mädchens. Eine Zeitlang hing ein siamesischer Buddha an der Wand,\ner wurde abgelöst durch eine Reproduktion der „Nacht“ von Michelangelo,\ndann von einem Bildnis des Mahatma Gandhi. Bücher füllten nicht nur den\ngroßen Bücherschrank, sondern lagen auch überall auf den Tischen, auf\ndem hübschen alten Sekretär, auf dem Diwan, auf den Stühlen, auf dem\nBoden herum, Bücher mit eingelegten Papierzeichen, die beständig\nwechselten. Die Bücher nahmen beständig zu, denn er brachte nicht nur\nganze Packen von den Bibliotheken mit, sondern bekam auch sehr häufig\nPakete mit der Post. Der Mann, der diese Stube bewohnte, konnte ein\nGelehrter sein. Dazu paßte auch der Zigarrenrauch, der alles einhüllte,\nund die überall herumliegenden Zigarrenreste und Aschenschalen. Ein\ngroßer Teil der Bücher jedoch war nicht gelehrten Inhalts, die große\nMehrzahl waren Werke der Dichter aus allen Zeiten und Völkern. Eine\nZeitlang lagen auf dem Diwan, wo er oft ganze Tage liegend zubrachte,\nalle sechs dicken Bände eines Werkes herum mit dem Titel „Sophiens Reise\nvon Memel nach Sachsen“, vom Ende des achtzehnten Jahrhunderts. Eine\nGesamtausgabe von Goethe und eine von Jean Paul schien viel benützt zu\nwerden, ebenso Novalis, aber auch Lessing, Jacobi und Lichtenberg.\nEinige Dostojewskibände staken voll von beschriebenen Zetteln. Auf dem\ngrößern Tisch zwischen den vielen Büchern und Schriften stand häufig ein\nBlumenstrauß, dort trieb sich auch ein Aquarellierkasten herum, der aber\nstets voller Staub war, daneben die Aschenschalen und, um auch dies\nnicht zu verschweigen, allerlei Flaschen mit Getränken. Eine\nstrohumflochtene Flasche war meist mit italienischem Rotwein gefüllt,\nden er in der Nähe in einem kleinen Laden holte, manchmal war auch eine\nFlasche Burgunder zu sehen sowie Malaga, und eine dicke Flasche mit\nKirschgeist sah ich innerhalb recht kurzer Zeit nahezu leer werden, dann\naber in eine Stubenecke verschwinden und, ohne daß der Rest sich weiter\nverminderte, verstauben. Ich will mich über die von mir getriebene\nSpionage nicht rechtfertigen und gestehe auch offen, daß in der ersten\nZeit alle diese Anzeichen eines zwar von geistigen Interessen erfüllten,\naber doch recht verbummelten und zuchtlosen Lebens bei mir Abscheu und\nMißtrauen hervorriefen. Ich bin nicht nur ein bürgerlicher, regelmäßig\nlebender Mensch, an Arbeit und genaue Zeiteinteilung gewohnt, ich bin\nauch Abstinent und Nichtraucher, und jene Flaschen in Hallers Zimmer\ngefielen mir noch weniger als die übrige malerische Unordnung.","Wie mit Schlaf und Arbeit, so lebte der Fremde auch in bezug auf Essen\nund Trinken sehr ungleichmäßig und launisch. An manchen Tagen ging er\nüberhaupt nicht aus und nahm außer dem Morgenkaffee gar nichts zu sich,\nzuweilen fand die Tante als einzigen Rest seiner Mahlzeit eine\nBananenschale liegen, aber an andern Tagen speiste er in Restaurants,\nbald in guten und eleganten, bald in kleinen Vorstadtkneipen. Seine\nGesundheit schien nicht gut zu sein; außer der Hemmung in den Beinen,\nmit denen er oft recht mühsam seine Treppen stieg, schien er auch von\nandren Störungen geplagt zu sein, und einmal sagte er nebenbei, er habe\nseit Jahren nicht mehr richtig verdaut noch richtig geschlafen. Ich\nschrieb es vor allem seinem Trinken zu. Später, als ich ihn zuweilen in\neines seiner Wirtshäuser begleitete, war ich manchmal Zeuge, wie er\nrasch und launisch die Weine hinuntergoß, richtig betrunken aber habe\nweder ich noch sonst jemand ihn je gesehen.","Nie vergesse ich unsre erste persönlichere Begegnung. Wir kannten\neinander nur so, wie eben Zimmernachbarn in einem Miethaus sich kennen.\nDa kam ich eines Abends aus dem Geschäft nach Hause und fand zu meinem\nErstaunen Herrn Haller beim Absatz der Treppe zwischen dem ersten und\nzweiten Stockwerk sitzen. Er hatte sich auf die oberste Treppenstufe\ngesetzt und rückte beiseite, um mich vorbei zu lassen. Ich fragte ihn,\nob er nicht wohl sei, und bot mich an, ihn vollends nach oben zu\nbegleiten.","Haller sah mich an, und ich merkte, daß ich ihn aus einer Art von\nTraumzustand geweckt hatte. Langsam begann er zu lächeln, sein hübsches\nund jämmerliches Lächeln, mit dem er mir so oft das Herz schwer gemacht\nhat, dann lud er mich ein, mich neben ihn zu setzen. Ich dankte und\nsagte, ich sei nicht gewohnt, auf der Treppe vor anderer Leute Wohnungen\nzu sitzen.","„Ach ja,“ sagte er und lächelte stärker, „Sie haben recht. Aber warten\nSie noch einen Augenblick, ich muß Ihnen doch zeigen, warum ich hier ein\nwenig sitzenbleiben mußte.“","Dabei deutete er auf den Vorplatz der Wohnung im ersten Stock, wo eine\nWitwe wohnte. Auf dem kleinen parkettbelegten Platz zwischen Treppe,\nFenster und Glastüre stand ein hoher Mahagonischrank an der Wand, mit\naltem Zinn darauf, und vor dem Schrank am Boden standen, auf zwei\nkleinen niedern Ständerchen, zwei Pflanzen in großen Töpfen, eine Azalee\nund eine Araukarie. Die Pflanzen sahen hübsch aus und waren immer sehr\nsauber und tadellos gehalten, das war auch mir schon angenehm\naufgefallen.","„Sehen Sie,“ fuhr Haller fort, „dieser kleine Vorplatz mit der\nAraukarie, der riecht so fabelhaft, ich kann hier oft gar nicht\nvorbeigehen, ohne eine Weile haltzumachen. Auch bei Ihrer Frau Tante\nduftet es ja gut und herrscht Ordnung und höchste Sauberkeit, aber der\nAraukarienplatz hier, der ist so strahlend rein, so abgestaubt und\ngewichst und abgewaschen, so unantastbar sauber, daß er förmlich\nausstrahlt. Ich muß da immer eine Nase voll einatmen – riechen Sie es\nnicht auch? Wie da der Geruch von Bodenwachs und ein schwacher Nachklang\nvon Terpentin zusammen mit dem Mahagoni, den abgewaschenen\nPflanzenblättern und allem einen Duft ergibt, einen Superlativ von\nbürgerlicher Reinheit, von Sorgfalt und Genauigkeit, von\nPflichterfüllung und Treue im kleinen. Ich weiß nicht, wer da wohnt,\naber es muß hinter dieser Glastür ein Paradies von Reinlichkeit und\nabgestaubter Bürgerlichkeit wohnen, von Ordnung und ängstlich-rührender\nHingabe an kleine Gewohnheiten und Pflichten.“","Da ich schwieg, fuhr er fort: „Glauben Sie bitte nicht, daß ich ironisch\nspreche! Lieber Herr, nichts liegt mir ferner, als diese Bürgerlichkeit\nund Ordnung etwa verlachen zu wollen. Es ist ja richtig, ich selbst lebe\nin einer andern Welt, nicht in dieser, und vielleicht wäre ich nicht\nimstande, es auch nur einen Tag lang in einer Wohnung mit solchen\nAraukarien auszuhalten. Aber wenn ich auch ein alter und etwas ruppiger\nSteppenwolf bin, so bin doch auch ich der Sohn einer Mutter, und auch\nmeine Mutter war eine Bürgersfrau und zog Blumen und wachte über Stube\nund Treppe, Möbel und Gardinen und bemühte sich, ihrer Wohnung und ihrem\nLeben so viel Sauberkeit, Reinheit und Ordentlichkeit zu geben, als nur\nimmer gehen wollte. Daran erinnert mich der Hauch von Terpentin, daran\ndie Araukarie, und da sitze ich denn hie und da, sehe in diesen stillen\nkleinen Garten der Ordnung und freue mich, daß es das noch gibt.“","Er wollte aufstehen, hatte aber Mühe damit und wies mich nicht ab, als\nich ihm dabei ein wenig half. Ich blieb schweigsam, aber ich unterlag,\nebenso wie es zuvor meiner Tante ergangen war, irgendeinem Zauber, den\nder seltsame Mensch zuweilen haben konnte. Wir gingen langsam\nmiteinander die Treppen hinauf, und vor seiner Türe, schon die Schlüssel\nin der Hand, blickte er mir nochmals voll und sehr freundlich ins\nGesicht und sagte: „Sie kommen aus Ihrem Geschäft? Nun ja, davon\nverstehe ich nichts, ich lebe so etwas abseits, etwas am Rande, wissen\nSie. Aber ich glaube, Sie haben auch Interesse für Bücher und\ndergleichen, Ihre Tante sagte mir einmal, daß Sie das Gymnasium\nabsolviert haben und ein guter Grieche waren. Nun, ich habe da heut\nmorgen einen Satz bei Novalis gefunden, darf ich Ihnen den zeigen? Sie\nwerden auch Freude daran haben.“","Er nahm mich mit in sein Zimmer, wo es stark nach Tabak roch, zog ein\nBuch aus einem der Haufen heraus, blätterte, suchte –","„Auch das ist gut, sehr gut,“ sagte er, „hören Sie einmal den Satz: ‚Man\nsollte stolz auf den Schmerz sein – jeder Schmerz ist eine Erinnerung\nunsres hohen Ranges.‘ Fein! Achtzig Jahre vor Nietzsche! Aber das ist\nnicht der Spruch, den ich meinte – warten Sie – da habe ich ihn. Also:\n‚Die meisten Menschen wollen nicht eher schwimmen, als bis sie es\nkönnen.‘ Ist das nicht witzig? Natürlich wollen sie nicht schwimmen! Sie\nsind ja für den Boden geboren, nicht fürs Wasser. Und natürlich wollen\nsie nicht denken; sie sind ja fürs Leben geschaffen, nicht fürs Denken!\nJa, und wer denkt, wer das Denken zur Hauptsache macht, der kann es\ndarin zwar weit bringen, aber er hat doch eben den Boden mit dem Wasser\nvertauscht, und einmal wird er ersaufen.“","Er hatte mich nun eingefangen und interessiert, und ich blieb eine\nkleine Weile bei ihm, und von da an kam es nicht selten vor, daß wir auf\nder Treppe oder auf der Straße, wenn wir uns trafen, ein wenig\nmiteinander sprachen. Dabei hatte ich im Anfang, ebenso wie bei der\nAraukarie, immer ein wenig das Gefühl, daß er mich ironisiere. Aber es\nwar nicht so. Er hatte vor mir, wie vor der Araukarie, geradezu\nHochachtung, er war von seiner Vereinsamung, seinem Schwimmen im Wasser,\nseiner Entwurzelung so bewußt überzeugt, daß tatsächlich und ohne jeden\nHohn zuweilen der Anblick einer alltäglichen bürgerlichen Handlung, die\nPünktlichkeit zum Beispiel, mit der ich zu meinen Bureaustunden ging,\noder der Ausspruch eines Dienstboten oder Trambahnschaffners, ihn\nbegeistern konnte. Zuerst erschien mir das recht lächerlich und\nübertrieben, so eine Herren- und Bummlerlaune, eine spielerische\nSentimentalität. Aber mehr und mehr mußte ich sehen, daß er in der Tat\nunsre kleine bürgerliche Welt aus seinem luftleeren Raume, aus seiner\nFremdheit und Steppenwolfigkeit heraus geradezu bewunderte und liebte,\nals das Feste und Sichere, als das ihm Ferne und Unerreichbare, als die\nHeimat und den Frieden, zu denen ihm kein Weg gebahnt war. Er zog vor\nunsrer Zugängerin, einer braven Frau, den Hut jedesmal mit einer wahren\nEhrfurcht, und wenn meine Tante sich einmal mit ihm ein wenig unterhielt\noder ihn auf eine Reparaturbedürftigkeit an seiner Wäsche, auf einen\nhängenden Knopf an seinem Mantel aufmerksam machte, dann hörte er mit\neiner merkwürdigen Aufmerksamkeit und Wichtigkeit zu, als gäbe er sich\neine unsägliche und hoffnungslose Mühe, durch irgendeinen Spalt in diese\nkleine, friedliche Welt einzudringen und dort heimisch zu werden, sei es\nauch nur für eine Stunde.","Schon bei jenem ersten Gespräch, bei der Araukarie, nannte er sich den\nSteppenwolf, und auch dies befremdete und störte mich ein wenig. Was\nwaren das für Ausdrücke?! Aber ich lernte den Ausdruck nicht nur durch\nGewöhnung gelten zu lassen, sondern bald nannte ich den Mann bei mir\nselbst, in meinen Gedanken, nie mehr anders als den Steppenwolf und\nwüßte auch heute noch kein treffenderes Wort für diese Erscheinung. Ein\nzu uns, in die Städte und ins Herdenleben verirrter Steppenwolf –\nschlagender konnte kein andres Bild ihn zeigen, seine scheue\nVereinsamung, seine Wildheit, seine Unruhe, sein Heimweh und seine\nHeimatlosigkeit.","Einmal konnte ich ihn einen ganzen Abend lang beobachten, in einem\nSymphoniekonzert, wo ich ihn zu meiner Überraschung in meiner Nähe\nsitzen sah, ohne daß er mich bemerkte. Erst wurde Händel gespielt, eine\nedle und schöne Musik, aber der Steppenwolf saß in sich versunken und\nohne Anschluß, weder an die Musik noch an seine Umgebung. Unzugehörig,\neinsam und fremd saß er, mit einem kühlen, aber sorgenvollen Gesicht vor\nsich nieder blickend. Dann kam ein anderes Stück, eine kleine Symphonie\nvon Friedemann Bach, und da war ich ganz erstaunt zu sehen, wie nach\nwenigen Takten mein Fremdling anfing zu lächeln und sich hinzugeben, er\nsank ganz in sich hinein und sah, wohl zehn Minuten lang, so glücklich\nversunken und in gute Träume verloren aus, daß ich mehr auf ihn als auf\ndie Musik achtete. Als das Stück zu Ende war, erwachte er, setzte sich\ngerader, machte Miene aufzustehen und schien gehen zu wollen, blieb dann\naber doch sitzen und hörte auch das letzte Stück noch an, es waren\nVariationen von Reger, eine Musik, die von vielen als etwas lang und\nermüdend empfunden wurde. Und auch der Steppenwolf, der anfangs noch\naufmerksam und gutwillig zugehört hatte, fiel wieder ab, er steckte die\nHände in die Taschen und sank wieder in sich hinein, diesmal aber nicht\nglücklich und träumerisch, sondern traurig und schließlich böse, sein\nGesicht war wieder fern, grau und erloschen, er sah alt und krank und\nunzufrieden aus.","Nach dem Konzert sah ich ihn auf der Straße wieder und ging hinter ihm\nher; in seinen Mantel verkrochen schritt er unlustig und müde in der\nRichtung nach unsrem Viertel davon, vor einem kleinen altmodischen\nWirtshause aber blieb er stehen, sah unschlüssig auf die Uhr und ging\ndann hinein. Ich folgte einem augenblicklichen Gelüste und ging ihm\nnach. Da saß er an einem kleinbürgerlichen Wirtstisch, Wirtin und\nKellnerin begrüßten ihn als bekannten Gast, und ich grüßte und setzte\nmich zu ihm. Eine Stunde saßen wir dort, und während ich zwei Gläser\nMineralwasser trank, ließ er sich einen halben und dann noch einen\nviertel Liter Rotwein geben. Ich sagte, daß ich im Konzert gewesen sei,\naber er ging nicht darauf ein. Er las die Etikette meiner Wasserflasche\nund fragte, ob ich keinen Wein trinken wolle, zu dem er mich einlade.\nAls er hörte, daß ich nie Wein trinke, machte er wieder sein hilfloses\nGesicht und sagte: „Ja, da haben Sie recht. Ich habe auch jahrelang\nenthaltsam gelebt und auch lange Zeiten gefastet, aber zur Zeit stehe\nich wieder im Zeichen des Wassermanns, einem dunklen und feuchten\nZeichen.“","Und als ich nun scherzend auf diese Anspielung einging und andeutete,\nwie unwahrscheinlich es mir sei, daß gerade er an Astrologie glaube, da\nnahm er wieder den zu höflichen Ton an, der mich oft verletzte, und\nsagte: „Ganz richtig, auch an diese Wissenschaft kann ich leider nicht\nglauben.“","Ich ging und empfahl mich, und er kam erst sehr spät in der Nacht nach\nHause, aber sein Schritt war der gewohnte, und wie immer ging er nicht\nsogleich zu Bett (ich hörte das als sein Zimmernachbar ja genau),\nsondern hielt sich wohl noch eine Stunde bei Licht in seinem Wohnzimmer\nauf.","Auch einen andern Abend habe ich nicht vergessen. Da war ich allein zu\nHause, die Tante war nicht da, und es läutete an der Haustür, und als\nich öffnete, stand da eine junge, sehr hübsche Dame, und als sie nach\nHerrn Haller fragte, erkannte ich sie: es war die auf der Photographie\nin seinem Zimmer. Ich zeigte ihr seine Tür und zog mich zurück, sie\nblieb eine Weile oben, bald darauf aber hörte ich sie miteinander die\nTreppe hinab und ausgehen, lebhaft und sehr vergnügt in scherzendem\nGespräch. Ich war sehr erstaunt, daß der Einsiedler eine Geliebte habe,\nund eine so junge, hübsche und elegante, und alle meine Vermutungen über\nihn und sein Leben wurden mir wieder ungewiß. Aber eine kleine Stunde\nspäter kam er schon wieder nach Hause, allein, mit schwerem, traurigem\nSchritt, mühte sich die Treppe hinauf und schlich dann stundenlang in\nseinem Wohnzimmer leise auf und ab, richtig wie ein Wolf im Käfig geht,\ndie ganze Nacht bis fast zum Morgen war Licht in seinem Zimmer.","Ich weiß über dies Verhältnis gar nichts und will nur hinzufügen: noch\neinmal sah ich ihn mit jener Frau zusammen, in einer Straße der Stadt.\nSie gingen Arm in Arm, und er sah glücklich aus, ich wunderte mich\nwieder, wieviel Anmut, ja Kindlichkeit sein versorgtes einsames Gesicht\ngelegentlich haben konnte, und begriff die Frau und begriff auch die\nTeilnahme, die meine Tante für diesen Mann hatte. Aber auch an jenem\nTage kam er abends traurig und elend nach Hause; ich traf ihn an der\nHaustür an, er hatte, wie manches Mal, unterm Mantel die italienische\nWeinflasche bei sich und saß mit ihr die halbe Nacht in seiner Höhle\noben. Er tat mir leid, aber was war das auch für ein trostloses,\nverlorenes und wehrloses Leben, das er führte!","Nun, es ist genug geplaudert. Es bedarf weiter keiner Berichte und\nSchilderungen, um zu zeigen, daß der Steppenwolf das Leben eines\nSelbstmörders führte. Aber dennoch glaube ich nicht, daß er sich das\nLeben genommen hat, damals, als er unversehens und ohne Abschied, aber\nnach Bezahlung aller Rückstände unsre Stadt eines Tages verließ und\nverschwunden war. Wir haben nie mehr etwas von ihm gehört und bewahren\nnoch immer einige Briefe auf, die noch für ihn ankamen. Zurück ließ er\nnichts als sein Manuskript, das er während seines hiesigen Aufenthaltes\ngeschrieben hat und das er mit wenigen Zeilen mir zueignete, mit dem\nBemerken, ich könne damit machen, was ich wolle.","Es war mir nicht möglich, die Erlebnisse, von denen Hallers Manuskript\nerzählt, auf ihren Gehalt an Realität nachzuprüfen. Ich zweifle nicht\ndaran, daß sie zum größten Teil Dichtung sind, nicht aber im Sinn\nwillkürlicher Erfindung, sondern im Sinne eines Ausdrucksversuches, der\ntief erlebte seelische Vorgänge im Kleide sichtbarer Ereignisse\ndarstellt. Die zum Teil phantastischen Vorgänge in Hallers Dichtung\nstammen vermutlich aus der letzten Zeit seines hiesigen Aufenthaltes,\nund ich zweifle nicht daran, daß ihnen auch ein Stück wirklichen,\näußeren Erlebens zugrunde liegt. In jener Zeit zeigte unser Gast in der\nTat ein verändertes Benehmen und Aussehen, war sehr viel außer Hause,\nzuweilen auch ganze Nächte, und seine Bücher lagen unberührt. Die\nwenigen Male, die ich ihn damals antraf, schien er auffallend lebendig\nund verjüngt, einige Male geradezu vergnügt. Gleich darauf folgte\nallerdings eine neue schwere Depression, er blieb tagelang im Bett, ohne\nEssen zu begehren, und in jene Zeit fiel auch ein außerordentlich\nheftiger, ja brutaler Zank mit seiner wieder aufgetauchten Geliebten,\nder das ganze Haus revoltierte und für welchen Haller tags darauf meine\nTante um Entschuldigung gebeten hat.","Nein, ich bin davon überzeugt, daß er sich nicht das Leben genommen hat.\nEr lebt noch, er geht irgendwo auf seinen müden Beinen die Treppen\nfremder Häuser auf und ab, starrt irgendwo auf blankgescheuerte\nParkettböden und auf sauber gepflegte Araukarien, sitzt Tage in\nBibliotheken und Nächte in Wirtshäusern oder liegt auf einem gemieteten\nKanapee, hört hinter den Fenstern die Welt und die Menschen leben und\nweiß sich ausgeschlossen, tötet sich aber nicht, denn ein Rest von\nGlaube sagt ihm, daß er dies Leiden, dies böse Leiden in seinem Herzen\nzu Ende kosten und daß dies Leiden es sei, woran er sterben müsse. Ich\ndenke oft an ihn, er hat mir das Leben nicht leichter gemacht, er hatte\nnicht die Gabe, das Starke und Frohe in mir zu stützen und zu fördern,\noh, im Gegenteil! Aber ich bin nicht er, und ich führe nicht seine Art\nvon Leben, sondern das meine, ein kleines und bürgerliches, aber\ngesichertes und von Pflichten erfülltes. Und so können wir seiner in\nRuhe und Freundschaft denken, ich und meine Tante, welche mehr über ihn\nzu sagen wüßte als ich, aber das bleibt in ihrem gütigen Herzen\nverborgen.","* * * * *","Was nun die Aufzeichnungen Hallers betrifft, diese wunderlichen, zum\nTeil krankhaften, zum Teil schönen und gedankenvollen Phantasien, so muß\nich sagen, daß ich diese Blätter, wären sie mir zufällig in die Hand\ngefallen und ihr Urheber mir nicht bekannt gewesen, gewiß entrüstet\nweggeworfen hätte. Aber durch meine Bekanntschaft mit Haller ist es mir\nmöglich geworden, sie teilweise zu verstehen, ja zu billigen. Ich würde\nBedenken tragen, sie anderen mitzuteilen, wenn ich in ihnen bloß die\npathologischen Phantasien eines einzelnen, eines armen Gemütskranken\nsehen würde. Ich sehe in ihnen aber etwas mehr, ein Dokument der Zeit,\ndenn Hallers Seelenkrankheit ist – das weiß ich heute – nicht die\nSchrulle eines einzelnen, sondern die Krankheit der Zeit selbst, die\nNeurose jener Generation, welcher Haller angehört, und von welcher\nkeineswegs nur die schwachen und minderwertigen Individuen befallen\nscheinen, sondern gerade die starken, geistigsten, begabtesten.","Diese Aufzeichnungen – einerlei, wie viel oder wenig realen Erlebens\nihnen zugrunde liegen mag – sind ein Versuch, die große Zeitkrankheit\nnicht durch Umgehen und Beschönigen zu überwinden, sondern durch den\nVersuch, die Krankheit selber zum Gegenstand der Darstellung zu machen.\nSie bedeuten, ganz wörtlich, einen Gang durch die Hölle, einen bald\nangstvollen, bald mutigen Gang durch das Chaos einer verfinsterten\nSeelenwelt, gegangen mit dem Willen, die Hölle zu durchqueren, dem Chaos\ndie Stirn zu bieten, das Böse bis zu Ende zu erleiden.","Ein Wort Hallers hat mir den Schlüssel zu diesem Verständnis gegeben. Er\nsagte einmal zu mir, nachdem wir über sogenannte Grausamkeiten im\nMittelalter gesprochen hatten: „Diese Grausamkeiten sind in Wirklichkeit\nkeine. Ein Mensch des Mittelalters würde den ganzen Stil unseres\nheutigen Lebens noch ganz anders als grausam, entsetzlich und barbarisch\nverabscheuen! Jede Zeit, jede Kultur, jede Sitte und Tradition hat ihren\nStil, hat ihre ihr zukommenden Zartheiten und Härten, Schönheiten und\nGrausamkeiten, hält gewisse Leiden für selbstverständlich, nimmt gewisse\nÜbel geduldig hin. Zum wirklichen Leiden, zur Hölle wird das menschliche\nLeben nur da, wo zwei Zeiten, zwei Kulturen und Religionen einander\nüberschneiden. Ein Mensch der Antike, der im Mittelalter hätte leben\nmüssen, wäre daran jämmerlich erstickt, ebenso wie ein Wilder inmitten\nunsrer Zivilisation ersticken müßte. Es gibt nun Zeiten, wo eine ganze\nGeneration so zwischen zwei Zeiten, zwischen zwei Lebensstile\nhineingerät, daß ihr jede Selbstverständlichkeit, jede Sitte, jede\nGeborgenheit und Unschuld verlorengeht. Natürlich spürt das nicht ein\njeder gleich stark. Eine Natur wie Nietzsche hat das heutige Elend um\nmehr als eine Generation voraus erleiden müssen, – was er einsam und\nunverstanden auszukosten hatte, das erleiden heute Tausende.“","Dieses Wortes mußte ich beim Lesen der Aufzeichnungen oft gedenken.\nHaller gehört zu denen, die zwischen zwei Zeiten hineingeraten, die aus\naller Geborgenheit und Unschuld herausgefallen sind, zu denen, deren\nSchicksal es ist, alle Fragwürdigkeit des Menschenlebens gesteigert als\npersönliche Qual und Hölle zu erleben.","Darin, scheint mir, liegt der Sinn, den seine Aufzeichnungen für uns\nhaben können, und darum entschloß ich mich, sie mitzuteilen. Im übrigen\nwill ich sie nicht in Schutz nehmen noch über sie aburteilen, möge jeder\nLeser dies nach seinem Gewissen tun!","Harry Hallers Aufzeichnungen","Nur für Verrückte","Der Tag war vergangen, wie eben die Tage so vergehen; ich hatte ihn\nherumgebracht, hatte ihn sanft umgebracht, mit meiner primitiven und\nschüchternen Art von Lebenskunst; ich hatte einige Stunden gearbeitet,\nalte Bücher gewälzt, ich hatte zwei Stunden lang Schmerzen gehabt, wie\nältere Leute sie eben haben, hatte ein Pulver genommen und mich gefreut,\ndaß die Schmerzen sich überlisten ließen, hatte in einem heißen Bad\ngelegen und die liebe Wärme eingesogen, hatte dreimal die Post empfangen\nund all die entbehrlichen Briefe und Drucksachen durchgesehen, hatte\nmeine Atemübungen gemacht, die Gedankenübungen aber heut aus\nBequemlichkeit weggelassen, war eine Stunde spazieren gewesen und hatte\nschöne, zarte, kostbare Federwölkchenmuster in den Himmel gezeichnet\ngefunden. Das war sehr hübsch, ebenso wie das Lesen in den alten\nBüchern, wie das Liegen im warmen Bad, aber – alles in allem – war es\nnicht gerade ein entzückender, nicht eben ein strahlender, ein Glücks-\nund Freudentag gewesen, sondern eben einer von diesen Tagen, wie sie für\nmich nun seit langer Zeit die normalen und gewohnten sein sollten:\nmaßvoll angenehme, durchaus erträgliche, leidliche, laue Tage eines\nälteren unzufriedenen Herrn, Tage ohne besondere Schmerzen, ohne\nbesondere Sorgen, ohne eigentlichen Kummer, ohne Verzweiflung, Tage, an\nwelchen selbst die Frage, ob es nicht an der Zeit sei, dem Beispiele\nAdalbert Stifters zu folgen und beim Rasieren zu verunglücken, ohne\nAufregung oder Angstgefühle sachlich und ruhig erwogen wird.","Wer die anderen Tage geschmeckt hat, die bösen, die mit den\nGichtanfällen oder die mit jenem schlimmen, hinter den Augäpfeln\nfestgewurzelten, teuflisch jede Tätigkeit von Auge und Ohr aus einer\nFreude zur Qual verhexenden Kopfweh, oder jene Tage des Seelensterbens,\njene argen Tage der inneren Leere und Verzweiflung, an denen uns,\ninmitten der zerstörten und von Aktiengesellschaften ausgesogenen Erde,\ndie Menschenwelt und sogenannte Kultur in ihrem verlogenen und gemeinen\nblechernen Jahrmarktsglanz auf Schritt und Tritt wie ein Brechmittel\nentgegengrinst, konzentriert und zum Gipfel der Unleidlichkeit getrieben\nim eigenen kranken Ich – wer jene Höllentage geschmeckt hat, der ist mit\nsolchen Normal- und Halbundhalbtagen gleich dem heutigen sehr zufrieden,\ndankbar sitzt er am warmen Ofen, dankbar stellt er beim Lesen des\nMorgenblattes fest, daß auch heute wieder kein Krieg ausgebrochen, keine\nneue Diktatur errichtet, keine besonders krasse Schweinerei in Politik\nund Wirtschaft aufgedeckt worden ist, dankbar stimmt er die Saiten\nseiner verrosteten Leier zu einem gemäßigten, einem leidlich frohen,\neinem nahezu vergnügten Dankpsalm, mit dem er seinen stillen, sanften,\netwas mit Brom betäubten Zufriedenheitshalbundhalbgott langweilt, und in\nder laudicken Luft dieser zufriedenen Langeweile, dieser sehr\ndankenswerten Schmerzlosigkeit sehen die beiden, der öde nickende\nHalbundhalbgott und der leicht angegraute, den gedämpften Psalm singende\nHalbundhalbmensch, einander wie Zwillinge ähnlich.","Es ist eine schöne Sache um die Zufriedenheit, um die Schmerzlosigkeit,\num diese erträglichen geduckten Tage, wo weder Schmerz noch Lust zu\nschreien wagt, wo alles nur flüstert und auf Zehen schleicht. Nur steht\nes mit mir leider so, daß ich gerade diese Zufriedenheit gar nicht gut\nvertrage, daß sie mir nach kurzer Dauer unausstehlich verhaßt und\nekelhaft wird und ich mich verzweiflungsvoll in andre Temperaturen\nflüchten muß, womöglich auf dem Wege der Lustgefühle, nötigenfalls aber\nauch auf dem Wege der Schmerzen. Wenn ich eine Weile ohne Lust und ohne\nSchmerz war und die laue fade Erträglichkeit sogenannter guter Tage\ngeatmet habe, dann wird mir in meiner kindischen Seele so windig weh und\nelend, daß ich die verrostete Dankbarkeitsleier dem schläfrigen\nZufriedenheitsgott ins zufriedene Gesicht schmeiße und lieber einen\nrechten teuflischen Schmerz in mir brennen fühle als diese bekömmliche\nZimmertemperatur. Es brennt alsdann in mir eine wilde Begierde nach\nstarken Gefühlen, nach Sensationen, eine Wut auf dies abgetönte, flache,\nnormierte und sterilisierte Leben und eine rasende Lust, irgend etwas\nkaputt zu schlagen, etwa ein Warenhaus oder eine Kathedrale oder mich\nselbst, verwegene Dummheiten zu begehen, ein paar verehrten Götzen die\nPerücken abzureißen, ein paar rebellische Schulbuben mit der ersehnten\nFahrkarte nach Hamburg auszurüsten, ein kleines Mädchen zu verführen\noder einigen Vertretern der bürgerlichen Weltordnung das Gesicht ins\nGenick zu drehen. Denn dies haßte, verabscheute und verfluchte ich von\nallem doch am innigsten: diese Zufriedenheit, diese Gesundheit,\nBehaglichkeit, diesen gepflegten Optimismus des Bürgers, diese fette\ngedeihliche Zucht des Mittelmäßigen, Normalen, Durchschnittlichen.","In solcher Stimmung also beschloß ich diesen leidlichen Dutzendtag bei\neinbrechender Dunkelheit. Ich beschloß ihn nicht auf die für einen etwas\nleidenden Mann normale und bekömmliche Weise, indem ich mich von dem\nbereitstehenden und mit einer Wärmflasche als Köder versehenen Bett\neinfangen ließ, sondern indem ich unbefriedigt und angeekelt von meinem\nbißchen Tagewerk voll Mißmut meine Schuhe anzog, in den Mantel schlüpfte\nund mich bei Finsternis und Nebel in die Stadt begab, um im Gasthaus zum\nStahlhelm das zu trinken, was trinkende Männer nach einer alten\nKonvention „ein Gläschen Wein“ nennen.","So stieg ich denn die Treppen von meiner Mansarde hinab, diese schwer\nzu steigenden Treppen der Fremde, diese durch und durch\nbürgerlichen, gebürsteten, sauberen Treppen eines hochanständigen\nDreifamilienmiethauses, in dessen Dach ich meine Klause habe. Ich weiß\nnicht, wie das zugeht, aber ich, der heimatlose Steppenwolf und einsame\nHasser der kleinbürgerlichen Welt, ich wohne immerzu in richtigen\nBürgerhäusern, das ist eine alte Sentimentalität von mir. Ich wohne\nweder in Palästen noch in Proletarierhäusern, sondern ausgerechnet stets\nin diesen hochanständigen, hochlangweiligen, tadellos gehaltenen\nKleinbürgernestern, wo es nach etwas Terpentin und etwas Seife riecht\nund wo man erschrickt, wenn man einmal die Haustür laut ins Schloß hat\nfallen lassen oder mit schmutzigen Schuhen hereinkommt. Ich liebe diese\nAtmosphäre ohne Zweifel aus meinen Kinderzeiten her, und meine heimliche\nSehnsucht nach so etwas wie Heimat führt mich, hoffnungslos, immer\nwieder diese alten dummen Wege. Nun ja, und ich habe auch den Kontrast\ngern, in dem mein Leben, mein einsames, liebloses und gehetztes, durch\nund durch unordentliches Leben, zu diesem Familien- und Bürgermilieu\nsteht. Ich habe das gern, auf der Treppe diesen Geruch von Stille,\nOrdnung, Sauberkeit, Anstand und Zahmheit zu atmen, der trotz meinem\nBürgerhaß immer etwas Rührendes für mich hat, und habe es gern, dann\nüber die Schwelle meines Zimmers zu treten, wo das alles aufhört, wo\nzwischen den Bücherhaufen die Zigarrenreste liegen und die Weinflaschen\nstehen, wo alles unordentlich, unheimisch und verwahrlost ist und wo\nalles, Bücher, Manuskripte, Gedanken, gezeichnet und durchtränkt ist von\nder Not der Einsamen, von der Problematik des Menschseins, von der\nSehnsucht nach einer neuen Sinngebung für das sinnlos gewordene\nMenschenleben.","Und nun kam ich an der Araukarie vorbei. Nämlich im ersten Stockwerk\ndieses Hauses führt die Treppe am kleinen Vorplatz einer Wohnung\nvorüber, die ist ohne Zweifel noch tadelloser, sauberer und gebürsteter\nals die andern, denn dieser kleine Vorplatz strahlt von einer\nübermenschlichen Gepflegtheit, er ist ein leuchtender kleiner Tempel der\nOrdnung. Auf einem Parkettboden, den zu betreten man sich scheut, stehen\nda zwei zierliche Schemel und auf jedem Schemel ein großer Pflanzentopf,\nim einen wächst eine Azalee, im andern eine ziemlich stattliche\nAraukarie, ein gesunder, strammer Kinderbaum von größter Vollkommenheit,\nund noch die letzte Nadel am letzten Zweig strahlt von frischester\nAbgewaschenheit. Zuweilen, wenn ich mich unbeobachtet weiß, benütze ich\ndiese Stätte als Tempel, setze mich über der Araukarie auf eine\nTreppenstufe, ruhe ein wenig, falte die Hände und blicke andächtig hinab\nin diesen kleinen Garten der Ordnung, dessen rührende Haltung und\neinsame Lächerlichkeit mich irgendwie in der Seele ergreift. Ich vermute\nhinter diesem Vorplatz, gewissermaßen im heiligen Schatten der\nAraukarie, eine Wohnung voll von strahlendem Mahagoni und ein Leben voll\nAnstand und Gesundheit, mit Frühaufstehen, Pflichterfüllung, gemäßigt\nheitern Familienfesten, sonntäglichem Kirchgang und frühem\nSchlafengehen.","Mit gespielter Munterkeit trabte ich über den feucht beschlagenen\nAsphalt der Gassen, tränend und umflort blickten die Laternenlichter\ndurch die kühlfeuchte Trübe und sogen träge Spiegellichter aus dem\nnassen Boden. Meine vergessenen Jünglingsjahre fielen mir ein – wie habe\nich damals solche finstre und trübe Abende im Spätherbst und Winter\ngeliebt, wie gierig und berauscht sog ich damals die Stimmungen der\nEinsamkeit und Melancholie, wenn ich halbe Nächte, in den Mantel\ngehüllt, bei Regen und Sturm durch die feindliche, entblätterte Natur\nlief, einsam auch damals schon, aber voll tiefen Genießens und voll von\nVersen, die ich nachher bei Kerzenlicht in meiner Kammer, auf dem\nBettrand sitzend, aufschrieb! Nun, dies war vorüber, dieser Becher war\nausgetrunken und wurde mir nicht mehr gefüllt. War es schade darum? Es\nwar nicht schade darum. Es war um nichts schade, was vorüber war. Schade\nwar es um das Jetzt und Heute, um all diese ungezählten Stunden und\nTage, die ich verlor, die ich nur erlitt, die weder Geschenke noch\nErschütterungen brachten. Aber Gott sei gelobt, es gab auch Ausnahmen,\nes gab zuweilen, selten, auch andre Stunden, die brachten\nErschütterungen, brachten Geschenke, rissen Wände ein und brachten mich\nVerirrten wieder zurück ans lebendige Herz der Welt. Traurig und doch zu\ninnerst angeregt suchte ich mich des letzten Erlebnisses dieser Art zu\nerinnern. Es war bei einem Konzert gewesen, eine herrliche alte Musik\nwurde gespielt, da war zwischen zwei Takten eines von Holzbläsern\ngespielten Piano mir plötzlich wieder die Tür zum Jenseits aufgegangen,\nich hatte Himmel durchflogen und Gott an der Arbeit gesehen, hatte\nselige Schmerzen gelitten und mich gegen nichts mehr in der Welt\ngewehrt, mich vor nichts mehr in der Welt gefürchtet, hatte alles\nbejaht, hatte an alles mein Herz hingegeben. Es hatte nicht lange\ngedauert, vielleicht eine Viertelstunde, aber es war im Traum jener\nNacht wiedergekehrt und hatte seither, durch alle die öden Tage, hin und\nwieder heimlich aufgeglänzt, ich sah es zuweilen für Minuten deutlich\nwie eine goldene göttliche Spur durch mein Leben gehen, fast immer tief\nim Kot und Staub verschüttet, dann wieder in goldnen Funken\nvorleuchtend, nie mehr verlierbar scheinend und dennoch bald wieder tief\nverloren. Einmal geschah es nachts, daß ich im Wachliegen plötzlich\nVerse sagte, Verse viel zu schön und viel zu wunderlich, als daß ich\ndaran hätte denken dürfen, sie aufzuschreiben, die ich am Morgen nicht\nmehr wußte und die doch in mir verborgen lagen wie die schwere Nuß in\neiner alten brüchigen Schale. Ein andermal kam es beim Lesen eines\nDichters, beim Nachdenken eines Gedankens von Descartes, von Pascal, ein\nandres Mal leuchtete es wieder auf und führte mit goldner Spur weiter in\ndie Himmel, wenn ich bei meiner Geliebten war. Ach, es ist schwer, diese\nGottesspur zu finden inmitten dieses Lebens, das wir führen, inmitten\ndieser so sehr zufriedenen, so sehr bürgerlichen, so sehr geistlosen\nZeit, im Anblick dieser Architekturen, dieser Geschäfte, dieser Politik,\ndieser Menschen! Wie sollte ich nicht ein Steppenwolf und ruppiger\nEremit sein inmitten einer Welt, von deren Zielen ich keines teile, von\nderen Freuden keine zu mir spricht! Ich kann weder in einem Theater noch\nin einem Kino lange aushalten, kann kaum eine Zeitung lesen, selten ein\nmodernes Buch, ich kann nicht verstehen, welche Lust und Freude es ist,\ndie die Menschen in den überfüllten Eisenbahnen und Hotels, in den\nüberfüllten Cafés bei schwüler aufdringlicher Musik, in den Bars und\nVarietés der eleganten Luxusstädte suchen, in den Weltausstellungen, auf\nden Korsos, in den Vorträgen für Bildungsdurstige, auf den großen\nSportplätzen – ich kann all diese Freuden, die mir ja erreichbar wären\nund um die tausend andre sich mühen und drängen, nicht verstehen, nicht\nteilen. Und was hingegen mir in meinen seltnen Freudenstunden geschieht,\nwas für mich Wonne, Erlebnis, Ekstase und Erhebung ist, das kennt und\nsucht und liebt die Welt höchstens in Dichtungen, im Leben findet sie es\nverrückt. Und in der Tat, wenn die Welt recht hat, wenn diese Musik in\nden Cafés, diese Massenvergnügungen, diese amerikanischen, mit so\nwenigem zufriedenen Menschen recht haben, dann habe ich unrecht, dann\nbin ich verrückt, dann bin ich wirklich der Steppenwolf, den ich mich\noft nannte, das in eine ihm fremde und unverständliche Welt verirrte\nTier, das seine Heimat, Luft und Nahrung nicht mehr findet.","Mit diesen gewohnten Gedanken lief ich auf der nassen Straße weiter,\ndurch eins der stillsten und ältesten Quartiere der Stadt. Da stand\ngegenüber, jenseits der Gasse, in der Finsternis eine alte graue\nSteinmauer, die ich immer gerne sah, sie stand immer so alt und\nunbekümmert da, zwischen einer kleinen Kirche und einem alten Hospital,\nauf ihrer rauhen Fläche ließ ich bei Tage oft meine Augen ausruhen, es\ngab wenige so stille, gute, schweigende Flächen in der innern Stadt, wo\nja sonst auf jedem halben Quadratmeter ein Geschäft, ein Advokat, ein\nErfinder, ein Arzt, ein Barbier oder Hühneraugenheilkünstler einem\nseinen Namen entgegenschrie. Auch jetzt wieder sah ich die alte Mauer\nstill in ihrem Frieden liegen, und doch war etwas an ihr verändert, ich\nsah ein kleines hübsches Portal mit einem Spitzbogen in der Mitte der\nMauer und wurde irr, denn ich wußte wahrhaftig nicht mehr, ob dies\nPortal immer dagewesen oder neu hinzugekommen war. Alt sah es ohne\nZweifel aus, uralt; vermutlich hatte die kleine geschlossene Pforte mit\nihrer dunklen Holztür schon vor Jahrhunderten in irgendeinen\nverschlafenen Klosterhof geführt und tat es heute noch, wenn auch das\nKloster nicht mehr stand, und wahrscheinlich hatte ich das Tor\nhundertmal gesehen und bloß nie beachtet, vielleicht war es frisch\nbemalt und fiel mir darum auf. Immerhin blieb ich stehen und blickte\naufmerksam hinüber, ohne doch hinüber zu gehen, die Straße dazwischen\nwar gar so bodenlos erweicht und naß; ich blieb auf dem Trottoir und\nschaute bloß hinüber, es war alles schon sehr nächtig, und mir schien,\num die Pforte sei ein Kranz oder sonst etwas Buntes geflochten. Und\njetzt, wo ich mir Mühe gab, genauer zu sehen, sah ich über dem Portal\nein helles Schild, auf dem stand, so schien mir, irgend etwas\ngeschrieben. Ich strengte die Augen an, und schließlich ging ich trotz\nSchmutz und Pfützen hinüber. Da sah ich über dem Portal auf dem alten\nGraugrün der Mauer einen Fleck matt beschienen, und über den Fleck\nliefen bewegliche bunte Buchstaben und verschwanden alsbald wieder,\nkamen wieder und verflogen. Nun haben sie, dachte ich, richtig auch\ndiese alte gute Mauer zu einer Lichtreklame mißbraucht! Indessen\nentzifferte ich einige der flüchtig erscheinenden Worte, sie waren\nschwer zu lesen und mußten halb erraten werden, die Buchstaben kamen mit\nungleichen Zwischenräumen, so blaß und hinfällig, und erloschen so\nrasch. Der Mann, der damit sein Geschäft machen wollte, war nicht\ntüchtig, er war ein Steppenwolf, armer Kerl; warum ließ er seine\nBuchstaben hier auf dieser Mauer im finstersten Gäßchen der Altstadt\nspielen, zu dieser Tageszeit, bei Regenwetter, wo niemand hier unterwegs\nwar, und warum waren sie so flüchtig, so hingeweht, so launisch und\nunleserlich? Aber halt, jetzt gelang es mir, hintereinander konnte ich\nmehrere Worte erhaschen, die hießen:","Magisches Theater","Eintritt nicht für jedermann","– nicht für jedermann","Ich versuchte die Pforte zu öffnen, die schwere alte Klinke bewegte sich\nauf keinen Druck. Das Buchstabenspiel war zu Ende, plötzlich hatte es\naufgehört, traurig, seiner Vergeblichkeit inne geworden. Ich trat einige\nSchritte zurück, trat tief in den Schmutz, es kamen keine Buchstaben\nmehr, das Spiel war erloschen, lange blieb ich im Schmutz stehen und\nwartete, vergebens.","Da, als ich es aufgab und schon auf den Bürgersteig zurückgekehrt war,\ntropften vor mir her ein paar farbige Lichtbuchstaben über den\nspiegelnden Asphalt.","Ich las:","Nur – – für – – Ver – – rückte!","Ich hatte nasse Füße bekommen und fror, dennoch blieb ich noch eine\nganze Weile wartend stehen. Nichts mehr. Während ich noch stand und\ndachte, wie hübsch die zarten bunten Buchstabenirrlichter über die\nfeuchte Mauer und den schwarzglänzenden Asphalt gegeistert waren, fiel\nmir plötzlich wieder ein Bruchstück aus meinen vorigen Gedanken ein: das\nGleichnis von der golden aufleuchtenden Spur, die so plötzlich wieder\nfern und unauffindbar ist.","Ich fror und ging nun weiter, jener Spur nachträumend, voll Sehnsucht\nnach der Pforte zu einem Zaubertheater, nur für Verrückte. Ich hatte\ninzwischen die Marktgegend betreten, wo es an Abendunterhaltungen nicht\nfehlte, alle paar Schritte hing ein Plakat und warb eine Tafel:\nDamenkapelle – Varieté – Kino – Tanzabend –, aber dies alles war nichts\nfür mich, es war für „Jedermann“, für Normale, welche ich denn auch\nüberall in Scharen durch die Pforten drängen sah. Trotzdem war meine\nTraurigkeit ein wenig aufgehellt, es hatte mich doch ein Gruß der andern\nWelt berührt, ein paar farbige Buchstaben hatten getanzt und auf meiner\nSeele gespielt und an verborgene Akkorde gerührt, ein Schimmer der\ngoldenen Spur war wieder sichtbar gewesen.","Ich suchte die kleine altväterische Kneipe auf, in der sich seit meinem\nersten Aufenthalt in dieser Stadt, vor wohl fünfundzwanzig Jahren,\nnichts geändert hat, auch die Wirtin ist noch die von damals, und manche\nvon den heutigen Gästen saßen auch damals schon hier, am gleichen Platz,\nvor den gleichen Gläsern. Ich trat in das bescheidene Wirtshaus, hier\nwar Zuflucht. Zwar war es nur eine Zuflucht wie etwa die auf der Treppe\nbei der Araukarie, auch hier fand ich nicht Heimat und Gemeinschaft,\nfand nur einen stillen Zuschauerplatz, vor einer Bühne, auf der fremde\nLeute fremde Stücke spielten, aber schon dieser stille Platz war etwas\nwert: keine Menschenmenge, kein Geschrei, keine Musik, bloß ein paar\nruhige Bürger an ungedeckten Holztischen (kein Marmor, kein Emailblech,\nkein Plüsch, kein Messing!) und vor jedem ein Abendtrunk, ein guter\nsolider Wein. Vielleicht waren diese paar Stammgäste, die ich vom Sehen\nalle kannte, richtige Philister und hatten zu Hause in ihren\nPhilisterwohnungen öde Hausaltäre vor blöden Zufriedenheitsgötzen\nstehen, vielleicht auch waren sie vereinsamte und entgleiste Burschen\nwie ich, stille gedankenvolle Säufer über bankrotten Idealen,\nSteppenwölfe und arme Teufel auch sie; ich wußte es nicht. Jeden von\nihnen zog ein Heimweh, eine Enttäuschung, ein Bedürfnis nach Ersatz\nhieher, der Verheiratete suchte hier die Atmosphäre seiner\nJunggesellenzeit, der alte Beamte die Anklänge seiner Studentenjahre,\nalle waren sie ziemlich schweigsam, und alle waren sie Trinker und saßen\ngleich mir lieber vor einem halben Liter Elsässer als vor einer\nDamenkapelle. Hier warf ich Anker, hier war es für eine Stunde\nauszuhalten, auch für zwei. Kaum hatte ich einen Schluck Elsässer\ngenommen, so spürte ich, daß ich heut noch nichts gegessen hatte außer\ndem Frühstücksbrot.","Wunderlich, was der Mensch alles schlucken kann! Wohl zehn Minuten las\nich in einer Zeitung, ließ durch das Auge den Geist eines\nverantwortungslosen Menschen in mich hinein, der die Worte anderer im\nMunde breit kaut und sie eingespeichelt, aber unverdaut wieder von sich\ngibt. Das nahm ich zu mir, eine ganze Spalte lang. Und alsdann fraß ich\nein gutes Stück von der Leber, die man aus dem Leib eines\ntotgeschlagenen Kalbes geschnitten hatte. Wunderlich! Das Beste war der\nElsässer. Ich habe die wilden heftigen Weine nicht gern, wenigstens\nnicht für den Alltag, die mit starken Reizen um sich werfen und berühmte\nSpezialgeschmäcke haben. Ich liebe am meisten ganz reine, leichte,\nbescheidene Landweine ohne besondere Namen, man kann viel davon\nvertragen, und sie schmecken so gut und freundlich nach Land und Erde\nund Himmel und Gehölz. Ein Becher Elsässer und ein Stück gutes Brot, das\nist die beste aller Mahlzeiten. Nun aber hatte ich schon eine Portion\nLeber in mir, aparter Genuß für mich, der selten Fleisch ißt, und hatte\nden zweiten Becher vor mir stehen. Auch das war wunderlich, daß da\nirgendwo in grünen Tälern von gesunden braven Menschen Reben gebaut\nwurden und Wein gekeltert wurde, damit hier und dort in der Welt, weit\nvon ihnen entfernt, einige enttäuschte, still schöppelnde Bürger und\nratlose Steppenwölfe sich ein wenig Mut und Laune aus ihren Bechern\nsaugen konnten.","Meinetwegen, mochte es wunderlich sein! Es war gut, es half, die Laune\nkam. Über den Wortbrei des Zeitungsartikels stieg mir nachträglich ein\nerleichterndes Gelächter auf, und urplötzlich fiel mir die vergessene\nMelodie jenes Bläserpiano wieder ein, wie eine kleine spiegelnde\nSeifenblase stieg sie in mir hoch, glänzte, spiegelte bunt und klein die\nganze Welt und ging sanft wieder auseinander. Wenn es möglich gewesen\nwar, daß diese himmlische kleine Melodie heimlich in meiner Seele\nwurzelte und eines Tages in mir ihre holde Blume wieder mit allen lieben\nFarben emportrieb, konnte ich da ganz verloren sein? War ich auch ein\nverirrtes Tier, das seine Umwelt nicht begriff, so war doch ein Sinn in\nmeinem törichten Leben, etwas in mir gab Antwort, war Empfänger für\nAnrufe aus fernen hohen Welten, in meinem Gehirn waren tausend Bilder\ngestapelt:","Giottosche Engelscharen aus einem kleinen blauen Kirchengewölbe in\nPadua, und neben ihnen gingen Hamlet und die bekränzte Ophelia, schöne\nGleichnisse aller Trauer und alles Mißverständnisses in der Welt, da\nstand im brennenden Ballon der Luftschiffer Gianozzo und stieß ins Horn,\ntrug Attila Schmelzle seinen neuen Hut in der Hand, stieß der Borobudur\nsein Skulpturengebirg in die Lüfte. Und mochten alle diese schönen\nGestalten auch in tausend andern Herzen leben, es waren noch zehntausend\nandere, unbekannte Bilder und Klänge da, deren Heimat und sehendes Auge\nund hörendes Ohr einzig in mir innen lebte. Die alte Hospitalmauer mit\ndem alten, verwitterten, fleckigen Graugrün, in deren Rissen und\nVerwitterungen tausend Fresken zu ahnen waren – wer gab ihr Antwort, wer\nließ sie in seine Seele ein, wer liebte sie, wer empfand den Zauber\nihrer zart hinsterbenden Farben? Die alten Bücher der Mönche, mit den\nsanft leuchtenden Miniaturen, und die von ihrem Volk vergessenen Bücher\nder deutschen Dichter vor zweihundert und vor hundert Jahren, alle die\nabgegriffenen und stockfleckigen Bände, und die Drucke und Handschriften\nder alten Musiker, die festen, gelblichen Notenblätter mit ihren\nerstarrten Tonträumen – wer hörte ihre geistvollen, ihre schelmischen\nund sehnsüchtigen Stimmen, wer trug ein Herz voll von ihrem Geist und\nihrem Zauber durch eine andere, ihnen entfremdete Zeit? Wer gedachte\nnoch jener kleinen, zähen Zypresse hoch am Berge über Gubbio, die von\neinem Steinsturz geknickt und gespalten war und doch das Leben\nfestgehalten und einen neuen, spärlichen Notwipfel getrieben hatte? Wer\nward der fleißigen Hausmutter im ersten Stock und ihrer blanken\nAraukarie gerecht? Wer las nachts überm Rhein die Wolkenschriften der\nziehenden Nebel? Es war der Steppenwolf. Und wer suchte über den\nTrümmern seines Lebens den zerflatternden Sinn, litt das scheinbar\nUnsinnige, lebte das scheinbar Verrückte, hoffte heimlich im letzten\nirren Chaos noch Offenbarung und Gottesnähe?","Ich hielt meinen Becher fest, den die Wirtin mir wieder füllen wollte,\nund stand auf. Ich brauchte keinen Wein mehr. Die goldne Spur war\naufgeblitzt, ich war ans Ewige erinnert, an Mozart, an die Sterne. Ich\nkonnte wieder für eine Stunde atmen, konnte leben, durfte dasein,\nbrauchte nicht Qualen zu leiden, mich nicht zu fürchten, mich nicht zu\nschämen.","Der vom kalten Wind gezauste dünne Sprühregen klirrte um die Laternen\nund blitzte mit glasigem Geflimmer, als ich auf die stillgewordene\nStraße hinaustrat. Jetzt wohin? Hätte ich in diesem Augenblick über\neinen Wunschzauber verfügt, so hätte sich mir nun ein kleiner hübscher\nSaal dargeboten, Stil Louis Seize, wo ein paar gute Musiker mir zwei,\ndrei Stücke von Händel und Mozart gespielt hätten. Dazu wäre ich jetzt\ngestimmt gewesen und hätte die kühle, edle Musik geschlürft, wie Götter\nNektar schlürfen. Oh, wenn ich jetzt einen Freund gehabt hätte, einen\nFreund in irgendeiner Dachkammer, der bei einer Kerze grübelt und die\nVioline danebenliegen hat! Wie hätte ich ihn in seiner Nachtstille\nbeschlichen, wäre lautlos durchs winklige Treppenhaus emporgeklettert\nund hätte ihn überrascht, und wir hätten mit Gespräch und Musik ein paar\nüberirdische Nachtstunden gefeiert! Oft hatte ich dies Glück gekostet,\neinst, in vergangenen Jahren, aber auch dies hatte sich mit der Zeit von\nmir entfernt und losgelöst, verwelkte Jahre lagen zwischen hier und\ndort.","Zögernd trat ich den Heimweg an, schlug den Mantelkragen hoch und stieß\nden Stock aufs nasse Pflaster. Mochte ich den Weg noch so langsam\nzurücklegen, allzubald würde ich wieder in meiner Mansarde sitzen, in\nmeiner kleinen Scheinheimat, die ich nicht liebte und doch nicht\nentbehren konnte, denn die Zeit war für mich vorüber, wo ich eine\nwinterliche Regennacht laufend im Freien verbringen konnte. Nun, in\nGottes Namen, ich wollte mir die gute Abendlaune nicht verderben lassen,\nnicht vom Regen, nicht von der Gicht, nicht von der Araukarie, und wenn\nkein Kammerorchester zu haben und auch kein einsamer Freund mit einer\nVioline zu finden war, so klang jene holde Melodie doch in mir innen,\nund ich konnte sie, leise summend im rhythmischen Atemholen, doch\nandeutend mir selber vorspielen. Sinnend schritt ich weiter. Nein, es\nging auch ohne die Kammermusik und ohne den Freund, und es war\nlächerlich, sich in machtlosem Verlangen nach Wärme zu verzehren.\nEinsamkeit ist Unabhängigkeit, ich hatte sie mir gewünscht und mir\nerworben in langen Jahren. Sie war kalt, o ja, sie war aber auch still,\nwunderbar still und groß wie der kalte stille Raum, in dem die Sterne\nsich drehen.","Aus einem Tanzlokal, an dem ich vorüberkam, scholl mir, heiß und roh wie\nder Dampf von rohem Fleisch, eine heftige Jazzmusik entgegen. Ich blieb\neinen Augenblick stehen; immer hatte diese Art von Musik, so sehr ich\nsie verabscheute, einen heimlichen Reiz für mich. Jazz war mir zuwider,\naber sie war mir zehnmal lieber als alle akademische Musik von heute,\nsie traf mit ihrer frohen rohen Wildheit auch bei mir tief in die\nTriebwelt und atmete eine naive redliche Sinnlichkeit.","Ich stand einen Augenblick schnuppernd, roch an der blutigen grellen\nMusik, witterte böse und lüstern die Atmosphäre dieser Säle. Die eine\nHälfte dieser Musik, die lyrische, war schmalzig, überzuckert und troff\nvon Sentimentalität, die andre Hälfte war wild, launisch und kraftvoll,\nund doch gingen beide Hälften naiv und friedlich zusammen und gaben ein\nGanzes. Untergangsmusik war es, im Rom der letzten Kaiser mußte es\nähnliche Musik gegeben haben. Natürlich war sie, mit Bach und Mozart und\nwirklicher Musik verglichen, eine Schweinerei – aber das war all unsre\nKunst, all unser Denken, all unsre Scheinkultur, sobald man sie mit\nwirklicher Kultur verglich. Und diese Musik hatte den Vorzug einer\ngroßen Aufrichtigkeit, einer liebenswerten unverlogenen Negerhaftigkeit\nund einer frohen, kindlichen Laune. Sie hatte etwas vom Neger und etwas\nvom Amerikaner, der uns Europäern in all seiner Stärke so knabenhaft\nfrisch und kindlich erscheint. Würde Europa auch so werden? War es schon\nauf dem Weg dazu? Waren wir alten Kenner und Verehrer des einstigen\nEuropa, der einstigen echten Musik, der ehemaligen echten Dichtung,\nwaren wir bloß eine kleine dumme Minorität von komplizierten\nNeurotikern, die morgen vergessen und verlacht würden? War das, was wir\n„Kultur“, was wir Geist, was wir Seele, was wir schön, was wir heilig\nnannten, war das bloß ein Gespenst, schon lange tot und nur von uns paar\nNarren noch für echt und lebendig gehalten? War es vielleicht überhaupt\nnie echt und lebendig gewesen? War das, worum wir Narren uns mühten,\nschon immer vielleicht nur ein Phantom gewesen?","Das alte Stadtviertel nahm mich auf, erloschen und unwirklich stand im\nGrau die kleine Kirche. Plötzlich fiel mir das Erlebnis vom Abend wieder\nein, mit der rätselhaften Spitzbogentür, mit der rätselhaften Tafel\ndarüber, mit den spöttisch tanzenden Lichtbuchstaben. Wie hatten ihre\nInschriften gelautet? „Eintritt nicht für jedermann.“ Und: „Nur für\nVerrückte.“ Prüfend blickte ich zu der alten Mauer hinüber, heimlich\nwünschend, der Zauber möge wieder beginnen, die Inschrift mich\nVerrückten einladen, das kleine Tor mich einlassen. Dort vielleicht war\ndas, was ich begehrte, dort vielleicht würde meine Musik gespielt?","Gelassen sah die dunkle steinerne Wand mich an, in tiefer Dämmerung,\nzugeschlossen, tief in ihren Traum versunken. Und nirgends ein Tor,\nnirgends ein Spitzbogen, nur dunkle, stille Mauer ohne Loch. Lächelnd\nging ich weiter, nickte dem Gemäuer freundlich zu. „Schlaf wohl, Mauer,\nich wecke dich nicht. Die Zeit wird kommen, da sie dich einreißen oder\ndich mit ihren habgierigen Firmenschildern bekleben, aber noch bist du\nda, noch bist du schön und still und bist mir lieb.“","Aus einer schwarzen Gassenschlucht dicht vor mir gespien erschreckte\nmich ein Mensch, ein einsamer später Heimkehrer mit müdem Schritt, eine\nMütze auf dem Kopf, mit einer blauen Bluse angetan, über die Schulter\ntrug er eine Stange mit einem Plakat, vor dem Bauche trug er am Riemen\neine offene Lade, wie sie die Verkäufer an Jahrmärkten tragen. Müde\nschritt er vor mir her, sah sich nicht nach mir um, sonst hätte ich ihn\ngegrüßt und ihm eine Zigarre geschenkt. Im Licht der nächsten Laterne\nversuchte ich seine Standarte zu lesen, sein rotes Plakat an der Stange,\naber es schwankte hin und her, ich konnte nichts entziffern. Da rief ich\nihn an und bat ihn, mir das Plakat zu zeigen. Er blieb stehen und hielt\nseine Stange etwas gerader, da konnte ich tanzende, taumelnde Buchstaben\nlesen:","Anarchistische Abendunterhaltung!\nMagisches Theater!\nEintritt nicht für jed...","„Sie habe ich ja gesucht“, rief ich freudig. „Was ist das mit Ihrer\nAbendunterhaltung? Wo ist sie? Wann?“","Er lief schon wieder.","„Nicht für jedermann“, sagte er gleichgültig, mit schläfriger Stimme,\nund lief. Er hatte genug, er wollte heim.","„Halt“, rief ich und lief ihm nach. „Was haben Sie da in Ihrem Kasten?\nIch will Ihnen etwas abkaufen.“","Ohne anzuhalten, griff der Mann in seinen Kasten, mechanisch, zog ein\nkleines Büchlein heraus und hielt es mir hin. Ich nahm es schnell und\nsteckte es ein. Während ich an meinem Mantel knöpfte und Geld\nhervorsuchen wollte, bog er seitwärts in einen Torweg, zog das Tor\nhinter sich zu und war verschwunden. Im Hof klangen seine schweren\nSchritte, auf Steinpflaster erst, dann auf einer hölzernen Treppe, dann\nhörte ich nichts mehr. Und plötzlich war auch ich sehr müde und hatte\ndas Gefühl, es sei sehr spät und es sei gut, jetzt heimzukommen. Ich\nlief rascher und war bald durch die schlafende Vorstadtgasse in meine\nGegend zwischen den Wallanlagen gelangt, wo in kleinen saubern\nMiethäusern hinter etwas Rasen und Efeu die Beamten und kleinen Rentner\nwohnen. Am Efeu, am Rasen, an der kleinen Tanne vorbei erreichte ich die\nHaustür, fand das Schlüsselloch, fand den Drücker für das Licht, schlich\nan den Glastüren, an den polierten Schränken und Topfpflanzen vorüber\nund schloß meine Stube auf, meine kleine Scheinheimat, wo der Lehnstuhl\nund der Ofen, das Tintenfaß und die Malschachtel, der Novalis und der\nDostojewski auf mich warteten, so, wie auf andere, auf richtige\nMenschen, wenn sie heimkommen, die Mutter oder Frau, die Kinder, die\nMägde, die Hunde, die Katzen warten.","Als ich den nassen Mantel auszog, fiel das kleine Buch mir wieder in die\nHände. Ich zog es heraus, es war ein dünnes, schlecht auf schlechtem\nPapier gedrucktes Jahrmarktsbüchlein, so wie jene Hefte „Der Mensch im\nJanuar geboren“ oder „Wie werde ich in acht Tagen um zwanzig Jahre\njünger?“","Aber als ich mich in den Lehnstuhl genistet und die Lesebrille\naufgesetzt hatte, las ich mit Verwunderung und plötzlich aufschießendem\nSchicksalsgefühl auf dem Umschlag dieses Jahrmarktheftes den Titel:\n„Traktat vom Steppenwolf. Nicht für jedermann.“","Und folgendes war der Inhalt der Schrift, die ich mit stets wachsender\nSpannung in einem Zuge las:","Tractat\nvom\nSteppenwolf","Nur\nfür\nVerrückte","Es war einmal einer namens Harry, genannt der Steppenwolf. Er ging\nauf zwei Beinen, trug Kleider und war ein Mensch, aber eigentlich\nwar er doch eben ein Steppenwolf. Er hatte vieles von dem gelernt,\nwas Menschen mit gutem Verstande lernen können, und war ein ziemlich\nkluger Mann. Was er aber nicht gelernt hatte, war dies: mit sich und\nseinem Leben zufrieden zu sein. Dies konnte er nicht, er war ein\nunzufriedener Mensch. Das kam wahrscheinlich daher, daß er im Grunde\nseines Herzens jederzeit wußte (oder zu wissen glaubte), daß er\neigentlich gar kein Mensch, sondern ein Wolf aus der Steppe sei. Es\nmögen sich kluge Menschen darüber streiten, ob er nun wirklich ein\nWolf war, ob er einmal, vielleicht schon vor seiner Geburt, aus\neinem Wolf in einen Menschen verzaubert worden war oder ob er als\nMensch geboren, aber mit der Seele eines Steppenwolfes begabt und\nvon ihr besessen war oder aber ob dieser Glaube, daß er eigentlich\nein Wolf sei, bloß eine Einbildung oder Krankheit von ihm war. Zum\nBeispiel wäre es ja möglich, daß dieser Mensch etwa in seiner\nKindheit wild und unbändig und unordentlich war, daß seine Erzieher\nversucht hatten, die Bestie in ihm totzukriegen, und ihm gerade\ndadurch die Einbildung und den Glauben schufen, daß er in der Tat\neigentlich eine Bestie sei, nur mit einem dünnen Überzug von\nErziehung und Menschentum darüber. Man könnte hierüber lang und\nunterhaltend sprechen und sogar Bücher darüber schreiben; dem\nSteppenwolf aber wäre damit nicht gedient, denn für ihn war es ganz\neinerlei, ob der Wolf in ihn hineingehext oder -geprügelt oder aber\nnur eine Einbildung seiner Seele sei. Was andre darüber denken\nmochten und auch was er selbst darüber denken mochte, das war für\nihn nichts wert, das holte den Wolf doch nicht aus ihm heraus.","Der Steppenwolf hatte also zwei Naturen, eine menschliche und eine\nwölfische, dies war sein Schicksal, und es mag wohl sein, daß dies\nSchicksal kein so besonderes und seltenes war. Es sollen schon viele\nMenschen gesehen worden sein, welche viel vom Hund oder vom Fuchs,\nvom Fisch oder von der Schlange in sich hatten, ohne daß sie darum\nbesondre Schwierigkeiten gehabt hätten. Bei diesen Menschen lebte\neben der Mensch und der Fuchs, der Mensch und der Fisch\nnebeneinander her, und keiner tat dem andern weh, einer half sogar\ndem andern, und in manchem Manne, der es weit gebracht hat und\nbeneidet wird, war es mehr der Fuchs oder Affe als der Mensch, der\nsein Glück gemacht hat. Dies ist ja jedermann bekannt. Bei Harry\nhingegen war es anders, in ihm liefen Mensch und Wolf nicht\nnebeneinander her, und noch viel weniger halfen sie einander,\nsondern si
