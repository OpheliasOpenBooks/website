e lagen in ständiger Todfeindschaft gegeneinander, und\neiner lebte dem andern lediglich zu Leide, und wenn Zwei in Einem\nBlut und Einer Seele miteinander todfeind sind, dann ist das ein\nübles Leben. Nun, jeder hat sein Los, und leicht ist keines.","Bei unsrem Steppenwolfe nun war es so, daß er in seinem Gefühl zwar\nbald als Wolf, bald als Mensch lebte, wie es bei allen Mischwesen\nder Fall ist, daß aber, wenn er Wolf war, der Mensch in ihm stets\nzuschauend, urteilend und richtend auf der Lauer lag – und in den\nZeiten, wo er Mensch war, tat der Wolf ebenso. Zum Beispiel, wenn\nHarry als Mensch einen schönen Gedanken hatte, eine feine, edle\nEmpfindung fühlte oder eine sogenannte gute Tat verrichtete, dann\nbleckte der Wolf in ihm die Zähne und lachte und zeigte ihm mit\nblutigem Hohn, wie lächerlich dieses ganze edle Theater einem\nSteppentier zu Gesicht stehe, einem Wolf, der ja in seinem Herzen\nganz genau darüber Bescheid wußte, was ihm behage, nämlich einsam\ndurch Steppen zu traben, zuzeiten Blut zu saufen oder eine Wölfin zu\njagen, – und, vom Wolf aus gesehen, wurde dann jede menschliche\nHandlung schauerlich komisch und verlegen, dumm und eitel. Aber ganz\nebenso war es, wenn Harry sich als Wolf fühlte und benahm, wenn er\nandern die Zähne zeigte, wenn er Haß und Todfeindschaft gegen alle\nMenschen und ihre verlogenen und entarteten Manieren und Sitten\nfühlte. Dann nämlich lag das Menschenteil in ihm auf der Lauer,\nbeobachtete den Wolf, nannte ihn Vieh und Bestie und verdarb und\nvergällte ihm alle Freude an seinem einfachen, gesunden und wilden\nWolfswesen.","So war dies mit dem Steppenwolf beschaffen, und man kann sich\nvorstellen, daß Harry nicht gerade ein angenehmes und glückliches\nLeben hatte. Doch soll damit nicht gesagt sein, daß er in ganz\nbesonderem Grade unglücklich gewesen sei (obwohl es ihm selber\nallerdings so erschien, wie denn jeder Mensch die ihm zufallenden\nLeiden für die größten hält). Man sollte das von keinem Menschen\nsagen. Auch wer keinen Wolf in sich hat, braucht darum nicht\nglücklich zu sein. Und auch das unglücklichste Leben hat seine\nSonnenstunden und seine kleinen Glücksblumen zwischen dem Sand und\nGestein. So war es denn auch bei dem Steppenwolf. Er war meistens\nsehr unglücklich, das ist nicht zu leugnen, und unglücklich konnte\ner auch andre machen, nämlich wenn er sie liebte und sie ihn. Denn\nalle, die ihn lieb gewannen, sahen immer nur die eine Seite in ihm.\nManche liebten ihn als einen feinen, klugen und eigenartigen\nMenschen und waren dann entsetzt und enttäuscht, wenn sie plötzlich\nden Wolf in ihm entdecken mußten. Und das mußten sie, denn Harry\nwollte, wie jedes Wesen, als Ganzes geliebt werden und konnte darum\ngerade vor denen, an deren Liebe ihm viel gelegen war, den Wolf\nnicht verbergen und weglügen. Es gab aber auch solche, die gerade\nden Wolf in ihm liebten, gerade das Freie, Wilde, Unzähmbare,\nGefährliche und Starke, und diesen wieder war es dann\naußerordentlich enttäuschend und jämmerlich, wenn plötzlich der\nwilde, böse Wolf auch noch ein Mensch war, auch noch Sehnsucht nach\nGüte und Zartheit in sich hatte, auch noch Mozart hören, Verse lesen\nund Menschheitsideale haben wollte. Gerade diese waren meistens\nbesonders enttäuscht und böse, und so brachte der Steppenwolf seine\neigene Doppeltheit und Zwiespältigkeit auch in alle fremden\nSchicksale hinein, die er berührte.","Wer nun aber meint, den Steppenwolf zu kennen und sein klägliches,\nzerrissenes Leben sich vorstellen zu können, der ist dennoch im\nIrrtum, er weiß noch lange nicht alles. Er weiß nicht, daß es (wie\nkeine Regel ohne Ausnahme und wie ein einziger Sünder unter\nUmständen Gott lieber ist als neunundneunzig Gerechte) – daß es bei\nHarry immerhin auch Ausnahmen und Glücksfälle gab, daß er zuweilen\nden Wolf, zuweilen den Menschen auch rein und ungestört in sich\natmen, denken und fühlen konnte, ja, daß beide manchmal, in sehr\nseltenen Stunden, Frieden schlossen und einander zu Liebe lebten, so\ndaß nicht bloß der eine schlief, während der andre wachte, sondern\nbeide einander stärkten und jeder den andern verdoppelte. Auch im\nLeben dieses Mannes schien, wie überall in der Welt, zuweilen alles\nGewohnte, Alltägliche, Erkannte und Regelmäßige bloß den Zweck zu\nhaben, hie und da eine sekundenkurze Pause zu erleben, durchbrochen\nzu werden und dem Außerordentlichen, dem Wunder, der Gnade Platz zu\nmachen. Ob nun diese kurzen, seltenen Glücksstunden das schlimme Los\ndes Steppenwolfes ausglichen und milderten, so daß Glück und Leid\nsich schließlich die Wage hielten, oder ob vielleicht sogar das\nkurze, aber starke Glück jener wenigen Stunden alles Leid aufsog und\nein Plus ergab, das ist nun wieder eine Frage, über welche müßige\nLeute nach Belieben brüten mögen. Auch der Wolf brütete oft darüber,\nund das waren seine müßigen und unnützen Tage.","Hierzu muß eines noch gesagt werden. Es gibt ziemlich viele Menschen\nvon ähnlicher Art, wie Harry einer war, viele Künstler namentlich\ngehören dieser Art an. Diese Menschen haben alle zwei Seelen, zwei\nWesen in sich, in ihnen ist Göttliches und Teuflisches, ist\nmütterliches und väterliches Blut, ist Glücksfähigkeit und\nLeidensfähigkeit ebenso feindlich und verworren neben- und\nineinander vorhanden, wie Wolf und Mensch in Harry es waren. Und\ndiese Menschen, deren Leben ein sehr unruhiges ist, erleben zuweilen\nin ihren seltenen Glücksaugenblicken so Starkes und unnennbar\nSchönes, der Schaum des Augenblicksglückes spritzt zuweilen so hoch\nund blendend über das Meer des Leides hinaus, daß dies kurze\naufleuchtende Glück ausstrahlend auch andere berührt und bezaubert.\nSo entstehen, als kostbarer flüchtiger Glücksschaum über dem Meer\ndes Leides, alle jene Kunstwerke, in welchen ein einzelner leidender\nMensch sich für eine Stunde so hoch über sein eigenes Schicksal\nerhob, daß sein Glück wie ein Stern strahlt und allen denen, die es\nsehen, wie etwas Ewiges und wie ihr eigener Glückstraum erscheint.\nAlle diese Menschen, mögen ihre Taten und Werke heißen wie sie\nwollen, haben eigentlich überhaupt kein Leben, das heißt, ihr Leben\nist kein Sein, hat keine Gestalt, sie sind nicht Helden oder\nKünstler oder Denker in der Art, wie andere Richter, Ärzte,\nSchuhmacher oder Lehrer sind, sondern ihr Leben ist eine ewige,\nleidvolle Bewegung und Brandung, ist unglücklich und schmerzvoll\nzerrissen und ist schauerlich und sinnlos, sobald man den Sinn nicht\nin ebenjenen seltenen Erlebnissen, Taten, Gedanken und Werken zu\nsehen bereit ist, die über dem Chaos eines solchen Lebens\naufstrahlen. Unter den Menschen dieser Art ist der gefährliche und\nschreckliche Gedanke entstanden, daß vielleicht das ganze\nMenschenleben nur ein arger Irrtum, eine heftige und mißglückte\nFehlgeburt der Urmutter, ein wilder und grausig fehlgeschlagener\nVersuch der Natur sei. Unter ihnen ist aber auch der andere Gedanke\nentstanden, daß der Mensch vielleicht nicht bloß ein halbwegs\nvernünftiges Tier, sondern ein Götterkind und zur Unsterblichkeit\nbestimmt sei.","Jede Menschenart hat ihre Kennzeichen, ihre Signaturen, jede hat\nihre Tugenden und Laster, jede ihre Todsünde. Es gehörte zu den\nZeichen des Steppenwolfes, daß er ein Abendmensch war. Der Morgen\nwar für ihn eine schlimme Tageszeit, die er fürchtete und die ihm\nniemals Gutes gebracht hat. Nie ist er an irgendeinem Morgen seines\nLebens richtig froh gewesen, nie hat er in den Stunden vor Mittag\nGutes getan, gute Einfälle gehabt, sich und anderen Freude bereiten\nkönnen. Erst im Laufe des Nachmittags wurde er langsam warm und\nlebendig, und erst gegen Abend wurde er, an seinen guten Tagen,\nfruchtbar, regsam und zuweilen glühend und freudig. Damit hing auch\nsein Bedürfnis nach Einsamkeit und nach Unabhängigkeit zusammen. Nie\nhat ein Mensch ein tieferes, leidenschaftlicheres Bedürfnis nach\nUnabhängigkeit gehabt als er. In seiner Jugendzeit, als er noch arm\nwar und Mühe hatte, sein Brot zu verdienen, zog er es vor, zu\nhungern und in zerrissenen Kleidern zu gehen, nur um dafür ein\nStückchen Unabhängigkeit zu retten. Er hat sich nie für Geld und\nWohlleben, nie an Frauen oder an Mächtige verkauft und hat\nhundertmal das, was in aller Welt Augen sein Vorteil und Glück war,\nweggeworfen und ausgeschlagen, um dafür seine Freiheit zu bewahren.\nKeine Vorstellung war ihm verhaßter und grauenhafter als die, daß er\nein Amt ausüben, eine Tages- und Jahreseinteilung innehalten,\nanderen gehorchen müßte. Ein Bureau, eine Kanzlei, eine Amtsstube,\ndas war ihm verhaßt wie der Tod, und das Entsetzlichste, was er im\nTraum erleben konnte, war die Gefangenschaft in einer Kaserne. All\ndiesen Verhältnissen wußte er sich zu entziehen, oft unter großen\nOpfern. Hierin lag seine Stärke und Tugend, hier war er unbeugsam\nund unbestechlich, hier war sein Charakter fest und gradlinig.\nAllein mit dieser Tugend hing wieder sein Leid und Schicksal aufs\nengste zusammen. Es ging ihm, wie es allen ergeht: was er, aus einem\ninnersten Trieb seines Wesens, aufs hartnäckigste suchte und\nanstrebte, das ward ihm zuteil, aber mehr als für Menschen gut ist.\nEs wurde anfänglich sein Traum und Glück, dann sein bittres\nSchicksal. Der Machtmensch geht an der Macht zugrunde, der\nGeldmensch am Geld, der Unterwürfige am Dienen, der Lustsucher an\nder Lust. Und so ging der Steppenwolf an seiner Unabhängigkeit\nzugrunde. Er erreichte sein Ziel, er wurde immer unabhängiger,\nniemand hatte ihm zu befehlen, nach niemandem hatte er sich zu\nrichten, frei und allein bestimmte er über sein Tun und Lassen. Denn\njeder starke Mensch erreicht unfehlbar das, was ein wirklicher Trieb\nihn suchen heißt. Aber mitten in der erreichten Freiheit nahm Harry\nplötzlich wahr, daß seine Freiheit ein Tod war, daß er allein stand,\ndaß die Welt ihn auf eine unheimliche Weise in Ruhe ließ, daß die\nMenschen ihn nichts mehr angingen, ja er selbst sich nicht, daß er\nin einer immer dünner und dünner werdenden Luft von\nBeziehungslosigkeit und Vereinsamung langsam erstickte. Denn nun\nstand es so, daß Alleinsein und Unabhängigkeit nicht mehr sein\nWunsch und Ziel war, sondern sein Los, seine Verurteilung, daß der\nZauberwunsch getan und nicht mehr zurückzunehmen war, daß es nichts\nmehr half, wenn er voll Sehnsucht und guten Willens die Arme\nausstreckte und zu Bindung und Gemeinsamkeit bereit war: man ließ\nihn jetzt allein. Dabei war er nicht etwa verhaßt und den Menschen\nzuwider. Im Gegenteil, er hatte sehr viele Freunde. Viele hatten ihn\ngern. Aber es war immer nur Sympathie und Freundlichkeit, was er\nfand, man lud ihn ein, man beschenkte ihn, schrieb ihm nette Briefe,\naber nahe an ihn heran kam niemand, Bindung entstand nirgends, sein\nLeben zu teilen war niemand gewillt und fähig. Es umgab ihn jetzt\ndie Luft der Einsamen, eine stille Atmosphäre, ein Weggleiten der\nUmwelt, eine Unfähigkeit zu Beziehungen, gegen welche kein Wille und\nkeine Sehnsucht etwas vermochte. Dies war eins der wichtigen\nKennzeichen seines Lebens.","Ein anderes war, daß er zu den Selbstmördern gehörte. Hier muß\ngesagt werden, daß es falsch ist, wenn man nur jene Menschen\nSelbstmörder nennt, welche sich wirklich umbringen. Unter diesen\nsind sogar viele, die nur gewissermaßen aus Zufall Selbstmörder\nwerden, zu deren Wesen das Selbstmördertum nicht notwendig gehört.\nUnter den Menschen ohne Persönlichkeit, ohne starke Prägung, ohne\nstarkes Schicksal, unter den Dutzend- und Herdenmenschen sind\nmanche, die durch Selbstmord umkommen, ohne darum in ihrer ganzen\nSignatur und Prägung dem Typus der Selbstmörder anzugehören, während\nwiederum von jenen, welche dem Wesen nach zu den Selbstmördern\nzählen, sehr viele, vielleicht die meisten, niemals tatsächlich Hand\nan sich legen. Der „Selbstmörder“ – und Harry war einer – braucht\nnicht notwendig in einem besonders starken Verhältnis zum Tode zu\nleben – dies kann man tun, auch ohne Selbstmörder zu sein. Aber dem\nSelbstmörder ist es eigentümlich, daß er sein Ich, einerlei, ob mit\nRecht oder Unrecht, als einen besonders gefährlichen, zweifelhaften\nund gefährdeten Keim der Natur empfindet, daß er sich stets\naußerordentlich exponiert und gefährdet vorkommt, so, als stünde er\nauf allerschmalster Felsenspitze, wo ein kleiner Stoß von außen oder\neine winzige Schwäche von innen genügt, um ihn ins Leere fallen zu\nlassen. Diese Art von Menschen ist in ihrer Schicksalslinie dadurch\ngekennzeichnet, daß der Selbstmord für sie die wahrscheinlichste\nTodesart ist, wenigstens in ihrer eigenen Vorstellung. Voraussetzung\ndieser Stimmung, welche fast immer schon in früher Jugend sichtbar\nwird und diese Menschen ihr Leben lang begleitet, ist nicht etwa\neine besonders schwache Lebenskraft, man findet im Gegenteil unter\nden „Selbstmördern“ außerordentlich zähe, begehrliche und auch kühne\nNaturen. Aber so wie es Naturen gibt, die bei der kleinsten\nErkrankung zu Fieber neigen, so neigen diese Naturen, die wir\n„Selbstmörder“ heißen und die stets sehr empfindlich und sensibel\nsind, bei der kleinsten Erschütterung dazu, sich intensiv der\nVorstellung des Selbstmordes hinzugeben. Hätten wir eine\nWissenschaft, die den Mut und die Verantwortungskraft besäße, sich\nmit dem Menschen zu beschäftigen, statt bloß mit den Mechanismen der\nLebenserscheinungen, hätten wir etwas wie eine Anthropologie, etwas\nwie eine Psychologie, so wären diese Tatsachen jedem bekannt.","Was wir hier über die Selbstmörder sagten, bezieht sich alles\nselbstverständlich nur auf die Oberfläche, es ist Psychologie, also\nein Stück Physik. Metaphysisch betrachtet sieht die Sache anders und\nviel klarer aus, denn bei solcher Betrachtung stellen die\n„Selbstmörder“ sich uns dar als die vom Schuldgefühl der\nIndividuation Betroffenen, als jene Seelen, welchen nicht mehr die\nVollendung und Ausgestaltung ihrer selbst als Lebensziel erscheint,\nsondern ihre Auflösung, zurück zur Mutter, zurück zu Gott, zurück\nins All. Von diesen Naturen sind sehr viele vollkommen unfähig,\njemals den realen Selbstmord zu begehen, weil sie dessen Sünde tief\nerkannt haben. Für uns sind sie dennoch Selbstmörder, denn sie sehen\nim Tod, nicht im Leben den Erlöser, sie sind bereit, sich\nwegzuwerfen und hinzugeben, auszulöschen und zum Anfang\nzurückzukehren.","Wie jede Kraft auch zu einer Schwäche werden kann (ja unter\nUmständen werden _muß_), so kann umgekehrt der typische Selbstmörder\naus seiner anscheinenden Schwäche oft eine Kraft und eine Stütze\nmachen, ja er tut dies außerordentlich häufig. Zu diesen Fällen\ngehört auch der Harrys, des Steppenwolfes. Wie Tausende von\nseinesgleichen, machte er aus der Vorstellung, daß ihm zu jeder\nStunde der Weg in den Tod offenstehe, nicht bloß ein\njugendlich-melancholisches Phantasiespiel, sondern baute sich aus\nebendiesem Gedanken einen Trost und eine Stütze. Zwar rief in ihm,\nwie in allen Menschen seiner Art, jede Erschütterung, jeder Schmerz,\njede üble Lebenslage sofort den Wunsch wach, sich durch den Tod zu\nentziehen. Allmählich aber schuf er sich aus dieser Neigung gerade\neine dem Leben dienliche Philosophie. Die Vertrautheit mit dem\nGedanken, daß jener Notausgang beständig offen stehe, gab ihm Kraft,\nmachte ihn neugierig auf das Auskosten von Schmerzen und üblen\nZuständen, und wenn es ihm recht elend ging, konnte er zuweilen mit\ngrimmiger Freude, einer Art Schadenfreude, empfinden: „Ich bin doch\nneugierig zu sehen, wie viel eigentlich ein Mensch auszuhalten\nvermag! Ist die Grenze des noch Erträglichen erreicht, dann brauche\nich ja bloß die Tür zu öffnen und bin entronnen.“ Es gibt sehr viele\nSelbstmörder, denen aus diesem Gedanken ungewöhnliche Kräfte kommen.","Andrerseits ist allen Selbstmördern auch der Kampf gegen die\nVersuchung zum Selbstmord vertraut. Jeder weiß, in irgendeinem\nWinkel seiner Seele, recht wohl, daß Selbstmord zwar ein Ausweg,\naber doch nur ein etwas schäbiger und illegitimer Notausgang ist,\ndaß es im Grunde edler und schöner ist, sich vom Leben selbst\nbesiegen und hinstrecken zu lassen als von der eigenen Hand. Dies\nWissen, dies schlechte Gewissen, dessen Quelle dieselbe ist wie etwa\nfür das böse Gewissen der sogenannten Selbstbefriediger, veranlaßt\ndie meisten „Selbstmörder“ zu einem dauernden Kampf gegen ihre\nVersuchung. Sie kämpfen, wie der Kleptomane gegen sein Laster\nkämpft. Auch dem Steppenwolf war dieser Kampf wohl bekannt, mit\nvielerlei wechselnden Waffen hatte er ihn gestritten. Schließlich\nkam er, im Alter von etwa siebenundvierzig Jahren, auf einen\nglücklichen und nicht humorlosen Einfall, der ihm oft Freude machte.\nEr setzte seinen fünfzigsten Geburtstag als den Tag fest, an welchem\ner sich den Selbstmord erlauben wolle. An diesem Tag, so vereinbarte\ner mit sich selber, sollte es ihm freistehen, den Notausgang zu\nbenützen oder nicht, je nach der Laune des Tages. Mochte ihm nun\ngeschehen was da wollte, mochte er krank werden, verarmen, Leid und\nBitternis erfahren – alles war befristet, alles konnte\nallerhöchstens nur diese wenigen Jahre, Monate, Tage andauern, deren\nZahl täglich kleiner wurde! Und in der Tat ertrug er manches\nUngemach jetzt viel leichter, das ihn früher tiefer und länger\ngequält, ja vielleicht bis zur Wurzel erschüttert hätte. Wenn es ihm\naus irgendwelchem Grunde besonders schlecht ging, wenn zur Verödung,\nVereinsamung und Verwilderung seines Lebens noch besondere Schmerzen\noder Verluste hinzukamen, dann konnte er zu den Schmerzen sagen:\n„Wartet nur, noch zwei Jahre, dann bin ich euer Herr!“ Und dann\nvertiefte er sich mit Liebe in die Vorstellung, wie an seinem\nfünfzigsten Geburtstag morgens die Briefe und Gratulationen ankommen\nwürden, während er, seines Rasiermessers sicher, Abschied von allen\nSchmerzen nahm und die Tür hinter sich zuzog. Dann konnte die Gicht\nin den Knochen, dann konnten Schwermut, Kopfschmerz und Magenweh\nsehen, wo sie blieben.","* * * * *","Es erübrigt noch, das Einzelphänomen des Steppenwolfes, und\nnamentlich sein eigentümliches Verhältnis zum Bürgertum, dadurch zu\nerklären, daß wir diese Erscheinungen auf ihre Grundgesetze\nzurückführen. Nehmen wir, da dies sich von selbst anbietet,\nebenjenes sein Verhältnis zum „Bürgerlichen“ zum Ausgangspunkt!","Der Steppenwolf stand, seiner eigenen Auffassung zufolge, gänzlich\naußerhalb der bürgerlichen Welt, da er weder Familienleben noch\nsozialen Ehrgeiz kannte. Er fühlte sich durchaus als Einzelnen, als\nSonderling bald und krankhaften Einsiedler, bald auch als\nübernormal, als ein geniemäßig veranlagtes, über die kleinen Normen\ndes Durchschnittslebens erhabenes Individuum. Mit Bewußtsein\nverachtete er den Bourgeois und war stolz darauf, keiner zu sein.\nDennoch lebte er in mancher Hinsicht ganz und gar bürgerlich, er\nhatte Geld auf der Bank und unterstützte arme Verwandte, er kleidete\nsich zwar sorglos, doch anständig und unauffällig, er suchte mit der\nPolizei, dem Steueramt und ähnlichen Mächten in gutem Frieden zu\nleben. Außerdem aber zog ihn eine starke, heimliche Sehnsucht\nbeständig zur bürgerlichen Kleinwelt, zu den stillen, anständigen\nFamilienhäusern mit sauberen Gärtchen, blankgehaltnem Treppenhaus\nund ihrer ganzen bescheidenen Atmosphäre von Ordnung und\nWohlanständigkeit. Es gefiel ihm, seine kleinen Laster und\nExtravaganzen zu haben, sich als außerbürgerlich, als Sonderling\noder Genie zu fühlen, doch hauste und lebte er, um es so\nauszudrücken, niemals in den Provinzen des Lebens, wo keine\nBürgerlichkeit mehr existiert. Er war weder in der Luft der Gewalt-\nund Ausnahmemenschen zuhause noch bei den Verbrechern oder\nEntrechteten, sondern blieb immer in der Provinz der Bürger wohnen,\nzu deren Gewohnheiten, zu deren Norm und Atmosphäre er stets in\nBeziehung stand, sei es auch in der des Gegensatzes und der Revolte.\nAußerdem war er in kleinbürgerlicher Erziehung aufgewachsen und\nhatte von dorther eine Menge von Begriffen und Schablonen\nbeibehalten. Er hatte theoretisch nicht das mindeste gegen das\nDirnentum, wäre aber unfähig gewesen, persönlich eine Dirne ernst zu\nnehmen und wirklich als seinesgleichen zu betrachten. Den\npolitischen Verbrecher, den Revolutionär oder den geistigen\nVerführer, den Staat und Gesellschaft ächteten, vermochte er als\nseinen Bruder zu lieben, aber mit einem Dieb, Einbrecher, Lustmörder\nhätte er nichts anzufangen gewußt, als sie auf eine ziemlich\nbürgerliche Art zu bedauern.","Auf diese Weise anerkannte und bejahte er stets mit der einen Hälfte\nseines Wesens und Tuns das, was er mit der andern bekämpfte und\nverneinte. In einem kultivierten Bürgerhause aufgewachsen, in fester\nForm und Sitte, war er mit einem Teil seiner Seele stets an den\nOrdnungen dieser Welt hängengeblieben, auch nachdem er sich längst\nüber das im Bürgerlichen mögliche Maß hinaus individualisiert und\nsich vom Inhalt bürgerlichen Ideals und Glaubens längst befreit\nhatte.","Das „Bürgerliche“ nun, als ein stets vorhandener Zustand des\nMenschlichen, ist nichts andres als der Versuch eines Ausgleiches,\nals das Streben nach einer ausgeglichenen Mitte zwischen den\nzahllosen Extremen und Gegensatzpaaren menschlichen Verhaltens.\nNehmen wir irgendeines dieser Gegensatzpaare als Beispiel, etwa das\ndes Heiligen und des Wüstlings, so wird unser Gleichnis alsbald\nverständlich werden. Der Mensch hat die Möglichkeit, sich ganz und\ngar dem Geistigen, dem Annäherungsversuch ans Göttliche, hinzugeben,\ndem Ideal des Heiligen. Er hat umgekehrt auch die Möglichkeit, sich\nganz und gar dem Triebleben, dem Verlangen seiner Sinne hinzugeben\nund sein ganzes Streben auf den Gewinn von augenblicklicher Lust zu\nrichten. Der eine Weg führt zum Heiligen, zum Märtyrer des Geistes,\nzur Selbstaufgabe an Gott. Der andre Weg führt zum Wüstling, zum\nMärtyrer der Triebe, zur Selbstaufgabe an die Verwesung. Zwischen\nbeiden nun versucht in temperierter Mitte der Bürger zu leben. Nie\nwird er sich aufgeben, sich hingeben, weder dem Rausch noch der\nAskese, nie wird er Märtyrer sein, nie in seine Vernichtung willigen\n– im Gegenteil, sein Ideal ist nicht Hingabe, sondern Erhaltung des\nIchs, sein Streben gilt weder der Heiligkeit noch deren Gegenteil,\nUnbedingtheit ist ihm unerträglich, er will zwar Gott dienen, aber\nauch dem Rausche, will zwar tugendhaft sein, es aber auch ein\nbißchen gut und bequem auf Erden haben. Kurz, er versucht es, in der\nMitte zwischen den Extremen sich anzusiedeln, in einer gemäßigten\nund bekömmlichen Zone ohne heftige Stürme und Gewitter, und dies\ngelingt ihm auch, jedoch auf Kosten jener Lebens- und\nGefühlsintensität, die ein aufs Unbedingte und Extreme gerichtetes\nLeben verleiht. Intensiv leben kann man nur auf Kosten des Ichs. Der\nBürger nun schätzt nichts höher als das Ich (ein nur rudimentär\nentwickeltes Ich allerdings). Auf Kosten der Intensität also\nerreicht er Erhaltung und Sicherheit, statt Gottbesessenheit erntet\ner Gewissensruhe, statt Lust Behagen, statt Freiheit Bequemlichkeit,\nstatt tödlicher Glut eine angenehme Temperatur. Der Bürger ist\ndeshalb seinem Wesen nach ein Geschöpf von schwachem Lebensantrieb,\nängstlich, jede Preisgabe seiner selbst fürchtend, leicht zu\nregieren. Er hat darum an Stelle der Macht die Majorität gesetzt, an\nStelle der Gewalt das Gesetz, an Stelle der Verantwortung das\nAbstimmungsverfahren.","Es ist klar, daß dies schwache und ängstliche Wesen, existierte es\nauch in noch so großer Anzahl, sich nicht halten kann, daß es\nvermöge seiner Eigenschaften in der Welt keine andre Rolle spielen\nkönnte als die einer Lämmerherde zwischen freischweifenden Wölfen.\nDennoch sehen wir, daß zwar in Zeiten des Regiments sehr starker\nNaturen der Bürger sofort an die Wand gedrückt wird, daß er aber\nniemals untergeht, zuzeiten sogar anscheinend die Welt beherrscht.\nWie ist das möglich? Weder die große Zahl seiner Herde, noch die\nTugend, noch der _common sense_, noch die Organisation wären stark\ngenug, ihn vor dem Untergang zu retten. Wessen Lebensintensität von\nvornherein so sehr geschwächt ist, den kann keine Medizin der Welt\nam Leben erhalten. Und dennoch lebt das Bürgertum, ist stark und\ngedeiht. – Warum?","Die Antwort lautet: Wegen der Steppenwölfe. In der Tat beruht die\nvitale Kraft des Bürgertums keineswegs auf den Eigenschaften seiner\nnormalen Mitglieder, sondern auf denen der außerordentlich\nzahlreichen _outsiders_, die es infolge der Verschwommenheit und\nDehnbarkeit seiner Ideale mit zu umschließen vermag. Es lebt im\nBürgertum stets eine große Menge von starken und wilden Naturen mit.\nUnser Steppenwolf Harry ist ein charakteristisches Beispiel. Er, der\nweit über das dem Bürger mögliche Maß hinaus zum Individuum\nentwickelt ist, er, der die Wonne der Meditation ebenso wie die\ndüstern Freuden des Hasses und Selbsthasses kennt, er, der das\nGesetz, die Tugend und den _common sense_ verachtet, ist dennoch ein\nZwangshäftling des Bürgertums und kann ihm nicht entrinnen. Und so\nlagern um die eigentliche Masse des echten Bürgertums weite\nSchichten der Menschheit, viele Tausende von Leben und\nIntelligenzen, deren jede dem Bürgertum zwar entwachsen und für ein\nLeben im Unbedingten berufen wäre, deren jede aber, durch infantile\nGefühle der Bürgerlichkeit anhängend und von ihrer Schwächung der\nLebensintensität ein Stück weit angesteckt, dennoch irgendwie im\nBürgertum verharrt, ihm irgendwie hörig, verpflichtet und dienstbar\nbleibt. Denn dem Bürgertum gilt der umgekehrte Grundsatz der Großen:\nWer nicht wider mich ist, der ist für mich!","Prüfen wir daraufhin die Seele des Steppenwolfes, so stellt er sich\ndar als ein Mensch, den schon sein hoher Grad von Individuation zum\nNichtbürger bestimmt – denn alle hochgetriebene Individuation kehrt\nsich gegen das Ich und neigt wieder zu dessen Zerstörung. Wir sehen,\ndaß er sowohl nach dem Heiligen wie nach dem Wüstling hin starke\nAntriebe in sich hat, jedoch aus irgendeiner Schwächung oder\nTrägheit heraus den Schwung in den freien wilden Weltraum nicht\nnehmen konnte und an das schwere mütterliche Gestirn des Bürgertums\ngebannt bleibt. Dies ist seine Lage im Raum der Welt, dies seine\nGebundenheit. Die allermeisten Intellektuellen, der größte Teil der\nKünstlermenschen gehört demselben Typus an. Nur die stärksten von\nihnen durchstoßen die Atmosphäre der Bürgererde und gelangen ins\nKosmische, die andern alle resignieren oder schließen Kompromisse,\nverachten das Bürgertum und gehören ihm dennoch an und stärken und\nverherrlichen es, indem sie letzten Endes es bejahen müssen, um noch\nleben zu können. Es reicht diesen zahllosen Existenzen nicht zur\nTragik, wohl aber zu einem recht ansehnlichen Mißgeschick und\nUnstern, in dessen Hölle ihre Talente gar gekocht und fruchtbar\nwerden. Die wenigen, die sich losreißen, finden ins Unbedingte und\ngehen auf bewundernswerte Weise unter, sie sind die Tragischen, ihre\nZahl ist klein. Den andern aber, den Gebundenbleibenden, deren\nTalenten oft das Bürgertum große Ehren zollt, ihnen steht ein\ndrittes Reich offen, eine imaginäre, aber souveräne Welt: der Humor.\nDie friedlosen Steppenwölfe, diese beständig und furchtbar\nLeidenden, denen die zur Tragik, zum Durchbruch in den Sternenraum\nerforderliche Wucht versagt ist, die sich zum Unbedingten berufen\nfühlen und doch in ihm nicht zu leben vermögen: ihnen bietet sich,\nwenn ihr Geist im Leiden stark und elastisch geworden ist, der\nversöhnliche Ausweg in den Humor. Der Humor bleibt stets irgendwie\nbürgerlich, obwohl der echte Bürger unfähig ist, ihn zu verstehen.\nIn seiner imaginären Sphäre wird das verzwickte, vielspältige Ideal\naller Steppenwölfe verwirklicht: hier ist es möglich, nicht nur\ngleichzeitig den Heiligen und den Wüstling zu bejahen, die Pole\nzueinander zu biegen, sondern auch noch den Bürger in die Bejahung\neinzubeziehen. Es ist ja dem Gottbesessenen sehr wohl möglich, den\nVerbrecher zu bejahen, und ebenso umgekehrt, ihnen beiden aber, und\nallen anderen Unbedingten, ist es unmöglich, auch noch jene neutrale\nlaue Mitte, das Bürgerliche, zu bejahen. Einzig der Humor, die\nherrliche Erfindung der in ihrer Berufung zum Größten Gehemmten, der\nbeinahe Tragischen, der höchstbegabten Unglücklichen, einzig der\nHumor (vielleicht die eigenste und genialste Leistung des\nMenschentums) vollbringt dies Unmögliche, überzieht und vereinigt\nalle Bezirke des Menschenwesens mit den Strahlungen seiner Prismen.\nIn der Welt zu leben, als sei es nicht die Welt, das Gesetz zu\nachten und doch über ihm zu stehen, zu besitzen, „als besäße man\nnicht“, zu verzichten, als sei es kein Verzicht – alle diese\nbeliebten und oft formulierten Forderungen einer hohen\nLebensweisheit ist einzig der Humor zu verwirklichen fähig.","Und falls es dem Steppenwolf, dem es an Gaben und Ansätzen dazu\nnicht fehlt, in der schwülen Wirrnis seiner Hölle noch gelingen\nsollte, diesen Zaubertrank auszukochen, auszuschwitzen, dann wäre er\ngerettet. Noch fehlt ihm dazu vieles. Die Möglichkeit aber, die\nHoffnung ist vorhanden. Wer ihn liebt, wer an ihm Teil nimmt, mag\nihm diese Rettung wünschen. Er würde dadurch zwar für immer im\nBürgerlichen verharren bleiben, aber seine Leiden wären erträglich,\nwürden fruchtbar. Sein Verhältnis zur Bürgerwelt, in Liebe und Haß,\nwürde die Sentimentalität verlieren, und sein Gebundensein an diese\nWelt würde aufhören, ihn beständig als Schande zu quälen.","Um dies zu erreichen, oder um vielleicht am Ende doch noch den\nSprung ins Weltall wagen zu können, müßte solch ein Steppenwolf\neinmal sich selbst gegenübergestellt werden, müßte tief in das Chaos\nder eigenen Seele blicken und zum vollen Bewußtsein seiner selbst\nkommen. Seine fragwürdige Existenz würde sich ihm alsdann in ihrer\nganzen Unabänderlichkeit enthüllen, und es würde ihm fernerhin\nunmöglich werden, sich immer wieder aus der Hölle seiner Triebe in\nsentimental-philosophische Tröstungen und aus diesen wieder in den\nblinden Rausch seines Wolftums hinüberzuflüchten. Mensch und Wolf\nwürden genötigt sein, einander ohne fälschende Gefühlsmasken zu\nerkennen, einander nackt in die Augen zu sehen. Dann würden sie\nentweder explodieren und für immer auseinandergehen, so daß es\nkeinen Steppenwolf mehr gäbe, oder sie würden unter dem aufgehenden\nLicht des Humors eine Vernunftehe schließen.","Möglich, daß Harry eines Tages vor diese letzte Möglichkeit geführt\nwird. Möglich, daß er eines Tages sich erkennen lernt, sei es, daß\ner einen unsrer kleinen Spiegel in die Hand bekomme, sei es, daß er\nden Unsterblichen begegne oder vielleicht in einem unsrer magischen\nTheater dasjenige finde, wessen er zur Befreiung seiner\nverwahrlosten Seele bedarf. Tausend solche Möglichkeiten warten auf\nihn, sein Schicksal zieht sie unwiderstehlich an, alle diese\nAußenseiter des Bürgertums leben in der Atmosphäre dieser magischen\nMöglichkeiten. Ein Nichts genügt, und der Blitz schlägt ein.","Und dies alles ist dem Steppenwolf, auch wenn er niemals diesen\nAbriß seiner innern Biographie zu Gesicht bekommt, sehr wohl\nbekannt. Er ahnt seine Stellung im Weltgebäude, er ahnt und kennt\ndie Unsterblichen, er ahnt und fürchtet die Möglichkeit einer\nSelbstbegegnung, er weiß vom Vorhandensein jenes Spiegels, in den zu\nblicken er so bitter nötig hätte, in den zu blicken er sich so\ntödlich fürchtet.","* * * * *","Zum Schluß unsrer Studie bleibt noch eine letzte Fiktion, eine\ngrundsätzliche Täuschung aufzulösen. Alle „Erklärungen“, alle\nPsychologie, alle Versuche des Verstehens bedürfen ja der\nHilfsmittel, der Theorien, der Mythologien, der Lügen; und ein\nanständiger Autor sollte es nicht unterlassen, am Schluß einer\nDarstellung diese Lügen nach Möglichkeit aufzulösen. Wenn ich sage\n„Oben“ oder „Unten“, so ist das ja schon eine Behauptung, welche\nErklärung fordert, denn ein Oben und Unten gibt es nur im Denken,\nnur in der Abstraktion. Die Welt selbst kennt kein Oben noch Unten.","So ist denn auch, um es kurz zu sagen, der „Steppenwolf“ eine\nFiktion. Wenn Harry sich selbst als Wolfsmenschen empfindet und aus\nzwei feindlichen und gegensätzlichen Wesen zu bestehen meint, so ist\ndas lediglich eine vereinfachende Mythologie. Harry ist gar kein\nWolfsmensch, und wenn wir seine, von ihm selbst erfundene und\ngeglaubte Lüge scheinbar unbesehen mit übernahmen und ihn\ntatsächlich als Doppelwesen, als Steppenwolf zu betrachten und zu\ndeuten suchten, so machten wir uns in der Hoffnung auf leichteres\nVerstandenwerden eine Täuschung zunutze, deren Richtigstellung jetzt\nversucht werden soll.","Die Zweiteilung in Wolf und Mensch, in Trieb und Geist, durch welche\nHarry sich sein Schicksal verständlicher zu machen sucht, ist eine\nsehr grobe Vereinfachung, eine Vergewaltigung des Wirklichen\nzugunsten einer plausiblen, aber irrigen Erklärung der Widersprüche,\nwelche dieser Mensch in sich vorfindet und die ihm die Quelle seiner\nnicht geringen Leiden zu sein scheinen. Harry findet in sich einen\n„Menschen“, das heißt eine Welt von Gedanken, Gefühlen, von Kultur,\nvon gezähmter und sublimierter Natur, und er findet daneben in sich\nauch noch einen „Wolf“, das heißt eine dunkle Welt von Trieben, von\nWildheit, Grausamkeit, von nicht sublimierter, roher Natur. Trotz\ndieser scheinbar so klaren Einteilung seines Wesens in zwei Sphären,\ndie einander feindlich sind, hat er es aber je und je erlebt, daß\nWolf und Mensch sich für eine Weile, für einen glücklichen\nAugenblick miteinander vertrugen. Wollte Harry in jedem einzelnen\nMoment seines Lebens, in jeder seiner Taten, in jeder seiner\nEmpfindungen festzustellen versuchen, welchen Anteil daran der\nMensch, welchen Anteil der Wolf habe, so käme er sofort in die\nKlemme, und seine ganze hübsche Wolftheorie ginge in die Brüche.\nDenn kein einziger Mensch, auch nicht der primitive Neger, auch\nnicht der Idiot, ist so angenehm einfach, daß sein Wesen sich als\ndie Summe von nur zweien oder dreien Hauptelementen erklären ließe;\nund gar einen so sehr differenzierten Menschen wie Harry mit der\nnaiven Einteilung in Wolf und Mensch zu erklären, ist ein\nhoffnungslos kindlicher Versuch. Harry besteht nicht aus zwei Wesen,\nsondern aus hundert, aus tausenden. Sein Leben schwingt (wie jedes\nMenschen Leben) nicht bloß zwischen zwei Polen, etwa dem Trieb und\ndem Geist, oder dem Heiligen und dem Wüstling, sondern es schwingt\nzwischen tausenden, zwischen unzählbaren Polpaaren.","Daß ein so unterrichteter und kluger Mensch wie Harry sich für einen\n„Steppenwolf“ halten kann, daß er das reiche und komplizierte\nGebilde seines Lebens in einer so schlichten, so brutalen, so\nprimitiven Formel glaubt unterbringen zu können, darf uns nicht in\nVerwunderung setzen. Der Mensch ist des Denkens nicht in hohem Maße\nfähig, und auch noch der geistigste und gebildetste Mensch sieht die\nWelt und sich selbst beständig durch die Brille sehr naiver,\nvereinfachender und umlügender Formeln an – am meisten aber sich\nselbst! Denn es ist ein, wie es scheint, eingeborenes und völlig\nzwanghaft wirkendes Bedürfnis aller Menschen, daß jeder sein Ich als\neine Einheit sich vorstelle. Mag dieser Wahn noch so oft, noch so\nschwer erschüttert werden, er heilt stets wieder zusammen. Der\nRichter, der dem Mörder gegenübersitzt und in sein Auge sieht und\neinen Augenblick lang den Mörder mit seiner eigenen (des Richters)\nStimme reden hört und alle seine Regungen, Fähigkeiten,\nMöglichkeiten auch in seinem eigenen Innern vorfindet, er ist schon\nim nächsten Augenblick wieder Eins, ist Richter, schnellt in die\nSchale seines eingebildeten Ichs zurück, tut seine Pflicht und\nverurteilt den Mörder zum Tode. Und wenn in besonders begabten und\nzart organisierten Menschenseelen die Ahnung ihrer Vielspältigkeit\naufdämmert, wenn sie, wie jedes Genie, den Wahn der\nPersönlichkeitseinheit durchbrechen und sich als mehrteilig, als ein\nBündel aus vielen Ichs empfinden, so brauchen sie das nur zu äußern,\nund alsbald sperrt die Majorität sie ein, ruft die Wissenschaft zu\nHilfe, konstatiert Schizophrenie und beschützt die Menschheit davor,\naus dem Munde dieser Unglücklichen einen Ruf der Wahrheit vernehmen\nzu müssen. Nun, wozu hier Worte verlieren, wozu Dinge aussprechen,\nwelche zu wissen sich für jeden Denkenden von selbst versteht,\nwelche zu äußern jedoch nicht Sitte ist? – Wenn nun also ein Mensch\nschon dazu vorschreitet, die eingebildete Einheit des Ichs zur\nZweiheit auszudehnen, so ist er schon beinahe ein Genie, jedenfalls\naber eine seltene und interessante Ausnahme. In Wirklichkeit aber\nist kein Ich, auch nicht das naivste, eine Einheit, sondern eine\nhöchst vielfältige Welt, ein kleiner Sternhimmel, ein Chaos von\nFormen, von Stufen und Zuständen, von Erbschaften und Möglichkeiten.\nDaß jeder einzelne dies Chaos für eine Einheit anzusehen bestrebt\nist und von seinem Ich redet, als sei dies eine einfache, fest\ngeformte, klar umrissene Erscheinung: diese, jedem Menschen (auch\ndem höchsten) geläufige Täuschung scheint eine Notwendigkeit zu\nsein, eine Forderung des Lebens wie Atemholen und Essen.","Die Täuschung beruht auf einer einfachen Übertragung. Als Körper ist\njeder Mensch eins, als Seele nie. Auch in der Dichtung, selbst in\nder raffiniertesten, wird herkömmlicherweise stets mit scheinbar\nganzen, scheinbar einheitlichen Personen operiert. An der bisherigen\nDichtung schätzen die Fachleute, die Kenner am höchsten das Drama,\nund mit Recht, denn es bietet (oder böte) die größte Möglichkeit zur\nDarstellung des Ichs als einer Vielheit – wenn dem nicht der grobe\nAugenschein widerspräche, der uns jede einzelne Person eines Dramas,\nda sie in einem unweigerlich einmaligen, einheitlichen,\nabgeschlossenen Körper steckt, als Einheit vortäuscht. Am höchsten\nschätzt denn auch die naive Ästhetik das sogenannte Charakterdrama,\nin dem jede Figur recht kenntlich und abgesondert als Einheit\nauftritt. Nur von ferne erst und allmählich dämmert die Ahnung in\neinzelnen, daß das vielleicht alles eine billige Oberflächenästhetik\nist, daß wir irren, wenn wir auf unsre großen Dramatiker die\nherrlichen, uns aber nicht eingeborenen, sondern bloß\naufgeschwatzten Schönheitsbegriffe der Antike anwenden, welche,\nüberall vom sichtbaren Leibe ausgehend, recht eigentlich die Fiktion\nvom Ich, von der Person, erfunden hat. In den Dichtungen des alten\nIndien ist dieser Begriff ganz unbekannt, die Helden der indischen\nEpen sind nicht Personen, sondern Personenknäuel,\nInkarnationsreihen. Und in unsrer modernen Welt gibt es Dichtungen,\nin denen hinter dem Schleier des Personen- und Charakterspiels, dem\nAutor wohl kaum ganz bewußt, eine Seelenvielfalt darzustellen\nversucht wird. Wer dies erkennen will, der muß sich entschließen,\neinmal die Figuren einer solchen Dichtung nicht als Einzelwesen\nanzusehen, sondern als Teile, als Seiten, als verschiedene Aspekte\neiner höhern Einheit (meinetwegen der Dichterseele). Wer etwa den\nFaust auf diese Art betrachtet, für den wird aus Faust, Mephisto,\nWagner und allen andern eine Einheit, eine Überperson, und erst in\ndieser höhern Einheit, nicht in den Einzelfiguren, ist etwas vom\nwahren Wesen der Seele angedeutet. Wenn Faust den unter den\nSchullehrern berühmten, vom Philister mit Schauer bewunderten Spruch\nsagt: „Zwei Seelen wohnen, ach, in meiner Brust!“ dann vergißt er\nden Mephisto und eine ganze Menge andrer Seelen, die er ebenfalls in\nseiner Brust hat. Auch unser Steppenwolf glaubt ja, zwei Seelen\n(Wolf und Mensch) in seiner Brust zu tragen und findet seine Brust\ndadurch schon arg beengt. Die Brust, der Leib, ist eben immer eines,\nder darin wohnenden Seelen aber sind nicht zwei, oder fünf, sondern\nunzählige; der Mensch ist eine aus hundert Schalen bestehende\nZwiebel, ein aus vielen Fäden bestehendes Gewebe. Erkannt und genau\ngewußt haben dies die alten Asiaten, und im buddhistischen Yoga ist\neine genaue Technik dafür erfunden, den Wahn der Persönlichkeit zu\nentlarven. Lustig und vielfältig ist das Spiel der Menschheit: der\nWahn, zu dessen Entlarvung Indien tausend Jahre lang sich so sehr\nangestrengt hat, ist derselbe, zu dessen Stützung und Stärkung der\nOkzident sich ebenso viele Mühe gegeben hat.","Betrachten wir von diesem Standpunkt aus den Steppenwolf, so wird\nuns klar, warum er so sehr unter seiner lächerlichen Zweiheit\nleidet. Er glaubt, wie Faust, daß zwei Seelen für eine einzige Brust\nschon zu viel seien und die Brust zerreißen müßten. Sie sind aber im\nGegenteil viel zu wenig, und Harry vergewaltigt seine arme Seele\nfurchtbar, wenn er sie in einem so primitiven Bilde zu begreifen\nsucht. Harry verfährt, obwohl er ein hochgebildeter Mensch ist, etwa\nwie ein Wilder, der nicht über zwei hinaus zählen kann. Er nennt ein\nStück von sich Mensch, ein andres Wolf, und damit glaubt er schon am\nEnde zu sein und sich erschöpft zu haben. In den „Menschen“ packt er\nalles Geistige, Sublimierte oder doch Kultivierte hinein, das er in\nsich vorfindet, und in den Wolf alles Triebhafte, Wilde und\nChaotische. Aber so simpel wie in unsern Gedanken, so grob wie in\nunsrer armen Idiotensprache geht es im Leben nicht zu, und Harry\nbelügt sich doppelt, wenn er diese negerhafte Wolfsmethode anwendet.\nHarry rechnet, so fürchten wir, ganze Provinzen seiner Seele schon\nzum „Menschen“, die noch lange nicht Mensch sind, und rechnet Teile\nseines Wesens zum Wolfe, die längst über den Wolf hinaus sind.","Wie alle Menschen, so glaubt auch Harry recht wohl zu wissen, was\nder Mensch sei, und weiß es doch durchaus nicht, obschon er es, in\nTräumen und anderen schwer kontrollierbaren Bewußtseinszuständen,\nnicht selten ahnt. Möchte er diese Ahnungen nicht vergessen, möchte\ner sie sich doch möglichst zu eigen machen! Der Mensch ist ja keine\nfeste und dauernde Gestaltung (dies war, trotz entgegengesetzter\nAhnungen ihrer Weisen, das Ideal der Antike), er ist vielmehr ein\nVersuch und Übergang, er ist nichts andres als die schmale,\ngefährliche Brücke zwischen Natur und Geist. Nach dem Geiste hin, zu\nGott hin treibt ihn die innerste Bestimmung – nach der Natur, zur\nMutter zurück zieht ihn die innigste Sehnsucht: zwischen beiden\nMächten schwankt angstvoll bebend sein Leben. Was die Menschen\njeweils unter dem Begriff „Mensch“ verstehen, ist stets nur eine\nvergängliche bürgerliche Übereinkunft. Gewisse roheste Triebe werden\nvon dieser Konvention abgelehnt und verpönt, ein Stück Bewußtsein,\nGesittung und Entbestialisierung wird verlangt, ein klein wenig\nGeist ist nicht nur erlaubt, sondern wird sogar gefordert. Der\n„Mensch“ dieser Konvention ist, wie jedes Bürgerideal, ein\nKompromiß, ein schüchterner und naivschlauer Versuch, sowohl die\nböse Urmutter Natur wie den lästigen Urvater Geist um ihre heftigen\nForderungen zu prellen und in lauer Mitte zwischen ihnen zu wohnen.\nDarum erlaubt und duldet der Bürger das, was er „Persönlichkeit“\nnennt, liefert die Persönlichkeit aber gleichzeitig jenem Moloch\n„Staat“ aus und spielt beständig die beiden gegeneinander aus. Darum\nverbrennt der Bürger heute den als Ketzer, hängt den als Verbrecher,\ndem er übermorgen Denkmäler setzt.","Daß der „Mensch“ nicht schon Erschaffenes sei, sondern eine\nForderung des Geistes, eine ferne, ebenso ersehnte wie gefürchtete\nMöglichkeit, und daß der Weg dahin immer nur ein kleines Stückchen\nweit und unter furchtbaren Qualen und Ekstasen zurückgelegt wird,\neben von jenen seltenen Einzelnen, denen heute das Schafott, morgen\ndas Ehrendenkmal bereitet wird – dies Ahnen lebt auch im\nSteppenwolf. Was er aber, im Gegensatz zu seinem „Wolf“, in sich\n„Mensch“ nennt, das ist zum großen Teil nichts andres als eben jener\nmediokre „Mensch“ der Bürgerkonvention. Den Weg zum wahren Menschen,\nden Weg zu den Unsterblichen kann Harry zwar recht wohl ahnen, geht\nihn auch hie und da ein winziges, zögerndes Stückchen weit und\nbezahlt das mit schweren Leiden, mit schmerzlicher Vereinsamung.\nAber jene höchste Forderung, jene echte, vom Geist gesuchte\nMenschwerdung zu bejahen und anzustreben, den einzigen schmalen Weg\nzur Unsterblichkeit zu gehen, davor scheut er sich doch in tiefster\nSeele. Er fühlt recht wohl: das führt zu noch größeren Leiden, zur\nÄchtung, zum letzten Verzicht, vielleicht zum Schafott, – und wenn\nauch am Ende dieses Weges Unsterblichkeit lockt, so ist er doch\nnicht gewillt, all diese Leiden zu leiden, alle diese Tode zu\nsterben. Obwohl ihm vom Ziel der Menschwerdung mehr bewußt ist als\nden Bürgern, macht er doch die Augen zu und will nicht wissen, daß\ndas verzweifelte Hängen am Ich, das verzweifelte Nichtsterbenwollen\nder sicherste Weg zum ewigen Tode ist, während Sterbenkönnen,\nHüllenabstreifen, ewige Hingabe des Ichs an die Wandlung zur\nUnsterblichkeit führt. Wenn er seine Lieblinge unter den\nUnsterblichen anbetet, etwa Mozart, so sieht er ihn letzten Endes\ndoch immer noch mit Bürgeraugen an und ist geneigt, Mozarts\nVollendung recht wie ein Schullehrer bloß aus seiner hohen\nSpezialistenbegabung zu erklären, statt aus der Größe seiner Hingabe\nund Leidensbereitschaft, seiner Gleichgültigkeit gegen die Ideale\nder Bürger und dem Erdulden jener äußersten Vereinsamung, die um den\nLeidenden, den Menschwerdenden alle Bürgeratmosphäre zu eisigem\nWeltäther verdünnt, jener Vereinsamung im Garten Gethsemane.","Immerhin hat unser Steppenwolf wenigstens die faustische Zweiheit in\nsich entdeckt, er hat herausgefunden, daß der Einheit seines Leibes\nnicht eine Seeleneinheit innewohnt, sondern daß er bestenfalls nur\nauf dem Wege, in langer Pilgerschaft zum Ideal dieser Harmonie\nbegriffen ist. Er möchte entweder den Wolf in sich überwinden und\nganz Mensch werden oder aber auf den Menschen verzichten und\nwenigstens als Wolf ein einheitliches, unzerrissenes Leben leben.\nVermutlich hat er nie einen wirklichen Wolf genau beobachtet – er\nhätte dann vielleicht gesehen, daß auch die Tiere keine einheitliche\nSeele haben, daß auch bei ihnen hinter der schönen straffen Form des\nLeibes eine Vielfalt von Strebungen und Zuständen wohnt, daß auch\nder Wolf Abgründe in sich hat, daß auch der Wolf leidet. Nein, mit\ndem „Zurück zur Natur!“ geht der Mensch stets einen leidvollen und\nhoffnungslosen Irrweg. Harry kann niemals wieder ganz zum Wolfe\nwerden, und würde er es, so sähe er, daß auch der Wolf wieder nichts\nEinfaches und Anfängliches ist, sondern schon etwas sehr Vielfaches\nund Kompliziertes. Auch der Wolf hat zwei und mehr als zwei Seelen\nin seiner Wolfsbrust, und wer ein Wolf zu sein begehrt, begeht\ndieselbe Vergeßlichkeit wie der Mann mit jenem Liede: „O selig, ein\nKind noch zu sein!“ Der sympathische, aber sentimentale Mann, der\ndas Lied vom seligen Kinde singt, möchte ebenfalls zur Natur, zur\nUnschuld, zu den Anfängen zurück und hat ganz vergessen, daß die\nKinder keineswegs selig sind, daß sie vieler Konflikte, daß sie\nvieler Zwiespältigkeiten, daß sie aller Leiden fähig sind.","Zurück führt überhaupt kein Weg, nicht zum Wolf, noch zum Kinde. Am\nAnfang der Dinge ist nicht Unschuld und Einfalt; alles Erschaffene,\nauch das scheinbar Einfachste, ist schon schuldig, ist schon\nvielspältig, ist in den schmutzigen Strom des Werdens geworfen und\nkann nie mehr, nie mehr stromaufwärts schwimmen. Der Weg in die\nUnschuld, ins Unerschaffene, zu Gott führt nicht zurück, sondern\nvorwärts, nicht zum Wolf oder Kind, sondern immer weiter in die\nSchuld, immer tiefer in die Menschwerdung hinein. Auch mit dem\nSelbstmord wird dir, armer Steppenwolf, nicht ernstlich gedient\nsein, du wirst schon den längeren, den mühevolleren und schwereren\nWeg der Menschwerdung gehen, du wirst deine Zweiheit noch oft\nvervielfachen, deine Kompliziertheit noch viel weiter komplizieren\nmüssen. Statt deine Welt zu verengern, deine Seele zu vereinfachen,\nwirst du immer mehr Welt, wirst schließlich die ganze Welt in deine\nschmerzlich erweiterte Seele aufnehmen müssen, um vielleicht einmal\nzum Ende, zur Ruhe zu kommen. Diesen Weg ist Buddha, ist jeder große\nMensch gegangen, der eine wissend, der andre unbewußt, soweit ihm\neben das Wagnis glückte. Jede Geburt bedeutet Trennung vom All,\nbedeutet Umgrenzung, Absonderung von Gott, leidvolle Neuwerdung.\nRückkehr ins All, Aufhebung der leidvollen Individuation, Gottwerden\nbedeutet: seine Seele so erweitert haben, daß sie das All wieder zu\numfassen vermag.","Es ist hier nicht die Rede vom Menschen, den die Schule, die\nNationalökonomie, die Statistik kennt, nicht vom Menschen, wie er zu\nMillionen auf den Straßen herumläuft und von dem nichts andres zu\nhalten ist als vom Sand am Meer oder von den Spritzern einer\nBrandung: es kommt auf ein paar Millionen mehr oder weniger nicht\nan, sie sind Material, sonst nichts. Nein, wir sprechen hier vom\nMenschen im hohen Sinn, vom Ziel des langen Weges der Menschwerdung,\nvom königlichen Menschen, von den Unsterblichen. Das Genie ist nicht\nso selten, wie es uns oft scheinen will, ist freilich auch nicht so\nhäufig, wie die Literatur- und Weltgeschichten oder gar die\nZeitungen meinen. Der Steppenwolf Harry, so scheint es uns, wäre\nGenie genug, um das Wagnis der Menschwerdung zu versuchen, statt\nsich bei jeder Schwierigkeit wehleidig auf seinen dummen Steppenwolf\nhinauszureden.","Daß Menschen von solchen Möglichkeiten sich mit Steppenwölfen und\n„zwei Seelen, ach!“ behelfen, ist ebenso verwunderlich und\nbetrübend, wie daß sie so oft jene feige Liebe zum Bürgerlichen\nhaben. Ein Mensch, der fähig ist, Buddha zu begreifen, ein Mensch,\nder eine Ahnung hat von den Himmeln und Abgründen des Menschentums,\nsollte nicht in einer Welt leben, in welcher _common sense_,\nDemokratie und bürgerliche Bildung herrschen. Nur aus Feigheit lebt\ner in ihr, und wenn seine Dimensionen ihn bedrängen, wenn die enge\nBürgerstube ihm zu eng wird, dann schiebt er es dem „Wolf“ in die\nSchuhe und will nicht wissen, daß der Wolf zuzeiten sein bestes Teil\nist. Er nennt alles Wilde in sich Wolf und empfindet es als böse,\nals gefährlich, als Bürgerschreck – aber er, der doch ein Künstler\nzu sein und zarte Sinne zu haben glaubt, vermag nicht zu sehen, daß\naußer dem Wolf, hinter dem Wolf, noch viel andres in ihm lebt, daß\nnicht alles Wolf ist, was beißt, daß da auch noch Fuchs, Drache,\nTiger, Affe und Paradiesvogel wohnen. Und daß diese ganze Welt,\ndieser ganze Paradiesgarten von holden und schrecklichen, großen und\nkleinen, starken und zarten Gestaltungen erdrückt und\ngefangengehalten wird von dem Wolfmärchen, ebenso wie der wahre\nMensch in ihm vom Scheinmenschen, vom Bürger, erdrückt und\ngefangengehalten wird.","Man stelle sich einen Garten vor, mit hunderterlei Bäumen, mit\ntausenderlei Blumen, hunderterlei Obst, hunderterlei Kräutern. Wenn\nnun der Gärtner dieses Gartens keine andre botanische Unterscheidung\nkennt als „eßbar“ und „Unkraut“, dann wird er mit neun Zehnteln\nseines Gartens nichts anzufangen wissen, er wird die zauberhaftesten\nBlumen ausreißen, die edelsten Bäume abhauen oder wird sie doch\nhassen und scheel ansehen. So macht es der Steppenwolf mit den\ntausend Blumen seiner Seele. Was nicht in die Rubriken „Mensch“ oder\n„Wolf“ paßt, das sieht er gar nicht. Und was zählt er nicht alles\nzum „Menschen“! Alles Feige, alles Affenhafte, alles Dumme und\nKleinliche, wenn es nur nicht gerade wölfisch ist, zählt er zum\n„Menschen“, ebenso wie er alles Starke und Edle, nur weil es ihm\nnoch nicht gelang, seiner Herr zu werden, dem Wölfischen zuschreibt.","Wir nehmen Abschied von Harry, wir lassen ihn seinen Weg allein\nweitergehen. Wäre er schon bei den Unsterblichen, wäre er schon\ndort, wohin sein schwerer Weg zu zielen scheint, wie würde er diesem\nHin und Her, diesem wilden, unentschloßnen Zickzack seiner Bahn\nverwundert zuschauen, wie würde er diesem Steppenwolf ermunternd,\ntadelnd, mitleidig, belustigt zulächeln!","Als ich zu Ende gelesen hatte, fiel mir ein, daß ich vor einigen Wochen\neinmal in der Nacht ein etwas sonderbares Gedicht aufgeschrieben hatte,\ndas ebenfalls vom Steppenwolf handelte. Ich suchte danach im\nPapiergestöber meines vollgestopften Schreibtisches, fand es und las:","Ich Steppenwolf trabe und trabe,\ndie Welt liegt voll Schnee,\nvom Birkenbaum flügelt der Rabe,\naber nirgends ein Hase, nirgends ein Reh!\nIn die Rehe bin ich so verliebt,\nwenn ich doch eins fände!\nIch nähm’s in die Zähne, in die Hände,\ndas ist das Schönste, was es gibt.\nIch wäre der Holden so von Herzen gut,\nfräße mich tief in ihre zärtlichen Keulen,\ntränke mich satt an ihrem hellroten Blut,\num nachher die ganze Nacht einsam zu heulen.\nSogar mit einem Hasen wär’ ich zufrieden,\nsüß schmeckt sein warmes Fleisch in der Nacht –\nach, ist denn alles von mir geschieden,\nwas das Leben ein bißchen fröhlicher macht?\nAn meinem Schwanz ist das Haar schon grau,\nauch kann ich nicht mehr ganz deutlich sehen,\nschon vor Jahren starb meine liebe Frau.\nUnd nun trab’ ich und träume von Rehen,\ntrabe und träume von Hasen,\nhöre den Wind in der Winternacht blasen,\ntränke mit Schnee meine brennende Kehle,\ntrage dem Teufel zu meine arme Seele.","Da hatte ich nun zwei Bildnisse von mir in Händen, das eine ein\nSelbstbildnis in Knittelversen, traurig und angstvoll wie ich selbst,\ndas andre kühl und mit dem Anschein hoher Objektivität gezeichnet, von\neinem Außenstehenden, von außen und von oben gesehen, geschrieben von\neinem, der mehr und doch auch weniger wußte als ich selbst. Und diese\nbeiden Bildnisse zusammen, mein schwermütig stammelndes Gedicht und die\nkluge Studie von unbekannter Hand, taten mir beide weh, hatten beide\nrecht, zeichneten beide ungeschminkt meine trostlose Existenz, zeigten\nbeide deutlich die Unerträglichkeit und Unhaltbarkeit meines Zustandes.\nDieser Steppenwolf mußte sterben, er mußte mit eigener Hand seinem\nverhaßten Dasein ein Ende machen – oder er mußte, geschmolzen im\nTodesfeuer einer erneuten Selbstschau, sich wandeln, seine Maske\nabreißen und eine neue Ichwerdung begehen. Ach, dieser Vorgang war mir\nnicht neu und unbekannt, ich kannte ihn, ich hatte ihn mehrmals schon\nerlebt, jedesmal in Zeiten der äußersten Verzweiflung. Jedesmal war bei\ndiesem schwer aufwühlenden Erlebnis mein jeweiliges Ich in Scherben\nzerbrochen, jedesmal hatten Mächte der Tiefe es aufgerüttelt und\nzerstört, jedesmal war dabei ein gehegtes und besonders geliebtes Stück\nmeines Lebens mir untreu geworden und verlorengegangen. Das eine Mal\nhatte ich meinen bürgerlichen Ruf samt meinem Vermögen verloren und\nhatte lernen müssen, auf die Achtung derer zu verzichten, die bisher vor\nmir den Hut gezogen hatten. Das andre Mal war über Nacht mein\nFamilienleben zusammengebrochen; meine geisteskrank gewordene Frau hatte\nmich aus Haus und Behagen vertrieben, Liebe und Vertrauen hatte sich\nplötzlich in Haß und tödlichen Kampf verwandelt, mitleidig und\nverächtlich blickten die Nachbarn mir nach. Damals hatte meine\nVereinsamung ihren Anfang genommen. Und wieder um Jahre, um schwere\nbittere Jahre später, nachdem ich mir in strenger Einsamkeit und\nmühsamer Selbstzucht ein neues, asketisch-geistiges Leben und Ideal\ngebaut und wieder eine gewisse Stille und Höhe des Lebens erreicht\nhatte, hingegeben an abstrakte Denkübung und an streng geregelte\nMeditation, da war auch diese Lebensgestaltung wieder zusammengebrochen\nund hatte ihren edlen hohen Sinn mit einemmal verloren; auf wilden\nanstrengenden Reisen riß es mich aufs neue durch die Welt, neue Leiden\ntürmten sich und neue Schuld. Und jedesmal war dem Abreißen einer Maske,\ndem Zusammenbruch eines Ideals diese grausige Leere und Stille\nvorangegangen, diese tödliche Einschnürung, Vereinsamung und\nBeziehungslosigkeit, diese leere öde Hölle der Lieblosigkeit und\nVerzweiflung, wie ich sie auch jetzt wieder zu durchwandern hatte.","Bei jeder solchen Erschütterung meines Lebens hatte ich am Ende irgend\netwas gewonnen, das war nicht zu leugnen, etwas an Freiheit, an Geist,\nan Tiefe, aber auch an Einsamkeit, an Unverstandensein, an Erkältung.\nVon der bürgerlichen Seite her gesehen war mein Leben, von jeder solchen\nErschütterung zur andern, ein beständiger Abstieg, eine immer größere\nEntfernung vom Normalen, Erlaubten, Gesunden gewesen. Ich war im Lauf\nder Jahre beruflos, familienlos, heimatlos geworden, stand außerhalb\naller sozialen Gruppen, allein, von niemand geliebt, von vielen\nbeargwöhnt, in ständigem, bitterm Konflikt mit der öffentlichen Meinung\nund Moral, und wenn ich auch noch im bürgerlichen Rahmen lebte, war ich\ndoch inmitten dieser Welt mit meinem ganzen Fühlen und Denken ein\nFremder. Religion, Vaterland, Familie, Staat waren mir entwertet und\ngingen mich nichts mehr an, die Wichtigtuerei der Wissenschaft, der\nZünfte, der Künste ekelte mich an; meine Anschauungen, mein Geschmack,\nmein ganzes Denken, mit dem ich einst als ein begabter und beliebter\nMann geglänzt hatte, war jetzt verwahrlost und verwildert und den Leuten\nverdächtig. Mochte ich bei all meinen so schmerzlichen Wandlungen irgend\netwas Unsichtbares und Unwägbares gewonnen haben – ich hatte es teuer\nbezahlen müssen, und von Mal zu Mal war mein Leben härter, schwieriger,\neinsamer, gefährdeter geworden. Wahrlich, ich hatte keinen Grund, eine\nFortsetzung dieses Weges zu wünschen, der mich in immer dünnere Lüfte\nführte, jenem Rauche in Nietzsches Herbstlied gleich.","Ach ja, ich kannte diese Erlebnisse, diese Wandlungen, die das Schicksal\nseinen Sorgenkindern, seinen heikelsten Kindern bestimmt hat, allzu gut\nkannte ich sie. Ich kannte sie, wie ein ehrgeiziger, aber erfolgloser\nJäger die Etappen einer Jagdunternehmung, wie ein alter Börsenspieler\ndie Etappen der Spekulation, des Gewinns, des Unsicherwerdens, des\nWankens, des Bankerotts kennen mag. Sollte ich all dies nun wirklich\nnoch einmal durchleben? All diese Qual, all diese irre Not, all diese\nEinblicke in die Niedrigkeit und Wertlosigkeit des eigenen Ich, all\ndiese furchtbare Angst vor dem Erliegen, all diese Todesfurcht? War es\nnicht klüger und einfacher, die Wiederholung so vieler Leiden zu\nverhüten, sich aus dem Staube zu machen? Gewiß, es war einfacher und\nklüger. Mochte nun das, was in dem Steppenwolfbüchlein über die\n„Selbstmörder“ behauptet wurde, sich so oder anders verhalten, niemand\nkonnte mir das Vergnügen verwehren, mir mit Hilfe von Kohlengas,\nRasiermesser oder Pistole die Wiederholung eines Prozesses zu ersparen,\ndessen bittere Schmerzlichkeit ich nun wahrlich oft und tief genug hatte\nauskosten müssen. Nein, bei allen Teufeln, es gab keine Macht in der\nWelt, die von mir verlangen konnte, nochmals eine Selbstbegegnung mit\nihren Todesschauern und nochmals eine Neugestaltung, eine neue\nInkarnation durchzumachen, deren Ziel und Ende ja nicht Friede und Ruhe\nwar, sondern nur immer neue Selbstvernichtung, immer neue\nSelbstgestaltung! Mochte der Selbstmord dumm, feig und schäbig, mochte\ner ein unrühmlicher und schmachvoller Notausgang sein – aus dieser Mühle\nder Leiden war jeder, auch der schmählichste Ausgang innig zu wünschen,\nhier gab es kein Theater des Edelmuts und Heroismus mehr, hier war ich\nvor die einfache Wahl gestellt zwischen einem kleinen, flüchtigen\nSchmerz und einem unausdenklich brennenden, endlosen Leid. Oft genug in\nmeinem so schwierigen, so verrückten Leben war ich der edle Don\nQuichotte gewesen, hatte die Ehre dem Behagen und den Heroismus der\nVernunft vorgezogen. Genug und Schluß damit!","Der Morgen gähnte schon durch die Scheiben, der bleierne, verdammte\nMorgen eines Winterregentages, als ich endlich zu Bette kam. Ins Bett\nnahm ich meinen Entschluß mit. Ganz zu äußerst aber, an der letzten\nGrenze des Bewußtseins im Augenblick des Einschlafens, blitzte\nsekundenschnell jene merkwürdige Stelle des Steppenwolfbüchleins vor mir\nauf, wo von den „Unsterblichen“ die Rede war, und damit verband sich die\naufzuckende Erinnerung daran, daß ich manche Male und erst noch ganz vor\nkurzem mich den Unsterblichen nah genug gefühlt hatte, um in einem Takt\nalter Musik die ganze kühle, helle, hart lächelnde Weisheit der\nUnsterblichen mitzukosten. Das tauchte auf, glänzte, erlosch, und schwer\nwie ein Berg legte sich der Schlaf auf meine Stirn.","Gegen Mittag erwacht, fand ich in mir alsbald die geklärte Situation\nwieder, das kleine Büchlein lag auf dem Nachttisch und mein Gedicht, und\nfreundlich kühl blickte aus dem Wirrsal meines jüngsten Lebens mein\nEntschluß mich an, über Nacht im Schlafe rund und fest geworden. Eile\ntat nicht not, mein Todesentschluß war nicht die Laune einer Stunde, er\nwar eine reife, haltbare Frucht, langsam gewachsen und schwer geworden,\nvom Wind des Schicksals leis geschaukelt, dessen nächster Stoß sie zum\nFallen bringen mußte.","Ich besaß in meiner Reiseapotheke ein vorzügliches Mittel, um Schmerzen\nzu stillen, ein besonders starkes Opiumpräparat, dessen Genuß ich mir\nnur sehr selten gönnte und oft monatelang vorenthielt; ich nahm dies\nschwer betäubende Mittel nur dann, wenn körperliche Schmerzen mich bis\nzur Unerträglichkeit plagten. Zum Selbstmord war es leider nicht\ngeeignet, ich hatte dies vor mehreren Jahren einmal ausprobiert. Da\nhatte ich in einer Zeit, als wieder einmal Verzweiflung mich umgab, eine\nhübsche Menge davon geschluckt, genug, um sechs Menschen zu töten, und\nes hatte mich doch nicht getötet. Ich schlief zwar ein und lag einige\nStunden in vollkommener Betäubung, wurde dann aber, zu meiner\nfurchtbaren Enttäuschung, durch heftige Zuckungen des Magens halb\nerweckt, erbrach, ohne ganz zu mir zu kommen, das ganze Gift und schlief\nwieder ein, um in der Mitte des nächsten Tages endgültig aufzuwachen, zu\neiner grauenhaften Nüchternheit, mit verbranntem, leerem Gehirn und fast\nganz ohne Gedächtnis. Außer einer Periode von Schlaflosigkeit und\nlästigen Magenschmerzen blieb keine Wirkung des Giftes übrig.","Dies Mittel also kam nicht in Betracht. Aber ich gab meinem Entschluß\nnun diese Form: sobald es mit mir wieder dahin kommen würde, daß ich zu\njenem Opiat greifen mußte, sollte es mir erlaubt sein, statt dieser\nkurzen Erlösung die große zu schlürfen, den Tod, und zwar einen sichern,\nzuverlässigen Tod, mit der Kugel oder dem Rasiermesser. Damit war die\nLage geklärt – bis zu meinem fünfzigsten Geburtstage zu warten, nach dem\nwitzigen Rezept des Steppenwolfbüchleins, das schien mir doch\nallzulange, es waren noch zwei Jahre bis dahin. Sei es in einem Jahr\noder in einem Monat, sei es morgen schon – die Pforte stand offen.","* * * * *","Ich kann nicht sagen, daß der „Entschluß“ mein Leben stark verändert\nhätte. Er machte mich ein wenig gleichgültiger gegen Beschwerden, ein\nwenig unbesorgter im Gebrauch von Opium und Wein, ein wenig neugieriger\nauf die Grenze des Ertragbaren, das war alles. Stärker wirkten die\nandern Erlebnisse jenes Abends nach. Den Traktat vom Steppenwolf las ich\nnoch manchmal durch, bald mit Hingabe und Dankbarkeit, als wisse ich\neinen unsichtbaren Magier mein Schicksal weise leiten, bald mit Hohn und\nVerachtung gegen die Nüchternheit des Traktates, der mir die spezifische\nStimmung und Spannung meines Lebens gar nicht zu verstehen schien. Was\nda von Steppenwölfen und Selbstmördern geschrieben stand, mochte ganz\ngut und klug sein, es galt für die Gattung, für den Typus, war\ngeistreiche Abstraktion; meine Person hingegen, meine eigentliche Seele,\nmein eigenes, einmaliges Einzelschicksal schien mir mit so grobem Netze\ndoch nicht einzufangen.","Tiefer als alles andre aber beschäftigte mich jene Halluzination oder\nVision an der Kirchenmauer, die verheißungsvolle Ankündigung jener\ntanzenden Lichtschrift, die mit Andeutungen des Traktates\nübereinstimmte. Viel war mir da versprochen worden, gewaltig hatten die\nStimmen jener fremden Welt meine Neugierde angestachelt, oft sann ich\nlange Stunden ganz versunken darüber nach. Und immer deutlicher sprach\ndann die Warnung jener Inschriften zu mir: „Nicht für jedermann!“ und\n„Nur für Verrückte!“ Verrückt also mußte ich sein und weit abgerückt von\n„jedermann“, wenn jene Stimmen mich erreichen, jene Welten zu mir\nsprechen sollten. Mein Gott, war ich denn nicht längst weit genug\nentfernt vom Leben jedermanns, vom Dasein und Denken der Normalen, war\nich nicht längst reichlich abgesondert und verrückt? Und dennoch\nverstand ich im Innersten den Zuruf recht wohl, die Aufforderung zum\nVerrücktsein, zum Wegwerfen der Vernunft, der Hemmung, der\nBürgerlichkeit, zur Hingabe an die flutende gesetzlose Welt der Seele,\nder Phantasie.","Eines Tages, nachdem ich wieder einmal vergeblich Straßen und Plätze\nnach dem Mann mit der Plakatstange abgesucht hatte und mehrmals lauernd\nan der Mauer mit dem unsichtbaren Tor vorbeigestreift war, begegnete ich\nin der Martinsvorstadt einem Leichenzug. Indem ich die Gesichter der\nLeidtragenden betrachtete, die hinter dem Sargwagen hertrottelten, war\nmein Gedanke: Wo in dieser Stadt, wo in dieser Welt lebt der Mensch,\ndessen Tod mir einen Verlust bedeuten würde? Und wo der Mensch, dem mein\nTod etwas bedeuten könnte? Da war zwar Erika, meine Geliebte, nun ja;\naber wir lebten seit langem in sehr loser Verbindung, sahen uns selten,\nohne Streit zu bekommen, und zur Zeit wußte ich nicht einmal ihren\nAufenthaltsort. Sie kam zuweilen zu mir, oder ich reiste zu ihr, und da\nwir beide einsame und schwierige Menschen sind, irgendwo in der Seele\nund in der Seelenkrankheit einander verwandt, blieb trotz allem eine\nBindung zwischen uns bestehen. Aber würde sie nicht vielleicht aufatmen\nund sich sehr erleichtert fühlen, wenn sie meinen Tod erführe? Ich wußte\nes nicht, wußte auch nichts über die Zuverlässigkeit meiner eigenen\nGefühle. Man muß im Normalen und Möglichen leben, um über solche Dinge\netwas wissen zu können.","Unterdessen hatte ich mich, einer Laune folgend, dem Trauerzuge\nangeschlossen und trabte hinter den Leidtragenden her zum Friedhof mit,\neinem modernen zementenen Patentfriedhof mit Krematorium und allen\nSchikanen. Unser Toter wurde aber nicht verbrannt, sondern sein Sarg vor\neinem schlichten Erdloch abgeladen, und ich sah dem Pfarrer und den\nübrigen Aasgeiern, Angestellten einer Begräbnisanstalt, bei ihren\nVerrichtungen zu, welchen sie den Anschein einer hohen Feierlichkeit und\nTrauer zu geben suchten, so daß sie sich vor lauter Theater und\nVerlegenheit und Verlogenheit überanstrengten und ins Komische gerieten,\nsah, wie die schwarze Berufsuniform an ihnen niederwallte und wie sie\nsich Mühe gaben, die Trauergesellschaft in Stimmung zu bringen und zur\nKniebeuge vor der Majestät des Todes zu zwingen. Es war vergebliche\nMühe, niemand weinte, der Tote schien allen entbehrlich zu sein. Auch\nwar niemand zu frommen Stimmungen zu überreden, und als der Pfarrer die\nGesellschaft immer wieder als „liebe Mitchristen“ anredete, sahen alle\ndie schweigsamen Geschäftsgesichter dieser Kaufleute und Bäckermeister\nund ihrer Frauen in krampfhaftem Ernst vor sich nieder, verlegen und\nverlogen und von keinem andern Wunsche bewegt, als daß diese\nunbehagliche Veranstaltung bald ihr Ende finden möchte. Nun, sie ging zu\nEnde, die beiden vordersten unter den Mitchristen drückten dem Redner\ndie Hand, rieben sich am nächsten Rasenbord den feuchten Lehm, in den\nsie ihren Toten gelegt hatten, von den Schuhen, die Gesichter wurden\nunverweilt wieder gewöhnlich und menschlich, und eines von ihnen schien\nmir plötzlich bekannt – es war, so schien mir, der Mann, der damals das\nPlakat getragen und mir das Büchlein in die Hand gedrückt hatte.","In dem Augenblick, da ich ihn zu erkennen glaubte, wandte er sich um,\nbückte sich, machte sich an seinen schwarzen Hosen zu schaffen, die er\numständlich über den Schuhen hochkrempelte, und lief dann hurtig davon,\neinen Regenschirm unter den Arm geklemmt. Ich lief ihm nach, holte ihn\nein, nickte ihm zu, doch schien er mich nicht zu erkennen.","„Ist heute keine Abendunterhaltung?“ fragte ich und versuchte ihm\nzuzublinzeln, so wie Mitwisser von Geheimnissen es untereinander tun.\nAber es war allzu lange her, seit solche mimische Übungen mir geläufig\nwaren, hatte ich bei meiner Lebensweise doch beinahe das Sprechen\nverlernt; ich fühlte selbst, daß ich nur eine dumme Grimasse schneide.","„Abendunterhaltung?“ brummte der Mann und sah mir fremd ins Gesicht.\n„Gehen Sie in den Schwarzen Adler, Mensch, wenn Sie Bedürfnisse haben.“","Ich war in der Tat nicht mehr gewiß, ob er es sei. Enttäuscht ging ich\nweiter, ich wußte nicht wohin, es gab keine Ziele, keine Bestrebungen,\nkeine Pflichten für mich. Scheußlich bitter schmeckte das Leben, ich\nfühlte, wie der seit langem gewachsene Ekel seine Höhe erreichte, wie\ndas Leben mich ausstieß und wegwarf. Wütend lief ich durch die graue\nStadt, alles schien mir nach feuchter Erde und Begräbnis zu riechen.\nNein, an meinem Grabe durfte keiner von diesen Totenvögeln stehen, mit\nseinem Talar und seinem sentimentalen mitchristlichen Gesäusel! Ach,\nwohin ich blicken, wohin ich die Gedanken schicken mochte, nirgends\nwartete eine Freude, nirgends ein Zuruf auf mich, nirgends war Lockung\nzu spüren, es stank alles nach fauler Verbrauchtheit, nach fauler\nHalbundhalbzufriedenheit, es war alles alt, welk, grau, schlapp,\nerschöpft. Lieber Gott, wie war es möglich? Wie hatte es mit mir dahin\nkommen können, mit mir, dem beflügelten Jüngling, dem Dichter, dem\nFreund der Musen, dem Weltwanderer, dem glühenden Idealisten? Wie war\ndas so langsam und schleichend über mich gekommen, diese Lähmung, dieser\nHaß gegen mich und alle, diese Verstopftheit aller Gefühle, diese tiefe\nböse Verdrossenheit, diese Dreckhölle der Herzensleere und Verzweiflung?","Als ich an der Bibliothek vorüberkam, begegnete mir ein junger\nProfessor, mit dem ich früher hie und da ein Gespräch geführt hatte, den\nich bei meinem letzten Aufenthalt in dieser Stadt, vor einigen Jahren,\nsogar mehrmals in seiner Wohnung aufgesucht hatte, um mit ihm über\norientalische Mythologien zu reden, ein Gebiet, mit dem ich damals viel\nbeschäftigt war. Der Gelehrte kam mir entgegen, steif und etwas\nkurzsichtig, und erkannte mich erst, als ich schon im Begriff war, an\nihm vorüberzugehen. Er stürzte sich mit großer Herzlichkeit auf mich,\nund ich, in meiner jämmerlichen Verfassung, war ihm halb und halb\ndankbar dafür. Er war erfreut und wurde lebhaft, erinnerte mich an\nEinzelheiten aus unsern einstigen Gesprächen, versicherte, daß er meinen\nAnregungen viel verdanke und oft an mich gedacht habe; selten habe er\nseither so angeregte und ergiebige Auseinandersetzungen mit Kollegen\ngehabt. Er fragte, seit wann ich in der Stadt sei (ich log: seit wenigen\nTagen) und warum ich ihn nicht aufgesucht habe. Ich blickte dem artigen\nMann in sein gelehrtes gutes Gesicht, fand die Szene eigentlich\nlächerlich, genoß aber doch wie ein verhungerter Hund den Brocken Wärme,\nden Schluck Liebe, den Bissen Anerkennung. Gerührt grinste der\nSteppenwolf Harry, im trocknen Schlunde lief ihm der Geifer zusammen,\nSentimentalität bog ihm wider seinen Willen den Rücken. Ja, ich log mich\nalso eifrig heraus, daß ich nur vorübergehend hier sei, studienhalber,\nund mich auch nicht recht wohl fühle, sonst hätte ich ihn natürlich\neinmal besucht. Und als er mich nun herzlich einlud, doch diesen Abend\nbei ihm zu verbringen, da nahm ich dankbar an, bat ihn seine Frau zu\ngrüßen, und dabei taten mir beim eifrigen Reden und Lächeln die Backen\nweh, welche dieser Anstrengungen nicht mehr gewohnt waren. Und während\nich, Harry Haller, da auf der Straße stand, überrumpelt und\ngeschmeichelt, höflich und beflissen, und dem freundlichen Mann in das\nkurzsichtige gute Gesicht lächelte, stand der andere Harry daneben und\ngrinste ebenfalls, stand grinsend und dachte, was ich doch für ein\neigentümlicher, verdrehter und verlogener Bruder sei, daß ich vor zwei\nMinuten noch gegen die ganze verfluchte Welt grimmig die Zähne\ngefletscht hatte und jetzt beim ersten Anruf, beim ersten harmlosen Gruß\neines achtbaren Biedermanns gerührt und übereifrig ja und amen sagte und\nmich im Genuß von ein bißchen Wohlwollen, Achtung und Freundlichkeit wie\nein Ferkel wälzte. So standen die beiden Harrys, beides außerordentlich\nunsympathische Figuren, dem artigen Professor gegenüber, verhöhnten\neinander, beobachteten einander, spuckten voreinander aus und stellten\nsich, wie immer in solchen Lagen, wieder einmal die Frage: ob das nun\neinfach menschliche Dummheit und Schwäche sei, allgemeines Menschenlos,\noder ob dieser sentimentale Egoismus, diese Charakterlosigkeit, diese\nUnsauberkeit und Zwiespältigkeit der Gefühle bloß eine persönliche,\nsteppenwölfische Spezialität sei. War die Schweinerei allgemein\nmenschlich, nun, dann konnte sich meine Weltverachtung mit erneuter\nWucht darauf stürzen; war es nur meine persönliche Schwäche, so ergab\nsich daraus Anlaß zu einer Orgie der Selbstverachtung.","Über dem Streit zwischen den beiden Harrys wurde der Professor beinah\nvergessen; plötzlich war er mir wieder lästig, und ich eilte, ihn\nloszuwerden. Lange sah ich ihm nach, wie er unter der kahlen Allee\ndavonging, mit dem gutmütigen und etwas komischen Gang eines Idealisten,\neines Gläubigen. Heftig tobte die Schlacht in meinem Innern, und während\nich mechanisch die steifen Finger krümmte und wieder streckte, im Kampf\nmit der heimlich wühlenden Gicht, mußte ich mir gestehen, daß ich mich\nda hatte übertölpeln lassen, daß ich mir nun eine Einladung auf halb\nacht Uhr zum Abendessen auf den Hals geladen hatte samt Verpflichtung zu\nHöflichkeiten, wissenschaftlichem Geschwatze und Betrachtung fremden\nFamilienglücks. Zornig ging ich nach Hause, mischte Kognak und Wasser,\nschluckte dazu meine Gichtpillen hinunter, legte mich auf den Diwan und\nversuchte zu lesen. Als es mir endlich gelungen war, eine Weile in\n„Sophiens Reise von Memel nach Sachsen“ zu lesen, einem entzückenden\nSchmöker aus dem achtzehnten Jahrhundert, fiel mir plötzlich die\nEinladung wieder ein und daß ich nicht rasiert war und daß ich mich\nanziehen müsse. Weiß Gott, warum ich mir das angetan hatte! Also, Harry,\nsteh auf, lege dein Buch weg, seife dich ein, kratze dir das Kinn\nblutig, zieh dich an und habe ein Wohlgefallen an den Menschen! Und\nwährend ich mich einseifte, dachte ich an das dreckige Lehmloch im\nFriedhof, in das man heut den Unbekannten hinuntergeseilt hatte, und an\ndie verkniffenen Gesichter der gelangweilten Mitchristen und konnte\nnicht einmal darüber lachen. Dort endete, so schien mir, an jenem\ndreckigen Lehmloch, bei den dummen verlegenen Worten des Predigers, bei\nden dummen verlegenen Mienen der Trauerversammlung, bei dem trostlosen\nAnblick all der Kreuze und Tafeln aus Blech und Marmor, bei all den\nfalschen Draht- und Glasblumen, dort endete nicht nur der Unbekannte,\ndort würde nicht nur morgen oder übermorgen auch ich enden, verscharrt,\nunter Verlegenheit und Verlogenheit der Teilnehmer in den Dreck\ngescharrt, nein, so endete alles, unser ganzes Streben, unsre ganze\nKultur, unser ganzer Glaube, unsre ganze Lebensfreude und Lebenslust,\ndie so sehr krank war und bald auch dort eingescharrt werden würde. Ein\nFriedhof war unsre Kulturwelt, hier waren Jesus Christus und Sokrates,\nhier waren Mozart und Haydn, waren Dante und Goethe bloß noch erblindete\nNamen auf rostenden Blechtafeln, umstanden von verlegenen und verlogenen\nTrauernden, die viel dafür gegeben hätten, wenn sie an die Blechtafeln\nnoch hätten glauben können, die ihnen einst heilig gewesen waren, die\nviel dafür gegeben hätten, auch nur wenigstens ein redliches, ernstes\nWort der Trauer und Verzweiflung über diese untergegangne Welt sagen zu\nkönnen, und denen statt allem nichts blieb als das verlegne grinsende\nHerumstehen an einem Grab. Wütend kratzte ich mir am Kinn die ewige\nStelle wieder auf und ätzte eine Weile an der Wunde, mußte aber dennoch\nden eben angelegten frischen Kragen nochmals wechseln und wußte durchaus\nnicht, warum ich das alles tue, denn ich fühlte nicht die mindeste Lust,\nzu jener Einladung zu gehen. Aber ein Stück von Harry spielte wieder\nTheater, nannte den Professor einen sympathischen Kerl, sehnte sich nach\nein wenig Menschengeruch, Schwatz und Geselligkeit, erinnerte sich an\ndes Professors hübsche Frau, fand den Gedanken an einen Abend bei\nfreundlichen Gastgebern im Grunde doch recht ermunternd und half mir ein\nenglisches Pflaster aufs Kinn kleben, half mir mich anziehen und eine\nanständige Krawatte umbinden und brachte mich sanft davon ab, meinem\neigentlichen Wunsch zu folgen und zu Hause zu bleiben. Zugleich dachte\nich: so, wie ich jetzt mich anziehe und ausgehe, den Professor besuche\nund mehr oder weniger erlogene Artigkeiten mit ihm austausche, alles\nohne es eigentlich zu wollen, so tun und leben und handeln die meisten\nMenschen Tag für Tag, Stunde um Stunde zwanghaft und ohne es eigentlich\nzu wollen, machen Besuche, führen Unterhaltungen, sitzen Amts- und\nBureaustunden ab, alles zwanghaft, mechanisch, ungewollt, alles könnte\nebensogut von Maschinen gemacht werden oder unterbleiben; und diese ewig\nfortlaufende Mechanik ist es, die sie hindert, gleich mir, Kritik am\neigenen Leben zu üben, seine Dummheit und Seichtheit, seine scheußlich\ngrinsende Fragwürdigkeit, seine hoffnungslose Trauer und Öde zu erkennen\nund zu fühlen. Oh, und sie haben recht, unendlich recht, die Menschen,\ndaß sie so leben, daß sie ihre Spielchen spielen und ihren Wichtigkeiten\nnachlaufen, statt sich gegen die betrübende Mechanik zu wehren und\nverzweifelt ins Leere zu starren, wie ich entgleister Mensch es tue.\nWenn ich in diesen Blättern zuweilen die Menschen verachte und auch\nverspotte, so glaube doch darum niemand, daß ich ihnen die Schuld\nzuwälzen, daß ich sie anklagen, daß ich andre für mein persönliches\nElend verantwortlich machen möchte! Ich aber, der ich nun einmal so weit\ngegangen bin und am Rande des Lebens stehe, wo es ins bodenlose Dunkel\nfällt, ich tue unrecht und lüge, wenn ich mir und andern vorzutäuschen\nversuche, als laufe auch für mich jene Mechanik noch, als sei auch ich\nnoch zu jener holden kindlichen Welt des ewigen Spiels gehörig!","Der Abend wurde denn auch entsprechend wunderbar. Vor dem Hause meines\nBekannten blieb ich einen Augenblick stehen und sah zu den Fenstern\nempor. Da wohnt dieser Mann, dachte ich, und tut Jahr um Jahr seine\nArbeit weiter, liest und kommentiert Texte, sucht nach Zusammenhängen\nzwischen vorderasiatischen und indischen Mythologien und ist vergnügt\ndabei, denn er glaubt an den Wert seines Tuns, er glaubt an die\nWissenschaft, deren Diener er ist, er glaubt an den Wert des bloßen\nWissens, des Aufspeicherns, denn er glaubt an den Fortschritt, an die\nEntwicklung. Er hat den Krieg nicht miterlebt, nicht die Erschütterung\nder bisherigen Denkgrundlagen durch Einstein (das, denkt er, geht nur\ndie Mathematiker an), er sieht nichts davon, wie rings um ihn der\nnächste Krieg vorbereitet wird, er hält Juden und Kommunisten für\nhassenswert, er ist ein gutes, gedankenloses, vergnügtes, sich wichtig\nnehmendes Kind, er ist sehr zu beneiden. Ich gab mir einen Ruck und trat\nein, wurde vom weißbeschürzten Dienstmädchen empfangen, aus irgendeiner\nAhnung mir genau die Stelle merkend, wohin sie meinen Hut und Mantel\nbrachte, ich wurde in ein warmes helles Zimmer geführt und zu warten\ngebeten, und statt ein Gebet zu sprechen oder ein wenig zu schlafen,\nfolgte ich einem spielerischen Trieb und nahm den nächsten Gegenstand in\ndie Hände, der sich mir anbot. Es war ein kleines gerahmtes Bild, das\nauf dem runden Tisch seinen Standort hatte, durch eine steife\nKartonklappe zum Schrägstehen gezwungen. Es war eine Radierung und\nstellte den Dichter Goethe dar, einen charaktervollen, genial frisierten\nGreis mit schön modelliertem Gesicht, in welchem weder das berühmte\nFeuerauge fehlte noch der Zug von leicht hofmännisch übertünchter\nEinsamkeit und Tragik, auf welche der Künstler ganz besondere Mühe\nverwandt hatte. Es war ihm gelungen, diesem dämonischen Alten,\nseiner Tiefe unbeschadet, einen etwas professoralen oder auch\nschauspielerischen Zug von Beherrschtheit und Biederkeit mitzugeben und\nihn, alles in allem, zu einem wahrhaft schönen alten Herrn zu gestalten,\nwelcher jedem Bürgerhause zum Schmuck gereichen
