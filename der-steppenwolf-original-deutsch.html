und Knospengeruch, Rosa und ihr braunes Haar, aufschwellende\nSehnsucht und süße würgende Angst. Alles war wie damals, und mir schien,\nich habe niemals mehr in meinem Leben so geliebt, wie ich damals Rosa\nliebte. Aber diesmal war es mir gegeben, sie anders zu empfangen als\njenesmal. Ich sah ihr Erröten, als sie mich erkannte, sah ihr Bemühen,\ndas Erröten zu verbergen, und wußte sofort, daß sie mich gern habe, daß\nihr diese Begegnung dasselbe bedeute wie mir. Und statt wieder den Hut\nzu ziehen und feierlich mit gezogenem Hut zu stehen, bis sie vorüber\nwäre, tat ich diesmal trotz Angst und Beklemmung, was mein Blut mich tun\nhieß, und rief: „Rosa! Gott sei Dank, daß du gekommen bist, du schönes\nschönes Mädchen. Ich habe dich so lieb.“ Das war vielleicht nicht das\nGeistreichste, was sich in diesem Augenblick sagen ließ, allein es\nbedurfte hier keines Geistes, es genügte vollkommen. Rosa machte kein\nDamengesicht und ging nicht weiter, Rosa blieb stehen, sah mich an und\nwurde noch röter als vorher und sagte: „Grüß’ Gott, Harry, hast du mich\ndenn wirklich gern?“ Dazu strahlten ihre braunen Augen aus dem kräftigen\nGesicht, und ich spürte: mein ganzes vergangenes Leben und Lieben war\nfalsch und verworren und voll dummen Unglücks gewesen von dem Augenblick\nan, wo ich Rosa an jenem Sonntag hatte davonlaufen lassen. Jetzt aber\nwar der Fehler gutgemacht, und es wurde alles anders, wurde alles gut.","Wir gaben einander die Hände, und Hand in Hand gingen wir langsam\nweiter, unsäglich glücklich, sehr verlegen, wußten nicht, was sagen und\nwas tun, begannen aus Verlegenheit schneller zu laufen und trabten, bis\nwir den Atem verloren und stehenbleiben mußten, ohne aber unsre Hände\nloszulassen. Wir waren beide noch in der Kindheit und wußten nicht recht\nwas miteinander anzufangen, wir kamen an jenem Sonntag nicht einmal bis\nzu einem ersten Kuß, aber wir waren ungeheuer glücklich. Wir standen und\natmeten, wir setzten uns ins Gras, und ich streichelte ihre Hand, und\nsie fuhr mir mit der andern Hand schüchtern übers Haar, und dann standen\nwir wieder auf und probierten zu messen, wer von uns größer sei, und\neigentlich war ich um einen Fingerbreit größer, aber ich gab es nicht\nzu, sondern stellte fest, daß wir ganz genau gleich groß seien und daß\nder liebe Gott uns füreinander bestimmt habe und daß wir uns später\nheiraten würden. Da sagte Rosa, sie rieche Veilchen, und wir knieten im\nkurzen Frühlingsgras und suchten und fanden ein paar Veilchen mit kurzen\nStielchen, und jedes schenkte die seinen dem andern, und als es kühler\nwurde und das Licht schon schräg über die Felsen fiel, sagte Rosa, sie\nmüsse heim, und da wurden wir beide sehr traurig, denn begleiten durfte\nich sie nicht, aber nun hatten wir ein Geheimnis miteinander, und das\nwar das Holdeste, was wir besaßen. Ich blieb oben in den Felsen, roch an\nRosas Veilchen, legte mich über einem Absturz an den Boden, das Gesicht\nüber der Tiefe, und schaute hinab auf die Stadt und lauerte, bis ihre\nsüße kleine Gestalt tief unten erschien und am Brunnen vorbei und über\ndie Brücke lief. Und jetzt wußte ich sie in ihres Vaters Haus\nangekommen, und dort ging sie durch die Stuben, und ich lag hier oben\nweit von ihr, aber von mir zu ihr lief ein Band, lief ein Strom, wehte\nein Geheimnis.","Wir sahen uns wieder, hier und dort, auf den Felsen, bei den\nGartenzäunen, diesen ganzen Frühling lang, und gaben uns, als der\nFlieder anfing zu blühen, den ersten ängstlichen Kuß. Wenig war es, was\nwir Kinder einander geben konnten, und unser Kuß war noch ohne Glut und\nohne Fülle, und das lose Haargekräusel um ihre Ohren wagte ich nur leise\nzu streicheln, aber alles war unser, wessen wir an Liebe und Freude\nfähig waren, und mit jeder schüchternen Berührung, mit jedem unreifen\nLiebeswort, mit jedem bangen Aufeinanderwarten lernten wir ein neues\nGlück, stiegen wir eine kleine Stufe an der Liebesleiter empor.","So lebte ich, mit Rosa und den Veilchen beginnend, mein ganzes\nLiebesleben noch einmal durch, unter glücklicheren Sternen. Rosa verlor\nsich, und Irmgard erschien, und die Sonne wurde heißer, die Sterne\ntrunkener, aber nicht Rosa noch Irmgard wurde mein, Stufe um Stufe mußte\nich steigen, viel erleben, viel lernen, mußte auch Irmgard, auch Anna\nwieder verlieren. Jedes Mädchen, das ich einst in meiner Jugend geliebt,\nliebte ich wieder, aber jedem vermochte ich Liebe einzuflößen, jeder\netwas zu geben, von jeder beschenkt zu werden. Wünsche, Träume und\nMöglichkeiten, die einst einzig in meiner Phantasie gelebt hatten, waren\njetzt Wirklichkeit und wurden gelebt. O ihr schönen Blumen alle, Ida und\nLore, ihr alle, die ich einst einen Sommer lang, einen Monat lang, einen\nTag lang geliebt habe!","Ich begriff, daß ich jetzt der hübsche glühende kleine Jüngling war, den\nich zuvor so eifrig nach der Liebespforte hatte laufen sehen, daß ich\njetzt dies Stück von mir, dies nur zu einem Zehntel, einem Tausendstel\nerfüllte Stück meines Wesens und Lebens auslebte und wachsen ließ,\nunbeschwert von allen den andern Figuren meines Ichs, ungestört vom\nDenker, ungequält vom Steppenwolf, ungeschmälert vom Dichter, vom\nPhantasten, vom Moralisten. Nein, jetzt war ich nichts andres als\nLiebender, atmete kein andres Glück und kein andres Leid als das der\nLiebe. Schon Irmgard hatte mich tanzen, Ida mich küssen gelehrt, und die\nSchönste, Emma, war die erste, die mir, am Herbstabend unterm wehenden\nUlmenlaub, ihre bräunlichen Brüste zu küssen und den Becher der Lust zu\ntrinken gab.","Vieles erlebte ich in Pablos kleinem Theater, und kein Tausendstel davon\nist mit Worten zu sagen. Alle Mädchen, die ich je geliebt, waren nun\nmein, jede gab mir, was nur sie allein zu geben hatte, jeder gab ich,\nwas nur sie von mir zu nehmen wußte. Viel Liebe, viel Glück, viel\nWollust, viel Verwirrung auch und Leid bekam ich zu kosten, alle\nversäumte Liebe meines Lebens blühte in dieser Traumstunde zauberhaft in\nmeinem Garten, keusche zarte Blumen, grelle lodernde Blumen, dunkle\nschnellwelkende Blumen, flackernde Wollust, innige Träumerei, glühende\nSchwermut, angstvolles Sterben, strahlende Neugeburt. Ich fand Frauen,\ndie nur eilig und im Sturm zu gewinnen waren, und andre, um welche lang\nund sorgfältig zu werben ein Glück war; jeder dämmernde Winkel meines\nLebens tauchte wieder auf, in welchem einst, sei es nur eine Minute\nlang, die Stimme des Geschlechts mir gerufen, ein Frauenblick mich\nentzündet, ein Schimmer weißer Mädchenhaut mich gelockt hatte, und alles\nVersäumte ward eingeholt. Jede wurde mein, jede auf ihre Art. Die Frau\nmit den merkwürdigen tiefbraunen Augen unter flachshellem Haar war da,\nneben der ich einst eine Viertelstunde am Fenster im Gang eines\nSchnellzugs gestanden und die später mehrmals in meinen Träumen\nerschienen war, – sie sprach kein Wort, aber sie lehrte mich ungeahnte,\nerschreckende, tödliche Liebeskünste. Und die glatte, stille, glasig\nlächelnde Chinesin vom Hafen in Marseille, mit dem glatten tiefschwarzen\nHaar und den schwimmenden Augen, auch sie wußte Unerhörtes. Jede hatte\nihr Geheimnis, duftete nach ihrem Erdreich, küßte, lachte auf ihre\nWeise, war auf ihre besondere Art schamhaft, auf ihre besondere Art\nschamlos. Sie kamen und gingen, der Strom führte sie mir zu, spülte mich\nzu ihnen hin, von ihnen weg, es war ein spielendes, kindliches Schwimmen\nim Strom des Geschlechts, voll Reiz, voll Gefahr, voll Überraschung. Und\nich staunte darüber, wie reich mein Leben, mein scheinbar so armes und\nliebloses Steppenwolfleben, an Verliebtheiten, an Gelegenheiten, an\nLockungen gewesen war. Ich hatte sie fast alle versäumt und geflohen,\nwar über sie hinweggestolpert, hatte sie schleunigst vergessen – aber\nhier waren sie alle aufbewahrt, lückenlos, Hunderte. Und jetzt sah ich\nsie, gab mich ihnen hin, stand ihnen offen, sank in ihre rosig dämmernde\nUnterwelt hinab. Auch jene Verführung kehrte wieder, die mir Pablo einst\nangeboten hatte, und andre, frühere, die ich zu ihrer Zeit nicht einmal\nganz begriffen hatte, phantastische Spiele zu dreien und vieren,\nlächelnd nahmen sie mich in ihren Reigen mit. Viele Dinge geschahen,\nviele Spiele wurden gespielt, nicht mit Worten zu sagen.","Aus dem unendlichen Strom der Lockungen, der Laster, der Verstrickungen\ntauchte ich wieder empor, still, schweigend, gerüstet, mit Wissen\ngesättigt, weise, tief erfahren, reif für Hermine. Als letzte Figur in\nmeiner tausendgestaltigen Mythologie, als letzter Name in der\nunendlichen Reihe tauchte sie auf, Hermine, und zugleich kehrte mir das\nBewußtsein wieder und machte dem Liebesmärchen ein Ende, denn ihr wollte\nich nicht hier in der Dämmerung eines Zauberspiegels begegnen, ihr\ngehörte nicht nur jene eine Figur meines Schachspiels, ihr gehörte der\nganze Harry. Oh, ich würde nun mein Figurenspiel so umbauen, daß alles\nsich auf sie bezog und zur Erfüllung führte.","Der Strom hatte mich an Land gespült, wieder stand ich im schweigenden\nLogengang des Theaters. Was nun? Ich griff nach den Figürchen in meiner\nTasche, aber schon war dieser Antrieb wieder verblaßt. Unerschöpflich\numgab mich diese Welt der Türen, der Inschriften, der magischen Spiegel.\nWillenlos las ich die nächste Aufschrift und schauderte:","Wie man durch Liebe tötet","stand da geschrieben. Schnell aufzuckend leuchtete ein Erinnerungsbild\nin mir, eine Sekunde lang: Hermine, am Tisch eines Restaurants,\nplötzlich von Wein und Speisen weg in ein abgründiges Gespräch verloren,\nfurchtbaren Ernst im Blick, wie sie mir sagte, daß sie mich nur darum in\nsich verliebt machen werde, um von meiner Hand getötet zu werden. Eine\nschwere Woge von Angst und Dunkelheit flutete über mein Herz, plötzlich\nstand wieder alles vor mir, plötzlich spürte ich im Innersten wieder Not\nund Schicksal. Verzweifelnd griff ich in meine Tasche, um die Figuren\nhervorzulangen, um ein wenig Magie zu treiben und die Ordnung meines\nSchachbretts umzustellen. Es waren keine Figuren mehr da. Statt der\nFiguren zog ich ein Messer aus der Tasche. Zu Tode erschrocken lief ich\ndurch den Korridor, an den Türen vorbei, stand plötzlich dem riesigen\nSpiegel gegenüber, blickte hinein. Im Spiegel stand, hoch wie ich, ein\nriesiger schöner Wolf, stand still, blitzte scheu aus unruhigen Augen.\nFlackernd blinzelte er mich an, lachte ein wenig, daß die Lefzen sich\neinen Augenblick trennten und die rote Zunge zu sehen war.","Wo war Pablo? Wo war Hermine? Wo war der kluge Kerl, der so hübsch vom\nAufbau der Persönlichkeit geschwatzt hatte?","Nochmals blickte ich in den Spiegel. Ich war toll gewesen. Kein Wolf\nstand hinter dem hohen Glas und rollte die Zunge im Maul. Im Spiegel\nstand Ich, stand Harry, mit grauem Gesicht, von allen Spielen verlassen,\nvon allen Lastern ermüdet, scheußlich bleich, aber immerhin ein Mensch,\nimmerhin jemand, mit dem man reden konnte.","„Harry,“ sagte ich, „was tust du da?“","„Nichts,“ sagte der im Spiegel, „ich warte nur. Ich warte auf den Tod.“","„Wo ist denn der Tod?“ fragte ich.","„Er kommt“, sagte der andre. Und ich hörte, aus den leeren Räumen im\nInnern des Theaters her, eine Musik tönen, eine schöne und schreckliche\nMusik, jene Musik aus dem „Don Juan“, die das Auftreten des steinernen\nGastes begleitet. Schauerlich hallten die eisigen Klänge durch das\ngespenstische Haus, aus dem Jenseits, von den Unsterblichen kommend.","„Mozart!“ dachte ich und beschwor damit die geliebtesten und höchsten\nBilder meines inneren Lebens.","Da klang hinter mir ein Gelächter, ein helles und eiskaltes Gelächter,\naus einem den Menschen unerhörten Jenseits von Gelittenhaben, von\nGötterhumor geboren. Ich wandte mich um, durchfroren und beseligt von\ndiesem Lachen, und da kam Mozart gegangen, lachend ging er an mir\nvorüber, schlenderte gelassen auf eine der Logentüren zu, öffnete sie\nund trat ein, und ich folgte ihm begierig, dem Gott meiner Jugend, dem\nlebenslangen Ziel meiner Liebe und Verehrung. Die Musik erklang weiter.\nMozart stand an der Logenbrüstung, vom Theater war nichts zu sehen, den\ngrenzenlosen Raum füllte Finsternis.","„Sie sehen,“ sagte Mozart, „es geht auch ohne Saxophon. Obwohl ich\ndiesem famosen Instrument gewiß nicht zu nahe treten möchte.“","„Wo sind wir?“ fragte ich.","„Wir sind im letzten Akt des Don Giovanni, Leporello liegt schon auf den\nKnien. Eine vortreffliche Szene, und auch die Musik kann sich hören\nlassen, nun ja. Wenn sie auch noch allerlei sehr Menschliches in sich\nhat, man spürt doch schon das Jenseits heraus, das Lachen – nicht?“","„Es ist die letzte große Musik, die geschrieben worden ist“, sagte ich\nfeierlich wie ein Schullehrer. „Gewiß, es kam noch Schubert, es kam noch\nHugo Wolf, und auch den armen herrlichen Chopin darf ich nicht\nvergessen. Sie runzeln die Stirn, Maestro – o ja, auch Beethoven ist ja\nda, auch er ist wunderbar. Aber das alles, so schön es sei, hat schon\netwas von Bruchstück, von Auflösung in sich, ein Werk von so\nvollkommenem Guß ist seit dem Don Giovanni nicht mehr von Menschen\ngemacht worden.“","„Strengen Sie sich nicht an“, lachte Mozart, furchtbar spöttisch. „Sie\nsind ja wohl selber Musikant? Nun, ich habe das Metier aufgegeben, ich\nhabe mich zur Ruhe gesetzt. Nur Spaßes halber sehe ich zuweilen dem\nBetrieb noch zu.“","Er hob die Hände, als dirigierte er, und ein Mond oder sonst ein\nbleiches Gestirn ging irgendwo auf, über die Brüstung blickte ich in\nunmeßbare Raumtiefen, Nebel und Wolken zogen darin, Gebirge dämmerten\nund Meergestade, unter uns dehnte sich weltenweit eine wüstenähnliche\nEbene. In dieser Ebene sahen wir einen ehrwürdig aussehenden alten Herrn\nmit langem Barte, der mit wehmütigem Gesicht einen gewaltigen Zug von\neinigen zehntausend schwarzgekleideten Männern anführte. Es sah betrübt\nund hoffnungslos aus, und Mozart sagte:","„Sehen Sie, das ist Brahms. Er strebt nach der Erlösung, aber damit hat\nes noch gute Weile.“","Ich erfuhr, daß die schwarzen Tausende alle die Spieler jener Stimmen\nund Noten waren, welche nach göttlichem Urteil in seinen Partituren\nüberflüssig gewesen wären.","„Zu dick instrumentiert, zuviel Material vergeudet“, nickte Mozart.","Und gleich darauf sahen wir an der Spitze eines ebenso großen Heeres\nRichard Wagner marschieren und fühlten, wie die schweren Tausende an ihm\nzogen und sogen; müde mit Dulderschritten sahen wir auch ihn sich\nschleppen.","„In meiner Jugendzeit“, bemerkte ich traurig, „galten diese beiden\nMusikanten für die denkbar größten Gegensätze.“","Mozart lachte.","„Ja, das ist immer so. Aus einiger Entfernung gesehen, pflegen solche\nGegensätze einander immer ähnlicher zu werden. Das dicke Instrumentieren\nwar übrigens weder Wagners noch Brahms’ persönlicher Fehler, es war ein\nIrrtum ihrer Zeit.“","„Wie? Und für den müssen sie nun so schwer büßen?“ rief ich anklagend.","„Selbstverständlich. Es ist der Instanzenweg. Erst wenn sie die Schuld\nihrer Zeit abgetragen haben, wird sich zeigen, ob noch so viel\nPersönliches übrig ist, daß sich eine Abrechnung darüber lohnt.“","„Aber sie können doch beide nichts dafür!“","„Natürlich nicht. Sie können auch nichts dafür, daß Adam den Apfel\ngefressen hat, und müssen es doch büßen.“","„Das ist aber furchtbar.“","„Gewiß, das Leben ist immer furchtbar. Wir können nichts dafür und sind\ndoch verantwortlich. Man wird geboren, und schon ist man schuldig. Sie\nmüssen einen merkwürdigen Religionsunterricht genossen haben, wenn Sie\ndas nicht wußten.“","Mir war recht elend geworden. Ich sah mich selbst, einen todmüden\nPilger, durch die Wüste des Jenseits ziehen, beladen mit den vielen\nentbehrlichen Büchern, die ich geschrieben, mit all den Aufsätzen, mit\nallen den Feuilletons, gefolgt vom Heer der Setzer, die daran hatten\narbeiten, vom Heer der Leser, die das alles hatten schlucken müssen.\nMein Gott! Und Adam und der Apfel und die ganze übrige Erbsünde war\naußerdem noch da. Alles dieses also war abzubüßen, endloses Fegefeuer,\nund erst dann würde die Frage entstehen, ob hinter alle dem auch noch\netwas Persönliches, etwas Eigenes vorhanden, oder ob all mein Tun und\nseine Folgen bloß leerer Schaum auf dem Meere, bloß sinnloses Spiel im\nFluß des Geschehens war!","Mozart begann laut zu lachen, als er mein langes Gesicht sah. Vor Lachen\nüberschlug er sich in der Luft und schlug Triller mit den Beinen. Dazu\nschrie er mich an: „He, mein Junge, beißt dich die Zunge, zwickt dich\ndie Lunge? Denkst an deine Leser, die Äser, die armen Gefräßer, und an\ndeine Setzer, die Ketzer, die verfluchten Hetzer, die Säbelwetzer? Das\nist ja zum Lachen, du Drachen, zum lauten Lachen, zum Verkrachen, zum\nIn-die-Hosen-machen! O du gläubiges Herze, mit deiner Druckerschwärze,\nmit deinem Seelenschmerze, ich stifte dir eine Kerze, nur so zum\nScherze. Geschnickelt, geschnackelt, spektakelt, schabernackelt, mit dem\nSchwanz gewackelt, nicht lang gefackelt. Gott befohlen, der Teufel wird\ndich holen, verhauen und versohlen für dein Schreiben und Kohlen, hast\nja alles zusammengestohlen.“","Dies hingegen war mir zu stark, der Zorn ließ mir keine Zeit mehr, der\nWehmut nachzuhängen. Ich packte Mozart am Zopf, er flog davon, der Zopf\nwurde länger und länger, wie ein Kometenschweif, an dessen Ende ich hing\nund durch die Welt gewirbelt wurde. Teufel, war es kalt in dieser Welt!\nDiese Unsterblichen vertrugen eine scheußlich dünne Eisluft. Aber sie\nmachte vergnügt, diese eisige Luft, das spürte ich noch in dem kurzen\nAugenblick, eh mir die Sinne vergingen. Es durchdrang mich eine\nbitterscharfe, stahlblanke, eisige Heiterkeit, eine Lust, ebenso hell,\nwild und außerirdisch zu lachen, wie Mozart es getan hatte. Aber da war\nAtem und Bewußtsein zu Ende.","* * * * *","Verwirrt und zerschlagen fand ich mich wieder, das weiße Licht des\nKorridors spiegelte im blanken Boden. Ich war nicht bei den\nUnsterblichen, noch nicht. Ich war noch immer im Diesseits der Rätsel,\nder Leiden, der Steppenwölfe, der qualvollen Verwicklungen. Kein guter\nOrt, kein erträglicher Aufenthalt. Dem mußte ein Ende gemacht werden.","Im großen Wandspiegel stand Harry mir gegenüber. Er sah nicht gut aus,\ner sah nicht viel anders aus, als er in jener Nacht nach dem\nProfessorenbesuch und dem Ball im Schwarzen Adler ausgesehen hatte. Aber\ndas lag weit zurück, Jahre, Jahrhunderte; Harry war älter geworden, er\nhatte tanzen gelernt, hatte magische Theater besucht, er hatte Mozart\nlachen gehört, er hatte vor Tänzen, vor Frauen, vor Messern keine Angst\nmehr. Auch der mäßig Begabte, wenn er ein paar Jahrhunderte durchrannt\nhat, wird reif. Lange sah ich Harry im Spiegel an: noch kannte ich ihn\nwohl, noch immer glich er ein ganz klein wenig dem Harry von fünfzehn\nJahren, der an einem Märzsonntag in den Felsen der Rosa begegnet war und\nseinen Konfirmandenhut vor ihr gezogen hatte. Und doch war er seither\neinige hundert Jährchen älter geworden, hatte Musik und Philosophie\ngetrieben und satt gekriegt, hatte im „Stahlhelm“ Elsässer gesoffen und\nmit biederen Gelehrten über Krischna disputiert, hatte Erika und Maria\ngeliebt, war Herminens Freund geworden, hatte Automobile abgeschossen\nund mit der glatten Chinesin geschlafen, hatte Goethe und Mozart\nangetroffen und verschiedene Löcher in das Netz der Zeit und der\nScheinwirklichkeit gerissen, in dem er noch gefangen war. Hatte er auch\nseine hübschen Schachfiguren wieder verloren, so hatte er doch ein\nbraves Messer in der Tasche. Vorwärts, alter Harry, alter müder Kerl!","Pfui Teufel, wie schmeckte das Leben bitter! Ich spuckte den Harry im\nSpiegel an, ich trat mit dem Fuß gegen ihn und trat ihn in Scherben.\nLangsam ging ich durch den hallenden Gang, aufmerksam betrachtete ich\ndie Türen, die soviel Hübsches versprochen hatten: an keiner mehr stand\neine Inschrift. Langsam schritt ich alle die hundert Türen des magischen\nTheaters ab. War ich nicht heute an einem Maskenball gewesen? Hundert\nJahre waren seither vergangen. Bald wird es keine Jahre mehr geben.\nEtwas war noch zu tun, Hermine wartete noch. Eine sonderbare Hochzeit\nwürde das sein. In einer trüben Welle schwamm ich dahin, trüb gezogen,\nSklave, Steppenwolf. Pfui Teufel!","An der letzten Tür blieb ich stehen. Dorthin hatte die trübe Welle mich\ngezogen. O Rosa, o ferne Jugend, o Goethe und Mozart!","Ich öffnete. Was ich hinter der Türe fand, war ein einfaches und schönes\nBild. Auf Teppichen am Boden fand ich zwei nackte Menschen liegen, die\nschöne Hermine und den schönen Pablo, Seite an Seite, tief schlafend,\ntief erschöpft vom Liebesspiel, das so unersättlich scheint und doch so\nschnell satt macht. Schöne, schöne Menschen, herrliche Bilder,\nwundervolle Körper. Unter Herminens linker Brust war ein frisches rundes\nMal, dunkel unterlaufen, ein Liebesbiß von Pablos schönen schimmernden\nZähnen. Dort, wo das Mal war, stieß ich mein Messer hinein, so lang die\nKlinge war. Blut lief über Herminens weiße zarte Haut. Dies Blut hätte\nich weggeküßt, wenn alles etwas anders gewesen, etwas anders gegangen\nwäre. Nun tat ich es nicht; ich sah nur zu, wie das Blut lief, und sah\nihre Augen sich eine kleine Weile öffnen, schmerzvoll, tief verwundert.\n„Warum ist sie verwundert?“ dachte ich. Dann dachte ich daran, daß ich\nihr die Augen zudrücken müsse. Aber sie schlossen sich von selbst\nwieder. Es war getan. Sie drehte sich nur ein wenig auf die Seite, von\nder Achselhöhle zur Brust sah ich einen feinen zarten Schatten spielen,\nder wollte mich an irgend etwas erinnern. Vergessen! Dann lag sie still.","Lange sah ich sie an. Endlich schauerte ich wie erwachend auf und wollte\ngehen. Da sah ich Pablo sich dehnen, sah ihn die Augen öffnen und die\nGlieder recken, sah ihn sich über die schöne Tote beugen und lächeln.\nNie wird dieser Kerl ernsthaft werden, dachte ich, alles bringt ihn zum\nLächeln. Behutsam schlug Pablo eine Ecke des Teppichs um und deckte\nHermine zu bis zur Brust, daß die Wunde nicht mehr zu sehen war, und\nging dann unhörbar aus der Loge. Wo ging er hin? Ließen alle mich\nallein? Ich blieb, allein mit der halbverhüllten Toten, die ich liebte\nund beneidete. Über ihre bleiche Stirn hing die Knabenlocke herab, der\nMund strahlte rot aus dem ganz erblaßten Gesicht und war ein wenig\ngeöffnet, ihr Haar duftete zart und ließ das kleine, reichgeformte Ohr\nhalb durchschimmern.","Nun war ihr Wunsch erfüllt. Noch eh sie ganz mein geworden war, hatte\nich meine Geliebte getötet. Ich hatte das Unausdenkliche getan, und nun\nkniete ich und starrte und wußte nicht, was diese Tat bedeute, wußte\nnicht einmal, ob sie gut und richtig gewesen sei oder das Gegenteil. Was\nwürde der kluge Schachspieler, was würde Pablo zu ihr sagen? Ich wußte\nnichts, ich konnte nicht denken. Immer röter glühte der gemalte Mund aus\ndem erlöschenden Gesicht. So war mein ganzes Leben gewesen, so war mein\nbißchen Glück und Liebe gewesen wie dieser starre Mund: ein wenig Rot,\nauf ein Totengesicht gemalt.","Und von dem toten Gesicht, den toten weißen Schultern, den toten weißen\nArmen hauchte, langsam schleichend, ein Schauder aus, eine winterliche\nÖde und Einsamkeit, eine langsam, langsam wachsende Kälte, in der mir\nHände und Lippen zu erstarren begannen. Hatte ich die Sonne ausgelöscht?\nHatte ich das Herz alles Lebens getötet? Brach die Todeskälte des\nWeltraums herein?","Schaudernd starrte ich auf die steingewordene Stirn, auf die starre\nLocke, auf den bleichkühlen Schimmer der Ohrmuschel. Die Kälte, die von\nihnen ausströmte, war tödlich und war dennoch schön: sie klang, sie\nschwang wunderbar, sie war Musik!","Hatte ich nicht einst, in einer frühern Zeit, schon einmal diesen\nSchauder gefühlt, der zugleich etwas wie Glück war? Hatte ich nicht\nschon einmal diese Musik vernommen? Ja, bei Mozart, bei den\nUnsterblichen.","Verse kamen mir in den Sinn, die ich einst, in einer frühern Zeit,\nirgendwo gefunden hatte:","Wir dagegen haben uns gefunden\nIn des Äthers sterndurchglänztem Eis,\nKennen keine Tage, keine Stunden,\nSind nicht Mann noch Weib, nicht jung noch Greis ...\nKühl und wandellos ist unser ewiges Sein,\nKühl und sternhell unser ewiges Lachen ...","Da ging die Logentür auf, und herein kam, erst beim zweiten Blick von\nmir erkannt, Mozart, ohne Zopf, ohne Kniehosen und Schnallenschuhe,\nmodern gekleidet. Dicht neben mir setzte er sich hin, beinah hätte ich\nihn berührt und zurückgehalten, daß er sich nicht an dem Blut\nbeschmutze, das aus Herminens Brust an den Boden geronnen war. Er setzte\nsich und beschäftigte sich eingehend mit einigen kleinen Apparaten und\nInstrumenten, welche da herumstanden, er hatte es damit sehr wichtig,\nrückte und schraubte an dem Zeug herum, und ich blickte mit Bewunderung\nauf seine geschickten, flinken Finger, die ich so gern einmal hätte\nKlavier spielen sehen. Gedankenvoll sah ich ihm zu, oder eigentlich\nnicht gedankenvoll, sondern träumerisch und in den Anblick seiner\nschönen, klugen Hände verloren, vom Gefühl seiner Nähe erwärmt und auch\netwas beängstigt. Was er da eigentlich treibe, was er da zu schrauben\nund zu hantieren habe, darauf achtete ich gar nicht.","Es war aber ein Radioapparat, den er da aufgestellt hatte und in Gang\nbrachte, und jetzt schaltete er den Lautsprecher ein und sagte: „Man\nhört München, das _Concerto grosso_ in F-Dur von Händel.“","In der Tat spuckte, zu meinem unbeschreiblichen Erstaunen und Entsetzen,\nder teuflische Blechtrichter nun alsbald jene Mischung von\nBronchialschleim und zerkautem Gummi aus, welchen die Besitzer von\nGrammophonen und Abonnenten des Radios übereingekommen sind, Musik zu\nnennen, – und hinter dem trüben Geschleime und Gekrächze war wahrhaftig,\nwie hinter dicker Schmutzkruste ein altes köstliches Bild, die edle\nStruktur dieser göttlichen Musik zu erkennen, der königliche Aufbau, der\nkühle weite Atem, der satte breite Streicherklang.","„Mein Gott,“ rief ich entsetzt, „was tun Sie, Mozart? Ist es Ihr Ernst,\ndaß Sie sich und mir diese Schweinerei antun? Daß Sie diesen\nscheußlichen Apparat auf uns loslassen, den Triumph unsrer Zeit, ihre\nletzte siegreiche Waffe im Vernichtungskampf gegen die Kunst? Muß das\nsein, Mozart?“","O wie lachte da der unheimliche Mann, wie lachte er kalt und\ngeisterhaft, lautlos und doch alles durch sein Lachen zertrümmernd! Mit\ninnigem Vergnügen sah er meinen Qualen zu, drehte an den verfluchten\nSchrauben, rückte am Blechtrichter. Lachend ließ er die entstellte,\nentseelte und vergiftete Musik weiter in den Raum sickern, lachend gab\ner mir Antwort.","„Bitte kein Pathos, Herr Nachbar! Haben Sie übrigens das Ritardando da\nbeachtet? Ein Einfall, hm? Ja, und nun lassen Sie einmal, Sie\nungeduldiger Mensch, den Gedanken dieses Ritardando in sich hinein –\nhören Sie die Bässe? sie schreiten wie Götter – und lassen Sie diesen\nEinfall des alten Händel Ihr unruhiges Herz durchdringen und beruhigen!\nHören Sie einmal, Sie Männlein, ohne Pathos und ohne Spott, hinter dem\nin der Tat hoffnungslos idiotischen Schleier dieses lächerlichen\nApparates die ferne Gestalt dieser Göttermusik vorüberwandeln! Merken\nSie auf, es läßt sich etwas dabei lernen. Achten Sie darauf, wie diese\nirrsinnige Schallröhre scheinbar das Dümmste, Unnützeste und Verbotenste\nvon der Welt tut und eine irgendwo gespielte Musik wahllos, dumm und\nroh, dazu jämmerlich entstellt, in einen fremden, nicht zu ihr gehörigen\nRaum hinein schmeißt – und wie sie dennoch den Urgeist dieser Musik\nnicht zerstören kann, sondern an ihr nur ihre eigene ratlose Technik und\ngeistlose Betriebmacherei erweisen muß! Hören Sie gut zu, Männlein, es\ntut Ihnen not! Also, Ohren auf! So. Und nun hören Sie ja nicht bloß\neinen durch das Radio vergewaltigten Händel, der dennoch auch in dieser\nscheußlichsten Erscheinungsform noch göttlich ist, – Sie hören und\nsehen, Wertester, zugleich ein vortreffliches Gleichnis alles Lebens.\nWenn Sie dem Radio zuhören, so hören und sehen Sie den Urkampf zwischen\nIdee und Erscheinung, zwischen Ewigkeit und Zeit, zwischen Göttlichem\nund Menschlichem. Gerade so, mein Lieber, wie das Radio die herrlichste\nMusik der Welt zehn Minuten lang wahllos in die unmöglichsten Räume\nwirft, in bürgerliche Salons und in Dachkammern, zwischen schwatzende,\nfressende, gähnende, schlafende Abonnenten hinein, so, wie er diese\nMusik ihrer sinnlichen Schönheit beraubt, sie verdirbt, verkratzt und\nverschleimt und dennoch ihren Geist nicht ganz umbringen kann – gerade\nso schmeißt das Leben, die sogenannte Wirklichkeit, mit dem herrlichen\nBilderspiel der Welt um sich, läßt auf Händel einen Vortrag über die\nTechnik der Bilanzverschleierung in mittleren industriellen Betrieben\nfolgen, macht aus zauberhaften Orchesterklängen einen unappetitlichen\nTöneschleim, schiebt seine Technik, seine Betriebsamkeit, seine wüste\nNotdurft und Eitelkeit überall zwischen Idee und Wirklichkeit, zwischen\nOrchester und Ohr. Das ganze Leben ist so, mein Kleiner, und wir müssen\nes so sein lassen, und wenn wir keine Esel sind, lachen wir dazu. Leuten\nvon Ihrer Art steht es durchaus nicht zu, am Radio oder am Leben Kritik\nzu üben. Lernen Sie lieber erst zuhören! Lernen Sie ernstnehmen, was des\nErnstnehmens wert ist, und lachen über das andre! Oder haben Sie selber\nes denn etwa besser gemacht, edler, klüger, geschmackvoller? O nein,\nMonsieur Harry, das haben Sie nicht. Sie haben aus Ihrem Leben eine\nscheußliche Krankengeschichte gemacht, aus Ihrer Begabung ein Unglück.\nUnd Sie haben, wie ich sehe, da ein so hübsches, ein so entzückendes\njunges Mädchen zu nichts andrem zu brauchen gewußt, als daß Sie ihm ein\nMesser in den Leib gestochen und es kaputt gemacht haben! Halten Sie\ndenn das für richtig?“","„Richtig? O nein!“ rief ich verzweifelt. „Mein Gott, alles ist ja so\nfalsch, so höllisch dumm und schlecht! Ich bin ein Vieh, Mozart, ein\ndummes böses Vieh, krank und verdorben, da haben Sie tausendmal recht. –\nAber was dieses Mädchen betrifft: sie hat es selbst so gewollt, ich habe\nnur ihren eigenen Wunsch erfüllt.“","Mozart lachte lautlos, hatte nun aber doch die große Güte, das Radio\nabzustellen.","Meine Verteidigung klang mir selbst, der ich eben noch treuherzig an sie\ngeglaubt hatte, unversehens recht töricht. Als einst Hermine – so\nerinnerte ich mich plötzlich – über Zeit und Ewigkeit gesprochen hatte,\nda war ich sofort bereit gewesen, ihre Gedanken für ein Spiegelbild\nmeiner eigenen Gedanken anzusehen. Daß aber der Gedanke, sich von mir\ntöten zu lassen, Herminens eigenster Einfall und Wunsch und von mir\nnicht im mindesten beeinflußt sei, hatte ich als selbstverständlich\nangenommen. Aber warum hatte ich damals diesen so schrecklichen und so\nbefremdlichen Gedanken nicht bloß angenommen und geglaubt, sondern sogar\nim voraus erraten? Vielleicht doch, weil es mein eigener war? Und warum\nhatte ich Hermine gerade in dem Augenblick umgebracht, wo ich sie nackt\nin den Armen eines andern fand? Allwissend und voll Spott klang Mozarts\nlautloses Lachen.","„Harry,“ sagte er, „Sie sind ein Spaßvogel. Sollte wirklich dieses\nschöne Mädchen von Ihnen nichts andres zu wünschen gehabt haben als\neinen Messerstich? Machen Sie das einem andern weis! Na, wenigstens\nhaben Sie brav zugestochen, das arme Kind ist mausetot. Es wäre nun\nvielleicht an der Zeit, daß Sie sich die Folgen Ihrer Galanterie gegen\ndiese Dame klarmachten. Oder sollten Sie sich um die Folgen drücken\nwollen?“","„Nein,“ schrie ich, „verstehen Sie denn gar nicht? Ich mich um die\nFolgen drücken! Ich begehre ja nichts anderes als zu büßen, zu büßen, zu\nbüßen, den Kopf unters Beil zu legen und mich strafen und vernichten zu\nlassen.“","Unerträglich spöttisch sah Mozart mich an.","„Wie pathetisch Sie immer sind! Aber Sie werden schon noch Humor lernen,\nHarry. Humor ist immer Galgenhumor, und nötigenfalls lernen Sie ihn eben\nam Galgen. Sind Sie dazu bereit? Ja? Gut, dann gehen Sie zum\nStaatsanwalt, und lassen Sie den ganzen humorlosen Apparat der\nGerichtsmenschen über sich ergehen, bis zum kühlen Kopfabhacken in\nfrüher Morgenstunde im Gefängnishof. Sie sind also bereit dazu?“","Eine Inschrift blitzte plötzlich vor mir auf:","Harrys Hinrichtung","und ich nickte dazu mein Einverständnis. Ein kahler Hof zwischen vier\nMauern mit kleinen vergitterten Fenstern, ein sauber hergerichtetes\nFallbeil, ein Dutzend Herren in Talaren und Gehröcken, und inmitten\nstand ich fröstelnd in einer grauen Frühmorgenluft, das Herz\nzusammengezogen von jammervoller Bangigkeit, aber bereit und\neinverstanden. Auf Befehl trat ich vor, auf Befehl kniete ich nieder.\nDer Staatsanwalt nahm seine Mütze ab und räusperte sich, auch alle\nandern Herren räusperten sich. Er hielt ein feierliches Papier vor sich\nentfaltet, daraus las er vor:","„Meine Herren, vor Ihnen steht Harry Haller, angeklagt und schuldig\nbefunden des mutwilligen Mißbrauchs unsres magischen Theaters. Haller\nhat nicht nur die hohe Kunst beleidigt, indem er unsern schönen\nBildersaal mit der sogenannten Wirklichkeit verwechselte und ein\ngespiegeltes Mädchen mit einem gespiegelten Messer totgestochen hat, er\nhat sich außerdem unsres Theaters humorloserweise als einer\nSelbstmordmechanik zu bedienen die Absicht gezeigt. Wir verurteilen\ninfolgedessen den Haller zur Strafe des ewigen Lebens und zum\nzwölfstündigen Entzug der Eintrittsbewilligung in unser Theater. Auch\nkann dem Angeklagten die Strafe einmaligen Ausgelachtwerdens nicht\nerlassen werden. Meine Herren, stimmen Sie an: Eins – zwei – drei!“","Und auf drei stimmten sämtliche Anwesende mit tadellosem Einsatz ein\nGelächter an, ein Gelächter im höhern Chor, ein furchtbares, für\nMenschen kaum erträgliches Gelächter des Jenseits.","Als ich wieder zu mir kam, saß Mozart neben mir wie zuvor, klopfte mir\nauf die Schulter und sagte: „Sie haben Ihr Urteil gehört. Sie werden\nsich also daran gewöhnen müssen, der Radiomusik des Lebens weiter\nzuzuhören. Es wird Ihnen gut tun. Sie sind ungewöhnlich schwach begabt,\nlieber dummer Kerl, aber so allmählich werden Sie nun doch begriffen\nhaben, was von Ihnen verlangt wird. Sie sollen lachen lernen, das wird\nvon Ihnen verlangt. Sie sollen den Humor des Lebens, den Galgenhumor\ndieses Lebens erfassen. Aber natürlich sind Sie zu allem in der Welt\nbereit, nur nicht zu dem, was von Ihnen verlangt wird! Sie sind bereit,\nMädchen totzustechen, Sie sind bereit, sich feierlich hinrichten zu\nlassen, Sie wären gewiß auch bereit, hundert Jahre lang sich zu kasteien\nund zu geißeln. Oder nicht?“","„O ja, von Herzen bereit“, rief ich in meinem Elend.","„Natürlich! Für jede dumme und humorlose Veranstaltung sind Sie zu\nhaben, Sie großzügiger Herr, für alles, was pathetisch und witzlos ist!\nNun, ich aber bin dafür nicht zu haben, ich gebe Ihnen für Ihre ganze\nromantische Buße keinen Groschen. Sie wollen hingerichtet werden, Sie\nwollen den Kopf abgehackt kriegen, Sie Berserker! Für dieses blöde Ideal\nwürden Sie noch zehn Totschläge begehen. Sie wollen sterben, Sie\nFeigling, aber nicht leben. Zum Teufel, aber leben sollen Sie ja gerade!\nEs geschähe Ihnen recht, wenn Sie zur schwersten Strafe verurteilt\nwürden.“","„Oh, und was für eine Strafe wäre das?“","„Wir könnten zum Beispiel das Mädchen wieder lebendig machen und Sie mit\nihr verheiraten.“","„Nein, dazu wäre ich nicht bereit. Es gäbe ein Unglück.“","„Als ob es nicht schon genug Unglück wäre, was Sie angerichtet haben!\nAber mit der Pathetik und den Totschlägen soll es jetzt ein Ende haben.\nNehmen Sie endlich Vernunft an! Sie sollen leben, und Sie sollen das\nLachen lernen. Sie sollen die verfluchte Radiomusik des Lebens anhören\nlernen, sollen den Geist hinter ihr verehren, sollen über den Klimbim in\nihr lachen lernen. Fertig, mehr wird nicht von Ihnen verlangt.“","Leise, hinter zusammengebissenen Zähnen hervor, fragte ich: „Und wenn\nich mich weigere? Und wenn ich Ihnen, Herr Mozart, das Recht abspreche,\nüber den Steppenwolf zu verfügen und in sein Schicksal einzugreifen?“","„Dann“, sagte Mozart friedlich, „würde ich dir vorschlagen, noch eine\nvon meinen hübschen Zigaretten zu rauchen.“ Und indes er es sagte und\neine Zigarette aus der Westentasche zauberte, die er mir anbot, war er\nplötzlich nicht Mozart mehr, sondern blickte warm aus dunklen\nExotenaugen, und war mein Freund Pablo, und glich auch wie ein\nZwillingsbruder dem Mann, der mich das Schachspiel mit den Figürchen\ngelehrt hatte.","„Pablo!“ rief ich aufzuckend. „Pablo, wo sind wir?“","Pablo gab mir die Zigarette und Feuer dazu.","„Wir sind“, lächelte er, „in meinem magischen Theater, und falls du den\nTango lernen oder General werden oder dich mit Alexander dem Großen\nunterhalten willst, so steht das alles nächstesmal zu deiner Verfügung.\nAber ich muß sagen, Harry, du hast mich ein wenig enttäuscht. Du hast\ndich da arg vergessen, du hast den Humor meines kleinen Theaters\ndurchbrochen und eine Schweinerei angerichtet, du hast mit Messern\ngestochen und unsre hübsche Bilderwelt mit Wirklichkeitsflecken\nbesudelt. Das war nicht hübsch von dir. Hoffentlich hast du es\nwenigstens aus Eifersucht getan, als du Hermine und mich da liegen\nsahest. Mit dieser Figur hast du leider nicht umzugehen verstanden – ich\nglaubte, du habest das Spiel besser gelernt. Nun, es läßt sich\nkorrigieren.“","Er nahm Hermine, die in seinen Fingern alsbald zum Spielfigürchen\nverzwergte, und steckte sie in ebenjene Westentasche, aus der er vorher\ndie Zigarette genommen hatte.","Angenehm duftete der süße schwere Rauch, ich fühlte mich ausgehöhlt und\nbereit, ein Jahr lang zu schlafen.","Oh, ich begriff alles, begriff Pablo, begriff Mozart, hörte irgendwo\nhinter mir sein furchtbares Lachen, wußte alle hunderttausend Figuren\ndes Lebensspiels in meiner Tasche, ahnte erschüttert den Sinn, war\ngewillt, das Spiel nochmals zu beginnen, seine Qualen nochmals zu\nkosten, vor seinem Unsinn nochmals zu schaudern, die Hölle meines Innern\nnochmals und noch oft zu durchwandern.","Einmal würde ich das Figurenspiel besser spielen. Einmal würde ich das\nLachen lernen. Pablo wartete auf mich. Mozart wartete auf mich.","Ende","*\nDruck vom\nBibliographischen Institut AG.\nin Leipzig\n*"]}]</script>
<script>'use strict';
const $=id=>document.getElementById(id);
const KEY='ophelia-der-steppenwolf-original-deutsch-read-only-v1';
const state={page:0,size:20,night:false,bookmark:-1};
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let pages=[],sections=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function countWords(text){return (text.match(/\S+/g)||[]).length;}
function paginate(parts){
 const result=[];
 for(let section=0;section<parts.length;section++){
  let group=[],words=0;
  const flush=()=>{if(group.length){result.push({section,paragraphs:group});group=[];words=0}};
  for(const par of parts[section].paragraphs){
   const size=countWords(par);
   if(words+size>300&&group.length)flush();
   if(size>350){
    
    const lines=par.split('\n');let chunk='',n=0;
    for(const line of lines){const w=countWords(line);if(n+w>290&&chunk){group.push(chunk);flush();chunk='';n=0}chunk+=(chunk?'\n':'')+line;n+=w}
    if(chunk){group.push(chunk);words+=n}
   }else{group.push(par);words+=size}
  }
  flush();
 }
 return result;
}
function render(scroll=true){
 if(!pages.length)return;
 state.page=Math.min(Math.max(0,Number(state.page)||0),pages.length-1);
 const page=pages[state.page],part=sections[page.section];
 const box=$('reading');box.replaceChildren();
 const heading=document.createElement('h2');heading.textContent=part.name;box.append(heading);
 for(const paragraph of page.paragraphs){const p=document.createElement('p');p.lang='fr';p.className='notranslate';p.setAttribute('translate','no');p.textContent=paragraph;box.append(p)}
 $('section').value=String(page.section);
 $('pages').textContent='Page '+(state.page+1)+' / '+pages.length;
 const percent=Math.round((state.page+1)/pages.length*100);
 $('progress').textContent=percent+' % lu';$('bar').style.width=percent+'%';
 $('prev').disabled=state.page===0;$('next').disabled=state.page===pages.length-1;
 $('bookmark').textContent=state.bookmark===state.page?'♥ Signet':'♡ Signet';
 document.documentElement.style.setProperty('--size',state.size+'px');
 document.body.classList.toggle('night',state.night);
 save();
 if(scroll)document.querySelector('article').scrollIntoView({behavior:'instant',block:'start'});
}
$('prev').onclick=()=>{if(state.page>0){state.page--;render()}};
$('next').onclick=()=>{if(state.page<pages.length-1){state.page++;render()}};
$('section').onchange=()=>{const p=pages.findIndex(page=>page.section===Number($('section').value));if(p>=0){state.page=p;render()}};
$('smaller').onclick=()=>{state.size=Math.max(15,state.size-1);render(false)};
$('larger').onclick=()=>{state.size=Math.min(30,state.size+1);render(false)};
$('dark').onclick=()=>{state.night=!state.night;render(false)};
$('bookmark').onclick=()=>{state.bookmark=state.page;save();render(false);$('message').textContent='Signet enregistré à la page '+(state.page+1)};
$('return').onclick=()=>{if(state.bookmark>=0){state.page=state.bookmark;render()}else $('message').textContent='Aucun signet enregistré.'};
document.addEventListener('keydown',e=>{if(e.target.closest('button,select,input'))return;if(e.key==='ArrowRight'&&state.page<pages.length-1){state.page++;render()}else if(e.key==='ArrowLeft'&&state.page>0){state.page--;render()}});

sections=JSON.parse($('texte').textContent);
pages=paginate(sections);
$('section').replaceChildren(...sections.map((part,i)=>new Option(part.name,i)));
render(false);
</script></body></html>
