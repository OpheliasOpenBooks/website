ute nun\nwar auch für mich der Ball ein Ereignis, auf das ich mich mit Spannung\nund nicht ohne Ängstlichkeit freute. Da ich keine Dame hinzuführen\nhatte, beschloß ich, erst spät hinzugehen, dies hatte mir auch Hermine\nempfohlen.","Den „Stahlhelm“, meine einstige Zuflucht, wo die enttäuschten Männer\nihre Abende versaßen, ihren Wein sogen und Junggesellen spielten, hatte\nich in letzter Zeit selten mehr besucht, er paßte nicht mehr zum Stil\nmeines jetzigen Lebens. Aber heut abend zog es mich ganz von selbst\nwieder dorthin; in jener bangfrohen Stimmung von Schicksal und Abschied,\ndie mich zur Zeit beherrschte, gewannen alle Stationen und Gedenkorte\nmeines Lebens noch einmal jenen schmerzlich schönen Glanz des\nVergangenen, und so auch die kleine rauchige Kneipe, wo ich vor kurzem\nnoch zu den Stammgästen gehört, wo vor kurzem noch das primitive\nBetäubungsmittel einer Flasche Landwein mir genügt hatte, um wieder für\neine Nacht in mein einsames Bett gehen, um wieder für einen Tag das\nLeben ertragen zu können. Andre Mittel, heftigere Reize hatte ich\nseither gekostet, süßere Gifte geschlürft. Lächelnd betrat ich die alte\nBude, vom Gruß der Wirtin und vom Nicken der schweigsamen Stammgäste\nempfangen. Ein gebratenes Hähnlein wurde mir empfohlen und gebracht, ins\nbäurische dicke Glas floß hell der junge Elsässer Wein, freundlich sahen\ndie sauberen weißen Holztische, das alte gelbe Getäfel mich an. Und\nwährend ich aß und trank, steigerte sich in mir dies Gefühl des\nAbwelkens und Abschiedfeierns, dies süße und schmerzlich-innige Gefühl\neiner nie ganz gelösten, nun aber zur Lösung reifwerdenden\nVerwachsenheit mit all den Schauplätzen und Dingen meines früheren\nLebens. Der „moderne“ Mensch nennt dies Sentimentalität; er liebt die\nDinge nicht mehr, nicht einmal sein Heiligstes, sein Automobil, das er\nbaldmöglichst gegen eine bessere Marke hofft tauschen zu können. Dieser\nmoderne Mensch ist schneidig, tüchtig, gesund, kühl und straff, ein\nvortrefflicher Typ, er wird sich im nächsten Krieg fabelhaft bewähren.\nMir lag nichts daran, ich war kein moderner Mensch noch auch ein\naltmodischer, ich war aus der Zeit herausgefallen und trieb dahin, dem\nTode nah, zum Tod gewillt. Ich hatte nichts gegen Sentimentalitäten, ich\nwar froh und dankbar, in meinem verbrannten Herzen nur noch irgend etwas\nwie Gefühle zu spüren. So gab ich mich den Erinnerungen der alten\nKneipe, meiner Anhänglichkeit an die alten klobigen Stühle, gab mich dem\nDuft von Rauch und Wein, dem Schimmer von Gewohnheit, von Wärme, von\nHeimatähnlichkeit hin, den das alles für mich hatte. Abschiednehmen ist\nschön, es stimmt sanft. Lieb war mir mein harter Sitz, mein bäurisches\nGlas, lieb der kühle fruchtige Geschmack des Elsässers, lieb meine\nVertrautheit mit allem und jedem in diesem Raum, lieb die Gesichter der\nträumerisch hockenden Trinker, der Enttäuschten, deren Bruder ich lang\ngewesen war. Bürgerliche Sentimentalitäten waren es, die ich hier\nempfand, leicht gewürzt mit einem Duft von altmodischer\nWirtshausromantik aus der Knabenzeit her, wo Wirtshaus, Wein und Zigarre\nnoch verbotene, fremde, herrliche Dinge waren. Aber kein Steppenwolf\nerhob sich, um die Zähne zu fletschen und mir meine Sentimentalitäten zu\nFetzen zu reißen. Friedlich saß ich, angeglüht von der Vergangenheit,\nvon der schwachen Strahlung eines inzwischen untergegangenen Gestirns.","Es kam ein Straßenhändler mit gebratenen Kastanien, und ich kaufte ihm\neine Handvoll ab. Es kam eine alte Frau mit Blumen, ich kaufte ein paar\nNelken von ihr und schenkte sie der Wirtin. Erst als ich zahlen wollte\nund vergebens nach der gewohnten Rocktasche griff, merkte ich wieder,\ndaß ich im Frack war. Maskenball! Hermine!","Aber es war noch reichlich früh, ich konnte mich nicht entschließen,\nschon jetzt in die Globussäle zu gehen. Auch spürte ich, wie es mir bei\nallen diesen Vergnügungen in letzter Zeit ergangen war, mancherlei\nWiderstände und Hemmungen, eine Abneigung gegen das Eintreten in große,\nüberfüllte, geräuschvolle Räume, eine schülerhafte Schüchternheit vor\nder fremden Atmosphäre, vor der Welt der Lebemänner, vor dem Tanzen.","Im Schlendern kam ich an einem Kino vorüber, sah Lichtbündel und farbige\nRiesenplakate aufglänzen, ging ein paar Schritte weiter, kehrte wieder\num und ging hinein. Da konnte ich bis gegen elf Uhr hübsch ruhig im\nDunkeln sitzen. Vom Boy mit der Blendlaterne geführt, stolperte ich\ndurch die Vorhänge in den finstern Saal, fand einen Platz und war\nplötzlich mitten im Alten Testament. Der Film war einer von jenen,\nwelche angeblich nicht des Geldverdienens wegen, sondern um edler und\nheiliger Ziele willen mit großem Aufwand und Raffinement hergestellt\nworden sind und zu welchem am Nachmittag sogar Schüler von ihren\nReligionslehrern geführt wurden. Es wurde da die Geschichte des Moses\nund der Israeliten in Ägypten gespielt, mit einem gewaltigen Aufgebot an\nMenschen, Pferden, Kamelen, Palästen, Pharaonenglanz und Judenmühsal im\nheißen Wüstensand. Ich sah den Moses, der ein wenig nach dem Vorbilde\nvon Walt Whitman frisiert war, einen prachtvollen Theatermoses, am\nlangen Stab mit Wotansschritten feurig und düster durch die Wüste\nwandern, den Juden voraus. Ich sah ihn am Roten Meer zu Gott beten, und\nsah das Rote Meer auseinandergehen und eine Straße freigeben, einen\nHohlweg zwischen gestauten Wasserbergen (auf welche Weise dies von den\nKinoleuten bewerkstelligt worden war, darüber konnten sich die vom\nPfarrer in diesen Religionsfilm geführten Konfirmanden lange streiten),\nich sah den Propheten und das furchtsame Volk hindurchschreiten, sah\nhinter ihnen die Streitwagen des Pharao auftauchen, sah die Ägypter am\nMeeresufer stutzen und scheuen, sich dann mutig hineinwagen, und sah\nüber dem prächtigen, goldgeharnischten Pharao und all seinen Wagen und\nMannen die Wasserberge zusammenschlagen, nicht ohne mich eines\nwundervollen Duetts für zwei Bässe von Händel zu erinnern, worin dies\nEreignis herrlich besungen wird. Ich sah weiterhin den Moses auf den\nSinai steigen, einen düstren Helden in düstrer Felsenwildnis, und sah\nzu, wie ihm dort Jehova vermittelst Sturm, Gewitter und Lichtsignalen\ndie zehn Gebote mitteilte, während unterdessen sein nichtswürdiges Volk\nam Fuß des Berges das goldene Kalb aufrichtete und sich ziemlich\nheftigen Belustigungen hingab. Es war mir so wunderlich und unglaublich,\ndies alles mit anzusehen, und die heiligen Geschichten, ihre Helden und\nWunder, die über unsre Kindheit einst die erste dämmernde Ahnung einer\nandern Welt, eines Übermenschlichen ergehen ließen, hier vor dankbarem\nPublikum, welches still seine mitgebrachten Brötchen aß, gegen\nEintrittsgeld vorgespielt zu sehen, ein hübsches kleines Einzelbild aus\ndem riesigen Ramsch und Kulturausverkauf dieser Zeit. Mein Gott, um\ndiese Schweinerei zu verhüten, hätten damals, außer den Ägyptern, auch\ndie Juden und alle andern Menschen lieber gleich untergehen sollen,\neines gewaltsamen und anständigen Todes, statt dieses grausigen Schein-\nund Halbundhalbtodes, den wir heute starben. Na ja!","Meine heimlichen Hemmungen, meine uneingestandene Scheu vor dem\nMaskenball war durch das Kino und dessen Anregungen nicht kleiner\ngeworden, sondern unangenehm angewachsen, und ich mußte mir, im Gedanken\nan Hermine, einen Ruck geben, um nun endlich zu den Globussälen zu\nfahren und dort einzutreten. Es war spät geworden und der Ball längst in\nvollem Gang, nüchtern und schüchtern geriet ich sogleich, noch eh ich\nabgelegt hatte, in ein heftiges Maskengewühl, wurde vertraulich\nangepufft, von Mädchen zum Besuch der Champagnerstuben aufgefordert, von\nClowns auf die Schulter gehauen und mit du angeredet. Ich ging auf\nnichts ein, drückte mich in den überfüllten Räumen mühselig zur\nGarderobe durch, und als ich meine Garderobenummer bekam, steckte ich\nsie mit großer Sorgfalt in die Tasche, im Gedanken, sie vielleicht schon\nbald wieder zu brauchen, wenn ich genug von dem Trubel hätte.","In allen Räumen des großen Gebäudes war Festbetrieb, in allen Sälen\nwurde getanzt, auch im Kellergeschoß, alle Korridore und Treppen waren\nvon Masken, Tanz, Musik, Gelächter und Gejage überflutet. Beklommen\nschlich ich durch das Gewühl, von der Negerkapelle zur Bauernmusik, vom\ngroßen strahlenden Hauptsaal in die Gänge, Stiegen, in die Bars, zu den\nBüfetts, in die Sektstuben. Die Wände waren zumeist mit wilden lustigen\nMalereien der jüngsten Künstler behangen. Alles war da, Künstler,\nJournalisten, Gelehrte, Geschäftsleute, dazu natürlich die ganze\nLebewelt der Stadt. In einem der Orchester saß Mister Pablo und blies\nbegeistert in sein geschweiftes Rohr; als er mich erkannte, sang er mir\nlaut seinen Gruß entgegen. Von der Menge geschoben, gelangte ich in\ndiesen und jenen Raum, Treppen hinauf, Treppen hinunter; ein Gang im\nKellergeschoß war von den Künstlern als Hölle ausgestattet, und eine\nMusikbande von Teufeln paukte darin wie rasend. Allmählich begann ich\nnach Hermine, nach Maria auszuspähen, begab mich auf die Suche, bemühte\nmich mehrmals, in den Hauptsaal zu dringen, lief aber jedesmal fehl oder\nhatte den Strom der Menge gegen mich. Um Mitternacht hatte ich noch\nniemand gefunden; obwohl ich noch nicht getanzt hatte, war mir schon\nheiß und schwindlig, ich warf mich in den nächsten Stuhl, zwischen\nlauter Fremden, ließ mir Wein geben und fand, das Mitmachen solcher\nlärmiger Feste sei nichts für einen alten Mann wie mich. Resigniert\ntrank ich mein Glas Wein, starrte auf die nackten Arme und Rücken der\nWeiber, sah die vielen grotesken Maskenfiguren vorbeiwehen, ließ mich\npuffen und schickte die paar Mädchen schweigend weiter, die auf meinem\nSchoß sitzen oder mit mir tanzen wollten. „Alter Brummbär“, rief eine\nund hatte recht. Ich beschloß, mir etwas Mut und Laune anzutrinken, aber\nauch der Wein schmeckte mir nicht, ich brachte kaum das zweite Glas\nhinunter. Und allmählich spürte ich, wie der Steppenwolf hinter mir\nstand und die Zunge herausstreckte. Es war nichts los mit mir, ich war\nhier am falschen Ort. Ich war ja in bester Absicht gekommen, aber ich\nkonnte hier nicht froh werden, und die laute brausende Freude, das\nGelächter und die ganze Tollerei ringsum erschien mir dumm und\nerzwungen.","So kam es, daß ich um ein Uhr enttäuscht und böse mich wieder zur\nGarderobe zurückpirschte, um den Mantel anzuziehen und zu gehen. Es war\neine Niederlage, ein Rückfall in den Steppenwolf, und Hermine würde es\nmir kaum verzeihen. Aber ich konnte nicht anders. Ich hatte auf dem\nmühsamen Weg durchs Gedränge bis zur Garderobe nochmals sorgfältig um\nmich geschaut, ob ich keine der Freundinnen sähe. Vergebens. Nun stand\nich am Schalter, der höfliche Mann hinter der Schranke hielt schon die\nHand nach meiner Nummer ausgestreckt, ich griff in die Westentasche –\ndie Nummer war nicht mehr da! Teufel, das hatte noch gefehlt. Mehrmals\nwährend meiner traurigen Wanderungen durch die Säle, während meines\nSitzens beim faden Wein hatte ich in die Tasche gegriffen, mit dem\nEntschluß zum Wiederfortgehen kämpfend, und hatte stets die runde flache\nMarke an ihrem Ort gefühlt. Und jetzt war sie fort. Alles war gegen\nmich.","„Nummer verloren?“ fragte ein kleiner rot und gelber Teufel neben mir\nmit schriller Stimme. „Da, Kamerad, kannst die meine haben“, und\nstreckte sie mir auch schon dar. Während ich sie mechanisch annahm und\nin den Fingern drehte, war der flinke kleine Kerl schon wieder\nverschwunden.","Als ich aber die kleine runde Kartonmünze ans Auge hob, um nach der\nNummer zu sehen, stand gar keine Nummer darauf, sondern ein Gekritzel in\nkleiner Schrift. Ich bat den Garderobenmann zu warten, ging unter den\nnächsten Leuchter und las. Da stand in kleinen taumelnden Buchstaben,\nschwer zu lesen, etwas gekritzelt:","Heut nacht von vier Uhr an magisches Theater\n– nur für Verrückte –\nEintritt kostet den Verstand.\nNicht für jedermann. Hermine ist in der Hölle","Wie eine Marionette, deren Draht dem Spieler einen Augenblick entglitten\nwar, nach kurzem, steifem Tod und Stumpfsinn wieder auflebt, wieder ins\nSpiel gehört, tanzt und agiert, so lief ich, am magischen Draht\ngerissen, in das Getümmel, dem ich soeben müde, lustlos und alt\nentflohen war, elastisch, jung und eifrig wieder zurück. Nie hat ein\nSünder es eiliger gehabt, in die Hölle zu kommen. Eben noch hatten mich\ndie Lackschuhe gedrückt, hatte mich die dicke parfümierte Luft\nangewidert, die Hitze mich erschlafft; jetzt lief ich hurtig auf\nfedernden Füßen im Onesteptakt durch alle Säle, der Hölle entgegen,\nfühlte die Luft voll Zauber, wurde gewiegt und getragen von der Wärme,\nvon all der brausenden Musik, vom Taumel der Farben, vom Duft der\nFrauenschultern, vom Rausch der Hunderte, vom Lachen, vom Tanztakt, vom\nGlanz all der entzündeten Augen. Eine spanische Tänzerin flog mir in die\nArme: „Tanz’ mit mir!“ – „Geht nicht,“ sagte ich, „ich muß in die Hölle.\nAber einen Kuß von dir nehm’ ich gerne mit.“ Der rote Mund unter der\nMaske kam mir entgegen, und erst im Kuß erkannte ich Maria. Fest schloß\nich sie in die Arme, wie eine reife Sommerrose blühte ihr voller Mund.\nUnd nun tanzten wir auch schon, die Lippen noch aufeinander, und tanzten\nan Pablo vorbei, der hing verliebt über seiner zärtlich heulenden\nTonröhre, strahlend und halb abwesend umfing uns sein schöner Tierblick.\nAber eh wir zwanzig Tanzschritte getan hatten, brach die Musik ab,\nungern ließ ich Maria aus meinen Händen.","„Gern hätte ich noch einmal mit dir getanzt,“ sagte ich, berauscht von\nihrer Wärme, „komm ein paar Schritte mit, Maria, ich bin verliebt in\ndeinen schönen Arm, laß ihn mir noch einen Augenblick! Aber sieh,\nHermine hat mich gerufen. Sie ist in der Hölle.“","„Ich dachte es mir. Leb’ wohl, Harry, ich behalte dich lieb.“ Sie nahm\nAbschied. Abschied war es, Herbst war es, Schicksal war es, wonach die\nSommerrose so reif und voll geduftet hatte.","Weiter lief ich, durch die langen Korridore voll zärtlichen Gedränges,\ndie Treppen hinab, in die Hölle. Dort brannten an pechschwarzen Wänden\ngrelle böse Lampen, und die Teufelskapelle spielte fiebernd. Auf einem\nhohen Barstuhl saß ein hübscher Jüngling ohne Maske, im Frack, der\nmusterte mich kurz mit einem spöttischen Blick. Ich ward vom Tanzstrudel\nan die Wand gedrückt, gegen zwanzig Paare tanzten in dem sehr engen\nRaum. Gierig und ängstlich beobachtete ich alle Frauen, die meisten\nwaren noch maskiert, einige lachten mich an, aber keine war Hermine.\nSpöttisch blickte der schöne Jüngling vom hohen Barstuhl herüber. In der\nnächsten Tanzpause, dachte ich, würde sie kommen und mich anrufen. Der\nTanz ging zu Ende, aber niemand kam.","Ich ging zur Bar hinüber, die in eine Ecke des kleinen niedern Raumes\ngeklemmt war. Neben dem Stuhl des Jünglings stellte ich mich an und ließ\nmir Whisky geben. Während ich trank, sah ich das Profil des jungen\nMannes, es sah so bekannt und reizend aus, wie ein Bild aus sehr ferner\nZeit, kostbar durch den stillen Staubschleier der Vergangenheit. Oh, da\ndurchzuckte es mich: es war ja Hermann, mein Jugendfreund!","„Hermann!“ sagte ich zögernd.","Er lächelte. „Harry? Hast du mich gefunden?“","Es war Hermine, nur wenig umfrisiert und leicht geschminkt, apart und\nbleich blickte ihr kluges Gesicht aus dem modischen Stehkragen,\nwunderlich klein kamen ihre Hände aus den weiten schwarzen Frackärmeln\nund weißen Manschetten hervor, wunderlich zierlich, in schwarz-weißen\nseidenen Herrensocken, ihre Füße aus den langen schwarzen Hosen.","„Ist dies das Kostüm, Hermine, in dem du mich in dich verliebt machen\nwillst?“","„Bisher“, nickte sie, „habe ich erst einige Damen verliebt gemacht. Aber\njetzt kommst du an die Reihe. Laß uns erst ein Glas Champagner trinken.“","Dies taten wir, auf unsern hohen Barstühlen hockend, während nebenan der\nTanz weiterging und die heiße heftige Streichmusik schwoll. Und ohne daß\nHermine sich darum irgendwelche Mühe zu geben schien, wurde ich sehr\nbald in sie verliebt. Da sie Herrenkleider trug, konnte ich nicht mit\nihr tanzen, konnte mir keine Zärtlichkeit, keinen Angriff erlauben, und\nwährend sie fern und neutral erschien in ihrer Männermaske, umgab sie\nmich in Blicken, in Worten, in Gebärden mit allen Reizen ihrer\nWeiblichkeit. Ohne sie nur berührt zu haben, unterlag ich ihrem\nZauber, und dieser Zauber selbst blieb in ihrer Rolle, war ein\nhermaphrodisischer. Denn sie unterhielt sich mit mir über Hermann und\nüber die Kindheit, über meine und ihre, über jene Jahre vor der\nGeschlechtsreife, in denen das jugendliche Liebesvermögen nicht nur\nbeide Geschlechter, sondern alles und jedes umfaßt, Sinnliches und\nGeistiges, und alles mit dem Liebeszauber und der märchenhaften\nVerwandlungsfähigkeit begabt, die nur Auserwählten und Dichtern auch\nnoch in späteren Lebensaltern zu Zeiten wiederkehrt. Sie spielte\ndurchaus den Jüngling, rauchte Zigaretten und plauderte leicht und\ngeistvoll, oft ein wenig spottlustig, aber alles war von Eros\ndurchschienen, alles verwandelte sich auf dem Wege zu meinen Sinnen in\nholde Verführung.","Wie gut und genau hatte ich Hermine zu kennen gemeint, und wie\nvollkommen neu offenbarte sie sich mir in dieser Nacht! Wie sanft und\nunmerklich zog sie das ersehnte Netz um mich, wie spielend und nixenhaft\ngab sie mir das süße Gift zu trinken!","Wir saßen und plauderten und tranken Champagner. Wir schlenderten\nbeobachtend durch die Säle, abenteuernde Entdecker, suchten uns Paare\naus, deren Liebesspiel wir belauschten. Sie zeigte mir Frauen, mit denen\nzu tanzen sie mich aufforderte, und gab mir Ratschläge über die\nVerführungskünste, welche bei dieser und bei jener anzuwenden seien. Wir\ntraten als Nebenbuhler auf, strichen beide eine Weile derselben Frau\nnach, tanzten abwechselnd beide mit ihr, suchten beide sie zu gewinnen.\nUnd doch war dies alles nur Maskenspiel, war nur ein Spiel zwischen uns\nbeiden, flocht uns beide enger zusammen, entzündete uns beide\nfüreinander. Alles war Märchen, alles war um eine Dimension reicher, um\neine Bedeutung tiefer, war Spiel und Symbol. Wir sahen eine sehr schöne\njunge Frau, die etwas leidend und unzufrieden aussah, Hermann tanzte mit\nihr, brachte sie zum Blühen, verschwand mit ihr in eine Sektlaube und\nerzählte mir nachher, sie habe diese Frau nicht als Mann erobert,\nsondern als Frau, mit dem Zauber von Lesbos. Mir aber ward allmählich\ndies ganze tönende Haus voll tanzbrausender Säle, dieses berauschte Volk\nvon Masken zu einem tollen Traumparadies, Blüte um Blüte warb mit ihrem\nDuft, Frucht um Frucht umspielte ich suchend mit probenden Fingern,\nSchlangen blickten mich aus grünem Laubschatten verführend an,\nLotosblüte geisterte über schwarzem Sumpf, Zaubervögel lockten im\nGezweige, und alles führte mich doch zu einem ersehnten Ziel, alles lud\nmich neu mit Sehnsucht nach der Einzigen. Einmal tanzte ich mit einem\nunbekannten Mädchen, glühend, werbend, riß sie mit in Taumel und Rausch,\nund während wir im Unwirklichen schwebten, sagte sie, plötzlich\nauflachend: „Man kennt dich nicht wieder. Heut abend warst du so dumm\nund fad.“ Und ich erkannte die, die vor Stunden „alter Brummbär“ zu mir\ngesagt hatte. Nun glaubte sie mich zu haben, aber im nächsten Tanz war\nes schon eine andere, an der ich glühte. Ich tanzte zwei Stunden oder\nlänger immerzu, jeden Tanz, auch Tänze, die ich nie gelernt hatte. Immer\nwieder tauchte in meiner Nähe Hermann auf, der lächelnde Jüngling,\nnickte mir zu, verschwand im Gewühl.","Ein Erlebnis, das mir in fünfzig Jahren unbekannt geblieben war, obwohl\njeder Backfisch und Student es kennt, wurde mir in dieser Ballnacht\nzuteil: das Erlebnis des Festes, der Rausch der Festgemeinschaft, das\nGeheimnis vom Untergang der Person in der Menge, von der Unio mystica\nder Freude. Oft hatte ich davon sprechen hören, jeder Dienstmagd war es\nbekannt, und oft hatte ich das Leuchten im Auge der Erzählenden gesehen\nund hatte immer halb überlegen, halb neidisch dazu gelächelt. Jenes\nStrahlen in den trunkenen Augen eines Entrückten, eines von sich selbst\nErlösten, jenes Lächeln und halb irre Versunkensein dessen, der im\nRausch der Gemeinschaft aufgeht, hatte ich hundertmal im Leben an edlen\nund an gemeinen Beispielen gesehen, an besoffenen Rekruten und Matrosen\nebenso wie an großen Künstlern, etwa im Enthusiasmus festlicher\nAufführungen, und nicht minder an jungen Soldaten, die in den Krieg\nzogen, und noch in jüngster Zeit hatte ich dies Strahlen und Lächeln des\nglücklich Entrückten bewundert, geliebt, bespöttelt und beneidet an\nmeinem Freunde Pablo, wenn er selig im Rausch des Musizierens im\nOrchester über seinem Saxophon hing oder dem Dirigenten, dem Trommler,\ndem Mann mit dem Banjo zuschaute, entzückt, ekstatisch. Solch ein\nLächeln, solch ein kindhaftes Strahlen, hatte ich zuweilen gedacht, sei\nnur ganz jungen Menschen möglich oder solchen Völkern, die sich keine\nstarke Individuation und Differenzierung der einzelnen gestatteten. Aber\nheute, in dieser gesegneten Nacht, strahlte ich selbst, der Steppenwolf\nHarry, dies Lächeln, schwamm ich selbst in diesem tiefen, kindhaften,\nmärchenhaften Glück, atmete ich selbst diesen süßen Traum und Rausch aus\nGemeinschaft, Musik, Rhythmus, Wein und Geschlechtslust, dessen Lobpreis\nim Ballbericht irgendeines Studenten ich einst so oft mit Spott und\narmer Überlegenheit mit angehört hatte. Ich war nicht mehr ich, meine\nPersönlichkeit war aufgelöst im Festrausch wie Salz im Wasser. Ich\ntanzte mit dieser oder jener Frau, aber nicht nur sie war es, die ich im\nArm hatte, deren Haar mich streifte, deren Duft ich einsog, sondern\nalle, alle die andern Frauen mit, die im selben Saal, im selben Tanz, in\nderselben Musik wie ich schwammen und deren strahlende Gesichter wie\ngroße phantastische Blumen mir vorüberschwebten, alle gehörten mir,\nallen gehörte ich, alle hatten wir aneinander teil. Und auch die Männer\ngehörten dazu, auch in ihnen war ich, auch sie waren mir nicht fremd,\nihr Lächeln das meine, ihr Werben das meine, meines das ihre.","Ein neuer Tanz, ein Foxtrott, eroberte sich in jenem Winter die Welt,\nmit dem Titel „Yearning“. Dieser Yearning wurde einmal ums andre\ngespielt und immer neu begehrt, alle waren wir von ihm durchtränkt und\nberauscht, alle summten wir seine Melodie mit. Ich tanzte\nununterbrochen, mit jeder Frau, die mir eben in den Weg lief, mit ganz\njungen Mädchen, mit blühenden jungen Frauen, mit sommerlich vollreifen,\nmit wehmütig verblühenden: von allen entzückt, lachend, glücklich,\nstrahlend. Und als Pablo mich so strahlen sah, mich, den er immer als\neinen sehr beklagenswerten armen Teufel angesehen hatte, da blitzten\nseine Augen mich glückselig an, er stand begeistert von seinem\nOrchesterstuhl auf, stieß heftig in sein Horn, stieg auf den Stuhl,\nstand oben und blies mit vollen Backen und wiegte sich und sein\nInstrument dazu wild und selig im Takt des Yearning, und ich und meine\nTänzerin warfen ihm Kußhände zu und sangen laut mit. Ach, dachte ich\nzwischenein, mag mit mir geschehen, was da wolle, einmal bin doch auch\nich glücklich gewesen, strahlend, meiner selbst entbunden, ein Bruder\nPablos, ein Kind.","Das Zeitgefühl war mir verlorengegangen, ich weiß nicht, wieviel Stunden\noder Augenblicke dies Rauschglück dauerte. Auch bemerkte ich es nicht,\ndaß das Fest, je glühender es wurde, sich auf desto engeren Raum\nzusammenzog. Die meisten waren schon fortgegangen, in den Korridoren war\nes still geworden, und viele der Lichter waren erloschen, das\nTreppenhaus lag ausgestorben, in den oberen Sälen war eine Musikkapelle\num die andere verstummt und weggegangen; nur im Hauptsaal und in der\nHölle unten tobte noch, beständig an Glut sich steigernd, der bunte\nFestrausch. Da ich mit Hermine, dem Jüngling, nicht tanzen durfte,\nhatten wir uns immer nur in Tanzpausen flüchtig wieder getroffen und\nbegrüßt, und zuletzt war sie mir ganz und gar entschwunden, nicht dem\nAuge nur, sogar den Gedanken. Es gab keine Gedanken mehr. Aufgelöst\nschwamm ich im trunkenen Tanzgewühl, von Düften, Tönen, Seufzern, Worten\nberührt, von fremden Augen begrüßt, befeuert, von fremden Gesichtern,\nLippen, Wangen, Armen, Brüsten, Knien umgeben, von der Musik wie eine\nWelle im Takt hin und wider geworfen.","Nun sah ich plötzlich, einen Augenblick halb erwachend, unter den\nletzten, noch gebliebenen Gästen, die jetzt einen der kleinen Säle\nüberfüllten, den letzten, in dem noch Musik erklang – nun sah ich\nplötzlich eine schwarze Pierrette mit weißgemaltem Gesicht, ein schönes\nfrisches Mädchen, als einzige mit einer Gesichtsmaske bedeckt, eine\nentzückende Figur, die ich in dieser ganzen Nacht noch nie gesehen\nhatte. Während allen andern die späte Stunde anzusehen war, den roten\nerhitzten Gesichtern, den zerdrückten Kostümen, den verwelkten Kragen\nund Krausen, stand die schwarze Pierrette frisch und neu mit dem weißen\nGesicht hinter der Maske, in faltenlosem Kostüm, mit unberührter Krause,\nblanken Spitzenmanschetten und frischer Frisur. Es zog mich zu ihr, ich\numfaßte sie, zog sie in den Tanz, duftend kitzelte ihre Krause mein\nKinn, streifte ihr Haar meine Wange, zarter und inniger als jede andre\nTänzerin dieser Nacht kam ihr straffer junger Leib meinen Bewegungen\nentgegen, wich ihnen aus, zwang und lockte sie spielend zu immer neuen\nBerührungen. Und plötzlich, während ich mich im Tanzen niederbeugte und\nihren Mund mit meinem suchte, lächelte dieser Mund überlegen und\naltvertraut, ich erkannte das feste Kinn, erkannte glücklich die\nSchultern, die Ellbogen, die Hände. Es war Hermine, nicht mehr Hermann,\numgekleidet, frisch, leicht parfümiert und gepudert. Glühend trafen\nunsre Lippen zusammen, einen Augenblick schmiegte ihr ganzer Leib, bis\nhinab zu den Knien, sich verlangend und hingegeben an mich an, dann\nentzog sie mir ihren Mund und tanzte zurückhaltend und fliehend. Als die\nMusik abbrach, blieben wir umschlungen stehen, alle die entzündeten\nPaare rings um uns klatschten, stampften, schrien, peitschten die\nerschöpfte Kapelle zur Wiederholung des Yearning auf. Und nun fühlten\nwir alle plötzlich den Morgen, sahen das fahle Licht hinter den\nVorhängen, spürten das nahe Ende der Lust, ahnten die kommende Müdigkeit\nund stürzten uns blind, auflachend und verzweifelt nochmals in den Tanz,\nin die Musik, in die Lichtflut, schritten tobend im Takt, Paar an Paar\ngepreßt, fühlten noch einmal selig die große Woge über uns\nzusammenschlagen. In diesem Tanz ließ Hermine ihre Überlegenheit, ihren\nSpott, ihre Kühle fahren – sie wußte, daß sie nichts mehr zu tun\nbrauche, um mich verliebt zu machen. Ich gehörte ihr. Und sie gab sich\nhin, im Tanz, im Blick, im Kuß, im Lächeln. Alle Frauen dieser\nfiebernden Nacht, alle, mit denen ich getanzt, alle, die ich entzündet,\nalle, die mich entzündet hatten, alle, um die ich geworben, alle, an die\nich mich verlangend geschmiegt, alle, denen ich mit Liebessehnsucht\nnachgeblickt hatte, waren zusammengeschmolzen und eine einzige geworden,\ndie in meinen Armen blühte.","Lange dauerte dieser Hochzeitstanz. Zweimal, dreimal erlahmte die Musik,\nließen die Bläser ihre Instrumente sinken, stand der Klavierspieler vom\nFlügel auf, schüttelte der Primgeiger versagend den Kopf, und jedesmal\nwurden sie vom flehenden Taumel der letzten Tänzer nochmals entflammt,\nspielten nochmals, spielten schneller, spielten wilder. Dann – wir\nstanden noch verschlungen und schwer atmend vom letzten gierigen Tanz –\nschlug mit einem Knall der Klavierdeckel zu, fielen unsre Arme müde\nherab wie die der Bläser und Geiger, und der Flötist packte blinzelnd\nseine Flöte ins Futteral, Türen gingen auf, kalte Luft strömte herein,\nDiener erschienen mit Mänteln, und der Barkellner drehte das Licht ab.\nGespenstisch und schauerlich floh alles auseinander, fröstelnd drängten\nsich die Tänzer, die eben noch hellauf geglüht, in ihre Mäntel und\nschlugen die Kragen hoch. Hermine stand bleich, aber lächelnd. Langsam\nhob sie die Arme und strich sich das Haar zurück, ihre Achselhöhle\nglänzte im Lichte auf, ein dünner unendlich zarter Schatten lief von da\nzur verdeckten Brust, und die kleine schwebende Schattenlinie schien mir\nall ihren Reiz, alle Spiele und Möglichkeiten ihres schönen Leibes\nzusammenzufassen, wie ein Lächeln.","Wir standen und blickten einander an, die letzten im Saal, die letzten\nim Haus. Irgendwo unten hörte ich eine Tür schlagen, ein Glas\nzerschellen, ein Gekicher sich verlieren, vermischt mit dem bösen,\neiligen Lärm ankurbelnder Automobile. Irgendwo, in einer unbestimmbaren\nFerne und Höhe, hörte ich ein Gelächter klingen, ein ungemein helles und\nfrohes, dennoch schauerliches und fremdes Gelächter, ein Lachen wie aus\nKristall und Eis, hell und strahlend, aber kalt und unerbittlich. Woher\ndoch klang dies wunderliche Lachen mir bekannt? Ich fand es nicht.","Wir beide standen und blickten einander an. Einen Augenblick lang wurde\nich wach und nüchtern, fühlte ungeheure Müdigkeit mich von hinten\nüberfallen, fühlte die durchschwitzten Kleider widerlich feucht und lau\num mich hangen, sah meine Hände rot und dickgeädert aus zerdrückten und\nverschwitzten Manschetten hervorkommen. Aber sofort war das wieder\nvorbei, ein Blick Herminens löschte es aus. Vor ihrem Blick, aus dem\nmeine eigene Seele mich anzuschauen schien, sank alle Wirklichkeit\nzusammen, auch die Wirklichkeit meines sinnlichen Verlangens nach ihr.\nVerzaubert blickten wir einander an, blickte meine arme kleine Seele\nmich an.","„Du bist bereit?“ fragte Hermine, und ihr Lächeln verflog, wie der\nSchatten über ihrer Brust verflogen war. Fern und hoch verklang jenes\nfremde Lachen in unbekannten Räumen.","Ich nickte. O ja, ich war bereit.","Jetzt erschien in der Tür Pablo, der Musikant, und leuchtete uns aus den\nfrohen Augen an, welche eigentlich Tieraugen waren, aber Tieraugen sind\nimmer ernst, und seine lachten immer, und ihr Lachen machte sie zu\nMenschenaugen. Mit all seiner herzlichen Freundlichkeit winkte er uns\nzu. Er hatte eine buntseidene Hausjacke angetan, über deren roten\nAufschlägen sein durchweichter Hemdkragen und sein übermüdetes bleiches\nGesicht merkwürdig welk und fahl erschien, aber die strahlenden\nschwarzen Augen löschten das aus. Auch sie löschten die Wirklichkeit\naus, auch sie zauberten.","Wir folgten seinem Wink, und unter der Tür sagte er leise zu mir:\n„Bruder Harry, ich lade Sie zu einer kleinen Unterhaltung ein. Eintritt\nnur für Verrückte, kostet den Verstand. Sind Sie bereit?“ Wieder nickte\nich.","Lieber Kerl! Zart und sorglich nahm er uns am Arm, Hermine rechts, mich\nlinks, und führte uns über eine Treppe hinan in ein kleines rundes\nZimmer, das war von oben bläulich erleuchtet und beinahe ganz leer, es\nwar nichts darin als ein kleiner runder Tisch und drei Sessel, in die\nwir uns setzten.","Wo waren wir? Schlief ich? War ich zu Hause? Saß ich in einem Auto und\nfuhr? Nein, ich saß im blau erleuchteten runden Raum, in einer\nverdünnten Luft, in einer Schicht von sehr undicht gewordener\nWirklichkeit. Warum war denn Hermine so bleich? Warum sprach Pablo so\nviel? War nicht vielleicht ich es, der ihn sprechen machte, der aus ihm\nsprach? Blickte nicht auch aus seinen schwarzen Augen nur meine eigene\nSeele mich an, der verlorne bange Vogel, ebenso wie aus den grauen Augen\nHerminens?","Mit all seiner guten und etwas zeremoniösen Freundlichkeit blickte\nFreund Pablo uns an und sprach, sprach viel und lang. Er, den ich nie\nzusammenhängend hatte reden hören, den kein Disput, keine Formulierung\ninteressierte, dem ich kaum ein Denken zugetraut hatte, er sprach nun,\ner redete mit seiner guten, warmen Stimme fließend und fehlerlos.","„Freunde, ich habe euch zu einer Unterhaltung eingeladen, die Harry sich\nschon lange wünscht, von der er schon lang geträumt hat. Es ist ein\nwenig spät, und wahrscheinlich sind wir alle ein bißchen müde. Wir\nwollen darum hier erst ein wenig ausruhen und uns stärken.“","Aus einer Wandnische nahm er drei Gläschen und eine kleine drollige\nFlasche, nahm eine kleine exotische Schachtel aus farbigen Hölzern,\nschenkte aus der Flasche die drei Gläschen voll, nahm aus der Schachtel\ndrei dünne, lange, gelbe Zigaretten, zog aus der seidenen Jacke ein\nFeuerzeug und bot uns Feuer. Jeder von uns rauchte nun, in seinem Sessel\nzurückgelehnt, langsam seine Zigarette, deren Rauch dick wie Weihrauch\nwar, und trank in kleinen langsamen Schlucken die herbsüße, wunderlich\nunbekannt und fremd schmeckende Flüssigkeit, die in der Tat unendlich\nbelebend und beglückend wirkte, als werde man mit Gas gefüllt und\nverliere seine Schwere. So saßen wir, rauchten in kleinen Zügen, ruhten,\nnippten an den Gläsern, fühlten uns leicht und froh werden. Dazu sprach\nPablo gedämpft mit seiner warmen Stimme:","„Es ist mir eine Freude, lieber Harry, Sie heut ein wenig bewirten zu\ndürfen. Sie sind oft Ihres Lebens sehr überdrüssig gewesen, Sie strebten\nfort von hier, nicht wahr? Sie sehnen sich danach, diese Zeit, diese\nWelt, diese Wirklichkeit zu verlassen und in eine andre, Ihnen gemäßere\nWirklichkeit einzugehen, in eine Welt ohne Zeit. Tun Sie das, lieber\nFreund, ich lade Sie dazu ein. Sie wissen ja, wo diese andre Welt\nverborgen liegt, daß es die Welt Ihrer eigenen Seele ist, die Sie\nsuchen. Nur in Ihrem eigenen Innern lebt jene andre Wirklichkeit, nach\nder Sie sich sehnen. Ich kann Ihnen nichts geben, was nicht in Ihnen\nselbst schon existiert, ich kann Ihnen keinen andern Bildersaal öffnen\nals den Ihrer Seele. Ich kann Ihnen nichts geben, nur die Gelegenheit,\nden Anstoß, den Schlüssel. Ich helfe Ihnen Ihre eigene Welt sichtbar\nmachen, das ist alles.“","Er griff wieder in die Tasche seiner bunten Jacke und brachte einen\nrunden Taschenspiegel heraus.","„Sehen Sie: so haben Sie bisher sich selbst gesehen!“","Er hielt mir das Spiegelein vor die Augen (ein Kindervers fiel mir ein:\n„Spiegelein, Spiegelein in der Hand“), und ich sah, etwas zerflossen und\nwolkig, ein unheimliches, in sich selbst bewegtes, in sich selbst heftig\narbeitendes und gärendes Bild: mich selber, Harry Haller, und innen in\ndiesem Harry den Steppenwolf, einen scheuen, schönen, aber verirrt und\ngeängstigt blickenden Wolf, die Augen bald böse, bald traurig glimmend,\nund diese Wolfgestalt floß in unablässiger Bewegung durch Harry, so wie\nin einem Strome ein Nebenfluß von andrer Farbe wölkt und wühlt,\nkämpfend, leidvoll, einer im andern fressend, voll unerlöster Sehnsucht\nnach Gestaltung. Traurig, traurig blickte der fließende, halbgestaltete\nWolf mich aus den schönen scheuen Augen an.","„So haben Sie sich selbst gesehen“, wiederholte Pablo sanft und steckte\nden Spiegel wieder in die Tasche. Dankbar schloß ich die Augen und\nnippte am Elixier.","„Wir haben nun ausgeruht,“ sagte Pablo, „wir haben uns gestärkt und\nhaben ein wenig geplaudert. Wenn ihr euch nicht mehr müde fühlt, dann\nwill ich euch jetzt in meinen Guckkasten führen und euch mein kleines\nTheater zeigen. Seid ihr einverstanden?“","Wir erhoben uns, lächelnd ging Pablo voran, öffnete eine Tür, zog einen\nVorhang beiseite, und da standen wir im runden, hufeisenförmigen\nKorridor eines Theaters, genau in der Mitte, und nach beiden Seiten hin\nführte der gebogene Gang an sehr vielen, an unglaublich vielen schmalen\nLogentüren vorüber.","„Das ist unser Theater,“ erklärte Pablo, „ein vergnügtes Theater,\nhoffentlich werdet ihr allerlei zu lachen finden.“ Dabei lachte er laut\nauf, nur ein paar Töne, aber sie durchfuhren mich heftig, es war wieder\ndas helle, fremdartige Lachen, das ich schon vorher von oben gehört\nhatte.","„Mein Theaterchen hat so viele Logentüren, als ihr wollt, zehn oder\nhundert oder tausend, und hinter jeder Tür erwartet euch das, was ihr\ngerade sucht. Es ist ein hübsches Bilderkabinett, lieber Freund, aber es\nwürde Ihnen nichts nützen, es so zu durchlaufen, wie Sie sind. Sie\nwürden durch das gehemmt und geblendet werden, was Sie gewohnt sind,\nIhre Persönlichkeit zu nennen. Ohne Zweifel haben Sie ja längst erraten,\ndaß die Überwindung der Zeit, die Erlösung von der Wirklichkeit, und was\nimmer für Namen Sie Ihrer Sehnsucht geben mögen, nichts andres bedeuten\nals den Wunsch, Ihrer sogenannten Persönlichkeit ledig zu werden. Sie\nist das Gefängnis, in dem Sie sitzen. Und wenn Sie so, wie Sie sind, in\ndas Theater träten, so sähen Sie alles mit den Augen Harrys, alles durch\ndie alte Brille des Steppenwolfes. Sie werden darum eingeladen, sich\ndieser Brille zu entledigen und diese sehr geehrte Persönlichkeit\nfreundlichst hier in der Garderobe abzulegen, wo sie auf Wunsch\njederzeit wieder zu Ihrer Verfügung steht. Der hübsche Tanzabend, den\nSie hinter sich haben, der Traktat vom Steppenwolf, schließlich noch das\nkleine Anregungsmittel, das wir eben zu uns genommen haben, dürfte Sie\ngenügend vorbereitet haben. Sie, Harry, werden nach Ablegung Ihrer\nwerten Persönlichkeit die linke Seite des Theaters zu Ihrer Verfügung\nhaben, Hermine die rechte, im Innern können Sie sich beliebig wieder\ntreffen. Bitte, Hermine, geh einstweilen hinter den Vorhang, ich möchte\nerst Harry einführen.“","Hermine verschwand nach rechts, an einem riesengroßen Spiegel vorbei,\nder die Rückwand vom Boden bis zur Wölbung bedeckte.","„So, Harry, nun kommen Sie und seien Sie recht guter Laune. Sie in gute\nLaune zu bringen, Sie lachen zu lehren, ist der Zweck dieser ganzen\nVeranstaltung – ich hoffe, Sie machen es mir leicht. Sie fühlen sich\ndoch wohl? Ja? Haben nicht etwa Angst? Also gut, sehr gut. Sie werden\njetzt, ohne Angst und mit herzlichem Vergnügen, in unsre Scheinwelt\neintreten, indem Sie sich durch einen kleinen Scheinselbstmord\neinführen, wie das so Sitte ist.“","Er zog wieder den kleinen Taschenspiegel hervor und hielt ihn mir vors\nGesicht. Wieder blickte mir der wirre, wolkige, von der ringenden\nWolfsgestalt durchflossene Harry entgegen, ein mir wohlbekanntes und\nwahrlich nicht sympathisches Bild, dessen Vernichtung mir keine Sorgen\nbereiten konnte.","„Dieses entbehrlich gewordene Spiegelbild werden Sie jetzt auslöschen,\nlieber Freund, mehr ist nicht vonnöten. Es genügt, daß Sie, wenn Ihre\nLaune es zuläßt, dieses Bild mit einem aufrichtigen Lachen betrachten.\nSie sind hier in einer Schule des Humors, Sie sollen lachen lernen. Nun,\naller höhere Humor fängt damit an, daß man die eigene Person nicht mehr\nernst nimmt.“","Fest blickte ich in das Spiegelein, Spiegelein in der Hand, in dem der\nHarrywolf seine Zuckungen vollführte. Einen Augenblick zuckte es in mir,\ntief innen, leise, aber schmerzlich, wie Erinnerung, wie Heimweh, wie\nReue. Dann wich die leichte Beklemmung einem neuen Gefühl, jenem\nähnlich, das man empfindet, wenn aus dem mit Kokain betäubten Kiefer ein\nkranker Zahn gezogen worden ist, ein Gefühl von Erleichterung und tiefem\nAufatmen und zugleich von Verwunderung, daß es so gar nicht weh getan\nhat. Und zu diesem Gefühl gesellte sich eine frische Aufgeräumtheit und\nLachlust, der ich nicht widerstehen konnte, so daß ich in ein erlösendes\nGelächter ausbrach.","Das trübe Spiegelbildchen zuckte auf und erlosch, die kleine runde\nSpiegelfläche war plötzlich wie verbrannt, war grau und rauh und\nundurchsichtig geworden. Lachend warf Pablo die Scherbe weg, rollend\nverlor sie sich am Boden des unendlichen Korridors.","„Gut gelacht, Harry,“ rief Pablo, „du wirst noch lachen lernen wie die\nUnsterblichen. Nun hast du endlich den Steppenwolf umgebracht. Mit\nRasiermessern geht das nicht. Paß auf, daß er tot bleibt! Gleich wirst\ndu die dumme Wirklichkeit verlassen können. Wir werden beim nächsten\nAnlaß Brüderschaft trinken, Lieber, nie hast du mir so gut gefallen wie\nheut. Und wenn du dann noch Wert darauf legst, dann können wir auch\nmiteinander philosophieren und disputieren und über Musik und über\nMozart und Gluck und Plato und Goethe sprechen, soviel du willst. Du\nwirst jetzt begreifen, warum es früher nicht ging. – Hoffentlich glückt\nes dir, und du wirst den Steppenwolf für heute los. Denn natürlich ist\ndein Selbstmord kein endgültiger; wir sind hier in einem magischen\nTheater, es gibt hier nur Bilder, keine Wirklichkeit. Suche dir schöne\nund heitere Bilder aus und zeige, daß du wirklich nicht mehr in deine\nfragwürdige Persönlichkeit verliebt bist! Solltest du sie aber dennoch\nzurückbegehren, so brauchst du nur wieder in den Spiegel zu schauen, den\nich dir jetzt zeigen werde. Du kennst ja aber das alte weise Wort: Ein\nSpiegelein in der Hand ist besser als zwei an der Wand. Haha! (Wieder\nlachte er so schön und schrecklich.) – So, und jetzt ist bloß noch eine\nganz kleine, lustige Zeremonie zu vollziehen. Du hast jetzt deine\nPersönlichkeitsbrille weggeworfen, nun komm einmal und schaue in einen\nrichtigen Spiegel! Es wird dir Spaß machen.“","Unter Lachen und kleinen drolligen Liebkosungen drehte er mich um, daß\nich dem riesengroßen Wandspiegel gegenüberstand. In dem sah ich mich.","Ich sah, einen winzigen Moment lang, den mir bekannten Harry, nur mit\neinem ungewöhnlich gutgelaunten, hellen, lachenden Gesicht. Aber kaum,\ndaß ich ihn erkannt hatte, fiel er auseinander, löste sich eine zweite\nFigur von ihm ab, eine dritte, eine zehnte, eine zwanzigste, und der\nganze Riesenspiegel war voll von lauter Harrys oder Harry-Stücken,\nzahllosen Harrys, deren jeden ich nur einen blitzhaften Moment erblickte\nund erkannte. Einige von diesen vielen Harrys waren so alt wie ich,\neinige älter, einige uralt, andere ganz jung, Jünglinge, Knaben,\nSchulknaben, Lausbuben, Kinder. Fünfzigjährige und zwanzigjährige Harrys\nliefen und sprangen durcheinander, dreißigjährige und fünfjährige,\nernste und lustige, würdige und komische, gutgekleidete und zerlumpte\nund auch ganz nackte, haarlose und langlockige, und alle waren ich, und\njeder wurde blitzschnell von mir gesehen und erkannt und war\nverschwunden, nach allen Seiten liefen sie auseinander, nach links, nach\nrechts, in die Spiegeltiefe hinein, aus dem Spiegel heraus. Einer, ein\njunger eleganter Kerl, sprang dem Pablo lachend an die Brust, umarmte\nihn und lief mit ihm davon. Und einer, der mir ganz besonders gefiel,\nein hübscher, reizender Junge von sechzehn oder siebzehn Jahren, lief\nwie der Blitz in den Korridor hinein, las gierig die Inschriften an all\nden Türen, ich lief hinterher, vor einer Türe blieb er stehen, ich las\nan ihr die Aufschrift:","Alle Mädchen sind dein!\nEinwurf eine Mark","Der liebe Junge schnellte sich mit einem Sprung empor, Kopf voran,\nstürzte sich selbst in den Einwurf und war hinter der Tür verschwunden.","Auch Pablo war verschwunden, auch der Spiegel schien verschwunden und\nmit ihm alle die zahllosen Harryfiguren. Ich spürte, daß ich jetzt mir\nselber und dem Theater überlassen sei und trat neugierig von Tür zu Tür,\nund an jeder las ich eine Inschrift, eine Lockung, ein Versprechen.","* * * * *","Die Inschrift","Auf zum fröhlichen Jagen!\nHochjagd auf Automobile","lockte mich an, ich öffnete die schmale Türe und trat ein.","Da riß es mich in eine laute und aufgeregte Welt. Auf den Straßen jagten\nAutomobile, zum Teil gepanzerte, und machten Jagd auf die Fußgänger,\nüberfuhren sie zu Brei, drückten sie an den Mauern der Häuser\nzuschanden. Ich begriff sofort: es war der Kampf zwischen Menschen und\nMaschinen, lang vorbereitet, lang erwartet, lang gefürchtet, nun endlich\nzum Ausbruch gekommen. Überall lagen Tote und Zerfetzte herum, überall\nauch zerschmissene, verbogene, halbverbrannte Automobile, über dem\nwüsten Durcheinander kreisten Flugzeuge, und auch auf sie wurde von\nvielen Dächern und Fenstern aus mit Büchsen und mit Maschinengewehren\ngeschossen. Wilde, prachtvoll aufreizende Plakate an allen Wänden\nforderten in Riesenbuchstaben, die wie Fackeln brannten, die Nation auf,\nendlich sich einzusetzen für die Menschen gegen die Maschinen, endlich\ndie fetten, schöngekleideten, duftenden Reichen, die mit Hilfe der\nMaschinen das Fett aus den andern preßten, samt ihren großen, hustenden,\nböse knurrenden, teuflisch schnurrenden Automobilen totzuschlagen,\nendlich die Fabriken anzuzünden und die geschändete Erde ein wenig\nauszuräumen und zu entvölkern, damit wieder Gras wachsen, wieder aus der\nverstaubten Zementwelt etwas wie Wald, Wiese, Heide, Bach und Moor\nwerden könne. Andre Plakate hingegen, wunderbar gemalt, prachtvoll\nstilisiert, in zarteren, weniger kindlichen Farben, außerordentlich klug\nund geistvoll abgefaßt, warnten im Gegenteil alle Besitzenden und alle\nBesonnenen beweglich vor dem drohenden Chaos der Anarchie, schilderten\nwahrhaft ergreifend den Segen der Ordnung, der Arbeit, des Besitzes, der\nKultur, des Rechtes und priesen die Maschinen als höchste und letzte\nErfindung der Menschen, mit deren Hilfe sie zu Göttern werden würden.\nNachdenklich und bewundernd las ich die Plakate, die roten und die\ngrünen, fabelhaft wirkte auf mich ihre flammende Beredsamkeit, ihre\nzwingende Logik, recht hatten sie, und tief überzeugt stand ich bald vor\ndem einen, bald vor dem andern, immerhin merklich gestört durch die\nziemlich saftige Schießerei ringsum. Nun, die Hauptsache war klar: es\nwar Krieg, ein heftiger, rassiger und höchst sympathischer Krieg, worin\nes sich nicht um Kaiser, Republik, Landesgrenzen, um Fahnen und Farben\nund dergleichen mehr dekorative und theatralische Sachen handelte, um\nLumpereien im Grunde, sondern wo ein jeder, dem die Luft zu eng wurde\nund dem das Leben nicht recht mehr mundete, seinem Verdruß schlagenden\nAusdruck verlieh und die allgemeine Zerstörung der blechernen\nzivilisierten Welt anzubahnen strebte. Ich sah, wie allen die\nZerstörungs- und Mordlust so hell und aufrichtig aus den Augen lachte,\nund in mir selbst blühten diese roten wilden Blumen hoch und feist und\nlachten nicht minder. Freudig schloß ich mich dem Kampfe an.","Das Schönste von allem aber war, daß neben mir plötzlich mein\nSchulkamerad Gustav auftauchte, der seit Jahrzehnten mir Verschollene,\neinst der wildeste, kräftigste und lebensdurstigste von den Freunden\nmeiner frühen Kindheit. Mir lachte das Herz, als ich seine hellblauen\nAugen mir wieder zuzwinkern sah. Er winkte mir, und ich folgte ihm\nsofort mit Freuden.","„Herrgott, Gustav,“ rief ich glücklich, „daß man dich einmal\nwiedersieht! Was ist denn aus dir geworden?“","Ärgerlich lachte er auf, ganz wie in der Knabenzeit.","„Rindvieh, muß denn gleich wieder gefragt und geschwatzt werden?\nProfessor der Theologie bin ich geworden, so, nun weißt du es, aber\njetzt findet zum Glück keine Theologie mehr statt, Junge, sondern Krieg.\nNa komm!“","Von einem kleinen Kraftwagen, der uns eben schnaubend entgegenkam, schoß\ner den Führer herunter, sprang flink wie ein Affe auf den Wagen, brachte\nihn zum Stehen und ließ mich aufsteigen, dann fuhren wir schnell wie der\nTeufel zwischen Flintenkugeln und gestürzten Wagen hindurch, davon, zur\nStadt und Vorstadt hinaus.","„Stehst du auf seiten der Fabrikanten?“ fragte ich meinen Freund.","„Ach was, das ist Geschmacksache, wir werden uns das dann draußen\nüberlegen. Aber nein, warte mal, ich bin mehr dafür, daß wir die andere\nPartei wählen, wenn es auch im Grunde natürlich ganz egal ist. Ich bin\nTheolog, und mein Vorfahr Luther hat seinerzeit den Fürsten und Reichen\ngegen die Bauern geholfen, das wollen wir jetzt ein bißchen korrigieren.\nSchlechter Wagen, hoffentlich hält er’s noch ein paar Kilometer aus!“","Schnell wie der Wind, das himmlische Kind, knatterten wir davon, in eine\ngrüne ruhige Landschaft hinein, viele Meilen weit, durch eine große\nEbene und dann langsam steigend in ein gewaltiges Gebirg hinein. Hier\nmachten wir halt auf einer glatten, gleißenden Straße, die führte\nzwischen steiler Felswand und niedriger Schutzmauer in kühnen Kurven\nhoch, hoch über einem blauen leuchtenden See dahin.","„Schöne Gegend“, sagte ich.","„Sehr hübsch. Wir können sie Achsenstraße heißen, es sollen hier diverse\nAchsen zum Krachen kommen, Harrychen, paß mal auf!“","Eine große Pinie stand am Weg, und oben in der Pinie sahen wir aus\nBrettern etwas wie eine Hütte gebaut, einen Auslug und Hochstand. Hell\nlachte Gustav mich an, aus den blauen Augen listig zwinkernd, und eilig\nstiegen wir beide aus unsrem Wagen und kletterten am Stamm empor,\nverbargen uns tief atmend im Auslug, der uns sehr gefiel. Wir fanden\ndort Flinten, Pistolen, Kisten mit Patronen. Und kaum hatten wir uns ein\nwenig gekühlt und im Jagdstand eingerichtet, da klang schon von der\nnächsten Kurve her heiser und herrschgierig die Hupe eines großen\nLuxuswagens, der fuhr schnurrend mit hoher Geschwindigkeit auf der\nblanken Bergstraße daher. Wir hatten schon die Flinten in der Hand. Es\nwar wunderbar spannend.","„Auf den Chauffeur zielen!“ befahl Gustav schnell, eben rannte der\nschwere Wagen unter uns vorbei. Und schon zielte ich und drückte los,\ndem Lenker in die blaue Mütze. Der Mann sank zusammen, der Wagen sauste\nweiter, stieß gegen die Wand, prallte zurück, stieß schwer und wütend\nwie eine große dicke Hummel gegen die niedere Mauer, überschlug sich und\nkrachte mit einem kurzen leisen Knall über die Mauer in die Tiefe\nhinunter.","„Erledigt!“ lachte Gustav. „Den nächsten nehme ich.“","Schon kam wieder ein Wagen gerannt, klein saßen die drei oder vier\nInsassen in den Polstern, vom Kopf einer Frau wehte ein Stück Schleier\nstarr und wagrecht hinterher, ein hellblauer Schleier, es tat mir\neigentlich leid um ihn, wer weiß, ob nicht das schönste Frauengesicht\nunter ihm lachte. Herrgott, wenn wir schon Räuber spielten, so wäre es\nvielleicht richtiger und hübscher gewesen, dem Beispiel großer Vorbilder\nfolgend unsre brave Mordlust nicht auf hübsche Damen mit auszudehnen.\nGustav hatte aber schon geschossen. Der Chauffeur zuckte, sank in sich\nzusammen, der Wagen sprang am senkrechten Fels in die Höhe, fiel zurück\nund klatschte, die Räder nach oben, auf die Straße zurück. Wir warteten,\nnichts regte sich, lautlos lagen, wie in einer Falle gefangen, die\nMenschen unter ihrem Wagen. Der schnurrte und rasselte noch und drehte\ndie Räder drollig in der Luft, aber plötzlich tat er einen schrecklichen\nKnall und stand in hellen Flammen.","„Ein Fordwagen“, sagte Gustav. „Wir müssen hinunter und die Straße\nwieder frei machen.“","Wir stiegen hinab und sahen uns den brennenden Haufen an. Er war sehr\nrasch ausgebrannt, wir hatten inzwischen aus jungem Holz Hebebäume\ngemacht und lüpften ihn beiseite und über den Straßenrand in den\nAbgrund, daß es lang in den Gebüschen knackste. Zwei von den Toten waren\nbeim Drehen des Wagens herausgefallen und lagen da, die Kleider zum Teil\nverbrannt. Einer hatte den Rock noch ziemlich wohlerhalten, ich\nuntersuchte seine Taschen, ob wir fänden, wer er gewesen sei. Eine\nLedermappe kam zum Vorschein, darin waren Visitkarten. Ich nahm eine und\nlas darauf die Worte: „_Tat twam asi._“","„Sehr witzig“, sagte Gustav. „Es ist aber in der Tat gleichgültig, wie\ndie Leute heißen, die wir da umbringen. Sie sind arme Teufel wie wir,\nauf die Namen kommt es nicht an. Diese Welt muß kaputt gehen und wir\nmit. Sie zehn Minuten unter Wasser zu setzen, wäre die schmerzloseste\nLösung. Na, an die Arbeit!“","Wir warfen die Toten dem Wagen nach. Schon tutete ein neues Auto heran.\nDas schossen wir gleich von der Straße aus zusammen. Es kreiselte toll\nbetrunken eine Strecke weiter, stürzte dann und blieb keuchend liegen,\nein Insasse blieb still im Innern sitzen, ein hübsches junges Mädchen\naber stieg unverletzt, wenn auch bleich und heftig zitternd, heraus.\nFreundlich begrüßten wir sie und boten unsre Dienste an. Sie war allzu\nsehr erschrocken, konnte nicht sprechen und starrte uns eine Weile wie\nirrsinnig an.","„Na, sehen wir erst mal nach dem alten Herrn“, sagte Gustav und wandte\nsich dem Passagier zu, der noch immer hinter dem toten Chauffeur im\nSitze hing. Es war ein Herr mit kurzen grauen Haaren, er hatte die\nklugen hellgrauen Augen offen, schien aber tüchtig verletzt zu sein,\nwenigstens floß ihm Blut aus dem Munde, und den Hals hielt er unheimlich\nschief und steif.","„Erlauben Sie, alter Herr, mein Name ist Gustav. Wir haben uns\ngestattet, Ihren Chauffeur zu erschießen. Dürfen wir fragen, mit wem wir\ndie Ehre haben?“","Der Alte blickte kühl und traurig aus den kleinen Grauaugen.","„Ich bin der Oberstaatsanwalt Loering“, sagte er langsam. „Sie haben\nnicht bloß meinen armen Chauffeur umgebracht, sondern auch mich, ich\nspüre, es geht zu Ende. Warum haben Sie denn auf uns geschossen?“","„Wegen zu schnellen Fahrens.“","„Wir sind mit normaler Geschwindigkeit gefahren.“","„Was gestern normal war, ist es heute nicht mehr, Herr Oberstaatsanwalt.\nWir sind heute der Meinung, es sei jegliche Geschwindigkeit, mit welcher\nein Auto fahren möge, zu groß. Wir machen die Autos jetzt kaputt, alle,\nund die andern Maschinen auch.“","„Auch Ihre Flinten?“","„Auch sie sollen an die Reihe kommen, falls wir noch Zeit dazu finden.\nVermutlich werden wir morgen oder übermorgen alle erledigt sein. Sie\nwissen ja, unser Erdteil war scheußlich übervölkert. Na, jetzt soll es\nLuft geben.“","„Schießen Sie denn auf jedermann, ohne Wahl?“","„Gewiß. Für manche mag es ja ohne Zweifel schade sein. Zum Beispiel um\ndie junge hübsche Dame hätte es mir leid getan – sie ist wohl Ihre\nTochter?“","„Nein, es ist meine Stenographin.“","„Desto besser. Und nun steigen Sie bitte aus, oder lassen Sie sich von\nuns aus dem Wagen ziehen, denn der Wagen wird vernichtet.“","„Ich ziehe es vor, mit vernichtet zu werden.“","„Wie Sie wünschen. Erlauben Sie noch eine Frage! Sie sind Staatsanwalt.\nEs war mir immer unbegreiflich, wie ein Mensch Staatsanwalt sein kann.\nSie leben davon, daß Sie andere Leute, zumeist arme Teufel, anklagen und\nzu Strafen verurteilen. Nicht?“","„Es ist so. Ich tat meine Pflicht. Es war mein Amt. Ebenso wie es das\nAmt des Henkers ist, die von mir Verurteilten zu töten. Sie selbst haben\nja das gleiche Amt übernommen, Sie töten ja auch.“","„Richtig. Nur töten wir nicht aus Pflicht, sondern zum Vergnügen, oder\nvielmehr: aus Mißvergnügen, aus Verzweiflung an der Welt. Darum macht\ndas Töten uns einen gewissen Spaß. Hat Ihnen das Töten nie Spaß\ngemacht?“","„Sie langweilen mich. Haben Sie die Güte, Ihre Arbeit zu Ende zu führen.\nWenn der Begriff der Pflicht Ihnen unbekannt ist ...“","Er schwieg und verzog die Lippen, als wolle er ausspucken. Es kam aber\nnur ein wenig Blut, das an seinem Kinn kleben blieb.","„Warten Sie!“ sagte Gustav höflich. „Den Begriff der Pflicht allerdings\nkenne ich nicht, nicht mehr. Früher hatte ich amtlich viel mit ihm zu\ntun, ich war Professor der Theologie. Außerdem war ich Soldat und habe\nden Krieg mitgemacht. Das, was mir Pflicht schien und was mir von\nAutoritäten und Vorgesetzten jeweils befohlen worden ist, war alles gar\nnicht gut, ich hätte stets lieber das Gegenteil getan. Aber wenn ich\nauch den Begriff der Pflicht nicht mehr kenne, so kenne ich doch den der\nSchuld – vielleicht sind sie beide dasselbe. Indem eine Mutter mich\ngeboren hat, bin ich schuldig, bin ich verurteilt zu leben, bin\nverpflichtet, einem Staat anzugehören, Soldat zu sein, zu töten, Steuern\nfür Rüstungen zu bezahlen. Und jetzt, in diesem Augenblick, hat die\nLebensschuld mich wieder, wie einst im Kriege, dazu geführt, töten zu\nmüssen. Und diesmal töte ich nicht mit Widerwillen, ich habe mich in die\nSchuld ergeben, ich habe nichts dagegen, daß diese dumme, verstopfte\nWelt in Scherben geht, ich helfe gerne mit und gehe selber gerne mit\nzugrunde.“","Der Staatsanwalt strengte sich sehr an, um mit seinen blutverklebten\nLippen ein wenig zu lächeln. Es gelang ihm nicht glänzend, doch war die\ngute Absicht erkennbar.","„Es ist gut“, sagte er. „Wir sind also Kollegen. Tun Sie nun bitte Ihre\nPflicht, Herr Kollege.“","Das hübsche Mädchen hatte sich inzwischen am Straßenrande niedergelassen\nund war ohnmächtig.","In diesem Augenblick tutete wieder ein Wagen und kam in voller Fahrt\ndahergerannt. Wir zogen das Mädchen ein wenig beiseite, drückten uns an\ndie Felsen und ließen den ankommenden Wagen in die Trümmer des andern\nhineinfahren. Er bremste heftig und bäumte sich in die Höhe, blieb aber\nunbeschädigt stehen. Schnell nahmen wir unsre Büchsen zur Hand und\nlegten auf die Neuen an.","„Aussteigen!“ kommandierte Gustav. „Hände hoch!“","Es waren drei Männer, die aus dem Wagen stiegen und gehorsam die Hände\nhochhielten.","„Ist einer von Ihnen Arzt?“ fragte Gustav.","Sie verneinten.","„Dann haben Sie die Güte, den Herrn hier vorsichtig aus seinem Sitz zu\nbefreien, er ist schwer verletzt. Und dann nehmen Sie ihn in Ihrem Wagen\nbis zur nächsten Stadt mit. Vorwärts, angefaßt!“","Bald war der alte Herr im andern Wagen gebettet, Gustav kommandierte,\nund alle fuhren los.","Inzwischen war unsre Stenographin wieder zu sich gekommen und hatte den\nVorgängen zugesehen. Es gefiel mir, daß wir diese hübsche Beute gemacht\nhatten.","„Fräulein,“ sagte Gustav, „Sie haben Ihren Arbeitgeber verloren.\nHoffentlich stand der alte Herr Ihnen sonst nicht nahe. Sie sind von mir\nengagiert, seien Sie uns ein guter Kamerad! So, und nun pressiert es ein\nwenig. In Bälde wird es hier ungemütlich werden. Können Sie klettern,\nFräulein? Ja? Also los, wir nehmen Sie zwischen uns und helfen Ihnen.“","Nun kletterten wir alle drei, so rasch es gehen wollte, in unsre\nBaumhütte hinauf. Dem Fräulein wurde oben schlecht, aber sie bekam einen\nKognak, und bald war sie so weit erholt, daß sie die prachtvolle\nAussicht auf See und Gebirge anerkennen und uns mitteilen konnte, daß\nsie Dora heiße.","Gleich darauf war unten schon wieder ein Wagen angekommen, der in\nvorsichtiger Fahrt an dem gestürzten Auto vorübersteuerte, ohne zu\nhalten, und dann sein Tempo sofort beschleunigte.","„Drückeberger!“ lachte Gustav und schoß den Lenker ab. Der Wagen tanzte\nein wenig, machte einen Satz gegen die Mauer, drückte sie ein und blieb\nschräg überm Abgrund hängen.","„Dora,“ sagte ich, „können Sie mit Flinten umgehen?“","Sie konnte es nicht, aber sie lernte von uns, wie man ein Gewehr lädt.\nZuerst war sie ungeschickt und riß sich einen Finger blutig, heulte und\nverlangte englisches Pflaster. Aber Gustav erklärte ihr, es sei Krieg\nund sie möge zeigen, daß sie ein braves, tapferes Mädel sei. Da ging es.","„Aber was soll aus uns werden?“ fragte sie dann.","„Ich weiß nicht“, sagte Gustav. „Mein Freund Harry hat hübsche Frauen\ngern, er wird Ihr Freund sein.“","„Aber sie werden mit Polizei und Soldaten kommen und uns totmachen.“","„Polizei und dergleichen gibt es nicht mehr. Wir haben die Wahl, Dora.\nEntweder bleiben wir ruhig hier oben und schießen alle Wagen zusammen,\ndie vorbeiwollen. Oder wir nehmen selber einen Wagen, fahren davon und\nlassen andre auf uns schießen. Es ist einerlei, welche Partei wir\nergreifen. Ich bin fürs Hierbleiben.“","Unten war wieder ein Wagen, hell tönte seine Hupe herauf. Er war bald\nerledigt und blieb, die Räder zu oberst, liegen.","„Komisch,“ sagte ich, „daß das Schießen so viel Spaß machen kann! Dabei\nwar ich früher Kriegsgegner!“","Gustav lächelte. „Ja, es sind eben gar zu viele Menschen auf der Welt.\nFrüher merkte man es nicht so. Aber jetzt, wo jeder nicht bloß Luft\natmen, sondern auch ein Auto haben will, jetzt merkt man es eben.\nNatürlich ist das, was wir da tun, nicht vernünftig, es ist eine\nKinderei, wie auch der Krieg eine riesige Kinderei war. Später einmal\nwird die Menschheit lernen müssen, ihre Vermehrung durch vernünftige\nMittel im Zaum zu halten. Vorderhand reagieren wir auf die\nunerträglichen Zustände ziemlich unvernünftig, tun aber im Grunde doch\ndas Richtige: wir reduzieren.“","„Ja,“ sagte ich, „was wir tun, ist wahrscheinlich verrückt, und\nwahrscheinlich ist es dennoch gut und notwendig. Es ist nicht gut, wenn\ndie Menschheit den Verstand überanstrengt und Dinge mit Hilfe der\nVernunft zu ordnen sucht, die der Vernunft noch gar nicht zugänglich\nsind. Dann entstehen solche Ideale wie das des Amerikaners oder das der\nBolschewiken, die beide außerordentlich vernünftig sind und die doch das\nLeben, weil sie es gar so naiv vereinfachen, furchtbar vergewaltigen und\nberauben. Das Bild des Menschen, einst ein hohes Ideal, ist im Begriff,\nzu einem Klischee zu werden. Wir Verrückten werden es vielleicht wieder\nadeln.“","Lachend gab Gustav Antwort: „Junge, du redest wunderbar klug, es ist\neine Freude und bringt Gewinn, diesem Weisheitsborn zu lauschen. Und\nvielleicht hast du sogar ein bißchen recht. Aber sei so gut und lade\njetzt deine Flinte wieder, du bist mir ein wenig zu träumerisch. Jeden\nAugenblick können wieder ein paar Rehböckchen gelaufen kommen, die\nkönnen wir nicht mit Philosophie totschießen, es müssen immerhin Kugeln\nim Rohr sein.“","Ein Auto kam und fiel sogleich, die Straße war gesperrt. Ein\nÜberlebender, ein feister rotköpfiger Mann, gestikulierte wild neben den\nTrümmern, glotzte hinab und hinauf, entdeckte unser Versteck, kam\nbrüllend gelaufen und schoß aus einem Revolver viele Male gegen uns\nherauf.","„Gehen Sie jetzt oder ich schieße“, schrie Gustav hinunter. Der Mann\nzielte auf ihn und schoß nochmals. Da schossen wir ihn ab, mit zwei\nSchüssen.","Noch zwei Wagen kamen, die wir zur Strecke brachten. Dann blieb die\nStraße still und leer, die Nachricht von ihrer Gefährlichkeit schien\nsich verbreitet zu haben. Wir hatten Zeit, die schöne Aussicht zu\nbetrachten. Jenseits des Sees lag eine kleine Stadt in der Tiefe, dort\nstieg Rauch auf, und bald sahen wir, wie das Feuer von Dach zu Dach\nlief. Man hörte auch schießen. Dora weinte ein wenig, ich streichelte\nihr die nassen Wangen.","„Müssen wir denn alle sterben?“ fragte sie. Niemand gab Antwort.\nInzwischen kam unten ein Fußgänger daher, sah die kaputten Automobile\nliegen, schnüffelte an ihnen herum, beugte sich in eines hinein, zog\neinen bunten Sonnenschirm, eine lederne Damentasche, eine Weinflasche\nheraus, setzte sich friedevoll auf die Mauer, trank aus der Flasche, aß\netwas in Stanniol Gewickeltes aus der Tasche, trank die Flasche vollends\nleer, ging vergnügt weiter, den Sonnenschirm unter den Arm geklemmt.\nFriedlich zog er dahin, und ich sagte zu Gustav: „Wäre es dir nun\nmöglich, auf diesen netten Kerl zu schießen und ihm ein Loch in den Kopf\nzu machen? Weiß Gott, ich könnte es nicht.“","„Wird auch nicht verlangt“, brummte mein Freund. Aber es war auch ihm\nunbehaglich ums Herz geworden. Kaum hatten wir einen Menschen zu Gesicht\nbekommen, der noch harmlos, friedlich und kindlich sich benahm, der noch\nim Stand der Unschuld lebte, da schien uns unser ganzes so löbliches und\nnotwendiges Tun auf einmal dumm und widerlich. Pfui Teufel, all das\nBlut! Wir schämten uns. Aber es sollen im Kriege sogar Generäle zuweilen\nso empfunden haben.","„Wir wollen nicht länger hier bleiben,“ klagte Dora, „wir wollen\nhinuntergehen, gewiß finden wir in den Wagen etwas zum Essen. Habt ihr\ndenn keinen Hunger, ihr Bolschewiken?“","Drunten in der brennenden Stadt fingen die Glocken an zu läuten,\naufgeregt und angstvoll. Wir machten uns an den Abstieg. Als ich Dora\nüber die Brüstung klettern half, küßte ich ihre Knie. Sie lachte hell.\nAber da gab das Gestänge nach, und wir stürzten beide ins Leere ...","* * * * *","Wieder befand ich mich im runden Korridor, angeregt von dem\nJagdabenteuer. Und überall, an allen unzähligen Türen, lockten die\nInschriften:","Mutabor\nVerwandlung in beliebige Tiere und Pflanzen","Kamasutram\nUnterricht in der indischen Liebeskunst\nKurs für Anfänger: 42 verschiedene Methoden\nder Liebesübung","Genußreicher Selbstmord!\nDu lachst dich kaputt","Wollen Sie sich vergeistigen?\nWeisheit des Ostens","O daß ich tausend Zungen hätte!\nNur für Herren","Untergang des Abendlandes\nErmäßigte Preise. Noch immer unübertroffen","Inbegriff der Kunst\nDie Verwandlung von Zeit in Raum\ndurch die Musik","Die lachende Träne\nKabinett für Humor","Einsiedlerspiele\nVollwertiger Ersatz für jede Geselligkeit","Endlos lief die Reihe der Inschriften. Eine hieß:","Anleitung zum Aufbau der Persönlichkeit\nErfolg garantiert","Das schien mir beachtenswert, und ich trat in diese Tür.","Es empfing mich ein dämmriger, stiller Raum, darin saß, ohne Stuhl nach\nmorgenländischer Art, ein Mann auf dem Boden, der hatte vor sich etwas\nwie ein großes Schachbrett stehen. Im ersten Augenblick schien es mir\nFreund Pablo zu sein, wenigstens trug der Mann eine ähnliche buntseidene\nJacke und hatte dieselben dunkel strahlenden Augen.","„Sind Sie Pablo?“ fragte ich.","„Ich bin niemand“, erklärte er freundlich. „Wir tragen hier keine Namen,\nwir sind hier keine Personen. Ich bin ein Schachspieler. Wünschen Sie\nUnterricht über den Aufbau der Persönlichkeit?“","„Ja, bitte.“","„Dann stellen Sie mir freundlichst ein paar Dutzend Ihrer Figuren zur\nVerfügung.“","„Meiner Figuren ...?“","„Der Figuren, in welche Sie Ihre sogenannte Persönlichkeit haben\nzerfallen sehen. Ohne Figuren kann ich ja nicht spielen.“","Er hielt mir einen Spiegel vor, wieder sah ich darin die Einheit meiner\nPerson in viele Ichs zerfallen, ihre Zahl schien noch gewachsen zu sein.\nDie Figuren waren aber jetzt sehr klein, so groß etwa wie handliche\nSchachfiguren, und der Spieler nahm mit stillen, sichern Fingergriffen\neinige Dutzend davon und stellte sie neben dem Schachbrett an den Boden.\nEintönig sprach er dazu, wie ein Mann, der eine oft gehaltene Rede oder\nLektion wiederholt:","„Die fehlerhafte und Unglück bringende Auffassung, als sei ein Mensch\neine dauernde Einheit, ist Ihnen bekannt. Es ist Ihnen auch bekannt, daß\nder Mensch aus einer Menge von Seelen, aus sehr vielen Ichs besteht.\nDie scheinbare Einheit der Person in diese vielen Figuren\nauseinanderzuspalten gilt für verrückt, die Wissenschaft hat dafür den\nNamen Schizophrenie erfunden. Die Wissenschaft hat damit insofern recht,\nals natürlich keine Vielheit ohne Führung, ohne eine gewisse Ordnung und\nGruppierung zu bändigen ist. Unrecht dagegen hat sie darin, daß sie\nglaubt, es sei nur eine einmalige, bindende, lebenslängliche Ordnung der\nvielen Unter-Ichs möglich. Dieser Irrtum der Wissenschaft hat manche\nunangenehme Folgen, sein Wert liegt lediglich darin, daß die staatlich\nangestellten Lehrer und Erzieher sich ihre Arbeit vereinfacht und das\nDenken und Experimentieren erspart sehen. Infolge jenes Irrtums gelten\nviele Menschen für ‚normal‘, ja für sozial hochwertig, welche unheilbar\nverrückt sind, und umgekehrt werden manche für verrückt angesehen,\nwelche Genies sind. Wir ergänzen daher die lückenhafte Seelenlehre der\nWissenschaft durch den Begriff, den wir Aufbaukunst nennen. Wir zeigen\ndemjenigen, der das Auseinanderfallen seines Ichs erlebt hat, daß er die\nStücke jederzeit in beliebiger Ordnung neu zusammenstellen und daß er\ndamit eine unendliche Mannigfaltigkeit des Lebensspieles erzielen kann.\nWie der Dichter aus einer Handvoll Figuren ein Drama schafft, so bauen\nwir aus den Figuren unsres zerlegten Ichs immerzu neue Gruppen, mit\nneuen Spielen und Spannungen, mit ewig neuen Situationen. Sehen Sie!“","Mit den stillen, klugen Fingern griff er meine Figuren, alle die Greise,\nJünglinge, Kinder, Frauen, alle die heitern und traurigen, starken und\nzarten, flinken und unbeholfenen Figuren, ordnete sie rasch auf seinem\nBrett zu einem Spiel, in welchem sie alsbald zu Gruppen, Familien, zu\nSpielen und Kämpfen, zu Freundschaften und Gegnerschaften sich\naufbauten, eine Welt im kleinen bildend. Vor meinen entzückten Augen\nließ er die belebte und doch wohlgeordnete kleine Welt eine Weile sich\nbewegen, spielen und kämpfen, Bündnisse schließen und Schlachten\nschlagen, untereinander werben, heiraten, sich vermehren; es war in der\nTat ein vielfiguriges, bewegtes und spannendes Drama.","Dann strich er mit heiterer Gebärde über das Brett, warf alle die\nFiguren sachte um, schob sie auf einen Haufen und baute nachdenklich,\nein wählerischer Künstler, aus denselben Figuren ein ganz neues Spiel\nauf, mit ganz anderen Gruppierungen, Beziehungen und Verflechtungen. Das\nzweite Spiel war dem ersten verwandt: es war dieselbe Welt, dasselbe\nMaterial, aus dem er es aufbaute, aber die Tonart war verändert, das\nTempo gewechselt, die Motive anders betont, die Situationen anders\ngestellt.","Und so baute der kluge Aufbauer aus den Gestalten, deren jede ein Stück\nmeiner selbst war, ein Spiel ums andre auf, alle einander von ferne\nähnlich, alle erkennbar als derselben Welt angehörig, derselben Herkunft\nverpflichtet, dennoch jedes völlig neu.","„Dies ist Lebenskunst“, sprach er dozierend. „Sie selbst mögen künftig\ndas Spiel Ihres Lebens beliebig weiter gestalten und beleben, verwickeln\nund bereichern, es liegt in Ihrer Hand. So wie die Verrücktheit, in\neinem höhern Sinn, der Anfang aller Weisheit ist, so ist Schizophrenie\nder Anfang aller Kunst, aller Phantasie. Sogar Gelehrte haben dies schon\nhalb erkannt, wie man zum Beispiel in des Prinzen Wunderhorn nachlesen\nmag, jenem entzückenden Buch, in welchem die mühevolle und fleißige\nArbeit eines Gelehrten durch die geniale Mitarbeit einer Anzahl von\nverrückten und in Anstalten eingesperrten Künstlern geadelt wird. –\nHier, stecken Sie Ihre Figürchen nur zu sich, das Spiel wird Ihnen noch\noft Freude machen. Sie werden die Figur, die heute sich zum\nunerträglichen Popanz ausgewachsen hat und Ihnen das Spiel verdirbt,\nmorgen zur harmlosen Nebenfigur degradieren. Sie werden das arme liebe\nFigürchen, das eine Weile zu lauter Pech und Unstern verurteilt schien,\nim nächsten Spiel zur Prinzessin machen. Ich wünsche viel Vergnügen,\nmein Herr.“","Ich verbeugte mich tief und dankbar vor diesem begabten Schachspieler,\nsteckte die Figürchen in meine Tasche und zog mich durch die schmale\nTüre zurück.","Eigentlich hatte ich mir gedacht, ich würde nun alsbald im Korridor mich\nan den Boden setzen und stundenlang, eine Ewigkeit lang, mit den Figuren\nspielen, aber kaum stand ich wieder in dem hellen runden Theatergang, so\nzogen neue Strömungen, stärker als ich, mich davon. Ein Plakat flammte\ngrell vor meinen Augen auf:","Wunder der Steppenwolfdressur","Vielerlei Gefühle regte diese Inschrift in mir auf; allerlei Ängste und\nZwänge aus meinem gewesenen Leben, aus der verlassenen Wirklichkeit her,\nzogen mir peinlich das Herz zusammen. Mit bebender Hand öffnete ich die\nTüre und kam in eine Jahrmarktbude, darin sah ich ein Eisengitter\nerrichtet, das mich von der dürftigen Schaubühne trennte. Auf der Bühne\naber sah ich einen Tierbändiger stehen, einen etwas marktschreierisch\naussehenden und wichtigtuenden Herrn, der trotz großem Schnauzbart,\ntrotz muskelstrotzendem Oberarm und geckenhafter Zirkuskleidung mir\nselbst auf eine hämische, recht widerwärtige Weise ähnlich sah. Dieser\nstarke Mann führte – jämmerlicher Anblick! – einen großen, schönen, aber\nfurchtbar abgemagerten und sklavisch-scheu blickenden Wolf an der Leine\nwie einen Hund. Und es war nun ebenso ekelhaft wie spannend, ebenso\nscheußlich wie dennoch heimlich-lustvoll, diesen brutalen Bändiger das\nedle und doch so schmählich gehorsame Raubtier in einer Reihe von Tricks\nund sensationellen Szenen vorführen zu sehen.","Der Mann, mein verfluchter Zerrspiegelzwilling, hatte seinen Wolf\nallerdings fabelhaft gezähmt. Der Wolf gehorchte aufmerksam jedem\nBefehl, reagierte hündisch auf jeden Zuruf und Peitschenknall, er fiel\nin die Knie, stellte sich tot, machte das Männchen, er trug einen\nBrotlaib, ein Ei, ein Stück Fleisch, ein Körbchen folgsam und artig in\nder Schnauze, ja, er mußte dem Bändiger die Peitsche, die dieser hatte\nfallen lassen, aufheben und im Maule nachtragen, wozu er unerträglich\nkriecherisch mit dem Schwanze wedelte. Es wurde dem Wolf ein Kaninchen\nvorgeführt und dann ein weißes Lamm, und er bleckte zwar die Zähne und\nließ den Speichel tropfen vor zitternder Begierde, berührte aber keines\nder Tiere, sondern sprang auf Befehl über sie, die bebend am Boden\nkauerten, in elegantem Schwung hinweg, ja, er legte sich zwischen Hase\nund Lamm nieder, umarmte beide mit den Vorderpfoten und bildete mit\nihnen eine rührende Familiengruppe. Dazu fraß er aus des Menschen Hand\neine Tafel Schokolade. Es war eine Qual mitanzusehen, bis zu welch\nphantastischem Grade dieser Wolf seine Natur hatte verleugnen lernen,\nund mir standen dabei die Haare zu Berg.","Für diese Qual wurde jedoch der erregte Zuschauer im zweiten Teil der\nVorführung, ebenso wie der Wolf selbst, entschädigt. Nach Abwickelung\njenes raffinierten Dressurprogramms nämlich und nachdem der Bändiger\nüber der Lamm- und Wolfgruppe sich triumphierend mit süßem Lächeln\nverbeugt hatte, wurden die Rollen vertauscht. Der harryähnliche\nTierbändiger legte plötzlich seine Peitsche mit tiefem Bückling dem\nWolfe zu Füßen und begann ebenso zu zittern, einzuschrumpfen und elend\nauszusehen wie vorher das Tier. Der Wolf aber leckte sich lachend das\nMaul, Krampf und Verlogenheit fielen von ihm ab, sein Blick leuchtete,\nsein ganzer Leib wurde straff und blühte in wiedererlangter Wildheit\nauf.","Und nun befahl der Wolf, und der Mensch mußte gehorchen. Auf Befehl sank\nder Mensch in die Knie nieder, spielte den Wolf, ließ die Zunge\nheraushängen, riß sich mit den plombierten Zähnen die Kleider vom Leibe.\nEr ging, je nachdem der Menschenbändiger befahl, auf zweien oder auf\nvieren, machte das Männchen, stellte sich tot, ließ den Wolf auf sich\nreiten, trug ihm die Peitsche nach. Hündisch und begabt ging er auf jede\nDemütigung und Perversion phantasievoll ein. Ein schönes Mädchen kam auf\ndie Bühne, näherte sich dem dressierten Mann, streichelte ihm das Kinn,\nrieb ihre Wange an seiner, aber er blieb auf allen vieren, blieb Vieh,\nschüttelte den Kopf und fing an, der Schönen die Zähne zu zeigen,\nzuletzt so drohend und wölfisch, daß sie entfloh. Schokolade wurde ihm\nvorgesetzt, die er verächtlich beschnoberte und wegstieß. Und zuletzt\nwurde das weiße Lamm und das fette gescheckte Kaninchen wieder\nhereingebracht, und der gelehrige Mensch gab sein Letztes her und\nspielte den Wolf, daß es eine Lust war. Mit Fingern und Zähnen packte er\ndie schreienden Tierchen, riß ihnen Fetzen von Fell und Fleisch heraus,\nkaute grinsend ihr lebendiges Fleisch und soff hingegeben, trunken mit\nwollust-geschlossenen Augen, ihr warmes Blut.","Entsetzt floh ich durch die Tür hinaus. Dieses magische Theater, sah\nich, war kein reines Paradies, alle Höllen lagen unter seiner hübschen\nOberfläche. O Gott, gab es denn auch hier keine Erlösung?","Angstvoll lief ich auf und ab, spürte den Geschmack von Blut und den\nGeschmack von Schokolade im Munde, einen ebenso häßlich wie den andern,\nwünschte sehnsüchtig dieser trüben Welle zu entrinnen, rang inbrünstig\nin mir selbst um erträglichere, freundlichere Bilder. „O Freunde, nicht\ndiese Töne!“ sang es in mir, und mit Entsetzen erinnerte ich mich an\njene scheußlichen Photographien von der Front, die man während des\nKrieges zuweilen zu Gesicht bekommen hatte, an jene Haufen ineinander\nverknäuelter Leichname, deren Gesichter durch Gasmasken in grinsende\nTeufelsfratzen verwandelt waren. Wie war ich damals noch dumm und\nkindlich gewesen, als ich mich, ein menschenfreundlich gesinnter\nKriegsgegner, über diese Bilder entsetzt hatte! Heut wußte ich, daß kein\nTierbändiger, kein Minister, kein General, kein Irrsinniger Gedanken und\nBilder in seinem Gehirn auszubrüten fähig war, die nicht ebenso\nscheußlich, ebenso wild und böse, ebenso roh und dumm in mir selber\nwohnten.","Aufatmend erinnerte ich mich jener Inschrift, der ich vorher, beim\nBeginn des Theaters, jenen hübschen Jüngling so stürmisch hatte folgen\nsehen, der Inschrift:","Alle Mädchen sind dein","und es schien mir, alles in allem, doch eigentlich nichts anderes so\nbegehrenswert wie dieses. Froh darüber, der verfluchten Wolfswelt wieder\nentrinnen zu können, ging ich hinein.","Wunderlich – so sagenhaft und zugleich so tief vertraut, daß ich\naufschauerte – kam mir hier der Duft meiner Jugend entgegengeweht, die\nAtmosphäre meiner Knaben- und Jünglingszeit, und in meinem Herzen floß\ndas Blut von damals. Was ich eben noch getan und gedacht hatte und\ngewesen war, sank hinter mir hinab, und ich war wieder jung. Noch vor\neiner Stunde, noch vor Augenblicken hatte ich recht wohl zu wissen\ngeglaubt, was Liebe, was Begehren, was Sehnsucht sei, aber das war die\nLiebe und Sehnsucht eines alten Mannes gewesen. Jetzt war ich wieder\njung, und was ich in mir fühlte, dieses glühend fließende Feuer, diese\ngewaltig ziehende Sehnsucht, diese wie Tauwind im März auflösende\nLeidenschaft, war jung, neu und echt. Oh, wie brannten die vergessenen\nFeuer wieder auf, wie schwellend und dunkel klangen die Töne des\nEhemals, wie blühte es flackernd im Blut, wie schrie es und sang in der\nSeele! Ich war ein Knabe, fünfzehn oder sechzehn Jahre alt, mein Kopf\nwar voll von Latein und Griechisch und schönen Dichterversen, meine\nGedanken voll von Streben und Ehrgeiz, meine Phantasien voll von\nKünstlertraum, aber viel tiefer, stärker und furchtbarer als all diese\nlodernden Feuer brannte und zuckte in mir das Feuer der Liebe, der\nHunger des Geschlechts, die zehrende Vorahnung der Wollust.","Ich stand auf einem der Felshügel über meiner kleinen Heimatstadt, es\nroch nach Tauwind und ersten Veilchen, aus dem Städtchen blitzte der\nFluß herauf und die Fenster meines Vaterhauses, und das alles blickte,\nklang und roch so rauschend voll, so neu und schöpfungstrunken, strahlte\nso farbentief und wehte im Frühlingswinde so überwirklich und verklärt,\nwie ich einst in den vollsten, dichterischen Stunden meiner ersten\nJugend die Welt gesehen hatte. Ich stand auf dem Hügel, der Wind strich\nmir durchs lange Haar; mit irrender Hand, in träumerische\nLiebessehnsucht verloren, riß ich vom eben ergrünenden Gebüsch eine\njunge halboffne Blattknospe, hielt sie vors Auge, roch an ihr (und schon\nbei diesem Geruch fiel alles von damals mir wieder glühend ein), dann\nfaßte ich das kleine grüne Ding spielend mit den Lippen, die noch immer\nkein Mädchen geküßt hatten, und begann es zu kauen. Und bei diesem\nherben, aromatisch bitteren Geschmack wußte ich plötzlich genau, was ich\nerlebe, alles war wieder da. Ich erlebte eine Stunde aus meinem letzten\nKnabenjahre wieder, einen Sonntagnachmittag im ersten Frühling, jenen\nTag, an dem ich auf meinem einsamen Spaziergang die Rosa Kreisler\nangetroffen, und sie so schüchtern gegrüßt, und mich so betäubend in sie\nverliebt hatte.","Damals hatte ich dem schönen Mädchen, das allein und träumerisch\nbergaufwärts gegangen kam und mich noch nicht sah, voll banger Erwartung\nentgegengesehen, hatte ihr Haar gesehen, das in dicken Zöpfen\naufgebunden war und doch noch zu beiden Seiten der Wangen offne Strähnen\nhatte, die im Winde spielten und flossen. Ich hatte gesehen, zum\nerstenmal in meinem Leben, wie schön dies Mädchen war, wie schön und\ntraumhaft dies Spiel des Windes in ihrem zarten Haar, wie schön und\nsehnsuchtweckend der Fall ihres dünnen blauen Kleides über die jungen\nGlieder hinab, und ebenso, wie mich mit dem bitter-würzigen Geschmack\nder zerkauten Knospe die ganze bange süße Lust und Angst des Frühlings\ndurchtränkte, so erfüllte mich beim Anblick des Mädchens die ganze\ntödliche Ahnung der Liebe, die Ahnung vom Weibe, das erschütternde\nVorgefühl ungeheurer Möglichkeiten und Versprechungen, namenloser\nWonnen, unausdenklicher Verwirrungen, Ängste und Leiden,\ninnigster Erlösung und tiefster Schuld. O wie brannte der bittre\nFrühlingsgeschmack auf meiner Zunge! O wie strömte der spielende Wind\ndurch das lose Haar neben ihren roten Wangen! Dann war sie mir nahe\ngekommen, hatte aufgeblickt und mich erkannt, war einen Augenblick\nschwach errötet und hatte beiseite geblickt; dann grüßte ich sie, mit\ngezogenem Konfirmandenhut, und Rosa, alsbald gefaßt, grüßte lächelnd und\nein wenig damenhaft zurück, erhobenen Gesichts, und ging langsam, sicher\nund überlegen weiter, umsponnen von tausend Liebeswünschen, Forderungen\nund Huldigungen, die ich ihr nachsandte.","So war es einst gewesen, an einem Sonntag vor fünfunddreißig Jahren, und\nalles Damalige war in diesem Augenblick wiedergekehrt: Hügel und Stadt,\nMärzwind
