ns\nfourni, que les Russes arrivent sur des bateaux plats; il ne réchappa\npas un janissaire. Les Russes ne firent aucune attention à l'état où\nnous étions. Il y a partout des chirurgiens français: un d'eux, qui\nétait fort adroit, prit soin de nous, il nous guérit, et je me\nsouviendrai toute ma vie que, quand mes plaies furent bien fermées,\nil me fit des propositions. Au reste, il nous dit à toutes de nous\nconsoler; il nous assura que dans plusieurs sièges pareille chose était\narrivée, et que c'était la loi de la guerre.","Dès que mes compagnes purent marcher, on les fit aller à Moscou;\nj'échus en partage à un boyard qui me fit sa jardinière, et qui me\ndonnait vingt coups de fouet par jour; mais ce seigneur ayant été roué\nau bout de deux ans avec une trentaine de boyards, pour quelque\ntracasserie de cour, je profitai de cette aventure: je m'enfuis. Je\ntraversai toute la Russie; je fus longtemps servante de cabaret à Riga,\npuis à Rostock, à Vismar, à Leipzig, à Cassel, à Utrecht, à Leyde, à la\nHaye, à Rotterdam; j'ai vieilli dans la misère et dans l'opprobre,\nn'ayant que la moitié d'un derrière, me souvenant toujours que j'étais\nfille d'un pape; je voulus cent fois me tuer, mais j'aimais encore la\nvie. Cette faiblesse ridicule est peut-être un de nos penchants les plus\nfunestes; car y a-t-il rien de plus sot que de vouloir porter\ncontinuellement un fardeau qu'on veut toujours jeter par terre?\nd'avoir son être en horreur, et de tenir à son être? enfin de caresser\nle serpent qui nous dévore, jusqu'à ce qu'il nous ait mangé le cœur?","J'ai vu dans les pays que le sort m'a fait parcourir, et dans les\ncabarets où j'ai servi, un nombre prodigieux de personnes qui avaient\nleur existence en exécration: mais je n'en ai vu que huit qui aient\nmis volontairement fin à leur misère, trois nègres, quatre Anglais,\net un professeur allemand nomme Robek. J'ai fini par être servante chez\nle juif don Issachar; il me mit auprès de vous, ma belle demoiselle. Je\nme suis attachée à votre destinée, et j'ai été plus occupée de vos\naventures que des miennes. Je ne vous aurais même jamais parlé de mes\nmalheurs, si vous ne m'aviez pas un peu piquée, et s'il n était d'usage,\ndans un vaisseau, de conter des histoires pour se désennuyer. Enfin,\nmademoiselle, j'ai de l'expérience, je connais le monde; donnez-vous un\nplaisir, engagez chaque passager à vous conter son histoire, et s'il\ns'en trouve un seul qui n'ait souvent maudit sa vie, qui ne se soit\nsouvent dit à lui-même qu'il était le plus malheureux des hommes,\njetez-moi dans la mer la tête la première.»","[Illustration 30]","[Illustration 31]"]},{"name":"Chapitre 13","paragraphs":["COMMENT CANDIDE FUT OBLIGÉ DE SE SÉPARER DE LA BELLE CUNÉGONDE\nET DE LA VIEILLE.","La belle Cunégonde, ayant entendu l'histoire de la vieille, lui fit\ntoutes les politesses qu'on devait à une personne de son rang et de\nson mérite. Elle accepta la proposition; elle engagea tous les\npassagers, l'un après l'autre, à lui conter leurs aventures. Candide et\nelle avouèrent que la vieille avait raison. «--C'est bien dommage,\ndisait Candide, que le sage Pangloss ait été pendu contre la coutume\ndans un auto-da-fé; il nous dirait des choses admirables sur le mal\nphysique et sur le mal moral qui couvrent la terre et la mer, et je me\nsentirais assez de force pour oser lui faire respectueusement quelques\nobjections.»","À mesure que chacun racontait son histoire, le vaisseau avançait. On\naborda dans Buenos-Ayres. Cunégonde, le capitaine Candide et la vieille\nallèrent chez le gouverneur don Fernando d'Ibaraa, y Figueora, y\nMascarenes, y Lampourdos, y Souza. Ce seigneur avait une fierté\nconvenable à un homme qui portait tant de noms. Il parlait aux hommes\navec le dédain le plus noble, portant le nez si haut, élevant si\nimpitoyablement la voix, prenant un ton si imposant, affectant une\ndémarche si altière, que tous ceux qui le saluaient étaient tentés de le\nbattre. Il aimait les femmes à la fureur. Cunégonde lui parut ce qu'il\navait jamais vu de plus beau. La première chose qu'il fit fut de\ndemander si elle n'était point la femme du capitaine. L'air dont il fit\ncette question alarma Candide; il n'osa pas dire qu'elle était sa\nfemme, parce qu'en effet elle ne l'était point; il n'osait pas dire que\nc'était sa sœur, parce qu'elle ne l'était pas non plus; et quoique ce\nmensonge officieux pût lui être utile, son âme était trop pure pour\ntrahir la vérité. «--Mlle Cunégonde, dit-il, doit me faire\nl'honneur de m'épouser, et nous supplions votre excellence de daigner\nfaire notre noce.»","[Illustration 32: DÉCLARATION DU GOUVERNEUR DE BUENOS-AYRES À CUNÉGONDE]","Don Fernando d'Ibaraa, y Figueora, y Mascarenes, y Lampourdos, y\nSouza, relevant sa moustache, sourit amèrement et ordonna au capitaine\nCandide d'aller faire la revue de sa compagnie. Candide obéit; le\ngouverneur demeura avec Mlle Cunégonde. Il lui déclara sa passion,\nlui protesta que le lendemain il l'épouserait à la face de l'Église, ou\nautrement, ainsi qu'il plairait à ses charmes. Cunégonde lui demanda un\nquart d'heure pour se recueillir, pour consulter la vieille et pour se\ndéterminer.","La vieille dit à Cunégonde: «--Mademoiselle, vous avez soixante\net douze quartiers et pas une obole; il ne tient qu'à vous d'être la\nfemme du plus grand seigneur de l'Amérique occidentale, qui a une très\nbelle moustache: est-ce à vous de vous piquer d'une fidélité à toute\népreuve? Vous avez été violée par les Bulgares; un juif et un\ninquisiteur ont eu vos bonnes grâces; les malheurs donnent des droits.\nJ'avoue que si j'étais à votre place, je ne ferais aucun scrupule\nd'épouser M. le gouverneur et de faire la fortune de M. le capitaine\nCandide.» Tandis que la vieille parlait avec toute la prudence que\nl'âge et l'expérience donnent, on vit entrer dans le port un petit\nvaisseau: il portait un alcade et des alguazils, et voici ce qui était\narrivé.","La vieille avait très bien deviné que ce fut un cordelier à la grande\nmanche qui vola l'argent et les bijoux de Cunégonde dans la ville de\nBadajoz, lorsqu'elle fuyait en hâte avec Candide. Ce moine voulut\nvendre quelques-unes des pierreries à un joaillier. Le marchand les\nreconnut pour celles du grand inquisiteur. Le cordelier, avant d'être\npendu, avoua qu'il les avait volées; il indiqua les personnes et la\nroute qu'elles prenaient. La fuite de Cunégonde et de Candide était\ndéjà connue. On les suivit à Cadix; on envoya, sans perdre de temps,\nun vaisseau à leur poursuite. Le vaisseau était déjà dans le port de\nBuenos-Ayres. Le bruit se répandit qu'un alcade allait débarquer, et\nqu'on poursuivait les meurtriers de Monseigneur le grand inquisiteur.\nLa prudente vieille vit dans l'instant tout ce qui était à faire.\n«--Vous ne pouvez fuir, dit-elle à Cunégonde, et vous n'avez rien\nà craindre; ce n'est pas vous qui avez tué Monseigneur; et d'ailleurs\nle gouverneur, qui vous aime, ne souffrira pas qu'on vous maltraite;\ndemeurez.» Elle court sur-le-champ à Candide: «--Fuyez,\ndit-elle, ou dans une heure vous allez être brûlé.» Il n'y avait pas un\nmoment à perdre. Mais comment se séparer de Cunégonde, et où se\nréfugier?","[Illustration 33]","[Illustration 34]"]},{"name":"Chapitre 14","paragraphs":["COMMENT CANDIDE ET CACAMBO FURENT REÇUS CHEZ LES JÉSUITES\nDU PARAGUAY.","Candide avait amené de Cadix un valet tel qu'on en trouve beaucoup\nsur les côtes d'Espagne et dans les colonies. C'était un quart\nd'Espagnol, né d'un métis dans le Tucuman; il avait été enfant de chœur,\nsacristain, matelot, moine, facteur, soldat, laquais. Il s'appelait\nCacambo, et aimait fort son maître, parce que son maître était un fort\nbon homme. Il sella au plus vite les deux chevaux andalous.\n«--Allons, mon maître, suivons le conseil de la vieille: partons,\net courons sans regarder derrière nous. Candide versa des\nlarmes:--Ô ma chère Cunégonde! faut-il vous abandonner dans le\ntemps que M. le gouverneur va faire nos noces? Cunégonde, amenée de\nsi loin, que deviendrez-vous?--Elle deviendra ce qu'elle pourra,\ndit Cacambo: les femmes ne sont jamais embarrassées d'elles: Dieu y\npourvoit; courons.--Où me mènes-tu? où allons-nous? que\nferons-nous sans Cunégonde? disait Candide.--Par saint Jacques de\nCompostelle, dit Cacambo, vous alliez faire la guerre aux jésuites;\nallons la faire pour eux; je sais assez les chemins; je vous mènerai\ndans leur royaume; ils seront charmés d'avoir un capitaine qui fasse\nl'exercice à la bulgare; vous ferez une fortune prodigieuse; quand on\nn'a pas son compte dans un monde, on le trouve dans un autre. C'est un\ntrès grand plaisir de voir et de faire des choses nouvelles.","--Tu as donc été déjà dans le Paraguay? dit Candide.--Eh!\nvraiment oui! dit Cacambo; j'ai été cuistre dans le collège de\nl'Assomption, et je connais le gouvernement de los padres comme je\nconnais les rues de Cadix. C'est une chose admirable que ce gouvernement.\nLe royaume a déjà plus de trois cents lieues de diamètre; il est divisé\nen trente provinces. Los padres y ont tout, et les peuples rien; c'est\nle chef-d'œuvre de la raison et de la justice.","Pour moi, je ne vois rien de si divin que los padres, qui font ici\nla guerre au roi d'Espagne et au roi de Portugal, et qui en Europe\nconfessent ces rois; qui tuent ici des Espagnols, et qui à Madrid les\nenvoient au ciel: cela me ravit; avançons: vous allez être le plus\nheureux de tous les hommes. Quel plaisir auront los padres, quand ils\nsauront qu'il leur vient un capitaine qui sait l'exercice bulgare!»","Dès qu'ils furent arrivés à la première barrière, Cacambo dit à la\ngarde avancée qu'un capitaine demandait à parler à Monseigneur le\ncommandant. On alla avertir la grand'garde. Un officier paraguayen\ncourut aux pieds du commandant lui donner part de la nouvelle.","Candide et Cacambo furent d'abord désarmés; on se saisit de leurs\ndeux chevaux andalous. Les deux étrangers sont introduits au milieu\nde deux files de soldats; le commandant était au bout, le bonnet à\ntrois cornes en tête, la robe retroussée, l'épée au côté, l'esponton\nà la main. Il fit un signe; aussitôt vingt-quatre soldats entourent les\ndeux nouveaux venus. Un sergent leur dit qu'il faut attendre; que le\ncommandant ne peut leur parler; que le révérend père provincial ne\npermet pas qu'aucun Espagnol ouvre la bouche qu'en sa présence, et\ndemeure plus de trois heures dans le pays.","«--Et où est le révérend père provincial? dit Cacambo.--Il\nest à la parade, après avoir dit sa messe, répondit le sergent, et vous\nne pourrez baiser ses éperons que dans trois heures.--Mais, dit\nCacambo, monsieur le capitaine, qui meurt de faim comme moi, n'est point\nEspagnol, il est Allemand; ne pourrions-nous point déjeuner en\nattendant Sa Révérence?»","Le sergent alla sur-le-champ rendre compte de ce discours au\ncommandant. «--Dieu soit béni! dit ce seigneur; puisqu'il est\nAllemand, je peux lui parler; qu'on le mène dans ma feuillée.» Aussitôt\non conduit Candide dans un cabinet de verdure orné d'une très jolie\ncolonnade de marbre vert et or, et de treillages qui renfermaient des\nperroquets, des colibris, des oiseaux-mouches, des pintades, et tous\nles oiseaux les plus rares.","Un excellent déjeuner était préparé dans des vases d'or; et tandis\nque les Paraguayens mangèrent du maïs dans des écuelles de bois, en\nplein champ, à l'ardeur du soleil, le révérend père commandant entra\ndans la feuillée.","C'était un très beau jeune homme, le visage plein, assez blanc, haut\nen couleur, le sourcil relevé, l'œil vif, l'oreille rouge, les lèvres\nvermeilles, l'air fier, mais d'une fierté qui n'était ni celle d'un\nEspagnol, ni celle d'un jésuite.","On rendit à Candide et à Cacambo leurs armes, qu'on leur avait\nsaisies, ainsi que les deux chevaux andalous; Cacambo leur fit manger\nl'avoine auprès de la feuillée, ayant toujours l'œil sur eux, crainte de\nsurprise.","Candide baisa d'abord le bas de la robe du commandant; ensuite ils\nse mirent à table.","«--Vous êtes donc Allemand? lui dit le jésuite en cette\nlangue.--Oui, mon révérend père, dit Candide.» L'un et l'autre,\nen prononçant ces paroles, se regardaient avec une extrême surprise\net une émotion dont ils n'étaient pas les maîtres. «--Et de quel\npays d'Allemagne êtes-vous? dit le jésuite.--De la sale province\nde Westphalie, dit Candide: je suis né dans le château de\nThunder-ten-tronckh.--Ô ciel! est-il possible! s'écria le\ncommandant.--Quel miracle! s'écria Candide.--Serait-ce vous?\ndit le commandant.--Cela n'est pas possible, dit Candide.» Ils\nse laissent tomber tous deux à la renverse, ils s'embrassent, ils\nversent des ruisseaux de larmes. «--Quoi! serait-ce vous, mon\nrévérend père? vous, le frère de la belle Cunégonde! vous qui fûtes\ntué par les Bulgares! vous le fils de monsieur le baron! vous jésuite\nau Paraguay! Il faut avouer que ce monde est une étrange chose.\nÔ Pangloss! Pangloss! que vous seriez aise si vous n'aviez pas été\npendu!»","Le commandant fit retirer les esclaves nègres et les Paraguayens\nqui servaient à boire dans des gobelets de cristal de roche. Il remercia\nDieu et saint Ignace mille fois; il serrait Candide entre ses bras;\nleurs visages étaient baignés de pleurs.","«--Vous seriez bien plus étonné, plus attendri, plus hors de\nvous-même, dit Candide, si je vous disais que Mlle Cunégonde, votre sœur,\nque vous avez crue éventrée, est pleine de santé.--Où?--Dans\nvotre voisinage, chez M. le gouverneur de Buenos-Ayres, et je venais\npour vous faire la guerre.»","Chaque mot qu'ils prononcèrent dans cette longue conversation\naccumulait prodige sur prodige. Leur âme tout entière volait sur leur\nlangue, était attentive dans leurs oreilles, et étincelante dans leurs\nyeux. Comme ils étaient Allemands, ils tinrent table longtemps, en\nattendant le révérend père provincial; et le commandant parla ainsi à\nson cher Candide.","[Illustration 35]","[Illustration 36]"]},{"name":"Chapitre 15","paragraphs":["COMMENT CANDIDE TUA LE FRÈRE DE SA CHÈRE CUNÉGONDE.","«J'aurai toute ma vie présent à la mémoire le jour horrible où je vis\ntuer mou père et ma mère, et violer ma sœur. Quand les Bulgares furent\nretirés, on ne trouva point cette sœur adorable, et on mit dans une\ncharrette ma mère, mon père et moi, deux servantes et trois petits\ngarçons égorgés, pour nous aller enterrer dans une chapelle de jésuites,\nà deux lieues du château de mes pères. Un jésuite nous jeta de l'eau\nbénite; elle était horriblement salée. Il en entra quelques gouttes\ndans mes yeux: le père s'aperçut que ma paupière faisait un petit\nmouvement; il mit la main sur mon cœur et le sentit palpiter; je fus\nsecouru, et au bout de trois semaines il n'y paraissait pas. Vous savez,\nmon cher Candide, que j'étais fort joli; je le devins encore davantage;\naussi le révérend père Didrie, supérieur de la maison, prit pour moi la\nplus tendre amitié: il me donna l'habit de novice; quelque temps\naprès, je fus envoyé à Rome. Ce père général avait besoin d'une recrue\nde jeunes jésuites allemands. Les souverains du Paraguay reçoivent le\nmoins qu'ils peuvent de jésuites espagnols; ils aiment mieux les\nétrangers, dont ils se croient plus maîtres. Je fus jugé propre par le\nrévérend père général pour aller travailler dans cette vigne. Nous\npartîmes, un Polonais, un Tyrolien et moi. Je fus honoré, en arrivant,\ndu sous-diaconat et d'une lieutenance: je suis aujourd'hui colonel et\nprêtre. Nous recevrons vigoureusement les troupes du roi d'Espagne;\nje vous réponds qu'elles seront excommuniées et battues. La Providence\nvous envoie ici pour nous seconder. Mais est-il bien vrai que ma chère\nsœur Cunégonde soit dans le voisinage, chez le gouverneur de\nBuenos-Ayres?» Candide l'assura par serment que rien n'était plus vrai.\nLeurs larmes recommencèrent à couler.","Le baron ne pouvait se lasser d'embrasser Candide: il l'appelait son\nfrère, son sauveur. «--Ah! peut-être, lui dit-il, nous pourrons\nensemble, mon cher Candide, entrer en vainqueurs dans la ville et\nreprendre ma sœur Cunégonde.--C'est tout ce que je souhaite, dit\nCandide; car je comptais l'épouser, et je l'espère encore.--Vous,\ninsolent! répondit le baron, vous auriez l'impudence d'épouser ma sœur\nqui a soixante et douze quartiers! Je vous trouve bien effronté d'oser\nme parler d'un dessein si téméraire! «Candide, pétrifié d'un tel\ndiscours, lui répondit: «--Mon révérend père, tous les quartiers\ndu monde n'y font rien; j'ai tiré votre sœur des bras d'un juif et d'un\ninquisiteur; elle m'a assez d'obligations, elle veut m'épouser. Maître\nPangloss m'a toujours dit que les hommes sont égaux, et assurément je\nl'épouserai.--C'est ce que nous verrons, coquin,» dit le jésuite\nbaron de Thunder-ten-tronckh, et en même temps il lui donna un grand\ncoup du plat de sou épée sur le visage. Candide dans l'instant tire la\nsienne, et l'enfonce jusqu'à la garde dans le ventre du baron jésuite:\nmais en la retirant toute fumante, il se mit à pleurer: «--Hélas!\nmon Dieu! dit-il, j'ai tué mon ancien maître, mon ami, mon beau-frère;\nje suis le meilleur homme du monde, et voilà déjà trois hommes que je\ntue; et dans ces trois il y a deux prêtres.»","Cacambo, qui faisait sentinelle à la porte de la fouillée, accourut.\n«--Il ne nous reste qu'à vendre cher notre vie, lui dit son\nmaître; on va, sans doute, entrer dans la fouillée: il faut mourir les\narmes à la main.» Cacambo, qui en avait bien vu d'autres, ne perdit\npoint la tête; il prit la robe de jésuite que portait le baron, la mil\nsur le corps de Candide, lui donna le bonnet carré du mortel le fit\nmonter à cheval. Tout cela se fit en un clin d'œil. «--Galopons,\nmon maître; tout le monde vous prendra pour un jésuite qui va donner\ndes ordres; et nous aurons passé les frontières avant qu'on puisse\ncourir après nous.» Il volait déjà en prononçant ces paroles et en\ncriant en espagnol: «Place, place pour le révérend père colonel!»","[Illustration 37]","[Illustration 38]"]},{"name":"Chapitre 16","paragraphs":["CE QUI ADVINT AUX DEUX VOYAGEURS AVEC DEUX FILLES, DEUX SINGES,\nET LES SAUVAGES NOMMÉS OREILLONS.","Candide et son valet furent au delà des barrières, et personne ne\nsavait encore dans le camp la mort du jésuite allemand. Le vigilant\nCacambo avait eu soin de remplir sa valise de pain, de chocolat, de\njambon, de fruits, et de quelques mesures de vin. Ils s'enfoncèrent\navec leurs chevaux andalous dans un pays inconnu où ils ne découvrirent\naucune route. Enfin une belle prairie entrecoupée de ruisseaux se\nprésenta devant eux. Nos deux voyageurs font repaître leurs montures.\nCacambo propose à son maître de manger, et lui en donne l'exemple.\n«--Comment veux-tu, disait Candide, que je mange du jambon,\nquand j'ai tué le fils de monsieur le baron, et que je me vois condamné\nà ne revoir la belle Cunégonde de ma vie? À quoi me servira de prolonger\nmes misérables jours, puisque je dois les traîner loin d'elle dans les\nremords et dans le désespoir? et que dira le _Journal de Trévoux?_»","En parlant ainsi, il ne laissait pas de manger. Le soleil se couchait.\nLes deux égarés entendirent quelques petits cris qui paraissaient\npoussés par des femmes. Ils ne savaient si ces cris étaient de douleur\nou de joie; mais ils se levèrent précipitamment avec cette inquiétude\net cette alarme que tout inspire dans un pays inconnu. Ces clameurs\npartaient de deux filles toutes nues qui couraient légèrement au bord\nde la prairie, tandis que deux singes les suivaient en leur mordant les\nfesses. Candide fut touché de pitié; il avait appris à tirer chez les\nBulgares, et il aurait abattu une noisette dans un buisson, sans toucher\naux feuilles. Il prend son fusil espagnol à deux coups, tire et tue les\ndeux singes. «--Dieu soit loué, mon cher Cacambo! j'ai délivré\nd'un grand péril ces deux pauvres créatures: si j'ai commis un péché en\ntuant un inquisiteur et un jésuite, je l'ai bien réparé en sauvant la\nvie à deux filles. Ce sont peut-être deux demoiselles de condition, et\ncette aventure nous peut procurer de très grands avantages dans le\npays.»","Il allait continuer; mais sa langue devint percluse quand il vit ces\ndeux filles embrasser tendrement les deux singes, fondre en larmes\nsur leurs corps, et remplir l'air des cris les plus douloureux.\n«--Je ne m'attendais pas à tant de bonté d'âme, dit-il enfin à\nCacambo, lequel lui répliqua:--Vous avez fait là un beau\nchef-d'œuvre, mon maître; vous avez tué les deux amants de ces\ndemoiselles.--Leurs amants! serait-il possible? Vous vous moquez\nde moi, Cacambo; le moyen de vous croire?--Mon cher maître,\nrepartit Cacambo, vous êtes toujours étonné de tout; pourquoi\ntrouvez-vous si étrange que dans quelques pays il y ait des singes qui\nobtiennent les bonnes grâces des dames? Ils sont des quarts d'hommes,\ncomme je suis un quart d'Espagnol.--Hélas! reprit Candide, je me\nsouviens d'avoir entendu dire à maître Pangloss qu'autrefois pareils\naccidents étaient arrivés, et que ces mélanges avaient produit des\négyptiens, des faunes, des satyres, que plusieurs grands personnages\nde l'antiquité en avaient vu; mais je prenais cela pour des\nfables.--Vous devez être convaincu à présent, dit Cacambo, que\nc'est une vérité, et vous voyez comment en usent les personnes qui\nn'ont pas reçu une certaine éducation; tout ce que je crains, c'est que\nces dames ne nous fassent quelque méchante affaire.»","Ces réflexions solides engagèrent Candide à quitter la prairie et\nà s'enfoncer dans un bois. Il y soupa avec Cacambo; et tous deux,\naprès avoir maudit l'inquisiteur de Portugal, le gouverneur de\nBuenos-Ayres et le baron, s'endormirent sur de la mousse. À leur\nréveil, ils sentirent qu'ils ne pouvaient remuer; la raison en était\nque pendant la nuit les Oreillons, habitants du pays, à qui les deux\ndames les avaient dénoncés, les avaient garrottés avec des cordes\nd'écorce d'arbre. Ils étaient entourés d'une cinquantaine d'Oreillons\ntout nus, armés de flèches, de massues et de haches de caillou: les uns\nfaisaient bouillir une grande chaudière: les autres préparaient des\nbroches, et tous criaient: «--C'est un jésuite, c'est un jésuite;\nnous serons vengés, et nous ferons bonne chère; mangeons du jésuite,\nmangeons du jésuite!»","«--Je vous l'avais bien dit, mon cher maître, s'écria tristement\nCacambo, que ces deux filles nous joueraient un mauvais tour.» Candide,\napercevant la chaudière et les broches, s'écria: «--Nous allons\ncertainement être rôtis ou bouillis. Ah! que dirait maître Pangloss,\ns'il voyait comme la pure nature est faite? Tout est bien: soit, mais\nj'avoue qu'il est bien cruel d'avoir perdu Mlle Cunégonde et d'être\nmis à la broche par des Oreillons.» Cacambo ne perdait jamais la tête.\n«--Ne désespérez de rien, dit-il au désolé Candide; j'entends un\npeu le jargon de ces peuples. Je vais leur parler.--Ne manquez\npas, dit Candide, de leur représenter quelle est l'inhumanité affreuse\nde faire cuire des hommes, et combien cela est peu chrétien.»","«--Messieurs, dit Cacambo, vous comptez donc manger\naujourd'hui un jésuite? c'est très bien fait; rien n'est plus juste que\nde traiter ainsi ses ennemis. En effet, le droit naturel nous enseigne\nà tuer notre prochain, et c'est ainsi qu'on en agit dans toute la terre.\nSi nous n'usons pas du droit de le manger, c'est que nous avons\nd'ailleurs de quoi faire bonne chère; mais vous n'avez pas les mêmes\nressources que nous: certainement il vaut mieux manger ses ennemis\nque d'abandonner aux corbeaux et aux corneilles le fruit de sa victoire.\nMais, messieurs, vous ne voudriez pas manger vos amis. Vous croyez\naller mettre un jésuite en broche, et c'est votre défenseur, c'est\nl'ennemi de vos ennemis que vous allez rôtir. Pour moi, je suis né de\nvotre pays; monsieur, que vous voyez, est mon maître, et, bien loin\nd'être jésuite, il vient de tuer un jésuite, il en porte les dépouilles;\nvoilà le sujet de votre méprise. Pour vérifier ce que je vous dis,\nprenez sa robe, portez-la à la première barrière du royaume de los\npadres; informez-vous si mon maître n'a pas tué un officier jésuite. Il\nvous faudra peu de temps; vous pourrez toujours nous manger, si vous\ntrouvez que je vous ai menti. Mais si je vous ai dit la vérité, vous\nconnaissez trop les principes du droit public, les mœurs et les lois,\npour ne pas nous faire grâce.»","[Illustration 39: AU PAYS DES OREILLONS]","Les Oreillons trouvèrent ce discours très raisonnable; ils députèrent\ndeux notables pour aller en diligence s'informer de la vérité; les deux\ndéputés s'acquittèrent de leur commission en gens d'esprit, et revinrent\nbientôt apporter de bonnes nouvelles. Les Oreillons délièrent leurs deux\nprisonniers, leur firent toutes sortes de civilités, leur offrirent des\nfilles, leur donnèrent des rafraîchissements, et les reconduisirent\njusqu'aux confins de leurs États, en criant avec allégresse: «--Il\nn'est point jésuite, il n'est point jésuite!»","Candide ne se lassait point d'admirer le sujet de sa délivrance.\n«--Quel peuple! disait-il, quels hommes! quelles mœurs! Si je\nn'avais pas eu le bonheur de donner un grand coup d'épée au travers\ndu corps du frère de Mlle Cunégonde, j'étais mangé sans rémission.\nMais, après tout, la pure nature est bonne, puisque ces gens-ci, au\nlieu de me manger, m'ont fait mille honnêtetés dès qu'ils ont su que\nje n'étais pas jésuite.»","[Illustration 40]","[Illustration 41]"]},{"name":"Chapitre 17","paragraphs":["ARRIVÉE DE CANDIDE ET DE SON VALET AU PAYS D’ELDORADO,\nET CE QU’ILS Y VIRENT.","Quand ils furent aux frontières des Oreillons: «--Vous voyez,\ndit Cacambo à Candide, que cet hémisphère-ci ne vaut pas mieux que\nl'autre; croyez-moi, retournons en Europe par le plus court.--Comment\ny retourner? dit Candide; et où aller? Si je vais dans mon pays, les\nBulgares et les Abares y égorgent tout; si je retourne en Portugal, j'y\nsuis brûlé; si nous restons dans ce pays-ci, nous risquons à tout\nmoment d'être mis en broche. Mais comment se résoudre à quitter la\npartie du monde que Mlle Cunégonde habite?","Tournons vers la Cayenne, dit Cacambo: nous y trouverons des\nFrançais qui vont par tout le monde; ils pourront nous aider. Dieu\naura peut-être pitié de nous.»","Il n'était pas facile d'aller à la Cayenne: ils savaient bien à peu\nprès de quel côté il fallait marcher; mais des montagnes, des fleuves,\ndes précipices, des brigands, des sauvages, étaient partout de terribles\nobstacles. Leurs chevaux moururent de fatigue; leurs provisions furent\nconsumées; ils se nourrirent un mois entier de fruits sauvages, et se\ntrouvèrent enfin auprès d'une petite rivière bordée de cocotiers qui\nsoutinrent leur vie et leurs espérances.","Cacambo, qui donnait toujours d'aussi bons conseils que la vieille,\ndit à Candide: «--Nous n'en pouvons plus; nous avons assez marché.\nJ'aperçois un canot vide sur le rivage; emplissons-le de cocos,\njetons-nous dans cette petite barque, laissons-nous aller au courant:\nune rivière mène toujours à quelque endroit habité. Si nous ne trouvons\npas des choses agréables, nous trouverons du moins des choses\nnouvelles.--Allons, dit Candide, recommandons-nous à la\nProvidence.»","Ils voguèrent quelques lieues entre des bords, tantôt fleuris, tantôt\narides, tantôt unis, tantôt escarpés. La rivière s'élargissait toujours;\nenfin elle se perdait sous une voûte de rochers épouvantables qui\ns'élevaient jusqu'au ciel. Les deux voyageurs eurent la hardiesse de\ns'abandonner aux flots sous cette voûte. Le fleuve resserré en cet\nendroit les porta avec une rapidité et un bruit horrible. Au bout de\nvingt-quatre heures ils revirent le jour; mais leur canot se fracassa\ncontre les écueils; il fallut se traîner de rocher en rocher pendant\nune lieue entière; enfin ils découvrirent un horizon immense bordé\nde montagnes inaccessibles. Le pays était cultivé pour le plaisir comme\npour le besoin; partout l'utile était agréable: les chemins étaient\ncouverts ou plutôt ornés de voitures d'une forme et d'une matière\nbrillantes, portant des hommes et des femmes d'une beauté singulière,\ntraînés rapidement par de gros moutons rouges qui surpassaient en\nvitesse les plus beaux chevaux d'Andalousie, de Tétuan et de Méquinez.","«--Voilà pourtant, dit Candide, un pays qui vaut mieux que la\nWestphalie.» Il mit pied à terre avec Cacambo auprès du premier village\nqu'il rencontra. Quelques enfants du village, couverts de brocarts d'or\ntout déchirés, jouaient au palet à l'entrée du bourg; nos deux hommes\nde l'autre monde s'amusèrent à les regarder: leurs palets étaient\nd'assez larges pièces rondes, jaunes, rouges, vertes, qui jetaient\nun éclat singulier. Il prit envie aux voyageurs d'en ramasser\nquelques-unes; c'était de l'or, c'étaient des émeraudes, des rubis, dont\nle moindre aurait été le plus grand ornement du trône du Mogol.\n«--Sans doute, dit Cacambo, ces enfants sont les fils du roi du\npays qui jouent au petit palet.» Le magister du village parut dans\nce moment pour les faire rentrer à l'école. «--Voilà, dit Candide,\nle précepteur de la famille royale.»","Les petits gueux quittèrent aussitôt le jeu, en laissant à terre\nleurs palets et tout ce qui avait servi à leurs divertissements. Candide\nles ramasse, court au précepteur et les lui présente humblement, lui\nfaisant entendre par signes que leurs altesses royales avaient oublié\nleur or et leurs pierreries. Le magister du village, en souriant, les\njeta par terre, regarda un moment la figure de Candide avec beaucoup\nde surprise, et continua son chemin.","Les voyageurs ne manquèrent pas de ramasser l'or, les rubis et les\némeraudes. «--Où sommes-nous? s'écria Candide. Il faut que les\nenfants des rois de ce pays soient bien élevés, puisqu'on leur apprend\nà mépriser l'or et les pierreries.» Cacambo était aussi surpris que\nCandide. Ils approchèrent enfin de la première maison du village; elle\nétait bâtie comme un palais d'Europe. Une foule de monde s'empressait\nà la porte, et encore plus dans le logis; une musique très agréable se\nfaisait entendre, et une odeur délicieuse de cuisine se faisait sentir.\nCacambo s'approcha de la porte et entendit qu'on parlait péruvien;\nc'était sa langue maternelle, car tout le monde sait que Cacambo était\nné au Tucuman, dans un village où l'on ne connaissait que cette langue.\n«--Je vous servirai d'interprète, dit-il à Candide; entrons, c'est\nici un cabaret.»","Aussitôt deux garçons et deux filles de l'hôtellerie, vêtus de drap\nd'or, et les cheveux renoués avec des rubans, les invitent à se mettre\nà la table de l'hôte. On servit quatre potages garnis chacun de deux\nperroquets, un contour bouilli qui pesait deux cents livres, deux\nsinges rôtis d'un goût excellent, trois cents colibris dans un plat, et\nsix cents oiseaux-mouches dans un autre; des ragoûts exquis, des\npâtisseries délicieuses, le tout dans des plats d'une espèce de cristal\nde roche. Les garçons et les filles de l'hôtellerie versaient plusieurs\nliqueurs faites de canne de sucre.","Les convives étaient pour la plupart des marchands et des voituriers,\ntous d'une politesse extrême, qui firent quelques questions à Cacambo\navec la discrétion la plus circonspecte, et qui répondirent aux siennes\nd'une manière à le satisfaire.","Quand le repas fut fini, Cacambo crut, ainsi que Candide, bien payer\nson écot en jetant sur la table de l'hôte deux de ces larges pièces d'or\nqu'il avait ramassées; l'hôte et l'hôtesse éclatèrent de rire et se\ntinrent longtemps les côtés. Enfin ils se remirent. «--Messieurs,\ndit l'hôte, nous voyons bien que vous êtes des étrangers; nous ne\nsommes pas accoutumés à en voir. Pardonnez-nous si nous nous sommes\nmis à rire quand vous nous avez offert en paiement les cailloux de nos\ngrands chemins. Vous n'avez pas sans doute de la monnaie du pays, mais\nil n'est pas nécessaire d'en avoir pour dîner ici. Toutes les hôtelleries\nétablies pour la commodité du commerce sont payées par le gouvernement.\nVous avez fait mauvaise chère ici, parce que c'est un pauvre village;\nmais partout ailleurs vous serez reçus comme vous méritez de l'être.»\nCacambo expliquait à Candide tous les discours de l'hôte, et Candide\nles écoutait avec la même admiration et le même égarement que son\nami Cacambo les rendait. «--Quel est donc ce pays, disaient-ils\nl'un et l'autre, inconnu à tout le reste de la Terre, et où toute la\nnature est d'une espèce si différente de la nôtre? C'est probablement\nle pays où tout va bien; car il faut absolument qu'il y en ait un de\ncette espèce. Et quoi qu'en dit maître Pangloss, je me suis souvent\naperçu que tout allait assez mal en Westphalie.","[Illustration 42]","[Illustration 43]"]},{"name":"Chapitre 18","paragraphs":["CE QU’ILS VIRENT DANS LE PAYS D'ELDORADO.","Cacambo témoigna à son hôte toute sa curiosité; l'hôte lui dit:\n«--Je suis fort ignorant, et je m'en trouve bien; mais nous avons\nici un vieillard retiré de la cour, qui est le plus savant homme du\nroyaume, et le plus communicatif.» Aussitôt il mène Cacambo chez le\nvieillard. Candide ne jouait plus que le second personnage et\naccompagnait son valet. Ils entrèrent dans une maison fort simple, car\nla porte n'était que d'argent, et les lambris des appartements n'étaient\nque d'or, mais travaillés avec tant de goût, que les plus riches lambris\nne l'effaçaient pas. L'antichambre n'était à la vérité incrustée que de\nrubis et d'émeraudes; mais l'ordre dans lequel tout était arrangé\nréparait bien celle extrême simplicité.","Le vieillard reçut les deux étrangers sur un sofa matelassé de plumes\nde colibri, et leur lit présenter des liqueurs dans des vases de\ndiamant, après quoi il satisfit à leur curiosité en ces termes:","«--Je suis âgé de cent soixante et douze ans, et j'ai appris de\nfeu mon père, écuyer du roi, les étonnantes révolutions du Pérou dont\nil avait été témoin. Le royaume où nous sommes est l'ancienne patrie\ndes Incas, qui en sortirent très imprudemment pour aller subjuguer une\npartie du monde, et qui furent enfin détruits par les Espagnols.","«Les princes de leur famille qui restèrent dans leur pays natal\nfurent plus sages; ils ordonnèrent, du consentement de la nation,\nqu'aucun habitant ne sortirait jamais de notre petit royaume; et c'est\nce qui nous a conservé notre innocence et notre félicité. Les Espagnols\nont eu une connaissance confuse de ce pays; ils l'ont appelé El Dorado;\net un Anglais, nommé le chevalier Raleig, en a même approché il y a\nenviron cent années; mais comme nous sommes entourés de rochers\ninabordables et de précipices, nous avons toujours été jusqu'à présent\nà l'abri de la rapacité des nations de l'Europe, qui ont une fureur\ninconcevable pour les cailloux et pour la fange de notre terre, et qui,\npour en avoir, nous tueraient tous jusqu'au dernier.»","La conversation fut longue; elle roula sur la forme du gouvernement,\nsur les mœurs, sur les femmes, sur les spectacles publics, sur les arts.\nEnfin Candide, qui avait toujours du goût pour la métaphysique, fit\ndemander par Cacambo si dans le pays il y avait une religion.","Le vieillard rougit un peu. «--Comment donc! dit-il; en\npouvez-vous douter? Est-ce que vous nous prenez pour des ingrats?»\nCacambo demanda humblement quelle était la religion d'Eldorado. Le\nvieillard rougit encore: «--Est-ce qu'il peut y avoir deux\nreligions? dit-il. Nous avons, je crois, la religion de tout le monde;\nnous adorons Dieu du soir jusqu'au matin.--N'adorez-vous qu'un\nseul Dieu? dit Cacambo, qui servait toujours d'interprète aux doutes\nde Candide.--Apparemment, dit le vieillard, qu'il n'y en a ni\ndeux, ni trois, ni quatre. Je vous avoue que les gens de votre monde\nfont des questions bien singulières.» Candide ne se lassa pas de faire\ninterroger ce bon vieillard; il voulut savoir comment on priait Dieu\ndans l'Eldorado. «--Nous ne le prions point, dit le bon et\nrespectable sage; nous n'avons rien à lui demander: il nous a donné\ntout ce qu'il nous faut; nous le remercions sans cesse.» Candide eut la\ncuriosité de voir des prêtres; il lit demander où ils étaient. Le bon\nvieillard sourit. «--Mes amis, dit-il, nous sommes tous prêtres;\nle roi et tous les chefs de famille chantent des cantiques d'actions de\ngrâces solennellement tous les matins, et cinq ou six mille musiciens\nles accompagnent.--Quoi! vous n'avez point de moines qui\nenseignent, qui disputent, qui gouvernent, qui cabalent, et qui font\nbrûler les gens qui ne sont pas de leur avis?--Il faudrait que\nnous fussions fous, dit le vieillard; nous sommes tous ici du même\navis, et nous n'entendons pas ce que vous voulez dire avec vos moines.»\nCandide à tous ces discours demeurait en extase et disait en lui-même:\n«--Ceci est bien différent de la Westphalie et du château de M.\nle baron: si notre ami Pangloss avait vu l'Eldorado, il n'aurait plus\ndit que le château de Thunder-ten-tronckh était ce qu'il y avait\nde mieux sur la terre; il est certain qu'il faut voyager.»","Après cette longue conversation, le bon vieillard fit atteler un\ncarrosse à six moutons, et donna douze de ses domestiques aux deux\nvoyageurs pour les conduire à la cour. «--Excusez-moi, leur\ndit-il, si mon âge me prive de l'honneur de vous accompagner. Le roi\nvous recevra d'une manière dont vous ne serez pas mécontents, et vous\npardonnerez sans doute aux usages du pays, s'il yen a quelques-uns\nqui vous déplaisent.»","Candide et Cacambo montent en carrosse; les six moutons volaient,\net en moins de quatre heures on arriva au palais du roi, situé à un bout\nde la capitale. Le portail était de deux cent vingt pieds de haut et de\ncent de large; il est impossible d'exprimer quelle en était la matière.\nOn voit assez quelle supériorité prodigieuse elle devait avoir sur ces\ncailloux et sur ce sable que nous nommons or et pierreries.","Vingt belles filles de la garde reçurent Candide et Cacambo à la\ndescente du carrosse, les conduisirent aux bains, les vêtirent de robes\nd'un tissu de duvet de colibri, après quoi les grands officiers et les\ngrandes officières de la couronne les menèrent à l'appartement de sa\nmajesté au milieu de deux files chacune de mille musiciens, selon\nl'usage ordinaire. Quand ils approchèrent de la salle du trône, Cacambo\ndemanda à un grand officier comment il fallait s'y prendre pour saluer\nsa majesté: si on se jetait à genoux ou ventre à terre; si on se mettait\nles mains sur la tête ou sur le derrière; si on léchait la poussière de\nla salle, en un mot qu'elle était la cérémonie. «--L'usage, dit le\ngrand officier, est d'embrasser le roi et de le baiser des deux côtés.»\nCandide et Cacambo sautèrent au cou de sa majesté, qui les reçut avec\ntoute la grâce imaginable, et qui les pria poliment à souper.","[Illustration 44: UN DÎNER DANS L'ELDORADO]","En attendant, on leur fit voir la ville, les édifices publics élevés\njusqu'aux nues, les marchés ornés de mille colonnes, les fontaines\nd'eau pure, les fontaines d'eau rose, celles de liqueurs de canne de\nsucre qui coulaient continuellement dans de grandes places pavées\nd'une espèce de pierreries qui répandaient une odeur semblable à\ncelle du girofle et de la cannelle. Candide demanda à voir la cour de\njustice, le parlement; on lui dit qu'il n'y en avait point, et qu'on ne\nplaidait jamais. Il s'informa s'il y avait des prisons, et on lui dit\nque non. Ce qui le surprit davantage, et qui lui fit le plus de plaisir,\nce fut le palais des sciences, dans lequel il vit une galerie de deux\nmille pas, toute pleine d'expériences de physique.","Après avoir parcouru toute l'après-dînée à peu près la millième\npartie de la ville, on les ramena chez le roi. Candide se mit à table\nentre sa majesté, son valet Cacambo et plusieurs dames. Jamais on ne\nfit meilleure chère, et jamais on n'eut plus d'esprit à souper qu'en eut\nsa majesté. Cacambo expliquait les bons mots du roi à Candide, et\nquoique traduits, ils paraissaient toujours des bons mots. De tout ce\nqui étonnait Candide, ce n'était pas ce qui l'étonna le moins.","Ils passèrent un mois dans cet hospice. Candide ne cessait de dire à\nCacambo: «--Il est vrai, mon ami, encore une fois, que le château\noù je suis né ne vaut pas le pays où nous sommes: mais enfin Mlle\nCunégonde n'y est pas, et vous avez sans doute quelque maîtresse en\nEurope. Si nous restons ici, nous n'y serons que comme les autres,\nau lieu que si nous retournons dans notre monde, seulement avec douze\nmoutons chargés de cailloux d'Eldorado, nous serons plus riches que\ntous les rois ensemble, nous n'aurons plus d'inquisiteurs à craindre,\net nous pourrons aisément reprendre Mlle Cunégonde.» Ce discours plut à\nCacambo; on aime tant à courir, à se faire valoir chez les siens, à\nfaire parade de ce qu'on a vu dans ses voyages, que les deux heureux\nrésolurent de ne plus l'être, et de demander leur congé à sa majesté.","«--Vous faites une sottise, leur dit le roi: je sais bien que\nmon pays est peu de chose; mais quand on est passablement quelque\npart, il faut y rester. Je n'ai pas assurément le droit de retenir des\nétrangers: c'est une tyrannie qui n'est ni dans nos mœurs, ni dans nos\nlois; tous les hommes sont libres. Partez quand vous voudrez; mais la\nsortie est bien difficile. Il est impossible de remonter la rivière\nrapide sur laquelle vous êtes arrivés par miracle, et qui court sous\ndes voûtes de rochers. Les montagnes qui entourent tout mon royaume\nont dix mille pieds de hauteur, et sont droites comme des murailles.\nElles occupent chacune en largeur un espace de plus de dix lieues; on\nne peut en descendre que par des précipices. Cependant, puisque vous\nvoulez absolument partir, je vais donner ordre aux intendants des\nmachines d'en faire une qui puisse vous transporter commodément.\nQuand on vous aura conduits au revers des montagnes, personne ne\npourra vous accompagner, car mes sujets ont fait vœu de ne jamais\nsortir de leur enceinte, et ils sont trop sages pour rompre leur vœu.\nDemandez-moi d'ailleurs tout ce qu'il vous plaira.--Nous ne\ndemandons à votre majesté, dit Cacambo, que quelques moutons chargés\nde vivres, de cailloux et de boue du pays.»--Le roi rit: «--Je\nne conçois pas, dit-il, quel goût vos gens d'Europe ont pour notre boue\njaune; mais emportez-en tant que vous voudrez, et grand bien vous\nfasse!»","Il donna l'ordre sur-le-champ à ses ingénieurs de faire une machine\npour guinder ces deux hommes extraordinaires hors du royaume. Trois\nmille bons physiciens y travaillèrent: elle fut prête au bout de quinze\njours, et ne coûta pas plus de vingt millions de livres sterling, monnaie\ndu pays. On mit sur la machine Candide et Cacambo; il y avait deux\ngrands moutons rouges sellés et bridés pour leur servir de montures\nquand ils auraient franchi les montagnes, vingt moutons de bât chargés\nde vivres, trente qui portaient des présents de ce que le pays a de plus\ncurieux, et cinquante chargés d'or, de pierreries et de diamants. Le\nroi embrassa tendrement les deux vagabonds.","Ce fut un beau spectacle que leur départ et la manière ingénieuse\ndont ils furent hissés, eux et leurs moutons, au haut des montagnes.\nLes physiciens prirent congé d'eux après les avoir mis en sûreté, et\nCandide n'eut plus d'autre désir et d'autre objet que d'aller présenter\nses moutons à Mlle Cunégonde. «--Nous avons, dit-il, de quoi\npayer le gouverneur de Buenos-Ayres, si Mlle Cunégonde peut être mise\nà prix. Marchons vers la Cayenne; embarquons-nous, et nous verrons\nensuite quel royaume nous pourrons acheter.","[Illustration 45]","[Illustration 46]"]},{"name":"Chapitre 19","paragraphs":["CE QUI LEUR ARRIVA À SURINAM, ET COMMENT CANDIDE FIT CONNAISSANCE\nAVEC MARTIN.","La première journée de nos deux voyageurs fut assez agréable. Ils\nétaient encouragés par l'idée de se voir possesseurs de plus de trésors\nque l'Asie, l'Europe et l'Afrique n'en pouvaient rassembler. Candide\ntransporté écrivit le nom de Cunégonde sur les arbres. À la seconde\njournée, deux de leurs moutons s'enfoncèrent dans des marais et y\nfurent abîmés avec leurs charges; deux autres moutons moururent de\nfatigue quelques jours après; sept ou huit périrent ensuite de faim\ndans un désert; d'autres tombèrent au bout de quelques jours dans des\nprécipices. Enfin, après cent jours de marche, il ne leur resta que deux\nmoutons. Candide dit à Cacambo: «--Mon ami, vous voyez comme les\nrichesses de ce monde sont périssables; il n'y a rien de solide que la\nvertu et le bonheur de revoir Mlle Cunégonde.--Je l'avoue, dit\nCacambo: mais il nous reste encore deux moutons avec plus de trésors\nque n'en aura jamais le roi d'Espagne, et je vois de loin une ville que\nje soupçonne être Surinam, appartenant aux Hollandais. Nous sommes au\nbout de nos peines et au commencement de notre félicité.»","En approchant de la ville, ils rencontrèrent un nègre étendu par\nterre, n'ayant plus que la moitié de son habit, c'est-à-dire d'un\ncaleçon de toile bleue; il manquait à ce pauvre homme la jambe gauche\net la main droite.","«--Eh! mon Dieu! lui dit Candide en hollandais, que fais-tu là,\nmon ami, dans l'état horrible où je te vois?--J'attends mon maître,\nM. Vanderdendur, le fameux négociant, répondit le nègre.--Est-ce\nM. Vanderdendur, dit Candide, qui t'a traité ainsi?--Oui, monsieur,\ndit le nègre, c'est l'usage. On nous donne un caleçon de toile pour tout\nvêtement, deux fois l'année. Quand nous travaillons aux sucreries et\nque la meule nous attrape le doigt, on nous coupe la main; quand nous\nvoulons nous enfuir, on nous coupe la jambe: je me suis trouvé dans\nles deux cas. C'est à ce prix que vous mangez du sucre en Europe.\nCependant, lorsque ma mère me vendit dix écus patagons sur la côte de\nGuinée, elle me disait: «Mon cher enfant, bénis nos fétiches, adore-les\ntoujours; ils te feront vivre heureux; tu as l'honneur d'être esclave\nde nos seigneurs les blancs, et tu fais par là la fortune de ton père\net de ta mère,» Hélas! je ne sais pas si j'ai fait leur fortune, mais\nils n'ont pas fait la mienne. Les chiens, les singes et les perroquets\nsont mille fois moins malheureux que nous. Les fétiches hollandais qui\nm'ont converti me disent tous les dimanches que nous sommes tous\nenfants d'Adam, blancs et noirs. Je ne suis pas généalogiste; mais si\nces prêcheurs disent vrai, nous sommes tous cousins issus de germain.\nOr, vous m'avouerez qu'on ne peut pas en user avec ses parents\nd'une manière plus horrible.","--Ô Pangloss! s'écria Candide, tu n'avais pas deviné cette\nabomination; c'en est fait, il faudra qu'à la fin je renonce à ton\noptimisme.--Qu'est-ce que optimisme? disait Cacambo.--Hélas!\ndit Candide, c'est la rage de soutenir que tout est bien quand on est\nmal.» Et il versait des larmes en regardant son nègre, et en pleurant\nil entra dans Surinam.","La première chose dont ils s'informent, c'est s'il n'y a point au\nport quelque vaisseau qu'on put envoyer à Buenos-Ayres. Celui à qui\nils s'adressèrent était justement un patron espagnol qui s'offrit à\nfaire avec eux un marché honnête. Il leur donna rendez-vous dans un\ncabaret. Candide et le fidèle Cacambo allèrent l'y attendre avec leurs\ndeux moutons.","Candide, qui avait le cœur sur les lèvres, conta à Espagnol toutes\nses aventures et lui avoua qu'il voulait enlever Mlle Cunégonde.\n«--Je me garderai bien de vous passer à Buenos-Ayres, dit le\npatron: je serais pendu, et vous aussi; la belle Cunégonde est la\nmaîtresse favorite de Monseigneur. Ce fut un coup de foudre pour\nCandide; il pleura longtemps: enfin il tira à part Cacambo.--Voici,\nmon cher ami, lui dit-il, ce qu'il faut que tu fasses. Nous avons\nchacun dans nos poches pour cinq ou six millions de diamants. Tu es\nplus habile que moi: va prendre Mlle Cunégonde à Buenos-Ayres. Si\nle gouverneur fait quelques difficultés, donne-lui un million; s'il ne\nse rend pas, donne-lui-en deux. Tu n'as point tué d'inquisiteur; on\nne se défiera point de toi. J'équiperai un autre vaisseau, j'irai\nl'attendre à Venise: c'est un pays libre où l'on n'a rien à craindre\nni des Bulgares, ni des Abares, ni des juifs, ni des inquisiteurs.»\nCacambo applaudit à celle sage résolution. Il était au désespoir de se\nséparer d'un bon maître devenu son ami intime; mais le plaisir de lui\nêtre utile l'emporta sur la douleur de le quitter. Ils s'embrassèrent\nen versant des larmes: Candide lui recommanda de ne point oublier la\nbonne vieille. Cacambo partit dès le jour même: c'était un très bon\nhomme que ce Cacambo.","Candide resta encore quelque temps à Surinam, et attendit qu'un\nautre patron voulût le mener en Italie, lui et les deux moutons qui\nlui restaient. Il prit des domestiques et acheta tout ce qui lui était\nnécessaire pour un long voyage; enfin M. Vanderdendur, maître d'un\ngros vaisseau, vint se présenter à lui. «--Combien voulez-vous,\ndemanda-t-il à cet homme, pour me mener en droiture à Venise, moi,\nmes gens, mon bagage et les deux moutons que voilà?» Le patron\ns'accorda à dix mille piastres: Candide n'hésita pas.","«--Oh! oh! dit à part soi le prudent Vanderdendur, cet étranger\ndonne dix mille piastres tout d'un coup! il faut qu'il soit bien riche.\nPuis, revenant un moment après, il signifia qu'il ne pouvait partir à\nmoins de vingt mille.--Eh bien! vous les aurez, dit Candide.","--Ouais, se dit tout bas le marchand, cet homme donne vingt\nmille piastres aussi aisément que dix mille. Il revint encore et dit\nqu'il ne pouvait le conduire à Venise à moins de trente mille\npiastres.--Vous en aurez donc trente mille, répondit Candide.","--Oh! oh! se dit encore le marchand hollandais, trente mille\npiastres ne coûtent rien à cet homme-ci; sans doute les deux moutons\nportent des trésors immenses; n'insistons pas davantage: faisons-nous\nd'abord payer les trente mille piastres, et puis nous verrons.» Candide\nvendit deux petits diamants, dont le moindre valait plus que tout\nl'argent que demandait le patron. Il le paya d'avance.","Les deux moutons furent embarqués. Candide suivait dans un petit\nbateau pour joindre le vaisseau à la rade. Le patron prend son temps,\nmet à la voile, démarre; le vent le favorise. Candide éperdu et\nstupéfait le perd bientôt de vue.--«Hélas! cria-t-il, voilà un\ntour digne de l'Ancien Monde.» Il retourne au rivage, abîmé dans la\ndouleur; car enfin il avait perdu de quoi faire la fortune de vingt\nmonarques.","Il se transporte chez le juge hollandais, et, comme il était un peu\ntroublé, il frappe rudement à la porte; il entre, expose son aventure\net crie un peu plus haut qu'il ne convenait. Le juge commença par lui\nfaire payer dix mille piastres pour le bruit qu'il avait fait; ensuite\nil l'écouta patiemment, lui promit d'examiner son affaire sitôt que le\nmarchand serait revenu, et se fit payer dix mille autres piastres pour\nles frais de l'audience.","Ce procédé acheva de désespérer Candide: il avait à la vérité essuyé\ndes malheurs mille fois plus douloureux; mais le sang-froid du juge et\ncelui du patron dont il était volé alluma sa bile et le plongea dans une\nnoire mélancolie. La méchanceté des hommes se présentait à son esprit\ndans toute sa laideur; il ne se nourrissait que d'idées tristes. Enfin\nun vaisseau français étant sur le point de partir pour Bordeaux, comme\nil n'avait plus de moutons chargés de diamants à embarquer, il loua une\nchambre du vaisseau à juste prix, et fit signifier dans la ville qu'il\npaierait le passage, la nourriture, et donnerait deux mille piastres à\nun honnête homme qui voudrait faire le voyage avec lui, à condition\nque cet homme serait le plus dégoûté de son état et le plus malheureux\nde la province.","Il se présenta une foule de prétendants qu'une flotte n'aurait pu\ncontenir. Candide, voulant choisir entre les plus apparents, il distingua\nune vingtaine de personnes qui lui paraissaient assez sociables, et qui\ntoutes prétendaient mériter la préférence. Il les assembla dans son\ncabaret et leur donna à souper, à condition que chacun ferait serment\nde raconter fidèlement son histoire, promettant de choisir celui qui\nlui paraîtrait le plus à plaindre et le plus mécontent de son état, à\nplus juste titre, et de donner aux autres quelques gratifications.","La séance dura jusqu'à quatre heures du matin. Candide, en écoutant\ntoutes leurs aventures, se ressouvenait de ce que lui avait dit la\nvieille en allant à Buenos-Ayres, et de la gageure qu'elle avait faite\nqu'il n'y avait personne sur le vaisseau auquel il ne fût arrivé de très\ngrands malheurs. Il songeait à Pangloss à chaque aventure qu'on lui\ncontait. «--Ce Pangloss, disait-il, serait bien embarrassé à\ndémontrer son système. Je voudrais qu'il fût ici. Certainement, si tout\nva bien, c'est dans Eldorado, et non pas dans le reste de la Terre.»\nEnfin il se détermina en faveur d'un pauvre savant qui avait travaillé\ndix ans pour les libraires à Amsterdam. Il jugea qu'il n'y avait point\nde métier au monde dont on dût être plus dégoûté.","Ce savant, qui était d'ailleurs un bon homme, avait été volé par sa\nfemme, battu par son fils et abandonné de sa fille, qui s'était fait\nenlever par un Portugais. Il venait d'être privé d'un petit emploi\nduquel il subsistait; et les prédicants de Surinam le persécutaient,\nparce qu'ils le prenaient pour un socinien. Il faut avouer que les\nautres étaient pour le moins aussi malheureux que lui; mais Candide\nespérait que le savant le désennuierait dans le voyage.","Tous ses autres rivaux trouvèrent que Candide leur taisait une grande\ninjustice; mais il les apaisa en leur donnant à chacun cent piastres.","[Illustration 47]","[Illustration 48]"]},{"name":"Chapitre 20","paragraphs":["CE QUI ARRIVA SUR MER À CANDIDE ET À MARTIN.","Le vieux savant, qui s'appelait Martin, s'embarqua donc pour Bordeaux\navec Candide. L'un et l'autre avaient beaucoup vu et beaucoup souffert;\net quand le vaisseau aurait dû faire voile de Surinam au Japon par le\ncap de Bonne-Espérance, ils auraient eu de quoi s'entretenir du mal\nmoral et du mal physique pendant tout le voyage.","Cependant Candide avait un grand avantage sur Martin: c'est qu'il\nespérait toujours revoir Mlle Cunégonde, et que Martin n'avait rien à\nespérer; de plus, il avait de l'or et des diamants, et, quoiqu'il eût\nperdu cent gros moutons rouges chargés des plus grands trésors de la\nterre, quoiqu'il eût toujours sur le cœur la friponnerie du patron\nhollandais, cependant, quand il songeait à ce qui lui restait dans ses\npoches, et quand il parlait de Cunégonde, surtout sur la fin du repas,\nil penchait alors pour le système de Pangloss.","«--Mais vous, monsieur Martin, dit-il au savant, que pensez-vous\nde tout cela? quelle est votre idée sur le mal moral et le mal\nphysique?--Monsieur, répondit Martin, mes prêtres m'ont\naccusé d'être socinien; mais la vérité du fait est que je suis\nmanichéen.--Vous vous moquez de moi, dit Candide; il n'y a plus de\nmanichéens dans le monde.--Il y a moi, dit Martin: je ne sais qu'y\nfaire; mais je ne peux penser autrement.--Il faut que vous ayez le\ndiable au corps, dit Candide.--Il se mêle si fort des affaires de\nce monde, dit Martin, qu'il pourrait bien être dans mon corps, comme\npartout ailleurs; mais je vous avoue qu'en jetant la vue sur ce globe,\nou plutôt sur ce globule, je pense que Dieu l'a abandonné à quelque être\nmalfaisant: j'en excepte toujours Eldorado. Je n'ai guère vu de ville\nqui ne désirât la ruine de la ville voisine, point de famille qui ne\nvoulût exterminer quelque autre famille. Partout les faibles ont en\nexécration les puissants devant lesquels ils rampent, et les puissants\nles traitent comme des troupeaux dont on vend la laine et la chair.\nUn million d'assassins enrégimentés, courant d'un bout de l'Europe à\nl'autre, exerce le meurtre et le brigandage avec discipline pour gagner\nson pain, parce qu'il n'a pas de métier plus honnête; et dans les villes\nqui paraissent jouir de la paix, et où les arts fleurissent, les hommes\nsont dévorés de plus d'envie, de soins el d'inquiétudes qu'une ville\nassiégée n'éprouve de fléaux. Les chagrins secrets sont encore plus\ncruels que les misères publiques. En un mot, j'en ai tant vu et tant\néprouvé que je suis manichéen.","--Il y a pourtant du bon, répliquait Candide.--Cela peut\nêtre, disait Martin; mais je ne le connais pas.»","Au milieu de cette dispute, on entendit un bruit de canon. Le bruit\nredouble à chaque instant. Chacun prend sa lunette. On aperçoit deux\nvaisseaux qui combattaient à la distance d'environ trois milles: le vent\nles amena l'un et l'autre si près du vaisseau français, qu'on eut le\nplaisir de voir le combat tout à son aise. Enfin l'un des deux vaisseaux\nlâcha à l'autre une bordée si bas et si juste qu'il le coula à fond.\nCandide et Martin aperçurent distinctement une centaine d'hommes sur\nle tillac du vaisseau qui s'enfonçait; ils levaient tous les mains au\nciel et jetaient des clameurs effroyables: en un moment tout fut\nenglouti.","«--Eh bien! dit Martin, voilà comme les hommes se traitent les\nuns les autres.--Il est vrai, dit Candide, qu'il y a quelque chose\nde diabolique dans cette affaire.» En parlant ainsi, il aperçut je ne\nsais quoi, d'un rouge éclatant, qui nageait auprès de son vaisseau. On\ndétacha la chaloupe pour voir ce que ce pouvait être; c'était un de ses\nmoutons. Candide eut plus de joie de retrouver ce mouton qu'il n'avait\nété affligé d'en perdre cent tout chargés de gros diamants d'Eldorado.","Le capitaine français aperçut bientôt que le capitaine du vaisseau\nsubmergeant était espagnol, et que celui du vaisseau submergé était un\npirate hollandais: c'était celui-là même qui avait volé Candide. Les\nrichesses immenses dont ce scélérat s'était emparé furent ensevelies\navec lui dans la mer, et il n'y eut qu'un mouton de sauvé. «--Vous\nvoyez, dit Candide à Martin, que le crime est puni quelquefois; ce coquin\nde patron hollandais a eu le sort qu'il méritait.--Oui, dit Martin,\nmais fallait-il que les passagers qui étaient sur son vaisseau périssent\naussi? Dieu a puni ce fripon; le diable a noyé les autres.» Cependant le\nvaisseau français et l'espagnol continuèrent leur route, et Candide\ncontinua ses conversations avec Martin. Ils disputèrent quinze jours de\nsuite, et au bout de quinze jours ils étaient aussi avancés que le\npremier. Mais enfin ils parlaient, ils se communiquaient des idées, ils\nse consolaient. Candide caressait son mouton. «--Puisque je t'ai\nretrouvé, dit-il, je pourrai bien retrouver Cunégonde.»","[Illustration 49]","[Illustration 50]"]},{"name":"Chapitre 21","paragraphs":["CANDIDE ET MARTIN APPROCHENT DES CÔTES DE FRANCE, ET RAISONNENT.","On aperçut enfin les côtes de France. «--Avez-vous jamais été\nen France, monsieur Martin? dit Candide.--Oui, dit Martin, j'ai\nparcouru plusieurs provinces. Il y en a où la moitié des habitants est\nfolle, quelques-unes où l'on est trop rusé, d'autres où l'on est\ncommunément assez doux et assez bête, d'autres où l'on fait le bel\nesprit, et, dans toutes, la principale occupation est l'amour; la\nseconde, de médire; et la troisième, de dire des sottises.--Mais,\nmonsieur Martin, avez-vous vu Paris?--Oui, j'ai vu Paris; il tient\nde toutes ces espèces-là; c'est un chaos, c'est une presse dans laquelle\ntout le monde cherche le plaisir, et où presque personne ne le trouve,\ndu moins à ce qu'il m'a paru. J'y ai séjourné peu; j'y fus volé en\narrivant de tout ce que j'avais par des filous, à la foire Saint-Germain;\non me prit moi-même pour un voleur, et je fus huit jours en prison,\naprès quoi je me fis correcteur d'imprimerie pour gagner de quoi\nretourner à pied en Hollande. Je connus la canaille écrivante, la\ncanaille cabotante et la canaille convulsionnaire. On dit qu'il y a des\ngens fort polis dans cette ville-là; je le veux croire.","--Pour moi, je n'ai nulle curiosité de voir la France, dit\nCandide; vous devinez aisément que, quand on a passé un mois dans\nl'Eldorado, on ne se soucie plus de rien voir sur la terre, que Mlle\nCunégonde. Je vais l'attendre à Venise; nous traverserons la France\npour aller en Italie; ne m'accompagnerez-vous pas?--Très volontiers,\ndit Martin; on dit que Venise n'est bonne que pour les nobles vénitiens,\nmais que cependant on y reçoit très bien les étrangers quand ils ont\nbeaucoup d'argent. Je n'en ai point; vous en avez: je vous suivrai\npartout.--À propos, dit Candide, pensez-vous que la terre ait été\noriginairement une mer, comme on l'assure dans ce gros livre qui\nappartient au capitaine du vaisseau?--Je n'en crois rien du tout,\ndit Martin, non plus que de toutes les rêveries qu'on nous débite depuis\nquelque temps.--Mais à quelle fin ce monde a-t-il donc été\nformé? dit Candide.--Pour nous faire enrager, répondit\nMartin.--N'êtes-vous pas bien étonné, continua Candide, de l'amour\nque ces deux filles du pays des Oreillons avaient pour ces deux singes,\net dont je vous ai conté l'aventure?--Point du tout, dit Martin,\nje ne vois pas ce que cette passion a d'étrange; j'ai tant vu de choses\nextraordinaires, qu'il n'y a plus rien d'extraordinaire.--Croyez-vous,\ndit Candide, que les hommes se soient toujours massacrés mutuellement\ncomme ils font aujourd'hui? qu'ils aient toujours été menteurs, fourbes,\nperfides, ingrats, brigands, faibles, volages, lâches, envieux,\ngourmands, ivrognes, avares, ambitieux, sanguinaires, calomniateurs,\ndébauchés, fanatiques, hypocrites et sots?--Croyez-vous, dit\nMartin, que les éperviers aient toujours mangé des pigeons\nquand ils en ont trouvé?--Oui, sans doute, dit Candide.--Eh\nbien! dit Martin, si les éperviers ont toujours eu le même caractère,\npourquoi voulez-vous que les hommes aient changé le leur?--Oh!\ndit Candide, il y a bien de la différence, car le libre arbitre....»\nEn raisonnant ainsi, ils arrivèrent à Bordeaux.","[Illustration 51]","[Illustration 52]"]},{"name":"Chapitre 22","paragraphs":["CE QUI ARRIVA EN FRANCE À CANDIDE ET À MARTIN.","Candide ne s'arrêta dans Bordeaux qu'autant de temps qu'il en\nfallait pour vendre quelques cailloux du Dorado, et pour s'accommoder\nd'une bonne chaise à deux places, car il ne pouvait plus se passer de\nson philosophe Martin; il fut seulement très taché de se séparer de son\nmouton, qu'il laissa à l'Académie des sciences de Bordeaux, laquelle\nproposa pour le sujet du prix de cette année de trouver pourquoi la\nlaine de ce mouton était rouge, et le prix fut adjugé à un savant du\nNord, qui démontra par A, plus B, moins C divisé par Z, que le mouton\ndevait être rouge et mourir de la clavelée.","Cependant tous les voyageurs que Candide rencontra dans les\ncabarets de la route lui disaient: «--Nous allons à Paris.» Cet\nempressement général lui donna enfin l'envie de voir cette capitale;\nce n'était pas beaucoup se détourner du chemin de Venise.","Il entra par le faubourg Saint-Marceau, et crut être dans le plus\nvilain village de la Westphalie.","À peine Candide fut-il dans son auberge, qu'il fut attaqué d'une\nmaladie légère causée par ses fatigues. Comme il avait au doigt un\ndiamant énorme, et qu'on avait aperçu dans son équipage une cassette\nprodigieusement pesante, il eut aussitôt auprès de lui deux médecins\nqu'il n'avait pas mandés, quelques amis intimes qui ne le quittèrent pas,\net deux dévotes qui faisaient chauffer ses bouillons. Martin\ndisait: «--Je me souviens d'avoir été malade aussi à Paris dans\nmon premier voyage; j'étais fort pauvre: aussi n'eus-je ni amis, ni\ndévotes, ni médecins, et je guéris.»","Cependant, à force de médecines et de saignées, la maladie de\nCandide devint sérieuse. Un habitué du quartier vint avec douceur lui\ndemander un billet payable au porteur pour l'autre monde. Candide n'en\nvoulut rien faire; les dévotes l'assurèrent que c'était une nouvelle\nmode. Candide répondit qu'il n'était point homme à la mode. Martin\nvoulut jeter l'habitué par les fenêtres. Le clerc jura qu'on n'enterrerait\npoint Candide. Martin jura qu'il enterrerait le clerc, s'il continuait\nà les importuner. La querelle s'échauffa; Martin le prit par les épaules,\nel le chassa rudement, ce qui causa un grand scandale dont on fit un\nprocès-verbal.","Candide guérit; et pendant sa convalescence il eut très bonne\ncompagnie à souper chez lui. On jouait gros jeu. Candide était tout\nétonné que jamais les as ne lui vinssent, et Martin ne s'en étonnait pas.","Parmi ceux qui lui faisaient les honneurs de la ville, il y avait un\npetit abbé périgourdin, l'un de ces gens empressés, toujours alertes,\ntoujours serviables, effrontés, caressants, accommodants, qui guettent\nles étrangers à leur passage, leur content l'histoire scandaleuse\nde la ville et leur offrent des plaisirs à tout prix. Celui-ci mena\nd'abord Candide et Martin à la comédie. On y jouait une tragédie\nnouvelle. Candide se trouva placé auprès de quelques beaux esprits.\nCela ne l'empêcha pas de pleurer à des scènes jouées parfaitement.\nUn des raisonneurs qui étaient à ses côtés lui dit dans un entr'acte:\n«--Vous avez grand tort de pleurer; cette actrice est fort\nmauvaise; l'acteur qui joue avec elle est plus mauvais acteur encore;\nla pièce est encore plus mauvaise que les acteurs; l'auteur ne sait pas\nun mot d'arabe, et cependant la scène est en Arabie, et, de plus,\nc'est un homme qui ne croit pas aux idées innées; je vous apporterai\ndemain vingt brochures contre lui.--Monsieur, combien avez-vous\nde pièces de théâtre en France? dit Candide à l'abbé, lequel\nrépondit:--Cinq ou six mille.--C'est beaucoup, dit Candide.\nCombien y en a-t-il de bonnes?--Quinze ou seize, répliqua\nl'autre»--C'est beaucoup, dit Martin.»","Candide fut très content d'une actrice qui faisait la reine Élisabeth,\ndans une assez plate tragédie que l'on joue quelquefois. «--Cette\nactrice, dit-il à Martin, me plaît beaucoup; elle a un faux air de Mlle\nCunégonde; je serais bien aise de la saluer.» L'abbé périgourdin\ns'offrit à l'introduire chez elle. Candide, élevé en Allemagne,\ndemanda quelle était l'étiquette, et comment on traitait en France les\nreines d'Angleterre. «--Il faut distinguer, dit l'abbé: en\nprovince, on les mène au cabaret; à Paris, on les respecte quand\nelles sont belles, et on les jette à la voirie quand elles sont\nmortes.--Des reines à la voirie! dit Candide.--Oui, vraiment,\ndit Martin; monsieur l'abbé a raison: j'étais à Paris quand Mlle Monime\npassa, comme on dit, de cette vie à l'autre; on lui refusa ce que ces\ngens-ci appellent _les honneurs de la sépulture_, c'est-à-dire\nde pourrir avec tous les gueux du quartier dans un vilain cimetière;\nelle fut enterrée toute seule de sa bande, au coin de la rue de\nBourgogne, ce qui dut lui faire une peine extrême, car elle pensait très\nnoblement.--Cela est bien impoli, dit Candide.--Que\nvoulez-vous? dit Martin; ces gens-ci sont ainsi faits. Imaginez toutes\nles contradictions, toutes les incompatibilités possibles; vous les\nverrez dans le gouvernement, dans les tribunaux, dans les églises,\ndans les spectacles de cette drôle de nation.--Est-il vrai qu'on\nrit toujours à Paris? dit Candide.--Oui, dit l'abbé, mais c'est en\nenrageant, car on s'y plaint de tout avec de grands éclats de rire; même\non y fait en riant les actions les plus détestables.","--Quel est, dit Candide, ce gros cochon qui me disait tant de\nmal de la pièce où j'ai tant pleuré, et des acteurs qui m'ont fait tant\nplaisir?--C'est un mal-vivant, répondit l'abbé, qui gagne sa vie à\ndire du mal de toutes les pièces et de tous les livres; il hait quiconque\nréussit, comme les eunuques haïssent les jouissants; c'est un de ces\nserpents de la littérature qui se nourrissent de fange et de venin;\nc'est un folliculaire.--Qu'appelez-vous folliculaire? dit\nCandide.--C'est, dit l'abbé, un faiseur de feuilles, un Fréron.»","C'est ainsi que Candide, Martin et le Périgourdin raisonnaient sur\nl'escalier, en voyant défiler le monde au sortir de la pièce.\n«--Quoique je sois très empressé de revoir Mlle Cunégonde, dit\nCandide, je voudrais pourtant souper avec Mlle Clairon, car elle m'a\nparu admirable.»","L'abbé n'était pas homme à approcher de Mlle Clairon, qui ne voyait\nque bonne compagnie. «--Elle est engagée pour ce soir, dit-il:\nmais j'aurai l'honneur de vous mener chez une dame de qualité, et là\nvous connaîtrez Paris comme si vous y aviez été quatre ans.»","Candide, qui était naturellement curieux, se laissa mener chez la\ndame, au fond du faubourg Saint-Honoré; on y était occupé d'un pharaon;\ndouze tristes pontes tenaient chacun en main un petit livre de cartes,\nregistre cornu de leurs infortunes. Un profond silence régnait; la pâleur\nétait sur le front des pontes, l'inquiétude sur celui du banquier, et la\ndame du logis, assise auprès de ce banquier impitoyable, remarquait\navec des yeux de lynx tous les parolis, tous les sept-et-le-va de\ncampagne, dont chaque joueur cornait ses cartes; elle les faisait\ndécorner avec une attention sévère, mais polie; elle ne se fâchait\npoint, de peur de perdre ses pratiques. La dame se faisait appeler la\nmarquise de Parolignac. Sa fille, âgée de quinze ans, était au nombre\ndes pontes, et avertissait d'un clin d'œil des friponneries de ces\npauvres gens qui tâchaient de réparer les cruautés du sort. L'abbé\npérigourdin, Candide et Martin entrèrent; personne ne se leva, ni les\nsalua, ni les regarda; tous étaient profondément occupés de leurs\ncartes. «--Mme la baronne de Thunder-ten-tronckh était plus\ncivile, dit Candide.»","Cependant l'abbé s'approcha de l'oreille de la marquise, qui se leva\nà moitié, honora Candide d'un sourire gracieux et Martin d'un air de\ntête tout à fait noble; elle fit donner un siège et un jeu de cartes à\nCandide, qui perdit cinquante mille francs en deux tailles, après\nquoi on soupa très gaiement, et tout le monde était étonné que Candide\nne fût pas ému de sa perte; les laquais disaient entre eux, dans leur\nlangage de laquais: «--Il faut que ce soit quelque milord anglais.»","Le souper fut comme la plupart des soupers de Paris, d'abord du\nsilence, ensuite un bruit de paroles qu'on ne distingue point, puis des\nplaisanteries dont la plupart sont insipides, de fausses nouvelles, de\nmauvais raisonnements, un peu de politique et beaucoup de médisance;\non parla même de livres nouveaux. «--Avez-vous vu, dit l'abbé\npérigourdin, le roman du sieur Gauchat, docteur en théologie?--Oui,\nrépondit un des convives, mais je n'ai pu l'achever. Nous avons une foule\nd'écrits impertinents; mais tous ensemble n'approchent pas de\nl'impertinence de Gauchat, docteur en théologie; je suis si rassasié de\ncette immensité de détestables livres qui nous inondent, que je me suis\nmis à ponter au pharaon.--Et les _Mélanges_ de l'archidiacre\nTrublet, qu'en dites-vous? dit l'abbé.--Ah! dit Mme de Parolignac,\nl'ennuyeux mortel! comme il vous dit curieusement tout ce que le monde\nsait! comme il discute pesamment ce qui ne vaut pas la peine d'être\nremarqué légèrement! comme il s'approprie, sans esprit, l'esprit des\nautres! comme il gâte ce qu'il pille! comme il me dégoûte! mais il ne\nme dégoûtera plus, c'est assez d'avoir lu quelques pages de\nl'archidiacre.»","Il y avait à table un homme savant et de goût qui appuya ce que disait\nla marquise. On parla ensuite de tragédies; la dame demanda pourquoi\nil y avait des tragédies qu'on jouait quelquefois et qu'on ne pouvait\nlire. L'homme de goût expliqua très bien comment une pièce pouvait avoir\nquelque intérêt, et n'avoir presque aucun mérite: il prouva en peu de\nmots que ce n'était pas assez d'amener une ou deux de ces situations\nqu'on trouve dans tous les romans, et qui séduisent toujours les\nspectateurs, mais qu'il faut être neuf sans être bizarre, souvent\nsublime et toujours naturel, connaître le cœur humain et le faire\nparler; être grand poète, sans que jamais aucun personnage de la\npièce paraisse poète; savoir parfaitement sa langue, la parler avec\npureté, avec une harmonie continue, sans que jamais la rime coûté\nrien au sens. «--Quiconque, ajouta-t-il, n'observe pas toutes\nces règles peut faire une ou deux tragédies applaudies au théâtre,\nmais il ne sera jamais compté au rang des bons écrivains; il y a très\npeu de bonnes tragédies: les unes sont des idylles en dialogues bien\nécrits et bien rimes; les autres, des raisonnements politiques qui\nendorment ou des amplifications qui rebutent; les autres, des rêves\nd'énergumène, en style barbare, des propos interrompus, de longues\napostrophes aux dieux, parce qu'on ne sait point parler aux hommes,\ndes maximes fausses, des lieux communs ampoulés.»","Candide écouta ce propos avec attention et conçut une grande idée du\ndiscoureur, et comme la marquise avait eu soin de le placer à côté\nd'elle, il s'approcha de son oreille et prit la liberté de lui demander\nqui était cet homme qui parlait si bien. «--C'est un savant, dit\nla dame, qui ne ponte point, et que l'abbé m'amène quelquefois à souper;\nil se connaît parfaitement en tragédies et en livres, et il a fait une\ntragédie sifflée, et un livre dont on n'a jamais vu, hors de la boutique\nde son libraire, qu'un exemplaire qu'il m'a dédié.--Le grand\nhomme! dit Candide, c'est un autre Pangloss.»","Alors, se tournant vers lui, il lui dit: «--Monsieur, vous pensez\nsans doute que tout est au mieux dans le monde physique et dans le\nmoral, et que rien ne pourrait être autrement?--Moi, monsieur,\nlui répondit le savant, je ne pense rien de tout cela; je trouve que\ntout va de travers chez nous; que personne ne sait ni quel est son rang,\nni quelle est sa charge, ni ce qu'il fait, ni ce qu'il doit faire, et\nqu'excepté le souper, qui est assez gai, et où il parait assez d'union,\ntout le reste du temps se passe en querelles impertinentes: jansénistes\ncontre molinistes, gens du parlement contre gens d'église, gens de\nlettres contre gens de lettres, courtisans contre courtisans, financiers\ncontre le peuple, femmes contre maris, parents contre parents, c'est\nune guerre éternelle.»","[Illustration 53: LA JARRETIÈRE DE LA MARQUISE]","Candide lui répliqua: «--J'ai vu pis; mais un sage, qui depuis\na eu le malheur d'être pendu, m'apprit que tout cela est à merveille;\nce sont des ombres à un beau tableau.--Votre pendu se moquait du\nmonde, dit Martin; vos ombres sont des taches horribles.--Ce sont\nles hommes qui font les taches, dit Candide, et ils ne peuvent pas s'en\ndispenser.--Ce n'est donc pas leur faute, dit Martin.» La plupart\ndes pontes, qui n'entendaient rien à ce langage, buvaient, et Martin\nraisonna avec le savant, et Candide raconta une partie de ses aventures\nà la dame du logis.","Après souper, la marquise mena Candide dans son cabinet et le fit\nasseoir sur un canapé. «--Eh bien! lui dit-elle, vous aimez donc\néperdument Mlle Cunégonde de Thunder-ten-tronckh?--Oui, madame,\nrépondit Candide.» La marquise lui répliqua avec un souris tendre:\n«--Vous me répondez comme un jeune homme de Westphalie; un Français\nm'aurait dit: «Il est vrai que j'ai aimé Mlle Cunégonde; mais en vous\nvoyant, madame, je crains de ne la plus aimer.»--Hélas! madame,\ndit Candide, je répondrai comme vous voudrez.--Votre passion pour\nelle, dit la marquise, a commencé en ramassant son mouchoir; je veux que\nvous ramassiez ma jarretière.--De tout mon cœur, dit Candide. Et\nil la ramassa. --Mais je veux que vous me la remettiez, dit la\ndame. Et Candide la lui remit.--Voyez-vous, dit la dame, vous êtes\nétranger; je fais quelquefois languir mes amants de Paris quinze jours;\nmais je me rends à vous dès la première nuit, parce qu'il faut faire les\nhonneurs de son pays à un jeune homme de Westphalie.» La belle ayant\naperçu deux énormes diamants aux deux mains de son jeune étranger,\nles loua de si bonne foi, que des doigts de Candide ils passèrent aux\ndoigts de la marquise.","Candide, en s'en retournant avec son abbé périgourdin, sentit quelques\nremords d'avoir fait une infidélité à Mlle Cunégonde. M. l'abbé entra\ndans sa peine; il n'avait qu'une légère part aux cinquante mille livres\nperdues au jeu par Candide et à la valeur des deux brillants, moitié\ndonnés, moitié extorqués. Son dessein était de profiter, autant qu'il le\npourrait, des avantages que la connaissance de Candide pouvait lui\nprocurer. Il lui parla beaucoup de Cunégonde, et Candide lui dit qu'il\ndemanderait bien pardon à cette belle de son infidélité, quand il la\nverrait à Venise.","Le Périgourdin redoublait de politesses et d'attentions, et prenait\nun intérêt tendre à tout ce que Candide disait, à tout ce qu'il faisait,\nà tout ce qu'il voulait faire.","«--Vous avez donc, monsieur, lui dit-il, un rendez-vous à\nVenise?--Oui, monsieur l'abbé, dit Candide; il faut absolument\nque j'aille trouver Mlle Cunégonde.» Alors, engagé par le plaisir de\nparler de ce qu'il aimait, il conta, selon son usage, une partie de ses\naventures avec cette illustre Westphalienne.","«--Je crois, dit l'abbé, que Mlle Cunégonde a bien de l'esprit\net qu'elle écrit des lettres charmantes.--Je n'en ai jamais reçu,\ndit Candide, car figurez-vous qu'ayant été chassé du château pour\nl'amour d'elle, je ne pus lui écrire; que bientôt après j'appris qu'elle\nétait morte; qu'ensuite je la retrouvai et que je la perdis, et que je\nlui ai envoyé à deux mille cinq cents lieues d'ici un exprès dont\nj'attends la réponse.»","L'abbé écoutait attentivement et paraissait un peu rêveur. Il prit\nbientôt congé des deux étrangers, après les avoir tendrement embrassés.\nLe lendemain, Candide reçut à son réveil une lettre conçue en ces\ntermes:","«Monsieur mon très cher amant, il y a huit jours que je suis malade\nen cette ville; j'apprends que vous y êtes. Je volerais dans vos bras\nsi je pouvais remuer. J'ai su votre passage à Bordeaux; j'y ai laissé\nle fidèle Cacambo et la vieille, qui doivent bientôt me suivre. Le\ngouverneur de Buenos-Ayres a tout pris, mais il me reste votre cœur.\nVenez; votre présence me rendra la vie ou me fera mourir de\nplaisir.»","Cette lettre charmante, cette lettre inespérée, transporta Candide\nd'une joie inexprimable, et la maladie de sa chère Cunégonde l'accabla\nde douleur. Partagé entre ces deux sentiments, il prend son or et ses\ndiamants; il se fait conduire avec Martin à l'hôtel où Mlle Cunégonde\ndemeurait. Il entre en tremblant d'émotion; son cœur palpite, sa voix\nsanglote; il veut ouvrir les rideaux du lit; il veut faire apporter de\nla lumière.»--Gardez-vous-en bien, lui dit la suivante; la lumière\nla tue. Et soudain elle referme le rideau.--Ma chère Cunégonde,\ndit Candide en pleurant, comment vous portez-vous? Si vous ne pouvez\nme voir, parlez-moi du moins.--Elle ne peut parler, dit la\nsuivante.» La dame alors tire du lit une main potelée que Candide\narrose longtemps de ses larmes, et qu'il remplit ensuite de diamants,\nen laissant un sac plein d'or sur le fauteuil.","Au milieu de ses transports arrive un exempt suivi de l'abbé\npérigourdin et d'une escouade. «--Voilà donc, dit-il, ces deux\nétrangers suspects?» Il les fait incontinent saisir et ordonne à ses\nbraves de les traîner en prison. «--Ce n'est pas ainsi qu'on\ntraite les voyageurs dans l'Eldorado, dit Candide.--Je suis\nplus manichéen que jamais, dit Martin.--Mais, monsieur, où nous\nmenez-vous? dit Candide.--Dans un cul de basse-fosse, dit\nl'exempt.»","Martin, ayant repris son sang-froid, jugea que la dame qui se\nprétendait Cunégonde était une friponne, M. l'abbé périgourdin un\nfripon, qui avait abusé au plus vite de l'innocence de Candide, et\nl'exempt un autre fripon dont on pouvait aisément se débarrasser.","Plutôt que de s'exposer aux procédures de la justice, Candide,\néclairé par son conseil, et d'ailleurs toujours impatient de revoir la\nvéritable Cunégonde, propose à l'exempt trois petits diamants d'environ\ntrois mille pistoles chacun. «--Ah! monsieur, lui dit l'homme au\nbâton d'ivoire, eussiez-vous commis tous les crimes imaginables, vous\nêtes le plus honnête homme du monde; trois diamants! chacun de trois\nmille pistoles! Monsieur, je me ferais tuer pour vous, au lieu de vous\nmener dans un cachot. On arrête to
