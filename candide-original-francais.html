<script type="application/json" id="texte">[{"name":"Titre et préface (édition illustrée de 1893)","paragraphs":["Produced by Laura Natal Rodrigues at Free Literature (Images\ngenerously made available by Gallica, Bibliothèque nationale\nde France.)","CANDIDE OU L'OPTIMISME","VOLTAIRE","Préface de Francisque Sarcey","Illustrations de Adrien Moreau","Librairie Artistique--G. Boudet, Éditeur","197, BOULEVARD SAINT-GERMAIN, 197","1893","TABLE","PRÉFACE","I. COMMENT CANDIDE FUT ÉLEVÉ DANS UN BEAU CHÂTEAU, ET COMMENT IL FUT\nCHASSÉ D'CELUI.","II. CE QUE DEVINT CANDIDE PARMI LES BULGARES.","III. COMMENT CANDIDE SE SAUVA D'ENTRE LES BULGARES, ET CE QU'IL DEVINT.","IV. COMMENT CANDIDE RENCONTRA SON ANCIEN MAÎTRE DE PHILOSOPHIE,\nLE DOCTEUR PANGLOSS, ET CE QUI EN ADVINT.","V. TEMPÊTE, NAUFRAGE, TREMBLEMENT DE TERRE, ET CE QUI ADVINT DU DOCTEUR\nPANGLOSS, DE CANDIDE ET DE L'ANABAPTISTE JACQUES.","VI. COMMENT ON FIT UN BEL AUTO-DA-FÉ POUR EMPÊCHER LES TREMBLEMENTS\nDE TERRE, ET COMMENT CANDIDE FUT FESSÉ.","VII. COMMENT UNE VIEILLE PRIT SOIN DE CANDIDE, ET COMMENT\nIL RETROUVA CE QU'IL AIMAIT.","VIII. HISTOIRE DE CUNÉGONDE.","IX. CE QUI ADVINT DE CUNÉGONDE, DE CANDIDE, DU GRAND INQUISITEUR\nET D’UN JUIF.","X. DANS QUELLE DÉTRESSE CANDIDE, CUNÉGONDE ET LA VIEILLE ARRIVENT À\nCADIX, ET DE LEUR EMBARQUEMENT.","XI. HISTOIRE DE LA VIEILLE.","XII. SUITE DES MALHEURS DE LA VIEILLE.","XIII. COMMENT CANDIDE FUT OBLIGÉ DE SE SÉPARER DE LA BELLE CUNÉGONDE\nET DE LA VIEILLE.","XIV. COMMENT CANDIDE ET CACAMBO FURENT REÇUS CHEZ LES JÉSUITES\nDU PARAGUAY.","XV. COMMENT CANDIDE TUA LE FRÈRE DE SA CHÈRE CUNÉGONDE.","XVI. CE QUI ADVINT AUX DEUX VOYAGEURS AVEC DEUX FILLES, DEUX SINGES,\nET LES SAUVAGES NOMMÉS OREILLONS.","XVII. ARRIVÉE DE CANDIDE ET DE SON VALET AU PAYS D’ELDORADO,\nET CE QU’ILS Y VIRENT.","XVIII. CE QU’ILS VIRENT DANS LE PAYS D'ELDORADO.","XIX. CE QUI LEUR ARRIVA À SURINAM, ET COMMENT CANDIDE FIT CONNAISSANCE\nAVEC MARTIN.","XX. CE QUI ARRIVA SUR MER À CANDIDE ET À MARTIN","XXI. CANDIDE ET MARTIN APPROCHENT DES CÔTES DE FRANCE, ET RAISONNENT.","XXII. CE QUI ARRIVA EN FRANCE À CANDIDE ET À MARTIN.","XXIII. CANDIDE ET MARTIN VONT SUR LES CÔTES D'ANGLETERRE; CE QU’ILS Y\nVOIENT.","XXIV. DE PAQUETTE ET DE FRÈRE GIROFLÉE.","XXV. VISITE CHEZ LE SEIGNEUR POCOCURANTE, NOBLE VÉNITIEN.","XXVI. D’UN SOUPER QUE CANDIDE ET MARTIN FIRENT AVEC SIX ÉTRANGERS,\nET QUI ILS ÉTAIENT.","XXVII. VOYAGE DE CANDIDE À CONSTANTINOPLE.","XXVIII. CE QUI ARRIVA À CANDIDE, À CUNÉGONDE, À PANGLOSS, À MARTIN, ETC.","XXIX. COMMENT CANDIDE RETROUVA CUNÉGONDE\nET LA VIEILLE.","XXX. CONCLUSION.","TABLE DES EAUX-FORTES","PLATE\nI. CANDIDE EMBRASSE CUNÉGONDE\nII. LE TREMBLEMENT DE TERRE DE LISBONNE\nIII. CUNÉGONDE ET LE SOLDAT BULGARE\nIV. LA TOILETTE DE LA JEUNE PRINCESSE\nV. DÉCLARATION DU GOUVERNEUR DE BUENOS-AYRES À CUNÉGONDE\nVI. AU PAYS DES OREILLONS\nVII. UN DÎNER DANS L'ELDORADO\nVIII. LA JARRETIÈRE DE LA MARQUISE\nIX. PAQUETTE ET FRÈRE GIROFLÉE","[Illustration 01]","PRÉFACE","C'est une chose inimaginable de voir comme en littérature et en art\nla gloire se déplace d'un siècle à l'autre. Voici qu'un éditeur, qui\ncompte parmi ses publications quelques-uns des plus beaux livres de\nce temps, me demande si je veux lui écrire une préface au Candide qu'il\nrêve et dont il fait passer sous mes yeux les merveilleux dessins.\nJ'accepte, ravi d'attacher mon nom à une œuvre que les bibliophiles\ngarderont avec amour dans leur bibliothèque et qui transmettra mon nom\nà la postérité. Je me remets à lire _Candide_, bien que je l'aie su\npresque par cœur autrefois, tant j'en raffolais; car il n'y a rien de\ntel pour parler congrûment d'un ouvrage que de s'en être, la veille,\nrafraîchi la mémoire, d'en avoir emporté une sensation nouvelle; et je\ncherche en même temps ce qu'en ont pensé et dit les contemporains,\nceux qui aux environs de 1759 gouvernaient ou reflétaient l'opinion\npublique.","Je reste confondu. Pour nous _Candide_ est le chef-d'œuvre\nde Voltaire; nous ne savons encore ce que les siècles futurs garderont\ndes soixante-dix volumes qu'il a écrits. Nous pouvons être assurés\nque si tout cet énorme bagage doit tomber en ruines et périr, il y a un\npetit conte de trois cents pages qui traversera les âges: c'est\n_Candide._ Sur cette coquille de noix, le nom de Voltaire\nvoguera vers l'immortalité.","Eh bien! pour tout le XVIIIe siècle Candide, à vrai dire,\nne compte pas. On ne le distingue point d'une foule de productions qui\npassent pour être de second et même de troisième ordre dans l'œuvre\ndu maître; on le met fort au-dessous des livres d'histoire, des poèmes,\ndes tragédies... des tragédies surtout. Car en ce temps-là, _Mérope,\nZaïre, Mahomet_, c'étaient, comme on disait alors, les plus beaux\nfleurons de la couronne de Voltaire.","Pour vous former une idée du peu d'estime que l'on faisait des romans\nde Voltaire en général et de _Candide_ en particulier, nous n'avons\nqu'à lire l'éloge de Voltaire par La Harpe, celui qui fut couronné par\nl'Académie. La Harpe y verse avec une abondance intarissable les flots\nde son éloquence sur les ouvrages que l'on tenait alors pour les seuls\ndignes d'un grand écrivain, et s'arrêtant tout à coup:","«Y avait-il, se demande-t-il avec une hésitation pudique, y avait-il\nparmi tant de travaux des délassements et des loisirs? Oui, et c'était\nune foule de productions de tout genre, qui auraient encore été pour\ntout autre des travaux et des titres, mais qui n'étaient que les jeux de\nson inépuisable facilité et semblaient se perdre dans l'immensité de\nsa gloire: des contes charmants, des romans d'une originalité piquante,\noù la raison consent à amuser la frivolité française, pour obtenir\nle droit de l'instruire: nous fait rire de nos travers, de nos\ninconséquences, de nos injustices, et nous conduit par degrés à rougir\net à nous corriger; des morceaux pleins de grâce ou d'intérêt ou de\nbonne plaisanterie ou d'éloquence: _Zadig, Nanine, Candide_, le\n_Traité de la tolérance_: mille autres dont les titres innombrables\nn'ont été retenus que parce que les presses de l'Europe ne se sont pas\nlassées de les reproduire, ni les lecteurs de toutes les nations de les\ndévorer.»","Vous voyez! entre _Candide, Nanine_ et le _Traité de la\ntolérance_, l'estimable La Harpe ne faisait différence aucune; il\nmettait tous ces ouvrages dans le même sac et les plaçait bien\nau-dessous de _la Henriade_ que personne ne peut plus lire, et de\n_Mérope_ qu'on représente une fois tous les vingt ans à l'Odéon\ndevant un public qui bâille.","J'ai eu la curiosité d'aller chercher, dans la _Correspondance de\nGrimm_, ce qu'en avait écrit, au lendemain même de l'ouvrage publié,\nce maître critique:","«M. de Voltaire, dit Grimm, vient de nous égayer par un petit roman\nintitulé _Candide ou l'Optimisme_, traduit de l'allemand de M. le\ndocteur Ralph. Il ne faut pas juger cette production avec sévérité; elle\nne soutiendrait pas une critique sérieuse. Il n'y a dans _Candide_\nni plan, ni ordonnance, ni sagesse, ni de ces coups de pinceau heureux\nqu'on rencontre dans quelques romans anglais du même genre: vous y\ntrouverez en revanche beaucoup de choses de mauvais goût, d'autres de\nmauvais ton, des polissonneries et des ordures, qui n'ont point ce voile\nde gaze qui les rend supportables. Cependant la gaieté et la facilité qui\nn'abandonnent jamais M. de Voltaire, des traits et des saillies qui lui\néchappent à tout moment rendent la lecture de _Candide_ fort\namusante.»","Grimm poursuit longtemps sur ce ton; il donne du roman une analyse\nassez exacte et conclut en ces termes:","«Si jamais l'ordre et la chronologie des ouvrages de M. de Voltaire\nse perdent, la postérité ne manquera pas de regarder _Candide_\ncomme un ouvrage de jeunesse. Vraisemblablement, dira un critique\njudicieux dans deux mille ans d'ici, l'auteur n'avait que vingt-cinq ans\nlorsqu'il écrivit _Candide._ C'était son coup d'essai dans ce\ngenre. Son goût était jeune encore; aussi manque-t-il souvent\naux bienséances, et sa gaieté dégénère parfois en folie. Voyez,\najoutera-t-il, comme son goût s'est formé et rassis ensuite, par\ngradation: comme il est devenu plus sage dans les ouvrages postérieurs!»","Et voilà comme les contemporains se trompent! Voilà qui doit nous\ninspirer à nous, critiques et journalistes, une réserve pleine de\nmodestie! Grimm était un homme de beaucoup de sens, d'instruction\net de goût, et il n'a pas su démêler tout ce qu'il y avait de profondeur,\nde tristesse et d'amour ardent de l'humanité dans ce petit livre, qu'il\nconsidérait comme un opuscule échappé à la main facile et prodigue\nde Voltaire.","Jean-Jacques au XVIIIe siècle a pu dire, sans scandaliser\npersonne: «Je ne puis parler du roman de _Candide_, ne l'ayant pas\nlu». On a trouvé le mot naturel, et notez qu'il partait d'un homme\nprécisément engagé avec Voltaire dans la querelle philosophique\ndont la publication de _Candide_ fut un des incidents.\n_Candide_ était une réponse à Jean-Jacques, et Jean-Jacques\ndéclarait tout uniment ne l'avoir pas lu, tant il se croyait peu obligé\nà en tenir compte.","Et voilà que ce petit livre s'est lentement, par le travail insensible\nde tout un siècle, dégagé de l'œuvre immense du maître, qu'il semble\nle résumer tout entier, et qu'il reste seul debout au milieu d'un\namoncellement de ruines. Ce phénomène n'est pas rare dans l'histoire\ndes lettres. Que reste-t-il de Chateaubriand qui a tant écrit: un tout\npetit volume, _René_, où il a ramassé toute la mélancolie vague\net flottante du siècle naissant, où il a donné un accent plus âpre à\nl'incurable tristesse dont il était orgueilleusement rongé. Que\ndemeurera-t-il de Victor Hugo? Le tri n'est pas fait encore et nous ne\nsaurions en prévoir le résultat.","Parfois la postérité va chercher dans le fatras d'un écrivain de\nsecond ordre un ouvrage qu'il avait expédié avec la même hâte et la\nmême indifférence que le reste; elle met le volume à part et le\nconsacre chef-d'œuvre. L'abbé Prévost, qui a écrit au courant de la\nplume des centaines de volumes, serait bien étonné, s'il revenait au\nmonde, de voir un simple épisode d'un de ses romans des moins lus,\nmis au rang des plus beaux chefs-d'œuvre de l'esprit humain, et sa\n_Manon Lescaut_ balancer _Candide!_","Jean-Jacques, au livre neuvième de ses _Confessions_, nous\nconte, à sa manière, comment l'idée vint à Voltaire d'écrire\n_Candide._ Vous savez qu'après le tremblement de terre de\nLisbonne, Voltaire avait composé sur cette catastrophe un poème où,\npeignant les malheurs et le désespoir de toute cette population, il\nraillait les philosophes qui prétendaient, avec Leibniz, que tout est\npour le mieux dans le meilleur des mondes possible. Rousseau\navait lu ce poème:","«Frappé, nous dit-il, de voir ce pauvre homme, accablé, pour ainsi\ndire, de prospérités et de gloire, déclamer toutefois amèrement contre\nles misères de cette vie et trouver que tout était mal, je formai\nl'insensé projet de le faire rentrer en lui-même, et de lui prouver que\ntout était bien. Voltaire, en paraissant toujours croire en Dieu, n'a\nréellement jamais cru qu'au diable, puisque son Dieu prétendu n'est\nqu'un être malfaisant qui, selon lui, ne prend plaisir qu'à nuire.\nL'absurdité de cette doctrine, qui saute aux yeux, est surtout\nrévoltante dans un homme comblé de biens de toute espèce, qui,\ndu sein du bonheur, cherche à désespérer ses semblables par l'image\naffreuse et cruelle de toutes les calamités dont il est exempt.\nAutorisé plus que lui à compter et à peser les maux de la vie humaine,\nj'en lis l'équitable examen, et je lui prouvai que de tous ces maux il\nn'y en avait pas un dont la Providence ne fût disculpée, et qui n'eût\nsa source dans l'abus que l'homme a fait de ses facultés, plus que dans\nla nature elle-même. Je le traitai dans cette lettre avec tous les\négards, toute la considération, tout le ménagement, et je puis dire avec\ntout le respect possible. Cependant, lui connaissant un amour-propre\nextrêmement irritable, je ne lui envoyai pas cette lettre à lui-même,\nmais au docteur Tronchin, son médecin et son ami, avec plein pouvoir\nde la donner ou supprimer, selon qu'il le trouverait le plus convenable.\nTronchin donna la lettre. Voltaire me répondit, en peu de lignes,\nqu'étant malade et garde-malade lui-même, il remettait à un autre temps\nsa réponse, et ne dit pas un mot sur la question. Tronchin, en m'envoyant\ncette lettre, en joignit une, où il marquait peu d'estime pour celui\nqui la lui avait remise.","«Je n'ai jamais publié ni même montré ces deux lettres, n'aimant pas\nà faire parade de ces sortes de petits triomphes; mais elles sont en\noriginaux dans mes recueils. Depuis lors, Voltaire a publié cette\nréponse qu'il m'avait promise. Elle n'est autre que le roman de\n_Candide_, dont je ne puis parler, parce que je ne l'ai pas lu.»","Je crains qu'ici Jean-Jacques, dont une extrême modestie n'était pas\nle défaut, ne s'en fasse accroire. Sa lettre à Voltaire, qui est connue\nsous le nom de _Lettre sur la Providence_, est du 18 août 1756;\nVoltaire y répondit par une lettre de pure courtoisie le 21 septembre.\nIl n'écrivit _Candide_ que vingt-neuf mois plus tard. Il est fort\nprobable qu'il ne songeait plus guère alors ni à Jean-Jacques ni à sa\nlettre.","C'est la doctrine de l'optimisme à qui il en avait. Leibniz l'avait\nmise à la mode. Tous ceux qui ont fait leur philosophie, à l'époque où\nrenseignement de la philosophie était encore en honneur dans les\nlycées, connaissent le passage où Leibniz nous montre Sextus Tarquin\nconsultant l'oracle de Delphes sur sa destinée. Il apprend le\nsort qui l'attend:","/#\nExsul inopsque cades irata pulsus ab urbe.\n#/","Il se plaint de la destinée, et il semble que ce soit avec raison;\nmais l'oracle lui fait voir que de sa condamnation à l'exil et à la\nmisère sortira la république romaine, puis la fondation d'un grand\nempire. Un moindre mal aura donc été la condition d'un plus grand bien.","Leibniz ne soutenait donc point que tout fût parfait dans le monde.\nNon, disait-il, tout n'est pas bien; mais tout est pour le mieux dans le\nmeilleur des mondes possible. Dieu n'a pas voulu le mal; mais il l'a\npermis parce que la raison l'y obligeait, et permettre le mal comme\nDieu le permet, c'est la plus grande bonté.","Cette théorie prêtait aisément aux réfutations ironiques et\nplaisantes. La belle avance pour Sextus Tarquin, qu'après l'avoir chassé\net réduit à mendier son pain, Rome fût devenue quelques siècles après\nla maîtresse du monde! En avait-il été moins misérable? En avait-il\nmoins souffert? Il était parbleu! bien évident que de tout accident\nsurvenu à une créature il pouvait jaillir pour telle ou telle autre une\nsource de plaisir et de joie; mais, si l'on poussait l'idée à ses plus\nextrêmes conséquences, on arriverait à dire que plus les hommes sont\nmalheureux, plus l'humanité est heureuse, et que le bonheur vénérai\nse compose de la somme des malheurs particuliers.","Voltaire n'avait pas besoin d'être provoqué par Jean-Jacques pour\ns'échauder contre cette philosophie, qui lui paraissait choquer le bon\nsens. Il l'a combattue partout; il l'a poursuivie de ses railleries et\nde ses sarcasmes: c'est dans _Candide_ qu'il a donné contre elle\ndu meilleur de son cœur.","Qu'est-ce qu'un roman de Voltaire? se demande M. Émile Faguet, dans\nune étude qui est toujours spirituelle et piquante, si elle n'est pas\njuste toujours. «C'est, répond-il, une idée de Voltaire se promenant à\ntravers des aventures divertissantes, destinées à lui servir\nd'illustrations et de preuves. C'est un article du _Dictionnaire\nphilosophique_, conté au lieu d'être déduit par Voltaire, et c'est\npour cela qu'il est exquis; c'est Voltaire lui-même, mais moins âpre et\nmoins colérique, au moins dans la forme, qui s'arrange et s'attife, et\nse compose une physionomie et un sourire, et glisse ses épigrammes,\nau lieu d'assener ses violences, avec un joli geste, adroitement\nnonchalant, de la main. Quand on ferme un de ces petits livres, on n'a\nvécu ni avec Zadig, ni avec Candide; mais avec Voltaire, dans une\ndemi-intimité très piquante, qui a quelque chose d'accueillant, de\ngracieux et d'inquiétant...»","Oui, sans doute, il y a cela dans les contes de Voltaire: mais s'il\nn'y avait que cela dans _Candide_, il est bien probable que\nl'éditeur de ce volume n'aurait pas prié un des premiers artistes de ce\ntemps, M. Ad. Moreau, de composer les dessins qui l'illustrent, et que\nje ne serais pas occupé en ce moment à écrire cette préface.","Voulez-vous que je vous dise tout de suite ce qui fait la grandeur\nde _Candide_ et qui le constitue un chef-d'œuvre à part, un immortel\nchef-d'œuvre? c'est que jamais dans aucun autre ouvrage n'ont brûlé\nd'une flamme plus ramassée, plus intense et plus vive les deux passions\nqui ont été l'honneur de Voltaire, la haine de l'injustice triomphante,\net la pitié, une pitié large et généreuse, pour les souffrances\nimméritées. Vous n'avez pas oublié cette fièvre, dont parle Voltaire,\net qu'il appelle la fièvre de la Saint-Barthélemy. Il prétendait qu'à\ncette date fatale, son sang, comme disent les bonnes gens, ne faisait\nqu'un tour; il le sentait bouillir en ses veines, il était obligé de se\nmettre au lit; il était malade des atrocités commises, deux siècles\nauparavant, par un fanatisme imbécile. Ne croyez point que cette fièvre\nannuelle ait été chez Voltaire une figure de rhétorique ou, ce qui\nserait pis encore, une pose d'homme sensible. Non, il était tourmenté\ndu besoin de la justice; les maux et les misères des hommes le jetaient\nhors de lui-même; il fallait évidemment qu'on le prît, pour lui en\nparler, en un de ses bons moments; car il avait de vilains quarts\nd'heure d'égoïsme, et j'avoue qu'il n'était chevaleresque que par\noccasion.","Mais il haïssait d'une haine vivace et profonde l'hypocrisie, le\nfanatisme, l'oppression bête, l'iniquité superbe, la sottise importante,\ntout ce qui dans notre état social s'ajoute à la cruelle et injuste\nnature pour aigrir l'humaine misère, pour rendre la vie insupportable\naux pauvres et tristes mortels.","C'est cette flamme qui anime toutes les pages de _Candide._\nVoltaire y ramasse, comme à plaisir, tous les maux les plus horribles\ndont peut souffrir l'homme sur cette terre, qui est bien pour lui une\nvallée de désespoir et de larmes. Il entasse les pestes sur les\nnaufrages, les famines sur les massacres; on n'entend dans cet ouvrage\nque les cris des gens que l'on torture, des hurlements de désespoir ou\ndes bâillements d'ennui; la lecture en serait horrible et dégoûtante,\nle livre tomberait assurément des mains, si l'on ne sentait circuler\nà travers toutes ces peintures une âme généreuse, qui s'irrite et qui\ns'apitoie tout ensemble, dont la fureur et le chagrin s'exhalent en\nironie; une ironie tantôt mordante, tantôt douloureuse, toujours\nenflammée.","Oh! ces rois, les puissants de la terre, que de mal ils ont fait!\ncomme ils ont pressuré leurs peuples! comme ils en ont tiré du sang,\ndes larmes et de l'or! Oui, mais quelle revanche, quand le poète\n(Voltaire en ce moment est poète et grand poète) vous en montre six\nattablés dans cet hôtel de Venise, se contant leur déchéance et leurs\ninfortunes! Comme l'ironie court sur ce récit divin avec une légèreté\nmerveilleuse!","Mais voici Paquette que rencontre Candide faisant des agaceries au\nfrère Giroflée et lui tapotant les joues. On a, surtout dans ces\ndernières années, versé bien des larmes sur le misérable sort de la\ncourtisane, on a en cent façons tâché de nous apitoyer sur l'horreur de\ncette affreuse vie. Jamais, non jamais on n'égalera la peinture que\nVoltaire a faite eu quelques coups de crayon:","«Ah! monsieur, si vous pouviez imaginer ce que c'est de caresser\nindifféremment un vieux marchand, un moine, un avocat, un gondolier,\nun abbé; d'être exposée à toutes les insultes, à toutes les avanies;\nd'être souvent réduite à emprunter une jupe pour aller se la faire lever\npar un homme dégoûtant; d'être volée par l'un de ce qu'on a gagné avec\nl'autre; d'être rançonnée par les officiers de justice, et de n'avoir\nen perspective qu'une vieillesse affreuse, un hôpital et un fumier,\nvous concluriez que je suis une des plus malheureuses créatures du\nmonde....»","Tout y est! En ces dix lignes. Voltaire a rassemblé toutes les\ndouleurs et toutes les affres de ces créatures; le tableau est admirable\nde vérité et de force! Mais n'y sentez-vous pas l'apitoiement et la\nsympathie du peintre? Ici l'ironie devient lugubre et en quelque sorte\nvengeresse. Voltaire crie d'horreur contre la société qui jette\nquelques-unes de ses créatures en de tels abîmes. Il a sa fièvre de la\nSaint-Barthélemy; on en tremble avec lui par contagion.","Écoutez le seigneur Pococurante: quel ennui dense et noir se\ndégage de sa conversation! Être si riche, avoir tant de goût et un\ngoût si délicat, et ne faire de sa vie qu'un long bâillement, quelle\nmisère! Et ici l'ironie se fait cinglante.","«Vous conviendrez, dit Candide eu parlant à son ami Martin de ce\nblasé qui trouve à redire à tout, que voilà le plus heureux des hommes;\ncar il est au-dessus de tout ce qu'il possède.","--Eh! non, répond Martin, il est dégoûté de tout ce qu'il\npossède.","--Mais, reprend Candide, n'y a-t-il pas du plaisir à tout\ncritiquer, à sentir des défauts où les autres hommes croient voir des\nbeautés?","--C'est-à-dire, riposte Martin, qu'il y a du plaisir à n'avoir\npas de plaisir.»","Et c'est ainsi que derrière cette longue, terrible et pathétique\nénumération des maux qui affligent l'humanité, on sent toujours\nVoltaire, brûlé de passion, ou, si vous aimez mieux, de fièvre; la\nfièvre de la Saint-Barthélemy.","Candide serait un chef-d'œuvre incomplet si le philosophe, après\navoir ainsi étalé nos misères à nos yeux, ne nous ranimait pas par une\nconclusion réconfortante. Cette conclusion, tout le monde la connaît:\nil faut cultiver son jardin. Oui, sans doute, il n'y a qu'une chose\nvraiment bonne sur celle terre: c'est l'action. On n'est heureux que si\nl'on travaille, si l'on fait ce que l'on a à faire, si l'on cultive son\njardin.","Cultivons notre jardin! C'est le mot de ce siècle de rêveurs et de\npessimistes; c'est le mot de tous les siècles. Et c'est parce que\nVoltaire l'a formulé dans _Candide_, que _Candide_ les\ntraversera tous.","Ce chef-d'œuvre n'a-t-il point quelques tares? Je crois que\nVoltaire aurait pu retrancher aisément quelques polissonneries et\nquelques gros mots inutiles, qui rendent la lecture de son roman\npresque impossible aux femmes; Mme du Deffant lui eu avait déjà\nfait l'observation au siècle dernier; à plus forte raison, ce défaut\nchoquera-t-il plus sensiblement les femmes du nôtre. Je crois aussi\nqu'il y a des longueurs dans la partie du récit qui concerne l'EIdorado.\nMais ce sont là des taches fort légères, et j'ai quelque pudeur à les\nsignaler.","Je ne pense pas qu'il faille, selon le mot de Victor Hugo, admirer\ntout comme une brute. Mais c'est une vérité depuis longtemps admise\nque dans les ouvrages passés chefs-d'œuvre et consacrés, les défauts,\ns'il s'en trouve, ne comptent pas, et l'on répète les vers d'Horace:","/#\nNon ego paucis\nOffendar maculis....\n#/","Décidément Jean-Jacques a eu tort de ne pas lire _Candide._\nPeut-être après cela l'avait-il lu, et que c'est pour cette raison même\nqu'il préférait n'en point parler, le silence étant d'or en ces\nsortes d'affaires.","FRANCISQUE SARCEY","[Illustration 02]","[Illustration 03]"]},{"name":"Chapitre 1","paragraphs":["COMMENT CANDIDE FUT ÉLEVÉ DANS UN BEAU CHÂTEAU, ET COMMENT IL FUT CHASSÉ D'CELUI.","Il y avait in Westphalie, dans le château de M. le baron de\nThunder-ten-tronckh, un jeune garçon à qui la nature avait donné les\nmœurs les plus douces. Sa physionomie annonçait son âme. Il avait le\njugement assez droit, avec l'esprit le plus simple; c'est, je crois,\npour cette raison qu'on le nommait Candide. Les anciens domestiques de\nla maison soupçonnaient qu'il était fils de la sœur de M. le baron, et\nd'un bon et honnête gentilhomme du voisinage, que cette demoiselle ne\nvoulut jamais épouser, parce qu'il n'avait pu prouver que soixante et\nonze quartiers, et que le reste de son arbre généalogique avait été\nperdu par l'injure du temps.","M. le baron était un des plus puissants seigneurs de la Westphalie,\ncar son château avait une porte et des fenêtres. Sa grande salle même\nétait ornée d'une tapisserie. Tous les chiens de ses basses-cours\ncomposaient une meute dans le besoin; ses palefreniers étaient ses\npiqueurs; le vicaire du village était son grand aumônier. Ils\nl'appelaient tous Monseigneur, et ils riaient quand il faisait des\ncontes.","Mme la baronne, qui pesait environ trois cent cinquante livres,\ns'attirait par là une très grande considération, et faisait les honneurs\nde la maison avec une dignité qui la rendait encore plus respectable.\nSa fille Cunégonde, âgée de dix-sept ans, était haute en couleur,\nfraîche, grasse, appétissante. Le fils du baron paraissait en tout digne\nde son père. Le précepteur Pangloss était l'oracle de la maison, et le\npetit Candide écoutait ses leçons avec toute la bonne foi de son âge et\nde son caractère.","Pangloss enseignait la métaphysico-théologo-cosmolonigologie. Il\nprouvait admirablement qu'il n'y a point d'effet sans cause, et que,\ndans ce meilleur des mondes possible le château de Monseigneur le\nbaron était le plus beau des châteaux, et Madame la meilleure des\nbaronnes possible.","«Il est démontré, disait-il, que les choses ne peuvent être\nautrement, car tout étant fait pour une fin, tout est nécessairement\npour la meilleure fin. Remarquez bien que les nez ont été faits pour\nporter des lunettes, aussi avons-nous des lunettes. Les jambes sont\nvisiblement instituées pour être chaussées, et nous avons des chausses.\nLes pierres ont été formées pour être taillées et pour en faire des\nchâteaux, aussi Monseigneur a un très beau château; le plus grand baron\nde la province doit être le mieux logé; et les cochons étant faits pour\nêtre mangés, nous mangeons du porc toute l'année: par conséquent,\nceux qui ont avancé que tout est bien ont dit une sottise; il fallait\ndire que tout est au mieux.»","[Illustration 04:CANDIDE EMBRASSE CUNÉGONDE]","Candide écoutait attentivement, et croyait innocemment, car il\ntrouvait Mlle Cunégonde extrêmement belle, quoiqu'il ne prit jamais la\nhardiesse de le lui dire. Il concluait qu'après le bonheur d'être né\nbaron de Thunder-ten-tronckh, le second degré de bonheur était d'être\nMlle Cunégonde, le troisième, de la voir tous les jours, et le\nquatrième, d'entendre maître Pangloss, le plus grand philosophe de la\nprovince, et par conséquent de toute la terre.","Un jour Cunégonde en se promenant auprès du château, dans le petit\nbois qu'on appelait parc, vit entre des broussailles le docteur Pangloss\nqui donnait une leçon de physique expérimentale à la femme de chambre\nde sa mère, petite brune très jolie et très docile. Comme Mlle Cunégonde\navait beaucoup de dispositions pour les sciences, elle observa, sans\nsouffler, les expériences réitérées dont elle fut témoin; elle vit\nclairement la raison suffisante du docteur, les effets et les causes,\net s'en retourna tout agitée, toute pensive, toute remplie du désir\nd'être savante, songeant qu'elle pourrait bien être la raison suffisante\ndu jeune Candide, qui pouvait aussi être la sienne.","Elle rencontra Candide en revenant au château, et rougit: Candide\nrougit aussi. Elle lui dit bonjour d'une voix entrecoupée, et Candide\nlui parla sans savoir ce qu'il disait. Le lendemain, après le dîner,\ncomme on sortait de table, Cunégonde et Candide se trouvèrent derrière\nun paravent; Cunégonde laissa tomber son mouchoir, Candide le ramassa,\nelle lui prit innocemment la main, le jeune homme baisa innocemment\nla main de la jeune demoiselle avec une vivacité, une sensibilité,\nune grâce toute particulière; leurs bouches se rencontrèrent, leurs yeux\ns'enflammèrent, leurs genoux tremblèrent, leurs mains s'égarèrent. M. le\nbaron de Thunder-ten-tronckh passa auprès du paravent, et voyant cette\ncause et cet effet, chassa Candide du château à grands coups de pied\ndans le derrière; Cunégonde s'évanouit; elle fut souffletée par Mme la\nbaronne dès qu'elle fut revenue à elle-même; et tout fut consterné dans\nle plus beau et le plus agréable des châteaux possible.","[Illustration 05]","[Illustration 06]"]},{"name":"Chapitre 2","paragraphs":["CE QUE DEVINT CANDIDE PARMI LES BULGARES.","Candide, chassé du paradis terrestre, marcha longtemps sans\nsavoir où, pleurant, levant les yeux au ciel, les tournant souvent\nvers le plus beau des châteaux qui renfermait la plus belle des\nbaronnettes; il se coucha sans souper au milieu des champs, entre\ndeux sillons; la neige tombait à gros flocons. Candide, tout transi,\nse traîna le lendemain vers la ville voisine, qui s'appelle\n_Waldberghoff-trarbk-dikdorff._ N'ayant point d'argent, mourant\nde faim et de lassitude, il s'arrêta tristement à la porte d'un cabaret.\nDeux hommes habillés de bleu le remarquèrent: «--Camarade, dit\nl'un, voilà un jeune homme très bien lait, et qui a la taille requise.»\nIls s'avancèrent vers Candide, et le prièrent à dîner très civilement.\n«--Messieurs, leur dit Candide avec une modestie charmante, vous\nme faites beaucoup d'honneur, mais je n'ai pas de quoi payer mon\nécot.--Ah monsieur! lui dit un des bleus, les personnes de votre\nfigure et de votre mérite ne paient jamais rien: n'avez-vous pas cinq\npieds cinq pouces de haut?--Oui, messieurs, c'est ma taille,\ndit-il en faisant la révérence.--Ah monsieur! mettez-vous à table;\nnon seulement nous vous défraierons, mais nous ne souffrirons jamais\nqu'un homme comme vous manque d'argent; les hommes ne sont faits que\npour se secourir les uns les autres.--Vous avez raison, dit\nCandide; c'est ce que M. Pangloss m'a toujours dit, et je vois bien\nque tout est au mieux.» On le prie d'accepter quelques écus; il les\nprend et veut faire son billet; on n'en veut point; on se met à table.\n«--N'aimez-vous pas tendrement?... --Oh oui! répondit-il;\nj'aime tendrement Mlle Cunégonde.--Non, dit l'un de ces messieurs,\nnous vous demandons si vous n'aimez pas tendrement le roi des\nBulgares?--Point du tout, dit-il, car je ne l'ai jamais\nvu.--Comment! c'est le plus charmant des rois, et il faut boire à\nsa santé.--Oh! très volontiers, messieurs; et il boit.--C'en\nest assez, lui dit-on: vous voilà l'appui, le soutien, le défenseur, le\nhéros des Bulgares; votre fortune est faite, et votre gloire est\nassurée.» On lui met sur-le-champ les fers aux pieds, et on le mène au\nrégiment. On le fait tourner à droite, à gauche, hausser la baguette,\nremettre la baguette, coucher en joue, tirer, doubler le pas, et on lui\ndonne trente coups de bâton; le lendemain, il fait l'exercice un peu\nmoins mal, et il ne reçoit que vingt coups; le surlendemain, on ne lui\nen donne que dix, et il est regardé par ses camarades comme un prodige.","Candide, tout stupéfait, ne démêlait pas encore trop bien comment\nil était un héros. Il s'avisa un beau jour de printemps de s'aller\npromener, marchant tout droit devant lui, croyant que c'était un\nprivilège de l'espèce humaine, comme de l'espèce animale, de se\nservir de ses jambes à son plaisir. Il n'eut pas fait deux lieues\nque voilà quatre autres héros de six pieds qui l'atteignent, qui le\nlient, qui le mènent dans un cachot. On lui demanda juridiquement ce\nqu'il aimait le mieux d'être fustigé trente-six fois par tout le régiment,\nou de recevoir à la fois douze balles de plomb dans la cervelle. Il eut\nbeau dire que les volontés sont libres, et qu'il ne voulait ni l'un ni\nl'autre: il fallut faire un choix; il se détermina, en vertu du don de\nDieu qu'on nomme _liberté_, à passer trente-six fois par les\nbaguettes; il essuya deux promenades. Le régiment était composé de\ndeux mille hommes; cela lui composa quatre mille coups de baguettes,\nqui, depuis la nuque du cou jusqu'au cul, lui découvrirent les muscles\net les nerfs. Comme on allait procéder à la troisième course, Candide,\nn'en pouvant plus, demanda en grâce qu'on voulut bien avoir la bonté\nde lui casser la tête; il obtint cette faveur; on lui bande les yeux,\non le fait mettre à genoux. Le roi des Bulgares passe dans ce moment,\nil s'informe du crime du patient; et comme ce roi avait un grand génie,\nil comprit, par tout ce qu'il apprit de Candide, que c'était un jeune\nmétaphysicien fort ignorant des choses de ce monde, et il lui accorda\nsa grâce avec une clémence qui sera louée dans tous les journaux\net dans tous les siècles. Un brave chirurgien guérit Candide en trois\nsemaines avec les émollients enseignés par Dioscoride. Il avait déjà un\npeu de peau, et pouvait marcher, quand le roi des Bulgares livra\nbataille au roi des Abares.","[Illustration 07]","[Illustration 08]"]},{"name":"Chapitre 3","paragraphs":["COMMENT CANDIDE SE SAUVA D'ENTRE LES BULGARES, ET CE QU'IL DEVINT.","Rien n'était si beau, si leste, si brillant, si bien ordonné que les\ndeux armées. Les trompettes, les fifres, les hautbois, les tambours,\nles canons, formaient une harmonie telle qu'il n'y en eut jamais en\nenfer. Les canons renversèrent d'abord à peu prés six mille hommes\nde chaque côté; ensuite la mousqueterie ôta du meilleur des mondes\nenviron neuf à dix mille coquins qui en infectaient la surface. La\nbaïonnette fut aussi la raison suffisante de la mort de quelques\nmilliers d'hommes. Le tout pouvait bien se monter à une trentaine de\nmille âmes. Candide, qui tremblai! comme un philosophe, se cacha du\nmieux qu'il put pendant cette boucherie héroïque. Enfin, tandis que les\ndeux rois faisaient chanter des _Te Deum_, chacun dans son camp,\nil prit le parti d'aller raisonner ailleurs des effets et des causes. Il\npassa par-dessus des tas de morts et de mourants, et gagna d'abord un\nvillage voisin; il était en cendres: c'était un village arabe que les\nBulgares avaient brûlé, selon les lois du droit public. Ici les\nvieillards criblés de coups regardaient mourir leurs femmes égorgées,\nqui tenaient leurs enfants à leurs mamelles sanglantes; là des filles\néventrées, après avoir assouvi les besoins naturels de quelques héros,\nrendaient les derniers soupirs; d'autres à demi brûlées criaient qu'on\nachevât de leur donner la mort. Des cervelles étaient répandues sur la\nterre à côté de bras et de jambes coupés.","Candide s'enfuit au plus vite dans un autre village: il appartenait\nà des Bulgares, et les héros abares l'avaient traité de même. Candide,\ntoujours marchant sur des membres palpitants, ou à travers des ruines,\narriva enfin hors du théâtre de la guerre, portant quelques petites\nprovisions dans son bissac, et n'oubliant jamais Mlle Cunégonde. Ses\nprovisions lui manquèrent quand il fut en Hollande; mais ayant entendu\ndire que tout le monde était riche dans ce pays-là, et qu'on y était\nchrétien, il ne douta pas qu'on ne le traitât aussi bien qu'il l'avait\nété dans le château de M. le baron, avant qu'il en eût été chassé pour\nles beaux yeux de Mlle Cunégonde.","Il demanda l'aumône à plusieurs graves personnages, qui lui\nrépondirent tous que, s'il continuait à faire ce métier, on l'enfermerait\ndans une maison de correction pour lui apprendre à vivre.","Il s'adressa ensuite à un homme qui venait de parler tout seul une\nheure de suite sur la charité dans une grande assemblée. Cet orateur\nle regardant de travers lui dit: «--Que venez-vous faire ici? Y\nêtes-vous pour la bonne cause?--Il n'y a point d'effet sans cause,\nrépondit modestement Candide; tout est enchaîné nécessairement, et\narrangé pour le mieux. Il a fallu que je fusse chassé d'auprès de Mlle\nCunégonde, que j'aie passé par les baguettes, et il faut que je demande\nmon pain, jusqu'à ce que je puisse en gagner; tout cela ne pouvait\nêtre autrement.--Mon ami, dit l'orateur, croyez-vous que le pape\nsoit l'antéchrist?--Je ne l'avais pas encore entendu dire, répondit\nCandide; mais qu'il le soit ou qu'il ne le soit pas, je manque de\npain.--Tu ne mérites pas d'en manger, dit l'autre: va, coquin,\nva, misérable, ne m'approche de ta vie.» La femme de l'orateur avant\nmis la tête à la fenêtre, et avisant un homme qui doutait que le pape\nfût l'antéchrist, lui répandit sur le chef un plein.... Ô ciel! à quel\nexcès se porte le zèle de la religion dans les dames!","Un homme qui n'avait point été baptisé, un bon anabaptiste, nommé\nJacques, vit la manière cruelle et ignominieuse dont on traitait ainsi\nun de ses frères, un être à deux pieds, sans plumes, qui avait une âme;\nil l'amena chez lui, le nettoya, lui donna du pain et de la bière, lui\nfit présent de deux florins et voulut même lui apprendre à travailler\ndans ses manufactures aux étoffes de Perse qu'on fabrique en Hollande.\nCandide, se prosternant presque devant lui, s'écriait: «--Maître\nPangloss l'avait bien dit que tout était au mieux dans ce monde, car je\nsuis infiniment plus touché de votre extrême générosité que de la\ndureté de ce monsieur à manteau noir, et de madame son épouse.»","Le lendemain, en se promenant, il rencontra un gueux tout couvert\nde pustules, les yeux morts, le bout du nez rongé, la bouche de travers,\nles dents noires, et parlant de la gorge, tourmenté d'une toux violente,\net crachant une dent à chaque effort.","[Illustration 09]","[Illustration 10]"]},{"name":"Chapitre 4","paragraphs":["COMMENT CANDIDE RENCONTRA SON ANCIEN MAÎTRE DE PHILOSOPHIE,\nLE DOCTEUR PANGLOSS, ET CE QUI EN ADVINT.","Candide, plus ému encore de compassion que d'horreur, donna à cet\népouvantable gueux les deux florins qu'il avait reçus de son honnête\nanabaptiste Jacques. Le fantôme le regarda fixement, versa des larmes,\net sauta à son cou. Candide effrayé recule. «--Hélas! dit le\nmisérable à l'autre misérable, ne reconnaissez-vous plus votre cher\nPangloss?--Qu'entends-je? vous, mon cher maître! vous, dans cet\nétat horrible! Quel malheur vous est-il donc arrivé? Pourquoi\nn'êtes-vous plus dans le plus beau des châteaux? Qu'est devenue Mlle\nCunégonde, la perle des filles, le chef-d'œuvre de la nature? Je n'en\npeux plus, dit Pangloss.» Aussitôt Candide le mena dans l'étable de\nl'anabaptiste, où il lui fit manger un peu de pain; et quand Pangloss\nfut refait: «--Eh bien! lui dit-il, Cunégonde?--Elle est\nmorte, reprit l'autre.» Candide s'évanouit à ce mot: son ami rappela\nses sens avec un peu de mauvais vinaigre qui se trouva par hasard dans\nl'étable. Candide rouvre les yeux. «--Cunégonde est morte! Ah!\nmeilleur des mondes, où êtes-vous? Mais de quelle maladie est-elle\nmorte? Ne serait-ce point de m'avoir vu chasser du beau château de\nmonsieur son père à grands coups de pied?--Non, dit Pangloss,\nelle a été éventrée par des soldats bulgares, après avoir été violée\nautant qu'on peut l'être; ils ont cassé la tête à M. le baron qui\nvoulait la défendre; Mme la baronne a été coupée en morceaux; mon\npauvre pupille traité précisément comme sa sœur; et quant au château,\nil n'est pas resté pierre sur pierre, pas une grange, pas un mouton,\npas un canard, pas un arbre; mais nous avons été bien vengés, car les\nAbares en ont fait autant dans une baronnie voisine qui appartenait\nà un seigneur bulgare.»","À ce discours, Candide s'évanouit encore; mais revenu à soi, et ayant\ndit tout ce qu'il devait dire, il s'enquit de la cause et de l'effet, et\nde la raison suffisante qui avait mis Pangloss dans un si piteux état.\n«--Hélas! dit l'autre, c'est l'amour: l'amour, le consolateur du\ngenre humain, le conservateur de l'univers, l'âme de tous les êtres\nsensibles, le tendre amour.--Hélas! dit Candide, je l'ai connu\ncet amour, ce souverain des cœurs, cette âme de notre âme; il ne m'a\njamais valu qu'un baiser et vingt coups de pied au cul. Comment cette\nbelle cause a-t-elle pu produire en vous un effet si abominable?»","Pangloss répondit en ces termes: «--Ô mon cher Candide! vous\navez connu Paquette, cette jolie suivante de notre auguste baronne;\nj'ai goûté dans ses bras les délices du paradis, qui ont produit ces\ntourments d'enfer dont vous me voyez dévoré; elle en était infectée;\nelle en est peut-être morte. Paquette tenait ce présent d'un cordelier\ntrès savant qui avait remonté à la source; car il l'avait eue d'une\nvieille comtesse, qui l'avait reçue d'un capitaine de cavalerie, qui la\ndevait à une marquise, qui la tenait d'un page, qui l'avait reçue d'un\njésuite, qui, étant novice, l'avait eue en droite ligne d'un des\ncompagnons de Christophe Colomb. Pour moi, je ne la donnerai à\npersonne, car je me meurs.","--Ô Pangioss, s'écria Candide, voila une étrange généalogie!\nN'est-ce pas le diable qui en fut la souche?--Point du tout,\nrépliqua ce grand homme; c'était une chose indispensable dans le\nmeilleur des mondes, un ingrédient nécessaire; car si Colomb n'avait\npas attrapé, dans une île de l'Amérique, cette maladie qui empoisonne\nla source de la génération, qui souvent même empêche la génération,\net qui est évidemment l'opposé du grand but de la nature, nous n'aurions\nni le chocolat ni la cochenille; il faut encore observer que\njusqu'aujourd'hui, dans notre continent, cette maladie nous est\nparticulière, comme la controverse. Les Turcs, les Indiens, les Persans,\nles Chinois, les Siamois, les Japonais ne la connaissent pas encore;\nmais il y a une raison suffisante pour qu'ils la connaissent à leur tour\ndans quelques siècles. En attendant, elle a fait un merveilleux progrès\nparmi nous, et surtout dans ces grandes armées composées d'honnêtes\nstipendiaires bien élevés, qui décident du destin des États; on peut\nassurer que, quand trente mille hommes combattent en bataille rangée\ncontre des troupes égales en nombre, il y a environ vingt mille vérolés\nde chaque côté.","--Voilà qui est admirable, dit Candide; mais il faut vous faire\nguérir.--Eh comment le puis-je? dit Pangloss; je n'ai pas le sou,\nmon ami, et dans toute l'étendue de ce globe on ne peut ni se faire\nsaigner, ni prendre un lavement sans payer, ou sans qu'il y ait\nquelqu'un qui paie pour nous.»","Ce dernier discours détermina Candide; il alla se jeter aux pieds\nde son charitable anabaptiste Jacques, et lui fit une peinture si\ntouchante de l'état où son ami était réduit, que le bon homme\nn'hésita pas à recueillir le docteur Pangloss; il le fit guérir à ses\ndépens. Pangloss, dans la cure, ne perdit qu'un œil et une oreille.\nIl écrivait bien, et savait parfaitement l'arithmétique. L'anabaptiste\nJacques en fit son teneur de livres. Au bout de deux mois, étant\nobligé d'aller à Lisbonne, pour les affaires de son commerce, il\nmena dans son vaisseau ses deux philosophes. Pangloss lui expliqua\ncomment tout était on ne peut mieux. Jacques n'était pas de cet\navis.--«Il faut bien, disait-il, que les hommes aient un peu\ncorrompu la nature, car ils ne sont pas nés loups, et ils sont devenus\nloups. Dieu ne leur a donné ni canons de vingt-quatre, ni baïonnettes,\net ils se sont fait des baïonnettes et des canons pour se détruire. Je\npourrais mettre en ligne de compte les banqueroutes, et la justice\nqui s'empare des biens des banqueroutiers pour en frustrer les\ncréanciers.--Tout cela était indispensable, répliquait le docteur\nborgne, et les malheurs particuliers font le bien général: de sorte que\nplus il y a de malheurs particuliers, et plus tout est bien.» Tandis\nqu'il raisonnait, l'air s'obscurcit, les vents soufflèrent des quatre\ncoins du monde, et le vaisseau fut assailli de la plus horrible tempête,\nà la vue du port de Lisbonne.","[Illustration 11]","[Illustration 12]"]},{"name":"Chapitre 5","paragraphs":["TEMPÊTE, NAUFRAGE, TREMBLEMENT DE TERRE, ET CE QUI ADVINT DU DOCTEUR\nPANGLOSS, DE CANDIDE ET DE L'ANABAPTISTE JACQUES.","La moitié des passagers, affaiblis, expirant de ces angoisses\ninconcevables que le roulis d'un vaisseau porte dans les nerfs et dans\ntoutes les humeurs du corps agitées en sens contraires, n'avait pas\nmême la force de s'inquiéter du danger. L'autre moitié jetait des cris\net faisait des prières; les voiles étaient déchirées, les mâts brisés,\nle vaisseau entrouvert. Travaillait qui pouvait, personne ne\ns'entendait, personne ne commandait.","L'anabaptiste aidait un peu à la manœuvre; il était sur le tillac;\nun matelot furieux le frappe rudement et, l'étend sur les planches;\nmais du coup qu'il lui donna, il eut lui-même une si violente secousse,\nqu'il tomba hors du vaisseau la tête la première. Il restait suspendu\net accroché à une partie de mât rompu. Le bon Jacques court à son\nsecours, l'aide à remonter, et de l'effort qu'il fit il est précipité\ndans la mer à la vue du matelot, qui le laissa périr sans daigner\nseulement le regarder. Candide approche, voit son bienfaiteur qui\nreparaît un moment et qui est englouti pour jamais. Il veut se jeter\naprès lui dans la mer, le philosophe Pangloss l'en empêche, en lui\nprouvant que la rade de Lisbonne avait été formée exprès pour que\ncet anabaptiste s'y noyât. Tandis qu'il le prouvait _a priori_,\nle vaisseau s'entr'ouvre, tout périt, à la réserve de Pangloss, de\nCandide et de ce brutal de matelot qui avait noyé le vertueux\nanabaptiste; le coquin nagea heureusement jusqu'au rivage, où Pangloss\net Candide furent portés sur une planche.","Quand ils furent revenus un peu à eux, ils marchèrent vers Lisbonne;\nil leur restait quelque argent, avec lequel ils espéraient se sauver\nde la faim, après avoir échappé à la tempêté.","[Illustration 13:LE TREMBLEMENT DE TERRE DE LISBONNE]","À peine ont-ils mis le pied dans la ville, en pleurant la mort de\nleur bienfaiteur, qu'ils sentent la terre trembler sous leurs pas; la\nmer s'élève en bouillonnant dans le port, et brise les vaisseaux qui\nsont à l'ancre. Des tourbillons de flammes et de cendres couvrent les\nrues et les places publiques; les maisons s'écroulent, les toits sont\nrenversés sur les fondements, et les fondements se dispersent; trente\nmille habitants de tout âge et de tout sexe sont écrasés sous des\nruines. Le matelot disait en sifflant et en jurant: «--Il y aura\nquelque chose à gagner ici.--Quelle peut être la raison suffisante\nde ce phénomène? disait Pangloss.--Voici le dernier jour du\nmonde, s'écriait Candide.» Le matelot court incontinent au milieu des\ndébris, affronte la mort pour trouver de l'argent, en trouve, s'en\nempare, s'enivre, et ayant cuvé son vin, achète les faveurs de la\npremière fille de bonne volonté qu'il rencontre sur les ruines des\nmaisons détruites, et au milieu des mourants et des morts. Pangloss\nle tirait cependant par la manche: «--Mon ami, lui disait-il, cela\nn'est pas bien; vous manquez à la raison universelle, vous prenez mal\nvotre temps.--Tête et sang! répondit l'autre, je suis matelot et\nné à Batavia; j'ai marché quatre fois sur le crucifix dans quatre\nvoyages au Japon; tu as bien trouvé ton homme avec ta raison\nuniverselle!»","Quelques éclats de pierre avaient blessé Candide; il était étendu\ndans la rue et couvert de débris. Il disait à Pangloss: «--Hélas!\nprocure-moi un peu de vin et d'huile; je me meurs.--Ce tremblement\nde terre n'est pas une chose nouvelle, répondit Pangloss; la ville de\nLima éprouva les mêmes secousses en Amérique l'année passée; mêmes\ncauses, mêmes effets; il y a certainement une traînée de soufre sous\nterre depuis Lima jusqu'à Lisbonne.--Rien n'est plus probable,\ndit Candide; mais, pour Dieu, un peu d'huile et de vin.--Comment,\nprobable? répliqua le philosophe, je soutiens que la chose est\ndémontrée.» Candide perdit connaissance, et Pangloss lui apporta un peu\nd'eau d'une fontaine voisine.","Le lendemain, ayant trouvé quelques provisions de bouche en se\nglissant à travers des décombres, ils réparèrent un peu leurs forces.\nEnsuite ils travaillèrent comme les autres à soulager les habitants\néchappés à la mort.","Quelques citoyens, secourus par eux, leur donnèrent un aussi bon\ndîner qu'on le pouvait dans un tel désastre: il est vrai que le repas\nétait triste, les convives arrosaient leur pain de leurs larmes; mais\nPangloss les consola, en les assurant que les choses ne pouvaient être\nautrement; car, dit-il, tout ceci est ce qu'il y a de mieux; car, s'il\ny a un volcan à Lisbonne, il ne pouvait être ailleurs; car il est\nimpossible que les choses ne soient pas où elles sont; car tout\nest bien.","Un petit homme noir, familier de l'inquisition, lequel était à côté\nde lui, prit poliment la parole et dit: «--Apparemment que\nmonsieur ne croit pas au péché originel; car, si tout est au mieux,\nil n'y a donc eu ni chute ni punition.","--Je demande très humblement pardon à votre excellence,\nrépondit Pangloss encore plus poliment, car la chute de l'homme et la\nmalédiction entraient nécessairement dans le meilleur des mondes\npossibles.--Monsieur ne croit donc pas à la liberté? dit le\nfamilier.--Votre excellence m'excusera, dit Pangloss; la liberté\npeut subsister avec la nécessité absolue, car il était nécessaire que\nnous fussions libres; car enfin la volonté déterminée....»","Pangloss était au milieu de sa phrase, quand le familier fit un signe\nde tête à son estafier, qui lui servait à boire du vin de Porto ou\nd'Oporto.","[Illustration 14]","[Illustration 15]"]},{"name":"Chapitre 6","paragraphs":["COMMENT ON FIT UN BEL AUTO-DA-FÉ POUR EMPÊCHER LES TREMBLEMENTS\nDE TERRE, ET COMMENT CANDIDE FUT FESSÉ.","Après le tremblement de terre qui avait détruit les trois quarts de\nLisbonne, les sages du pays n'avaient pas trouvé un moyen plus efficace\npour prévenir une ruine totale que de donner au peuple un bel\nauto-da-fé; il était décidé par l'université de Coïmbre que le spectacle\nde quelques personnes brûlées à petit feu, en grande cérémonie, est un\nsecret infaillible pour empêcher la terre de trembler.","On avait en conséquence saisi un Biscayen convaincu d'avoir épousé\nsa commère, et deux Portugais qui, en mangeant un poulet, en avaient\narraché le lard; on vint lier après le dîner le docteur Pangloss et son\ndisciple Candide, l'un pour avoir parlé, et l'autre pour avoir écouté\navec un air d'approbation: tous deux furent menés séparément dans des\nappartements d'une extrême fraîcheur, dans lesquels on n'était jamais\nincommodé du soleil.","Huit jours après, ils furent tous deux revêtus d'un san-benito, et\non orna leurs têtes de mitres de papier: la mitre et le san-benito de\nCandide étaient peints de flammes renversées et de diables qui\nn'avaient ni queues ni griffes; mais les diables de Pangloss portaient\ngrilles et queues, et les flammes étaient droites. Ils marchèrent en\nprocession ainsi vêtus, et entendirent un sermon très pathétique,\nsuivi d'une belle musique en faux-bourdon. Candide fut fessé en\ncadence, pendant qu'ou chantait; le Biscayen et les deux hommes qui\nn'avaient point voulu manger de lard furent brûlés, et Pangloss fut\npendu, quoique ce ne soit pas la coutume. Le même jour la terre trembla\nde nouveau avec un fracas épouvantable.","Candide, épouvanté, interdit, éperdu, tout sanglant, tout palpitant,\nse disait à lui-même: «--Si c'est ici le meilleur des mondes\npossibles, que sont donc les autres? Passe encore si je n'étais que\nfessé; je l'ai été chez les Bulgares; mais, ô mon cher Pangloss! le\nplus grand des philosophes, faut-il vous avoir vu pendre, sans que je\nsache pourquoi! Ô mon cher anabaptiste! le meilleur des hommes, faut-il\nque vous ayez été noyé dans le port! Ô mademoiselle Cunégonde! la\nperle des filles, faut-il qu'on vous ait fendu le ventre!»","Il s'en retournait, se soutenant à peine, prêché, fessé, absous et\nbéni, lorsqu'une vieille l'aborda et lui dit:","«--Mon fils, prenez courage, suivez-moi.»","[Illustration 16]","[Illustration 17]"]},{"name":"Chapitre 7","paragraphs":["COMMENT UNE VIEILLE PRIT SOIN DE CANDIDE, ET COMMENT\nIL RETROUVA CE QU'IL AIMAIT.","Candide ne prit point courage, mais il suivit la vieille dans une\nmasure: elle lui donna un pot de pommade pour se frotter, lui laissa à\nmanger et à boire; elle lui montra un petit lit assez propre; il y avait\nauprès du lit un habit complet. «--Mangez, buvez, dormez, lui\ndit-elle, et que Notre-Dame d'Atocha, monseigneur saint Antoine de\nPadoue et monseigneur saint Jacques de Compostelle prennent soin de\nvous: je reviendrai demain.» Candide, toujours étonné de tout ce qu'il\navait vu et de tout ce qu'il avait souffert, et encore plus de la\ncharité de la vieille, voulut lui baiser la main. «--Ce n'est pas\nma main qu'il faut baiser, dit la vieille, je reviendrai demain.\nFrottez-vous de pommade, mangez et dormez.»","Candide, malgré tant de malheurs, mangea et dormit. Le lendemain,\nla vieille lui apporte à déjeuner, visite son dos, le frotte elle-même\nd'une autre pommade; elle lui apporte ensuite à dîner; elle revient sur\nle soir et apporte à souper.","Le surlendemain, elle fit encore les mêmes cérémonies. «--Qui\nêtes-vous? lui disait toujours Candide, qui vous a inspiré tant de\nbonté? quelles grâces puis-je vous rendre?» La bonne femme ne répondait\njamais rien. Elle revint sur le soir, et n'apporta point à souper:\n«--Venez avec moi, dit-elle, et ne dites mot.» Elle le prend sous\nle bras, et marche avec lui dans la campagne environ un quart de mille:\nils arrivent à une maison isolée, entourée de jardins et de canaux.\nLa vieille frappe à une petite porte. On ouvre; elle mène Candide, par\nun escalier dérobé, dans un cabinet doré, le laisse sur un canapé de\nbrocart, referme la porte et s'en va.","Candide croyait rêver, et regardait toute sa vie comme un songe\nfuneste, et le moment présent comme un songe agréable.","La vieille reparut bientôt; elle soutenait avec peine une femme\ntremblante, d'une taille majestueuse, brillante de pierreries, et\ncouverte d'un voile. «--Ôtez ce voile, dit la vieille à Candide.»\nLe jeune homme approche; il lève le voile d'une main timide. Quel\nmoment! quelle surprise! Il crut voir Mlle Cunégonde; il la voyait en\neffet: c'était elle-même. La force lui manque, il ne peut proférer une\nparole, il tombe à ses pieds. Cunégonde tombe sur le canapé. La vieille\nles accable d'eaux spiritueuses, ils reprennent leurs sens, ils se\nparlent: ce sont d'abord des mots entrecoupés, des demandes et des\nréponses qui se croisent, des soupirs, des larmes, des cris. La vieillie\nleur recommande de faire moins de bruit et les laisse en liberté.\n«--Quoi! c'est vous, lui dit Candide, vous vivez! je vous retrouve\nen Portugal! On ne vous a donc pas violée? on ne vous a point fendu le\nventre, comme le philosophe Pangloss me l'avait assuré?--Si fait,\ndit la belle Cunégonde; mais on ne meurt pas toujours de ces deux\naccidents.--Mais votre père et votre mère ont-ils été tués?--Il\nn'est que trop vrai, dit Cunégonde en pleurant.--Et votre\nfrère?--Mon frère a été tué aussi.--Et pourquoi êtes-vous en\nPortugal? et comment avez-vous su que j'y étais, et par quelle étrange\naventure m'avez-vous fait conduire dans cette maison?--Je vous\ndirai tout cela, répliqua la dame; mais il faut auparavant que vous\nm'appreniez tout ce qui vous est arrivé depuis le baiser innocent que\nvous me donnâtes et les coups de pied que vous reçûtes.»","Candide lui obéit avec un profond respect: et quoiqu'il fût interdit,\nquoique sa voix fût faible et tremblante, quoique l'échine lui fît\nencore un peu mal, il lui raconta de la manière la plus naïve tout ce\nqu'il avait éprouvé depuis le moment de leur séparation. Cunégonde\nlevait les yeux au ciel; elle donna des larmes à la mort du bon\nanabaptiste et de Pangloss, après quoi elle parla en ces termes à\nCandide, qui ne perdait pas une parole, et qui la dévorait des yeux.","[Illustration 18]","[Illustration 19]"]},{"name":"Chapitre 8","paragraphs":["HISTOIRE DE CUNÉGONDE.","«J'étais dans mon lit et je dormais profondément, quand il\nplut au ciel d'envoyer les Bulgares dans notre beau château de\nThunder-ten-tronckh; ils égorgèrent mon père et mon frère, et coupèrent\nma mère par morceaux. Un grand Bulgare, haut de six pieds, voyant qu'à\nce spectacle j'avais perdu connaissance, se mit à me violer; cela me fit\nrevenir, je repris mes sens, je criai, je me débattis, je mordis,\nj'égratignai, je voulais arracher les yeux à ce grand Bulgare, ne\nsachant pas que tout ce qui arrivait dans le château de mon père était\nune chose d'usage: le brutal me donna un coup de couteau dans le flanc\ngauche, dont je porte encore la marque.--Hélas! j'espère bien la\nvoir, dit le naïf Candide.--Vous la verrez, dit Cunégonde; mais\ncontinuons.--Continuez, dit Candide.»","Elle reprit ainsi le fil de son histoire: «--Un capitaine\nbulgare entra; il me vit toute sanglante, et le soldat ne se dérangeait\npas. Le capitaine se mit en colère du peu de respect que lui témoignait\nce brutal, et le tua sur mon corps. Ensuite il me fit panser et m'emmena\nprisonnière de guerre dans son quartier. Je blanchissais le peu de\nchemises qu'il avait, je faisais sa cuisine; il me trouvait fort jolie,\nil faut l'avouer; et je ne nierai pas qu'il ne fut très bien fait, et\nqu'il n'eût la peau blanche et douce; d'ailleurs peu d'esprit, peu de\nphilosophie: on voyait bien qu'il n'avait pas été élevé par le docteur\nPangloss. Au bout de trois mois, ayant perdu tout son argent, et\ns'étant dégoûté de moi, il me vendit à un juif nommé don Issachar,\nqui trafiquait en Hollande et en Portugal, et qui aimait passionnément\nles femmes. Ce juif s'attacha beaucoup à ma personne, mais il ne\npouvait en triompher; je lui ai mieux résisté qu'au soldat bulgare.\nUne personne d'honneur peut être violée une fois, mais sa vertu s'en\naffermit. Le juif, pour m'apprivoiser, me mena dans cette maison de\ncampagne que vous voyez. J'avais cru jusque-là qu'il n'y avait rien sur\nla terre de si beau que le château de Thunder-ten-tronckh: j'ai été\ndétrompée.","[Illustration 20:CUNÉGONDE ET LE SOLDAT BULGARE.]","Le grand inquisiteur m'aperçut un jour à la messe; il me lorgna\nbeaucoup, et me fit dire qu'il avait à me parler pour des affaires\nsecrètes. Je fus conduite à son palais; je lui appris ma naissance;\nil me représenta combien il était au-dessous de mon rang d'appartenir à\nun israélite. On proposa de sa part à don Issachar de me céder à\nMonseigneur. Don Issachar, qui est le banquier de la cour, et homme de\ncrédit, n'en voulut rien faire. L'inquisiteur le menaça d'un auto-da-fé.\nEnfin mon juif intimidé conclut un marché par lequel la maison et moi\nleur appartiendraient à tous deux en commun; que le juif aurait pour\nlui les lundis, mercredis, et le jour du sabbat, et que l'inquisiteur\naurait les autres jours de la semaine. Il y a six mois que cette\nconvention subsiste. Ce n'a pas été sans querelles; car souvent il a été\nindécis si la nuit du samedi au dimanche appartenait à l'ancienne loi\nou à la nouvelle. Pour moi, j'ai résisté jusqu'à présent à tous les\ndeux; et je crois que c'est pour cette raison que j'ai toujours été\naimée.","Enfin, pour détourner le fléau des tremblements de terre, et pour\nintimider don Issachar, il plut à Monseigneur l'inquisiteur de célébrer\nun auto-da-fé. Il me fit l'honneur de m'y inviter. Je fus très bien\nplacée; on servit aux dames des rafraîchissements entre la messe et\nl'exécution. Je fus, à la vérité, saisie d'horreur en voyant brûler ces\ndeux juifs et cet honnête Biscayen qui avait épousé sa commère; mais\nquelle fut ma surprise, mon effroi, mon trouble, quand je vis dans un\nsan-benito, et sous une mitre, une figure qui ressemblait à celle de\nPangloss! Je me frottai les yeux, je regardai attentivement, je le vis\npendre; je tombai en faiblesse. À peine reprenais-je mes sens, que je\nvous vis dépouillé tout nu; ce fut là le comble de l'horreur, de la\nconsternation, de la douleur, du désespoir. Je vous dirai, avec vérité,\nque votre peau est encore plus blanche et d'un incarnat plus parfait\nque celle de mon capitaine des Bulgares. Cette vue redoubla tous les\nsentiments qui m'accablaient, qui me dévoraient. Je m'écriai, je voulus\ndire:--Arrêtez, barbares! mais la voix me manqua, et mes cris\nauraient été inutiles. Quand vous eûtes été bien fessé:--Comment\nse peut-il faire, disais-je, que l'aimable Candide et le sage Pangloss\nse trouvent à Lisbonne, l'un pour recevoir cent coups de fouet, et\nl'autre pour être pendu par l'ordre de Monseigneur l'inquisiteur, dont\nje suis la bien-aimée? Pangloss m'a donc bien cruellement trompée,\nquand il me disait que tout va le mieux du monde!","Agitée, éperdue, tantôt hors de moi-même, et tantôt prête de mourir\nde faiblesse, j'avais la tête remplie du massacre de mon père, de ma\nmère, de mon frère, de l'insolence de mon vilain soldat bulgare, du\ncoup de couteau qu'il me donna, de ma servitude, de mon métier de\ncuisinière, de mon capitaine bulgare, de mon vilain don Issachar, de\nmon abominable inquisiteur, de la pendaison du docteur Pangloss, de ce\ngrand _Miserere_ en faux-bourdon pendant lequel on vous fessait,\net surtout du baiser que je vous avais donné derrière un paravent, le\njour que je vous avais vu pour la dernière fois. Je louai Dieu qui vous\nramenait à moi par tant d'épreuves. Je recommandai à ma vieille d'avoir\nsoin de vous, et de vous amener ici dès qu'elle le pourrait. Elle a très\nbien exécuté ma commission; j'ai goûté le plaisir inexprimable de vous\nrevoir, de vous entendre, de vous parler. Vous devez avoir une faim\ndévorante; j'ai grand appétit, commençons par souper.»","Les voilà qui se mettent tous deux à table; et, après le souper, ils\nse replacent sur ce beau canapé dont on a déjà parlé; ils y étaient\nquand le signor don Issachar, l'un des maîtres de la maison, arriva.\nC'était le jour du sabbat. Il venait jouir de ses droits, et expliquer\nson tendre amour.","[Illustration 21]","[Illustration 22]"]},{"name":"Chapitre 9","paragraphs":["CE QUI ADVINT DE CUNÉGONDE, DE CANDIDE, DU GRAND INQUISITEUR\nET D’UN JUIF.","Cet Issachar était le plus colérique Hébreu qu'on eût vu dans\nIsraël, depuis la captivité en Babylone. «--Quoi! dit-il, chienne\nde Galiléenne, ce n'est pas assez de monsieur l'inquisiteur? il faut\nque ce coquin partage aussi avec moi?» En disant cela il tire un long\npoignard dont il était toujours pourvu, et, ne croyant pas que son\nadverse partie eût des armes, il se jette sur Candide; mais notre bon\nWestphalien avait reçu une belle épée de la vieille avec l'habit\ncomplet. Il tire son épée, quoiqu'il eut les mœurs fort douces, et\nétend l'Israélite roide mort sur le carreau, aux pieds de Cunégonde.","«--Sainte Vierge! s'écria-t-elle, qu'allons-nous devenir? Un\nhomme tué chez moi! Si la justice vient, nous sommes perdus.--Si\nPangloss n'avait pas été pendu, dit Candide, il nous donnerait un bon\nconseil dans cette extrémité, car c'était un grand philosophe. À son\ndéfaut, consultons la vieille.» Elle était fort prudente, et commençait\nà dire son avis, quand une autre petite porte s'ouvrit. Il était une\nheure après minuit; c'était le commencement du dimanche. Ce jour\nappartenait à Monseigneur l'inquisiteur. Il entre et voit le fessé\nCandide, l'épée à la main, un mort étendu par terre, Cunégonde effarée,\net la vieille donnant des conseils.","Voici dans ce moment ce qui se passa dans l'âme de Candide, et\ncomment il raisonna: «--Si ce saint homme appelle du secours,\nil me fera infailliblement brûler; il pourra en faire autant de\nCunégonde; il m'a fait fouetter impitoyablement; il est mon rival: je\nsuis en train de tuer; il n'y a pas à balancer.» Ce raisonnement fut\nnet et rapide; et, sans donner le temps à l'inquisiteur de revenir de\nsa surprise, il le perce d'outre en outre, et le jette à côté du juif.\n«--En voici bien d'une autre, dit Cunégonde; il n'y a plus de\nrémission, nous sommes excommuniés, notre dernière heure est venue.\nComment avez-vous fait, vous qui êtes né si doux, pour tuer en deux\nminutes un juif et un prélat?--Ma belle demoiselle, répondit\nCandide, quand on est amoureux, jaloux, et fouetté par l'inquisition,\non ne se connaît plus.»","La vieille prit alors la parole et dit: «--Il y a trois chevaux\nandalous dans l'écurie, avec leurs selles et leurs brides; que le brave\nCandide les prépare. Madame a des moyadors et des diamants; montons\nvite à cheval, quoique je ne puisse me tenir que sur une fesse, et\nallons à Cadix; il fait le plus beau temps du monde, et c'est un grand\nplaisir de voyager pendant la fraîcheur de la nuit.","Aussitôt Candide selle les trois chevaux. Cunégonde, la vieille et\nlui font trente milles d'une traite. Pendant qu'ils s'éloignaient, la\nSainte Hermandad arrive dans la maison; on enterre Monseigneur dans\nune belle église, et l'on jette Issachar à la voirie.","Candide, Cunégonde et la vieille étaient déjà dans la petite ville\nd'Avacéna, au milieu des montagnes de la Sierra-Morena, et ils parlaient\nainsi dans un cabaret.","[Illustration 23]","[Illustration 24]"]},{"name":"Chapitre 10","paragraphs":["DANS QUELLE DÉTRESSE CANDIDE, CUNÉGONDE ET LA VIEILLE ARRIVENT À CADIX,\nET DE LEUR EMBARQUEMENT.","«Qui a donc pu me voler mes pistoles et mes diamants? disait en\npleurant Cunégonde. De quoi vivrons-nous? comment ferons-nous?\nOù trouver des inquisiteurs et des juifs qui m'en donnent\nd'autres?--Hélas! dit la vieille, je soupçonne fort un révérend\npère cordelier, qui coucha hier dans la même auberge que nous à Badajoz;\nDieu me garde de faire un jugement téméraire! mais il entra deux fois\ndans notre chambre, et il partit longtemps avant nous.--Hélas!\ndit Candide, le bon Pangloss m'avait souvent prouvé que les biens de la\nterre sont communs à tous les hommes, que chacun y a un droit égal.\nCe cordelier devait bien, suivant ces principes, nous laisser de quoi\nachever notre voyage. Il ne vous reste donc rien du tout, ma belle\nCunégonde?--Pas un maravédis, dit-elle.--Quel parti prendre?\ndit Candide.--Vendons un des chevaux, dit la vieille; je monterai\nen croupe derrière mademoiselle, quoique je ne puisse me tenir que sur\nune fesse, et nous arriverons à Cadix.»","Il y avait dans la même hôtellerie un prieur de bénédictins; il\nacheta le cheval bon marché. Candide, Cunégonde et la vieille passèrent\npar Lucena, par Chillas, par Lebrixa, et arrivèrent enfin à Cadix. On\ny équipait une flotte, et l'on assemblait des troupes pour mettre à\nla raison les révérends pères jésuites du Paraguay, qu'on accusait\nd'avoir fait révolter une de leurs hordes contre les rois d'Espagne et\nde Portugal, auprès de la ville du Saint-Sacrement.","Candide, ayant servi chez les Bulgares, fit l'exercice bulgarien\ndevant le général de la petite armée avec tant de grâce, de célérité,\nd'adresse, de fierté, d'agilité, qu'on lui donna une compagnie\nd'infanterie à commander. Le voilà capitaine; il s'embarque avec Mlle\nCunégonde, la vieille, deux valets, et les deux chevaux andalous qui\navaient appartenu à M. le grand inquisiteur de Portugal.","Pendant toute la traversée ils raisonnèrent beaucoup sur la\nphilosophie du pauvre Pangloss. «--Nous allons dans un autre\nunivers, disait Candide; c'est dans celui-là, sans doute, que tout est\nbien, car il faut avouer qu'on pourrait frémir un peu de ce qui se\npasse dans le nôtre en physique et en morale.--Je vous aime de\ntout mon cœur, disait Cunégonde; mais j'ai encore l'âme tout effarouchée\nde ce que j'ai vu, de ce que j'ai éprouvé.--Tout ira bien,\nrépliquait Candide; la mer de ce nouveau monde vaut déjà mieux que\nles mers de notre Europe; elle est plus calme, les vents plus constants.\nC'est certainement le Nouveau Monde qui est le meilleur des univers\npossible.--Dieu le veuille! disait Cunégonde; mais j'ai été si\nhorriblement malheureuse dans le mien, que mon cœur est presque fermé\nà l'espérance.--Vous vous plaignez, leur dit la vieille; hélas!\nvous n'avez pas éprouvé des infortunes telles que les miennes.»\nCunégonde se mit presque à rire, et trouva cette bonne femme fort\nplaisante de prétendre être plus malheureuse qu'elle. «--Hélas!\nlui dit-elle, ma bonne, à moins que vous n'ayez été violée par deux\nBulgares, que vous n'avez reçu deux coups de couteau dans le ventre,\nqu'on n'ait démoli deux de vos châteaux, qu'on n'ait égorgé à vos yeux\ndeux mères et deux pères, et que vous n'avez vu deux de vos amants\nfouettés dans un auto-da-fé, je ne vois pas que vous puissiez l'emporter\nsur moi; ajoutez que je suis née baronne avec soixante et douze\nquartiers, et que j'ai été cuisinière.--Mademoiselle, répondit\nla vieille, vous ne savez pas quelle est ma naissance; et, si je vous\nmontrais mon derrière, vous ne parleriez pas comme vous le faites, et\nvous suspendriez votre jugement.»","Ce discours fit naître une extrême curiosité dans l'esprit de\nCunégonde et de Candide. La vieille leur parla en ces termes.","[Illustration 25]","[Illustration 26]"]},{"name":"Chapitre 11","paragraphs":["HISTOIRE DE LA VIEILLE.","«Je n'ai pas en toujours les yeux éraillés et bordés d'écarlate,\nmon nez n'a pas toujours touché à mon menton, et je n'ai pas toujours\nété servante. Je suis la fille du pape Urbain X et de la princesse de\nPalestine. On m'éleva jusqu'à quatorze ans dans un palais auquel tous\nles châteaux de vos barons allemands n'auraient pas servi d'écurie; et\nune de mes robes valait mieux que toutes les magnificences de la\nWestphalie. Je croissais en beauté, en grâces, en talents, au milieu\ndes plaisirs, des respects et des espérances. J'inspirais déjà de\nl'amour. Ma gorge se formait, et quelle gorge! blanche, ferme, taillée\ncomme celle de la Vénus de Médicis; et quels yeux! quelles paupières!\nquels sourcils noirs! quelles flammes brillaient dans mes deux prunelles,\net effaçaient la scintillation des étoiles! comme me disaient les poètes\ndu quartier, Les femmes qui m'habillaient et qui me déshabillaient\ntombaient en extase en me regardant par devant et par derrière; et tous\nles hommes auraient voulu être à leur place.","Je fus fiancée à un prince souverain de Massa Carara: quel prince!\naussi beau que moi, pétri de douceur et d'agréments, brillant d'esprit\net brûlant d'amour; je l'aimais comme on aime pour la première fois,\navec idolâtrie, avec emportement. Les noces furent préparées: c'était\nune pompe, une magnificence inouïe; c'étaient des fêtes, des carrousels,\ndes opera-buffa continuels; et toute l'Italie fit pour moi des sonnets\ndont il n'y eut pas un seul de passable. Je touchais au moment de mon\nbonheur, quand une vieille marquise, qui avait été maîtresse de mon\nprince, l'invita à prendre du chocolat chez elle; il mourut en moins de\ndeux heures avec des convulsions épouvantables. Mais ce n'est qu'une\nbagatelle. Ma mère, au désespoir, et bien moins affligée que moi,\nvoulut s'arracher pour quelque temps à un séjour si funeste. Elle avait\nune très belle terre auprès de Gaëte: nous nous embarquâmes sur une\ngalère du pays, dorée comme l'autel de Saint-Pierre de Rome. Voilà\nqu'un corsaire de Salé fond sur nous et nous aborde. Nos soldats se\ndéfendirent comme des soldats du pape: ils se mirent tous à genoux en\njetant leurs armes, et en demandant au corsaire une absolution _in\narticulo mortis._ Aussitôt on les dépouilla nus comme des singes,\net ma mère aussi, nos filles d'honneur aussi, et moi aussi. C'est une\nchose admirable que la diligence avec laquelle ces messieurs\ndéshabillent le monde; mais ce qui me surprit davantage, c'est qu'ils\nnous mirent à tous le doigt dans un endroit où nous autres femmes nous\nne nous laissons mettre d'ordinaire que des canules. Cette cérémonie\nme paraissait bien étrange: voilà comme on juge de tout quand on n'est\npas sorti de son pays. J'appris bientôt que c'était pour voir si nous\nn'avions pas caché là quelques diamants; c'est un usage établi de temps\nimmémorial parmi les nations policées qui courent sur mer. J'ai su que\nmessieurs les religieux chevaliers de Malte n'y manquent jamais quand\nils prennent des Turcs et des Turques: c'est une loi du droit des gens\nà laquelle on n'a jamais dérogé.","[Illustration 27: LA TOILETTE DE LA JEUNE PRINCESSE.]","Je ne vous dirai point combien il est dur pour une jeune princesse\nd'être menée esclave à Maroc avec sa mère: vous concevez assez tout ce\nque nous eûmes à souffrir dans le vaisseau corsaire. Ma mère était\nencore très belle; nos filles d'honneur, nos simples femmes de chambre\navaient plus de charmes qu'on n'en peut trouver dans toute l'Afrique.\nPour moi, j'étais ravissante, j'étais la beauté, la grâce même, et\nj'étais pucelle. Je ne le fus pas longtemps. Cette fleur, qui avait été\nréservée pour le beau prince de Massa Carara, me fut ravie par le\ncapitaine corsaire. C'était un nègre abominable, qui croyait encore me\nfaire beaucoup d'honneur. Certes, il fallait que Mme la princesse de\nPalestine et moi fussions bien fortes pour résister à tout ce que nous\néprouvâmes jusqu'à notre arrivée à Maroc. Mais passons; ce sont des\nchoses si communes, qu'elles ne valent pas la peine qu'on en parle.\nMaroc nageait dans le sang quand nous arrivâmes. Cinquante fils de\nl'empereur Muley-Ismaël avaient chacun leur parti, ce qui produisait\nen effet cinquante guerres civiles, de noirs contre noirs, de noirs\ncontre basanés, de basanés contre basanés, de mulâtres contre mulâtres.\nC'était un carnage continuel dans toute l'étendue de l'empire.","À peine fûmes-nous débarquées, que des noirs d'une faction ennemie\nde celle de mon corsaire se présentèrent pour lui enlever son butin.\nNous étions, après les diamants et l'or, ce qu'il avait de plus\nprécieux. Je fus témoin d'un combat tel que vous n'en voyez jamais dans\nvos climats d'Europe. Les peuples septentrionaux n'ont pas le sang\nassez ardent; ils n'ont pas la rage des femmes au point où elle est\ncommune en Afrique. Il semble que vos Européens aient du lait dans les\nveines; c'est du vitriol, c'est du feu qui coule dans celles des\nhabitants du mont Atlas et des pays voisins. On combattit avec la fureur\ndes lions, des tigres et des serpents de la contrée, pour savoir qui\nnous aurait. Un Maure saisit ma mère par le bras droit, le lieutenant\nde mon capitaine la retint par le bras gauche; un soldat maure la prit\npar une jambe, un de nos pirates la tenait par l'autre. Nos filles se\ntrouvèrent presque toutes en un moment tirées ainsi à quatre soldats.\nMon capitaine me tenait cachée derrière lui; il avait le cimeterre au\npoing, et tuait tout ce qui s'opposait à sa rage. Enfin je vis toutes\nnos Italiennes et ma mère déchirées, coupées, massacrées par les\nmonstres qui se les disputaient. Les captifs, mes compagnons, ceux qui\nles avaient pris, soldats, matelots, noirs, blancs, mulâtres, et enfin\nmon capitaine, tout fut tué, et je demeurai mourante sur un tas de\nmorts. Des scènes pareilles se passaient, comme on sait, dans l'étendue\nde plus de trois cents lieues, sans qu'on manquât aux cinq prières par\njour ordonnées par Mahomet.","Je me débarrassai avec beaucoup de peine de la foule de tant de\ncadavres sanglants entassés, et je me traînai sous un grand oranger au\nbord d'un ruisseau voisin; j'y tombai d'effroi, de lassitude, d'horreur,\nde désespoir et de faim. Bientôt après mes sens accablés se livrèrent\nà un sommeil qui tenait plus de l'évanouissement que du repos. J'étais\ndans cet état de faiblesse et d'insensibilité, entre la mort et la vie,\nquand je me sentis pressée de quelque chose qui s'agitait sur mon corps.\nJ'ouvris les yeux, je vis un homme blanc et de bonne mine qui soupirait,\net qui disait: «_O che sciagura d'essere senza coglioni._»","[Illustration 28]","[Illustration 29]"]},{"name":"Chapitre 12","paragraphs":["SUITE DES MALHEURS DE LA VIEILLE.","«Étonnée et ravie d'entendre la langue de ma patrie, et non moins\nsurprise des paroles que proférait cet homme, je lui répondis qu'il y\navait de plus grands malheurs que celui dont il se plaignait; je\nl'instruisis en peu de mots des horreurs que j'avais essuyées, et je\nretombai en faiblesse. Il m'emporta dans une maison voisine, me fit\nmettre au lit, me fit donner à manger, me servit, me consola, me flatta,\nme dit qu'il n'avait rien vu de si beau que moi, et que jamais il\nn'avait tant regretté ce que personne ne pouvait lui rendre.--Je\nsuis né à Naples, me dit-il; on y chaponne deux ou trois mille enfants\ntous les ans; les uns en meurent, les autres acquièrent une voix plus\nbelle que celle des femmes, les autres vont gouverner des États. On me\nfit cette opération avec un très grand succès, et j'ai été musicien de\nla chapelle de Mme la princesse de Palestine.--De ma mère!\nm'écriai-je.--De votre mère! s'écria-t-il en pleurant: quoi! vous\nseriez cette jeune princesse que j'ai élevée jusqu'à l'âge de six ans,\net qui promettait déjà d'être aussi belle que vous êtes?--C'est\nmoi-même; ma mère est à quatre cents pas d'ici, coupée en quartiers\nsous un tas de morts....","Je lui contai tout ce qui m'était arrivé; il me conta aussi ses\naventures, et m'apprit comment il avait été envoyé chez le roi de Maroc\npar une puissance chrétienne, pour conclure avec ce monarque un traité\npar lequel on lui fournirait de la poudre, des canons et des vaisseaux,\npour l'aider à exterminer le commerce des autres chrétiens.--Ma\nmission est faite, médit cet honnête eunuque; je vais m'embarquer à\nCeuta, et je vous ramènerai en Italie. _Ma che sciagura d'essere\nsenza coglioni!_","Je le remerciai avec des larmes d'attendrissement, et, au lieu de me\nmener en Italie, il me conduisit à Alger, et me vendit au dey de cette\nprovince. À peine fus-je vendue, que cette peste qui a fait le tour de\nl'Afrique, de l'Asie et de l'Europe, se déclara dans Alger avec fureur.\nVous avez vu des tremblements de terre; mais, mademoiselle, avez-vous\njamais eu la peste?--Jamais, répondit la baronne.","--Si vous l'aviez eue, reprit la vieille, vous avoueriez qu'elle\nest bien au-dessus d'un tremblement de terre. Elle est fort commune en\nAfrique; j'en fus attaquée. Figurez-vous quelle situation pour la fille\nd'un pape, âgée de quinze ans, qui en trois mois de temps avait éprouvé\nla pauvreté, l'esclavage, avait été violée presque tous les jours, avait\nvu couper sa mère eu quatre, avait essuyé la faim et la guerre, et\nmourait pestiférée dans Alger. Je n'en mourus pourtant pas; mais mon\neunuque et le dey, et presque tout le sérail d'Alger périrent.","Quand les premiers ravages de cette épouvantable peste, furent\npassés, on vendit les esclaves du dey. Un marchand m'acheta et me mena\nà Tunis; il me vendit à un autre marchand qui me revendit à Tripoli; de\nTripoli je fus revendue à Alexandrie; d'Alexandrie revendue a Smyrne;\nde Smyrne à Constantinople. J'appartins enfin à un aga des janissaires,\nqui fut bientôt commandé pour aller défendre Azof contre les Russes,\nqui l'assiégeaient.","L'aga, qui était un très galant homme, mena avec lui tout son sérail,\net nous logea dans un petit fort sur les Palus Méotides, gardé par deux\neunuques noirs et vingt soldats. On tua prodigieusement de Russes, mais\nils nous le rendirent bien. Azof fut mis à feu et à sang, et on ne\npardonna ni au sexe, ni à l'âge; il ne resta que notre petit fort; les\nennemis voulurent nous prendre par famine. Les vingt janissaires avaient\njuré de ne jamais se rendre. Les extrémités de la faim où ils furent\nréduits les contraignirent à manger nos deux eunuques, de peur de violer\nleur serment. Au bout de quelques jours, ils résolurent de manger les\nfemmes.","Nous avions un iman très pieux et très compatissant, qui leur fit\nun beau sermon par lequel il leur persuada de ne pas nous tuer tout à\nfait.--Coupez, dit-il, seulement une fesse à chacune de ces dames,\nnous ferez très bonne chère; s'il faut y revenir, vous en aurez encore\nautant dans quelques jours; le ciel vous saura gré d'une action si\ncharitable, et vous serez secourus.","Il avait beaucoup d'éloquence; il les persuada. On nous fit cette\nhorrible opération; l'iman nous appliqua le même baume qu'on met aux\nenfants qu'on vient de circoncire: nous étions toutes à la mort.","À peine les janissaires eurent-ils fait le repas que nous leur avio
