us les étrangers, mais laissez-moi\nfaire; j'ai un frère à Dieppe en Normandie; je vais vous y mener, et si\nvous avez quelque diamant à lui donner, il aura soin de vous comme\nmoi-même.","--Et pourquoi arrête-t-on tous les étrangers?» dit Candide.\nL'abbé périgourdin prit alors la parole et dit:--C'est parce qu'un\ngueux du pays d'Atrébatie a entendu dire des sottises; cela seul lui a\nfait commettre un parricide, non pas tel que celui de 1610 au mois de\nmai, mais tel que celui de 1594 au mois de décembre, et tel que plusieurs\nautres commis dans d'autres années et dans d'autres mois par d'autres\ngueux qui avaient entendu dire des sottises.»","L'exempt alors expliqua de quoi il s'agissait. «--Ah! les\nmonstres! s'écria Candide; quoi! de telles horreurs chez un peuple qui\ndanse et qui chante! Ne pourrais-je sortir au plus vite de ce pays où\ndes singes agacent des tigres? J'ai vu des ours dans mon pays; je n'ai\nvu des hommes que dans le Dorado. Au nom de Dieu, monsieur l'exempt,\nmenez-moi à Venise, où je dois attendre Mlle Cunégonde.--Je ne\npeux vous mener qu'en Basse-Normandie, dit le barigel.» Aussitôt il lui\nfait ôter ses fers, dit qu'il s'est mépris, renvoie ses gens, emmène\nà Dieppe Candide et Martin, et les laisse entre les mains de son frère.\nIl y avait un petit vaisseau hollandais à la rade. Le Normand, à l'aide\nde trois autres diamants, devenu le plus serviable des hommes, embarque\nCandide et ses gens dans le vaisseau qui allait faire voile pour\nPortsmouth, en Angleterre. Ce n'était pas le chemin de Venise; mais\nCandide croyait être délivré de l'enfer, et il comptait bien reprendre\nla route de Venise à la première occasion.","[Illustration 54]","[Illustration 55]"]},{"name":"Chapitre 23","paragraphs":["CANDIDE ET MARTIN VONT SUR LES CÔTES D'ANGLETERRE; CE QU’ILS Y VOIENT.","«Ah! Pangloss! Pangloss! Ah! Martin! Martin! Ah! ma chère\nCunégonde! qu'est-ce que ce monde-ci ? disait Candide sur le vaisseau\nhollandais.--Quelque chose de bien fou et de bien abominable,\nrépondait Martin.--Vous connaissez l'Angleterre; y est-on aussi\nfou qu'en France?--C'est une autre espèce de folie, dit Martin.\nVous savez que ces deux nations sont en guerre pour quelques arpents\nde neige vers le Canada, et qu'elles dépensent pour cette belle guerre\nbeaucoup plus que tout le Canada ne vaut. De vous dire précisément\ns'il y a plus de gens à lier dans un pays que dans un autre, c'est ce que\nmes faibles lumières ne me permettent pas; je sais seulement qu'en\ngénéral les gens que nous allons voir sont fort atrabilaires.»","En causant ainsi, ils abordèrent à Portsmouth; une multitude de\npeuple couvrait le rivage et regardait attentivement un assez gros\nhomme qui était à genoux, les yeux bandés, sur le tillac d'un des\nvaisseaux de la flotte; quatre soldats, postés vis-à-vis de cet homme,\nlui tirèrent chacun trois balles dans le crâne, le plus paisiblement du\nmonde, et toute l'assemblée s'en retourna extrêmement satisfaite...\n«Qu'est-ce donc que tout ceci? dit Candide; et quel démon exerce\npartout son empire?» Il demanda qui était ce gros homme qu'on venait\nde tuer en cérémonie. «--C'est un amiral, lui répondit-on.--Et\npourquoi tuer cet amiral?--C'est, lui dit-on, parce qu'il n'a pas\nfait tuer assez de monde; il a livré un combat à un amiral français, et\non a trouvé qu'il n'était pas assez près de lui.--Mais, dit Candide,\nl'amiral français était aussi loin de l'amiral anglais que celui-ci\nl'était de l'autre!--Cela est incontestable, lui répliqua-t-on;\nmais dans ce pays-ci il est bon de tuer de temps en temps un amiral\npour encourager les autres.»","Candide fut si étourdi et si choqué de ce qu'il voyait et de ce qu'il\nentendait, qu'il ne voulut pas seulement mettre pied à terre, et qu'il\nfit son marché avec le patron hollandais (dût-il le voler comme celui\nde Surinam) pour le conduire sans délai à Venise.","Le patron fut prêt au bout de deux jours; on côtoya la France; on\npassa à la vue de Lisbonne, et Candide frémit. On entra dans le détroit\net dans la Méditerranée; enfin on aborda a Venise. «--Dieu soit\nloué! dit Candide en embrassant Martin: c'est ici que je reverrai la\nbelle Cunégonde. Je compte sur Cacambo comme sur moi-même. Tout est\nbien, tout va bien, tout va le mieux qu'il soit possible.»","[Illustration 56]","[Illustration 57]"]},{"name":"Chapitre 24","paragraphs":["DE PAQUETTE ET DE FRÈRE GIROFLÉE.","Dès qu'il fut à Venise, il fit chercher Cacambo dans tous les\ncabarets, dans tous les cafés, chez toutes les filles de joie, et ne le\ntrouva point. Il envoyait tous les jours à la découverte de tous les\nvaisseaux et de toutes les barques: milles nouvelles de Cacambo.\n«--Quoi! disait-il à Martin, j'ai eu le temps de passer de Surinam\nà Bordeaux, d'aller de Bordeaux à Paris, de Paris à Dieppe, de Dieppe\nà Portsmouth, de côtoyer le Portugal et l'Espagne, de traverser toute\nla Méditerranée, de passer quelques mois à Venise, et la belle Cunégonde\nn'est point venue! Je n'ai rencontré, au lieu d'elle, qu'une drôlesse\net un abbé périgourdin! Cunégonde est morte, sans doute; je n'ai plus\nqu'à mourir. Ah! il valait mieux rester dans le paradis du Dorado que de\nrevenir dans cette maudite Europe. Que vous avez raison, mon cher\nMartin! tout n'est qu'illusion et calamité.»","Il tomba dans une mélancolie noire et ne prit aucune part à l'opéra\n_allo modo_, ni aux autres divertissements du carnaval, pas une\ndame ne lui donna la moindre tentation. Martin lui dit: «--Vous\nêtes bien simple, en vérité, de vous figurer qu'un valet métis, qui\na cinq ou six millions dans ses poches, ira chercher votre maîtresse au\nbout du monde, et vous l'amènera à Venise. Il la prendra pour lui, s'il\nla trouve; s'il ne la trouve pas, il en prendra une autre: je vous\nconseille d'oublier votre valet Cacambo et votre maîtresse Cunégonde.»\nMartin n'était pas consolant. La mélancolie de Candide augmenta, et\nMartin ne cessait de lui prouver qu'il y avait peu de vertu et peu de\nbonheur sur la terre, excepté peut-être dans Eldorado, où personne\nne pouvait aller.","En disputant sur cette matière importante, et en attendant Cunégonde,\nCandide aperçut un jeune théatin dans la place Saint-Marc, qui tenait\nsous le bras une fille. Le théatin paraissait frais, potelé, vigoureux:\nses yeux étaient brillants, son air assuré, sa mine haute, sa démarche\nfière. La fille était très jolie et chantait; elle regardait amoureusement\nson théatin, et de temps en temps lui pinçait ses grosses joues.\n«--Vous m'avouerez du moins, dit Candide à Martin, que ces gens-ci\nsont heureux. Je n'ai trouvé jusqu'à présent dans toute la terre\nhabitable, excepté dans l'Eldorado, que des infortunés; mais pour cette\nfille et ce théatin, je gage que ce sont des créatures très\nheureuses.--Je gage que non, dit Martin.--Il n'y a qu'à les\nprier à dîner, dit Candide, et vous verrez si je me trompe.»","Aussitôt il les aborde; il leur fait son compliment et les invite à\nvenir à son hôtellerie manger des macaronis, des perdrix de Lombardie,\ndes œufs d'esturgeon, et à boire du vin de Moutepulciano, élu\nlacrima-christi, du chypre et du samos. La demoiselle rougit, le théatin\naccepta la partie, et la fille le suivit en regardant Candide avec des\nyeux de surprise et de confusion, qui furent obscurcis de quelques\nlarmes. À peine fut-elle entrée dans la chambre de Candide, qu'elle\nlui dit: «--Eh quoi! monsieur Candide ne reconnaît plus Paquette!»\nÀ ces mots, Candide, qui ne l'avait pas considérée jusque-là avec\nattention, parce qu'il n'était occupé que de Cunégonde, lui dit:\n«--Hélas! ma pauvre enfant, c'est donc vous qui avez mis le\ndocteur Pangloss dans le bel état où je l'ai vu!","--Hélas! monsieur, c'est moi-même, dit Paquette: je vois que\nvous êtes instruit de tout. J'ai su les malheurs épouvantables arrivés\nà toute la maison de Mme la baronne et à la belle Cunégonde. Je vous\njure que ma destinée n'a guère été moins triste. J'étais fort innocente\nquand vous m'avez vue. Un cordelier, qui était mon confesseur, me\nséduisit aisément. Les suites en furent affreuses; je fus obligée de\nsortir du château quelque temps après que M. le baron vous eut renvoyé\nà grands coups de pied dans le derrière. Si un fameux médecin n'avait\npas pris pitié de moi, j'étais morte. Je fus quelque temps par\nreconnaissance la maîtresse de ce médecin. Sa femme, qui était\njalouse à la rage, me battait tous les jours impitoyablement; c'était\nune furie. Ce médecin était le plus laid de tous les hommes, et\nmoi la plus malheureuse de toutes les créatures d'être battue\ncontinuellement pour un homme que je n'aimais pas. Vous savez,\nmonsieur, combien il est dangereux pour une femme acariâtre d'être\nl'épouse d'un médecin. Celui-ci, outré des procédés de sa femme,\nlui donna un jour, pour la guérir d'un petit rhume, une médecine\nsi efficace, qu'elle en mourut en deux heures de temps dans des\nconvulsions horribles. Les parents de madame intentèrent à monsieur un\nprocès criminel; il prit la fuite, et moi je fus mise en prison. Mon\ninnocence ne m'aurait pas sauvée, si je n'avais été un peu jolie. Le\njuge m'élargit à condition qu'il succéderait au médecin. Je fus d'abord\nsupplantée par une rivale, chassée sans récompense et obligée de\ncontinuer ce métier abominable qui vous parait-si plaisant à vous\nautres hommes, et qui n'est pour nous qu'un abîme de misère. J'allai\nexercer la profession à Venise. Ah! monsieur, si vous pouviez vous\nimaginer ce que c'est que d'être obligée de caresser indifféremment\nun vieux marchand, un avocat, un moine, un gondolier, un abbé; d'être\nexposée à toutes les insultes, à toutes les avanies; d'être souvent\nréduite à emprunter une jupe pour aller se la faire lever par un homme\ndégoûtant; d'être volée par l'un de ce qu'on a gagné avec l'autre;\nd'être rançonnée par les officiers de justice et de n'avoir en\nperspective qu'une vieillesse affreuse, un hôpital et un fumier, vous\nconcluriez que je suis une des plus malheureuses créatures du monde.»","[Illustration 58: PAQUETTE ET FRÈRE GIROFLÉE]","Paquette ouvrait ainsi son cœur au bon Candide, dans un cabinet, en\nprésence de Martin, qui disait à Candide: «Vous voyez que j'ai déjà\ngagné la moitié de la gageure.»","Frère Giroflée était resté dans la salle à manger, et buvait un coup\nen attendant le dîner. «--Mais, dit Candide à Paquette, vous aviez\nl'air si gai, si content, quand je vous ai rencontrée! vous chantiez,\nvous caressiez le théatin avec une complaisance naturelle; vous m'avez\nparu aussi heureuse que vous prétendez être infortunée.--Ah!\nmonsieur, répondit Paquette, c'est encore là une des misères du métier.\nJ'ai été hier volée et battue par un officier, et il faut aujourd'hui\nque je paraisse de bonne humeur pour plaire à un moine.»","Candide n'en voulait pas davantage; il avoua que Martin avait\nraison. On se mit à table avec Paquette et le théatin; le repas fut\nassez amusant, et sur la fin on se parla avec quelque confiance.\n«--Mon père, dit Candide au moine, vous me paraissez jouir\nd'une destinée que tout le monde doit envier; la fleur de la santé\nbrille sur votre visage; votre physionomie annonce le bonheur; vous\navez une très jolie fille pour votre récréation, et vous paraissez très\ncontent de votre état de théatin.","--Ma foi, monsieur, dit frère Giroflée, je voudrais que tous\nles théatins fussent au fond de la mer. J'ai été tenté cent fois de\nmettre le feu au couvent et d'aller me faire turc. Mes parents me\nforcèrent, à l'âge de quinze ans, d'endosser cette détestable robe,\npour laisser plus de fortune à un maudit frère aîné, que Dieu confonde!\nLa jalousie, la discorde, la rage, habitent dans le couvent, il est vrai\nque j'ai prêché quelques mauvais sermons qui m'ont valu un peu d'argent\ndont le prieur me vole la moitié; le reste me sert à entretenir des\nfilles; mais quand je rentre le soir dans le monastère, je suis prêt à\nme casser la tête contre les murs du dortoir, et tous mes confrères\nsont dans le même cas.»","Martin, se tournant vers Candide avec son sang-froid ordinaire:\n«--Eh bien! lui dit-il, n'ai-je pas gagné la gageure tout entière?»\nCandide donna deux mille piastres à Paquette et mille piastres à frère\nGiroflée. «--Je vous réponds, dit-il, qu'avec cela ils seront\nheureux.--Je n'en crois rien du tout, dit Martin: vous les rendrez\npeut-être avec ces piastres beaucoup plus malheureux encore.--Il\nen sera ce qui pourra, dit Candide; mais une chose me console: je vois\nqu'on retrouve souvent les gens qu'on ne croyait jamais retrouver; il se\npourra bien faire qu'ayant rencontré mon mouton rouge et Paquette, je\nrencontre aussi Cunégonde.--Je souhaite, dit Martin, qu'elle\nfasse un jour votre bonheur; mais c'est de quoi je doute fort.--Vous\nêtes bien dur, dit Candide.--C'est que j'ai vécu, dit\nMartin.--Mais regardez ces gondoliers, dit Candide: ne chantent-ils\npas sans cesse!--Vous ne les voyez pas dans leur ménage, avec\nleurs femmes et leurs marmots d'enfants, dit Martin. Le doge a ses\nchagrins; les gondoliers ont les leurs. Il est vrai qu'à tout prendre\nle sort d'un gondolier est préférable à celui d'un doge; mais je crois\nla différence si médiocre, que cela ne vaut pas la peine d'être examiné.","--On parle, dit Candide, du sénateur Pococurante, qui demeure\ndans ce beau palais sur la Brenta, et qui reçoit assez bien les\nétrangers. On prétend que c'est un homme qui n'a jamais eu de\nchagrin.--Je voudrais voir une espèce si rare,» dit Martin.\nCandide aussitôt fit demander au seigneur Pococurante la permission\nde venir le voir le lendemain.","[Illustration 59]","[Illustration 60]"]},{"name":"Chapitre 25","paragraphs":["VISITE CHEZ LE SEIGNEUR POCOCURANTE, NOBLE VÉNITIEN.","Candide et Martin allèrent en gondole sur la Brenta, et arrivèrent\nau palais du noble Pococurante. Les jardins étaient bien entendus et\nornés de belles statues de marbre, le palais d'une belle architecture.\nLe maître du logis, homme do soixante ans, fort riche, reçut très\npoliment les deux curieux, mais avec très peu d'empressement, ce qui\ndéconcerta Candide et ne déplut point à Martin.","D'abord deux filles jolies et proprement mises servirent du chocolat,\nqu'elles firent très bien mousser. Candide ne put s'empêcher de les\nlouer sur leur beauté, sur leur bonne grâce et sur leur adresse.\n«--Ce sont d'assez bonnes créatures, dit le sénateur Pococurante;\nje les fais quelquefois coucher dans mon lit, car je suis bien las des\ndames de la ville, de leurs coquetteries, de leurs jalousies, de leurs\nquerelles, de leurs humeurs, de leurs petitesses, de leur orgueil, de\nleurs sottises et des sonnets qu'il faut faire ou commander pour elles;\nmais, après tout, ces deux filles commencent fort à m'ennuyer.»","Candide, après le déjeuner, se promenant dans une longue galerie,\nfut surpris de la beauté des tableaux. Il demanda de quel maître étaient\nles deux premiers. «--Ils sont de Raphaël, dit le sénateur; je les\nachetai fort cher par vanité, il y a quelques années; on dit que c'est\nce qu'il y a de plus beau en Italie, mais ils ne me plaisent point du\ntout: la couleur en est très rembrunie; les figures ne sont pas assez\narrondies et ne sortent point assez; les draperies ne ressemblent en\nrien à une étoffe: en un mot, quoi qu'on en dise, je ne trouve point là\nune imitation vraie de la nature. Je n'aimerai un tableau que quand je\ncroirai voir la nature elle-même: il n'y en a point de cette espèce.\nJ'ai beaucoup de tableaux, mais je ne les regarde plus.»","Pococurante, en attendant le dîner, se fit donner un concerto.\nCandide trouva la musique délicieuse. «--Ce bruit, dit Pococurante,\npeut amuser une demi-heure; mais, s'il dure plus longtemps, il\nfatigue tout le monde, quoique personne n'ose l'avouer. La musique\naujourd'hui n'est plus que l'art d'exécuter des choses difficiles,\net ce qui n'est que difficile ne plaît point à la longue.","J'aimerais peut-être mieux l'opéra, si on n'avait pas trouvé le\nsecret d'en faire un monstre qui me révolte. Ira voir qui voudra de\nmauvaises tragédies en musique, où les scènes ne sont faites que\npour amener très mal à propos deux ou trois chansons ridicules qui\nfont valoir le gosier d'une actrice; se pâmera de plaisir qui voudra\nou qui pourra en voyant un châtré fredonner le rôle de César et de\nCaton, et se promener d'un air gauche sur des planches: pour moi,\nil y a longtemps que j'ai renoncé à ces pauvretés qui font aujourd'hui\nla gloire de l'Italie et que des souverains paient si chèrement.»\nCandide disputa un peu, mais avec discrétion. Martin fut entièrement\nde l'avis du sénateur.","On se mit à table; et, après un excellent dîner, on entra dans la\nbibliothèque. Candide, en voyant un Homère magnifiquement relié,\nloua l'illustrissime sur son bon goût. «--Voilà, dit-il, un livre\nqui faisait les délices du grand Pangloss, le meilleur philosophe de\nl'Allemagne.--Il ne fait pas les miennes, dit froidement\nPococurante: on me fit accroire autrefois que j'avais du plaisir en le\nlisant; mais cette répétition continuelle de combats qui se ressemblent\ntous, ces dieux qui agissent toujours pour ne rien faire de décisif,\ncette Hélène qui est le sujet de la guerre, et qui à peine est une\nactrice de la pièce; cette Troie qu'on assiège et qu'on ne prend point;\ntout cela me causait le plus mortel ennui. J'ai demandé quelquefois\nà des savants s'ils s'ennuyaient autant que moi à cette lecture: tous\nles gens sincères m'ont avoué que le livre leur tombait des mains,\nmais qu'il fallait toujours l'avoir dans sa bibliothèque, comme un\nmonument de l'antiquité, et comme ces médailles rouillées qui ne\npeuvent être de commerce.","--Votre excellence ne pense pas ainsi de Virgile? dit\nCandide.--Je conviens, dit Pococurante, que le second, le quatrième\net le sixième livre de son Énéide sont excellents; mais pour son pieux\nÉnée, et le fort Cloanthe, et l'ami Achates, et le petit Ascanius, et\nl'imbécile roi Latinus, et la bourgeoise Amata, et l'insipide\nLavinia, je ne crois pas qu'il y ait rien de si froid et de plus\ndésagréable. J'aime mieux le Tasse et les contes à dormir debout de\nl'Arioste.","--Oserais-je vous demander, monsieur, dit Candide, si vous\nn'avez pas un grand plaisir à lire Horace?--Il y a des maximes,\ndit Pococurante, dont un homme du monde peut faire son profit et qui,\nétant resserrées dans des vers énergiques, se gravent plus aisément\ndans la mémoire; mais je me soucie fort peu de son voyage à Brindes, et\nde sa description d'un mauvais dîner, et de la querelle de crocheteurs\nentre je ne sais quel Pupilus dont les paroles, dit-il, étaient pleines\nde pus, et un autre dont les paroles étaient du vinaigre. Je n'ai lu\nqu'avec un extrême dégoût ses vers grossiers contre des vieilles et\ncontre des sorcières, et je ne vois pas quel mérite il peut y avoir à\ndire à son ami Mécénas que, s'il est mis par lui au rang des poètes\nlyriques, il frappera les astres de son front sublime. Les sots admirent\ntout dans un auteur estimé. Je ne lis que pour moi; je n'aime que ce\nqui est à mon usage.» Candide, qui avait été élevé à ne jamais juger\nde rien par lui-même, était fort étonné de ce qu'il entendait, et Martin\ntrouvait la façon de penser de Pococurante assez raisonnable.","«--Oh! voici un Cicéron, dit Candide: pour ce grand homme-là,\nje pense que vous ne vous lassez point de le lire.--Je ne le lis\njamais, répondit le Vénitien. Que m'importe qu'il ait plaidé pour\nRabirius ou pour Cluentius? J'ai bien assez des procès que je juge; je\nme serais mieux accommodé de ses œuvres philosophiques; mais quand\nj'ai vu qu'il doutait de tout, j'ai conclu que j'en savais autant que\nlui, et que je n'avais besoin de personne pour être ignorant.","--Ah! voilà quatre-vingts volumes de recueils d'une académie\ndes sciences, s'écria Martin; il se peut qu'il y ait là du bon.--Il\ny en aurait, dit Pococurante, si un seul des auteurs de ces fatras\navait inventé seulement l'art de faire des épingles; mais il n'y a dans\ntous ces livres que de vains systèmes, et pas une seule chose utile.","--Que de pièces de théâtre je vois là, dit Candide, en italien,\nen espagnol, en français!--Oui, dit le sénateur, il y en a trois\nmille, et pas trois douzaines de bonnes. Pour ces recueils de sermons,\nqui tous ensemble ne valent pas une page de Sénèque, et tous ces gros\nvolumes de théologie, vous pensez bien que je ne les ouvre jamais, ni\nmoi, ni personne.»","Martin aperçut des rayons chargés de livres anglais. «--Je crois,\ndit-il qu'un républicain doit se plaire à la plupart de ces ouvrages\nécrits si librement.--Oui, répondit Pococurante, il est beau\nd'écrire ce qu'on pense; c'est le privilège de l'homme. Dans toute\nnotre Italie, on n'écrit que ce qu'on ne pense pas; ceux qui habitent\nla patrie des Césars et des Antonius n'osent avoir une idée sans la\npermission d'un jacobin. Je serais content de la liberté qui inspire\nles génies anglais, si la passion et l'esprit de parti ne corrompaient\npas tout ce que cette précieuse liberté a d'estimable.»","Candide, apercevant un Milton, lui demanda s'il ne regardait pas\ncet auteur comme un grand homme. «--Qui? dit Pococurante, ce\nbarbare, qui fait un long commentaire en dix livres de vers durs du\npremier chapitre de la _Genèse_? ce grossier imitateur des Grecs,\nqui défigure la création et qui, tandis que Moïse représente l'Être\néternel produisant le monde par la parole, fait prendre un grand compas\npar Messiah dans une armoire du ciel pour tracer son ouvrage? Moi,\nj'estimerais celui qui a gâté l'enfer et le diable du Tasse; qui\ndéguise Lucifer tantôt en crapaud, tantôt en pygmée; qui lui fait\nrebattre cent fois les mêmes discours; qui le fait disputer sur la\nthéologie; qui, en imitant sérieusement l'invention comique des armes\nà feu de l'Arioste, fait tirer le canon dans le ciel par les diables?\nNi moi ni personne en Italie n'a pu se plaire à toutes ces tristes\nextravagances; et le _mariage du Péché et de la Mort_, et les\ncouleuvres dont le Péché accouche, font vomir tout homme qui a le goût\nun peu délicat; et sa longue description d'un hôpital n'est bonne que\npour un fossoyeur. Ce poème obscur, bizarre et dégoûtant fui méprisé\nà sa naissance; je le traite aujourd'hui comme il fut traité dans sa\npatrie par les contemporains. Au reste, je dis ce que je pense, et je me\nsoucie fort peu que les autres pensent comme moi.» Candide était\naffligé de ces discours: il respectait Homère; il aimait un peu Milton.\n«--Hélas! dit-il tout bas à Martin, j'ai bien peur que cet homme-ci\nn'ait un souverain mépris pour nos poètes allemands.--Il n'y aurait\npas grand mal à cela, dit Martin.--Oh! quel homme supérieur!\ndisait encore Candide entre ses dents; quel grand génie que ce\nPococurante! rien ne peut lui plaire.»","Après avoir fait ainsi la revue de tous les livres, ils descendirent\ndans le jardin. Candide en loua toutes les beautés.»--Je ne sais\nrien de si mauvais goût, dit le maître; nous n'avons ici que des\ncolifichets; mais je vais dès demain en faire planter un d'un dessin\nplus noble.»","Quand les deux curieux eurent pris congé de son excellence:\n«--Or ça, dit Candide à Martin, vous conviendrez que voilà le plus\nheureux de tous les hommes, car il est au-dessus de tout ce qu'il\npossède.--Ne voyez-vous pas, dit Martin, qu'il est dégoûté de tout\nce qu'il possède? Platon a dit, il y a longtemps, que les meilleurs\nestomacs ne sont pas ceux qui rebutent tous les aliments.--Mais,\ndit Candide, n'y a-t-il pas du plaisir à tout critiquer, à sentir des\ndéfauts où les autres hommes croient voir des beautés?--C'est-à-dire,\nreprit Martin, qu'il y a du plaisir à n'avoir pas de plaisir?--Oh\nbien! dit Candide, il n'y a donc d'heureux que moi, quand je reverrai\nMlle Cunégonde.--C'est toujours bien fait d'espérer, dit Martin.»","Cependant les jours, les semaines s'écoulaient; Cacambo ne revenait\npoint, et Candide était si abîmé dans sa douleur, qu'il ne fit pas même\nréflexion que Paquette et frère Giroflée n'étaient pas venus seulement\nle remercier.","[Illustration 61]","[Illustration 62]"]},{"name":"Chapitre 26","paragraphs":["D’UN SOUPER QUE CANDIDE ET MARTIN FIRENT AVEC SIX ÉTRANGERS,\nET QUI ILS ÉTAIENT.","Un soir que Candide, suivi de Martin, allait se mettre à table avec\nles étrangers qui logeaient dans la même hôtellerie, un homme à visage\ncouleur de suie l'aborda par derrière, et, le prenant par le bras, lui\ndit: «--Soyez prêt à partir avec nous; n'y manquez pas. Il se\nretourne et voit Cacambo. Il n'y avait que la vue de Cunégonde qui pût\nl'étonner et lui plaire davantage. Il fut sur le point de devenir fou de\njoie. Il embrasse son cher ami. «--Cunégonde est ici, sans\ndoute? où est-elle? Mène-moi vers elle, que je meure de joie avec\nelle.--Cunégonde n'est point ici, dit Cacambo; elle est à\nConstantinople.--Ah ciel! à Constantinople! Mais fût-elle à la\nChine, j'y vole; partons.--Nous partirons après souper, reprit\nCacambo; je ne peux vous en dire davantage; je suis esclave; mon\nmaître m'attend; il faut que j'aille le servir à table. Ne dites mot;\nsoupez, et tenez-vous prêt.» Candide, partagé entre la joie et la\ndouleur, charmé d'avoir revu son agent fidèle, étonné de le voir\nesclave, plein de l'idée de retrouver sa maîtresse, le cœur agité,\nl'esprit bouleversé, se mit à table avec Martin, qui voyait de sang-froid\ntoutes ces aventures, et avec six étrangers qui étaient venus passer\nle carnaval à Venise.","Cacambo, qui versait à boire à l'un de ces étrangers, s'approcha\nde l'oreille de son maître sur la fin du repas et lui dit: «--Sire,\nVotre Majesté partira quand elle voudra; le vaisseau est prêt.» Ayant\ndit ces mots, il sortit. Les convives étonnés se regardaient sans\nproférer une seule parole, lorsqu'un autre domestique, s'approchant\nde son maître, lui dit: «--Sire, la chaise de Votre Majesté est à\nPadoue, et la barque est prête.» Le maître fit un signe, et le domestique\npartit. Tous les convives se regardèrent encore, et la surprise commune\nredoubla. Un troisième valet, s'approchant aussi d'un troisième\nétranger, lui dit: «--Sire, croyez-moi, Votre Majesté ne doit pas\nrester ici plus longtemps; je vais tout préparer.» Et aussitôt il\ndisparut.","Candide et Martin ne doutèrent pas alors que ce ne fût une\nmascarade du carnaval. Un quatrième domestique dit au quatrième\nmaître:--«Votre Majesté partira quand elle voudra, et sortit\ncomme les autres.» Le cinquième valet en dit autant au cinquième\nmaître. Mais le sixième valet parla différemment au sixième étranger,\nqui était auprès de Candide; il lui dit: «--Ma foi, sire, on ne\nveut plus faire crédit à Votre Majesté ni à moi non plus, et nous\npourrions bien être coffrés cette nuit, vous et moi; je vais pourvoir\nà mes affaires: adieu.»","Tous les domestiques ayant disparu, les six étrangers, Candide et\nMartin demeurèrent dans un profond silence. Enfin Candide le rompit:\n«--Messieurs, dit-il, voilà une singulière plaisanterie. Pourquoi\nêtes-vous tous rois? Pour moi, je vous avoue que ni moi ni Martin\nnous ne le sommes.»","Le maître de Cacambo prit alors gravement la parole et dit en\nitalien: «--Je ne suis point plaisant; je m'appelle Achmet III;\nj'ai été grand sultan plusieurs années: je détrônai mon frère; mon\nneveu m'a détrôné; ou a coupé le cou à mes vizirs; j'achève ma vie\ndans le vieux sérail; mon neveu, le grand sultan Mahmoud, me permet\nde voyager quelquefois pour ma santé, et je suis venu passer le\ncarnaval à Venise.»","Un jeune homme qui était auprès d'Achmet parla après lui et dit:\n«--Je m'appelle Ivan; j'ai été empereur de toutes les Russies;\nj'ai été détrôné au berceau; mon père et ma mère ont été enfermés;\non m'a élevé en prison; j'ai quelquefois la permission de voyager,\naccompagné de ceux qui me gardent, et je suis venu passer le carnaval\nà Venise.»","Le troisième dit: «--Je suis Charles-Édouard, roi d'Angleterre;\nmon père m'a cédé ses droits au royaume; j'ai combattu pour les soutenir;\non a arraché le cœur à huit cents de mes partisans, et on leur en a\nbattu les joues; j'ai été mis en prison; je vais à Rome faire une\nvisite au roi mon père, détrôné ainsi que moi et mon grand-père, et je\nsuis venu passer le carnaval a Venise.»","Le quatrième prit alors la parole et dit: «--Je suis roi des\nPolaques; le sort de la guerre m'a privé de mes États héréditaires;\nmon père a éprouvé les mêmes revers: je me résigne à la Providence\ncomme le sultan Achmet, l'empereur Ivan et le roi Charles-Édouard, à\nqui Dieu donne une longue vie, et je suis venu passer le carnaval à\nVenise.»","Le cinquième dit: «--Je suis aussi roi des Polaques; j'ai perdu\nmon royaume deux fois; mais la Providence m'a donné un autre État\ndans lequel j'ai fait plus de bien que tous les rois des Sarmates\nensemble n'en ont jamais pu faire sur les bords de la Vistule. Je me\nrésigne aussi à la Providence, et je suis venu passer le carnaval à\nVenise.»","Il restait au sixième monarque à parler. «Messieurs, dit-il, je ne\nsuis pas si grand seigneur que vous; mais enfin j'ai été roi tout comme\nun autre; je suis Théodore; on m'a élu roi en Corse; on m'a appelé\n_Votre Majesté_, et à présent à peine m'appelle-t-on _Monsieur_;\nj'ai fait frapper de la monnaie, et je ne possède pas un denier; j'ai\neu deux secrétaires d'État, et j'ai à peine un valet; je me suis vu sur\nun trône, et j'ai longtemps été à Londres en prison sur la paille; j'ai\nbien peur d'être traité de même ici, quoique je sois venu, comme Vos\nMajestés, passer le carnaval à Venise.»","Les cinq autres rois écoutèrent ce discours avec une noble\ncompassion. Chacun d'eux donna vingt sequins au roi Théodore pour\navoir des habits et des chemises; Candide lui fit présent d'un diamant\nde deux mille sequins. «Quel est donc, disaient les cinq rois, cet\nhomme qui est en état de donner cent fois autant que chacun de nous,\net qui le donne?»","Dans l'instant qu'on sortait de table, il arriva dans la même\nhôtellerie quatre altesses sérénissimes qui avaient aussi perdu leurs\nÉtats par le sort de la guerre, et qui venaient passer le reste du\ncarnaval à Venise; mais Candide ne prit pas seulement garde à ces\nnouveaux venus. Il n'était occupé que d'aller trouver sa chère\nCunégonde à Constantinople.","[Illustration 63]","[Illustration 64]"]},{"name":"Chapitre 27","paragraphs":["VOYAGE DE CANDIDE À CONSTANTINOPLE.","Le fidèle Cacambo avait déjà obtenu du patron turc qui allait\nreconduire le sultan Achmet à Constantinople qu'il recevrait Candide\net Martin sur son bord. L'un et l'autre s'y rendirent après s'être\nprosternés devant sa misérable Hautesse. Candide, chemin faisant,\ndisait à Martin: «Voilà pourtant six rois détrônés avec qui nous avons\nsoupé! et encore dans ces six rois il y en a un à qui j'ai fait l'aumône.\nPeut-être y a-t-il beaucoup d'autres princes plus infortunés. Pour moi,\nje n'ai perdu que cent moutons, et je vole dans les bras de Cunégonde.\nMon cher Martin, encore une fois, Pangloss avait raison: tout est\nbien.--Je le souhaite, dit Martin.--Mais, dit Candide, voilà\nune aventure bien peu vraisemblable que nous avons eue à Venise. On\nn'avait jamais vu ni ouï conter que six rois détrônés soupassent ensemble\nau cabaret.--Cela n'est pas plus extraordinaire, dit Martin, que\nla plupart des choses qui nous sont arrivées. Il est très commun que\ndes rois soient détrônés; et à l'égard de l'honneur que nous avons eu de\nsouper avec eux, c'est une bagatelle qui ne mérite pas notre attention.»","À peine Candide fut-il dans le vaisseau, qu'il sauta au cou de son\nancien valet, de son ami Cacambo. «Eh bien, lui dit-il, que fait\nCunégonde? est-elle toujours un prodige de beauté? m'aime-t-elle\ntoujours? comment se porte-t-elle? Tu lui as, sans doute, acheté un\npalais à Constantinople?","--Mon cher maître, répondit Cacambo, Cunégonde lave les\nécuelles sur le bord de la Propontide, chez un prince qui a très peu\nd'écuelles; elle est esclave dans la maison d'un ancien souverain,\nnommé Ragotsky, à qui le grand-turc donne trois écus par jour dans son\nasile; mais, ce qui est bien plus triste, c'est qu'elle a perdu sa beauté\net qu'elle est devenue horriblement laide.--Ah! belle ou laide,\ndit Candide, je suis honnête homme, et mon devoir est de l'aimer\ntoujours. Mais comment peut-elle être réduite à un état si abject avec\nles cinq ou six millions que tu avais emportés?--Bon, dit Cacambo,\nne m'en a-t-il pas fallu donner deux au señor don Fernando d'Ibaraa, y\nFigueora, y Mascarenes, y Lampourdos, y Souza, gouverneur de\nBuenos-Ayres, pour avoir la permission de reprendre Mlle Cunégonde, et\nun pirate ne nous a-t-il pas bravement dépouillés de tout le reste? Ce\npirate ne nous a-t-il pas menés au cap de Matapan, à Milo, à Nicarie, à\nSamos, à Petra, aux Dardanelles, à Marmora, à Scutari? Cunégonde et la\nvieille servent chez ce prince dont je vous ai parlé, et moi je suis\nesclave du sultan détrôné.--Que d'épouvantables calamités enchaînées\nles unes aux autres! dit Candide. Mais, après tout, j'ai encore quelques\ndiamants; je délivrerai aisément Cunégonde. C'est bien dommage qu'elle\nsoit devenue si laide!»","Ensuite, se tournant vers Martin: «Qui pensez-vous, dit-il, qui soit\nle plus à plaindre, de l'empereur Achmet, de l'empereur Ivan, du roi\nCharles-Édouard, ou de moi?--Je n'en sais rien, dit Martin; il\nfaudrait que je fusse dans vos cœurs pour le savoir.--Ah!\ndit Candide, si Pangloss était ici, il le saurait et nous\nl'apprendrait.--Je ne sais, dit Martin, avec quelles balances votre\nPangloss aurait pu peser les infortunes des hommes et apprécier leurs\ndouleurs. Tout ce que je présume, c'est qu'il y a des millions d'hommes\nsur la terre, cent fois plus à plaindre que le roi Charles-Édouard,\nl'empereur Ivan et le sultan Achmet.--Cela pourrait bien être,»\ndit Candide.","On arriva en peu de jours sur le canal de la mer Noire. Candide\ncommença par racheter Cacambo fort cher; et, sans perdre de temps, il se\njeta dans une galère, avec ses compagnons, pour aller sur le rivage de\nla Propontide chercher Cunégonde, quelque laide qu'elle pût être.","Il y avait dans la chiourme deux forçats qui ramaient fort mal, et à\nqui le levante patron appliquait de temps ou temps quelques coups de\nnerf de bœuf sur les épaules nues; Candide, par un mouvement naturel,\nles regarda plus attentivement que les autres galériens et s'approcha\nd'eux avec pitié. Quelques traits de leurs visages défigurés lui parurent\navoir un peu de ressemblance avec Pangloss et avec ce malheureux\njésuite, ce baron, ce frère de Mlle Cunégonde. Cette idée l'émut et\nl'attrista. Il les considéra encore plus attentivement. «En vérité,\ndit-il à Cacambo, si je n'avais pas vu pendre maître Pangloss, et si je\nn'avais pas eu le malheur de tuer le baron, je croirais que ce sont eux\nqui rament dans cette galère.»","Au nom du baron et de Pangloss, les deux forçats poussèrent un grand\ncri, s'arrêtèrent sur leur banc et laissèrent tomber leurs rames. Le\nlevante patron accourait sur eux, et les coups de nerf de bœuf\nredoublaient. «Arrêtez! arrêtez! seigneur, s'écria Candide; je vous\ndonnerai tant d'argent que vous voudrez.--Quoi! c'est Candide,\ndisait l'un des forçats.--Quoi! c'est Candide, disait\nl'autre.--Est-ce un songe? dit Candide; veillai-je? suis-je dans\ncette galère? Est-ce là M. le baron, que j'ai tué? est-ce là maître\nPangloss, que j'ai vu pendre?--C'est nous-mêmes, c'est nous-mêmes,\nrépondaient-ils.--Quoi! c'est là ce grand philosophe? disait\nMartin.--Eh! monsieur le levante patron, dit Candide, combien\nvoulez-vous d'argent pour la rançon de M. de Thunder-ten-tronckh, un\ndes premiers barons de l'empire, et de M. Pangloss, le plus profond\nmétaphysicien d'Allemagne?--Chien de chrétien, répondit le levante\npatron, puisque ces deux chiens de forçats chrétiens sont des\nbarons et des métaphysiciens, ce qui est sans doute une grande dignité\ndans leur pays, tu m'en donneras cinquante mille sequins.--Vous\nles aurez, monsieur; ramenez-moi comme un éclair à Constantinople, et\nvous serez payé sur-le-champ. Mais non, menez-moi chez Mlle Cunégonde.»","Le levante patron, sur la première offre de Candide, avait déjà tourné\nla proue vers la ville, et il faisait ramer plus vile qu'un oiseau ne\nfend les airs.","Candide embrassa cent fois le baron et Pangloss.","«Et comment ne vous ai-je pas tué, mon cher baron? et mon cher\nPangloss, comment êtes-vous en vie, après avoir été pendu? et pourquoi\nêtes-vous tous deux aux galères en Turquie?--Est-il bien vrai que\nma chère sœur soit dans ce pays? disait le baron.--Oui, répondait\nCacambo.--Je revois donc mon cher Candide!» s'écriait Pangloss.","Candide leur présentait Martin et Cacambo. Ils s'embrassaient tous;\nils parlaient tous à la fois. La galère volait; ils étaient déjà dans\nle port. On fit venir un juif, à qui Candide vendit pour cinquante mille\nsequins un diamant de la valeur de cent mille, et qui lui jura par\nAbraham qu'il n'en pouvait donner davantage. Il paya incontinent la\nrançon du baron et de Pangloss. Celui-ci se jeta aux pieds de son\nlibérateur et les baigna de larmes; l'autre le remercia par un signe de\ntête et lui promit de lui rendre cet argent à la première occasion.\n«Mais est-il bien possible que ma sœur soit en Turquie?\ndisait-il.--Rien n'est si possible, reprit Cacambo, puisqu'elle\nécure la vaisselle chez un prince de Transylvanie.»","On fit aussitôt venir deux juifs; Candide vendit encore des\ndiamants, et ils repartirent tous dans une autre galère pour aller\ndélivrer Cunégonde.","[Illustration 65]","[Illustration 66]"]},{"name":"Chapitre 28","paragraphs":["CE QUI ARRIVA À CANDIDE, À CUNÉGONDE, À PANGLOSS, À MARTIN, ETC.","«Pardon, encore une fois, dit Candide au baron, pardon, mon révérend\npère, de vous avoir donné un si grand coup d'épée au travers du\ncorps.--N'en parlons plus, dit le baron; je fus un peu trop vif,\nje l'avoue; mais puisque vous voulez savoir par quel hasard vous\nm'avez vu aux galères, je vous dirai qu'après avoir été guéri de ma\nblessure par le frère apothicaire du collège, je fus attaqué et enlevé\npar un parti espagnol; on me mit en prison à Buenos-Ayres dans le\ntemps que ma sœur venait d'en partir. Je demandai à retourner à Rome\nauprès du Père général. Je fus nommé pour aller servir d'aumônier à\nConstantinople auprès de M. l'ambassadeur de France.","Il n'y avait pas huit jours que j'étais entré en fonction, quand je\ntrouvai sur le soir un jeune icoglan très bien fait. Il faisait fort\nchaud: le jeune homme voulut se baigner; je pris cette occasion de me\nbaigner aussi. Je ne savais pas que ce fût un crime capital pour un\nchrétien d'être trouvé tout nu avec un jeune musulman.","Un cadi me fit donner cent coups de bâton sous la plante des pieds\net me condamna aux galères. Je ne crois pas qu'on ait fait une plus\nhorrible injustice. Mais je voudrais bien savoir pourquoi ma sœur est\ndans la cuisine d'un souverain de Transylvanie réfugié chez les Turcs.","--Mais vous, mon cher Pangloss, dit Candide, comment se peut-il\nque je vous revoie?--Il est vrai, dit Pangloss, que vous m'avez vu\npendre; je devais naturellement être brûlé; mais vous vous souvenez\nqu'il plut à verse lorsqu'on allait me cuire: l'orage fut si violent\nqu'on désespéra d'allumer le feu. Je fus pendu, parce qu'on ne put mieux\nfaire; un chirurgien acheta mon corps, m'emporta chez lui et me\ndisséqua. Il me fit d'abord une incision cruciale depuis le nombril\njusqu'à la clavicule.","On ne pouvait pas avoir été plus mal pendu que je l'avais été.\nL'exécuteur des hautes œuvres de la sainte inquisition, lequel était\nsous-diacre, brûlait à la vérité les gens à merveille, mais il n'était\npas accoutumé à pendre. La corde était mouillée et glissa mal; elle fut\nmal nouée; enfin je respirais encore.","L'incision cruciale me fit jeter un si grand cri, que mon chirurgien\ntomba à la renverse; et croyant qu'il disséquait le diable, il s'enfuit\nen mourant de peur et tomba encore sur l'escalier en fuyant. Sa femme\naccourut au bruit, d'un cabinet voisin: elle me vit sur la table étendu\navec mon incision cruciale; elle eut encore plus peur que son mari,\ns'enfuit et tomba sur lui. Quand ils furent un peu revenus à eux,\nj'entendis la chirurgienne qui disait au chirurgien:","«Mon bon, de quoi vous avisez-vous aussi de disséquer un hérétique?\nne savez-vous pas que le diable est toujours dans le corps de ces\ngens-là? je vais vite chercher un prêtre pour l'exorciser.»","Je frémis à ce propos, et je ramassai le peu de forces qui me\nrestaient pour crier: «Avez pitié de moi!» Enfin le barbier portugais\ns'enhardit: il recousit ma peau; sa femme même eut soin de moi; je fus\nsur pied au bout de quinze jours. Le barbier me trouva une condition et\nme fit laquais d'un chevalier de Malte qui allait à Venise; mais mon\nmaître n'ayant pas de quoi me payer, je me mis au service d'un marchand\nvénitien, et je le suivis à Constantinople.","Un jour il me prit fantaisie d'entrer dans une mosquée; il n'y avait\nqu'un vieux iman et une jeune dévote très jolie qui disait ses\npatenôtres; sa gorge était toute découverte: elle avait entre ses deux\ntétons un beau bouquet de tulipes, de roses, d'anémones, de renoncules,\nd'hyacinthes et d'oreilles d'ours: elle laissa tomber son bouquet; je le\nramassai, et je le lui remis avec un empressement très respectueux.","Je fus si longtemps à le lui remettre que l'iman se mit en colère, et\nvoyant que j'étais chrétien, il cria à l'aide.","On me mena chez le cadi, qui me fit donner cent coups de latte sous\nla plante des pieds et m'envoya aux galères. Je fus enchaîné précisément\ndans la même galère et au même banc que M. le baron.","Il y avait dans cette galère quatre jeunes gens de Marseille, cinq\nprêtres napolitains et deux moines de Corfou, qui nous dirent que de\npareilles aventures arrivaient tous les jours. M. le baron prétendait\nqu'il avait essuyé une plus grande injustice que moi; je prétendais,\nmoi, qu'il était beaucoup plus permis de remettre un bouquet sur la\ngorge d'une femme que d'être tout nu avec un icoglan. Nous disputions\nsans cesse, et nous recevions vingt coups de nerf de bœuf par jour,\nlorsque l'enchaînement des événements de cet univers vous a conduit\ndans notre galère, et que vous nous avez rachetés.","--Eh bien! mon cher Pangloss, lui dit Candide, quand vous avez\nété pendu, disséqué, roué de coups, et que vous avez ramé aux galères,\navez-vous toujours pensé que tout allait le mieux du monde?","--Je suis toujours de mon premier sentiment, répondit Pangloss,\ncar enfin je suis philosophe; et il ne me convient pas de me dédire,\nLeibniz ne pouvant pas avoir tort, et l'harmonie préétablie étant\nd'ailleurs la plus belle chose du monde, aussi bien que le plein\net la matière subtile.»","[Illustration 67]","[Illustration 68]"]},{"name":"Chapitre 29","paragraphs":["COMMENT CANDIDE RETROUVA CUNÉGONDE ET LA VIEILLE.","Pendant que Candide, le baron, Pangloss, Martin et Cacambo contaient\nleurs aventures, qu'ils raisonnaient sur les événements contingents ou\nnon contingents de cet univers, qu'ils disputaient sur les effets et les\ncauses, sur le mal moral et sur le mal physique, sur la liberté et la\nnécessité, sur les consolations que l'on peut éprouver lorsqu'on est\naux galères en Turquie, ils abordèrent sur le rivage de la Propontide,\nà la maison du prince de Transylvanie. Les premiers objets qui se\nprésentèrent furent Cunégonde et la vieille, qui étendaient des\nserviettes sur des ficelles pour les faire sécher.","Le baron pâlit à cette vue. Le tendre amant Candide, en voyant sa\nbelle Cunégonde rembrunie, les veux éraillés, la gorge sèche, les joues\nridées, les bras rouges et écaillés, recula trois pas, saisi d'horreur,\net avança ensuite par bon procédé. Elle embrassa Candide et son frère;\non embrassa la vieille; Candide les racheta toutes deux.","Il y avait une petite métairie dans le voisinage; la vieille proposa à\nCandide de s'en accommoder, en attendant que toute la troupe eût une\nmeilleure destinée. Cunégonde ne savait pas qu'elle était enlaidie;\npersonne ne l'en avait avertie: elle fit souvenir Candide de ses\npromesses avec un ton si absolu, que le bon Candide n'osa pas la\nrefuser. Il signifia donc au baron qu'il allait se marier avec sa sœur.","«Je ne souffrirai jamais, dit le baron, une telle bassesse de sa part\net une telle insolence de la vôtre; cette infamie ne me sera jamais\nreprochée: les enfants de ma sœur ne pourraient entrer dans les\nchapitres d'Allemagne. Non, jamais ma sœur n'épousera qu'un\nbaron de l'empire.»","Cunégonde se jeta à ses pieds et les baigna de larmes; il fut\ninflexible.","«Maître fou, lui dit Candide, je t'ai réchappé des galères, j'ai\npayé ta rançon, j'ai payé celle de la sœur; elle lavait ici des écuelles;\nelle est laide; j'ai la bonté d'en faire ma femme, et tu prétends\nencore l'y opposer! je te retuerais si j'en croyais ma colère.","--Tu peux me tuer encore, dit le baron, mais tu n'épouseras\npas ma sœur de mon vivant.»","[Illustration 69]","[Illustration 70]"]},{"name":"Chapitre 30","paragraphs":["CONCLUSION","Candide, dans le fond de son cœur, n'avait aucune envie d'épouser\nCunégonde; mais l'impertinence extrême du baron le déterminait à\nconclure le mariage, et Cunégonde le pressait si vivement qu'il ne\npouvait s'en dédire. Il consulta Pangloss, Martin et le fidéle Cacambo.\nPangloss fit un beau mémoire par lequel il prouvait que le baron n'avait\nnul droit sur sa sœur, et qu'elle pouvait, selon toutes les lois de\nl'empire, épouser Candide de la main gauche. Martin conclut à jeter le\nbaron dans la mer. Cacambo décida qu'il fallait le rendre au levante\npatron et le remettre aux galères, après quoi on l'enverrait à Rome au\nPère général par le premier vaisseau. L'avis fut trouvé fort bon; la\nvieille l'approuva; on n'en dit rien à sa sœur; la chose fut exécutée\npour quelque argent, et l'on eut le plaisir d'attraper un jésuite et de\npunir l'orgueil d'un baron allemand.","Il était tout naturel d'imaginer qu'après tant de désastres Candide,\nmarié avec sa maîtresse et vivant avec le philosophe Pangloss, le\nphilosophe Martin, le prudent Cacambo et la vieille, ayant d'ailleurs\nrapporté tant de diamants de la patrie des anciens Incas, mènerait\nla vie du monde la plus agréable: mais il fut tant friponné par les\njuifs, qu'il ne lui resta plus rien que sa petite métairie; sa femme\ndevenant tous les jours plus laide, devint acariâtre et insupportable;\nla vieille était infirme et fut encore de plus mauvaise humeur que\nCunégonde. Cacambo, qui travaillait au jardin et qui allait vendre des\nlégumes à Constantinople, était excédé de travail et maudissait sa\ndestinée. Pangloss était au désespoir de ne pas briller dans quelque\nuniversité d'Allemagne. Pour Martin, il était fermement persuadé\nqu'on est également mal partout; il prenait les choses en patience.\nCandide, Martin et Pangloss disputaient quelquefois de métaphysique\net de morale. Un voyait souvent passer sous les fenêtres de la métairie\ndes bateaux chargés d'effendis, de bachas, de cadis, qu'on envoyait\nen exil à Lemnos, à Mitylène, à Erzeroum; on voyait venir d'autres\ncadis, d'autres bachas, d'autres effendis, qui prenaient la place des\nexpulsés et qui étaient expulsés à leur tour; on voyait des têtes\nproprement empaillées qu'on allait présenter à la sublime Porte. Ces\nspectacles faisaient redoubler les dissertations; et quand on ne\ndisputait pas, l'ennui était si excessif que la vieille osa un jour leur\ndire: «Je voudrais savoir lequel est le pire, ou d'être violée cent fois\npar des pirates nègres, d'avoir une fesse coupée, de passer par les\nbaguettes chez les Bulgares, d'être fouetté et pendu dans un auto-da-fé,\nd'être disséqué, de ramer aux galères, d'éprouver enfin toutes les\nmisères par lesquelles nous avons tous passé, ou bien de rester ici à\nne rien faire.--C'est une grande question,» dit Candide.","Ce discours fit naître de nouvelles réflexions, et Martin surtout\nconclut que l'homme était né pour vivre dans les convulsions de\nl'inquiétude ou dans la léthargie de l'ennui. Candide n'en convenait\npas; mais il n'assurait rien. Pangloss avouait qu'il avait toujours\nhorriblement souffert: mais ayant soutenu une fois que tout allait\nà merveille, il le soutenait toujours et n'en croyait rien.","Une chose acheva de confirmer Martin dans ses détestables principes,\nde faire hésiter plus que jamais Candide et d'embarrasser Pangloss.\nC'est qu'ils virent un jour aborder dans leur métairie Paquette et le\nfrère Giroflée, qui étaient dans la plus extrême misère; ils avaient\nbien vite mangé leurs trois mille piastres, s'étaient quittés, s'étaient\nraccommodés, s'étaient brouillés, avaient été mis en prison, s'étaient\nenfuis, et enfin frère Giroflée s'était fait Turc. Paquette continuait\nson métier partout et n'y gagnait plus rien.","«--Je l'avais bien prévu, dit Martin à Candide, que vos présents\nseraient bientôt dissipés et ne les rendraient que plus misérables.\nVous avez regorgé de millions de piastres, vous et Cacambo, et vous\nn'êtes pas plus heureux que frère Giroflée et Paquette.--Ah! ah!\ndit Pangloss à Paquette, le ciel vous ramène donc ici parmi nous, ma\npauvre enfant! savez-vous bien que vous m'avez coûté le bout du nez,\nun œil et une oreille! Comme vous voilà faite! eh! qu'est-ce que ce\nmonde?» Cette nouvelle aventure les engagea à philosopher plus que\njamais.","Il y avait dans le voisinage un derviche très fameux qui passait pour\nle meilleur philosophe de la Turquie; ils allèrent le consulter;\nPangloss porta la parole et lui dit:","«Maître, nous venons vous prier de nous dire pourquoi un aussi\nétrange animal que l'homme a été formé.","--De quoi te mêles-tu? lui dit le derviche; est-ce là ton\naffaire?--Mais, mon révérend père, dit Candide, il y a horriblement\nde mal sur la terre.--Qu'importe, dit le derviche, qu'il y ait du\nbien ou du mal? Quand Sa Hautesse envoie un vaisseau en Égypte,\ns'embarrasse-t-elle si les souris qui sont dans le vaisseau sont\nà leur aise ou non?--Que faut-il donc faire? dit Pangloss.--Te\ntaire, dit le derviche.--Je me flattais, dit Pangloss, de raisonner\nun peu avec vous des effets et des causes, du meilleur des mondes\npossibles, de l'origine du mal, de la nature de l'âme et de l'harmonie\npréétablie.» Le derviche, à ces mots, leur ferma la porte au nez.","Pendant cette conversation, la nouvelle s'était répandue qu'on\nvenait d'étrangler à Constantinople deux vizirs du banc et le mufti,\net qu'on avait empalé plusieurs de leurs amis. Cette catastrophe faisait\npartout un grand bruit pendant quelques heures. Pangloss, Candide et\nMartin, en retournant à la petite métairie, rencontrèrent un bon\nvieillard qui prenait le frais à sa porte sous un berceau d'orangers.\nPangloss, qui était aussi curieux que raisonneur, lui demanda comment\nse nommait le mufti qu'on venait d'étrangler.","«Je n'en sais rien, répondit le bonhomme, et je n'ai jamais su le nom\nd'aucun mufti ni d'aucun vizir. J'ignore absolument l'aventure dont\nvous me parlez; je présume qu'en général ceux qui se mêlent des affaires\npubliques périssent quelquefois misérablement, et qu'ils le méritent;\nmais je ne m'informe jamais de ce qu'on fait à Constantinople; je me\ncontente d'y envoyer vendre les fruits du jardin que je cultive.»","Ayant dit ces mots, il fit entrer les étrangers dans sa maison; ses\ndeux filles et ses deux fils leur présentèrent plusieurs sortes de\nsorbets qu'ils faisaient eux-mêmes, du kaïmak piqué d'écorces de cédrat\nconfit, des oranges, des citrons, des limons, des ananas, des pistaches,\ndu café de Moka qui n'était point mêlé avec le mauvais café de Batavia\net des îles. Après quoi les deux filles de ce bon musulman parfumèrent\nles barbes de Candide, de Pangloss et de Martin.","«Vous devez avoir, dit Candide au Turc, une vaste et magnifique\nterre?--Je n'ai que vingt arpents, répondit le Turc; je les cultive\navec mes enfants; le travail éloigne de nous trois grands maux: l'ennui,\nle vice et le besoin.»","Candide, en retournant dans sa métairie, fit de profondes réflexions\nsur le discours du Turc. Il dit à Pangloss et à Martin: «Ce bon vieillard\nme paraît s'être fait un sort bien préférable à celui des six rois avec\nqui nous avons eu l'honneur de souper.--Les grandeurs, dit\nPangloss, sont fort dangereuses, selon le rapport de tous les\nphilosophes, car enfin Églon, roi des Moabites, fut assassiné par\nAod; Absalon fut pendu par les cheveux et percé de trois dards; le roi\nNadab, fils de Jéroboam, fut tué par Baasa; le roi Éla, par Zambri;\nOchosias, par Jéhu; Athalie, par Joïada; les rois Joachim, Jéchonias,\nSédécias, furent esclaves. Vous savez comment périrent Crésus,\nAstyage, Darius, Denis de Syracuse, Pyrrhus, Persée, Annibal, Jugurtha,\nArioviste, César, Pompée, Néron, Othon, Vitellius, Domitien, Richard II\nd'Angleterre, Édouard II, Henri VI, Richard III, Marie Stuart, Charles\nler, les trois Henri de France, l'empereur Henri IV? Vous\nsavez....--Je sais aussi, dit Candide, qu'il faut cultiver notre\njardin.--Vous avez raison, dit Pangloss, car quand l'homme fut\nmis dans le jardin d'Éden, il y fut mis _ut operaretur eum_, pour\nqu'il travaillât, ce qui prouve que l'homme n'est pas né pour le\nrepos.--Travaillons sans raisonner, dit Martin: c'est le seul\nmoyen de rendre la vie supportable.»","Toute la petite société entra dans ce louable dessein; chacun se\nmit à exercer ses talents. La petite terre rapporta beaucoup. Cunégonde\nétait, à la vérité, bien laide; mais elle devint une excellente\npâtissière; Paquette broda; la vieille eut soin du linge. Il n'y eut pas\njusqu'à frère Giroflée qui ne rendit service; il fut un très bon\nmenuisier, et même devint honnête homme, et Pangloss disait\nquelquefois à Candide:","«Tous les événements sont enchaînés dans le meilleur des mondes\npossible; car enfin, si vous n'aviez pas été chassé d'un beau château\nà grands coups de pied dans le derrière pour l'amour de Mlle Cunégonde,\nsi vous n'aviez pas été mis à l'inquisition, si vous n'aviez pas couru\nl'Amérique à pied, si vous n'aviez pas donné un bon coup d'épée au\nbaron, si vous n'aviez pas perdu tous vos moutons du bon pays\nd'Eldorado, vous ne mangeriez pas ici des cédrats confits et des\npistaches.--Cela et bien dit, répondit Candide, mais il faut\ncultiver note jardin.»","[Illustration 71]","COLLABORATEURS","Les dix compositions hors texte de cet ouvrage ont été gravées à\nl'eau-forte par","D. MORDANT","Les soixante-deux vignettes ont été gravées sur bois par","JULES HUYOT","L'impression typographique a été exécutée sur les presses à bras de","A. LAHURE","Le tirage des eaux-fortes a été fait par les soins de la Maison","CH. WITTMANN","Le papier a été fabriqué par les _Papeteries du Marais._","Les encres on été fournies par la Maison CH. LORILLEUX."]}]</script>
<script>'use strict';
const $=id=>document.getElementById(id);
const KEY='ophelia-candide-original-francais-reader-v1';
const state={page:0,size:20,night:false,bookmark:-1};
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let pages=[],sections=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function countWords(text){return (text.match(/\S+/g)||[]).length;}
function paginate(parts){
 const result=[];
 for(let section=0;section<parts.length;section++){
  let group=[],words=0;
  const flush=()=>{if(group.length){result.push({section,paragraphs:group});group=[];words=0}};
  for(const par of parts[section].paragraphs){
   const size=countWords(par);
   if(words+size>300&&group.length)flush();
   if(size>350){
    
    const lines=par.split('\n');let chunk='',n=0;
    for(const line of lines){const w=countWords(line);if(n+w>290&&chunk){group.push(chunk);flush();chunk='';n=0}chunk+=(chunk?'\n':'')+line;n+=w}
    if(chunk){group.push(chunk);words+=n}
   }else{group.push(par);words+=size}
  }
  flush();
 }
 return result;
}
function render(scroll=true){
 if(!pages.length)return;
 state.page=Math.min(Math.max(0,Number(state.page)||0),pages.length-1);
 const page=pages[state.page],part=sections[page.section];
 const box=$('reading');box.replaceChildren();
 const heading=document.createElement('h2');heading.textContent=part.name;box.append(heading);
 for(const paragraph of page.paragraphs){const p=document.createElement('p');p.lang='fr';p.className='notranslate';p.setAttribute('translate','no');p.textContent=paragraph;box.append(p)}
 $('section').value=String(page.section);
 $('pages').textContent='Page '+(state.page+1)+' / '+pages.length;
 const percent=Math.round((state.page+1)/pages.length*100);
 $('progress').textContent=percent+' % lu';$('bar').style.width=percent+'%';
 $('prev').disabled=state.page===0;$('next').disabled=state.page===pages.length-1;
 $('bookmark').textContent=state.bookmark===state.page?'♥ Signet':'♡ Signet';
 document.documentElement.style.setProperty('--size',state.size+'px');
 document.body.classList.toggle('night',state.night);
 save();
 if(scroll)document.querySelector('article').scrollIntoView({behavior:'instant',block:'start'});
}
$('prev').onclick=()=>{if(state.page>0){state.page--;render()}};
$('next').onclick=()=>{if(state.page<pages.length-1){state.page++;render()}};
$('section').onchange=()=>{const p=pages.findIndex(page=>page.section===Number($('section').value));if(p>=0){state.page=p;render()}};
$('smaller').onclick=()=>{state.size=Math.max(15,state.size-1);render(false)};
$('larger').onclick=()=>{state.size=Math.min(30,state.size+1);render(false)};
$('dark').onclick=()=>{state.night=!state.night;render(false)};
$('bookmark').onclick=()=>{state.bookmark=state.page;save();render(false);$('message').textContent='Signet enregistré à la page '+(state.page+1)};
$('return').onclick=()=>{if(state.bookmark>=0){state.page=state.bookmark;render()}else $('message').textContent='Aucun signet enregistré.'};
document.addEventListener('keydown',e=>{if(e.target.closest('button,select,input'))return;if(e.key==='ArrowRight'&&state.page<pages.length-1){state.page++;render()}else if(e.key==='ArrowLeft'&&state.page>0){state.page--;render()}});

sections=JSON.parse($('texte').textContent);
pages=paginate(sections);
$('section').replaceChildren(...sections.map((part,i)=>new Option(part.name,i)));
render(false);
</script></body></html>
