<script type="application/json" id="texte">[{"name":"Frontespizio","paragraphs":["C. COLLODI","Le\nAvventure\ndi\nPinocchio","Storia di un burattino","illustrata\nda\nCARLO CHIOSTRI","Incisioni di A. BONGINI","Nuova edizione","FIRENZE\nR. Bemporad & Figlio — Editori.","PROPRIETÀ LETTERARIA\nDEGLI EDITORI R. BEMPORAD & FIGLIO","12 — 1902. — Tip. di V. Sieni, Corso de' Tintori, Firenze."]},{"name":"Capitolo 1","paragraphs":["Come andò che Maestro Ciliegia, falegname trovò un pezzo di legno che\npiangeva e rideva come un bambino.","— C'era una volta....","— Un re! — diranno subito i miei piccoli lettori.","— No, ragazzi, avete sbagliato. C'era una volta un pezzo di legno.","Non era un legno di lusso, ma un semplice pezzo da catasta, di quelli\nche d'inverno si mettono nelle stufe e nei caminetti per accendere il\nfuoco e per riscaldare le stanze.","Non so come andasse, ma il fatto gli è che un bel giorno questo pezzo\ndi legno capitò nella bottega di un vecchio falegname, il quale aveva\nnome mastr'Antonio, se non che tutti lo chiamavano maestro Ciliegia,\nper via della punta del suo naso, che era sempre lustra e paonazza,\ncome una ciliegia matura.","[Illustrazione: .... sentì una vocina sottile sottile.]","Appena maestro Ciliegia ebbe visto quel pezzo di legno, si rallegrò\ntutto; e dandosi una fregatina di mani per la contentezza, borbottò a\nmezza voce:","— Questo legno è capitato a tempo; voglio servirmene per fare una gamba\ndi tavolino. —","Detto fatto, prese subito l'ascia arrotata per cominciare a levargli la\nscorza e a digrossarlo; ma quando fu lì per lasciare andare la prima\nasciata, rimase col braccio sospeso in aria, perchè sentì una vocina\nsottile sottile, che disse raccomandandosi:","— Non mi picchiar tanto forte! —","Figuratevi come rimase quel buon vecchio di maestro Ciliegia!","Girò gli occhi smarriti intorno alla stanza per vedere di dove mai\npoteva essere uscita quella vocina, e non vide nessuno! Guardò sotto il\nbanco, e nessuno: guardò dentro un armadio che stava sempre chiuso, e\nnessuno; guardò nel corbello dei trucioli e della segatura, e nessuno;\naprì l'uscio di bottega per dare un'occhiata anche sulla strada, e\nnessuno. O dunque?...","— Ho capito; — disse allora ridendo e grattandosi la parrucca —\nsi vede che quella vocina me la son figurata io. Rimettiamoci a\nlavorare. —","E ripresa l'ascia in mano, tirò giù un solennissimo colpo sul pezzo di\nlegno.","— Ohi! tu m'hai fatto male! — gridò rammaricandosi la solita vocina.","Questa volta maestro Ciliegia restò di stucco, cogli occhi fuori del\ncapo per la paura, colla bocca spalancata e colla lingua giù ciondoloni\nfino al mento, come un mascherone da fontana.","Appena riebbe l'uso della parola, cominciò a dire tremando e\nbalbettando dallo spavento:","— Ma di dove sarà uscita questa vocina che ha detto ohi?... Eppure qui\nnon c'è anima viva. Che sia per caso questo pezzo di legno che abbia\nimparato a piangere e a lamentarsi come un bambino? Io non lo posso\ncredere. Questo legno eccolo qui; è un pezzo di legno da caminetto,\ncome tutti gli altri, e a buttarlo sul fuoco, c'è da far bollire una\npentola di fagioli.... O dunque? Che ci sia nascosto dentro qualcuno?\nSe c'è nascosto qualcuno, tanto peggio per lui. Ora l'accomodo\nio! —","E così dicendo, agguantò con tutt'e due le mani quel povero pezzo di\nlegno, e si pose a sbatacchiarlo senza carità contro le pareti della\nstanza.","Poi si messe in ascolto, per sentire se c'era qualche vocina che si\nlamentasse. Aspettò due minuti, e nulla; cinque minuti, e nulla; dieci\nminuti, e nulla!","— Ho capito — disse allora sforzandosi di ridere e arruffandosi la\nparrucca — si vede che quella vocina che ha detto _ohi_, me la son\nfigurata io! Rimettiamoci a lavorare. —","E perchè gli era entrato addosso una gran paura, si provò a\ncanterellare per farsi un po' di coraggio.","Intanto, posata da una parte l'ascia, prese in mano la pialla, per\npiallare e tirare a pulimento il pezzo di legno; ma nel mentre che lo\npiallava in su e in giù, sentì la solita vocina che gli disse ridendo:","— Smetti! tu mi fai il pizzicorino sul corpo! —","Questa volta il povero maestro Ciliegia cadde giù come fulminato.\nQuando riaprì gli occhi, si trovò seduto per terra.","Il suo viso pareva trasfigurito, e perfino la punta del naso, di\npaonazza come era quasi sempre, gli era diventata turchina dalla gran\npaura."]},{"name":"Capitolo 2","paragraphs":["Maestro Ciliegia regala il pezzo di legno al suo amico Geppetto, il\nquale lo prende per fabbricarsi un burattino maraviglioso, che sappia\nballare, tirar di scherma e fare i salti mortali.","In quel punto fu bussato alla porta.","— Passate pure, — disse il falegname, senza aver la forza di rizzarsi\nin piedi.","[Illustrazione: Un vecchietto tutto arzillo, il quale aveva\nnome Geppetto.]","Allora entrò in bottega un vecchietto tutto arzillo, il quale aveva\nnome Geppetto; ma i ragazzi del vicinato, quando lo volevano far\nmontare su tutte le furie, lo chiamavano col soprannome di Polendina,\na motivo della sua parrucca gialla, che somigliava moltissimo alla\npolendina di granturco.","Geppetto era bizzosissimo. Guai a chiamarlo Polendina! Diventava subito\nuna bestia, e non c'era più verso di tenerlo.","— Buon giorno, mastr'Antonio, — disse Geppetto. — Che cosa fate costì\nper terra?","— Insegno l'abbaco alle formicole.","— Buon pro vi faccia.","— Chi vi ha portato da me, compar Geppetto?","— Le gambe. Sappiate, mastr'Antonio, che son venuto da voi, per\nchiedervi un favore.","— Eccomi qui, pronto a servirvi, — replicò il falegname rizzandosi su\ni ginocchi.","— Stamani m'è piovuta nel cervello un'idea.","— Sentiamola.","— Ho pensato di fabbricarmi da me un bel burattino di legno: ma un\nburattino maraviglioso, che sappia ballare, tirar di scherma e fare\ni salti mortali. Con questo burattino voglio girare il mondo, per\nbuscarmi un tozzo di pane e un bicchier di vino: che ve ne pare?","— Bravo Polendina! — gridò la solita vocina, che non si capiva di dove\nuscisse.","A sentirsi chiamar Polendina, compar Geppetto diventò rosso come\nun peperone dalla bizza, e voltandosi verso il falegname, gli disse\nimbestialito:","— Perchè mi offendete?","— Chi vi offende?","— Mi avete detto Polendina!","— Non sono stato io.","— Sta' un po' a vedere che sarò stato io! Io dico che siete stato voi.","— No!","— Sì!","— No!","— Sì! —","E riscaldandosi sempre più, vennero dalle parole ai fatti,\ne acciuffatisi fra di loro, si graffiarono, si morsero e si\nsbertucciarono.","Finito il combattimento, mastr'Antonio si trovò fra le mani la parrucca\ngialla di Geppetto, e Geppetto si accòrse di avere in bocca la parrucca\nbrizzolata del falegname.","— Rendimi la mia parrucca! — gridò mastr'Antonio.","— E tu rendimi la mia, e rifacciamo la pace. —","I due vecchietti, dopo aver ripreso ognuno di loro la propria parrucca,\nsi strinsero la mano e giurarono di rimanere buoni amici per tutta la\nvita.","— Dunque, compar Geppetto, — disse il falegname in segno di pace fatta\n— qual è il piacere che volete da me?","— Vorrei un po' di legno per fabbricare il mio burattino; me lo\ndate? —","Mastr'Antonio, tutto contento, andò subito a prendere sul banco quel\npezzo del legno che era stato cagione a lui di tante paure. Ma quando\nfu lì per consegnarlo all'amico, il pezzo di legno dette uno scossone,\ne sgusciandogli violentemente dalle mani, andò a battere con forza\nnegli stinchi impresciuttiti del povero Geppetto.","— Ah! gli è con questo bel garbo, mastr'Antonio, che voi regalate la\nvostra roba? M'avete quasi azzoppito!...","— Vi giuro che non sono stato io!","— Allora sarò stato io!...","— La colpa è tutta di questo legno....","— Lo so che è del legno: ma siete voi che me l'avete tirato nelle gambe!","— Io non ve l'ho tirato!","— Bugiardo!","— Geppetto, non mi offendete: se no vi chiamo Polendina!...","— Asino!","— Polendina!","— Somaro!","— Polendina!","— Brutto scimmiotto!","— Polendina! —","A sentirsi chiamar Polendina per la terza volta, Geppetto perse il lume\ndegli occhi, si avventò sul falegname e lì se ne dettero un sacco e una\nsporta.","A battaglia finita, mastr'Antonio si trovò due graffi di più sul naso,\ne quell'altro due bottoni di meno al giubbetto. Pareggiati in questo\nmodo i loro conti, si strinsero la mano e giurarono di rimanere buoni\namici per tutta la vita.","Intanto Geppetto prese con sè il suo bravo pezzo di legno, e\nringraziato mastr'Antonio, se ne tornò zoppicando a casa."]},{"name":"Capitolo 3","paragraphs":["Geppetto, tornato a casa, comincia subito a fabbricarsi il burattino e\ngli mette il nome di Pinocchio. Prime monellerie del burattino.","La casa di Geppetto era una stanzina terrena, che pigliava luce da un\nsottoscala. La mobilia non poteva esser più semplice: una seggiola\ncattiva, un letto poco buono e un tavolino tutto rovinato. Nella\nparete di fondo si vedeva un caminetto col fuoco acceso; ma il fuoco\nera dipinto, e accanto al fuoco c'era dipinta una pentola che bolliva\nallegramente e mandava fuori una nuvola di fumo, che pareva fumo\ndavvero.","Appena entrato in casa, Geppetto prese subito gli arnesi e si pose a\nintagliare e a fabbricare il suo burattino.","— Che nome gli metterò? — disse fra sè e sè. — Lo voglio chiamar\nPinocchio. Questo nome gli porterà fortuna. Ho conosciuto una famiglia\nintera di Pinocchi: Pinocchio il padre, Pinocchia la madre e Pinocchi\ni ragazzi, e tutti se la passavano bene. Il più ricco di loro chiedeva\nl'elemosina.","Quando ebbe trovato il nome al suo burattino, allora cominciò a\nlavorare a buono, e gli fece subito i capelli, poi la fronte, poi gli\nocchi.","Fatti gli occhi, figuratevi la sua maraviglia quando si accòrse che gli\nocchi si movevano e che lo guardavano fisso fisso.","[Illustrazione: Più lo ritagliava e lo scorciva, e più quel\nnaso impertinente diventava lungo.]","Geppetto vedendosi guardare da quei due occhi di legno, se n'ebbe quasi\nper male, e disse con accento risentito:","— Occhiacci di legno, perchè mi guardate? —","Nessuno rispose.","Allora, dopo gli occhi gli fece il naso; ma il naso, appena fatto,\ncominciò a crescere: e cresci, cresci, cresci, diventò in pochi minuti\nun nasone che non finiva mai.","Il povero Geppetto si affaticava a ritagliarlo; ma più lo ritagliava e\nlo scorciva, e più quel naso impertinente diventava lungo.","Dopo il naso gli fece la bocca.","La bocca non era ancora finita di fare, che cominciò subito a ridere e\na canzonarlo.","— Smetti di ridere! — disse Geppetto impermalito; ma fu come dire al\nmuro.","— Smetti di ridere, ti ripeto! — urlò con voce minacciosa.","Allora la bocca smesse di ridere, ma cacciò fuori tutta la lingua.","Geppetto, per non guastare i fatti suoi, finse di non avvedersene, e\ncontinuò a lavorare. Dopo la bocca gli fece il mento, poi il collo, poi\nle spalle, lo stomaco, le braccia e le mani.","Appena finite le mani, Geppetto sentì portarsi via la parrucca dal\ncapo. Si voltò in su, e che cosa vide? Vide la sua parrucca gialla in\nmano del burattino.","— Pinocchio!... rendimi subito la mia parrucca! —","E Pinocchio, invece di rendergli la parrucca, se la messe in capo per\nsè, rimanendovi sotto mezzo affogato.","A quel garbo insolente e derisorio, Geppetto si fece tristo e\nmelanconico, come non era stato mai in vita sua: e voltandosi verso\nPinocchio, gli disse:","— Birba d'un figliuolo! Non sei ancora finito di fare, e già cominci a\nmancar di rispetto a tuo padre! Male, ragazzo mio, male! —","[Illustrazione: E Pinocchio, invece di rendergli la parrucca,\nse la messe in capo per sè....]","E si rasciugò una lacrima.","Restavano sempre da fare le gambe e i piedi.","Quando Geppetto ebbe finito di fargli i piedi, sentì arrivarsi un\ncalcio sulla punta del naso.","— Me lo merito — disse allora fra sè. — Dovevo pensarci prima! Ormai è\ntardi! —","Poi prese il burattino sotto le braccia e lo posò in terra, sul\npavimento della stanza, per farlo camminare.","Pinocchio aveva le gambe aggranchite e non sapeva muoversi, e Geppetto\nlo conduceva per la mano per insegnargli a mettere un passo dietro\nl'altro.","[Illustrazione: — Piglialo! piglialo! — urlava Geppetto.]","Quando le gambe gli si furono sgranchite, Pinocchio cominciò a\ncamminare da sè e a correre per la stanza; finchè, infilata la porta di\ncasa, saltò nella strada e si dètte a scappare.","E il povero Geppetto a corrergli dietro senza poterlo raggiungere,\nperchè quel birichino di Pinocchio andava a salti come una lepre, e\nbattendo i suoi piedi di legno sul lastrico della strada, faceva un\nfracasso come venti paia di zoccoli da contadini.","— Piglialo! piglialo! — urlava Geppetto; ma la gente che era per la\nvia, vedendo questo burattino di legno, che correva come un barbero,\nsi fermava incantata a guardarlo, e rideva, rideva e rideva, da non\npoterselo figurare.","Alla fine, e per buona fortuna, capitò un carabiniere il quale,\nsentendo tutto quello schiamazzo, e credendo si trattasse di un puledro\nche avesse levata la mano al padrone, si piantò coraggiosamente a gambe\nlarghe in mezzo alla strada, con l'animo risoluto di fermarlo e di\nimpedire il caso di maggiori disgrazie.","Ma Pinocchio, quando si avvide da lontano del carabiniere, che\nbarricava tutta la strada, s'ingegnò di passargli, per sorpresa,\nframezzo alle gambe, e invece fece fiasco.","Il carabiniere, senza punto smuoversi lo acciuffò pulitamente per il\nnaso (era un nasone spropositato, che pareva fatto apposta per essere\nacchiappato dai carabinieri) e lo riconsegnò nelle proprie mani di\nGeppetto; il quale, a titolo di correzione, voleva dargli subito\nuna buona tiratina d'orecchi. Ma figuratevi come rimase, quando nel\ncercargli gli orecchi non gli riuscì di poterli trovare: e sapete\nperchè? perchè, nella furia di scolpirlo, si era dimenticato di\nfarglieli.","[Illustrazione: Lo acciuffò pulitamente per il naso....]","Allora lo prese per la collottola, e, mentre lo riconduceva indietro,\ngli disse tentennando minacciosamente il capo:","— Andiamo subito a casa. Quando saremo a casa, non dubitare che faremo\ni nostri conti! —","Pinocchio, a questa antifona, si buttò per terra, e non volle più\ncamminare. Intanto i curiosi e i bighelloni principiavano a fermarsi lì\ndintorno e a far capannello.","Chi ne diceva una, chi un'altra.","— Povero burattino! — dicevano alcuni — ha ragione a non voler\ntornare a casa! Chi lo sa come lo picchierebbe quell'omaccio di\nGeppetto!... —","E gli altri soggiungevano malignamente:","— Quel Geppetto pare un galantuomo! ma è un vero tiranno, coi ragazzi!\nSe gli lasciano quel povero burattino fra le mani, è capacissimo di\nfarlo a pezzi! —","Insomma, tanto dissero e tanto fecero, che il carabiniere rimesse in\nlibertà Pinocchio, e condusse in prigione quel pover'uomo di Geppetto.\nIl quale non avendo parole lì per lì per difendersi, piangeva come un\nvitellino, e nell'avviarsi verso il carcere, balbettava singhiozzando:","— Sciagurato figliuolo! E pensare che ho penato tanto a farlo\nun burattino per bene! Ma mi sta il dovere! Dovevo pensarci\nprima!... —","Quello che accadde dopo, è una storia così strana, da non potersi quasi\ncredere, e ve la racconterò in quest'altri capitoli."]},{"name":"Capitolo 4","paragraphs":["La storia di Pinocchio col Grillo-parlante, dove si vede come i ragazzi\ncattivi hanno a noja di sentirsi correggere da chi ne sa più di loro.","Vi dirò dunque, ragazzi, che mentre il povero Geppetto era condotto\nsenza sua colpa in prigione, quel monello di Pinocchio, rimasto libero\ndalle grinfie del carabiniere, se la dava a gambe giù attraverso ai\ncampi, per far più presto a tornarsene a casa; e nella gran furia del\ncorrere saltava greppi altissimi, siepi di pruni e fossi pieni d'acqua,\ntale e quale come avrebbe potuto fare un capretto o un leprottino\ninseguito dai cacciatori.","Giunto dinanzi a casa, trovò l'uscio di strada socchiuso. Lo spinse,\nentrò dentro, e appena ebbe messo tanto di paletto, si gettò a sedere\nper terra, lasciando andare un gran sospirone di contentezza.","Ma quella contentezza durò poco, perchè sentì nella stanza qualcuno che\nfece:","— Crì-crì-crì!","— Chi è che mi chiama? — disse Pinocchio tutto impaurito.","— Sono io! —","Pinocchio si voltò, e vide un grosso grillo che saliva lentamente su su\nper il muro.","— Dimmi, Grillo, e tu chi sei?","— Io sono il Grillo-parlante, e abito in questa stanza da più di\ncent'anni.","— Oggi però questa stanza è mia, — disse il burattino — e se vuoi farmi\nun vero piacere, vattene subito, senza nemmeno voltarti indietro.","— Io non me ne anderò di qui, — rispose il Grillo — se prima non ti\navrò detto una gran verità.","— Dimmela, e spicciati.","— Guai a quei ragazzi che si ribellano ai loro genitori, e che\nabbandonano capricciosamente la casa paterna. Non avranno mai bene in\nquesto mondo; e prima o poi dovranno pentirsene amaramente.","— Canta pure, Grillo mio, come ti pare e piace: ma io so che domani,\nall'alba, voglio andarmene di qui, perchè se rimango qui, avverrà a me\nquel che avviene a tutti gli altri ragazzi, vale a dire mi manderanno\na scuola, e per amore o per forza mi toccherà a studiare; e io, a\ndirtela in confidenza, di studiare non ho punta voglia e mi diverto più\na correre dietro alle farfalle e a salire su per gli alberi a prendere\ngli uccellini di nido.","— Povero grullerello!... Ma non sai che, facendo così, diventerai da\ngrande un bellissimo somaro, e che tutti si piglieranno gioco di te?","— Chetati, grillaccio del mal'augurio! — gridò Pinocchio.","Ma il grillo, che era paziente e filosofo, invece di aversi a male di\nquesta impertinenza, continuò con lo stesso tono di voce:","— E se non ti garba di andare a scuola, perchè non impari almeno un\nmestiere tanto da guadagnarti onestamente un pezzo di pane?","— Vuoi che te lo dica? — replicò Pinocchio, che cominciava a perdere\nla pazienza. — Fra i mestieri del mondo non ce n'è che uno solo, che\nveramente mi vada a genio.","— E questo mestiere sarebbe?","— Quello di mangiare, bere, dormire, divertirmi, e fare dalla mattina\nalla sera la vita del vagabondo.","— Per tua regola — disse il Grillo-parlante con la sua solita calma —\ntutti quelli che fanno codesto mestiere, finiscono quasi sempre allo\nspedale o in prigione.","— Bada, grillaccio del mal'augurio!... se mi monta la bizza, guai a\nte! —","— Povero Pinocchio: mi fai proprio compassione!...","— Perchè ti faccio compassione?","— Perchè sei un burattino e, quel che è peggio, perchè hai la testa di\nlegno. —","[Illustrazione: Preso di sul banco un martello di legno, lo\nscagliò contro il Grillo-parlante.]","A queste ultime parole, Pinocchio saltò su tutt'infuriato, e preso di\nsul banco un martello di legno, lo scagliò contro il Grillo-parlante.","Forse non credeva nemmeno di colpirlo; ma disgraziatamente lo colse per\nl'appunto nel capo, tanto che il povero Grillo ebbe appena il fiato\ndi fare _crì-crì-crì_, e poi rimase lì stecchito e appiccicato alla\nparete."]},{"name":"Capitolo 5","paragraphs":["Pinocchio ha fame e cerca un uovo per farsi una frittata; ma sul più\nbello, la frittata gli vola via dalla finestra.","Intanto cominciò a farsi notte, e Pinocchio, ricordandosi che non\naveva mangiato nulla, sentì un'uggiolina allo stomaco, che somigliava\nmoltissimo all'appetito.","Ma l'appetito dei ragazzi cammina presto, e difatti, dopo pochi\nminuti l'appetito diventò fame, e la fame, dal vedere al non vedere si\nconvertì in una fame da lupi, in una fame da tagliarsi col coltello.","Il povero Pinocchio corse subito al focolare dove c'era una pentola che\nbolliva, e fece l'atto di scoperchiarla, per vedere che cosa ci fosse\ndentro: ma la pentola era dipinta sul muro. Immaginatevi come restò. Il\nsuo naso, che era già lungo, gli diventò più lungo almeno quattro dita.","Allora si dètte a correre per la stanza e a frugare per tutte le\ncassette e per tutti i ripostigli in cerca di un po' di pane, magari un\npo' di pan secco, un crosterello, un osso avanzato al cane, un po' di\npolenta muffita, una lisca di pesce, un nocciolo di ciliegia, insomma\nqualche cosa da masticare: ma non trovò nulla, il gran nulla, proprio\nnulla.","E intanto la fame cresceva, e cresceva sempre: e il povero Pinocchio\nnon aveva altro sollievo che quello di sbadigliare e faceva degli\nsbadigli così lunghi, che qualche volta la bocca gli arrivava fino agli\norecchi. E dopo avere sbadigliato, sputava, e sentiva che lo stomaco\ngli andava via.","Allora piangendo e disperandosi, diceva:","— Il Grillo-parlante aveva ragione. Ho fatto male a rivoltarmi al\nmio babbo e a fuggire di casa.... Se il mio babbo fosse qui ora non\nmi troverei a morire di sbadigli! Oh! che brutta malattia che è la\nfame! —","Quand'ecco che gli parve di vedere nel monte della spazzatura qualche\ncosa di tondo e di bianco, che somigliava tutto ad un uovo di gallina.\nSpiccare un salto e gettarvisi sopra, fu un punto solo. Era un uovo\ndavvero.","La gioia del burattino è impossibile descriverla: bisogna sapersela\nfigurare. Credendo quasi che fosse un sogno, si rigirava quest'uovo fra\nle mani, e lo toccava e lo baciava e baciandolo diceva:","— E ora come dovrò cuocerlo? Ne farò una frittata?... No, è meglio\ncuocerlo nel piatto!... o non sarebbe più saporito se lo friggessi in\npadella? O se invece lo cuocessi a uso uovo a bere? No, la più lesta\ndi tutte è di cuocerlo nel piatto o nel tegamino: ho troppa voglia di\nmangiarmelo! —","Detto fatto, pose un tegamino sopra un caldano pieno di brace accesa:\nmesse nel tegamino, invece d'olio o di burro, un po' d'acqua: e quando\nl'acqua principiò a fumare, _tac!_... spezzò il guscio dell'uovo, e\nfece l'atto di scodellarvelo dentro.","Ma invece della chiara e del torlo scappò fuori un pulcino tutto\nallegro e complimentoso, il quale facendo una bella riverenza disse:","— Mille grazie, signor Pinocchio, d'avermi risparmiata la fatica di\nrompere il guscio! Arrivedella, stia bene e tanti saluti a casa! —","Ciò detto, distese le ali, e, infilata la finestra che era aperta, se\nne volò via a perdita d'occhio.","Il povero burattino rimase lì, come incantato, cogli occhi fissi, colla\nbocca aperta e coi gusci dell'uovo in mano. Riavutosi, peraltro, dal\nprimo sbigottimento, cominciò a piangere, a strillare, a battere i\npiedi in terra per la disperazione, e piangendo diceva:","— Eppure il Grillo-parlante aveva ragione! Se non fossi scappato di\ncasa e se il mio babbo fosse qui, ora non mi troverei a morire di fame.\nEh! che brutta malattia che è la fame!... —","E perchè il corpo gli seguitava a brontolare più che mai, e non\nsapeva come fare a chetarlo, pensò di uscir di casa e di dare una\nscappata al paesello vicino, nella speranza di trovare qualche persona\ncaritatevole, che gli facesse l'elemosina di un po' di pane."]},{"name":"Capitolo 6","paragraphs":["Pinocchio si addormenta coi piedi sul caldano, e la mattina dopo si\nsveglia coi piedi tutti bruciati.","Per l'appunto era una nottataccia d'inferno. Tonava forte forte,\nlampeggiava come se il cielo pigliasse fuoco, e un ventaccio freddo e\nstrapazzone, fischiando rabbiosamente e sollevando un immenso nuvolo di\npolvere, faceva stridere e cigolare tutti gli alberi della campagna.","Pinocchio aveva una gran paura dei tuoni e dei lampi: se non che la\nfame era più forte della paura: motivo per cui accostò l'uscio di casa,\ne presa la carriera, in un centinaio di salti arrivò fino al paese,\ncolla lingua fuori e col fiato grosso, come un can da caccia.","Ma trovò tutto buio e tutto deserto. Le botteghe erano chiuse; le porte\ndi casa chiuse, le finestre chiuse, e nella strada nemmeno un cane.\nPareva il paese dei morti.","Allora Pinocchio, preso dalla disperazione e dalla fame, si attaccò al\ncampanello d'una casa, e cominciò a sonare a distesa, dicendo dentro di\nsè:","— Qualcuno si affaccerà. —","Difatti si affacciò un vecchio, col berretto da notte in capo, il quale\ngridò tutto stizzito:","— Che cosa volete a quest'ora?","[Illustrazione: Tornò a casa bagnato come un pulcino....]","— Che mi fareste il piacere di darmi un po' di pane?","— Aspettatemi costì che torno subito, — rispose il vecchino, credendo\ndi aver da fare con qualcuno di quei ragazzacci rompicolli che si\ndivertono di notte a sonare i campanelli delle case, per molestare la\ngente per bene, che se la dorme tranquillamente.","Dopo mezzo minuto la finestra si riaprì, e la voce del solito vecchino\ngridò a Pinocchio:","— Fàtti sotto e para il cappello. —","Pinocchio che non aveva ancora un cappello, si avvicinò e sentì\npioversi addosso un'enorme catinellata d'acqua che lo annaffiò tutto,\ndalla testa ai piedi, come se fosse un vaso di giranio appassito.","Tornò a casa bagnato come un pulcino e rifinito dalla stanchezza e\ndalla fame: e perchè non aveva più forza di reggersi ritto, si pose a\nsedere, appoggiando i piedi fradici e impillaccherati sopra un caldano\npieno di brace accesa.","E lì si addormentò; e nel dormire i piedi che erano di legno gli\npresero fuoco, e adagio adagio gli si carbonizzarono e diventarono\ncenere.","E Pinocchio seguitava a dormire e a russare, come se i suoi piedi\nfossero quelli d'un altro. Finalmente sul far del giorno si svegliò,\nperchè qualcuno aveva bussato alla porta.","— Chi è? — domandò sbadigliando e stropicciandosi gli occhi.","— Sono io! — rispose una voce.","Quella voce era la voce di Geppetto."]},{"name":"Capitolo 7","paragraphs":["Geppetto torna a casa, e dà al burattino la colazione che il pover'uomo\naveva portata per sè.","Il povero Pinocchio, che aveva sempre gli occhi fra il sonno, non\ns'era ancora avvisto dei piedi che gli si erano tutti bruciati: per\ncui appena sentì la voce di suo padre, schizzò giù dallo sgabello per\ncorrere a tirare il paletto; ma invece, dopo due o tre traballoni,\ncadde di picchio tutto lungo disteso sul pavimento.","E nel battere in terra fece lo stesso rumore, che avrebbe fatto un\nsacco di mestoli, cascato da un quinto piano.","— Aprimi! — intanto gridava Geppetto dalla strada.","— Babbo mio, non posso.... — rispondeva il burattino piangendo e\nruzzolandosi per terra.","— Perchè non puoi?","— Perchè mi hanno mangiato i piedi.","— E chi te li ha mangiati?","— Il gatto — disse Pinocchio, vedendo il gatto che colle zampine\ndavanti si divertiva a far ballare alcuni trucioli di legno.","— Aprimi, ti dico! — ripetè Geppetto — se no, quando vengo in casa, il\ngatto te lo do io!","— Non posso star ritto, credetelo. Oh! povero me! povero me, che mi\ntoccherà a camminare coi ginocchi per tutta la vita. —","[Illustrazione: Entrò in casa dalla finestra.]","Geppetto, credendo che tutti questi piagnistei fossero un'altra\nmonelleria del burattino, pensò bene di farla finita; e arrampicatosi\nsu per il muro, entrò in casa dalla finestra.","Da principio voleva dire e voleva fare; ma poi, quando vide il suo\nPinocchio sdraiato in terra e rimasto senza piedi davvero, allora sentì\nintenerirsi; e presolo subito in collo si dette a baciarlo e a fargli\nmille carezze e mille moine, e, coi lucciconi che gli cascavano giù per\nle gote, gli disse singhiozzando:","— Pinocchiuccio mio! Com'è che ti sei bruciato i piedi?","— Non lo so, babbo, ma credetelo che è stata una nottata d'inferno,\ne me ne ricorderò fin che campo. Tonava, balenava e io avevo una\ngran fame, e allora il Grillo-parlante mi disse: «Ti sta bene: sei\nstato cattivo e te lo meriti» e io gli dissi: «Bada, Grillo!...» e\nlui mi disse: «Tu sei un burattino e hai la testa di legno» e io\ngli tirai un manico di martello, e lui morì, ma la colpa fu sua,\nperchè io non volevo ammazzarlo, prova ne sia, che messi un tegamino\nsulla brace accesa del caldano, ma il pulcino scappò fuori e disse:\n«Arrivedella,... e tanti saluti a casa.» E la fame cresceva sempre,\nmotivo per cui quel vecchino col berretto da notte, affacciandosi alla\nfinestra mi disse: «Fatti sotto e para il cappello» e io con quella\ncatinellata d'acqua sul capo, perchè il chiedere un po' di pane non è\nvergogna, non è vero? me ne tornai subito a casa, e perchè avevo sempre\nuna gran fame, messi i piedi sul caldano per rasciugarmi, e voi siete\ntornato, e me li sono trovati bruciati, e intanto la fame l'ho sempre\ne i piedi non li ho più! ih!... ih!... ih!... ih!... —","E il povero Pinocchio cominciò a piangere e a berciare così forte, che\nlo sentivano da cinque chilometri lontano.","Geppetto, che di tutto quel discorso arruffato aveva capito una cosa\nsola, cioè che il burattino sentiva morirsi dalla gran fame, tirò fuori\ndi tasca tre pere, e porgendogliele, disse:","— Queste tre pere erano la mia colazione: ma io te le do volentieri.\nMangiale, e buon pro ti faccia.","— Se volete che le mangi, fatemi il piacere di sbucciarle.","— Sbucciarle? — replicò Geppetto meravigliato. — Non avrei mai creduto,\nragazzo mio, che tu fossi così boccuccia e così schizzinoso di palato.\nMale! In questo mondo, fin da bambini, bisogna avvezzarsi abboccati e a\nsaper mangiar di tutto, perchè non si sa mai quel che ci può capitare.\nI casi son tanti!...","— Voi direte bene, — soggiunse Pinocchio — ma io non mangerò mai una\nfrutta, che non sia sbucciata. Le bucce non le posso soffrire. —","E quel buon uomo di Geppetto, cavato fuori un coltellino, e armatosi\ndi santa pazienza, sbucciò le tre pere, e pose tutte le bucce sopra un\nangolo della tavola.","Quando Pinocchio in due bocconi ebbe mangiata la prima pera, fece\nl'atto di buttar via il torsolo; ma Geppetto gli trattenne il braccio\ndicendogli:","— Non lo buttar via: tutto in questo mondo può far comodo.","— Ma io il torsolo non lo mangio davvero!... — gridò il burattino\nrivoltandosi come una vipera.","— Chi lo sa! I casi son tanti!... — ripetè Geppetto, senza riscaldarsi.","Fatto sta che i tre torsoli, invece di essere gettati fuori dalla\nfinestra, vennero posati sull'angolo della tavola in compagnia delle\nbucce.","Mangiate, o, per dir meglio, divorate le tre pere, Pinocchio fece un\nlunghissimo sbadiglio e disse piagnucolando:","— Ho dell'altra fame!","— Ma io, ragazzo mio, non ho più nulla da darti.","— Proprio nulla, nulla?","— Ci avrei soltanto queste bucce e questi torsoli di pera.","— Pazienza! — disse Pinocchio — se non c'è altro, mangerò una\nbuccia. —","E cominciò a masticare. Da principio storse un po' la bocca: ma poi una\ndietro l'altra, spolverò in un soffio tutte le bucce; e dopo le bucce\nanche i torsoli, e quand'ebbe finito di mangiare ogni cosa, si battè\ntutto contento le mani sul corpo, e disse gongolando:","— Ora sì, che sto bene!","— Vedi, dunque, — osservò Geppetto — che avevo ragione io, quando\nti dicevo che non bisogna avvezzarsi nè troppo sofistici nè troppo\ndelicati di palato. Caro mio, non si sa mai quel che ci può capitare in\nquesto mondo. I casi son tanti!... —"]},{"name":"Capitolo 8","paragraphs":["Geppetto rifà i piedi a Pinocchio, e vende la propria casacca per\ncomprargli l'Abbecedario.","Il burattino, appena che si fu levata la fame, cominciò subito a\nbofonchiare e a piangere, perchè voleva un paio di piedi nuovi.","[Illustrazione: Lo lasciò piangere e disperarsi per una mezza\ngiornata.]","Ma Geppetto, per punirlo della monelleria fatta, lo lasciò piangere e\ndisperarsi per una mezza giornata; poi gli disse:","— E perchè dovrei rifarti i piedi? Forse per vederti scappar di nuovo\nda casa tua?","— Vi prometto — disse il burattino singhiozzando — che da oggi in poi\nsarò buono....","— Tutti i ragazzi — replicò Geppetto — quando vogliono ottenere\nqualcosa, dicono così.","— Vi prometto che anderò a scuola, studierò e mi farò onore....","— Tutti i ragazzi, quando vogliono ottenere qualcosa, ripetono la\nmedesima storia.","— Ma io non sono come gli altri ragazzi! Io sono più buono di tutti, e\ndico sempre la verità. Vi prometto, babbo, che imparerò un'arte, e che\nsarò la consolazione e il bastone della vostra vecchiaia. —","Geppetto che, sebbene facesse il viso di tiranno, aveva gli occhi pieni\ndi pianto e il cuore grosso dalla passione nel vedere il suo povero\nPinocchio in quello stato compassionevole, non rispose altre parole:\nma, presi in mano gli arnesi del mestiere e due pezzetti di legno\nstagionato, si pose a lavorare di grandissimo impegno.","E in meno d'un'ora, i piedi erano bell'e fatti: due piedini svelti,\nasciutti e nervosi, come se fossero modellati da un artista di genio.","Allora Geppetto disse al burattino:","— Chiudi gli occhi e dormi! —","E Pinocchio chiuse gli occhi e fece finta di dormire. E nel tempo\nche si fingeva addormentato, Geppetto con un po' di colla sciolta\nin un guscio d'uovo gli appiccicò i due piedi al loro posto, e\nglieli appiccicò così bene, che non si vedeva nemmeno il segno\ndell'attaccatura.","[Illustrazione: Principiò a fare mille sgambetti.]","Appena il burattino si accòrse di avere i piedi, saltò giù dalla\ntavola dove stava disteso, e principiò a fare mille sgambetti e mille\ncapriole, come se fosse ammattito dalla gran contentezza.","— Per ricompensarvi di quanto avete fatto per me — disse Pinocchio al\nsuo babbo — voglio subito andare a scuola.","— Bravo ragazzo.","— Ma per andare a scuola ho bisogno d'un po' di vestito. —","[Illustrazione: Gli fece.... un berrettino di midolla di\npane.]","Geppetto, che era povero e non aveva in tasca nemmeno un centesimo,\ngli fece allora un vestituccio di carta fiorita, un paio di scarpe di\nscorza d'albero e un berrettino di midolla di pane.","Pinocchio corse subito a specchiarsi in una catinella piena d'acqua e\nrimase così contento di sè, che disse pavoneggiandosi:","— Paio proprio un signore!","— Davvero; — replicò Geppetto — perchè, tienlo a mente, non è il\nvestito bello che fa il signore, ma è piuttosto il vestito pulito.","— A proposito, — soggiunse il burattino — per andare alla scuola mi\nmanca sempre qualcosa: anzi mi manca il più e il meglio.","— Cioè?","— Mi manca l'Abbecedario.","— Hai ragione: ma come si fa per averlo?","— È facilissimo: si va da un libraio e si compra.","— E i quattrini?","— Io non ce l'ho.","— Nemmen io — soggiunse il buon vecchio, facendosi tristo.","E Pinocchio sebbene fosse un ragazzo allegrissimo, si fece tristo anche\nlui: perchè la miseria, quando è miseria davvero, la intendono tutti:\nanche i ragazzi.","— Pazienza! — gridò Geppetto tutt'a un tratto rizzandosi in piedi; e\ninfilatasi la vecchia casacca, di frustagno, tutta toppe e rimendi,\nuscì correndo di casa.","Dopo poco tornò: e quando tornò, aveva in mano l'Abbecedario per il\nfigliuolo, ma la casacca non l'aveva più. Il pover'uomo era in maniche\ndi camicia, e fuori nevicava.","— E la casacca, babbo?","— L'ho venduta.","— Perchè l'avete venduta?","— Perchè mi faceva caldo. —","Pinocchio capì questa risposta a volo, e non potendo frenare l'impeto\ndel suo buon cuore, saltò al collo di Geppetto e cominciò a baciarlo\nper tutto il viso."]},{"name":"Capitolo 9","paragraphs":["Pinocchio vende l'Abbecedario per andare a vedere il teatro dei\nburattini.","Smesso che fu di nevicare, Pinocchio, col suo bravo Abbecedario nuovo\nsotto il braccio, prese la strada che menava alla scuola: e strada\nfacendo, fantasticava nel suo cervellino mille ragionamenti e mille\ncastelli in aria, uno più bello dell'altro.","E discorrendo da sè solo, diceva:","— Oggi, alla scuola, voglio subito imparare a leggere: domani poi\nimparerò a scrivere, e domani l'altro imparerò a fare i numeri. Poi,\ncolla mia abilità, guadagnerò molti quattrini e coi primi quattrini che\nmi verranno in tasca, voglio subito fare al mio babbo una bella casacca\ndi panno. Ma che dico di panno? Gliela voglio fare tutta d'argento\ne d'oro, e coi bottoni di brillanti. E quel pover'uomo se la merita\ndavvero; perchè insomma, per comprarmi i libri e per farmi istruire,\nè rimasto in maniche di camicia.... a questi freddi! Non ci sono che i\nbabbi che sieno capaci di certi sacrifizi!... —","Mentre tutto commosso diceva così, gli parve di sentire in lontananza\nuna musica di pifferi e di colpi di grancassa: pì-pì—pì, pì-pì—pì, zum,\nzum, zum, zum.","Si fermò e stette in ascolto. Quei suoni venivano di fondo a una\nlunghissima strada traversa, che conduceva a un piccolo paesetto,\nfabbricato sulla spiaggia del mare.","— Che cosa sia questa musica? Peccato che io debba andare a scuola, se\nno.... —","E rimase lì perplesso. A ogni modo, bisognava prendere una risoluzione;\no a scuola, o a sentire i pifferi.","— Oggi anderò a sentire i pifferi, e domani a scuola. Per andare a\nscuola c'è sempre tempo — disse finalmente quel monello, facendo una\nspallucciata.","Detto fatto, infilò giù per la strada traversa e cominciò a correre a\ngambe. Più correva e più sentiva distinto il suono dei pifferi e dei\ntonfi della grancassa: pì-pì—pì, pì—pì-pì, pì-pì—pì, zum, zum, zum,\nzum.","Quand'ecco che si trovò in mezzo a una piazza tutta piena di gente,\nla quale si affollava intorno a un gran baraccone di legno e di tela\ndipinta di mille colori.","— Che cos'è quel baraccone? — domandò Pinocchio, voltandosi a un\nragazzetto che era lì del paese.","— Leggi il cartello, che c'è scritto, e lo saprai.","— Lo leggerei volentieri, ma per l'appunto oggi non so leggere.","— Bravo bue! Allora te lo leggerò io. Sappi dunque che in quel\ncartello a lettere rosse come il fuoco, c'è scritto: GRAN TEATRO DEI\nBURATTINI....","— È molto che è incominciata la commedia?","— Comincia ora.","— E quanto si spende per entrare?","— Quattro soldi. —","Pinocchio che aveva addosso la febbre della curiosità, perse ogni\nritegno e disse, senza vergognarsi, al ragazzetto col quale parlava:","— Mi daresti quattro soldi fino a domani?","— Te li darei volentieri, — gli rispose l'altro canzonandolo — ma oggi\nper l'appunto non te li posso dare.","— Per quattro soldi ti vendo la mia giacchetta — gli disse allora il\nburattino.","— Che vuoi che mi faccia di una giacchetta di carta fiorita? Se ci\npiove su, non c'è più verso di cavarsela da dosso.","— Vuoi comprare le mie scarpe?","— Sono buone per accendere il fuoco.","— Quanto mi dai del berretto?","— Bell'acquisto davvero! Un berretto di midolla di pane! C'è il caso\nche i topi me lo vengano a mangiare in capo! —","[Illustrazione: — Vuoi darmi quattro soldi di\nquest'Abbecedario nuovo?]","Pinocchio era sulle spine. Stava lì lì per fare l'ultima offerta: ma\nnon aveva coraggio: esitava, tentennava, pativa. Alla fine disse:","— Vuoi darmi quattro soldi di quest'Abbecedario nuovo?","— Io sono un ragazzo e non compro nulla dai ragazzi — gli rispose il\nsuo piccolo interlocutore, che aveva più giudizio di lui.","— Per quattro soldi l'Abbecedario lo prendo io — gridò un rivenditore\ndi panni usati, che s'era trovato presente alla conversazione.","E il libro fu venduto lì su due piedi. E pensare che quel pover'uomo\ndi Geppetto era rimasto a casa, a tremare dal freddo in maniche di\ncamicia, per comprare l'Abbecedario al figliuolo!"]},{"name":"Capitolo 10","paragraphs":["I burattini riconoscono il loro fratello Pinocchio e gli fanno\nuna grandissima festa; ma sul più bello esce fuori il burattinaio\nMangiafoco, e Pinocchio corre pericolo di fare una brutta fine.","Quando Pinocchio entrò nel teatrino delle marionette, accadde un fatto\nche destò una mezza rivoluzione.","Bisogna sapere che il sipario era tirato su, e la commedia era già\nincominciata.","Sulla scena si vedevano Arlecchino e Pulcinella, che bisticciavano fra\ndi loro e, secondo il solito, minacciavano da un momento all'altro di\nscambiarsi un carico di schiaffi e di bastonate.","La platea tutta attenta, si mandava a male dalle grandi risate,\nnel sentire il battibecco di quei due burattini, che gestivano e si\ntrattavano d'ogni vitupero con tanta verità, come se fossero proprio\ndue animali ragionevoli e due persone di questo mondo.","Quando all'improvviso, che è che non è, Arlecchino smette di recitare,\ne voltandosi verso il pubblico e accennando colla mano qualcuno in\nfondo alla platea, comincia a urlare in tono drammatico:","— Numi del firmamento! sogno o son desto? Eppure quello laggiù è\nPinocchio!...","— È Pinocchio davvero! — grida Pulcinella.","[Illustrazione: .... Eppure quello laggiù è Pinocchio!...]","— È proprio lui! — strilla la signora Rosaura, facendo capolino in\nfondo alla scena.","— È Pinocchio! è Pinocchio! — urlarono in coro tutti i burattini,\nuscendo a salti fuori delle quinte.","— È Pinocchio! È il nostro fratello Pinocchio! Evviva Pinocchio!...","— Pinocchio, vieni quassù da me! — grida Arlecchino — vieni a gettarti\nfra le braccia dei tuoi fratelli di legno! —","A questo affettuoso invito, Pinocchio spicca un salto, e di fondo\nalla platea va nei posti distinti; poi con un altro salto, dai posti\ndistinti monta sulla testa del direttore d'orchestra, e di lì schizza\nsul palcoscenico.","È impossibile figurarsi gli abbracciamenti, gli strizzoni di collo, i\npizzicotti dell'amicizia e le zuccate della vera e sincera fratellanza,\nche Pinocchio ricevè in mezzo a tanto arruffio degli attori e delle\nattrici di quella compagnia drammatico-vegetale.","Questo spettacolo era commovente, non c'è che dire: ma il pubblico\ndella platea, vedendo che la commedia non andava più avanti,\ns'impazientì e prese a gridare: — Vogliamo la commedia! vogliamo la\ncommedia! —","Tutto fiato buttato via, perchè i burattini, invece di continuare la\nrecita, raddoppiarono il chiasso e le grida, e, postosi Pinocchio sulle\nspalle, se lo portarono in trionfo ai lumi della ribalta.","Allora uscì fuori il burattinaio, un omone così brutto, che metteva\npaura soltanto a guardarlo. Aveva una barbaccia nera come uno\nscarabocchio d'inchiostro, e tanto lunga, che gli scendeva dal mento\nfino a terra: basta dire che, quando camminava se la pestava coi\npiedi. La sua bocca era larga come un forno, i suoi occhi parevano\ndue lanterne di vetro rosso, col lume acceso di dietro; e con le mani\nschioccava una grossa frusta, fatta di serpenti e di code di volpe\nattorcigliate insieme.","[Illustrazione: All'apparizione inaspettata del burattinaio,\nammutolirono tutti.]","All'apparizione inaspettata del burattinaio, ammutolirono tutti:\nnessuno fiatò più. Si sarebbe sentito volare una mosca. Quei poveri\nburattini, maschi e femmine, tremavano come tante foglie.","— Perchè sei venuto a mettere lo scompiglio nel mio teatro? — domandò\nil burattinaio a Pinocchio, con un vocione d'Orco gravemente infreddato\ndi testa.","— La creda, illustrissimo, che la colpa non è stata mia!...","— Basta così! stasera faremo i nostri conti. —","Difatti, finita la recita della commedia, il burattinaio andò in\ncucina, dov'egli s'era preparato per cena un bel montone, che girava\nlentamente infilato nello spiede. E perchè gli mancavano le legna per\nfinirlo di cuocere e di rosolare, chiamò Arlecchino e Pulcinella e\ndisse loro:","— Portatemi di qua quel burattino, che troverete attaccato al chiodo.\nMi pare un burattino fatto di un legname molto asciutto, e sono\nsicuro che a buttarlo sul fuoco, mi darà una bellissima fiammata\nall'arrosto. —","Arlecchino e Pulcinella da principio esitarono; ma impauriti da\nun'occhiataccia del loro padrone, obbedirono: e dopo tornarono\nin cucina portando sulle braccia il povero Pinocchio, il quale,\ndivincolandosi come un'anguilla fuori dell'acqua, strillava\ndisperatamente: — Babbo mio, salvatemi! Non voglio morire, no, non\nvoglio morire!... —"]},{"name":"Capitolo 11","paragraphs":["Mangiafoco starnutisce e perdona a Pinocchio, il quale poi difende\ndalla morte il suo amico Arlecchino.","Il burattinaio Mangiafoco (che questo era il suo nome) pareva un\nuomo spaventoso, non dico di no, specie con quella sua barbaccia nera\nche, a uso grembiale, gli copriva tutto il petto e tutte le gambe; ma\nnel fondo poi non era un cattiv'uomo. Prova ne sia, che quando vide\nportarsi davanti quel povero Pinocchio, che si dibatteva per ogni\nverso, urlando «Non voglio morire, non voglio morire!» principiò subito\na commuoversi e a impietosirsi; e dopo aver resistito un bel pezzo,\nalla fine non ne potè più, e lasciò andare un sonorosissimo starnuto.","A quello starnuto, Arlecchino che fino allora era stato afflitto e\nripiegato come un salcio piangente, si fece tutto allegro in viso, e\nchinatosi verso Pinocchio gli bisbigliò sottovoce:","— Buone nuove, fratello! Il burattinaio ha starnutito, e questo è segno\nche s'è mosso a compassione per te, e oramai sei salvo. —","Perchè bisogna sapere che, mentre tutti gli uomini quando si sentono\nimpietositi per qualcuno, o piangono, o per lo meno fanno finta di\nrasciugarsi gli occhi, Mangiafoco, invece, ogni volta che s'inteneriva\ndavvero, aveva il vizio di starnutire. Era un modo come un altro, per\ndare a conoscere agli altri la sensibilità del suo cuore.","Dopo avere starnutito, il burattinaio, seguitando a fare il burbero,\ngridò a Pinocchio:","— Finiscila di piangere! I tuoi lamenti mi hanno messo un'uggiolina qui\nin fondo allo stomaco.... sento uno spasimo, che quasi quasi.... _etcì,\netcì!_ — e fece altri due starnuti.","— Felicità! — disse Pinocchio.","— Grazie. E il tuo babbo e la tua mamma sono sempre vivi? — domandò\nMangiafoco.","— Il babbo, sì; la mamma non l'ho mai conosciuta.","— Chi lo sa che dispiacere sarebbe per il tuo vecchio padre, se\nora ti facessi gettare fra quei carboni ardenti. Povero vecchio! lo\ncompatisco.... _etcì, etcì, etcì_, — e fece altri tre starnuti.","— Felicità! — disse Pinocchio.","— Grazie. Del resto bisogna compatire anche me, perchè come vedi,\nnon ho più legna per finire di cuocere quel montone arrosto, e tu,\ndico la verità, in questo caso mi avresti fatto un gran comodo! Ma\normai mi sono impietosito e ci vuol pazienza. Invece di te, metterò a\nbruciare sotto lo spiede qualche burattino della mia compagnia. Olà,\ngiandarmi! —","A questo comando comparvero subito due giandarmi di legno, lunghi\nlunghi, secchi secchi, col cappello a lucerna in testa e colla sciabola\nsfoderata in mano.","[Illustrazione: — Pigliatemi lì quell'Arlecchino....]","Allora il burattinaio disse loro con voce rantolosa:","— Pigliatemi lì quell'Arlecchino, legatelo ben bene, e poi gettatelo\na bruciare sul fuoco. Io voglio che il mio montone sia arrostito\nbene! —","Figuratevi il povero Arlecchino! Fu tanto il suo spavento, che le gambe\ngli si ripiegarono e cadde bocconi per terra.","Pinocchio alla vista di quello spettacolo straziante, andò a gettarsi\nai piedi del burattinaio, e piangendo dirottamente e bagnandogli di\nlacrime tutti i peli della lunghissima barba, cominciò a dire con voce\nsupplichevole:","— Pietà, signor Mangiafoco!...","— Qui non ci sono signori! — replicò duramente il burattinaio.","— Pietà, signor Cavaliere!...","— Qui non ci sono cavalieri!","— Pietà, signor Commendatore!","— Qui non ci sono commendatori!","— Pietà, Eccellenza!... —","A sentirsi chiamare Eccellenza, il burattinaio fece subito il bocchino\ntondo, e diventato tutt'a un tratto più umano e più trattabile, disse\na Pinocchio:","— Ebbene, che cosa vuoi da me?","— Vi domando grazia per il povero Arlecchino!...","— Qui non c'è grazia che tenga. Se ho risparmiato te, bisogna che\nfaccia mettere sul fuoco lui, perchè io voglio che il mio montone sia\narrostito bene.","— In questo caso — gridò fieramente Pinocchio, rizzandosi e gettando\nvia il suo berretto di midolla di pane — in questo caso conosco qual è\nil mio dovere. Avanti, signori giandarmi! Legatemi e gettatemi là fra\nquelle fiamme. No, non è giusta che il povero Arlecchino, il vero amico\nmio, debba morire per me! —","Queste parole, pronunziate con voce alta e con accento eroico, fecero\npiangere tutti i burattini che erano presenti a quella scena. Gli\nstessi giandarmi, sebbene fossero di legno, piangevano come due\nagnellini di latte.","Mangiafoco, sul principio, rimase duro e immobile come un pezzo di\nghiaccio: ma poi, adagio adagio, cominciò anche lui a commuoversi e a\nstarnutire. E fatti quattro o cinque starnuti, aprì affettuosamente le\nbraccia e disse a Pinocchio:","— Tu sei un gran bravo ragazzo! Vieni qua da me, e dammi un\nbacio. —","Pinocchio corse subito, e arrampicandosi come uno scoiattolo su per la\nbarba del burattinaio, andò a posargli un bellissimo bacio sulla punta\ndel naso.","— Dunque la grazia è fatta? — domandò il povero Arlecchino, con un fil\ndi voce che si sentiva appena.","[Illustrazione: E arrampicandosi come uno scoiattolo su per la\nbarba del burattinaio....]","— La grazia è fatta! — rispose Mangiafoco; poi soggiunse sospirando e\ntentennando il capo:","— Pazienza! per questa sera mi rassegnerò a mangiare il montone mezzo\ncrudo: ma un'altra volta, guai a chi toccherà!... —","Alla notizia della grazia ottenuta, i burattini corsero tutti sul\npalcoscenico e, accesi i lumi e i lampadari come in serata di gala,\ncominciarono a saltare e a ballare.","Era l'alba e ballavano sempre."]},{"name":"Capitolo 12","paragraphs":["Il burattinaio Mangiafoco regala cinque monete d'oro a Pinocchio\nperchè le porti al suo babbo Geppetto: e Pinocchio, invece, si lascia\nabbindolare dalla Volpe e dal Gatto e se ne va con loro.","Il giorno dipoi Mangiafoco chiamò in disparte Pinocchio e gli domandò:","— Come si chiama tuo padre?","— Geppetto.","— E che mestiere fa?","— Il povero.","— Guadagna molto?","— Guadagna tanto quanto ci vuole per non aver mai un centesimo in\ntasca. Si figuri che per comprarmi l'Abbecedario della scuola dovè\nvendere l'unica casacca che aveva addosso: una casacca che, fra toppe\ne rimendi, era tutta una piaga.","— Povero diavolo! Mi fa quasi compassione. Ecco qui cinque monete\nd'oro. Va' subito a portargliele, e salutalo tanto da parte mia. —","Pinocchio, come è facile immaginarselo, ringraziò mille volte il\nburattinaio: abbracciò, a uno a uno, tutti i burattini della compagnia,\nanche i giandarmi; e fuori di sè dalla contentezza, si mise in viaggio\nper ritornarsene a casa sua.","[Illustrazione: — Com'è che sai il mio nome?]","Ma non aveva fatto ancora mezzo chilometro, che incontrò per la strada\nuna Volpe zoppa da un piede e un Gatto cieco da tutt'e due gli occhi,\nche se ne andavano là là, aiutandosi fra di loro, da buoni compagni di\nsventura. La Volpe, che era zoppa, camminava appoggiandosi al Gatto: e\nil Gatto, che era cieco, si lasciava guidare dalla Volpe.","— Buon giorno, Pinocchio, — gli disse la Volpe, salutandolo\ngarbatamente.","— Com'è che sai il mio nome? — domandò il burattino.","— Conosco bene il tuo babbo.","— Dove l'hai veduto?","— L'ho veduto ieri sulla porta di casa sua.","— E che cosa faceva?","— Era in maniche di camicia e tremava dal freddo.","— Povero babbo! Ma, se Dio vuole, da oggi in poi non tremerà più!","— Perchè?","— Perchè io sono diventato un gran signore.","— Un gran signore tu? — disse la Volpe, e cominciò a ridere di un riso\nsguaiato e canzonatore: e il Gatto rideva anche lui, ma per non darlo\na vedere, si pettinava i baffi colle zampine davanti.","— C'è poco da ridere — gridò Pinocchio impermalito. — Mi dispiace\ndavvero di farvi venire l'acquolina in bocca, ma queste qui, se ve ne\nintendete, sono cinque bellissime monete d'oro. —","E tirò fuori le monete avute in regalo da Mangiafoco.","Al simpatico suono di quelle monete, la Volpe per un moto involontario\nallungò la gamba che pareva rattrappita, e il Gatto spalancò tutt'e due\ngli occhi, che parvero due lanterne verdi; ma poi li richiuse subito,\ntant'è vero che Pinocchio non si accòrse di nulla.","— E ora — gli domandò la Volpe — che cosa vuoi farne di codeste monete?","— Prima di tutto — rispose il burattino — voglio comprare per il mio\nbabbo una bella casacca nuova, tutta d'oro e d'argento, e coi bottoni\ndi brillanti: e poi voglio comprare un Abbecedario per me.","— Per te?","— Davvero: perchè voglio andare a scuola e mettermi a studiare a buono.","— Guarda me! — disse la Volpe. — Per la passione sciocca di studiare ho\nperduto una gamba.","— Guarda me! — disse il Gatto. — Per la passione sciocca di studiare ho\nperduto la vista di tutt'e due gli occhi. —","In quel mentre un Merlo bianco, che se ne stava appollaiato sulla siepe\ndella strada, fece il suo solito verso e disse:","— Pinocchio, non dar retta ai consigli dei cattivi compagni: se no, te\nne pentirai! —","Povero Merlo, non l'avesse mai detto! Il Gatto spiccando un gran salto,\ngli si avventò addosso, e senza dargli nemmeno il tempo di dire _ohi_,\nse lo mangiò in un boccone con le penne e tutto.","Mangiato che l'ebbe e ripulitosi la bocca, chiuse gli occhi daccapo e\nricominciò a fare il cieco come prima.","— Povero Merlo! — disse Pinocchio al Gatto — perchè l'hai trattato così\nmale?","[Illustrazione: Spiccando un gran salto, gli si avventò\naddosso.]","— Ho fatto per dargli una lezione. Così un'altra volta imparerà a non\nmetter bocca nei discorsi degli altri. —","Erano giunti più che a mezza strada, quando la Volpe, fermandosi di\npunto in bianco, disse al burattino:","— Vuoi tu raddoppiare le tue monete d'oro?","— Cioè?","— Vuoi tu, di cinque miserabili zecchini, farne cento, mille, duemila?","— Magari! e la maniera?","— La maniera è facilissima. Invece di tornartene a casa tua, dovresti\nvenir con noi.","— E dove mi volete condurre?","— Nel paese dei Barbagianni. —","Pinocchio ci pensò un poco, e poi disse risolutamente:","— No, non ci voglio venire. Oramai sono vicino a casa, e voglio\nandarmene a casa, dove c'è il mio babbo che m'aspetta. Chi lo sa,\npovero vecchio, quanto ha sospirato ieri, a non vedermi tornare.\nPurtroppo io sono stato un figliuolo cattivo, e il Grillo-parlante\naveva ragione quando diceva: «I ragazzi disobbedienti non possono aver\nbene in questo mondo.» Ed io l'ho provato a mie spese, perchè mi sono\ncapitate molte disgrazie, e anche ieri sera in casa di Mangiafoco ho\ncorso pericolo.... Brrr! mi viene i bordoni soltanto a pensarci!","— Dunque, — disse la Volpe — vuoi proprio andare a casa tua? Allora va'\npure, e tanto peggio per te.","— Tanto peggio per te! — ripetè il Gatto.","— Pensaci bene, Pinocchio, perchè tu dai un calcio alla fortuna.","— Alla fortuna! — ripetè il Gatto.","— I tuoi cinque zecchini, dall'oggi al domani sarebbero diventati\nduemila.","— Duemila! — ripetè il Gatto.","— Ma com'è mai possibile che diventino tanti? — domandò Pinocchio,\nrestando a bocca aperta dallo stupore.","— Te lo spiego subito; — disse la Volpe — bisogna sapere che nel paese\ndei Barbagianni c'è un campo benedetto chiamato da tutti il Campo dei\nmiracoli. Tu fai in questo campo una piccola buca e ci metti dentro,\nper esempio, uno zecchino d'oro. Poi ricoprì la buca con un po' di\nterra: l'annaffi con due secchie d'acqua di fontana, ci getti sopra una\npresa di sale, e la sera te ne vai tranquillamente a letto. Intanto,\ndurante la notte, lo zecchino germoglia e fiorisce, e la mattina dopo\ndi levata, ritornando nel campo, che cosa trovi? Trovi un bell'albero\ncarico di tanti zecchini d'oro quanti chicchi di grano può avere una\nbella spiga nel mese di giugno.","— Sicchè dunque — disse Pinocchio sempre più sbalordito — se io\nsotterrassi in quel campo i miei cinque zecchini, la mattina dopo\nquanti zecchini vi troverei?","— È un conto facilissimo; — rispose la Volpe — un conto che puoi farlo\nsulla punta delle dita. Poni che ogni zecchino ti faccia un grappolo\ndi cinquecento zecchini: moltiplica il cinquecento per cinque, e la\nmattina dopo trovi in tasca duemilacinquecento zecchini lampanti e\nsonanti.","— Oh che bella cosa! — gridò Pinocchio, ballando dall'allegrezza. —\nAppena che questi zecchini li avrò raccolti, ne prenderò per me duemila\ne gli altri cinquecento di più li darò in regalo a voialtri due.","— Un regalo a noi? — gridò la Volpe sdegnandosi e chiamandosi offesa.\n— Dio te ne liberi!","— Te ne liberi! — ripetè il Gatto.","— Noi — riprese la Volpe — non lavoriamo per il vile interesse: noi\nlavoriamo per arricchire gli altri.","— Gli altri! — ripetè il Gatto.","— Che brave persone! — pensò dentro di sè Pinocchio: e dimenticandosi\nlì sul tamburo, del suo babbo, della casacca nuova, dell'Abbecedario e\ndi tutti i buoni proponimenti fatti, disse alla Volpe e al Gatto:","— Andiamo subito, io vengo con voi. —"]},{"name":"Capitolo 13","paragraphs":["L'osteria del «Gambero Rosso.»","Cammina, cammina, cammina, alla fine sul far della sera arrivarono\nstanchi morti all'osteria del Gambero Rosso.","— Fermiamoci un po' qui, — disse la Volpe — tanto per mangiare un\nboccone e per riposarci qualche ora. A mezzanotte poi ripartiremo, per\nessere domani, all'alba, nel Campo dei miracoli. —","Entrati nell'osteria si posero tutt'e tre a tavola: ma nessuno di loro\naveva appetito.","Il povero Gatto, sentendosi gravemente indisposto di stomaco, non\npotè mangiare altro che trentacinque triglie con salsa di pomodoro e\nquattro porzioni di trippa alla parmigiana: e perchè la trippa non gli\npareva condita abbastanza, si rifece tre volte a chiedere il burro e il\nformaggio grattato!","La Volpe avrebbe spelluzzicato volentieri qualche cosa anche lei: ma\nsiccome il medico le aveva ordinato una grandissima dieta, così dovè\ncontentarsi di una semplice lepre dolce e forte, con un leggerissimo\ncontorno di pollastre ingrassate e di galletti di primo canto. Dopo la\nlepre si fece portare per tornagusto un cibreino di pernici, di starne,\ndi conigli, di ranocchi, di lucertole e d'uva paradisa; e poi non volle\naltro.","[Illustrazione: Quello che mangiò meno di tutti fu Pinocchio.]","Aveva tanta nausea per il cibo, diceva lei, che non poteva accostarsi\nnulla alla bocca.","Quello che mangiò meno di tutti fu Pinocchio. Chiese uno spicchio di\nnoce e un cantuccio di pane e lasciò nel piatto ogni cosa. Il povero\nfigliuolo, col pensiero sempre fisso al Campo dei miracoli, aveva preso\nun'indigestione anticipata di monete d'oro.","Quand'ebbero cenato, la Volpe disse all'oste:","— Datemi due buone camere, una per il signor Pinocchio e un'altra per\nme e per il mio compagno. Prima di ripartire stiacceremo un sonnellino.\nRicordatevi, però, che a mezzanotte vogliamo essere svegliati per\ncontinuare il nostro viaggio.","— Sissignore — rispose l'oste, e strizzò l'occhio alla Volpe e al\nGatto, come dire: «Ho mangiato la foglia e ci siamo intesi!...» —","Appena che Pinocchio fu entrato nel letto, si addormentò a colpo, e\nprincipiò a sognare. E sognando gli pareva di essere in mezzo a un\ncampo, e questo campo era pieno di arboscelli carichi di grappoli,\ne questi grappoli erano carichi di zecchini d'oro che, dondolandosi\nmossi dal vento, facevano _zin, zin, zin_, quasi volessero dire: «Chi\nci vuole, venga a prenderci.» Ma quando Pinocchio fu sul più bello,\nquando cioè allungò, la mano per prendere a manciate tutte quelle belle\nmonete e mettersele in tasca, si trovò svegliato all'improvviso da tre\nviolentissimi colpi dati nella porta di camera.","Era l'oste che veniva a dirgli che la mezzanotte era sonata.","— E i miei compagni sono pronti? — gli domandò il burattino.","— Altro che pronti! son partiti due ore fa.","— Perchè mai tanta fretta?","— Perchè il Gatto ha ricevuto un'imbasciata che il suo gattino\nmaggiore, malato di geloni ai piedi, stava in pericolo di vita.","[Illustrazione: Era l'oste che veniva a dirgli che la\nmezzanotte era sonata.]","— E la cena l'hanno pagata?","— Che vi pare? Quelle lì sono persone troppo educate, perchè facciano\nun affronto simile alla signoria vostra.","— Peccato! Quest'affronto mi avrebbe fatto tanto piacere! — disse\nPinocchio grattandosi il capo. Poi domandò:","— E dove hanno detto di aspettarmi quei buoni amici?","— Al Campo dei miracoli, domattina, allo spuntare del giorno. —","Pinocchio pagò uno zecchino per la cena sua e per quella dei suoi\ncompagni, e dopo partì.","Ma si può dire che partisse a tastoni, perchè fuori dell'osteria c'era\nun buio così buio, che non ci si vedeva di qui a lì. Nella campagna\nall'intorno non si sentiva alitare una foglia. Solamente alcuni\nuccellacci notturni, traversando la strada da una siepe all'altra,\nvenivano a sbattere le ali sul naso di Pinocchio, il quale, facendo\nun salto indietro per la paura, gridava: — Chi va là? — e l'eco delle\ncolline circostanti ripeteva in lontananza: — Chi va la? chi va là? chi\nva là? —","Intanto, mentre camminava, vide sul tronco di un albero un piccolo\nanimaletto, che riluceva di una luce pallida e opaca, come un lumino da\nnotte dentro una lampada di porcellana trasparente.","— Chi sei? — gli domandò Pinocchio.","— Sono l'ombra del Grillo-parlante — rispose l'animaletto con una\nvocina fioca fioca, che pareva venisse dal mondo di là.","— Che vuoi da me? — disse il burattino.","— Voglio darti un consiglio. Ritorna indietro e porta i quattro\nzecchini, che ti sono rimasti, al tuo povero babbo, che piange e si\ndispera per non averti più veduto.","— Domani il mio babbo sarà un gran signore, perchè questi quattro\nzecchini diventeranno duemila.","— Non ti fidare, ragazzo mio, di quelli che promettono di farti ricco\ndalla mattina alla sera. Per il solito o sono matti o imbroglioni! Dài\nretta a me, ritorna indietro.","— E io invece voglio andare avanti.","— L'ora è tarda!...","— Voglio andare avanti.","— La nottata è scura....","— Voglio andare avanti.","— La strada è pericolosa....","— Voglio andare avanti.","— Ricordati che i ragazzi che vogliono fare di capriccio e a modo loro,\nprima o poi se ne pentono.","— Le solite storie. Buona notte, Grillo.","— Buona notte, Pinocchio, e che il cielo ti salvi dalla guazza e dagli\nassassini. —","Appena dette queste ultime parole, il Grillo-parlante si spense a un\ntratto, come si spenge un lume soffiandoci sopra, e la strada rimase\npiù buia di prima."]},{"name":"Capitolo 14","paragraphs":["Pinocchio, per non aver dato retta ai buoni consigli del\nGrillo-parlante, s'imbatte negli assassini.","— Davvero.... — disse fra sè il burattino rimettendosi in viaggio —\ncome siamo disgraziati noialtri poveri ragazzi! Tutti ci sgridano,\ntutti ci ammoniscono, tutti ci dànno dei consigli. A lasciarli dire,\ntutti si metterebbero in capo di essere i nostri babbi e i nostri\nmaestri; tutti; anche i Grilli-parlanti. Ecco qui: perchè io non\nho voluto dar retta a quell'uggioso di Grillo, chi lo sa quante\ndisgrazie, secondo lui, mi dovrebbero accadere! Dovrei incontrare\nanche gli assassini! Meno male che agli assassini io non ci credo,\nnè ci ho creduto mai. Per me gli assassini sono stati inventati\napposta dai babbi, per far paura ai ragazzi che vogliono andar fuori\nla notte. E poi, se anche li trovassi qui sulla strada, mi darebbero\nforse soggezione? Neanche per sogno, anderei loro sul viso, gridando:\n«Signori assassini, che cosa vogliono da me? Si rammentino che con\nme non si scherza! Se ne vadano dunque per i fatti loro, e zitti!»\nA questa parlantina fatta sul serio, quei poveri assassini, mi par\ndi vederli, scapperebbero via come il vento. Caso poi fossero tanto\nineducati da non volere scappare, allora scapperei io, e così la farei\nfinita.... —","Ma Pinocchio non potè finire il suo ragionamento, perchè in quel punto\ngli parve di sentire dietro di sè un leggerissimo fruscìo di foglie.","Si voltò a guardare, e vide nel buio due figuracce nere, tutte\nimbacuccate in due sacchi da carbone, le quali correvano dietro a lui\na salti e in punta di piedi, come se fossero due fantasmi.","— Eccoli davvero! — disse dentro di sè: e non sapendo dove nascondere\ni quattro zecchini, se li nascose in bocca e precisamente sotto la\nlingua.","Poi si provò a scappare. Ma non aveva ancora fatto il primo passo,\nche sentì agguantarsi per le braccia e intese due voci orribili e\ncavernose, che gli dissero:","— O la borsa o la vita! —","Pinocchio non potendo rispondere con le parole a motivo delle monete\nche aveva in bocca, fece mille salamelecchi e mille pantomime, per\ndare ad intendere a quei due incappati, di cui si vedevano soltanto gli\nocchi attraverso i buchi dei sacchi, che lui era un povero burattino e\nche non aveva in tasca nemmeno un centesimo falso.","— Via via! Meno ciarle e fuori i denari — gridarono minacciosamente i\ndue briganti.","E il burattino fece col capo e colle mani un segno, come dire: «Non ne\nho.»","[Illustrazione: Sentì agguantarsi per le braccia....]","— Metti fuori i denari o sei morto; — disse l'assassino più alto di\nstatura.","— Morto! — ripetè l'altro.","— E dopo ammazzato te, ammazzeremo anche tuo padre!","— Anche tuo padre!","— No, no, no, il mio povero babbo no! — gridò Pinocchio con accento\ndisperato: ma nel gridare così, gli zecchini gli sonarono in bocca.","— Ah furfante! dunque i denari te li sei nascosti sotto la lingua?\nSputali subito! —","E Pinocchio, duro.","— Ah! tu fai il sordo? Aspetta un po', che penseremo noi a farteli\nsputare! —","Difatti uno di loro afferrò il burattino per la punta del naso\ne quell'altro lo prese per la bazza, e lì cominciarono a tirare\nscreanzatamente uno per in qua l'altro per in là, tanto da costringerlo\na spalancare la bocca: ma non ci fu verso. La bocca del burattino\npareva inchiodata e ribadita.","Allora l'assassino più piccolo di statura, cavato fuori un\ncoltellaccio, provò a conficcarglielo a guisa di leva e di scalpello\nfra le labbra: ma Pinocchio, lesto come un lampo, gli azzannò la mano\ncoi denti, e dopo avergliela con un morso staccata di netto, la sputò e\nfiguratevi la sua maraviglia quando, invece di una mano, si accòrse di\naver sputato in terra uno zampetto di gatto.","Incoraggito da questa prima vittoria, si liberò a forza dalle unghie\ndegli assassini, e saltata la siepe della strada, cominciò a fuggire\nper la campagna. E gli assassini a correre dietro a lui, come due cani\ndietro a una lepre: e quello che aveva perduto uno zampetto correva con\nuna gamba sola, nè si è saputo mai come facesse.","Dopo una corsa di quindici chilometri, Pinocchio non ne poteva più.\nAllora vistosi perso, si arrampicò su per il fusto di un altissimo\npino e si pose a sedere in vetta ai rami. Gli assassini tentarono di\narrampicarsi anche loro, ma giunti a metà del fusto sdrucciolarono, e\nricascando a terra, si spellarono le mani e i piedi.","Non per questo si dettero per vinti: che anzi, raccolto un fastello di\nlegna secche a piè del pino, vi appiccarono il fuoco. In men che non\nsi dice, il pino cominciò a bruciare e a divampare come una candela\nagitata dal vento. Pinocchio, vedendo che le fiamme salivano sempre più\ne non volendo far la fine del piccione arrosto, spiccò un bel salto\ndi vetta all'albero, e via a correre daccapo attraverso i campi e ai\nvigneti. E gli assassini dietro, sempre dietro, senza stancarsi mai.","Intanto cominciava a baluginare il giorno e si trovò improvvisamente\nsbarrato il passo da un fosso largo e profondissimo, tutto pieno\ndi acquaccia sudicia, color del caffè e latte. Che fare? «Una, due,\ntre!» gridò il burattino, e slanciandosi con una gran rincorsa, saltò\ndall'altra parte. E gli assassini saltarono anche loro, ma non avendo\npreso bene la misura, _patatunfete!_... cascarono giù nel bel mezzo\ndel fosso. Pinocchio che sentì il tonfo e gli schizzi dell'acqua, urlò\nridendo e seguitando a correre:","— Buon bagno, signori assassini. —","E già si figurava che fossero bell'e affogati, quando invece,\nvoltandosi a guardare, si accòrse che gli correvano dietro tutt'e due,\nsempre imbacuccati nei loro sacchi, e grondanti acqua come due panieri\nsfondati."]},{"name":"Capitolo 15","paragraphs":["Gli assassini inseguono Pinocchio; e dopo averlo raggiunto lo impiccano\na un ramo della Quercia grande.","Allora il burattino, perdutosi d'animo fu proprio sul punto di gettarsi\na terra e di darsi per vinto, quando, nel girare gli occhi all'intorno,\nvide fra mezzo al verde cupo degli alberi biancheggiare in lontananza\nuna casina candida come la neve.","— Se io avessi tanto fiato da arrivare fino a quella casa, forse sarei\nsalvo! — disse dentro di sè.","E senza indugiare un minuto, riprese a correre per il bosco a carriera\ndistesa. E gli assassini sempre dietro.","Dopo una corsa disperata di quasi due ore, finalmente, tutto trafelato,\narrivò alla porta di quella casina e bussò.","Nessuno rispose.","Tornò a bussare con maggior violenza, perchè sentiva avvicinarsi il\nrumore dei passi e il respiro grosso e affannoso dei suoi persecutori.","Lo stesso silenzio.","Avvedutosi che il bussare non giovava a nulla, cominciò per\ndisperazione a dare calci e zuccate nella porta. Allora si affacciò\nalla finestra una bella Bambina, coi capelli turchini e il viso bianco\ncome un'immagine di cera, gli occhi chiusi e le mani incrociate sul\npetto, la quale senza muover punto le labbra, disse con una vocina che\npareva venisse dall'altro mondo:","— In questa casa non c'è nessuno; sono tutti morti.","— Aprimi almeno tu! — gridò Pinocchio piangendo e raccomandandosi.","— Sono morta anch'io.","— Morta? e allora che cosa fai costì alla finestra?","— Aspetto la bara che venga a portarmi via. —","Appena detto così, la Bambina disparve e la finestra si richiuse senza\nfar rumore.","— O bella Bambina dai capelli turchini, — gridava Pinocchio — aprimi\nper carità! Abbi compassione di un povero ragazzo inseguito dagli\nassass.... —","Ma non potè finir la parola, perchè sentì afferrarsi per il collo, e le\nsolite due vociacce che gli brontolarono minacciosamente:","— Ora non ci scappi più! —","Il burattino, vedendosi balenare la morte dinanzi agli occhi, fu preso\nda un tremito così forte, che nel tremare, gli sonavano le giunture\ndelle sue gambe di legno e i quattro zecchini che teneva nascosti sotto\nla lingua.","— Dunque? — gli domandarono gli assassini — vuoi aprirla la bocca, sì o\nno? Ah! non rispondi? Lascia fare: che questa volta te la faremo aprir\nnoi!... —","E cavati fuori due coltellacci lunghi lunghi e affilati come rasoi,\n_zaff_ e _zaff_... gli affibbiarono due colpi nel mezzo alle reni.","Ma il burattino per sua fortuna era fatto d'un legno durissimo, motivo\nper cui le lame, spezzandosi, andarono in mille schegge e gli assassini\nrimasero col manico dei coltelli in mano, a guardarsi in faccia.","— Ho capito; — disse allora uno di loro — bisogna impiccarlo.\nImpicchiamolo!","— Impicchiamolo — ripetè l'altro.","Detto fatto gli legarono le mani dietro le spalle, e passatogli un nodo\nscorsoio intorno alla gola, lo attaccarono penzoloni al ramo di una\ngrossa pianta detta la Quercia grande.","Poi si posero là, seduti sull'erba, aspettando che il burattino facesse\nl'ultimo sgambetto: ma il burattino dopo tre ore aveva sempre gli occhi\naperti, la bocca chiusa e sgambettava più che mai.","Annoiati finalmente di aspettare, si voltarono a Pinocchio e gli\ndissero sghignazzando:","— Addio a domani. Quando domani torneremo qui, si spera che ci\nfarai la garbatezza di farti trovare bell'e morto e con la bocca\nspalancata. —","E se ne andarono.","Intanto s'era levato un vento impetuoso di tramontana, che soffiando e\nmugghiando con rabbia, sbatacchiava in qua e in là il povero impiccato,\nfacendolo dondolare violentemente come il battaglio d'una campana che\nsuona a festa. E quel dondolìo gli cagionava acutissimi spasimi, e\nil nodo scorsoio, stringendosi sempre più alla gola, gli toglieva il\nrespiro.","A poco a poco gli occhi gli si appannarono; e sebbene sentisse\navvicinarsi la morte, pure sperava sempre che da un momento a un altro\nsarebbe capitata qualche anima pietosa a dargli aiuto.","Ma quando, aspetta aspetta, vide che non compariva nessuno, proprio\nnessuno, allora gli tornò in mente il suo povero babbo.... e balbettò\nquasi moribondo:","— Oh babbo mio! se tu fossi qui!... —","E non ebbe fiato per dir altro. Chiuse gli occhi, aprì la bocca, stirò\nle gambe, e dato un grande scrollone, rimase lì come intirizzito."]},{"name":"Capitolo 16","paragraphs":["La bella Bambina dai capelli turchini fa raccogliere il burattino: lo\nmette a letto, e chiama tre medici per sapere se sia vivo o morto.","In quel mentre che il povero Pinocchio impiccato dagli assassini a un\nramo della Quercia grande, pareva oramai più morto che vivo, la bella\nBambina dai capelli turchini si affacciò daccapo alla finestra, e\nimpietositasi alla vista di quell'infelice che, sospeso per il collo,\nballava il trescone alle ventate di tramontana, battè per tre volte le\nmani insieme, e fece tre piccoli colpi.","A questo segnale si sentì un gran rumore di ali che volavano con foga\nprecipitosa, e un grosso Falco venne a posarsi sul davanzale della\nfinestra.","— Che cosa comandate, mia graziosa Fata? — disse il Falco abbassando il\nbecco in atto di riverenza; perchè bisogna sapere, che la Bambina dai\ncapelli turchini, non era altro, in fin dei conti, che una buonissima\nFata, che da più di mill'anni abitava nelle vicinanze di quel bosco.","— Vedi tu quel burattino attaccato penzoloni a un ramo della Quercia\ngrande?","— Lo vedo.","— Orbene: vola subito laggiù; rompi col tuo fortissimo becco il\nnodo che lo tiene sospeso in aria, e posalo delicatamente sdraiato\nsull'erba, a piè della Quercia. —","Il Falco volò via, e dopo due minuti tornò dicendo:","— Quel che mi avete comandato è fatto.","— E come l'hai trovato? Vivo o morto?","[Illustrazione: Un grosso Falco venne a posarsi sul davanzale\ndella finestra.]","— A vederlo pareva morto, ma non dev'essere ancora morto perbene,\nperchè appena gli ho sciolto il nodo scorsoio che lo stringeva intorno\nalla gola, ha lasciato andare un sospiro, balbettando a mezza voce:\n«Ora mi sento meglio!...» —","Allora la Fata, battendo le mani insieme, fece due piccoli colpi, e\napparve un magnifico Can-barbone, che camminava ritto sulle gambe di\ndietro, tale e quale come se fosse un uomo.","Il Can-barbone era vestito da cocchiere in livrea di gala. Aveva in\ncapo un nicchiettino a tre punte gallonato d'oro, una parrucca bionda\ncoi riccioli che gli scendevano giù per il collo, una giubba color di\ncioccolata coi bottoni di brillanti e con due grandi tasche per tenervi\ngli ossi, che gli regalava a pranzo la padrona, un paio di calzon\ncorti di velluto cremisi, le calze di seta, gli scarpini scollati, e\ndi dietro una specie di fodera da ombrelli, tutta di raso turchino, per\nmettervi dentro la coda, quando il tempo cominciava a piovere.","— Su da bravo, Medoro! — disse la Fata al Can-barbone. — Fa' subito\nattaccare la più bella carrozza della mia scuderia e prendi la via del\nbosco. Arrivato che sarai sotto la Quercia grande, troverai disteso\nsull'erba un povero burattino mezzo morto. Raccoglilo con garbo,\nposalo pari pari sui cuscini della carrozza e portamelo qui. Hai\ncapito? —","Il Can-barbone, per fare intendere che aveva capito, dimenò tre o\nquattro volte la fodera di raso turchino, che aveva dietro, e partì\ncome un barbero.","Di lì a poco, si vide uscire dalla scuderia una bella carrozzina color\ndell'aria, tutta imbottita di penne di canarino e foderata nell'interno\ndi panna montata e di crema coi savoiardi. La carrozzina era tirata da\ncento pariglie di topini bianchi, e il Can-barbone, seduto a cassetta,\nschioccava la frusta a destra e a sinistra, come un vetturino quand'ha\npaura di aver fatto tardi.","[Illustrazione: Il Can-barbone partì come un barbero.]","Non era ancora passato un quarto d'ora che la carrozzina tornò, e\nla Fata, che stava aspettando sull'uscio di casa, prese in collo il\npovero burattino, e portatolo in una cameretta che aveva le pareti di\nmadreperla, mandò subito a chiamare i medici più famosi del vicinato.","E i medici arrivarono subito uno dopo l'altro: arrivò cioè, un Corvo,\nuna Civetta e un Grillo-parlante.","— Vorrei saper da lor signori — disse la Fata, rivolgendosi ai tre\nmedici riuniti intorno al letto di Pinocchio — vorrei sapere da lor\nsignori se questo disgraziato burattino sia vivo o morto!... —","[Illustrazione: La Fata prese in collo il povero burattino.]","A quest'invito, il Corvo, facendosi avanti per il primo, tastò il polso\na Pinocchio; poi gli tastò il naso, poi il dito mignolo dei piedi: e\nquand'ebbe tastato ben bene, pronunziò solennemente queste parole:","— A mio credere il burattino è bell'e morto: ma se per disgrazia non\nfosse morto, allora sarebbe indizio sicuro che è sempre vivo!","— Mi dispiace — disse la Civetta — di dover contraddire il Corvo, mio\nillustre amico e collega; per me, invece, il burattino è sempre vivo;\nma se per disgrazia non fosse vivo, allora sarebbe segno che è morto\ndavvero.","— E lei non dice nulla? — domandò la Fata al Grillo-parlante.","— Io dico che il medico prudente, quando non sa quello che dice,\nla miglior cosa che possa fare, è quella di stare zitto. Del resto\nquel burattino lì, non m'è fisonomia nuova: io lo conosco da un\npezzo! —","Pinocchio, che fin allora era stato immobile come un vero pezzo di\nlegno, ebbe una specie di fremito convulso, che fece scuotere tutto il\nletto.","— Quel burattino lì — seguitò a dire il Grillo-parlante — è una birba\nmatricolata.... —","Pinocchio aprì gli occhi e li richiuse subito.","— È un monellaccio, uno svogliato, un vagabondo.... —","Pinocchio si nascose la faccia sotto i lenzuoli.","— Quel burattino lì è un figliuolo disubbidiente, che farà morire di\ncrepacuore il suo povero babbo!... —","A questo punto si sentì nella camera un suono soffocato di pianti e\nsinghiozzi. Figuratevi come rimasero tutti, allorchè, sollevati un poco\ni lenzuoli, si accorsero che quello che piangeva e singhiozzava era\nPinocchio.","— Quando il morto piange è segno che è in via di guarigione — disse\nsolennemente il Corvo.","— Mi duole di contraddire il mio illustre amico e collega, — soggiunse\nla Civetta — ma per me quando il morto piange, è segno che gli dispiace\na morire. —"]},{"name":"Capitolo 17","paragraphs":["Pinocchio mangia lo zucchero, ma non vuol purgarsi; però quando vede\ni becchini che vengono a portarlo via, allora si purga. Poi dice una\nbugia e per gastigo gli cresce il naso.","Appena i tre medici furono usciti di camera, la Fata si accostò a\nPinocchio, e, dopo averlo toccato sulla fronte, si accòrse che era\ntravagliato da un febbrone da non si dire.","Allora sciolse un certa polverina bianca in un mezzo bicchier d'acqua,\ne porgendolo al burattino, gli disse amorosamente:","— Bevila, e in pochi giorni sarai guarito. —","Pinocchio guardò il bicchiere, storse un po' la bocca, e poi domandò\ncon voce di piagnisteo:","— È dolce o amara?","— È amara, ma ti farà bene.","— Se è amara non la voglio.","— Da' retta a me: bevila.","— A me l'amaro non mi piace.","— Bevila: e quando l'avrai bevuta, ti darò una pallina di zucchero, per\nrifarti la bocca.","— Dov'è la pallina di zucchero?","— Eccola qui — disse la Fata, tirandola fuori da una zuccheriera d'oro.","— Prima voglio la pallina di zucchero, e poi beverò quell'acquaccia\namara....","— Me lo prometti?","— Sì.... —","La Fata gli dette la pallina, e Pinocchio dopo averla sgranocchiata e\ningoiata in un attimo, disse leccandosi i labbri:","— Bella cosa se anche lo zucchero fosse una medicina!... Mi purgherei\ntutt'i giorni.","— Ora mantieni la promessa e bevi queste poche gocciole d'acqua, che ti\nrenderanno la salute. —","Pinocchio prese di mala voglia il bicchiere in mano e vi ficcò dentro\nla punta del naso: poi se l'accostò alla bocca: poi tornò a ficcarci la\npunta del naso: finalmente disse:","— È troppo amara! troppo amara! Io non la posso bere.","— Come fai a dirlo, se non l'hai nemmeno assaggiata?","— Me lo figuro! L'ho sentita all'odore. Voglio prima un'altra pallina\ndi zucchero.... e poi la beverò! —","Allora la Fata, con tutta la pazienza di una buona mamma, gli pose\nin bocca un altro po' di zucchero; e dopo gli presentò daccapo il\nbicchiere.","— Così non lo posso bere! — disse il burattino, facendo mille smorfie.","— Perchè?","— Perchè mi dà noia quel guanciale che ho laggiù sui piedi. —","La Fata gli levò il guanciale.","— È inutile! Nemmeno così la posso bere.","— Che cos'altro ti dà noia?","— Mi da noia l'uscio di camera, che è mezzo aperto. —","La Fata andò, e chiuse l'uscio di camera.","— Insomma, — gridò Pinocchio dando in uno scoppio di pianto —\nquest'acquaccia amara, non la voglio bere, no, no, no!...","— Ragazzo mio, te ne pentirai....","— Non me n'importa....","— La tua malattia è grave.","— Non me n'importa.....","— La febbre ti porterà in poche ore all'
