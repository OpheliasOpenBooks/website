altro mondo....","— Non me n'importa....","— Non hai paura della morte?","— Nessuna paura! Piuttosto morire, che bevere quella medicina\ncattiva. —","A questo punto, la porta della camera si spalancò, ed entrarono dentro\nquattro conigli neri come l'inchiostro, che portavano sulle spalle una\npiccola bara da morto.","[Illustrazione: Entrarono dentro quattro conigli neri come\nl'inchiostro.]","— Che cosa volete da me? — gridò Pinocchio, rizzandosi tutto impaurito\na sedere sul letto.","— Siamo venuti a prenderti — rispose il coniglio più grosso.","— A prendermi? Ma io non sono ancora morto!...","— Ancora no: ma ti restano pochi momenti di vita, avendo tu ricusato di\nbevere la medicina, che ti avrebbe guarito dalla febbre!","— O Fata mia, o Fata mia! — cominciò allora a strillare il burattino\n— datemi subito quel bicchiere.... Spicciatevi, per carità, perchè non\nvoglio morire, no.... non voglio morire. —","E preso il bicchiere con tutt'e due le mani, lo votò in un fiato.","— Pazienza! — dissero i conigli. — Per questa volta abbiamo fatto il\nviaggio a ufo. — E tiratisi di nuovo la piccola bara sulle spalle,\nuscirono di camera bofonchiando e mormorando fra i denti.","Fatto sta che di lì a pochi minuti, Pinocchio saltò giù dal letto,\nbell'e guarito; perchè bisogna sapere che i burattini di legno hanno il\nprivilegio di ammalarsi di rado e di guarire prestissimo.","E la Fata, vedendolo correre e ruzzare per la camera, vispo e allegro\ncome un gallettino di primo canto, gli disse:","— Dunque la mia medicina t'ha fatto bene davvero?","— Altro che bene! Mi ha rimesso al mondo!","— E allora come mai ti sei fatto tanto pregare a beverla?","— Egli è che noi ragazzi siamo tutti così! Abbiamo più paura delle\nmedicine che del male.","— Vergogna! I ragazzi dovrebbero sapere che un buon medicamento preso a\ntempo, può salvarli da una grave malattia e fors'anche dalla morte....","— Oh! ma un'altra volta non mi farò tanto pregare! Mi rammenterò di\nquei conigli neri, con la bara sulle spalle.... e allora piglierò\nsubito il bicchiere in mano e giù....","— Ora vieni un po' qui da me, e raccontami come andò che ti trovasti\nfra le mani degli assassini.","— Gli andò, che il burattinaio Mangiafoco, mi dette cinque monete\nd'oro, e mi disse: — To', portale al tuo babbo! — e io, invece, per la\nstrada trovai una Volpe e un Gatto, due persone molto per bene, che mi\ndissero: — Vuoi che codeste monete diventino mille e duemila? Vieni con\nnoi, e ti condurremo al Campo dei miracoli. — E io dissi, andiamo; —\ne loro dissero: — Fermiamoci qui all'osteria del Gambero Rosso, e dopo\nla mezzanotte ripartiremo. — E io quando mi svegliai, non c'erano più,\nperchè erano partiti. Allora io cominciai a camminare di notte, che\nera un buio che pareva impossibile, per cui trovai per la strada due\nassassini dentro due sacchi da carbone, che mi dissero: — Metti fuori\ni quattrini; — e io dissi: — non ce n'ho; — perchè le monete d'oro me\nl'ero nascoste in bocca, e uno degli assassini si provò a mettermi le\nmani in bocca, e io con un morso gli staccai la mano e poi la sputai,\nma invece di una mano sputai uno zampetto di gatto. E gli assassini a\ncorrermi dietro, e io corri che ti corri, finchè mi raggiunsero, e mi\nlegarono per il collo a un albero di questo bosco col dire: — Domani\ntorneremo qui, e allora sarai morto e colla bocca aperta, e così ti\nporteremo via le monete d'oro che hai nascoste sotto la lingua. —","— E ora le quattro monete dove le hai messe? — gli domandò la Fata.","— Le ho perdute! — rispose Pinocchio; ma disse una bugia, perchè invece\nle aveva in tasca.","Appena detta la bugia il suo naso, che era già lungo, gli crebbe subito\ndue dita di più.","— E dove le hai perdute?","— Nel bosco qui vicino. —","A questa seconda bugia, il naso seguitò a crescere.","— Se le hai perdute nel bosco vicino — disse la Fata — le cercheremo e\nle ritroveremo: perchè tutto quello che si perde nel vicino bosco, si\nritrova sempre.","— Ah! ora che mi rammento bene — replicò il burattino imbrogliandosi\n— le quattro monete non le ho perdute, ma senza avvedermene, le ho\ninghiottite mentre bevevo la vostra medicina. —","[Illustrazione: Il naso gli si allungò in un modo così\nstraordinario....]","A questa terza bugia, il naso gli si allungò in un modo così\nstraordinario, che il povero Pinocchio non poteva più girarsi da\nnessuna parte. Se si voltava di qui, batteva il naso nel letto o nei\nvetri della finestra, se si voltava di là, lo batteva nelle pareti\no nella porta di camera, se alzava un po' di più il capo, correva il\nrischio di ficcarlo in un occhio alla Fata.","E la Fata lo guardava e rideva.","— Perchè ridete? — gli domandò il burattino, tutto confuso e\nimpensierito di quel suo naso che cresceva a occhiate.","— Rido della bugia che hai detto.","— Come mai sapete che ho detto una bugia?","— Le bugie, ragazzo mio, si riconoscono subito, perchè ve ne sono di\ndue specie: vi sono le bugie che hanno le gambe corte, e le bugie che\nhanno il naso lungo: la tua per l'appunto è di quelle che hanno il naso\nlungo. —","Pinocchio, non sapendo più dove nascondersi per la vergogna, si provò a\nfuggire di camera, ma non gli riuscì. Il suo naso era cresciuto tanto,\nche non passava più dalla porta."]},{"name":"Capitolo 18","paragraphs":["Pinocchio ritrova la Volpe e il Gatto, e va con loro a seminare le\nquattro monete nel Campo dei miracoli.","Come potete immaginarvelo, la Fata lasciò che il burattino piangesse e\nurlasse una buona mezz'ora a motivo di quel suo naso che non passava\npiù dalla porta di camera: e lo fece per dargli una severa lezione e\nperchè si correggesse dal brutto vizio di dire bugie, il più brutto\nvizio che possa avere un ragazzo. Ma quando lo vide trasfigurato e\ncogli occhi fuori della testa dalla gran disperazione, allora, mossa\na pietà, battè le mani insieme, e a quel segnale entrarono in camera\ndalla finestra un migliaio di grossi uccelli chiamati _Picchi_,\ni quali, posatisi tutti sul naso di Pinocchio, cominciarono a\nbeccarglielo tanto e poi tanto, che in pochi minuti quel naso enorme e\nspropositato si trovò ridotto alla sua grandezza naturale.","— Quanto siete buona, Fata mia, — disse il burattino, asciugandosi gli\nocchi — e quanto bene vi voglio!","— Ti voglio bene anch'io, — rispose la Fata — e se tu vuoi rimanere con\nme, tu sarai il mio fratellino e io la tua buona sorellina....","— Io resterei volentieri.... ma il mio povero babbo?","— Ho pensato a tutto. Il tuo babbo è stato digià avvertito: e prima che\nfaccia notte, sarà qui.","— Davvero? — gridò Pinocchio, saltando dall'allegrezza. — Allora,\nFatina mia, se vi contentate, vorrei andargli incontro! Non vedo l'ora\ndi poter dare un bacio a quel povero vecchio, che ha sofferto tanto per\nme!","— Va' pure, ma bada di non ti sperdere. Prendi la via del bosco, e sono\nsicura che lo incontrerai. —","Pinocchio partì: e appena entrato nel bosco, cominciò a correre come\nun capriòlo. Ma quando fu arrivato a un certo punto, quasi in faccia\nalla Quercia grande, si fermò, perchè gli parve di aver sentito gente\nfra mezzo alle frasche. Difatti vide apparire sulla strada, indovinate\nchi?... la Volpe e il Gatto, ossia i due compagni di viaggio coi quali\naveva cenato all'osteria del Gambero rosso.","— Ecco il nostro caro Pinocchio! — gridò la Volpe, abbracciandolo e\nbaciandolo. — Come mai sei qui?","— Come mai sei qui? — ripetè il Gatto.","— È una storia lunga — disse il burattino — e ve la racconterò a\ncomodo. Sappiate però che l'altra notte, quando mi avete lasciato solo\nnell'osteria ho trovato gli assassini per la strada....","— Gli assassini?... Oh povero amico! E che cosa volevano?","[Illustrazione: — Ecco il nostro caro Pinocchio! — gridò la\nVolpe, abbracciandolo.]","— Mi volevano rubare le monete d'oro.","— Infami!... — disse la Volpe.","— Infamissimi! — ripetè il Gatto.","— Ma io cominciai a scappare — continuò a dire il burattino — e loro\nsempre dietro: finchè mi raggiunsero e m'impiccarono a un ramo di\nquella quercia.... —","E Pinocchio accennò la Quercia grande, che era lì a due passi.","— Si può sentir di peggio? — disse la Volpe. — In che mondo siamo\ncondannati a vivere! Dove troveremo un rifugio sicuro noialtri\ngalantuomini? —","Nel tempo che parlavano così, Pinocchio si accorse che il gatto era\nzoppo dalla gamba destra davanti, perchè gli mancava in fondo tutto lo\nzampetto cogli unghioli; per cui gli domandò:","— Che cosa hai fatto del tuo zampetto? —","Il gatto voleva rispondere qualche cosa, ma s'imbrogliò. Allora la\nVolpe disse subito:","— Il mio amico è troppo modesto, e per questo non risponde. Risponderò\nio per lui. Sappi dunque che un'ora fa abbiamo incontrato sulla strada\nun vecchio lupo, quasi svenuto dalla fame, che ci ha chiesto un po'\nd'elemosina. Non avendo noi da dargli nemmeno una lisca di pesce, che\ncosa ha fatto l'amico mio, che ha davvero un cuore di Cesare? Si è\nstaccato coi denti uno zampetto delle sue gambe davanti e l'ha gettato\na quella povera bestia, perchè potesse sdigiunarsi. —","E la Volpe, nel dir così si asciugò una lagrima.","Pinocchio, commosso anche lui, si avvicinò al Gatto, sussurrandogli\nnegli orecchi:","— Se tutti i gatti ti somigliassero, fortunati i topi!","— E ora che cosa fai in questi luoghi? — domandò la Volpe al burattino.","— Aspetto il mio babbo, che deve arrivare qui di momento in momento.","— E le tue monete d'oro?","— Le ho sempre in tasca, meno una che la spesi all'osteria del Gambero\nrosso.","— E pensare che, invece di quattro monete, potrebbero diventare domani\nmille e duemila! Perchè non dài retta al mio consiglio? Perchè non vai\na seminarle nel Campo dei miracoli?","— Oggi è impossibile: vi anderò un altro giorno.","— Un altro giorno sarà tardi! — disse la Volpe.","— Perchè?","— Perchè quel campo è stato comprato da un gran signore, e da domani in\nlà non sarà più permesso a nessuno di seminarvi i denari.","— Quant'è distante di qui il Campo dei miracoli?","— Due chilometri appena. Vuoi venire con noi? Fra mezz'ora sei là:\nsemini subito le quattro monete: dopo pochi minuti ne raccogli duemila,\ne stasera ritorni qui con le tasche piene. Vuoi venire con noi? —","Pinocchio esitò un poco a rispondere, perchè gli tornò in mente la\nbuona Fata, il vecchio Geppetto e gli avvertimenti del Grillo-parlante;\nma poi finì col fare come fanno tutti i ragazzi senza un fil di\ngiudizio e senza cuore; finì, cioè, col dare una scrollatina di capo,\ne disse alla Volpe e al Gatto:","— Andiamo pure; io vengo con voi. —","E partirono.","Dopo aver camminato una mezza giornata arrivarono a una città che\naveva nome «Acchiappacitrulli.» Appena entrato in città, Pinocchio\nvide tutte le strade popolate di cani spelacchiati, che sbadigliavano\ndall'appetito, di pecore tosate, che tremavano dal freddo, e di galline\nrimaste senza cresta e senza bargigli, che chiedevano l'elemosina d'un\nchicco di granturco, di grosse farfalle che non potevano più volare,\nperchè avevano venduto le loro bellissime ali colorite, di pavoni\ntutti scodati, che si vergognavano a farsi vedere, e di fagiani che\nzampettavano cheti cheti, rimpiangendo le loro scintillanti penne d'oro\ne d'argento, ormai perdute per sempre.","In mezzo a questa folla di accattoni e di poveri vergognosi, passavano\ndi tanto in tanto alcune carrozze signorili con entro o qualche Volpe,\no qualche Gazza ladra, o qualche uccellaccio di rapina.","— E il Campo dei miracoli dov'è? — domandò Pinocchio.","— È qui a due passi. —","[Illustrazione: Vide tutte le strade popolate di cani\nspelacchiati.]","Detto fatto traversarono la città, e, usciti fuori delle mura, si\nfermarono in un campo solitario che, su per giù, somigliava a tutti gli\naltri campi.","— Eccoci giunti; — disse la Volpe al burattino — ora chinati giù a\nterra, scava con le mani una piccola buca nel campo, e mettici dentro\nle monete d'oro. —","Pinocchio obbedì. Scavò la buca, ci pose le quattro monete d'oro che\ngli erano rimaste: e dopo ricoprì la buca con un po' di terra.","— Ora poi — disse la Volpe — va' alla gora qui vicina, prendi una\nsecchia d'acqua e annaffia il terreno dove hai seminato. —","Pinocchio andò alla gora, e perchè non aveva lì per lì una secchia, si\nlevò di piedi una ciabatta, e riempitala d'acqua, annaffiò la terra che\ncopriva la buca. Poi domandò:","— C'è altro da fare?","— Nient'altro; — rispose la Volpe — ora possiamo andar via. Tu poi\nritorna qui fra una ventina di minuti, e troverai l'arboscello già\nspuntato dal suolo e coi rami tutti carichi di monete. —","Il povero burattino, fuori di sè dalla gran contentezza, ringraziò\nmille volte la Volpe e il Gatto, e promise loro un bellissimo regalo.","— Noi non vogliamo regali; — risposero que' due malanni — a noi ci\nbasta di averti insegnato il modo di arricchire senza durar fatica, e\nsiamo contenti come pasque. —","Ciò detto salutarono Pinocchio, e augurandogli una buona raccolta, se\nne andarono per i fatti loro."]},{"name":"Capitolo 19","paragraphs":["Pinocchio è derubato delle sue monete d'oro, e per gastigo si busca\nquattro mesi di prigione.","Il burattino, ritornato in città, cominciò a contare i minuti a uno a\nuno: e quando gli parve che fosse l'ora, riprese subito la strada che\nmenava al Campo dei miracoli.","E mentre camminava con passo frettoloso, il cuore gli batteva forte e\ngli faceva tic, tac, tic, tac, come un orologio da sala, quando corre\ndavvero. E intanto pensava dentro di sè:","— E se invece di mille monete ne trovassi su i rami dell'albero\nduemila?... E se invece di duemila, ne trovassi cinquemila? e se invece\ndi cinquemila, ne trovassi centomila? O che bel signore, allora, che\ndiventerei!... Vorrei avere un bel palazzo, mille cavallini di legno\ne mille scuderie, per potermi baloccare, una cantina di rosolii e\ndi alchermes, e una libreria tutta piena di canditi, di torte, di\npanettoni, di mandorlati e di cialdoni colla panna. —","[Illustrazione: Tirò fuori una mano di tasca e si dette una\nlunghissima grattatina di capo.]","Così fantasticando, giunse in vicinanza del campo, e lì si fermò a\nguardare se per caso avesse potuto scorgere qualche albero coi rami\ncarichi di monete: ma non vide nulla. Fece altri cento passi in avanti,\ne nulla; entrò sul campo.... andò proprio su quella piccola buca, dove\naveva sotterrato i suoi zecchini, e nulla. Allora diventò pensieroso,\ne, dimenticando le regole del Galateo e della buona creanza, tirò fuori\nuna mano di tasca e si dette una lunghissima grattatina di capo.","In quel mentre sentì fischiarsi negli orecchi una gran risata: e\nvoltandosi in su, vide sopra un albero un grosso pappagallo, che si\nspollinava le poche penne che aveva addosso.","— Perchè ridi? — gli domandò Pinocchio con voce di bizza.","— Rido, perchè nello spollinarmi mi son fatto il solletico sotto le\nali. —","Il burattino non rispose. Andò alla gora e riempita d'acqua la solita\nciabatta, si pose nuovamente ad annaffiare la terra, che ricopriva le\nmonete d'oro.","Quand'ecco che un'altra risata, anche più impertinente della prima, si\nfece sentire nella solitudine silenziosa di quel campo.","— Insomma, — gridò Pinocchio arrabbiandosi — si può sapere, Pappagallo\nmal educato, di che cosa ridi?","— Rido di quei barbagianni, che credono a tutte le scioccherie e che si\nlasciano trappolare da chi è più furbo di loro.","— Parli forse di me?","— Sì, parlo di te, povero Pinocchio: di te che sei così dolce di sale,\nda credere che i denari si possano seminare e raccogliere nei campi,\ncome si seminano i fagiuoli e le zucche. Anch'io l'ho creduto una\nvolta, e oggi ne porto le pene. Oggi (ma troppo tardi!) mi son dovuto\npersuadere che per mettere insieme onestamente pochi soldi bisogna\nsaperseli guadagnare o col lavoro delle proprie mani o coll'ingegno\ndella propria testa.","— Non ti capisco — disse il burattino, che già cominciava a tremare\ndalla paura.","— Pazienza! Mi spiegherò meglio — soggiunse il Pappagallo. — Sappi\ndunque che, mentre tu eri in città, la Volpe e il Gatto sono tornati\nin questo campo: hanno preso le monete d'oro sotterrate, e poi sono\nfuggiti come il vento. E ora, chi li raggiunge è bravo! —","Pinocchio restò a bocca aperta, e non volendo credere alle parole del\nPappagallo, cominciò colle mani e colle unghie a scavare il terreno che\naveva annaffiato. E scava, scava, scava, fece una buca così profonda,\nche ci sarebbe entrato per ritto un pagliaio: ma le monete non c'erano\npiù.","Preso allora dalla disperazione, tornò di corsa in città e andò\ndifilato in tribunale, per denunziare al giudice i due malandrini, che\nlo avevano derubato.","Il giudice era uno scimmione della razza dei Gorilla: un vecchio\nscimmione rispettabile per la sua grave età, per la sua barba bianca e\nspecialmente per i suoi occhiali d'oro, senza vetri, che era costretto\na portare continuamente, a motivo d'una flussione d'occhi, che lo\ntormentava da parecchi anni.","[Illustrazione: Pinocchio, alla presenza del giudice raccontò\nper filo e per segno l'iniqua frode.]","Pinocchio, alla presenza del giudice, raccontò per filo e per segno\nl'iniqua frode, di cui era stato vittima; dette il nome, il cognome e\ni connotati dei malandrini, e finì chiedendo giustizia.","Il giudice lo ascoltò con molta benignità; prese vivissima parte al\nracconto: s'intenerì, si commosse: e quando il burattino non ebbe più\nnulla da dire, allungò la mano e sonò il campanello.","A quella scampanellata comparvero subito due can mastini vestiti da\ngiandarmi.","Allora il giudice, accennando Pinocchio ai giandarmi, disse loro:","— Quel povero diavolo è stato derubato di quattro monete d'oro:\npigliatelo dunque, e mettetelo subito in prigione. —","Il burattino, sentendosi dare questa sentenza fra capo e collo,\nrimase di princisbecco e voleva protestare: ma i giandarmi, a scanso\ndi perditempi inutili, gli tapparono la bocca e lo condussero in\ngattabuia.","E lì v'ebbe a rimanere quattro mesi: quattro lunghissimi mesi:\ne vi sarebbe rimasto anche di più, se non si fosse dato un caso\nfortunatissimo. Perchè bisogna sapere che il giovane Imperatore\nche regnava nella città di Acchiappacitrulli, avendo riportato una\nbella vittoria contro i suoi nemici, ordinò grandi feste pubbliche,\nluminarie, fuochi artificiali, corse di barberi e di velocipedi, e in\nsegno di maggiore esultanza, volle che fossero aperte anche le carceri\ne mandati fuori tutti i malandrini.","— Se escono di prigione gli altri, voglio uscire anch'io — disse\nPinocchio al carceriere.","[Illustrazione: — Quel povero diavolo è stato derubato di\nquattro monete d'oro: pigliatelo dunque, e mettetelo subito in\nprigione.]","— Voi no, — rispose il carceriere — perchè voi non siete del bel\nnumero....","— Domando scusa; — replicò Pinocchio — sono un malandrino anch'io.","[Illustrazione: Gli tapparono la bocca e lo condussero in\ngattabuia.]","— In questo caso avete mille ragioni, — disse il carceriere; e\nlevandosi il berretto rispettosamente e salutandolo, gli aprì le porte\ndella prigione e lo lasciò scappare."]},{"name":"Capitolo 20","paragraphs":["Liberato dalla prigione, si avvia per tornare a casa della Fata; ma\nlungo la strada trova un serpente orribile, e poi rimane preso alla\ntagliuola.","Figuratevi l'allegrezza di Pinocchio quando si sentì libero. Senza\nstare a dire che è e che non è, uscì subito fuori della città e riprese\nla strada che doveva ricondurlo alla Casina della Fata.","A cagione del tempo piovigginoso, la strada era diventata tutta un\npantano e ci si andava fino a mezza gamba.","Ma il burattino non se ne dava per inteso.","Tormentato dalla passione di rivedere il suo babbo e la sua sorellina\ndai capelli turchini, correva a salti come un can levriero, e nel\ncorrere le pillacchere gli schizzavano fin sopra il berretto. Intanto\nandava dicendo fra sè e sè:","— Quante disgrazie mi sono accadute... E me le merito! perchè io\nsono un burattino testardo e piccoso..., voglio far sempre tutte le\ncose a modo mio, senza dar retta a quelli che mi voglion bene e che\nhanno mille volte più giudizio di me!... Ma da questa volta in là,\nfaccio proponimento di cambiar vita e di diventare un ragazzo ammodo\ne ubbidiente!... Tanto ormai ho bell'e visto che i ragazzi, a essere\ndisubbidienti, ci scapitano sempre e non ne infilano mai una per il su'\nverso. E il mio babbo mi avrà aspettato?... Ce lo troverò a casa della\nFata? È tanto tempo, pover'uomo, che non lo vedo più, e che mi struggo\ndi fargli mille carezze e di finirlo dai baci! E la Fata mi perdonerà\nla brutta azione che le ho fatta?... E pensare che ho ricevuto da lei\ntante attenzioni e tante cure amorose.... e pensare che se oggi son\nsempre vivo, lo debbo a lei! Ma si può dare un ragazzo più ingrato e\npiù senza cuore di me?... —","Nel tempo che diceva così, si fermò tutt'a un tratto spaventato, e fece\nquattro passi indietro.","Che cosa aveva veduto?","Aveva veduto un grosso serpente, disteso attraverso alla strada, che\naveva la pelle verde, gli occhi di fuoco e la coda appuntata che gli\nfumava come una cappa di camino.","Impossibile immaginarsi la paura del burattino: il quale,\nallontanandosi più di mezzo chilometro, si mise a sedere sopra un\nmonticello di sassi, aspettando che il serpente se ne andasse una buona\nvolta per i fatti suoi e lasciasse libero il passo della strada.","Aspettò un'ora; due ore: tre ore: ma il serpente era sempre là, e\nanche di lontano, si vedeva il rosseggiare de' suoi occhi di fuoco e la\ncolonna di fumo che gli usciva dalla punta della coda.","Allora Pinocchio, figurandosi di aver coraggio, si avvicinò a pochi\npassi di distanza, e facendo una vocina dolce, insinuante e sottile,\ndisse al serpente:","— Scusi, signor Serpente, che mi farebbe il piacere di tirarsi un\npochino da una parte, tanto da lasciarmi passare? —","Fu lo stesso che dire al muro. Nessuno si mosse.","Allora riprese colla solita vocina:","— Deve sapere, signor Serpente, che io vado a casa, dove c'è il mio\nbabbo che mi aspetta e che è tanto tempo che non lo vedo più!... Si\ncontenta dunque, che io seguiti per la mia strada? —","Aspettò un segno di risposta a quella domanda: ma la risposta non\nvenne: anzi il serpente, che fin allora pareva arzillo e pieno di vita,\ndiventò immobile e quasi irrigidito. Gli occhi gli si chiusero, e la\ncoda gli smesse di fumare.","— Che sia morto davvero? — disse Pinocchio, dandosi una fregatina\ndi mani dalla gran contentezza; e senza mettere tempo in mezzo, fece\nl'atto di scavalcarlo, per passare dall'altra parte della strada. Ma\nnon aveva ancora finito di alzare la gamba, che il serpente si rizzò\nall'improvviso come una molla scattata: e il burattino, nel tirarsi\nindietro spaventato, inciampò e cadde per terra.","[Illustrazione: Cadde così male, che restò col capo conficcato\nnel fango della strada....]","E per l'appunto cadde così male, che restò col capo conficcato nel\nfango della strada e colle gambe ritte su in aria.","Alla vista di quel burattino, che sgambettava a capofitto con una\nvelocità incredibile, il serpente fu preso da una tal convulsione di\nrisa che ridi, ridi, ridi, alla fine, dallo sforzo del troppo ridere,\ngli si strappò una vena sul petto: e quella volta morì davvero.","Allora Pinocchio ricominciò a correre per arrivare a casa della Fata\navanti che si facesse buio. Ma lungo la strada, non potendo più reggere\nai morsi terribili della fame, saltò in un campo coll'intenzione di\ncogliere poche ciocche d'uva moscadella. Non l'avesse mai fatto!","Appena giunto sotto la vite, _crac_.... sentì stringersi le gambe da\ndue ferri taglienti, che gli fecero vedere quante stelle c'erano in\ncielo.","Il povero burattino era rimasto preso a una tagliuola appostata là\nda alcuni contadini per beccarvi alcune grosse faine, che erano il\nflagello di tutti i polli del vicinato."]},{"name":"Capitolo 21","paragraphs":["Pinocchio è preso da un contadino, il quale lo costringe a far da can\ndi guardia a un pollaio.","Pinocchio, come potete figurarvelo, si dètte a piangere, a strillare,\na raccomandarsi: ma erano pianti e grida inutili, perchè lì all'intorno\nnon si vedevano case, e dalla strada non passava anima viva.","Intanto si fece notte.","Un po' per lo spasimo della tagliuola che gli segava gli stinchi, e un\npo' per la paura di trovarsi solo e al buio in mezzo a quei campi, il\nburattino principiava quasi a svenirsi: quando a un tratto, vedendosi\npassare una lucciola di sul capo, la chiamò e le disse:","— O lucciolina, mi faresti la carità di liberarmi da questo\nsupplizio?...","— Povero figliuolo! — replicò la lucciola, fermandosi impietosita a\nguardarlo. — Come mai sei rimasto colle gambe attanagliate fra cotesti\nferri arrotati?","— Sono entrato nel campo per cogliere due grappoli di quest'uva\nmoscadella, e....","— Ma l'uva era tua?","— No....","— E allora chi t'ha insegnato a portar via la roba degli altri?...","— Avevo fame....","— La fame, ragazzo mio, non è una buona ragione per potersi appropriare\nla roba che non è nostra...","— È vero, è vero! — gridò Pinocchio piangendo — ma un'altra volta non\nlo farò più. —","A questo punto il dialogo fu interrotto da un piccolissimo rumore di\npassi, che si avvicinavano. Era il padrone del campo che veniva in\npunta di piedi a vedere se qualcuna di quelle faine, che gli mangiavano\ndi nottetempo i polli, fosse rimasta presa al trabocchetto della\ntagliuola.","E la sua maraviglia fu grandissima quando, tirata fuori la lanterna di\nsotto al pastrano, s'accòrse che, invece di una faina, c'era rimasto\npreso un ragazzo.","— Ah, ladracchiòlo! — disse il contadino incollerito — dunque sei tu\nche mi porti via le galline?","— Io no, io no! — gridò Pinocchio, singhiozzando. — Io sono entrato nel\ncampo per prendere soltanto due grappoli d'uva!","— Chi ruba l'uva è capacissimo di rubare anche i polli. Lascia fare a\nme, che ti darò una lezione da ricordartene per un pezzo. —","[Illustrazione: — Ah, ladracchiòlo! dunque sei tu che mi porti\nvia le galline?]","E aperta la tagliuola, afferrò il burattino per la collottola e lo\nportò di peso fino a casa, come si porterebbe un agnellino di latte.","Arrivato che fu sull'aia dinanzi alla casa, lo scaraventò in terra: e\ntenendogli un piede sul collo, gli disse:","— Oramai è tardi e voglio andare a letto. I nostri conti gli\naggiusteremo domani. Intanto, siccome oggi m'è morto il cane che mi\nfaceva la guardia di notte, tu prenderai subito il suo posto. Tu mi\nfarai da cane di guardia. —","[Illustrazione: — Tu puoi andare a cuccia in quel casotto di\nlegno.]","Detto fatto, gl'infilò al collo un grosso collare tutto coperto di\nspunzoni d'ottone, e glielo strinse in modo, da non poterselo levare\npassandoci la testa di dentro. Al collare c'era attaccata una lunga\ncatenella di ferro: e la catenella era fissata nel muro.","— Se questa notte — disse il contadino — cominciasse a piovere, tu puoi\nandare a cuccia in quel casotto di legno, dove c'è sempre la paglia\nche ha servito di letto per quattro anni al mio povero cane. E se per\ndisgrazia venissero i ladri, ricordati di stare a orecchi ritti e di\nabbaiare. —","Dopo quest'ultimo avvertimento, il contadino entrò in casa chiudendo\nla porta con tanto di catenaccio: e il povero Pinocchio rimase\naccovacciato sull'aia più morto che vivo, a motivo del freddo, della\nfame e della paura. E di tanto in tanto cacciandosi rabbiosamente le\nmani dentro il collare, che gli serrava la gola, diceva piangendo:","— Mi sta bene!... Pur troppo mi sta bene! Ho voluto fare lo svogliato,\nil vagabondo.... ho voluto dar retta ai cattivi compagni, e per questo\nla fortuna mi perseguita sempre. Se fossi stato un ragazzino per bene,\ncome ce n'è tanti; se avessi avuto voglia di studiare e di lavorare, se\nfossi rimasto in casa col mio povero babbo, a quest'ora non mi troverei\nqui, in mezzo ai campi, a fare il cane di guardia alla casa di un\ncontadino. Oh se potessi rinascere un'altra volta!... Ma oramai è tardi\ne ci vuol pazienza! —","Fatto questo piccolo sfogo, che gli venne proprio dal cuore, entrò\ndentro il casotto e si addormentò."]},{"name":"Capitolo 22","paragraphs":["Pinocchio scuopre i ladri, e in ricompensa di essere stato fedele vien\nposto in libertà.","Ed era già più di due ore che dormiva saporitamente, quando verso la\nmezzanotte fu svegliato da un bisbiglio e da un pissi—pissi di vocine\nstrane, che gli parve di sentir nell'aia. Messa fuori la punta del\nnaso dalla buca del casotto, vide riunite a consiglio quattro bestiole\ndi pelame scuro che parevano gatti. Ma non erano gatti: erano faine,\nanimaletti carnivori, ghiottissimi d'uova e di pollastrine giovani.\nUna di queste faine, staccandosi dalle sue compagne, andò alla buca del\ncasotto, e disse sottovoce:","— Buona sera, Melampo.","— Io non mi chiamo Melampo — rispose il burattino.","— O dunque chi sei?","— Io sono Pinocchio.","— E che cosa fai costì?","— Faccio il cane di guardia.","— O Melampo dov'è? dov'è il vecchio cane, che stava in questo casotto?","— È morto questa mattina.","— Morto? povera bestia!... Era tanto buono!... Ma giudicandoti dalla\nfisonomia, anche te mi sembri un cane di garbo.","— Domando scusa, io non sono un cane!...","— O chi sei?","[Illustrazione: Una di queste faine, staccandosi dalle sue\ncompagne andò alla buca del casotto.]","— Io sono un burattino.","— E fai da cane di guardia?","— Pur troppo: per mia punizione!...","— Ebbene, io ti propongo gli stessi patti che avevo col defunto\nMelampo, e sarai contento.","— E questi patti sarebbero?","— Noi verremo una volta la settimana, come per il passato, a visitare\ndi notte questo pollaio e porteremo via otto galline. Di queste\ngalline, sette le mangeremo noi, e una la daremo a te, a condizione,\ns'intende bene, che tu faccia finta di dormire e non ti venga mai\nl'estro di abbaiare e di svegliare il contadino.","— E Melampo faceva proprio così? — domandò Pinocchio.","— Faceva così, e fra noi e lui, siamo andati sempre d'accordo. Dormi\ndunque tranquillamente, e stai sicuro che prima di partire di qui ti\nlasceremo sul casotto una gallina bell'e pelata per la colazione di\ndomani. Ci siamo intesi bene?","— Anche troppo bene!... — rispose Pinocchio: e tentennò il capo in\nun certo modo minaccioso, come se avesse voluto dire: — Fra poco ci\nriparleremo!... —","Quando le quattro faine si credettero sicure del fatto loro, andarono\ndifilato al pollaio, che rimaneva appunto vicinissimo al casotto del\ncane; e aperta a furia di denti e di unghioli la porticina di legno,\nche ne chiudeva l'entrata, vi sgusciarono dentro, una dopo l'altra.\nMa non erano ancora finite d'entrare, che sentirono la porticina\nrichiudersi con grandissima violenza.","Quello che l'aveva richiusa era Pinocchio; il quale, non contento di\naverla richiusa, vi passò davanti per maggior sicurezza una grossa\npietra, a guisa di puntello.","E poi cominciò ad abbaiare: e, abbaiando proprio come se fosse un cane\ndi guardia, faceva colla voce: _bù—bù-bù-bù_.","A quella abbaiata, il contadino saltò il letto, e preso il fucile e\naffacciatosi alla finestra, domandò:","— Che c'è di nuovo?","— Ci sono i ladri! — rispose Pinocchio.","— Dove sono?","— Nel pollaio.","— Ora scendo subito. —","E difatti, in men che si dice _amen_, il contadino scese: entrò di\ncorsa nel pollaio, e dopo avere acchiappate e rinchiuse in un sacco le\nquattro faine, disse loro con accento di vera contentezza:","— Alla fine siete cascate nelle mie mani! Potrei punirvi, ma sì vil\nnon sono! Mi contenterò, invece, di portarvi domani all'oste del vicino\npaese, il quale vi spellerà e vi cucinerà a uso lepre dolce e forte. È\nun onore che non vi meritate, ma gli uomini generosi come me non badano\na queste piccolezze!... —","Quindi, avvicinatosi a Pinocchio, cominciò a fargli molte carezze, e\nfra le altre cose, gli domandò:","— Com'hai fatto a scoprire il complotto di queste quattro ladroncelle?\nE dire che Melampo, il mio fido Melampo, non s'era mai accorto di\nnulla!... —","Il burattino, allora, avrebbe potuto raccontare quel che sapeva;\navrebbe potuto, cioè, raccontare i patti vergognosi che passavano tra\nil cane e le faine; ma ricordandosi che il cane era morto, pensò subito\ndentro di sè: — A che serve accusare i morti?... I morti son morti, e\nla miglior cosa che si possa fare è quella di lasciarli in pace!...","— All'arrivo delle faine sull'aia, eri sveglio o dormivi? — continuò a\nchiedergli il contadino.","— Dormivo: — rispose Pinocchio — ma le faine mi hanno svegliato coi\nloro chiacchiericci, e una è venuta fin qui al casotto per dirmi:\n«Se prometti di non abbaiare, e di non svegliare il padrone, noi\nti regaleremo una pollastra bell'e pelata!» Capite, eh? Avere la\nsfacciataggine di fare a me una simile proposta! Perchè bisogna sapere\nche io sono un burattino, che avrò tutti i difetti di questo mondo: ma\nnon avrò mai quello di star di balla e di reggere il sacco alla gente\ndisonesta!","— Bravo ragazzo! — gridò il contadino, battendogli sur una spalla.\n— Cotesti sentimenti ti fanno onore: e per provarti la mia grande\nsoddisfazione, ti lascio libero fin d'ora di tornare a casa. —","E gli levò il collare da cane."]},{"name":"Capitolo 23","paragraphs":["Pinocchio piange la morte della bella Bambina dai capelli turchini:\npoi trova un Colombo, che lo porta sulla riva del mare, e lì si getta\nnell'acqua per andare in aiuto del suo babbo Geppetto.","Appena Pinocchio non sentì più il peso durissimo e umiliante di quel\ncollare intorno al collo, si pose a scappare attraverso ai campi, e non\nsi fermò un solo minuto finchè non ebbe raggiunta la strada maestra,\nche doveva ricondurlo alla casina della Fata.","Arrivato sulla strada maestra, si voltò in giù a guardare nella\nsottoposta pianura, e vide benissimo, a occhio nudo, il bosco dove\ndisgraziatamente aveva incontrato la Volpe e il Gatto: vide, fra mezzo\nagli alberi, inalzarsi la cima di quella Quercia grande, alla quale era\nstato appeso ciondoloni per il collo; ma, guarda di qui, guarda di là,\nnon gli fu possibile di vedere la piccola casa della bella Bambina dai\ncapelli turchini.","Allora ebbe una specie di tristo presentimento; e datosi a correre con\nquanta forza gli rimaneva nelle gambe, si trovò in pochi minuti sul\nprato, dove sorgeva una volta la Casina bianca. Ma la Casina bianca non\nc'era più. C'era, invece, una piccola pietra di marmo, sulla quale si\nleggevano in carattere stampatello queste dolorose parole:","QUI GIACE\nLA BAMBINA DAI CAPELLI TURCHINI\nMORTA DI DOLORE\nPER ESSERE STATA ABBANDONATA DAL SUO\nFRATELLINO PINOCCHIO.","Come rimanesse il burattino, quand'ebbe compitate alla peggio quelle\nparole, lo lascio pensare a voi. Cadde bocconi a terra, e coprendo di\nmille baci quel marmo mortuario, dètte in un grande scoppio di pianto.\nPianse tutta la notte, e la mattina dopo, sul far del giorno, piangeva\nsempre, sebbene negli occhi non avesse più lacrime: e le sue grida e\ni suoi lamenti erano così strazianti ed acuti, che tutte le colline\nall'intorno ne ripetevano l'eco.","E piangendo diceva:","«O Fatina mia, perchè sei morta?... perchè, invece di te, non sono\nmorto io, che sono tanto cattivo, mentre tu eri tanto buona?... E\nil mio babbo dove sarà? O Fatina mia, dimmi dove posso trovarlo, chè\nvoglio stare sempre con lui, e non lasciarlo più! più! più!... O Fatina\nmia, dimmi che non è vero che sei morta!... Se davvero mi vuoi bene....\nse vuoi bene al tuo fratellino, rivivisci.... ritorna viva come prima!\nNon ti dispiace a vedermi solo, abbandonato da tutti?... Se arrivano\ngli assassini, mi attaccheranno daccapo al ramo dell'albero.... e\nallora morirò per sempre. Che vuoi che io faccia qui solo in questo\nmondo? Ora che ho perduto te e il mio babbo, chi mi darà da mangiare?\nDove anderò a dormire la notte? Chi mi farà la giacchettina nuova? Oh!\nsarebbe meglio, cento volte meglio, che morissi anch'io! Sì, voglio\nmorire! ih! ih! ih!»","[Illustrazione: — O Fatina mia perchè sei morta?]","E mentre si disperava a questo modo, fece l'atto di volersi strappare i\ncapelli: ma i suoi capelli, essendo di legno, non potè nemmeno levarsi\nil gusto di ficcarci dentro le dita.","Intanto passò su per aria un grosso Colombo, il quale soffermatosi, a\nali distese, gli gridò da una grande altezza:","— Dimmi, bambino, che cosa fai costaggiù?","— Non lo vedi? piango! — disse Pinocchio alzando il capo verso quella\nvoce, e strofinandosi gli occhi colla manica della giacchetta.","— Dimmi, — soggiunse allora il Colombo — non conosci per caso fra i\ntuoi compagni, un burattino, che ha nome Pinocchio?","— Pinocchio? Hai detto Pinocchio? — ripetè il burattino saltando subito\nin piedi. — Pinocchio sono io! —","Il Colombo, a questa risposta, si calò velocemente e venne a posarsi a\nterra. Era più grosso di un tacchino.","— Conoscerai dunque anche Geppetto? — domandò al burattino.","— Se lo conosco! È il mio povero babbo! Ti ha forse parlato di me?\nMi conduci da lui? ma è sempre vivo? rispondimi, per carità; è sempre\nvivo?","— L'ho lasciato tre giorni fa sulla spiaggia del mare.","— Che cosa faceva?","— Si fabbricava da sè una piccola barchetta, per traversare l'Oceano.\nQuel pover'uomo sono più di quattro mesi che gira per il mondo in cerca\ndi te: e non avendoti potuto mai trovare, ora si è messo in capo di\ncercarti nei paesi lontani del nuovo mondo.","— Quanto c'è di qui alla spiaggia? — domandò Pinocchio con ansia\naffettuosa.","— Più di mille chilometri.","— Mille chilometri? O Colombo mio, che bella cosa potessi avere le tue\nali!...","— Se vuoi venire, ti ci porto io.","— Come?","— A cavallo sulla mia groppa. Sei peso dimolto?","— Peso? tutt'altro! Son leggiero come una foglia. —","E lì, senza stare a dir altro, Pinocchio saltò sulla groppa al Colombo;\ne messa una gamba di qui e l'altra di là, come fanno i cavallerizzi,\ngridò tutto contento: «Galoppa, galoppa, cavallino, chè mi preme\ndi arrivar presto!...» Il Colombo prese l'aìre e in pochi minuti\narrivò col volo tanto in alto, che toccava quasi le nuvole. Giunto a\nquell'altezza straordinaria, il burattino ebbe la curiosità di voltarsi\nin giù a guardare: e fu preso da tanta paura e da tali giracapi,\nche per evitare il pericolo di venir di sotto, si avviticchiò colle\nbraccia, stretto stretto, al collo della sua piumata cavalcatura.","[Illustrazione: Si avviticchiò colle braccia, stretto stretto,\nal collo della sua piumata cavalcatura.]","Volarono tutto il giorno. Sul far della sera, il Colombo disse:","— Ho una gran sete!","— E io una gran fame! — soggiunse Pinocchio.","— Fermiamoci a questa colombaia pochi minuti; e dopo ci rimetteremo in\nviaggio, per essere domattina all'alba sulla spiaggia del mare. —","Entrarono in una colombaia deserta, dove c'era soltanto una catinella\npiena d'acqua e un cestino ricolmo di vecce.","Il burattino, in tempo di vita sua, non aveva mai potuto patire le\nvecce: a sentir lui, gli facevano nausea, gli rivoltavano lo stomaco:\nma quella sera ne mangiò a strippapelle, e quando l'ebbe quasi finite,\nsi voltò al Colombo e gli disse:","— Non avrei mai creduto che le vecce fossero così buone!","— Bisogna persuadersi, ragazzo mio, — replicò il Colombo — che quando\nla fame dice davvero e non c'è altro da mangiare, anche le vecce\ndiventano squisite! La fame non ha capricci nè ghiottonerie! —","Fatto alla svelta un piccolo spuntino, si riposero in viaggio, e via!\nLa mattina dopo arrivarono sulla spiaggia del mare.","Il Colombo posò a terra Pinocchio, e non volendo nemmeno la seccatura\ndi sentirsi ringraziare per aver fatto una buona azione, riprese subito\nil volo e sparì.","La spiaggia era piena di gente che urlava e gesticolava, guardando\nverso il mare.","— Che cos'è accaduto? — domandò Pinocchio a una vecchina.","— Gli è accaduto che un povero babbo, avendo perduto il figliuolo,\ngli è voluto entrare in una barchetta per andare a cercarlo di là dal\nmare; e il mare oggi è molto cattivo e la barchetta sta per andare\nsott'acqua....","— Dov'è la barchetta?","— Eccola laggiù, diritta al mio dito — disse la vecchia, accennando una\npiccola barca che, veduta a quella distanza pareva un guscio di noce\ncon dentro un omino piccino piccino.","Pinocchio appuntò gli occhi da quella parte, e dopo aver guardato\nattentamente, cacciò un urlo acutissimo gridando:","— Gli è il mi' babbo! gli è il mi' babbo! —","Intanto la barchetta, sbattuta dall'infuriare dell'onde, ora spariva\nfra i grossi cavalloni, ora tornava a galleggiare: e Pinocchio, ritto\nsulla punta di un alto scoglio, non finiva più dal chiamare il suo\nbabbo per nome, e dal fargli molti segnali colle mani e col moccichino\nda naso e perfino col berretto che aveva in capo.","E parve che Geppetto, sebbene fosse molto lontano dalla spiaggia,\nriconoscesse il figliuolo, perchè si levò il berretto anche lui e\nlo salutò e, a furia di gesti, gli fece capire che sarebbe tornato\nvolentieri indietro, ma il mare era tanto grosso, che gl'impediva di\nlavorare col remo e di potersi avvicinare alla terra.","[Illustrazione: Pinocchio, non finiva più dal chiamare il suo\nbabbo per nome.]","Tutt'a un tratto venne una terribile ondata, e la barca sparì.\nAspettarono che la barca tornasse a galla: ma la barca non si vide più\ntornare.","— Pover'uomo — dissero allora i pescatori, che erano raccolti sulla\nspiaggia; e brontolando sottovoce una preghiera, si mossero per\ntornarsene alle loro case.","Quand'ecco che udirono un urlo disperato, e voltandosi indietro, videro\nun ragazzetto che, di vetta a uno scoglio si gettava in mare gridando:","— Voglio salvare il mio babbo! —","Pinocchio, essendo tutto di legno, galleggiava facilmente e nuotava\ncome un pesce. Ora si vedeva sparire sott'acqua, portato dall'impeto\ndei flutti, ora riappariva fuori con una gamba o con un braccio, a\ngrandissima distanza dalla terra. Alla fine lo persero d'occhio, non lo\nvidero più.","— Povero ragazzo! — dissero allora i pescatori, che erano raccolti\nsulla spiaggia; e brontolando sottovoce una preghiera, tornarono alle\nloro case."]},{"name":"Capitolo 24","paragraphs":["Pinocchio arriva all'isola delle «Api industriose» e ritrova la Fata.","Pinocchio, animato dalla speranza di arrivare in tempo a dare aiuto al\nsuo povero babbo, nuotò tutta quanta la notte.","E che orribile nottata fu quella! Diluviò, grandinò, tuonò\nspaventosamente e con certi lampi, che pareva di giorno.","Sul far del mattino, gli riuscì di vedere poco distante una lunga\nstriscia di terra. Era un'isola in mezzo al mare.","Allora fece di tutto per arrivare a quella spiaggia: ma inutilmente. Le\nonde, rincorrendosi e accavallandosi, se lo abballottavano fra di loro,\ncome se fosse stato un fuscello o un fil di paglia. Alla fine, e per\nsua buona fortuna, venne un'ondata tanto prepotente e impetuosa, che lo\nscaraventò di peso sulla rena del lido.","Il colpo fu così forte, che battendo in terra, gli crocchiarono tutte\nle costole e tutte le congiunture; ma si consolò subito col dire: —\nAnche per questa volta l'ho scampata bella! —","Intanto a poco a poco il cielo si rasserenò; il sole apparve fuori in\ntutto il suo splendore, e il mare diventò tranquillissimo e buono come\nun olio.","Allora il burattino distese i suoi panni al sole per rasciugarli, e\nsi pose a guardare di qua e di là se per caso avesse potuto scorgere\nsu quella immensa spianata d'acqua una piccola barchetta con un omino\ndentro. Ma dopo aver guardato ben bene, non vide altro dinanzi a sè che\ncielo, mare e qualche vela di bastimento, ma così lontana lontana, che\npareva una mosca.","— Sapessi almeno come si chiama quest'isola! — andava dicendo. —\nSapessi almeno se quest'isola è abitata da gente di garbo, voglio\ndire da gente che non abbia il vizio di attaccare i ragazzi ai\nrami degli alberi! ma a chi mai posso domandarlo? a chi, se non c'è\nnessuno?... —","Quest'idea di trovarsi solo, solo, solo, in mezzo a quel gran paese\ndisabitato, gli messe addosso tanta malinconia, che stava lì lì per\npiangere; quando tutt'a un tratto vide passare, a poca distanza dalla\nriva, un grosso pesce che se ne andava tranquillamente per i fatti suoi\ncon tutta la testa fuori dell'acqua.","Non sapendo come chiamarlo per nome, il burattino gli gridò a voce\nalta, per farsi sentire:","— Ehi, signor pesce, che mi permetterebbe una parola?","— Anche due — rispose il pesce, il quale era un Delfino così garbato,\ncome se ne trovano pochi in tutti i mari del mondo.","— Mi farebbe il piacere di dirmi se in quest'isola vi sono dei paesi\ndove si possa mangiare, senza pericolo d'esser mangiati?","— Ve ne sono sicuro! — rispose il Delfino. — Anzi, ne troverai uno poco\nlontano di qui.","— E che strada si fa per andarvi?","— Devi prendere quella viottola là, a mancina, e camminare sempre\ndiritto al naso. Non puoi sbagliare.","— Mi dica un'altra cosa. Lei che passeggia tutto il giorno e tutta\nla notte per il mare, non avrebbe incontrato per caso una piccola\nbarchettina con dentro il mi' babbo?","— E chi è il tuo babbo?","— Gli è il babbo più buono del mondo, come io sono il figliuolo più\ncattivo che si possa dare.","— Colla burrasca che ha fatto questa notte — rispose il Delfino — la\nbarchetta sarà andata sott'acqua.","— E il mio babbo?","— A quest'ora l'avrà inghiottito il terribile Pesce-cane, che da\nqualche giorno è venuto a spargere lo sterminio e la desolazione nelle\nnostre acque.","— Che è grosso dimolto questo Pesce-cane? — domandò Pinocchio, che di\ngià cominciava a tremare dalla paura.","[Illustrazione: — Arrivederla, signor pesce: scusi tanto\nl'incomodo, e mille grazie della sua garbatezza.]","— Se gli è grosso!... — replicò il Delfino. — Perchè tu possa fartene\nun'idea, ti dirò che è più grosso di un casamento di cinque piani, ed\nha una boccaccia così larga e profonda, che ci passerebbe comodamente\ntutto il treno della strada ferrata colla macchina accesa.","— Mamma mia! — gridò spaventato il burattino; e rivestitosi in fretta\ne furia, si voltò al Delfino e gli disse:","— Arrivederla, signor pesce: scusi tanto l'incomodo, e mille grazie\ndella sua garbatezza. —","Detto ciò prese subito la viottola e cominciò a camminare di un passo\nsvelto: tanto svelto, che pareva quasi che corresse. E a ogni più\npiccolo rumore che sentiva, si voltava subito a guardare indietro, per\nla paura di vedersi inseguire da quel terribile Pesce-cane grosso come\nuna casa di cinque piani e con un treno della strada ferrata in bocca.","Dopo aver camminato più di mezz'ora, arrivò a un piccolo paese detto\n«il paese delle Api industriose.» Le strade formicolavano di persone\nche correvano di qua e di là per le loro faccende: tutti lavoravano,\ntutti avevano qualche cosa da fare. Non si trovava un ozioso o un\nvagabondo nemmeno a cercarlo col lumicino.","— Ho capito; — disse subito quello svogliato di Pinocchio — questo\npaese non è fatto per me! Io non son nato per lavorare! —","Intanto la fame lo tormentava, perchè erano oramai passate\nventiquattr'ore che non aveva mangiato più nulla; nemmeno una pietanza\ndi vecce.","Che fare?","Non gli restavano che due modi per potersi sdigiunare: o chiedere un\npo' di lavoro, o chiedere in elemosina un soldo o un boccon di pane.","A chiedere l'elemosina si vergognava: perchè il suo babbo gli aveva\npredicato sempre che l'elemosina hanno il diritto di chiederla\nsolamente i vecchi e gl'infermi. I veri poveri, in questo mondo,\nmeritevoli di assistenza e di compassione, non sono altro che quelli\nche, per ragione d'età o di malattia si trovano condannati a non\npotersi più guadagnare il pane col lavoro delle proprie mani. Tutti\ngli altri hanno l'obbligo di lavorare; e se non lavorano e patiscono la\nfame tanto peggio per loro.","In quel frattempo, passò per la strada un uomo tutto sudato e\ntrafelato, il quale da sè solo tirava con gran fatica due carretti\ncarichi di carbone.","Pinocchio, giudicandolo alla fisonomia per un buon uomo, gli si accostò\ne, abbassando gli occhi dalla vergogna, gli disse sottovoce:","— Mi fareste la carità di darmi un soldo perchè mi sento morir dalla\nfame?","— Non un soldo solo, — rispose il carbonaio — ma te ne do quattro,\na patto che tu m'aiuti a tirare fino a casa questi due carretti di\ncarbone.","— Mi meraviglio! — rispose il burattino quasi offeso; — per vostra\nregola io non ho fatto mai il somaro; io non ho mai tirato il carretto!","— Meglio per te! — rispose il carbonaio. — Allora, ragazzo mio, se\nti senti davvero morir dalla fame, mangia due belle fette della tua\nsuperbia e bada di non prendere un'indigestione. —","[Illustrazione: — Mi fareste la carità di darmi un soldo\nperchè mi sento morir dalla fame?]","Dopo pochi minuti passò per la via un muratore, che portava sulle\nspalle un corbello di calcina.","— Fareste, galantuomo, la carità d'un soldo a un povero ragazzo, che\nsbadiglia dall'appetito?","— Volentieri; vieni con me a portar calcina, — rispose il muratore — e\ninvece d'un soldo, te ne darò cinque.","— Ma la calcina è pesa, — replicò Pinocchio — e io non voglio durar\nfatica.","— Se non vuoi durar fatica, allora, ragazzo mio, divertiti a\nsbadigliare, e buon pro ti faccia. —","In men di mezz'ora passarono altre venti persone, e a tutte Pinocchio\nchiese un po' d'elemosina, ma tutte gli risposero:","— Non ti vergogni? Invece di fare il bighellone per la strada, va'\npiuttosto a cercarti un po' di lavoro, e impara a guadagnarti il\npane! —","Finalmente passò una buona donnina, che portava due brocche d'acqua.","— Vi contentate, buona donna, che io beva una sorsata d'acqua alla\nvostra brocca? — chiese Pinocchio, che bruciava dall'arsione della\nsete.","— Bevi pure, ragazzo mio! — disse la donnina, posando le due brocche in\nterra.","Quando Pinocchio ebbe bevuto come una spugna, borbottò a mezza voce,\nasciugandosi la bocca:","— La sete me la son levata! Così mi potessi levar la fame!... —","La buona donnina, sentendo queste parole, soggiunse subito:","— Se mi aiuti a portare a casa una di queste brocche d'acqua, ti darò\nun bel pezzo di pane. —","Pinocchio guardò la brocca, e non rispose nè sì nè no.","— E insieme col pane ti darò un bel piatto di cavol fiore condito\ncoll'olio e coll'aceto — soggiunse la buona donna.","Pinocchio dètte un'altra occhiata alla brocca, e non rispose nè sì nè\nno.","— E dopo il cavol fiore ti darò un bel confetto ripieno di\nrosolio. —","Alle seduzioni di quest'ultima ghiottoneria, Pinocchio non seppe più\nresistere, e fatto un animo risoluto, disse:","— Pazienza! vi porterò la brocca fino a casa! —","La brocca era molto pesa, e il burattino, non avendo forza di portarla\ncolle mani, si rassegnò a portarla in capo.","Arrivati a casa, la buona donnina fece sedere Pinocchio a una piccola\ntavola apparecchiata, e gli pose davanti il pane, il cavol fiore\ncondito e il confetto.","Pinocchio non mangiò, ma diluviò. Il suo stomaco pareva un quartiere\nrimasto vuoto e disabitato da cinque mesi.","Calmati a poco a poco i morsi rabbiosi della fame, allora alzò il capo\nper ringraziare la sua benefattrice: ma non aveva ancora finito di\nfissarla in volto, che cacciò un lunghissimo _ohhh!_ di maraviglia, e\nrimase là incantato, cogli occhi spalancati, colla forchetta per aria\ne colla bocca piena di pane e di cavol fiore.","— Che cosa è mai tutta questa meraviglia? — disse ridendo la buona\ndonna.","— Egli è.... — rispose balbettando Pinocchio — egli è.... egli è....\nche voi mi somigliate.... voi mi rammentate... sì, sì, sì, la stessa\nvoce.... gli stessi occhi.... gli stessi capelli.... sì sì, sì....\nanche voi avete i capelli turchini.... come lei! O Fatina mia!... O\nFatina mia!... ditemi che siete voi, proprio voi!... Non mi fate più\npiangere! Se sapeste! Ho pianto tanto, ho patito tanto!... —","E nel dir così, Pinocchio piangeva dirottamente, e gettatosi\nginocchioni per terra abbracciava i ginocchi di quella donnina\nmisteriosa."]},{"name":"Capitolo 25","paragraphs":["Pinocchio promette alla Fata di esser buono e di studiare, perchè è\nstufo di fare il burattino e vuol diventare un bravo ragazzo.","In sulle prime, la buona donnina cominciò col dire che lei non era la\npiccola Fata dai capelli turchini: ma poi, vedendosi ormai scoperta\ne non volendo mandare più in lungo la commedia, finì per farsi\nriconoscere, e disse a Pinocchio:","— Birba d'un burattino! Come mai ti sei accorto che ero io?","— Gli è il gran bene che vi voglio, quello che me l'ha detto.","— Ti ricordi, eh? Mi lasciasti bambina, e ora mi ritrovi donna; tanto\ndonna, che potrei quasi farti da mamma.","— E io l'ho caro dimolto, perchè così, invece di sorellina, vi chiamerò\nla mia mamma. Gli è tanto tempo che mi struggo di avere una mamma come\ntutti gli altri ragazzi!... Ma come avete fatto a crescere così presto?","— È un segreto.","— Insegnatemelo: vorrei crescere un poco anch'io. Non lo vedete? Son\nsempre rimasto alto come un soldo di cacio.","— Ma tu non puoi crescere — replicò la Fata.","— Perchè?","— Perchè i burattini non crescono mai. Nascono burattini, vivono\nburattini e muoiono burattini.","— Oh! sono stufo di far sempre il burattino! — gridò Pinocchio, dandosi\nuno scappellotto. — Sarebbe ora che diventassi anch'io un uomo....","— E lo diventerai, se saprai meritarlo....","— Davvero? E che posso fare per meritarmelo?","— Una cosa facilissima: avvezzarti a essere un ragazzino perbene.","— O che forse non lo sono?","— Tutt'altro! i ragazzi perbene sono ubbidienti, e tu invece....","— E io non ubbidisco mai.","— I ragazzi perbene prendono amore allo studio e al lavoro, e tu....","— E io, invece, faccio il bighellone e il vagabondo tutto l'anno.","— I ragazzi perbene dicono sempre la verità...","— E io sempre le bugie.","— I ragazzi perbene vanno volentieri alla scuola...","— E a me la scuola mi fa venire i dolori di corpo. Ma da oggi in poi\nvoglio mutar vita.","— Me lo prometti?","— Lo prometto. Voglio diventare un ragazzino perbene, e voglio essere\nla consolazione del mio babbo... Dove sarà, il mio povero babbo, a\nquest'ora?","— Non lo so.","— Avrò mai la fortuna di poterlo rivedere e abbracciare?","— Credo di sì: anzi ne sono sicura. —","A questa risposta fu tale e tanta la contentezza di Pinocchio, che\nprese le mani alla Fata e cominciò a baciargliele con tanta foga,\nche pareva quasi fuori di sè. Poi, alzando il viso e guardandola\namorosamente, le domandò:","— Dimmi, mammina: dunque non è vero che tu sia morta?","— Par di no — rispose sorridendo la Fata.","— Se tu sapessi che dolore e che serratura alla gola che provai, quando\nlessi _qui giace_...","— Lo so: ed è per questo che ti ho perdonato. La sincerità del tuo\ndolore mi fece conoscere che tu avevi il cuore buono: e dai ragazzi\nbuoni di cuore, anche se sono un po' monelli e avvezzati male, c'è\nsempre da sperar qualcosa: ossia, c'è sempre da sperare che rientrino\nsulla vera strada. Ecco perchè son venuta a cercarti fin qui. Io sarò\nla tua mamma....","[Illustrazione: — Dimmi, mammina: dunque non è vero che tu sia\nmorta?]","— Oh che bella cosa! — gridò Pinocchio saltando dall'allegrezza.","— Tu mi ubbidirai e farai sempre quello che ti dirò io.","— Volentieri, volentieri, volentieri!","— Fino da domani — soggiunse la Fata — tu comincerai coll'andare a\nscuola. —","Pinocchio diventò subito un po' meno allegro.","— Poi sceglierai a tuo piacere un'arte o un mestiere.... —","Pinocchio diventò serio.","— Che cosa brontoli fra i denti? — domandò la Fata con accento\nrisentito.","— Dicevo.... — mugolò il burattino a mezza voce — che oramai per andare\na scuola mi pare un po' tardi....","— Nossignore. Tieni a mente che per istruirsi e per imparare non è mai\ntardi.","— Ma io non voglio fare nè arti nè mestieri....","— Perchè?","— Perchè a lavorare mi par fatica.","— Ragazzo mio, — disse la Fata — quelli che dicono così, finiscono\nquasi sempre o in carcere o all'ospedale. L'uomo, per tua regola,\nnasca ricco o povero, è obbligato in questo mondo a far qualcosa, a\noccuparsi, a lavorare. Guai a lasciarsi prendere dall'ozio! L'ozio è\nuna bruttissima malattia e bisogna guarirla subito, fin da bambini; se\nno, quando siamo grandi non si guarisce più. —","Queste parole toccarono l'animo di Pinocchio, il quale, rialzando\nvivacemente la testa, disse alla Fata:","— Io studierò, io lavorerò, io farò tutto quello che mi dirai, perchè\ninsomma, la vita del burattino mi è venuta a noia, e voglio diventare\nun ragazzo a tutti i costi. Me l'hai promesso, non è vero?","— Te l'ho promesso, e ora dipende da te. —"]},{"name":"Capitolo 26","paragraphs":["Pinocchio va co' suoi compagni di scuola in riva al mare, per vedere il\nterribile Pesce-cane.","Il giorno dopo Pinocchio andò alla Scuola comunale.","Figuratevi quelle birbe di ragazzi, quando videro entrare nella\nloro scuola un burattino! Fu una risata, che non finiva più. Chi gli\nfaceva uno scherzo, chi un altro: chi gli levava il berretto di mano:\nchi gli tirava il giubbettino di dietro; chi si provava a fargli\ncoll'inchiostro due grandi baffi sotto il naso, e chi si attentava\nperfino a legargli dei fili ai piedi e alle mani, per farlo ballare.","Per un poco Pinocchio usò disinvoltura e tirò via; ma finalmente,\nsentendosi scappar la pazienza, si rivolse a quelli che più lo\ntafanavano e si pigliavano giuoco di lui, e disse loro a muso duro:","— Badate, ragazzi: io non son venuto qui per essere il vostro buffone.\nIo rispetto gli altri e voglio esser rispettato.","— Bravo Berlicche! Hai parlato come un libro stampato! — urlarono\nquei monelli, buttandosi via dalle matte risate: e uno di loro più\nimpertinente degli altri, allungò la mano coll'idea di prendere il\nburattino per la punta del naso.","Ma non fece a tempo: perchè Pinocchio stese la gamba sotto la tavola,\ne gli consegnò una pedata negli stinchi.","— Ohi! che piedi duri! — urlò il ragazzo stropicciandosi il livido che\ngli aveva fatto il burattino.","— E che gomiti!... anche più duri dei piedi! — disse un altro che, per\ni suoi scherzi sguaiati, s'era beccata una gomitata nello stomaco.","Fatto sta che dopo quel calcio e quella gomitata, Pinocchio acquistò\nsubito la stima e la simpatia di tutti i ragazzi di scuola: e tutti gli\nfacevano mille carezze e tutti gli volevano un ben dell'anima.","E anche il maestro se ne lodava, perchè lo vedeva attento, studioso,\nintelligente, sempre il primo a entrare nella scuola, sempre l'ultimo\na rizzarsi in piedi, a scuola finita.","Il solo difetto che avesse era quello di bazzicare troppi compagni;\ne fra questi c'erano molti monelli conosciutissimi per la loro poca\nvoglia di studiare e di farsi onore.","[Illustrazione: E anche il maestro se ne lodava, perchè lo\nvedeva attento, studioso, intelligente.]","Il maestro lo avvertiva tutti i giorni, e anche la buona Fata non\nmancava di dirgli e di ripetergli più volte:","— Bada, Pinocchio! Quei tuoi compagnacci di scuola finiranno, prima o\npoi, col farti perdere l'amore allo studio e, forse forse, col tirarti\naddosso qualche grossa disgrazia.","— Non c'è pericolo! — rispondeva il burattino, facendo una\nspallucciata, e toccandosi coll'indice in mezzo alla fronte, come per\ndire: «C'è tanto giudizio qui dentro!»","Ora avvenne che un bel giorno, mentre camminava verso la scuola,\nincontrò un branco dei soliti compagni, che, andandogli incontro, gli\ndissero:","— Sai la gran notizia?","— No.","— Qui nel mare vicino è arrivato un Pesce-cane grosso come una montagna.","— Davvero?... Che sia quel medesimo Pesce-cane di quando affogò il mio\npovero babbo?","— Noi andiamo alla spiaggia per vederlo. Vuoi venire anche tu?","— Io no: voglio andare a scuola.","— Che t'importa della scuola? Alla scuola ci anderemo domani. Con una\nlezione di più o con una di meno, si rimane sempre gli stessi somari.","— E il maestro che dirà?","— Il maestro si lascia dire. È pagato apposta per brontolare tutti i\ngiorni.","— E la mia mamma?","— Le mamme non sanno mai nulla — risposero quei malanni.","— Sapete che cosa farò? — disse Pinocchio. — Il Pesce-cane voglio\nvederlo per certe mie ragioni.... ma anderò a vederlo dopo la scuola.","— Povero giucco! — ribattè uno del branco. — Che credi che un pesce\ndi quella grossezza voglia star lì a fare il comodo tuo? Appena s'è\nannoiato, piglia il dirizzone per un'altra parte, e allora chi s'è\nvisto s'è visto.","[Illustrazione: Coi loro libri e i loro quaderni sotto il\nbraccio si mossero a correre attraverso ai campi.]","— Quanto tempo ci vuole di qui alla spiaggia? — domandò il burattino.","— Fra un'ora siamo bell'e andati e tornati.","— Dunque, via! e chi più corre, è più bravo! — gridò Pinocchio.","Dato così il segnale della partenza, quel branco di monelli coi\nloro libri e i loro quaderni sotto il braccio si messero a correre\nattraverso ai campi e Pinocchio era sempre avanti a tutti, pareva che\navesse le ali ai piedi.","Di tanto in tanto, voltandosi indietro, canzonava i suoi compagni\nrimasti a una bella distanza, e nel vederli ansanti, trafelati,\npolverosi, e con tanto di lingua fuori, se la rideva proprio di cuore.\nLo sciagurato, in quel momento, non sapeva a quali paure e a quali\norribili disgrazie andava incontro."]},{"name":"Capitolo 27","paragraphs":["Gran combattimento fra Pinocchio e i suoi compagni: uno dei quali\nessendo rimasto ferito, Pinocchio viene arrestato dai carabinieri.","Giunto che fu sulla spiaggia, Pinocchio dètte subito una grande\nocchiata sul mare; ma non vide nessun Pesce-cane. Il mare era tutto\nliscio come un gran cristallo da specchio.","— O il Pesce-cane dov'è? — domandò, voltandosi ai compagni.","— Sarà andato a far colazione — rispose uno di loro, ridendo.","— O si sarà buttato sul letto per fare un sonnellino — soggiunse un\naltro, ridendo più forte che mai.","Da quelle risposte sconclusionate e da quelle risatacce grulle,\nPinocchio capì che i suoi compagni gli avevano fatto una brutta celia,\ndandogli ad intendere una cosa che non era vera; e pigliandosela a\nmale, disse loro con voce di bizza:","— E ora? che sugo ci avete trovato a darmi ad intendere la storiella\ndel Pesce-cane?","— Il sugo c'è sicuro!... — risposero in coro quei monelli.","— E sarebbe?","— Quello di farti perdere la scuola e di farti venire con noi. Non ti\nvergogni a mostrarti tutti i giorni così preciso e così diligente alla\nlezione? Non ti vergogni a studiar tanto, come fai?","— E se io studio, che cosa ve ne importa?","— A noi ce ne importa moltissimo, perchè ci costringi a fare una brutta\nfigura col maestro....","— Perchè?","— Perchè gli scolari che studiano, fanno sempre scomparire quelli, come\nnoi, che non hanno voglia di studiare. E noi non vogliamo scomparire!\nAnche noi abbiamo il nostro amor proprio!...","— E allora che cosa devo fare per contentarvi?","— Devi prendere a noia, anche tu, la scuola, la lezione e il maestro,\nche sono i nostri tre grandi nemici.","— E se io volessi seguitare a studiare?","— Noi non ti guarderemo più in faccia, e alla prima occasione ce la\npagherai.","— In verità mi fate quasi ridere — disse il burattino con una\nscrollatina di capo.","— Ehi, Pinocchio! — gridò allora il più grande di quei ragazzi\nandandogli sul viso. — Non venir qui a fare lo smargiasso: non venir\nqui a far tanto il galletto!... perchè se tu non hai paura di noi,\nneanche noi abbiamo paura di te! Ricordati che tu sei solo e noi siamo\nsette.","— Sette come i peccati mortali — disse Pinocchio con una gran risata.","— Avete sentito? Ci ha insultati tutti! Ci ha chiamato col nome di\npeccati mortali!...","— Pinocchio! chiedici scusa dell'offesa.... e se no, guai a te!...","— Cucù! — fece il burattino, battendosi coll'indice sulla punta del\nnaso, in segno di canzonatura.","— Pinocchio! la finisce male!...","— Cucù!","— Ne toccherai quanto un somaro!...","— Cucù!","— Ritornerai a casa col naso rotto!...","— Cucù!","— Ora il Cucù te lo darò io! — gridò il più ardito di quei monelli. —\nPrendi intanto quest'acconto, e serbalo per la cena di stasera. —","E nel dir così, gli appiccicò un pugno nel capo.","Ma fu, come si suol dire, botta e risposta; perchè il burattino,\ncom'era da aspettarselo, rispose subito con un altro pugno: e lì, da un\nmomento all'altro, il combattimento diventò generale e accanito.","Pinocchio, sebbene fosse solo, si difendeva come un eroe. Con quei suoi\npiedi di legno durissimo lavorava così bene, da tener sempre i suoi\nnemici a rispettosa distanza. Dove i suoi piedi potevano arrivare e\ntoccare, ci lasciavano sempre un livido per ricordo.","Allora i ragazzi indispettiti di non potersi misurare col burattino a\ncorpo a corpo, pensarono bene di metter mano ai proiettili; e sciolti\ni fagotti de' loro libri di scuola, cominciarono a scagliare contro di\nlui i _Sillabari_, le _Grammatiche_, i _Giannettini_, i _Minuzzoli_,\ni _Racconti_ del Thouar, il _Pulcino_ della Baccini e altri libri\nscolastici: ma il burattino, che era d'occhio svelto e ammalizzito,\nfaceva sempre civetta a tempo, sicchè i volumi, passandogli di sopra al\ncapo, andavano tutti a cascare nel mare.","Figuratevi i pesci! I pesci, credendo che quei libri fossero roba da\nmangiare, correvano a frotte a fior d'acqua; ma dopo avere abboccata\nqualche pagina o qualche frontespizio, la risputavano subito, facendo\ncon la bocca una certa smorfia, che pareva volesse dire: «Non è roba\nper noi: noi siamo avvezzi a cibarci molto meglio!»","Intanto il combattimento s'inferociva sempre più, quand'ecco che un\ngrosso Granchio, che era uscito fuori dell'acqua e s'era adagio adagio\narrampicato fin sulla spiaggia, gridò con una vociaccia di trombone\ninfreddato:","— Smettetela, birichini che non siete altro! Queste guerre manesche\nfra ragazzi e ragazzi raramente vanno a finir bene. Qualche disgrazia\naccade sempre!... —","[Illustrazione: Quand'ecco che un grosso Granchio, che era\nuscito fuori dall'acqua....]","Povero Granchio! Fu lo stesso che avesse predicato al vento. Anzi,\nquella birba di Pinocchio, voltandosi indietro a guardarlo in cagnesco,\ngli disse sgarbatamente:","— Chetati, Granchio dell'uggia! Faresti meglio a succiare due pasticche\ndi lichene per guarire da codesta infreddatura di gola. Va' piuttosto\na letto, e cerca di sudare!...","In quel frattempo i ragazzi, che avevano finito ormai di tirare tutti\ni loro libri, occhiarono lì a poca distanza il fagotto dei libri del\nburattino, e se ne impadronirono in men che non si dice.","Fra questi libri, v'era un volume rilegato in cartoncino grosso, colla\ncostola e colle punte di cartapecora. Era un _Trattato di Aritmetica_.\nVi lascio immaginare se era peso di molto!","Uno di quei monelli agguantò quel volume, e presa di mira la testa di\nPinocchio, lo scagliò con quanta forza aveva nel braccio: ma invece di\ncogliere il burattino, colse nella testa uno dei compagni, il quale\ndiventò bianco come un panno lavato, e non disse altro che queste\nparole:","— O mamma mia,... aiutatemi perchè muoio!... — Poi cadde disteso sulla\nrena del lido.","Alla vista di quel morticino, i ragazzi spaventati si dettero a\nscappare a gambe, e in pochi minuti non si videro più.","Ma Pinocchio rimase lì; e sebbene per il dolore e per lo spavento,\nanche lui fosse più morto che vivo, nondimeno corse ad inzuppare il\nsuo fazzoletto nell'acqua del mare, e si pose a bagnare la tempia del\nsuo povero compagno di scuola. E intanto, piangendo dirottamente e\ndisperandosi, lo chiamava per nome e gli diceva:","— Eugenio!... povero Eugenio mio!... apri gli occhi e guardami!...\nPerchè non mi rispondi? Non sono stato io, sai, che ti ho fatto tanto\nmale! Credilo, non sono stato io!... Apri gli occhi, Eugenio.... Se\ntieni gli occhi chiusi, mi farai morire anche me.... O Dio mio! come\nfarò ora a tornare a casa?... Con che coraggio potrò presentarmi alla\nmia buona mamma? Che sarà di me?... Dove fuggirò?... Dove anderò a\nnascondermi?... Oh quant'era meglio, mille volte meglio che fossi\nandato a Scuola!... Perchè ho dato retta a questi compagni, che sono\nla mia dannazione? E il maestro me l'aveva detto!... e la mia mamma\nme l'aveva ripetuto: «Guardati dai cattivi compagni!» Ma io sono un\ntestardo.... un caparbiaccio.... lascio dir tutti, e poi fo sempre a\nmodo mio! E dopo mi tocca a scontarle.... E così, da che sono al mondo,\nnon ho mai avuto un quarto d'ora di bene. Dio mio! Che sarà di me, che\nsarà di me, che sarà di me? —","E Pinocchio continuava a piangere, a berciare, a darsi dei pugni nel\ncapo e a chiamar per nome il povero Eugenio, quando sentì a un tratto\nun rumore sordo di passi che si avvicinavano.","Si voltò: erano due carabinieri.","— Che cosa fai così sdraiato per terra? — domandarono a Pinocchio.","— Assisto questo mio compagno di scuola.","— Che gli è venuto male?","— Par di sì!...","— Altro che male! — disse uno dei carabinieri chinandosi e osservando\nEugenio da vicino. — Questo ragazzo è stato ferito in una tempia: chi\nè che l'ha ferito?","— Io no! — balbettò il burattino che non aveva più fiato in corpo.","— Se non sei stato tu, chi è stato dunque che l'ha ferito?","— Io no! — ripetè Pinocchio.","— E con che cosa è stato ferito?","— Con questo libro. — E il burattino raccattò di terra il _Trattato\ndi Aritmetica_, rilegato in cartone e cartapecora, per mostrarlo al\ncarabiniere.","— E questo libro di chi è?","— Mio.","— Basta così: non occorre altro. Rizzati subito, e vien via con noi.","— Ma io....","— Via con noi!...","— Ma io sono innocente....","— Via con noi! —","Prima di partire, i carabinieri chiamarono alcuni pescatori, che in\nquel momento passavano per l'appunto colla loro barca vicino alla\nspiaggia, e dissero loro:","— Vi affidiamo questo ragazzetto ferito nel capo. Portatelo a casa\nvostra e assistetelo. Domani torneremo a vederlo. —","Quindi si volsero a Pinocchio, e dopo averlo messo in mezzo a loro due,\ngl'intimarono con accento soldatesco:","— Avanti! e cammina spedito! se no, peggio per te! —","Senza farselo ripetere, il burattino cominciò a camminare per quella\nviottola, che conduceva al paese. Ma il povero diavolo non sapeva\npiù nemmeno lui in che mondo si fosse. Gli pareva di sognare, e che\nbrutto sogno! Era fuori di sè. I suoi occhi vedevano tutto doppio: le\ngambe gli tremavano: la lingua gli era rimasta attaccata al palato e\nnon poteva più spiccicare una sola parola. Eppure, in mezzo a quella\nspecie di stupidità e di rintontimento, una spina acutissima gli bucava\nil cuore: il pensiero, cioè, di dover passare sotto le finestre di\ncasa della sua buona fata, in mezzo ai carabinieri. Avrebbe preferito\npiuttosto di morire.","[Illustrazione: Si volsero a Pinocchio, e dopo averlo messo in\nmezzo a loro due.]","Erano già arrivati e stavano per entrare in paese, quando una folata di\nvento strapazzone levò di testa a Pinocchio il berretto, portandoglielo\nlontano una diecina di passi.","— Si contentano — disse il burattino ai carabinieri — che vada a\nriprendere il mio berretto?","— Vai pure; ma facciamo una cosa lesta. —","Il burattino andò, raccattò il berretto.... ma invece di metterselo\nin capo, se lo mise in bocca fra i denti, e poi cominciò a correre di\ngran carriera verso la spiaggia del mare. Andava via come una palla di\nfucile.","I carabinieri, giudicando che fosse difficile raggiungerlo, gli\naizzarono dietro un grosso cane mastino che aveva guadagnato il primo\npremio a tutte le corse dei cani. Pinocchio correva, e il cane correva\npiù di lui; per cui tutta la gente si affacciava alle finestre e si\naffollava in mezzo alla strada, ansiosa di veder la fine di un palio\ncosì inferocito. Ma non potè levarsi questa voglia, perchè il can\nmastino e Pinocchio sollevarono lungo la strada un tal polverone, che\ndopo pochi minuti non era possibile di veder più nulla."]},{"name":"Capitolo 28","paragraphs":["Pinocchio corre pericolo di esser fritto in padella, come un pesce.","Durante quella corsa disperata, vi fu un momento terribile, un momento\nin cui Pinocchio si credè perduto: perchè bisogna sapere che Alidoro\n(era questo il nome del can mastino) a furia di correre e correre,\nl'aveva quasi raggiunto.","[Illustrazione: Sentiva dietro di sè, alla distanza d'un\npalmo, l'ansare affannoso di quella bestiaccia.]","Basti dire che il burattino sentiva dietro di sè, alla distanza d'un\npalmo, l'ansare affannoso di quella bestiaccia, e ne sentiva perfino la\nvampa calda delle fiatate.","Per buona fortuna la spiaggia era oramai vicina, e il mare si vedeva lì\na pochi passi.","Appena fu sulla spiaggia, il burattino spiccò un bellissimo salto, come\navrebbe potuto fare un ranocchio, e andò a cascare in mezzo all'acqua.\nAlidoro invece voleva fermarsi: ma trasportato dall'impeto della corsa,\nentrò nell'acqua anche lui. E quel disgraziato non sapeva nuotare; per\ncui cominciò subito ad annaspare colle zampe per reggersi a galla; ma\npiù annaspava, e più andava col capo sott'acqua.","Quando ritornò a rimettere il capo fuori, il povero cane aveva gli\nocchi impauriti e stralunati, e, abbaiando gridava:","— Affogo! affogo!","— Crepa! — gli rispose Pinocchio da lontano, il quale si vedeva oramai\nsicuro da ogni pericolo.","— Aiutami, Pinocchio mio!... salvami dalla morte!... —","A quelle grida strazianti il burattino, che in fondo aveva un cuore\neccellente, si mosse a compassione, e voltosi al cane, gli disse:","— Ma se io ti aiuto a salvarti, mi prometti di non darmi più noia e di\nnon corrermi dietro?","— Te lo prometto! te lo prometto! Spicciati per carità, perchè se\nindugi un altro mezzo minuto, son bell'e morto. —","Pinocchio esitò un poco: ma poi ricordandosi che il suo babbo gli aveva\ndetto tante volte che a fare una buona azione non ci si scapita mai,\nandò nuotando a raggiungere Alidoro, e, presolo per la coda con tutt'e\ndue le mani, lo portò sano e salvo sulla rena asciutta del lido.","[Illustrazione: Andò nuotando a raggiungere Alidoro, e,\npresolo per la coda....]","Il povero cane non si reggeva più in piedi. Aveva bevuto, senza\nvolerlo, tant'acqua salata, che era gonfiato come un pallone. Per altro\nil burattino, non volendo fare a fidarsi troppo, stimò cosa prudente\ndi gettarsi novamente in mare; e allontanandosi dalla spiaggia, gridò\nall'amico salvato:","— Addio, Alidoro; fa' buon viaggio, e tanti saluti a casa.","— Addio, Pinocchio, — rispose il cane — mille grazie di avermi liberato\ndalla morte. Tu m'hai fatto un gran servizio: e in questo mondo quel\nche è fatto è reso. Se capita l'occasione ci riparleremo.... —","Pinocchio seguitò a nuotare, tenendosi sempre vicino alla terra.\nFinalmente gli parve di esser giunto in un luogo sicuro: e dando\nun'occhiata alla spiaggia, vide sugli scogli una specie di grotta,\ndalla quale usciva un lunghissimo pennacchio di fumo.","— In quella grotta — disse allora fra sè — ci deve essere del fuoco.\nTanto meglio! anderò a rasciugarmi e riscaldarmi, e poi?... e poi sarà\nquel che sarà. —","Presa questa risoluzione, si avvicinò alla scogliera; ma quando fu lì\nper arrampicarsi, sentì qualche cosa sotto l'acqua che saliva, saliva,\nsaliva e lo portava per aria. Tentò subito di fuggire, ma oramai\nera tardi, perchè con sua grandissima maraviglia si trovò rinchiuso\ndentro una grossa rete in mezzo a un brulichìo di pesci d'ogni forma\ne grandezza, che scodinzolavano e si dibattevano come tante anime\ndisperate.","E nel tempo stesso vide uscire dalla grotta un pescatore così brutto,\nma tanto brutto, che pareva un mostro marino. Invece di capelli aveva\nsulla testa un cespuglio foltissimo di erba verde; verde era la pelle\ndel suo corpo, verdi gli occhi, verde la barba lunghissima, che gli\nscendeva fin quaggiù. Pareva un grosso ramarro, ritto sui piedi di\ndietro.","Quando il pescatore ebbe tirata fuori la rete dal mare, gridò tutto\ncontento:","— Provvidenza benedetta! Anch'oggi potrò fare una bella scorpacciata di\npesce!","— Manco male, che io non sono un pesce! — disse Pinocchio dentro di sè,\nripigliando un po' di coraggio.","La rete piena di pesci fu portata dentro la grotta, una grotta buia e\naffumicata in mezzo alla quale friggeva una gran padella d'olio, che\nmandava un odorino di moccolaia, da mozzare il respiro.","— Ora vediamo un po' che pesci abbiamo presi! — disse il pescatore\nverde; e ficcando nella rete una manona così spropositata, che pareva\nuna pala da fornai, tirò fuori una manciata di triglie.","— Buone queste triglie! — disse, guardandole e annusandole con\ncompiacenza. E dopo averle annusate, le scaraventò in una conca\nsenz'acqua.","Poi ripetè più volte la solita operazione; e via via che cavava fuori\ngli altri pesci, sentiva venirsi l'acquolina in bocca e gongolando\ndiceva:","— Buoni questi naselli!...","— Squisiti questi muggini!...","— Deliziose queste sogliole!...","— Prelibati questi ragnotti!...","— Carine queste acciughe col capo! —","Come potete immaginarvelo, i naselli, i muggini, le sogliole, i\nragnotti e l'acciughe, andarono tutti alla rinfusa nella conca, a tener\ncompagnia alle triglie.","L'ultimo che restò nella rete fu Pinocchio.","Appena il pescatore l'ebbe cavato fuori, sgranò dalla maraviglia i suoi\nocchioni verdi, gridando quasi impaurito:","— Che razza di pesce è questo? Dei pesci fatti a questo modo non mi\nricordo di averne mangiati mai. —","E tornò a guardarlo attentamente, e dopo averlo guardato ben bene per\nogni verso, finì col dire:","— Ho capito; dev'essere un granchio di mare. —","Allora Pinocchio, mortificato di sentirsi scambiato per un granchio,\ndisse con accento risentito:","— Ma che granchio e non granchio? Guardi come lei mi tratta! Io, per\nsua regola, sono un burattino.","[Illustrazione: — Che razza di pesce è questo?]","— Un burattino? — replicò il pescatore. — Dico la verità, il pesce\nburattino è per me un pesce nuovo! Meglio così! ti mangerò più\nvolentieri.","— Mangiarmi? ma la vuol capire che io non sono un pesce? O non sente\nche parlo, e ragiono come lei?","— È verissimo; — soggiunse il pescatore — e siccome vedo che sei un\npesce, e che hai la fortuna di parlare e di ragionare come me, così\nvoglio usarti anch'io i dovuti riguardi.","— E questi riguardi sarebbero?...","— In segno di amicizia e di stima particolare, lascerò a te la scelta\ndel come vuoi esser cucinato. Desideri esser fritto in padella, oppure\npreferisci di esser cotto nel tegame colla salsa di pomidoro?","— A dir la verità, — rispose Pinocchio — se io debbo scegliere,\npreferisco piuttosto di esser lasciato libero, per potermene tornare a\ncasa mia.","— Tu scherzi! Ti pare che io voglia perdere l'occasione di assaggiare\nun pesce così raro? Non capita mica tutti i giorni, un pesce burattino\nin questi mari. Lascia fare a me: ti friggerò in padella assieme a\ntutti gli altri pesci, e te ne troverai contento. L'esser fritto in\ncompagnia è sempre una consolazione. —","L'infelice Pinocchio, a quest'antifona, cominciò a piangere, a\nstrillare, a raccomandarsi: e piangendo diceva: — Quant'era meglio,\nche fossi andato a scuola!... Ho voluto dar retta ai compagni, e ora la\npago!... Ih!... Ih!... Ih!... —","E perchè si divincolava come un'anguilla e faceva sforzi incredibili,\nper isgusciare dalle grinfie del pescatore verde, questi prese una\nbella buccia di giunco, e dopo averlo legato per le mani e per i piedi,\ncome un salame, lo gettò in fondo alla conca cogli altri.","Poi, tirato fuori un vassoiaccio di legno, pieno di farina, si dètte\na infarinare tutti quei pesci: e man mano che li aveva infarinati, li\nbuttava a friggere dentro la padella.","I primi a ballare nell'olio bollente furono i poveri naselli: poi toccò\nai ragnotti, poi ai muggini, poi alle sogliole e alle acciughe, e poi\nvenne la volta di Pinocchio. Il quale, a vedersi così vicino alla morte\n(e che brutta morte!) fu preso da tanto tremito e da tanto spavento,\nche non aveva più nè voce nè fiato per raccomandarsi.","Il povero figliuolo si raccomandava cogli occhi! Ma il pescatore verde,\nsenza badarlo neppure, lo avvoltò cinque o sei volte nella farina,\ninfarinandolo così bene dal capo ai piedi, che pareva diventato un\nburattino di gesso.","Poi lo prese per il capo, e...."]},{"name":"Capitolo 29","paragraphs":["Ritorna a casa della Fata, la quale gli promette che il giorno dopo\nnon sarà pi
