...","— are...! — ripetè il Gatto.","— Addio, mascherine! Ricordatevi del proverbio che dice: «Chi ruba il\nmantello al suo prossimo, per il solito muore senza camicia.» —","E così dicendo, Pinocchio e Geppetto seguitarono tranquillamente per\nla loro strada; finchè fatti altri cento passi, videro in fondo a una\nviottola, in mezzo ai campi, una bella capanna tutta di paglia, e col\ntetto coperto d'embrici e di mattoni.","— Quella capanna dev'essere abitata da qualcuno — disse Pinocchio. —\nAndiamo là, e bussiamo. —","Difatti andarono, e bussarono alla porta.","— Chi è? — disse una vocina di dentro.","— Siamo un povero babbo e un povero figliuolo, senza pane e senza\ntetto, — rispose il burattino.","— Girate la chiave, e la porta si aprirà, — disse la solita vocina.","Pinocchio girò la chiave, e la porta si aprì. Appena entrati dentro,\nguardarono di qua, guardarono di là, e non videro nessuno.","[Illustrazione: — Addio, mascherine! Ricordatevi del proverbio\nche dice: “Chi ruba il mantello al suo prossimo, per il solito\nmuore senza camicia.„]","— O il padrone della capanna dov'è? — disse Pinocchio maravigliato.","— Eccomi quassù! —","Babbo e figliuolo si voltarono subito verso il soffitto, e videro sopra\nun travicello il Grillo-parlante.","— Oh! mio caro Grillino — disse Pinocchio, salutandolo garbatamente.","— Ora mi chiami il «Tuo caro Grillino» non è vero? Ma ti rammenti di\nquando, per cacciarmi di casa tua, mi tirasti un manico di martello?","— Hai ragione, Grillino! Scaccia anche me.... tira anche a me un manico\ndi martello: ma abbi pietà del mio povero babbo...","— Io avrò pietà del babbo e anche del figliuolo! ma ho voluto\nrammentarti il brutto garbo ricevuto, per insegnarti che in questo\nmondo, quando si può, bisogna mostrarsi cortesi con tutti, se vogliamo\nesser ricambiati con pari cortesia nei giorni del bisogno.","— Hai ragione, Grillino, hai ragione da vendere; e io terrò a mente la\nlezione che mi hai data. Ma mi dici come hai fatto a comprarti questa\nbella capanna?","— Questa capanna mi è stata regalata jeri da una graziosa capra, che\naveva la lana d'un bellissimo colore turchino.","— E la capra dov'è andata? — domandò Pinocchio, con vivissima curiosità.","— Non lo so.","— E quando ritornerà?...","— Non ritornerà mai. Ieri è partita tutta afflitta, e, belando, pareva\nche dicesse: «Povero Pinocchio!... oramai non lo rivedrò più!... Il\nPesce-cane a quest'ora l'avrà bell'e divorato!...»","— Ha detto proprio così?... Dunque era lei!... era lei!... era la\nmia cara Fatina!... — cominciò a urlare Pinocchio, singhiozzando e\npiangendo dirottamente.","Quand'ebbe pianto ben bene, si rasciugò gli occhi, e preparato un buon\nlettino di paglia, vi distese sopra il vecchio Geppetto. Poi domandò al\nGrillo-parlante:","— Dimmi, Grillino, dove potrei trovare un bicchiere di latte per il mio\npovero babbo?","— Tre campi distante di qui c'è l'ortolano Giangio, che tiene le\nmucche. Va' da lui, e troverai il latte che cerchi. —","Pinocchio andò di corsa a casa dell'ortolano Giangio: ma l'ortolano gli\ndisse:","— Quanto ne vuoi del latte?","— Ne voglio un bicchiere pieno.","— Un bicchiere di latte costa un soldo. Comincia intanto dal darmi il\nsoldo.","— Non ho nemmeno un centesimo — rispose Pinocchio, tutto mortificato e\ndolente.","— Male, burattino mio, — replicò l'ortolano. — Se tu non hai nemmeno un\ncentesimo, io non ho nemmeno un dito di latte.","— Pazienza! — disse Pinocchio, e fece l'atto di andarsene.","— Aspetta un po' — disse Giangio. — Fra te e me ci possiamo accomodare.\nVuoi adattarti a girare il _bindolo_?","— Che cos'è il bindolo?","— Gli è quell'ordigno di legno che serve a tirar su l'acqua dalla\ncisterna per annaffiare gli ortaggi.","— Mi proverò....","— Dunque, tirami su cento secchie d'acqua, e io ti regalerò in compenso\nun bicchiere di latte.","— Sta bene. —","Giangio condusse il burattino nell'orto e gl'insegnò la maniera di\ngirare il _bindolo_. Pinocchio si pose subito al lavoro; ma prima di\naver tirato su le cento secchie d'acqua, era tutto grondante di sudore\ndalla testa ai piedi. Una fatica a quel modo non l'aveva durata mai.","— Finora questa fatica di girare il bindolo — disse l'ortolano — l'ho\nfatta fare al mio ciuchino; ma oggi quel povero animale è in fin di\nvita.","— Mi menate a vederlo? — disse Pinocchio.","— Volentieri. —","[Illustrazione: E chinatosi fino a lui, gli domandò in\ndialetto asinino: — Chi sei? —]","Appena che Pinocchio fu entrato nella stalla; vide un bel ciuchino\ndisteso sulla paglia, rifinito dalla fame e dal troppo lavoro. Quando\nl'ebbe guardato fisso fisso, disse dentro di sè, turbandosi:","— Eppure quel ciuchino lo conosco! Non mi è fisonomia nuova! —","E chinatosi fino a lui, gli domandò in dialetto asinino:","— Chi sei? —","A questa domanda, il ciuchino aprì gli occhi moribondi, e rispose\nbalbettando nel medesimo dialetto:","— Sono Lu....ci....gno....lo. —","E dopo richiuse gli occhi e spirò.","— Oh! povero Lucignolo! — disse Pinocchio a mezza voce: e presa una\nmanciata di paglia si rasciugò una lacrima che gli colava giù per il\nviso.","— Ti commuovi tanto per un asino che non ti costa nulla? — disse\nl'ortolano. — Che cosa dovrei far io che lo comprai a quattrini\ncontanti?","— Vi dirò.... era un mio amico....","— Tuo amico?","— Un mio compagno di scuola!...","— Come?! — urlò Giangio dando in una gran risata. — Come?! avevi dei\nsomari per compagni di scuola?... Figuriamoci i begli studi che devi\naver fatto!... —","Il burattino, sentendosi mortificato da quelle parole, non rispose:\nma prese il suo bicchiere di latte quasi caldo, e se ne tornò alla\ncapanna.","E da quel giorno in poi, continuò più di cinque mesi a levarsi ogni\nmattina, prima dell'alba, per andare a girare il bindolo, e guadagnare\ncosì quel bicchiere di latte, che faceva tanto bene alla salute\ncagionosa del suo babbo. Nè si contentò di questo: perchè a tempo\navanzato, imparò a fabbricare anche i canestri e i panieri di giunco:\ne coi quattrini che ne ricavava, provvedeva con moltissimo giudizio\na tutte le spese giornaliere. Fra le altre cose costruì da sè stesso\nun elegante carrettino per condurre a spasso il suo babbo nelle belle\ngiornate, e per fargli prendere una boccata d'aria.","Nelle veglie poi della sera, si esercitava a leggere e a scrivere.\nAveva comprato nel vicino paese per pochi centesimi un grosso libro, al\nquale mancavano il frontespizio e l'indice, e con quello faceva la sua\nlettura. Quanto allo scrivere, si serviva di un fuscello temperato a\nuso penna; e non avendo nè calamaio nè inchiostro, lo intingeva in una\nboccettina ripiena di sugo di more e di ciliege.","Fatto sta che con la sua buona volontà d'ingegnarsi, di lavorare e di\ntirarsi avanti, non solo era riuscito a mantenere quasi agiatamente il\nsuo genitore sempre malaticcio, ma per di più aveva potuto mettere da\nparte anche quaranta soldi per comprarsi un vestitino nuovo.","Una mattina disse a suo padre:","— Vado qui al mercato vicino a comprarmi una giacchettina, un\nberrettino e un paio di scarpe. Quando tornerò a casa — soggiunse\nridendo — sarò vestito così bene, che mi scambierete per un gran\nsignore. —","E uscito di casa, cominciò a correre tutto allegro e contento. Quando a\nun tratto sentì chiamarsi per nome, e voltandosi, vide una bella Lumaca\nche sbucava fuori dalla siepe.","— Non mi riconosci? — disse la Lumaca.","— Mi pare e non mi pare....","— Non ti ricordi di quella Lumaca, che stava per cameriera con la Fata\ndai capelli turchini? non ti rammenti di quella volta quando scesi a\nfarti lume, e tu rimanesti con un piede confitto nell'uscio di casa?","— Mi rammento di tutto, — gridò Pinocchio — rispondimi subito,\nLumachina bella; dove hai lasciato la mia buona Fata? che fa? mi\nha perdonato? si ricorda sempre di me? mi vuol sempre bene? è molto\nlontana di qui? potrei andare a trovarla? —","A tutte queste domande, fatte precipitosamente e senza ripigliar fiato,\nla Lumaca rispose con la sua solita flemma:","— Pinocchio mio! La povera Fata giace in un fondo di letto allo\nspedale!....","— Allo spedale?...","— Pur troppo. Colpita da mille disgrazie, si è gravemente ammalata, e\nnon ha più da comprarsi un boccon di pane.","— Davvero?... Oh! che gran dolore che mi hai dato! Oh! povera Fatina!\npovera Fatina! povera Fatina! Se avessi un milione, correrei a\nportarglielo.... Ma io non ho che quaranta soldi.... eccoli qui! andavo\ngiusto a comprarmi un vestito nuovo. Prendili, Lumaca, e va' a portarli\nsubito alla mia buona Fata.","— E il tuo vestito nuovo?","— Che m'importa del vestito nuovo? Venderei anche questi cenci che\nho addosso, per poterla aiutare! Va', Lumaca, e spicciati! e fra due\ngiorni ritorna qui, che spero di poterti dare qualche altro soldo.\nFinora ho lavorato per mantenere il mio babbo: da oggi in là, lavorerò\ncinque ore di più per mantenere anche la mia buona mamma. Addio,\nLumaca, e fra due giorni ti aspetto. —","La Lumaca, contro il suo costume, cominciò a correre come una lucertola\nnei grandi solleoni d'agosto.","Quando Pinocchio tornò a casa, il suo babbo gli domandò:","— E il vestito nuovo?","— Non mi è stato possibile di trovarne uno che mi tornasse bene.\nPazienza!... Lo comprerò un'altra volta. —","Quella sera Pinocchio, invece di vegliare fino alle dieci, vegliò fino\nalla mezzanotte sonata! e invece di far otto canestri di giunco ne fece\nsedici.","Poi andò a letto e si addormentò. E nel dormire, gli pareva di vedere\nin sogno la Fata, tutta bella e sorridente, la quale, dopo avergli dato\nun bacio, gli disse così:","— Bravo Pinocchio! In grazia del tuo buon cuore, io ti perdono tutte\nle monellerie che hai fatto fino a oggi. I ragazzi che assistono\namorosamente i propri genitori nelle loro miserie e nelle loro\ninfermità, meritano sempre gran lode e grande affetto, anche se non\npossono esser citati come modelli d'ubbidienza e di buona condotta.\nMetti giudizio per l'avvenire, e sarai felice. —","A questo punto il sogno finì, e Pinocchio si svegliò con tanto d'occhi\nspalancati.","Ora immaginatevi voi quale fu la sua meraviglia quando, svegliandosi,\nsi accòrse che non era più un burattino di legno: ma che era diventato,\ninvece, un ragazzo come tutti gli altri. Dètte un'occhiata all'intorno,\ne invece delle solite pareti di paglia della capanna, vide una bella\ncamerina ammobiliata e agghindata con una semplicità quasi elegante.\nSaltando giù dal letto, trovò preparato un bel vestiario nuovo, un\nberretto nuovo e un paio di stivaletti di pelle, che gli tornavano una\nvera pittura.","Appena si fu vestito, gli venne fatto, naturalmente di mettere le mani\nnelle tasche e tirò fuori un piccolo portamonete d'avorio, sul quale\nerano scritte queste parole: «La Fata dai capelli turchini restituisce\nal suo caro Pinocchio i quaranta soldi, e lo ringrazia tanto del suo\nbuon cuore.» Aperto il portafoglio, invece di quaranta soldi di rame,\nvi luccicavano quaranta zecchini d'oro tutti nuovi di zecca.","Dopo andò a guardarsi allo specchio e gli parve d'essere un altro.\nNon vide più riflessa la solita immagine della marionetta di legno, ma\nvide l'immagine vispa e intelligente di un bel fanciullo coi capelli\ncastagni, cogli occhi celesti e con un'aria allegra e festosa come una\npasqua di rose.","In mezzo a tutte queste meraviglie, che si succedevano le une alle\naltre, Pinocchio non sapeva più nemmeno lui se era desto davvero o se\nsognava sempre a occhi aperti.","— E il mio babbo dov'è? — gridò tutt'a un tratto; ed entrato nella\nstanza accanto trovò il vecchio Geppetto sano, arzillo e di buon umore,\ncome una volta, il quale, avendo ripreso subito la sua professione\nd'intagliatore, stava appunto disegnando una bellissima cornice ricca\ndi fogliami, di fiori e di testine di diversi animali.","[Illustrazione: Gli accennò un grosso burattino appoggiato a\nuna seggiola.]","— Levatemi una curiosità, babbino: ma come si spiega tutto questo\ncambiamento improvviso? — gli domandò Pinocchio saltandogli al collo e\ncoprendolo di baci.","— Questo improvviso cambiamento in casa nostra è tutto merito tuo —\ndisse Geppetto.","— Perchè merito mio?","— Perchè quando i ragazzi, di cattivi diventano buoni, hanno la virtù\ndi far prendere un aspetto nuovo e sorridente anche nell'interno delle\nloro famiglie.","— E il vecchio Pinocchio di legno dove si sarà nascosto?","— Eccolo là! — rispose Geppetto; e gli accennò un grosso burattino\nappoggiato a una seggiola, col capo girato sur una parte, con le\nbraccia ciondoloni e con le gambe incrocicchiate e ripiegate a mezzo,\nda parere un miracolo se stava ritto.","Pinocchio si voltò a guardarlo: e dopo che l'ebbe guardato un poco,\ndisse dentro di sè con grandissima compiacenza:","— Com'ero buffo, quand'ero un burattino! e come ora son contento di\nesser diventato un ragazzino perbene!... —","FINE.","INDICE","I Come andò che maestro Ciliegia, falegname, trovò\nun pezzo di legno, che piangeva e rideva come\nun bambino Pag. 5","II Maestro Ciliegia regala il pezzo di legno al suo\namico Geppetto, il quale lo prende per\nfabbricarsi un burattino maraviglioso, che\nsappia ballare, tirare di scherma e fare i\nsalti mortali 10","III Geppetto, tornato a casa, comincia subito a\nfabbricarsi il burattino e gli mette il nome\ndi Pinocchio. Prime monellerie del burattino 15","IV La storia di Pinocchio col Grillo-parlante, dove\nsi vede come i ragazzi cattivi hanno a noia di\nsentirsi correggere da chi ne sa più di loro 23","V Pinocchio ha fame e cerca un uovo per farsi una\nfrittata; ma sul più bello, la frittata gli vola\nvia dalla finestra 27","VI Pinocchio si addormenta coi piedi sul caldano, e\nla mattina dopo si sveglia coi piedi tutti bruciati 31","VII Geppetto torna a casa, e dà al burattino la colazione\nche il pover'uomo aveva portata per sè 34","VIII Geppetto rifà i piedi a Pinocchio, e vende la propria\ncasacca per comprargli l'Abbecedario 40","IX Pinocchio vende l'Abbecedario per andare a vedere\nil teatro dei burattini 46","X I burattini riconoscono il loro fratello Pinocchio e\ngli fanno una grandissima festa; ma sul più bello\nesce fuori il burattinaio Mangiafoco, e Pinocchio\ncorre pericolo di fare una brutta fine 51","XI Mangiafoco starnutisce e perdona a Pinocchio, il\nquale poi difende dalla morte il suo amico\nArlecchino 56","XII Il burattinaio Mangiafoco regala cinque monete\nd'oro a Pinocchio perchè le porti al suo babbo\nGeppetto: e Pinocchio, invece, si lascia\nabbindolare dalla Volpe e dal Gatto e se ne va\ncon loro 64","XIII L'osteria del «Gambero Rosso» 72","XIV Pinocchio, per non aver dato retta ai buoni consigli\ndel Grillo-parlante, s'imbatte negli assassini 78","XV Gli assassini inseguono Pinocchio; e dopo averlo\nraggiunto lo impiccano a un ramo della Quercia\ngrande 84","XVI La bella Bambina dai capelli turchini fa raccogliere\nil burattino: lo mette a letto, e chiama\ntre medici per sapere se sia vivo o morto 89","XVII Pinocchio mangia lo zucchero, ma non vuol purgarsi;\nperò quando vede i becchini che vengono\na portarlo via, allora si purga. Poi dice\nuna bugia, e per gastigo gli cresce il naso 96","XVIII Pinocchio ritrova la Volpe e il Gatto, e va con\nloro a seminare le quattro monete nel Campo\ndei miracoli 105","XIX Pinocchio è derubato delle sue monete d'oro, e\nper gastigo si busca quattro mesi di prigione 113","XX Liberato dalla prigione, si avvia per tornare a\ncasa della Fata; ma lungo la strada trova un\nserpente orribile, e poi rimane preso alla\ntagliuola 122","XXI Pinocchio è preso da un contadino, il quale lo\ncostringe a far da can di guardia a un pollaio 127","XXII Pinocchio scuopre i ladri, e in ricompensa di\nessere stato fedele vien posto in libertà 132","XXIII Pinocchio piange la morte della bella Bambina\ndai capelli turchini: poi trova un Colombo,\nche lo porta sulla riva del mare, e lì si getta\nnell'acqua per andare in aiuto del suo babbo\nGeppetto 137","XXIV Pinocchio arriva all'isola delle «Api industriose»\ne ritrova la Fata 147","XXV Pinocchio promette alla Fata di esser buono e di\nstudiare, perchè è stufo di fare il burattino e\nvuol diventare un bravo ragazzo 157","XXVI Pinocchio va co' suoi compagni di scuola in riva\nal mare, per vedere il terribile Pesce-cane 163","XXVII Gran combattimento fra Pinocchio e i suoi compagni:\nuno dei quali essendo rimasto ferito,\nPinocchio viene arrestato dai carabinieri 169","XXVIII Pinocchio corre pericolo di esser fritto in padella,\ncome un pesce 180","XXIX Ritorna a casa della Fata, la quale gli promette\nche il giorno dopo non sarà più un burattino,\nma diventerà un ragazzo. Gran colazione di\ncaffè-e-latte per festeggiare questo grande\navvenimento 189","XXX Pinocchio, invece di diventare un ragazzo, parte\ndi nascosto col suo amico Lucignolo per il\n«Paese dei balocchi» 204","XXXI Dopo cinque mesi di cuccagna, Pinocchio, con\nsua gran meraviglia, sente spuntarsi un bel\npaio d'orecchie asinine, e diventa un ciuchino,\ncon la coda e tutto 212","XXXII A Pinocchio gli vengono gli orecchi di ciuco, e\npoi diventa un ciuchino vero e comincia a\nragliare 226","XXXIII Diventato un ciuchino vero, è portato a vendere,\ne lo compra il Direttore di una compagnia di\npagliacci, per insegnargli a ballare e saltare i\ncerchi: ma una sera azzoppisce e allora lo ricompra\nun altro, per far con la sua pelle un tamburo 238","XXXIV Pinocchio, gettato in mare, è mangiato dai pesci,\ne ritorna ad essere un burattino come prima:\nma mentre nuota per salvarsi, è ingoiato dal\nterribile Pesce-cane 252","XXXV Pinocchio ritrova in corpo al Pesce-cane.... chi\nritrova? Leggete questo capitolo e lo saprete 264","XXXVI Finalmente Pinocchio cessa d'essere un burattino\ne diventa un ragazzo 276","Nota del Trascrittore","Ortografia e punteggiatura originali sono state mantenute, correggendo\nsenza annotazione minimi errori tipografici.","End of Project Gutenberg's Le avventure di Pinocchio, by Carlo Collodi"]}]</script>
<script>'use strict';
const $=id=>document.getElementById(id);
const KEY='ophelia-pinocchio-original-italiano-read-only-v1';
const state={page:0,size:20,night:false,bookmark:-1};
try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let pages=[],sections=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function countWords(text){return (text.match(/\S+/g)||[]).length;}
function paginate(parts){
 const result=[];
 for(let section=0;section<parts.length;section++){
  let group=[],words=0;
  const flush=()=>{if(group.length){result.push({section,paragraphs:group});group=[];words=0}};
  for(const par of parts[section].paragraphs){
   const size=countWords(par);
   if(words+size>300&&group.length)flush();
   if(size>350){
    
    const lines=par.split('\n');let chunk='',n=0;
    for(const line of lines){const w=countWords(line);if(n+w>290&&chunk){group.push(chunk);flush();chunk='';n=0}chunk+=(chunk?'\n':'')+line;n+=w}
    if(chunk){group.push(chunk);words+=n}
   }else{group.push(par);words+=size}
  }
  flush();
 }
 return result;
}
function render(scroll=true){
 if(!pages.length)return;
 state.page=Math.min(Math.max(0,Number(state.page)||0),pages.length-1);
 const page=pages[state.page],part=sections[page.section];
 const box=$('reading');box.replaceChildren();
 const heading=document.createElement('h2');heading.textContent=part.name;box.append(heading);
 for(const paragraph of page.paragraphs){const p=document.createElement('p');p.lang='it';p.className='notranslate';p.setAttribute('translate','no');p.textContent=paragraph;box.append(p)}
 $('section').value=String(page.section);
 $('pages').textContent='Pagina '+(state.page+1)+' / '+pages.length;
 const percent=Math.round((state.page+1)/pages.length*100);
 $('progress').textContent=percent+' % letto';$('bar').style.width=percent+'%';
 $('prev').disabled=state.page===0;$('next').disabled=state.page===pages.length-1;
 $('bookmark').textContent=state.bookmark===state.page?'♥ Segnalibro':'♡ Segnalibro';
 document.documentElement.style.setProperty('--size',state.size+'px');
 document.body.classList.toggle('night',state.night);
 save();
 if(scroll)document.querySelector('article').scrollIntoView({behavior:'instant',block:'start'});
}
$('prev').onclick=()=>{if(state.page>0){state.page--;render()}};
$('next').onclick=()=>{if(state.page<pages.length-1){state.page++;render()}};
$('section').onchange=()=>{const p=pages.findIndex(page=>page.section===Number($('section').value));if(p>=0){state.page=p;render()}};
$('smaller').onclick=()=>{state.size=Math.max(15,state.size-1);render(false)};
$('larger').onclick=()=>{state.size=Math.min(30,state.size+1);render(false)};
$('dark').onclick=()=>{state.night=!state.night;render(false)};
$('bookmark').onclick=()=>{state.bookmark=state.page;save();render(false);$('message').textContent='Segnalibro salvato a pagina '+(state.page+1)};
$('return').onclick=()=>{if(state.bookmark>=0){state.page=state.bookmark;render()}else $('message').textContent='Nessun segnalibro salvato.'};
document.addEventListener('keydown',e=>{if(e.target.closest('button,select,input'))return;if(e.key==='ArrowRight'&&state.page<pages.length-1){state.page++;render()}else if(e.key==='ArrowLeft'&&state.page>0){state.page--;render()}});

sections=JSON.parse($('texte').textContent);
pages=paginate(sections);
$('section').replaceChildren(...sections.map((part,i)=>new Option(part.name,i)));
render(false);
</script></body></html>
