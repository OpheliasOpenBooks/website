ù un burattino, ma diventerà un ragazzo. Gran colazione di\ncaffè-e-latte per festeggiare questo grande avvenimento.","Mentre il pescatore era proprio sul punto di buttar Pinocchio nella\npadella, entrò nella grotta un grosso cane, condotto là dall'odore\nacutissimo e ghiotto della frittura.","— Passa via! — gli gridò il pescatore minacciandolo e tenendo sempre in\nmano il burattino infarinato.","Ma il povero cane aveva una fame per quattro, e mugolando e dimenando\nla coda, pareva che dicesse:","— Dammi un boccone di frittura e ti lascio in pace.","— Passa via, ti dico! — gli ripetè il pescatore; e allungò la gamba per\ntirargli una pedata.","Allora il cane che, quando aveva fame davvero, non era avvezzo a\nlasciarsi posar mosche sul naso, si rivoltò ringhioso al pescatore,\nmostrandogli le sue terribili zanne.","In quel mentre si udì nella grotta una vocina fioca fioca che disse:","— Salvami, Alidoro! Se non mi salvi, son fritto!... —","[Illustrazione: — Passa via! — gli gridò il pescatore.]","Il cane riconobbe subito la voce di Pinocchio, e si accòrse, con\nsua grandissima meraviglia, che la vocina era uscita da quel fagotto\ninfarinato, che il pescatore teneva in mano.","Allora che cosa fa? Spicca un gran lancio da terra, abbocca quel\nfagotto infarinato, e tenendolo leggermente coi denti, esce correndo\ndalla grotta, e via come un baleno!","Il pescatore arrabbiatissimo di vedersi strappar di mano un pesce,\nche egli avrebbe mangiato tanto volentieri, si provò a rincorrere il\ncane; ma fatti pochi passi gli venne un nodo di tosse e dovè tornarsene\nindietro.","Intanto Alidoro, ritrovata che ebbe la viottola che conduceva al paese,\nsi fermò e posò delicatamente in terra l'amico Pinocchio.","[Illustrazione: Tenendolo leggermente coi denti, esce correndo\ndalla grotta, e via come un baleno!]","— Quanto ti debbo ringraziare! — disse il burattino.","— Non c'è bisogno; — replicò il cane — tu salvasti me, e quel che è\nfatto è reso. Si sa: in questo mondo bisogna tutti aiutarsi l'uno con\nl'altro.","— Ma come mai sei capitato in quella grotta?","— Ero sempre qui disteso sulla spiaggia più morto che vivo, quando il\nvento mi ha portato da lontano un odorino di frittura. Quell'odorino mi\nha stuzzicato l'appetito, e io gli sono andato dietro. Se arrivavo un\nminuto più tardi!...","— Non me lo dire! — urlò Pinocchio che tremava ancora dalla paura. —\nNon me lo dire! Se tu arrivavi un minuto più tardi, a quest'ora io ero\nbell'e fritto, mangiato e digerito. Brrr! mi vengono i brividi soltanto\na pensarvi!... —","Alidoro, ridendo, stese la zampa destra verso il burattino, il quale\ngliela strinse forte forte in segno di grande amicizia: e dopo si\nlasciarono.","Il cane riprese la strada di casa: e Pinocchio, rimasto solo, andò a\nuna capanna lì poco distante, e domandò a un vecchietto che stava sulla\nporta a scaldarsi al sole:","— Dite, galantuomo, sapete nulla di un povero ragazzo ferito nel capo\ne che si chiamava Eugenio?","— Il ragazzo è stato portato da alcuni pescatori in questa capanna, e\nora....","— Ora sarà morto!... — interruppe Pinocchio, con gran dolore.","— No: ora è vivo, ed è già ritornato a casa sua.","[Illustrazione: — Dite, galantuomo, sapete nulla di un povero\nragazzo ferito nel capo e che si chiamava Eugenio?]","— Davvero?... davvero?... — gridò il burattino, saltando\ndall'allegrezza. — Dunque la ferita non era grave?...","— Ma poteva riuscire gravissima e anche mortale, — rispose il\nvecchietto — perchè gli tirarono nel capo un grosso libro rilegato in\ncartone.","— E chi glielo tirò?","— Un suo compagno di scuola: un certo Pinocchio....","— E chi è questo Pinocchio? — domandò il burattino facendo lo gnorri.","— Dicono che sia un ragazzaccio, un vagabondo, un vero rompicollo.","— Calunnie! Tutte calunnie!","— Lo conosci tu questo Pinocchio?","— Di vista! — rispose il burattino.","— E tu, che concetto ne hai? — gli chiese il vecchietto.","— A me mi pare un gran buon figliuolo, pieno di voglia di studiare,\nobbediente, affezionato al suo babbo e alla sua famiglia.... —","Mentre il burattino sfilava a faccia fresca tutte queste bugie, si\ntoccò il naso e si accorse che il naso gli era allungato più di un\npalmo. Allora tutto impaurito cominciò a gridare:","— Non date retta, galantuomo, a tutto il bene che ve ne ho detto;\nperchè conosco benissimo Pinocchio e posso assicurarvi anch'io ch'è\ndavvero un ragazzaccio, un disubbidiente e uno svogliato, e che invece\ndi andare a scuola, va coi compagni a fare lo sbarazzino! —","Appena ebbe pronunziate queste parole, il suo naso raccorcì e tornò\nalla grandezza naturale, come era prima.","— E perchè sei tutto bianco a codesto modo? — gli domandò a un tratto\nil vecchietto.","— Vi dirò.... senza avvedermene, mi sono strofinato a un muro, che era\nimbiancato di fresco — rispose il burattino vergognandosi a raccontare\nche lo avevano infarinato come un pesce, per poi friggerlo in padella.","— O della tua giacchetta, de' tuoi calzoncini e del tuo berretto, che\ncosa ne hai fatto?","— Ho incontrato i ladri e mi hanno spogliato. Dite, buon vecchio, non\navreste per caso da darmi un po' di vestituccio, tanto perchè io possa\nritornare a casa?","— Ragazzo mio; in quanto a vestiti, io non ho che un piccolo sacchetto,\ndove ci tengo i lupini. Se lo vuoi, piglialo: eccolo là. —","Pinocchio non se lo fece dire due volte: prese subito il sacchetto dei\nlupini che era vuoto, e dopo averci fatto colle forbici una piccola\nbuca nel fondo e due buche dalle parti, se lo infilò a uso camicia.\nE vestito leggerino a quel modo, si avviò verso il paese. Ma, lungo\nla strada, non si sentiva punto tranquillo; tant'è vero che faceva un\npasso avanti e uno indietro, e discorrendo da sè solo andava dicendo:","— Come farò a presentarmi alla mia buona Fatina? Che dirà quando mi\nvedrà?... Vorrà perdonarmi questa seconda birichinata?... Scommetto che\nnon me la perdona!... oh! non me la perdona di certo!... E mi sta il\ndovere: perchè io sono un monello che prometto sempre di correggermi,\ne non mantengo mai!... —","[Illustrazione: E vestito leggerino a quel modo, si avviò\nverso il paese.]","Arrivò al paese che era già notte buia; e perchè faceva tempaccio e\nl'acqua veniva giù a catinelle, andò diritto diritto alla casa della\nFata, coll'animo risoluto di bussare alla porta e di farsi aprire.","Ma quando fu lì, sentì mancarsi il coraggio, e invece di bussare, si\nallontanò, correndo, una ventina di passi. Poi tornò una seconda volta\nalla porta, e non concluse nulla: poi si avvicinò una terza volta e\nnulla: la quarta volta prese, tremando, il battente di ferro in mano,\ne bussò un piccolo colpettino.","Aspetta, aspetta, finalmente dopo mezz'ora si aprì una finestra\ndell'ultimo piano (la casa era di quattro piani) e Pinocchio vide\naffacciarsi una grossa Lumaca, che aveva un lumicino acceso sul capo,\nla quale disse:","— Chi è a quest'ora?","— La Fata è in casa? — domandò il burattino.","— La Fata dorme e non vuol essere svegliata: ma tu chi sei?","— Sono io!","— Chi io?","— Pinocchio.","— Chi Pinocchio?","— Il burattino, quello che sta in casa colla Fata.","— Ah! ho capito; — disse la Lumaca — aspettami costì, che ora scendo\ngiù e ti apro subito.","— Spicciatevi, per carità, perchè io muoio dal freddo.","— Ragazzo mio, io sono una Lumaca, e le Lumache non hanno mai\nfretta. —","Intanto passò un'ora, ne passarono due e la porta non si apriva: per\ncui Pinocchio, che tremava dal freddo, dalla paura e dall'acqua che\naveva addosso, si fece cuore e bussò una seconda volta, e bussò più\nforte.","A quel secondo colpo si aprì una finestra del piano di sotto e si\naffacciò la solita Lumaca.","— Lumachina bella, — gridò Pinocchio dalla strada — sono due ore che\naspetto! E due ore, a questa serataccia, diventano più lunghe di due\nanni. Spicciatevi, per carità.","— Ragazzo mio, — gli rispose dalla finestra quella bestiuola tutta\npace e tutta flemma — ragazzo mio, io sono una Lumaca, e le Lumache non\nhanno mai fretta. — E la finestra si richiuse.","Di lì a poco suonò la mezzanotte: poi il tocco, poi le due dopo\nmezzanotte, e la porta era sempre chiusa.","Allora Pinocchio, perduta la pazienza, afferrò con rabbia il battente\ndella porta per bussare un colpo da far rintronare tutto il casamento;\nma il battente che era di ferro, diventò a un tratto un'anguilla\nviva, che sgusciandogli dalle mani sparì in un rigagnolo d'acqua, che\nscorreva in mezzo alla strada.","— Ah! sì? — gridò Pinocchio sempre più accecato dalla collera. — Se il\nbattente è sparito, io seguiterò a bussare a furia di calci. —","E tiratosi un poco indietro, lasciò andare una solennissima pedata\nnell'uscio della casa. Il colpo fu così forte, che il piede penetrò nel\nlegno fino a mezzo: e quando il burattino si provò a ricavarlo fuori,\nfu tutta fatica inutile, perchè il piede c'era rimasto conficcato\ndentro, come un chiodo ribadito.","Figuratevi il povero Pinocchio! Dovè passare tutto il resto della notte\ncon un piede in terra e con quell'altro per aria.","La mattina, sul far del giorno, finalmente la porta si aprì. Quella\nbrava bestiuola della Lumaca, a scendere dal quarto piano fino\nall'uscio di strada, ci aveva messo solamente nove ore. Bisogna proprio\ndire che avesse fatto una sudata.","— Che cosa fate con codesto piede conficcato nell'uscio? — domandò\nridendo al burattino.","— È stata una disgrazia. Vedete un po', Lumachina bella, se vi riesce\ndi liberarmi da questo supplizio.","— Ragazzo mio, costì ci vuole un legnaiolo, e io non ho fatto mai la\nlegnaiola.","— Pregate la Fata da parte mia!...","— La Fata dorme e non vuol essere svegliata.","[Illustrazione: — Che cosa fate con codesto piede conficcato\nnell'uscio?]","— Ma che cosa volete che io faccia, inchiodato tutto il giorno a questa\nporta?","— Divertiti a contare le formicole che passano per la strada.","— Portatemi almeno qualche cosa da mangiare, perchè mi sento\nrifinito.","— Subito! — disse la Lumaca.","Difatti dopo tre ore e mezzo, Pinocchio la vide tornare con un vassoio\nd'argento in capo. Nel vassoio c'era un pane, un pollastro arrosto e\nquattro albicocche mature.","— Ecco la colazione che vi manda la Fata — disse la Lumaca.","Alla vista di quella grazia di Dio, il burattino sentì consolarsi\ntutto. Ma quale fu il suo disinganno, quando incominciando a mangiare,\nsi dovè accorgere che il pane era di gesso, il pollastro di cartone e\nle quattro albicocche di alabastro, colorite, come se fossero vere.","Voleva piangere, voleva darsi alla disperazione, voleva buttar via il\nvassoio e quel che c'era dentro; ma invece, o fosse il gran dolore o la\ngran languidezza di stomaco, fatto sta che cadde svenuto.","Quando si riebbe, si trovò disteso sopra un sofà, e la Fata era accanto\na lui.","— Anche per questa volta ti perdono: — gli disse la Fata — ma guai a\nte, se me ne fai un'altra delle tue!... —","Pinocchio promise e giurò che avrebbe studiato, e che si sarebbe\ncondotto sempre bene. E mantenne la parola per tutto il resto\ndell'anno. Difatti agli esami delle vacanze, ebbe l'onore di essere\nil più bravo della scuola; e i suoi portamenti, in generale, furono\ngiudicati così lodevoli e soddisfacenti, che la Fata, tutta contenta,\ngli disse:","— Domani finalmente il tuo desiderio sarà appagato!","[Illustrazione: Chi non ha veduto la gioia di Pinocchio, a\nquesta notizia tanto sospirata, non potrà mai figurarsela.]","— Cioè?","— Domani finirai di essere un burattino di legno, e diventerai un\nragazzo per bene. —","Chi non ha veduto la gioia di Pinocchio, a questa notizia tanto\nsospirata, non potrà mai figurarsela. Tutti i suoi amici e compagni di\nscuola dovevano essere invitati per il giorno dopo a una gran colazione\nin casa della Fata, per festeggiare insieme il grande avvenimento:\ne la Fata aveva fatto preparare dugento tazze di caffè-e-latte e\nquattrocento panini imburrati di dentro e di fuori. Quella giornata\nprometteva di riuscire molto bella e molto allegra: ma....","Disgraziatamente, nella vita dei burattini, c'è sempre un _ma_, che\nsciupa ogni cosa."]},{"name":"Capitolo 30","paragraphs":["Pinocchio, invece di diventare un ragazzo, parte di nascosto col suo\namico Lucignolo per il «Paese dei balocchi.»","Com'è naturale, Pinocchio chiese subito alla Fata il permesso di andare\nin giro per la città a fare gl'inviti: e la Fata gli disse:","— Va' pure a invitare i tuoi compagni per la colazione di domani: ma\nricordati di tornare a casa prima che faccia notte. Hai capito?","— Fra un'ora prometto di esser bell'e ritornato — replicò il burattino.","— Bada, Pinocchio! I ragazzi fanno presto a promettere, ma il più delle\nvolte, fanno tardi a mantenere.","— Ma io non sono come gli altri: io, quando dico una cosa, la mantengo.","— Vedremo. Caso poi tu disubbidissi, tanto peggio per te.","— Perchè?","— Perchè i ragazzi che non dànno retta ai consigli di chi ne sa più di\nloro, vanno sempre incontro a qualche disgrazia.","— E io l'ho provato! — disse Pinocchio. — Ma ora non ci ricasco più!","— Vedremo se dici il vero. —","Senza aggiungere altre parole, il burattino salutò la sua buona Fata,\nche era per lui una specie di mamma, e cantando e ballando uscì fuori\ndalla porta di casa.","In poco più d'un'ora tutti i suoi amici furono invitati. Alcuni\naccettarono subito e di gran cuore, altri, da principio, si fecero\nun po' pregare; ma quando seppero che i panini da inzuppare nel\ncaffè-e-latte sarebbero stati imburrati anche dalla parte di fuori,\nfinirono tutti col dire: — Verremo anche noi, per farti piacere. —","Ora bisogna sapere che Pinocchio, fra i suoi amici e compagni di\nscuola, ne aveva uno prediletto e carissimo, il quale si chiamava di\nnome Romeo; ma tutti lo chiamavano col soprannome di _Lucignolo_, per\nvia del suo personalino asciutto, secco e allampanato, tale e quale\ncome il lucignolo nuovo di un lumino da notte.","Lucignolo era il ragazzo più svogliato e più birichino di tutta la\nscuola: ma Pinocchio gli voleva un gran bene. Difatti andò subito a\ncercarlo a casa per invitarlo alla colazione, e non lo trovò: tornò una\nseconda volta, e Lucignolo non c'era: tornò una terza volta, e fece la\nstrada invano.","Dove poterlo ripescare? Cerca di qua, cerca di là, finalmente lo vide\nnascosto sotto il portico di una casa di contadini.","— Che cosa fai costì? — gli domandò Pinocchio, avanzandosi.","— Aspetto la mezzanotte, per partire....","— Dove vai?","— Lontano, lontano, lontano!","— E io che son venuto a cercarti a casa tre volte!...","— Che cosa volevi da me?","— Non sai il grande avvenimento? Non sai la fortuna che mi è toccata?","— Quale?","— Domani finisco di essere un burattino e divento un ragazzo come te,\ne come tutti gli altri.","— Buon pro ti faccia.","— Domani dunque ti aspetto a colazione a casa mia.","— Ma se ti dico che parto questa sera.","— A che ora?","— Fra poco.","— E dove vai?","— Vado ad abitare in un paese.... che è il più bel paese di questo\nmondo: una vera cuccagna!...","— E come si chiama?","— Si chiama il «Paese dei balocchi.» Perchè non vieni anche tu?","— Io? no davvero!","— Hai torto, Pinocchio! Credilo a me, che se non vieni, te ne pentirai.\nDove vuoi trovare un paese più sano per noialtri ragazzi? Lì non vi\nsono scuole: lì non vi sono maestri; lì non vi sono libri. In quel\npaese benedetto non si studia mai. Il giovedì non si fa scuola: e ogni\nsettimana è composta di sei giovedì e di una domenica. Figurati che\nle vacanze dell'autunno cominciano col primo di gennaio e finiscono\ncoll'ultimo di dicembre. Ecco un paese, come piace veramente a me! Ecco\ncome dovrebbero essere tutti i paesi civili!...","— Ma come si passano le giornate nel «Paese dei balocchi?»","— Si passano baloccandosi e divertendosi dalla mattina alla sera. La\nsera poi si va a letto, e la mattina dopo si ricomincia daccapo. Che te\nne pare?","— Uhm!... — fece Pinocchio; e tentennò leggermente il capo, come dire:\n— È una vita che la farei volentieri anch'io.","— Dunque, vuoi partire con me? Sì o no? Risolviti.","— No, no, no e poi no. Oramai ho promesso alla mia buona Fata di\ndiventare un ragazzo perbene, e voglio mantenere la promessa. Anzi,\nsiccome vedo che il sole va sotto, così ti lascio subito e scappo via.\nDunque addio, e buon viaggio.","— Dove corri con tanta furia?","— A casa. La mia buona Fata vuole che ritorni prima di notte.","— Aspetta altri due minuti.","— Faccio troppo tardi.","— Due minuti soli.","— E se poi la Fata mi grida?","— Lasciala gridare. Quando avrà gridato ben bene, si cheterà — disse\nquella birba di Lucignolo.","— E come fai? Parti solo o in compagnia?","— Solo? Saremo più di cento ragazzi.","— E il viaggio lo fate a piedi?","— Fra poco passerà di qui il carro che mi deve prendere e condurre fin\ndentro ai confini di quel fortunatissimo paese.","— Che cosa pagherei che il carro passasse ora!...","— Perchè?","— Per vedervi partire tutti insieme.","— Rimani qui un altro poco e ci vedrai.","— No, no: voglio ritornare a casa.","— Aspetta altri due minuti.","— Ho indugiato anche troppo. La Fata starà in pensiero per me.","— Povera Fata! Che ha paura forse che ti mangino i pipistrelli?","— Ma dunque, — soggiunse Pinocchio — tu sei veramente sicuro che in\nquel paese non ci sono punte scuole?...","— Neanche l'ombra.","— E nemmeno i maestri?","— Nemmeno uno.","— E non c'è mai l'obbligo di studiare?","— Mai, mai, mai!","— Che bel paese! — disse Pinocchio, sentendo venirsi l'acquolina in\nbocca. — Che bel paese! Io non ci sono stato mai, ma me lo figuro!...","— Perchè non vieni anche tu?","— È inutile che tu mi tenti! Oramai ho promesso alla mia buona Fata di\ndiventare un ragazzo di giudizio, e non voglio mancare alla parola.","— Dunque addio, e salutami tanto le scuole ginnasiali!... e anche\nquelle liceali, se le incontri per la strada.","— Addio, Lucignolo; fa' buon viaggio, divertiti e rammentati qualche\nvolta degli amici. —","Ciò detto, il burattino fece due passi in atto di andarsene: ma poi,\nfermandosi e voltandosi all'amico, gli domandò:","— Ma sei proprio sicuro che in quel paese tutte le settimane sieno\ncomposte di sei giovedì e di una domenica?","— Sicurissimo.","— Ma lo sai dicerto, che le vacanze abbiano principio col primo di\ngennaio e finiscano coll'ultimo di dicembre?","— Di certissimo.","— Che bel paese! — ripetè Pinocchio, sputando dalla soverchia\nconsolazione. Poi, fatto un animo risoluto, soggiunse in fretta e in\nfuria:","— Dunque, addio davvero: e buon viaggio.","— Addio.","— Fra quanto partirete?","— Fra poco.","— Peccato! se alla partenza mancasse un'ora sola, sarei quasi capace di\naspettare.","— E la Fata?","— Oramai ho fatto tardi!... e tornare a casa un'ora prima o un'ora dopo\nè lo stesso.","— Povero Pinocchio! E se la Fata ti grida?","— Pazienza! La lascerò gridare. Quando avrà gridato ben bene si\ncheterà. —","Intanto si era già fatta notte e notte buia: quando a un tratto videro\nmuoversi in lontananza un lumicino.... e sentirono un suono di bubboli\ne uno squillo di trombetta, così piccolino e soffocato, che pareva il\nsibilo di una zanzara.","— Eccolo! — gridò Lucignolo rizzandosi in piedi.","— Chi è? — domandò sottovoce Pinocchio.","— È il carro che viene a prendermi. Dunque, vuoi venire, sì o no?","— Ma è proprio vero — domandò il burattino — che in quel paese i\nragazzi non hanno mai l'obbligo di studiare?","— Mai, mai, mai!","— Che bel paese!... che bel paese!... Che bel paese!... —"]},{"name":"Capitolo 31","paragraphs":["Dopo cinque mesi di cuccagna, Pinocchio con sua gran meraviglia sente\nspuntarsi un bel pajo d'orecchie asinine, e diventa un ciuchino, con la\ncoda e tutto.","Finalmente il carro arrivò: e arrivò senza fare il più piccolo rumore,\nperchè le sue ruote erano fasciate di stoppa e di cenci.","Lo tiravano dodici pariglie di ciuchini, tutti della medesima\ngrandezza, ma di diverso pelame.","Alcuni erano bigi, altri bianchi, altri brizzolati a uso pepe e sale,\ne altri rigati da grandi strisce gialle e turchine.","Ma la cosa più singolare era questa: che quelle dodici pariglie, ossia\nquei ventiquattro ciuchini, invece di essere ferrati come tutte le\naltre bestie da tiro o da soma, avevano ai piedi degli stivaletti da\nuomo fatti di pelle bianca.","E il conduttore del carro?...","[Illustrazione: Finalmente il carro arrivò....]","Figuratevi un omino più largo che lungo, tenero e untuoso come una\npalla di burro, con un visino di melarosa, una bocchina che rideva\nsempre e una voce sottile e carezzevole, come quella d'un gatto, che si\nraccomanda al buon cuore della padrona di casa.","Tutti i ragazzi, appena lo vedevano, ne restavano innamorati e facevano\na gara nel montare sul suo carro, per esser condotti da lui in quella\nvera cuccagna, conosciuta nella carta geografica col seducente nome di\n«Paese de' balocchi.»","[Illustrazione: Figuratevi un omino più largo che lungo,\ntenero e untuoso come una palla di burro.]","Difatti il carro era già tutto pieno di ragazzetti fra gli otto\ne i dodici anni, ammonticchiati gli uni sugli altri come tante\nacciughe nella salamoia. Stavano male, stavano pigiati, non potevano\nquasi respirare: ma nessuno diceva _ohi!_ nessuno si lamentava. La\nconsolazione di sapere che fra poche ore sarebbero giunti in un paese,\ndove non c'erano nè libri, nè scuole, nè maestri, li rendeva così\ncontenti e rassegnati, che non sentivano nè i disagi, nè gli strapazzi,\nnè la fame, nè la sete, nè il sonno.","Appena che il carro si fu fermato, l'omino si volse a Lucignolo, e con\nmille smorfie e mille manierine, gli domandò sorridendo:","— Dimmi, mio bel ragazzo, vuoi venire anche tu, in quel fortunato paese?","— Sicuro, che ci voglio venire!","— Ma ti avverto, carino mio, che nel carro non c'è più posto. Come\nvedi, è tutto pieno!...","— Pazienza! — replicò Lucignolo — se non c'è posto dentro, mi adatterò\na star seduto sulle stanghe del carro. — E spiccato un salto, montò a\ncavalcioni sulle stanghe.","— E tu amor mio, — disse l'omino volgendosi tutto complimentoso a\nPinocchio — che intendi fare? Vieni con noi o rimani?...","— Io rimango — rispose Pinocchio. — Io voglio tornarmene a casa mia:\nvoglio studiare e voglio farmi onore alla scuola, come fanno tutti i\nragazzi perbene.","— Buon pro ti faccia!","— Pinocchio, — disse allora Lucignolo — dai retta a me: vieni con noi\ne staremo allegri!","— No, no, no!","[Illustrazione: — E se vengo con voi, che cosa dirà la mia\nbuona Fata?]","— Vieni con noi e staremo allegri! — gridarono altre quattro voci di\ndentro al carro.","— Vieni con noi e staremo allegri! — urlarono tutte insieme un\ncentinaio di voci.","— E se vengo con voi, che cosa dirà la mia buona Fata? — disse il\nburattino, che cominciava a intenerirsi e a ciurlare nel manico.","— Non ti fasciare il capo con tante malinconie. Pensa che andiamo in\nun paese dove saremo padroni di fare il chiasso dalla mattina alla\nsera! —","Pinocchio non rispose, ma fece un sospiro; poi fece un altro sospiro:\npoi un terzo sospiro: finalmente disse:","— Fatemi un po' di posto: voglio venire anch'io!...","— I posti son tutti pieni; — replicò l'omino — ma per mostrarti quanto\nsei gradito, posso cederti il mio posto a cassetta.","— E voi?","— E io farò la strada a piedi.","— No davvero, che non lo permetto. Preferisco piuttosto di salire in\ngroppa a qualcuno di questi ciuchini! — gridò Pinocchio.","Detto fatto, si avvicinò al ciuchino manritto della prima pariglia, e\nfece l'atto di volerlo cavalcare: ma la bestiuola, voltandosi a secco,\ngli dètte una gran musata nello stomaco e lo gettò a gambe all'aria.","Figuratevi la risatona impertinente e sgangherata di tutti quei ragazzi\npresenti alla scena.","Ma l'omino non rise. Si accostò pieno di amorevolezza al ciuchino\nribelle, e, facendo finta di dargli un bacio, gli staccò con un morso\nla metà dell'orecchio destro.","Intanto Pinocchio, rizzatosi da terra tutto infuriato, schizzò con\nun salto sulla groppa di quel povero animale. E il salto fu così\nbello, che i ragazzi, smesso di ridere, cominciarono a urlare: _viva\nPinocchio!_ e a fare una smanacciata di applausi, che non finivano più.","[Illustrazione: Dando una fortissima sgropponata, scaraventò\nil povero burattino in mezzo alla strada.]","Quand'ecco che all'improvviso il ciuchino alzò tutt'e due le gambe\ndi dietro, e dando una fortissima sgropponata, scaraventò il povero\nburattino in mezzo alla strada, sopra un monte di ghiaia.","Allora grandi risate daccapo: ma l'omino, invece di ridere, si sentì\npreso da tanto amore per quell'irrequieto asinello che, con un bacio,\ngli portò via di netto la metà di quell'altro orecchio. Poi disse al\nburattino:","— Rimonta pure a cavallo, e non aver paura. Quel ciuchino aveva qualche\ngrillo per il capo: ma io gli ho detto due paroline negli orecchi, e\nspero di averlo reso mansueto e ragionevole. —","Pinocchio montò, e il carro cominciò a muoversi: ma nel tempo che i\nciuchini galoppavano e che il carro correva sui ciottoli della via\nmaestra, gli parve al burattino di sentire una voce sommessa e appena\nintelligibile, che gli disse:","— Povero gonzo! Hai voluto fare a modo tuo, ma te ne pentirai! —","Pinocchio, quasi impaurito, guardò di qua e di là, per conoscere da\nqual parte venissero queste parole; ma non vide nessuno: i ciuchini\ngaloppavano, il carro correva, i ragazzi dentro al carro dormivano,\nLucignolo russava come un ghiro, e l'omino seduto a cassetta\ncanterellava fra i denti:","Tutti la notte dormono\nE io non dormo mai....","Fatto un altro mezzo chilometro, Pinocchio sentì la vocina fioca che\ngli disse:","— Tienlo a mente, grullerello! I ragazzi che smettono di studiare\ne voltano le spalle ai libri, alle scuole e ai maestri, per darsi\ninteramente ai balocchi e ai divertimenti, non possono far altro che\nuna fine disgraziata! Io lo so per prova, e te lo posso dire!... Verrà\nun giorno che piangerai anche tu, come oggi piango io.... ma allora\nsarà tardi!... —","A queste parole bisbigliate sommessamente, il burattino, spaventato più\nche mai, saltò giù dalla groppa della cavalcatura, e andò a prendere il\nsuo ciuchino per il muso.","E immaginatevi come restò, quando s'accòrse che il suo ciuchino\npiangeva.... e piangeva proprio come un ragazzo!","— Ehi, signor omino, — gridò allora Pinocchio al padrone del carro —\nsapete che cosa c'è di nuovo? Questo ciuchino piange.","— Lascialo piangere: riderà quando sarà sposo!","— Ma che forse gli avete insegnato anche a parlare?","— No: ha imparato da sè a borbottare qualche parola, essendo stato tre\nanni in una compagnia di cani ammaestrati.","— Povera bestia!...","— Via, via.... — disse l'omino — non perdiamo il nostro tempo a vedere\npiangere un ciuco. Rimonta a cavallo, e andiamo: la nottata è fresca,\ne la strada è lunga. —","Pinocchio obbedì senza rifiatare. Il carro riprese la sua corsa: e\nla mattina sul far dell'alba arrivarono felicemente nel «Paese dei\nbalocchi.»","[Illustrazione: La sua popolazione era tutta composta di\nragazzi.]","Questo paese non somigliava a nessun altro paese del mondo. La sua\npopolazione era tutta composta di ragazzi. I più vecchi avevano 14\nanni: i più giovani ne avevano 8 appena. Nelle strade, un'allegria,\nun chiasso, uno strillìo da levar di cervello! Branchi di monelli\nda per tutto: chi giocava alle noci, chi alle piastrelle, chi alla\npalla, chi andava in velocipede, chi sopra un cavallino di legno:\nquesti facevano a moscacieca; quegli altri si rincorrevano: altri,\nvestiti da pagliacci, mangiavano la stoppa accesa: chi recitava, chi\ncantava, chi faceva i salti mortali, chi si divertiva a camminare\ncolle mani in terra e colle gambe in aria: chi mandava il cerchio, chi\npasseggiava vestito da generale coll'elmo di foglio e lo squadrone\ndi cartapesta: chi rideva, chi urlava, chi chiamava, chi batteva\nle mani, chi fischiava, chi rifaceva il verso alla gallina quando\nha fatto l'ovo: insomma un tal pandemonio, un tal passeraio, un tal\nbaccano indiavolato, da doversi mettere il cotone negli orecchi per\nnon rimanere assorditi. Su tutte le piazze si vedevano teatrini di\ntela, affollati di ragazzi dalla mattina alla sera, e su tutti i muri\ndelle case si leggevano scritte col carbone delle bellissime cose come\nqueste: _viva i balocci!_ (invece di _balocchi_): _non voliamo più\nschole_ (invece di _non vogliamo più scuole_): abbasso Larin Metica\n(invece di _aritmetica_) e altri fiori consimili.","Pinocchio, Lucignolo e tutti gli altri ragazzi, che avevano fatto il\nviaggio coll'omino, appena ebbero messo il piede dentro la città, si\nficcarono subito in mezzo alla gran baraonda, e in pochi minuti, com'è\nfacile immaginarselo, diventarono gli amici di tutti. Chi più felice,\nchi più contento di loro? In mezzo ai continui spassi e agli svariati\ndivertimenti, le ore, i giorni, le settimane passavano come tanti\nbaleni.","— Oh! che bella vita! — diceva Pinocchio tutte le volte che per caso\ns'imbatteva in Lucignolo.","— Vedi, dunque, se avevo ragione? — ripigliava quest'ultimo. — E\ndire che tu non volevi partire! E pensare che t'eri messo in capo di\ntornartene a casa dalla tua Fata, per perdere il tempo a studiare! Se\noggi ti sei liberato dalla noia dei libri e delle scuole, lo devi a me,\nai miei consigli, alle mie premure, ne convieni? Non vi sono che i veri\namici, che sappiano rendere di questi grandi favori.","— È vero, Lucignolo! Se oggi io sono un ragazzo veramente contento,\nè tutto merito tuo. E il maestro, invece, sai che cosa mi diceva,\nparlando di te? Mi diceva sempre: «Non praticare quella birba\ndi Lucignolo, perchè Lucignolo è un cattivo compagno, e non può\nconsigliarti altro che a far del male!...»","— Povero maestro! — replicò l'altro tentennando il capo. — Lo so pur\ntroppo che mi aveva a noia, e che si divertiva sempre a calunniarmi; ma\nio sono generoso e gli perdono!","— Anima grande! — disse Pinocchio abbracciando affettuosamente l'amico,\ne dandogli un bacio in mezzo agli occhi.","Intanto era già da cinque mesi che durava questa bella cuccagna\ndi baloccarsi e di divertirsi le giornate intere, senza mai vedere\nin faccia nè un libro nè una scuola; quando una mattina Pinocchio,\nsvegliandosi, ebbe, come si suol dire, una gran brutta sorpresa, che lo\nmesse proprio di malumore."]},{"name":"Capitolo 32","paragraphs":["A Pinocchio gli vengono gli orecchi di ciuco, e poi diventa un ciuchino\nvero e comincia a ragliare.","E questa sorpresa quale fu?","Ve lo dirò io, miei cari e piccoli lettori: la sorpresa fu che a\nPinocchio, svegliandosi, gli venne fatto naturalmente di grattarsi il\ncapo; e nel grattarsi il capo si accòrse...","Indovinate un po' di che cosa si accòrse?","Si accòrse, con suo grandissimo stupore, che gli orecchi gli erano\ncresciuti più d'un palmo.","Voi sapete che il burattino, fin dalla nascita, aveva gli orecchi\npiccini piccini: tanto piccini che, a occhio nudo, non si vedevano\nneppure! Immaginatevi dunque come restò, quando dovè toccar con\nmano che i suoi orecchi, durante la notte, erano così allungati, che\nparevano due spazzole di padule. Andò subito in cerca di uno specchio,\nper potersi vedere: ma non trovando uno specchio, empì d'acqua la\ncatinella del lavamano, e specchiandovisi dentro, vide quel che non\navrebbe mai voluto vedere: vide, cioè, la sua immagine abbellita di un\nmagnifico paio di orecchi asinini. Lascio pensare a voi il dolore, la\nvergogna, e la disperazione del povero Pinocchio!","[Illustrazione: I suoi orecchi, durante la notte, erano così\nallungati, che parevano due spazzole di padule.]","Cominciò a piangere, a strillare, a battere la testa nel muro: ma\nquanto più si disperava, e più i suoi orecchi crescevano, crescevano,\ncrescevano e diventavano pelosi verso la cima.","Al rumore di quelle grida acutissime, entrò nella stanza una bella\nMarmottina, che abitava il piano di sopra: la quale, vedendo il\nburattino in così grandi smanie, gli domandò premurosamente:","— Che cos'hai, mio caro casigliano?","— Sono malato, Marmottina mia, molto malato.... e malato d'una malattia\nche mi fa paura! te ne intendi tu del polso?","— Un pochino.","— Senti dunque se per caso avessi la febbre. —","La Marmottina alzò la zampa destra davanti: e dopo aver tastato il\npolso a Pinocchio, gli disse sospirando:","— Amico mio, mi dispiace doverti dare una cattiva notizia!...","— Cioè?","— Tu hai una gran brutta febbre!","— E che febbre sarebbe?","— È la febbre del somaro.","— Non la capisco questa febbre! — rispose il burattino, che l'aveva pur\ntroppo capita.","— Allora te la spiegherò io; — soggiunse la Marmottina — sappi\ndunque, che fra due o tre ore tu non sarai più nè un burattino, nè un\nragazzo....","— E che cosa sarò?","— Fra due o tre ore, tu diventerai un ciuchino vero e proprio, come\nquelli che tirano il carretto e che portano i cavoli e l'insalata al\nmercato.","— Oh! povero me! povero me! — gridò Pinocchio pigliandosi con le mani\ntutt'e due gli orecchi, e tirandoli e strappandoli rabbiosamente, come\nse fossero gli orecchi di un altro.","[Illustrazione: — È la febbre del somaro.]","— Caro mio, — replicò la Marmottina per consolarlo — che cosa ci vuoi\ntu fare? Oramai è destino, oramai è scritto nei decreti della sapienza,\nche tutti quei ragazzi svogliati che, pigliando a noia i libri, le\nscuole e i maestri, passano le loro giornate in balocchi, in giuochi e\nin divertimenti, debbano finire prima o poi col trasformarsi in tanti\npiccoli somari.","— Ma davvero è proprio così? — domandò singhiozzando il burattino.","— Pur troppo è così! E ora i pianti sono inutili. Bisognava pensarci\nprima!","— Ma la colpa non è mia: la colpa, credilo, Marmottina, è tutta di\nLucignolo!...","— E chi è questo Lucignolo?","— Un mio compagno di scuola. Io volevo tornare a casa: io volevo essere\nubbidiente: io volevo seguitare a studiare e a farmi onore.... ma\nLucignolo mi disse: — «Perchè vuoi tu annoiarti a studiare? perchè vuoi\nandare alla scuola?... Vieni piuttosto con me, nel Paese dei balocchi:\nlì non studieremo più; lì ci divertiremo dalla mattina alla sera e\nstaremo sempre allegri.»","— E perchè seguisti il consiglio di quel falso amico, di quel cattivo\ncompagno?","— Perchè?... perchè, Marmottina mia, io sono un burattino senza\ngiudizio.... e senza cuore. Oh! se avessi avuto un zinzino di cuore,\nnon avrei mai abbandonata quella buona Fata, che mi voleva bene come\nuna mamma e che aveva fatto tanto per me!... e a quest'ora non sarei\npiù un burattino.... ma sarei invece un ragazzino ammodo, come ce n'è\ntanti! Oh!... ma se incontro Lucignolo, guai a lui! Gliene voglio dire\nun sacco e una sporta. —","[Illustrazione: Prese un gran berretto di cotone, e,\nficcatoselo in testa.]","E fece l'atto di volere uscire. Ma quando fu sulla porta, si ricordò\nche aveva gli orecchi d'asino, e vergognandosi di mostrarli in\npubblico, che cosa inventò? Prese un gran berretto di cotone, e,\nficcatoselo in testa, se lo ingozzò fin sotto gli orecchi.","Poi uscì, e si dette a cercare Lucignolo da per tutto. Lo cercò nelle\nstrade, nelle piazze, nei teatrini, in ogni luogo: ma non lo trovò. Ne\nchiese notizia a quanti incontrò per la via, ma nessuno l'aveva veduto.","Allora andò a cercarlo a casa: e arrivato alla porta, bussò.","— Chi è? — domandò Lucignolo di dentro.","— Sono io! — rispose il burattino.","— Aspetta un poco, e ti aprirò. —","Dopo mezz'ora la porta si aprì: e figuratevi come restò Pinocchio,\nquando, entrando nella stanza, vide il suo amico Lucignolo con un gran\nberretto di cotone in testa, che gli scendeva fin sotto il naso.","Alla vista di quel berretto, Pinocchio sentì quasi consolarsi e pensò\nsubito dentro di sè:","— Che l'amico sia malato della mia medesima malattia? Che abbia anche\nlui la febbre del ciuchino?... —","E facendo finta di non essersi accorto di nulla, gli domandò sorridendo:","— Come stai, mio caro Lucignolo?","— Benissimo: come un topo in una forma di cacio parmigiano.","— Lo dici proprio sul serio?","— E perchè dovrei dirti una bugia?","— Scusami, amico: e allora perchè tieni in capo cotesto berretto di\ncotone, che ti cuopre tutti gli orecchi?","— Me l'ha ordinato il medico, perchè mi son fatto male a un ginocchio.\nE tu, caro Pinocchio, perchè porti codesto berretto di cotone ingozzato\nfin sotto gli orecchi?","— Me l'ha ordinato il medico, perchè mi sono sbucciato un piede.","— Oh! povero Pinocchio!","— Oh! povero Lucignolo!... —","A queste parole tenne dietro un lunghissimo silenzio, durante il\nquale i due amici non fecero altro che guardarsi fra loro, in atto di\ncanzonatura.","Finalmente il burattino, con una vocina melliflua e flautata, disse al\nsuo compagno:","— Levami una curiosità, mio caro Lucignolo: hai mai sofferto di\nmalattia agli orecchi?","— Mai!... e tu?","— Mai! Per altro da questa mattina in poi ho un orecchio che mi fa\nspasimare.","— Ho lo stesso male anch'io.","— Anche tu?... E qual è l'orecchio che ti duole?","— Tutt'e due. E tu?","— Tutt'e due. Che sia la medesima malattia?","— Ho paura di sì.","— Vuoi farmi un piacere, Lucignolo?","— Volentieri! Con tutto il cuore.","— Mi fai vedere i tuoi orecchi?","— Perchè no? Ma prima voglio vedere i tuoi, caro Pinocchio.","— No: il primo devi esser tu.","— No, carino! Prima tu e dopo io!","— Ebbene, — disse allora il burattino — facciamo un patto da buoni\namici.","— Sentiamo il patto.","— Leviamoci tutt'e due il berretto nello stesso tempo: accetti?","— Accetto.","— Dunque attenti! —","E Pinocchio cominciò a contare a voce alta:","— Uno! Due! Tre! —","Alla parola _tre!_ i due ragazzi presero i loro berretti di capo e li\ngettarono in aria.","E allora avvenne una scena, che parrebbe incredibile, se non fosse\nvera. Avvenne, cioè, che Pinocchio e Lucignolo, quando si videro\ncolpiti tutt'e due dalla medesima disgrazia, invece di restar\nmortificati e dolenti, cominciarono ad ammiccarsi i loro orecchi\nsmisuratamente cresciuti, e dopo mille sguaiataggini finirono col dare\nuna bella risata.","[Illustrazione: Cominciarono ad ammiccarsi i loro orecchi\nsmisuratamente cresciuti.]","E risero, risero, risero da doversi reggere il corpo: se non che,\nsul più bello del ridere, Lucignolo tutt'a un tratto si chetò, e\nbarcollando e cambiando di colore, disse all'amico:","— Aiuto, aiuto, Pinocchio!","— Che cos'hai?","— Ohimè! non mi riesce più di star ritto sulle gambe.","— Non mi riesce più neanche a me — gridò Pinocchio, piangendo e\ntraballando.","[Illustrazione: Ragliando sonoramente, facevano tutt'e due in\ncoro: _j-a, j-a, j-a_.]","E mentre dicevano così, si piegarono tutt'e due carponi a terra e,\ncamminando colle mani e coi piedi, cominciarono a girare e a correre\nper la stanza. E intanto che correvano, i loro bracci diventarono\nzampe, i loro visi si allungarono e diventarono musi, e le loro schiene\nsi coprirono di un pelame grigiolino chiaro, brizzolato di nero.","Ma il momento più brutto per que' due sciagurati sapete quando fu? Il\nmomento più brutto e più umiliante fu quello quando sentirono spuntarsi\ndi dietro la coda. Vinti allora dalla vergogna e dal dolore, si\nprovarono a piangere e a lamentarsi del loro destino.","Non l'avessero mai fatto! Invece di gemiti e di lamenti, mandavano\nfuori dei ragli asinini: e ragliando sonoramente, facevano tutt'e due\nin coro: _j-a, j-a, j-a_.","In quel frattempo fu bussato alla porta, e una voce di fuori disse:","— Aprite! Sono l'omino, sono il conduttore del carro che vi portò in\nquesto paese. Aprite subito, guai a voi! —"]},{"name":"Capitolo 33","paragraphs":["Diventato un ciuchino vero è portato a vendere, e lo compra il\nDirettore di una compagnia di pagliacci, per insegnargli a ballare e\nsaltare i cerchi: ma una sera azzoppisce e allora lo ricompra un altro,\nper far con la sua pelle un tamburo.","Vedendo che la porta non si apriva, l'omino la spalancò con un\nviolentissimo calcio: ed entrato nella stanza, disse col suo solito\nrisolino a Pinocchio e a Lucignolo:","— Bravi ragazzi! Avete ragliato bene; io vi ho subito riconosciuti alla\nvoce, e per questo eccomi qui. —","A tali parole i due ciuchini rimasero mogi mogi, colla testa giù, con\ngli orecchi bassi e con la coda fra le gambe.","Da principio l'omino li lisciò, li accarezzò, li palpeggiò: poi, tirata\nfuori la striglia, cominciò a strigliarli per bene.","E quando a furia di strigliarli, li ebbe fatti lustri come due specchi,\nallora messe loro la cavezza e li condusse sulla piazza del mercato,\ncon la speranza di venderli e di beccarsi un discreto guadagno.","E i compratori, difatti, non si fecero aspettare. Lucignolo fu\ncomprato da un contadino, a cui era morto il somaro il giorno avanti,\ne Pinocchio fu venduto al Direttore di una compagnia di pagliacci e di\nsaltatori di corda, il quale lo comprò per ammaestrarlo e per farlo poi\nsaltare e ballare insieme con le altre bestie della compagnia.","[Illustrazione: Li condusse sulla piazza del mercato, con la\nsperanza di venderli.]","E ora avete capito, miei piccoli lettori, qual era il bel mestiere che\nfaceva l'omino? Questo brutto mostriciattolo, che aveva la fisonomia\ntutta di latte e miele, andava di tanto in tanto con un carro a girare\nper il mondo; strada facendo raccoglieva con promesse e con moine tutti\ni ragazzi svogliati, che avevano a noia i libri e le scuole; e dopo\naverli caricati sul suo carro, gli conduceva nel «Paese dei balocchi»\nperchè passassero tutto il loro tempo in giuochi, in chiassate e\nin divertimenti. Quando poi quei poveri ragazzi illusi, a furia di\nbaloccarsi sempre e di non studiar mai, diventavano tanti ciuchini,\nallora tutto allegro e contento s'impadroniva di loro e li portava a\nvendere sulle fiere e su i mercati. E così in pochi anni aveva fatto\nfior di quattrini ed era diventato milionario.","Quel che accadesse di Lucignolo, non lo so: so per altro, che Pinocchio\nandò incontro fin dai primi giorni a una vita durissima e strapazzata.","Quando fu condotto nella stalla, il nuovo padrone gli empì la greppia\ndi paglia: ma Pinocchio dopo averne assaggiata una boccata, la risputò.","Allora il padrone, brontolando, gli empì la greppia di fieno: ma\nneppure il fieno gli piacque.","— Ah! non ti piace neppure il fieno? — gridò il padrone imbizzito.\n— Lascia fare, ciuchino bello, che se hai dei capricci per il capo,\npenserò io a levarteli!... —","E a titolo di correzione, gli affibbiò subito una frustata nelle gambe.","Pinocchio, dal gran dolore, cominciò a piangere e a ragliare, e\nragliando disse:","— J-a, j-a, la paglia non la posso digerire!...","— Allora mangia il fieno! — replicò il padrone, che intendeva benissimo\nil dialetto asinino.","— J-a, j-a, il fieno mi fa dolere il corpo!...","— Pretenderesti, dunque, che un somaro pari tuo, lo dovessi mantenere\na petti di pollo e cappone in galantina? — soggiunse il padrone\narrabbiandosi sempre più, e affibbiandogli una seconda frustata.","A quella seconda frustata, Pinocchio per prudenza si chetò subito, e\nnon disse altro.","Intanto la stalla fu chiusa, e Pinocchio rimase solo: e perchè erano\nmolte ore che non aveva mangiato, cominciò a sbadigliare dal grande\nappetito. E, sbadigliando, spalancava una bocca che pareva un forno.","Alla fine, non trovando altro nella greppia, si rassegnò a masticare un\npo' di fieno; e dopo averlo masticato ben bene, chiuse gli occhi e lo\ntirò giù.","— Questo fieno non è cattivo; — poi disse dentro di sè — ma quanto\nsarebbe stato meglio che avessi continuato a studiare!... A quest'ora,\ninvece di fieno potrei mangiare un cantuccio di pan fresco e una bella\nfetta di salame. Pazienza!... —","La mattina dopo, svegliandosi, cercò subito nella greppia un altro po'\ndi fieno: ma non lo trovò, perchè l'aveva mangiato tutto nella notte.","Allora prese una boccata di paglia tritata: e in quel mentre che la\nstava masticando, si dovè persuadere che il sapore della paglia tritata\nnon somigliava punto nè al risotto alla milanese nè ai maccheroni alla\nnapoletana.","— Pazienza! — ripetè, continuando a masticare. — Che almeno la mia\ndisgrazia possa servire di lezione a tutti i ragazzi disobbedienti e\nche non hanno voglia di studiare. Pazienza!... pazienza!","— Pazienza un corno! — urlò il padrone, entrando in quel momento\nnella stalla. — Credi forse, mio bel ciuchino, ch'io ti abbia comprato\nunicamente per darti da bere e da mangiare? Io ti ho comprato perchè tu\nlavori e perchè tu mi faccia guadagnare molti quattrini. Su, dunque, da\nbravo! Vieni con me nel Circo, e là ti insegnerò a saltare i cerchi, a\nrompere col capo le botti di foglio e a ballare il valzer e la polca,\nstando ritto sulle gambe di dietro. —","Il povero Pinocchio, o per amore o per forza, dovè imparare tutte\nqueste bellissime cose; ma, per impararle, gli ci vollero tre mesi di\nlezioni, e molte frustate da levare il pelo.","Venne finalmente il giorno, in cui il suo padrone potè annunziare\nuno spettacolo veramente straordinario. I cartelloni di vario colore,\nattaccati alle cantonate delle strade, dicevano così:","GRANDE SPETTACOLO\nDI\nGALA","Per questa sera\nAVRANNO LUOGO I SOLITI SALTI\nED ESERCIZI SORPRENDENTI\nESEGUITI DA TUTTI GLI ARTISTI\ne da tutti i cavalli d'ambo i sessi della Compagnia\ne più","Sarà presentato per la prima volta\nil famoso","CIUCHINO PINOCCHIO","detto\nLA STELLA DELLA DANZA","Il teatro sarà illuminato a giorno","Quella sera, come potete figurarvelo, un'ora prima che cominciasse lo\nspettacolo, il teatro era pieno stipato.","Non si trovava più nè una poltrona, nè un posto distinto, nè un palco,\nnemmeno a pagarlo a peso d'oro.","Le gradinate del Circo formicolavano di bambini, di bambine e di\nragazzi di tutte le età, che avevano la febbre addosso per la smania di\nveder ballare il famoso ciuchino Pinocchio.","Finita la prima parte dello spettacolo, il Direttore della compagnia,\nvestito in giubba nera, calzoni bianchi a coscia e stivaloni di pelle\nfin sopra ai ginocchi si presentò all'affollatissimo pubblico, e, fatto\nun grande inchino, recitò con molta solennità il seguente spropositato\ndiscorso:","«Rispettabile pubblico, cavalieri e dame!","«L'umile sottoscritto essendo di passaggio per questa illustre\nmetropolitana, ho voluto procrearmi l'onore nonchè il piacere di\npresentare a questo intelligente e cospicuo uditorio un celebre\nciuchino, che ebbe già l'onore di ballare al cospetto di sua maestà\nl'imperatore di tutte le principali corti di Europa.","«E col ringraziandoli, aiutateci della vostra animatrice presenza e\ncompatiteci!»","Questo discorso fu accolto da molte risate e da molti applausi: ma\ngli applausi raddoppiarono e diventarono una specie di uragano alla\ncomparsa del ciuchino Pinocchio in mezzo al Circo. Egli era tutto\nagghindato a festa. Aveva una briglia nuova di pelle lustra, con fibbie\ne borchie d'ottone; due camelie bianche agli orecchi: la criniera\ndivisa in tanti riccioli legati con fiocchettini di seta rossa: una\ngran fascia d'oro e d'argento attraverso alla vita, e la coda tutta\nintrecciata con nastri di velluto paonazzo e celeste. Era, insomma, un\nciuchino da innamorare!","Il direttore, nel presentarlo al pubblico, aggiunse queste parole:","«Miei rispettabili auditori! Non starò qui a farvi menzogna delle\ngrandi difficoltà da me soppressate per comprendere e soggiogare questo\nmammifero, mentre pascolava liberamente di montagna in montagna nelle\npianure della zona torrida. Osservate, vi prego, quanta selvaggina\ntrasudi da' suoi occhi, conciossiachè essendo riusciti vanitosi tutti\ni mezzi per addomesticarlo al vivere dei quadrupedi civili, ho dovuto\npiù volte ricorrere all'affabile dialetto della frusta. Ma ogni mia\ngentilezza invece di farmi da lui ben volere, me ne ha maggiormente\ncattivato l'animo. Io però, seguendo il sistema di Galles, trovai nel\nsuo cranio una piccola cartagine ossea che la stessa Facoltà Medicea\ndi Parigi riconobbe esser quello il bulbo rigeneratore dei capelli e\ndella danza pirrica. E per questo io lo volli ammaestrare nel ballo\nnonchè nei relativi salti dei cerchi e delle botti foderate di foglio.\nAmmiratelo, e poi giudicatelo! Prima però di prendere cognato da voi,\npermettete, o signori, che io v'inviti al diurno spettacolo di domani\nsera: ma nell'apoteosi che il tempo piovoso minacciasse acqua, allora\nlo spettacolo, invece di domani sera, sarà posticipato a domattina,\nalle ore 11 antimeridiane del pomeriggio.»","E qui il Direttore fece un'altra profondissima riverenza: quindi\nvolgendosi a Pinocchio gli disse:","— Animo, Pinocchio! Avanti di dar principio ai vostri esercizi,\nsalutate questo rispettabile pubblico, cavalieri, dame e\nragazzi! —","Pinocchio ubbidiente piegò subito i due ginocchi davanti, e rimase\ninginocchiato fino a tanto che il Direttore, schioccando la frusta, non\ngli gridò:","— Al passo! —","Allora il ciuchino si rizzò sulle quattro gambe, e cominciò a girare\nintorno al Circo, camminando sempre di passo.","Dopo un poco il Direttore gridò:","— Al trotto! — E Pinocchio, ubbidiente al comando, cambiò il passo in\ntrotto.","— Al galoppo! — e Pinocchio staccò il galoppo.","— Alla carriera! — e Pinocchio si dette a correre, di gran carriera. Ma\nin quella che correva come un barbero, il Direttore, alzando il braccio\nin aria, iscaricò un colpo di pistola.","[Illustrazione: Pinocchio ubbidiente piegò subito i due\nginocchi davanti.]","A quel colpo il ciuchino, fingendosi ferito, cadde disteso nel Circo,\ncome se fosse moribondo davvero.","Rizzatosi da terra in mezzo a uno scoppio di applausi, d'urli e di\nbattimani, che andavano alle stelle, gli venne fatto naturalmente di\nalzare la testa e di guardare in su.... e guardando vide in un palco\nuna bella signora, che aveva al collo una grossa collana d'oro, dalla\nquale pendeva un medaglione. Nel medaglione c'era dipinto il ritratto\nd'un burattino.","— Quel ritratto è il mio!... quella signora è la Fata! — disse dentro\ndi sè Pinocchio, riconoscendola subito: e lasciandosi vincere dalla\ngran contentezza, si provò a gridare:","— Oh Fatina mia! oh Fatina mia! —","Ma invece di queste parole, gli uscì dalla gola un raglio così sonoro e\nprolungato, che fece ridere tutti gli spettatori, e segnatamente tutti\ni ragazzi che erano in teatro.","Allora il Direttore, per insegnargli e per fargli intendere che non è\nbuona creanza di mettersi a ragliare in faccia al pubblico, gli diè col\nmanico della frusta una bacchettata sul naso.","Il povero ciuchino tirato fuori un palmo di lingua, durò a leccarsi il\nnaso almeno cinque minuti, credendo forse così di rasciugarsi il dolore\nche aveva sentito.","Ma quale fu la sua disperazione quando, voltandosi in su una seconda\nvolta, vide che il palco era vuoto e che la Fata era sparita!...","Si sentì come morire: gli occhi gli si empirono di lacrime e cominciò a\npiangere dirottamente. Nessuno però se ne accòrse, e, meno degli altri,\nil Direttore, il quale, anzi, schioccando la frusta, gridò:","— Da bravo, Pinocchio! Ora farete vedere a questi signori con quanta\ngrazia sapete saltare i cerchi. —","Pinocchio si provò due o tre volte: ma ogni volta che arrivava davanti\nal cerchio, invece di attraversarlo, ci passava più comodamente di\nsotto. Alla fine spiccò un salto e l'attraversò: ma le gambe di dietro\ngli rimasero disgraziatamente impigliate nel cerchio: motivo per cui\nricadde in terra dall'altra parte tutto in un fascio.","Quando si rizzò, era azzoppito, e a mala pena potè ritornare alla\nscuderia.","— Fuori Pinocchio! Vogliamo il ciuchino! Fuori il ciuchino! — gridavano\ni ragazzi dalla platea, impietositi e commossi al tristissimo caso.","Ma il ciuchino per quella sera non si fece più vedere.","La mattina dopo il veterinario, ossia il medico delle bestie, quando\nl'ebbe visitato, dichiarò che sarebbe rimasto zoppo per tutta la vita.","Allora il Direttore disse al suo garzone di stalla:","— Che vuoi tu che mi faccia d'un somaro zoppo? Sarebbe un mangiapane a\nufo. Portalo dunque in piazza e rivendilo. —","[Illustrazione: Il ciuchino, con quel macigno al collo, andò\nsubito a fondo.]","Arrivati in piazza, trovarono subito il compratore, il quale domandò al\ngarzone di stalla:","— Quanto vuoi di cotesto ciuchino zoppo?","— Venti lire.","— Io ti do venti soldi. Non credere che io lo compri per servirmene: lo\ncompro unicamente per la sua pelle. Vedo che ha la pelle molto dura, e\ncon la sua pelle voglio fare un tamburo per la banda musicale del mio\npaese. —","Lascio pensare a voi, ragazzi, il bel piacere che fu per il povero\nPinocchio, quando sentì che era destinato a diventare un tamburo!","Fatto sta che il compratore, appena pagati i venti soldi, condusse\nil ciuchino sopra uno scoglio ch'era sulla riva del mare; e messogli\nun sasso al collo e legatolo per una zampa con una fune che teneva in\nmano, gli diè improvvisamente uno spintone e lo gettò nell'acqua.","Pinocchio con quel macigno al collo, andò subito a fondo; e il\ncompratore, tenendo sempre stretta in mano la fune, si pose a sedere\nsullo scoglio, aspettando che il ciuchino avesse tutto il tempo di\nmorire affogato, per poi scorticarlo e levargli la pelle."]},{"name":"Capitolo 34","paragraphs":["Pinocchio gettato in mare, è mangiato dai pesci, e ritorna ad essere\nun burattino come prima: ma mentre nuota per salvarsi, è ingoiato dal\nterribile Pesce-cane.","Dopo cinquanta minuti che il ciuchino era sott'acqua, il compratore\ndisse, discorrendo da sè solo:","— A quest'ora il mio povero ciuchino zoppo deve essere bell'e\naffogato. Ritiriamolo dunque su, e facciamo con la sua pelle questo bel\ntamburo. —","E cominciò a tirare la fune, con la quale lo aveva legato per una\ngamba: e tira, tira, tira, alla fine vide apparire a fior d'acqua....\nIndovinate? Invece di un ciuchino morto, vide apparire a fior d'acqua\nun burattino vivo che scodinzolava come un'anguilla.","Vedendo quel burattino di legno, il pover'uomo credè di sognare e\nrimase lì intontito, a bocca aperta e con gli occhi fuori della testa.","Riavutosi un poco del suo primo stupore, disse piangendo e balbettando:","— E il ciuchino che ho gettato in mare dov'è?...","[Illustrazione: Invece di un ciuchino morto, vide apparire a\nfior d'acqua un burattino vivo.]","— Quel ciuchino son io! — rispose il burattino, ridendo.","— Tu?","— Io.","— Ah! mariuolo! Pretenderesti forse di burlarti di me?","— Burlarmi di voi? Tutt'altro, caro padrone: io vi parlo sul serio.","— Ma come mai tu, che poco fa eri un ciuchino, ora stando nell'acqua,\nsei diventato un burattino di legno?...","— Sarà effetto dell'acqua del mare. Il mare ne fa di questi scherzi.","— Bada, burattino, bada!... Non credere di divertirti alle mie spalle.\nGuai a te, se mi scappa la pazienza!","— Ebbene, padrone: volete sapere tutta la vera storia? Scioglietemi\nquesta gamba e io ve la racconterò. —","Quel buon pasticcione del compratore, curioso di conoscere la vera\nstoria, gli sciolse subito il nodo della fune, che lo teneva legato: e\nallora Pinocchio, trovandosi libero come un uccello nell'aria, prese a\ndirgli così:","— Sappiate dunque che io ero un burattino di legno come sono oggi: ma\nmi trovavo a tocco e non tocco di diventare un ragazzo, come in questo\nmondo ce n'è tanti: se non che, per la mia poca voglia di studiare e\nper dar retta ai cattivi compagni, scappai di casa.... e un bel giorno,\nsvegliandomi, mi trovai cambiato in un somaro con tanto d'orecchi....\ne con tanto di coda!... Che vergogna fu quella per me!... Una vergogna,\ncaro padrone, che Sant'Antonio benedetto non la faccia provare neppure\na voi! Portato a vendere sul mercato degli asini, fui comprato dal\nDirettore di una compagnia equestre, il quale si messe in capo di far\ndi me un gran ballerino o un gran saltatore di cerchi; ma una sera\ndurante lo spettacolo, feci in teatro una brutta cascata, e rimasi\nzoppo da tutt'e due le gambe. Allora il Direttore non sapendo che cosa\nfarsi d'un asino zoppo, mi mandò a rivendere, e voi mi avete comprato!","— Pur troppo! E ti ho pagato venti soldi. E ora, chi mi rende i miei\npoveri venti soldi?","— E perchè mi avete comprato? Voi mi avete comprato per fare con la mia\npelle un tamburo!... un tamburo!...","— Pur troppo! E ora dove troverò un'altra pelle!...","— Non vi date alla disperazione, padrone. Dei ciuchini ce n'è tanti, in\nquesto mondo!","— Dimmi, monello impertinente: e la tua storia finisce qui?","— No, — rispose il burattino — ci sono altre due parole, e poi è\nfinita. Dopo avermi comprato, mi avete condotto in questo luogo per\nuccidermi, ma poi, cedendo a un sentimento pietoso d'umanità, avete\npreferito di legarmi un sasso al collo e di gettarmi in fondo al\nmare. Questo sentimento di delicatezza vi onora moltissimo, e io ve\nne serberò eterna riconoscenza. Per altro, caro padrone, questa volta\navete fatto i vostri conti senza la Fata....","— E chi è questa Fata?","— È la mia mamma, la quale somiglia a tutte quelle buone mamme, che\nvogliono un gran bene ai loro ragazzi e non li perdono mai d'occhio,\ne li assistono amorosamente in ogni disgrazia, anche quando questi\nragazzi, per le loro scapataggini e per i loro cattivi portamenti,\nmeriterebbero di essere abbandonati e lasciati in balia a sè stessi.\nDicevo, dunque, che la buona Fata, appena mi vide in pericolo di\naffogare, mandò subito intorno a me un branco infinito di pesci, i\nquali credendomi davvero un ciuchino bell'e morto, cominciarono a\nmangiarmi! E che bocconi che facevano! Non avrei mai creduto che i\npesci fossero più ghiotti anche dei ragazzi! Chi mi mangiò gli orecchi,\nchi mi mangiò il muso, chi il collo e la criniera, chi la pelle delle\nzampe, chi la pelliccia della schiena.... e fra gli altri, vi fu un\npesciolino così garbato, che si degnò perfino di mangiarmi la coda.","— Da oggi in poi — disse il compratore inorridito — faccio giuro di\nnon assaggiar più carne di pesce. Mi dispiacerebbe troppo a aprire una\ntriglia o un nasello fritto e di trovargli in corpo una coda di ciuco!","— Io la penso come voi — replicò il burattino, ridendo. — Del resto,\ndovete sapere che quando i pesci ebbero finito di mangiarmi tutta\nquella buccia asinina, che mi copriva dalla testa ai piedi, arrivarono,\ncom'è naturale, all'osso.... o per dir meglio, arrivarono al legno,\nperchè, come vedete, io son fatto di legno durissimo. Ma dopo dato\ni primi morsi, quei pesci ghiottoni si accòrsero subito che il legno\nnon era ciccia per i loro denti, e nauseati da questo cibo indigesto\nse ne andarono chi in qua chi in là, senza voltarsi nemmeno a dirmi\ngrazie.... Ed eccovi raccontato come qualmente voi, tirando su la fune,\navete trovato un burattino vivo, invece d'un ciuchino morto.","— Io mi rido della tua storia — gridò il compratore imbestialito. — Io\nso che ho speso venti soldi per comprarti, e rivoglio i miei quattrini.\nSai che cosa farò? Ti porterò daccapo al mercato, e ti rivenderò a peso\ndi legno stagionato per accendere il fuoco nel camminetto.","— Rivendetemi pure: io sono contento — disse Pinocchio. Ma nel\ndir così, fece un salto e schizzò in mezzo all'acqua. E nuotando\nallegramente e allontanandosi dalla spiaggia, gridava al povero\ncompratore:","— Addio, padrone; se avete bisogno di una pelle per fare un tamburo,\nricordatevi di me. —","E poi rideva e seguitava a nuotare: e dopo un poco, rivoltandosi\nindietro, urlava più forte:","— Addio, padrone;... se avete bisogno di un po' di legno stagionato per\naccendere il camminetto, ricordatevi di me. —","Fatto sta che in un batter d'occhio si era tanto allontanato, che non\nsi vedeva quasi più; ossia si vedeva solamente sulla superficie del\nmare un puntolino nero, che di tanto in tanto rizzava le gambe fuori\ndell'acqua e faceva capriole e salti, come un delfino in vena di buon\numore.","Intanto che Pinocchio nuotava alla ventura, vide in mezzo al mare\nuno scoglio che pareva di marmo bianco, e su in cima allo scoglio,\nuna bella caprettina, che belava amorosamente e gli faceva segno di\navvicinarsi.","La cosa più singolare era questa: che la lana della caprettina, invece\ndi esser bianca, o nera, o pallata di più colori, come quella delle\naltre capre, era invece turchina, ma d'un turchino così sfolgorante,\nche rammentava moltissimo i capelli della bella Bambina.","Lascio pensare a voi se il cuore del povero Pinocchio cominciò a\nbattere più forte! Raddoppiando di forze e di energia si diè a nuotare\nverso lo scoglio bianco; ed era già a mezza strada, quand'ecco uscir\nfuori dell'acqua e venirgli incontro un'orribile testa di mostro\nmarino, con la bocca spalancata come una voragine, e tre filari di\nzanne, che avrebbero fatto paura anche a vederle dipinte.","E sapete chi era quel mostro marino?","Quel mostro marino era nè più nè meno quel gigantesco Pesce-cane\nricordato più volte in questa storia, e che per le sue stragi e per la\nsua insaziabile voracità, veniva soprannominato «l'Attila dei pesci e\ndei pescatori.»","Immaginatevi lo spavento del povero Pinocchio, alla vista del mostro.\nCercò di scansarlo, di cambiare strada: cercò di fuggire: ma quella\nimmensa bocca spalancata gli veniva sempre incontro con la velocità di\nuna saetta.","— Affrettati, Pinocchio, per carità! — gridava belando la bella\ncaprettina.","E Pinocchio nuotava disperatamente con le braccia, col petto, con le\ngambe e coi piedi.","— Corri, Pinocchio, perchè il mostro si avvicina!... —","E Pinocchio, raccogliendo tutte le sue forze, raddoppiava di lena nella\ncorsa.","— Bada, Pinocchio!... il mostro ti raggiunge! Eccolo!... Eccolo!...\nAffrettati, per carità, o sei perduto!... —","[Illustrazione: E Pinocchio nuotava disperatamente con le\nbraccia, col petto, con le gambe e coi piedi.]","E Pinocchio a nuotare più lesto che mai, e via, via, e via, come\nanderebbe una palla di fucile. E già si accostava allo scoglio, e già\nla caprettina spenzolandosi tutta sul mare, gli porgeva le sue zampine\ndavanti per aiutarlo a uscir fuori dell'acqua.... Ma!...","Ma oramai era tardi! Il mostro lo aveva raggiunto. Il mostro, tirando\nil fiato a sè, si bevve il povero burattino, come avrebbe bevuto un\nuovo di gallina, e lo inghiottì con tanta violenza e con tanta avidità,\nche Pinocchio, cascando giù in corpo al Pesce-cane, battè un colpo così\nscreanzato da restarne sbalordito per un quarto d'ora.","Quando ritornò in sè da quello sbigottimento, non sapeva raccapezzarsi,\nnemmeno lui, in che mondo si fosse. Intorno a sè c'era da ogni parte\nun gran buio: ma un buio così nero e profondo, che gli pareva di\nessere entrato col capo in un calamaio pieno d'inchiostro. Stette in\nascolto e non sentì nessun rumore; solamente di tanto in tanto sentiva\nbattersi nel viso alcune grandi buffate di vento. Da principio non\nsapeva intendere da dove quel vento uscisse: ma poi capì che usciva dai\npolmoni del mostro. Perchè bisogna sapere che il Pesce-cane soffriva\nmoltissimo d'asma, e quando respirava pareva proprio che soffiasse la\ntramontana.","Pinocchio, sulle prime, s'ingegnò di farsi un po' di coraggio: ma\nquand'ebbe la prova e la riprova di trovarsi chiuso in corpo al mostro\nmarino allora cominciò a piangere e a strillare; e piangendo diceva:","— Aiuto! aiuto! Oh povero me! Non c'è nessuno che venga a salvarmi!","— Chi vuoi che ti salvi, disgraziato? — disse in quel buio una\nvociaccia fessa di chitarra scordata.","— Chi è che parla così? — domandò Pinocchio, sentendosi gelare dallo\nspavento.","— Sono io! sono un povero Tonno, inghiottito dal Pesce-cane insieme con\nte. E tu che pesce sei?","— Io non ho che veder nulla coi pesci. Io sono un burattino.","— E allora se non sei un pesce, perchè ti sei fatto inghiottire dal\nmostro?","— Non son io, che mi son fatto inghiottire: gli è lui che mi ha\ninghiottito! Ed ora, che cosa dobbiamo fare qui al buio?...","— Rassegnarsi e aspettare che il Pesce-cane ci abbia digeriti tutt'e\ndue!...","— Ma io non voglio esser digerito! — urlò Pinocchio, ricominciando a\npiangere.","— Neppure io vorrei esser digerito — soggiunse il Tonno — ma io sono\nabbastanza filosofo e mi consolo pensando che, quando si nasce Tonni,\nc'è più dignità a morir sott'acqua che sott'olio!...","— Scioccherie! — gridò Pinocchio.","— La mia è un'opinione — replicò il Tonno — e le opinioni, come dicono\ni Tonni politici, vanno rispettate!","— Insomma.... io voglio andarmene di qui.... io voglio fuggire....","— Fuggi, se ti riesce!...","— È molto grosso questo Pesce-cane che ci ha inghiottiti? — domandò il\nburattino.","— Figurati che il suo corpo è più lungo di un chilometro, senza contare\nla coda. —","Nel tempo che faceva questa conversazione al buio, parve a Pinocchio di\nvedere, lontano lontano, una specie di chiarore.","— Che cosa sarà mai quel lumicino lontano lontano? — disse Pinocchio.","— Sarà qualche nostro compagno di sventura, che aspetterà, come noi, il\nmomento di esser digerito!...","— Voglio andare a trovarlo. Non potrebbe darsi il caso che fosse\nqualche vecchio pesce capace d'insegnarmi la strada per fuggire?","— Io te l'auguro di cuore, caro burattino.","— Addio, Tonno.","— Addio, burattino; e buona fortuna.","— Dove ci rivedremo?...","— Chi lo sa?... È meglio non pensarci neppure! —"]},{"name":"Capitolo 35","paragraphs":["Pinocchio ritrova in corpo al Pesce-cane.... chi ritrova? Leggete\nquesto capitolo e lo saprete.","Pinocchio, appena che ebbe detto addio al suo buon amico Tonno, si\nmosse brancolando in mezzo a quel buio, e camminando a tastoni dentro\nil corpo del Pesce-cane, si avviò, un passo dietro l'altro, verso quel\npiccolo chiarore che vedeva baluginare lontano lontano.","E nel camminare sentì che i suoi piedi sguazzavano in una pozzanghera\nd'acqua grassa e sdrucciolona, e quell'acqua sapeva di un odore così\nacuto di pesce fritto, che gli pareva d'essere a mezza quaresima.","E più andava avanti, e più il chiarore si faceva rilucente e distinto:\nfinchè, cammina cammina, alla fine arrivò: e quando fu arrivato....\nche cosa trovò? Ve lo do a indovinare in mille: trovò una piccola\ntavola apparecchiata, con sopra una candela accesa infilata in una\nbottiglia di cristallo verde, e seduto a tavola un vecchiettino tutto\nbianco, come se fosse di neve o di panna montata; il quale se ne stava\nlì biascicando alcuni pesciolini vivi, ma tanto vivi, che alle volte,\nmentre li mangiava, gli scappavano perfino di bocca.","[Illustrazione: E più andava avanti, e più il chiarore si\nfaceva rilucente.]","A quella vista il povero Pinocchio ebbe un'allegrezza così grande e\ncosì inaspettata, che ci mancò un ètte che non cadesse in delirio.\nVoleva ridere, voleva piangere, voleva dire un monte di cose; e\ninvece mugolava confusamente e balbettava delle parole tronche e\nsconclusionate. Finalmente gli riuscì di cacciar fuori un grido di\ngioia, e spalancando le braccia e gettandosi al collo del vecchietto,\ncominciò a urlare:","— Oh! babbino mio! finalmente vi ho ritrovato! Ora poi non vi lascio\npiù, mai più, mai più!","[Illustrazione: Gettandosi al collo del vecchietto, cominciò\na urlare.]","— Dunque gli occhi mi dicono il vero? — replicò il vecchietto,\nstropicciandosi gli occhi. — Dunque tu se' proprio il mi' caro\nPinocchio?","— Sì, sì! sono io, proprio io! E voi mi avete digià perdonato,\nnon è vero? Oh babbino mio, come siete buono!... e pensare che io,\ninvece.... Oh! ma se sapeste quante disgrazie mi son piovute sul capo\ne quante cose mi sono andate a traverso! Figuratevi che il giorno\nche voi, povero babbino, col vendere la vostra casacca, mi compraste\nl'Abbecedario per andare a scuola, io scappai a vedere i burattini,\ne il burattinaio mi voleva mettere sul fuoco perchè gli cocessi il\nmontone arrosto, che fu quello poi che mi dètte cinque monete d'oro,\nperchè le portassi a voi, ma io trovai la Volpe e il Gatto, che mi\ncondussero all'Osteria del Gambero Rosso, dove mangiarono come lupi, e\npartito solo di notte incontrai gli assassini che si messero a corrermi\ndietro, e io via, e loro dietro, e io via, e loro sempre dietro, e io\nvia, finchè m'impiccarono a un ramo della Quercia Grande, dovecchè\nla bella Bambina dai capelli turchini mi mandò a prendere con una\ncarrozzina, e i medici, quando m'ebbero visitato, dissero subito: «Se\nnon è morto, è segno che è sempre vivo» e allora mi scappò detta una\nbugia, e il naso cominciò a crescermi e non mi passava più dalla porta\ndi camera, motivo per cui andai con la Volpe e col Gatto a sotterrare\nle quattro monete d'oro, che una l'avevo spesa all'Osteria, e il\npappagallo si messe a ridere, e viceversa di duemila monete non trovai\npiù nulla, la quale il Giudice quando seppe che ero stato derubato, mi\nfece subito mettere in prigione, per dare una soddisfazione ai ladri,\ndi dove, col venir via, vidi un bel grappolo d'uva in un campo, che\nrimasi preso alla tagliola e il contadino di santa ragione mi messe\nil collare da cane perchè facessi la guardia al pollaio, che riconobbe\nla mia innocenza e mi lasciò andare, e il serpente, colla coda che gli\nfumava, cominciò a ridere e gli si strappò una vena sul petto, e così\nritornai alla casa della bella Bambina, che era morta, e il Colombo\nvedendo che piangevo mi disse: «Ho visto il tu' babbo che si fabbricava\nuna barchettina per venirti a cercare», e io gli dissi: «Oh! se avessi\nle ali anch'io» e lui mi disse: «Vuoi venire dal tuo babbo?» e io gli\ndissi: «Magari! ma chi mi ci porta?» e lui mi disse: «Ti ci porto io»\ne io gli dissi: «Come?» e lui mi disse: «Montami sulla groppa» e così\nabbiamo volato tutta la notte, poi la mattina tutti i pescatori che\nguardavano verso il mare mi dissero: «C'è un pover'omo in una barchetta\nche sta per affogare» e io da lontano vi riconobbi subito, perchè me lo\ndiceva il core, e vi feci segno di tornare alla spiaggia....","— Ti riconobbi anch'io, — disse Geppetto — e sarei volentieri tornato\nalla spiaggia: ma come fare? il mare era grosso e un cavallone\nm'arrovesciò la barchetta. Allora un orribile Pesce-cane che era lì\nvicino, appena che m'ebbe visto nell'acqua, corse subito verso di me,\ne tirata fuori la lingua, mi prese pari pari, e m'inghiottì come un\ntortellino di Bologna.","— E quant'è che siete rinchiuso qui dentro? — domandò Pinocchio.","— Da quel giorno in poi, saranno ormai due anni: due anni, Pinocchio\nmio.... che mi son parsi due secoli!","— E come avete fatto a campare? E dove avete trovata la candela? E i\nfiammiferi per accenderla, chi ve li ha dati?","— Ora ti racconterò tutto. Devi dunque sapere che quella medesima\nburrasca, che rovesciò la mia barchetta, fece anche affondare un\nbastimento mercantile. I marinai si salvarono tutti, ma il bastimento\ncolò a fondo, e il solito Pesce-cane, che quel giorno aveva un appetito\neccellente, dopo aver inghiottito me, inghiottì anche il bastimento....","— Come! Lo inghiottì tutto in un boccone?... — domandò Pinocchio\nmaravigliato.","— Tutto in un boccone: e risputò solamente l'albero maestro, perchè\ngli era rimasto fra i denti come una lisca. Per mia gran fortuna,\nquel bastimento era carico non solo di carne conservata in cassette\ndi stagno, ma di biscotto, ossia di pane abbrostolito, di bottiglie\ndi vino, d'uva secca, di cacio, di caffè, di zucchero, di candele\nsteariche e di scatole di fiammiferi di cera. Con tutta questa grazia\ndi Dio ho potuto campare due anni: ma oggi sono agli ultimi sgoccioli:\noggi nella dispensa non c'è più nulla, e questa candela, che vedi\naccesa, è l'ultima candela che mi sia rimasta....","— E dopo?","— E dopo, caro mio, rimarremo tutt'e due al buio.","— Allora, babbino mio, — disse Pinocchio — non c'è tempo da perdere.\nBisogna pensar subito a fuggire.","— A fuggire?... e come?","— Scappando dalla bocca del Pesce-cane e gettandosi a nuoto in mare.","— Tu parli bene: ma io, caro Pinocchio, non so nuotare!","— E che importa?... Voi mi monterete a cavalluccio sulle spalle, e io,\nche sono un buon nuotatore, vi porterò sano e salvo fino alla spiaggia.","— Illusioni, ragazzo mio! — replicò Geppetto, scotendo il capo e\nsorridendo malinconicamente. — Ti pare egli possibile che un burattino,\nalto appena un metro come sei tu, possa aver tanta forza da portarmi a\nnuoto sulle spalle?","— Provatevi e vedrete! A ogni modo, se sarà scritto in cielo che\ndobbiamo morire, avremo almeno la gran consolazione di morire\nabbracciati insieme. —","E senza dir altro, Pinocchio prese in mano la candela, e andando avanti\nper far lume, disse al suo babbo:","— Venite dietro a me, e non abbiate paura. —","E così camminarono un bel pezzo, e traversarono tutto il corpo e\ntutto lo stomaco del Pesce-cane. Ma giunti al punto dove cominciava\nla spaziosa gola del mostro, pensarono bene di fermarsi per dare\nun'occhiata e cogliere il momento opportuno alla fuga.","Ora bisogna sapere che il Pesce-cane, essendo molto vecchio e soffrendo\nd'asma e di palpitazione di cuore, era costretto a dormire a bocca\naperta: per cui Pinocchio affacciandosi al principio della gola,\ne guardando in su, potè vedere al di fuori di quell'enorme bocca\nspalancata un bel pezzo di cielo stellato e un bellissimo lume di luna.","— Questo è il vero momento di scappare — bisbigliò allora, voltandosi\nal suo babbo. — Il Pesce-cane dorme come un ghiro: il mare è tranquillo\ne ci si vede come di giorno. Venite dunque, babbino, dietro a me, e fra\npoco saremo salvi. —","Detto fatto salirono su per la gola del mostro marino, e arrivati\nin quell'immensa bocca cominciarono a camminare in punta di piedi\nsulla lingua; una lingua così larga e così lunga, che pareva il\nviottolone d'un giardino. E già stavano lì lì per fare il gran salto\ne per gettarsi a nuoto nel mare, quando, sul più bello, il Pesce-cane\nstarnutì, e nello starnutire, dètte uno scossone così violento,\nche Pinocchio e Geppetto si trovarono rimbalzati all'indietro e\nscaraventati nuovamente in fondo allo stomaco del mostro.","Nel grand'urto della caduta la candela si spense, e padre e figliuolo\nrimasero al buio.","— E ora?... — domandò Pinocchio facendosi serio.","— Ora, ragazzo mio, siamo bell'e perduti.","— Perchè perduti? Datemi la mano, babbino, e badate di non\nsdrucciolare!...","— Dove mi conduci?","— Dobbiamo ritentare la fuga. Venite con me e non abbiate paura. —","Ciò detto, Pinocchio prese il suo babbo per la mano: e camminando\nsempre in punta di piedi, risalirono insieme su per la gola del mostro:\npoi traversarono tutta la lingua e scavalcarono i tre filari di denti.\nPrima però di fare il gran salto, il burattino disse al suo babbo:","— Montatemi a cavalluccio sulle spalle e abbracciatemi forte forte. Al\nresto ci penso io. —","[Illustrazione: Si gettò nell'acqua e cominciò a nuotare.]","Appena Geppetto si fu accomodato per bene sulle spalle del figliuolo,\nil bravo Pinocchio, sicuro del fatto suo, si gettò nell'acqua e\ncominciò a nuotare. Il mare era tranquillo come un olio: la luna\nsplendeva in tutto il suo chiarore, e il Pesce-cane seguitava a dormire\ndi un sonno così profondo, che non l'avrebbe svegliato nemmeno una\ncannonata."]},{"name":"Capitolo 36","paragraphs":["Finalmente Pinocchio cessa d'essere un burattino e diventa un ragazzo.","Mentre Pinocchio nuotava alla svelta per raggiungere la spiaggia, si\naccòrse che il suo babbo, il quale gli stava a cavalluccio sulle spalle\ne aveva le gambe mezze nell'acqua, tremava fitto fitto, come se al\npover'uomo gli battesse la febbre terzana.","Tremava di freddo o di paura? Chi lo sa?... Forse un po' dell'uno e un\npo' dell'altra. Ma Pinocchio, credendo che quel tremito fosse di paura,\ngli disse per confortarlo:","— Coraggio, babbo! Fra pochi minuti arriveremo a terra e saremo salvi.","— Ma dov'è questa spiaggia benedetta? — domandò il vecchietto,\ndiventando sempre più inquieto, e appuntando gli occhi, come fanno i\nsarti quando infilano l'ago. — Eccomi qui, che guardo da tutte le parti\ne non vedo altro che cielo e mare.","— Ma io vedo anche la spiaggia — disse il burattino. — Per vostra\nregola io sono come i gatti: ci vedo meglio di notte che di\ngiorno. —","Il povero Pinocchio faceva finta di esser di buon umore: ma invece....\ninvece cominciava a scoraggirsi: le forze gli scemavano, il suo respiro\ndiventava grosso e affannoso.... insomma non ne poteva più, e la\nspiaggia era sempre lontana.","Nuotò finchè ebbe fiato: poi si voltò col capo verso Geppetto, e disse\ncon parole interrotte:","— Babbo mio, aiutatemi.... perchè io muoio.... —","E padre e figliuolo erano oramai sul punto di affogare, quando udirono\nuna voce di chitarra scordata che disse:","— Chi è che muore?","— Sono io e il mio povero babbo!","— Questa voce la riconosco! Tu sei Pinocchio!...","— Preciso; e tu?","— Io sono il Tonno, il tuo compagno di prigionia in corpo al Pesce-cane.","— E come hai fatto a scappare?","— Ho imitato il tuo esempio. Tu sei quello che mi hai insegnato la\nstrada, e dopo te sono fuggito anch'io.","— Tonno mio, tu càpìti proprio a tempo! Ti prego, per l'amore che porti\nai tonnini tuoi figliuoli; aiutaci, o siamo perduti.","— Volentieri e con tutto il cuore. Attaccatevi tutt'e due alla\nmia coda, e lasciatevi guidare. In quattro minuti vi condurrò alla\nriva. —","[Illustrazione: Giudicarono più comodo di mettersi addirittura\na sedere sulla groppa del Tonno.]","Geppetto e Pinocchio, come potete immaginarvelo, accettarono subito\nl'invito; ma invece di attaccarsi alla coda, giudicarono più comodo di\nmettersi addirittura a sedere sulla groppa del Tonno.","— Siamo troppo pesi? — gli domandò Pinocchio.","— Pesi? Neanche per ombra: mi par di aver addosso due gusci di\nconchiglia — rispose il Tonno, il quale era di una corporatura così\ngrossa e robusta, da parere un vitello di due anni.","Giunti alla riva, Pinocchio saltò a terra il primo per aiutare il suo\nbabbo a fare altrettanto: poi si voltò al Tonno, e con voce commossa\ngli disse:","— Amico mio, tu hai salvato il mio babbo! Dunque non ho parole per\nringraziarti abbastanza! Permetti almeno che ti dia un bacio, in segno\ndi riconoscenza eterna!... —","Il Tonno cacciò il muso fuori dell'acqua, e Pinocchio, piegatosi coi\nginocchi a terra, gli posò un affettuosissimo bacio sulla bocca. A\nquesto tratto di spontanea e vivissima tenerezza, il povero Tonno,\nche non c'era avvezzo, si sentì talmente commosso, che vergognandosi\na farsi veder piangere come un bambino, ricacciò il capo sott'acqua e\nsparì.","Intanto s'era fatto giorno.","Allora Pinocchio, offrendo il suo braccio a Geppetto, che aveva appena\nil fiato di reggersi in piedi, gli disse:","— Appoggiatevi pure al mio braccio, caro babbino, e andiamo.\nCammineremo pian pianino come le formicole, e quando saremo stanchi, ci\nriposeremo lungo la via.","[Illustrazione: Pinocchio, piegandosi coi ginocchi a terra,\ngli posò un affettuosissimo bacio sulla bocca.]","— E dove dobbiamo andare? — domandò Geppetto.","— In cerca di una casa o d'una capanna, dove ci diano per carità un\nboccon di pane e un po' di paglia che ci serva da letto. —","Non avevano ancora fatti cento passi, che videro seduti sul ciglione\ndella strada due brutti ceffi, i quali stavano lì in atto di chieder\nl'elemosina.","Erano il Gatto e la Volpe: ma non si riconoscevano più da quelli\nd'una volta. Figuratevi che il Gatto, a furia di fingersi cieco, aveva\nfinito coll'accecare davvero: e la Volpe invecchiata, intignata e tutta\nperduta da una parte, non aveva più nemmeno la coda. Così è. Quella\ntrista ladracchiola, caduta nella più squallida miseria, si trovò\ncostretta un bel giorno a vendere perfino la sua bellissima coda a un\nmerciaio ambulante, che la comprò per farsene uno scacciamosche.","— O Pinocchio! — gridò la volpe con voce di piagnisteo — fai un po' di\ncarità a questi due poveri infermi!","— Infermi! — ripetè il Gatto.","— Addio, mascherine! — rispose il burattino. — Mi avete ingannato una\nvolta, e ora non mi ripigliate più.","— Credilo, Pinocchio, che oggi siamo poveri e disgraziati davvero!","— Davvero! — ripetè il Gatto.","— Se siete poveri ve lo meritate. Ricordatevi del proverbio che dice:\n«I quattrini rubati non fanno mai frutto.» Addio, mascherine.","— Abbi compassione di noi!...","— Di noi!","— Addio, mascherine! Ricordatevi del proverbio che dice: «La farina del\ndiavolo va tutta in crusca.»","— Non ci abbandonare!
