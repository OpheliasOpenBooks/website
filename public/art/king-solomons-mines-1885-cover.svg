<title id="t">King Solomon's Mines — 1885-inspired red cloth binding</title>
<desc id="d">An original historically inspired recreation of the first edition's red Victorian cloth cover, with dark-stamped lettering and a restrained shield and spear motif. Not a facsimile of the original binding.</desc>
