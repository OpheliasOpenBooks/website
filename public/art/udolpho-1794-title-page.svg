<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1110" viewBox="0 0 720 1110" role="img" aria-labelledby="cTitle cDesc">
<title id="cTitle">The Mysteries of Udolpho — Ann Radcliffe — 1794 title-page-inspired cover</title>
<desc id="cDesc">Historically informed typographic recreation inspired by the first London edition of 1794; not a photographic facsimile.</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4ecd8"/><stop offset=".55" stop-color="#eee1c4"/><stop offset="1" stop-color="#dfcda9"/></linearGradient><pattern id="grain" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="6" cy="14" r=".55" fill="#baa880" opacity=".25"/><circle cx="28" cy="9" r=".7" fill="#aa946c" opacity=".23"/><circle cx="18" cy="32" r=".55" fill="#806f55" opacity=".13"/></pattern></defs>
<rect width="720" height="1110" fill="url(#paper)"/><rect width="720" height="1110" fill="url(#grain)"/>
<rect x="39" y="38" width="642" height="1034" fill="none" stroke="#746348" stroke-width="2"/><rect x="51" y="50" width="618" height="1010" fill="none" stroke="#a3916c" stroke-width="1"/>
<g fill="#302a23" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
<text x="360" y="140" font-size="21" letter-spacing="7">THE</text>
<text x="360" y="220" font-size="43" letter-spacing="3">MYSTERIES</text>
<text x="360" y="286" font-size="31" letter-spacing="8">OF UDOLPHO,</text>
<text x="360" y="347" font-size="18" letter-spacing="6">A</text>
<text x="360" y="391" font-size="27" letter-spacing="8">ROMANCE;</text>
<text x="360" y="437" font-size="15" letter-spacing="2.4">INTERSPERSED WITH SOME PIECES OF POETRY.</text>
<text x="360" y="502" font-size="18" letter-spacing="5">BY</text>
<text x="360" y="557" font-size="32" letter-spacing="4">ANN RADCLIFFE,</text>
<text x="360" y="597" font-size="16" letter-spacing="1.5" font-style="italic">Author of The Romance of the Forest, &amp;c.</text>
<text x="360" y="663" font-size="18" letter-spacing="3">IN FOUR VOLUMES.</text>
<path d="M226 697h268" stroke="#817254" stroke-width="1.4"/><path d="M285 705q75 21 150 0" fill="none" stroke="#817254" stroke-width=".8"/>
<text x="360" y="749" font-size="15" font-style="italic">Fate sits on these dark battlements, and frowns,</text>
<text x="360" y="780" font-size="15" font-style="italic">And, as the portals open to receive me,</text>
<text x="360" y="811" font-size="15" font-style="italic">Her voice, in sullen echoes through the courts,</text>
<text x="360" y="842" font-size="15" font-style="italic">Tells of a nameless deed.</text>
<text x="360" y="908" font-size="18" letter-spacing="4">VOL. I.</text>
<path d="M195 933h330" stroke="#746348" stroke-width="1"/>
<text x="360" y="976" font-size="22" letter-spacing="5">LONDON:</text>
<text x="360" y="1008" font-size="14" letter-spacing="1">PRINTED FOR G. G. AND J. ROBINSON,</text>
<text x="360" y="1031" font-size="14" letter-spacing="1.3">PATERNOSTER-ROW. 1794.</text>
</g></svg>