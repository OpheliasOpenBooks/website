<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="coverTitle coverDesc">
<title id="coverTitle">Orlando: A Biography, Virginia Woolf — historically inspired Hogarth Press first-edition dust jacket, 1928</title>
<desc id="coverDesc">Cream Edwardian-style printed jacket with ORLANDO A BIOGRAPHY VIRGINIA WOOLF in black classical capitals above an engraved, black-and-white Elizabethan courtier in dark costume with a large armorial shield; Hogarth Press London imprint at foot. An original drawing informed by the historical 1928 Hogarth Press jacket, not a facsimile.</desc>
