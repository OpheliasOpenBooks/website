<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1030" viewBox="0 0 720 1030"><title>The Rape of the Lock — title-page design inspired by the 1714 edition</title><defs><linearGradient id="p" x2="1" y2="1"><stop stop-color="#eedebb"/><stop offset=".5" stop-color="#f8eccc"/><stop offset="1" stop-color="#e6cc9a"/></linearGradient></defs><rect width="720" height="1030" fill="#3c3026"/><rect x="23" y="22" width="674" height="986" fill="url(#p)" stroke="#8a714b" stroke-width="3"/><rect x="45" y="43" width="630" height="942" fill="none" stroke="#bb9b6b"/><g font-family="Baskerville,'Times New Roman',Georgia,serif" fill="#30271f" text-anchor="middle"><text x="360" y="154" font-size="32" letter-spacing="10">THE</text><text x="360" y="240" font-size="48"><tspan fill="#8d3b30" font-style="italic">RAPE</tspan><tspan font-size="29"> of the </tspan><tspan fill="#8d3b30" font-style="italic">LOCK.</tspan></text><text x="360" y="305" font-size="29" letter-spacing="8">AN</text><text x="360" y="371" font-size="40" letter-spacing="6">HEROI-COMICAL</text><text x="360" y="464" font-size="75" fill="#8d3b30" letter-spacing="17">POEM.</text><text x="360" y="543" font-size="29">In FIVE CANTO'S.</text><line x1="170" y1="575" x2="550" y2="575" stroke="#665440"/><text x="360" y="621" font-size="30">Written by <tspan fill="#8d3b30">Mr. POPE.</tspan></text><text x="360" y="690" font-size="22" font-style="italic">A tonso est hoc nomen adepta capillo.</text><text x="360" y="721" font-size="19">OVID.</text><line x1="180" y1="750" x2="540" y2="750" stroke="#665440"/><text x="360" y="799" font-size="34" fill="#8d3b30" letter-spacing="8">LONDON:</text><text x="360" y="848" font-size="25">Printed for BERNARD LINTOTT,</text><text x="360" y="888" font-size="23">at the Cross-Keys in Fleetstreet.</text><text x="360" y="945" font-size="36">1714.</text></g></svg>