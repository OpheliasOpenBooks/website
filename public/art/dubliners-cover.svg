<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title description">
<title id="title">Dubliners by James Joyce — an original cover homage to the 1914 Grant Richards first edition</title>
<desc id="description">Edwardian original 1914 dark red cloth binding: restrained gold-stamped DUBLINERS title across the upper front board and a narrow darkened spine lettered vertically in gold with Dubliners, James Joyce, and Grant Richards. No illustrative embellishment.</desc>
<defs>
<linearGradient id="maroon" x1="0" x2="1" y1="0" y2=".15">
 <stop offset="0" stop-color="#572626"/><stop offset=".11" stop-color="#823c40"/><stop offset=".45" stop-color="#843b3d"/><stop offset=".83" stop-color="#753236"/><stop offset="1" stop-color="#662c32"/>
</linearGradient>
<linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0" stop-color="#562426"/><stop offset=".53" stop-color="#6d3032"/><stop offset=".92" stop-color="#4e2327"/><stop offset="1" stop-color="#a35a5b"/>
</linearGradient>
<linearGradient id="gilt" x1="0" y1="0" x2=".9" y2=".4">
 <stop offset="0" stop-color="#d8b06c"/><stop offset=".37" stop-color="#efce89"/><stop offset=".69" stop-color="#caa663"/><stop offset="1" stop-color="#e6c381"/>
</linearGradient>
<pattern id="cloth" width="5" height="11" patternUnits="userSpaceOnUse">
 <path d="M1 0v11M3 0v11" fill="none" stroke="#2b1115" stroke-width=".45" opacity=".12"/>
 <path d="M0 5h5M0 9h5" fill="none" stroke="#cf8481" stroke-width=".4" opacity=".08"/>
</pattern>
</defs>
<rect x="0" y="0" width="600" height="900" fill="#482126"/>
<rect x="8" y="11" width="584" height="877" rx="2" fill="url(#maroon)"/>
<rect x="8" y="11" width="584" height="877" fill="url(#cloth)"/>
<rect x="8" y="11" width="81" height="877" fill="url(#spine)"/>
<path d="M86 11v877" stroke="#3b191e" stroke-width="5" opacity=".66"/>
<path d="M94 11v877" stroke="#a75d5b" stroke-width="1.7" opacity=".4"/>
<path d="M18 13v874 M580 13v874" stroke="#9d5f5a" stroke-width="1" opacity=".25"/>
<g fill="url(#gilt)" font-family="Georgia,'Times New Roman',serif">
 <text x="338" y="167" font-size="37" text-anchor="middle" letter-spacing="2.7">DUBLINERS</text>
</g>
<g font-family="Georgia,'Times New Roman',serif" fill="url(#gilt)" text-anchor="middle">
 <g transform="translate(47 190) rotate(90)">
 <text x="0" y="0" font-size="20" letter-spacing="1.2">DUBLINERS</text>
 </g>
 <g transform="translate(47 454) rotate(90)">
 <text x="0" y="0" font-size="19" letter-spacing="1.5">JAMES JOYCE</text>
 </g>
 <g transform="translate(47 780) rotate(90)">
 <text x="0" y="0" font-size="12" letter-spacing=".7">GRANT RICHARDS</text>
 </g>
</g>
</svg>