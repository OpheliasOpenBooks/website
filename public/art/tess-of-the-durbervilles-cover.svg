<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
<title id="title">Tess of the d’Urbervilles by Thomas Hardy — 1891 first-edition-inspired cover</title>
<desc id="desc">A warm tan Victorian cloth binding with two vertical undulating gilded honeysuckle stems, golden blossom clusters and circular floral discs, recalling Charles Ricketts’ original 1891 Osgood, McIlvaine first-edition design. An inset title panel uses contemporary Victorian serif typography.</desc>
