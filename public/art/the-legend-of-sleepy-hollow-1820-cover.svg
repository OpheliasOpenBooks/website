<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
<title id="title">The Legend of Sleepy Hollow — 1820 period-inspired title page</title>
<desc id="desc">An antiquarian early nineteenth-century volume with marbled binding and an ivory title page, inspired by early Washington Irving editions. Original period-inspired design, not a facsimile.</desc>
