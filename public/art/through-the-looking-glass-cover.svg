<title id="title">Through the Looking-Glass · Historic 1871–1872 red cloth cover reconstruction</title>
<desc id="desc">An original historical-style recreation inspired by the first Macmillan binding: red cloth, three thin gold borders, and a Victorian gilt cameo of the Red Queen. Not a photograph or facsimile.</desc>
