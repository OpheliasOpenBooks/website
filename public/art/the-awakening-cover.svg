<title id="coverTitle">The Awakening by Kate Chopin — 1899 first-edition-inspired cloth cover</title>
<desc id="coverDesc">Pale seafoam green cloth with a dark green grapevine border and muted red lettering, recalling the 1899 Herbert S. Stone and Company first-edition binding.</desc>
