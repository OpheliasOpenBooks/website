<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="cover-title cover-desc">
<title id="cover-title">Cane by Jean Toomer, 1923 first-edition-inspired cloth cover</title>
<desc id="cover-desc">Buff-gray 1923 modernist cloth cover featuring an ochre sun in the upper-left and a sweeping diagonal black band with large ivory letters spelling CANE. JEAN TOOMER appears in black underneath.</desc>
