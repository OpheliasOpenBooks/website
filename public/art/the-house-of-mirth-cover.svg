<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="cover-title cover-desc">
<title id="cover-title">The House of Mirth by Edith Wharton — 1905 red-and-gold first-edition-inspired cover</title>
<desc id="cover-desc">Rich crimson ribbed cloth with a rectangular gold title panel near the upper third and Edith Wharton stamped in gold below, faithfully recalling the understated Charles Scribner's Sons 1905 first-edition binding.</desc>
<defs>
 <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#722a31"/><stop offset=".10" stop-color="#a52e38"/><stop offset=".54" stop-color="#ba4148"/><stop offset="1" stop-color="#8b262f"/></linearGradient>
 <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe1a1"/><stop offset=".46" stop-color="#c89d49"/><stop offset="1" stop-color="#f5d58a"/></linearGradient>
 <pattern id="ribs" width="5.7" height="8" patternUnits="userSpaceOnUse"><path d="M1 0v8M4 0v8" stroke="#2e0f14" opacity=".17" stroke-width=".75"/><path d="M2 0v8" stroke="#f6b6a1" opacity=".065" stroke-width=".5"/></pattern>
 <filter id="print"><feGaussianBlur stdDeviation=".18"/></filter>
</defs>
<rect width="600" height="900" fill="#6b232a"/>
<rect x="14" y="14" width="572" height="872" rx="3" fill="url(#cloth)"/>
<rect x="14" y="14" width="572" height="872" fill="url(#ribs)" opacity=".84"/>
<path d="M25 17v865" stroke="#552128" opacity=".40" stroke-width="6"/>
<path d="M571 17v865" stroke="#d76e63" opacity=".22" stroke-width="3"/>
<g fill="none" stroke="url(#gilt)" stroke-width="2.7">
 <rect x="116" y="122" width="368" height="155" rx="1"/>
 <rect x="123" y="129" width="354" height="141" stroke-width=".72" opacity=".65"/>
</g>
<g font-family="Georgia,'Times New Roman',serif" text-anchor="middle" fill="url(#gilt)">
 <text x="300" y="191" font-size="51" letter-spacing="3" font-weight="normal">THE HOUSE</text>
 <text x="300" y="250" font-size="55" letter-spacing="3.5">OF MIRTH</text>
 <text x="300" y="773" font-size="43" letter-spacing="2.3">EDITH WHARTON</text>
</g>
<text x="300" y="858" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" letter-spacing="2.1" fill="#e4bb79" opacity=".9">OPHELIA’S OPEN BOOK · FIRST EDITION HOMAGE · 1905</text>
</svg>