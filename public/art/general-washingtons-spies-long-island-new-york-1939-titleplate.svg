<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img" aria-labelledby="title desc"><title id="title">General Washington’s Spies by Morton Pennypacker</title><desc id="desc">Vintage 1939 title-page inspired design, a reconstruction rather than a scan of the original artwork</desc><rect width="600" height="820" fill="#ece3cc"/><rect x="30" y="30" width="540" height="760" fill="#f7f0dc" stroke="#5c654e" stroke-width="4"/><rect x="46" y="46" width="508" height="728" fill="none" stroke="#af9a71" stroke-width="2"/><path d="M97 162H503M97 174H503M97 550H503M97 562H503" stroke="#8e7a58" stroke-width="2"/><text x="300" y="110" font-family="Georgia,serif" text-anchor="middle" font-size="19" letter-spacing="4" fill="#435044">LONG ISLAND HISTORY</text><text x="300" y="237" font-family="Georgia,serif" text-anchor="middle" font-size="30" fill="#2e3e33">GENERAL WASHINGTON’S</text><text x="300" y="305" font-family="Georgia,serif" text-anchor="middle" font-size="61" letter-spacing="6" fill="#2e3e33">SPIES</text><text x="300" y="368" font-family="Georgia,serif" text-anchor="middle" font-size="25" font-style="italic" fill="#5e5945">On Long Island and</text><text x="300" y="402" font-family="Georgia,serif" text-anchor="middle" font-size="25" font-style="italic" fill="#5e5945">In New York</text><text x="300" y="495" font-family="Georgia,serif" text-anchor="middle" font-size="25" fill="#435044">BY MORTON PENNYPACKER</text><text x="300" y="637" font-family="Georgia,serif" text-anchor="middle" font-size="17" letter-spacing="2" fill="#514a37">LONG ISLAND HISTORICAL SOCIETY</text><text x="300" y="677" font-family="Georgia,serif" text-anchor="middle" font-size="15" fill="#514a37">BROOKLYN, NEW YORK</text><text x="300" y="725" font-family="Georgia,serif" text-anchor="middle" font-size="24" fill="#514a37">1939</text><text x="300" y="761" font-family="Georgia,serif" text-anchor="middle" font-size="11" fill="#776c55">Period-inspired title plate, not original cover artwork</text></svg>