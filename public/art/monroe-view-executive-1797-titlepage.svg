<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
<title id="title">A View of the Conduct of the Executive, James Monroe, 1797</title>
<desc id="desc">Typographic reconstruction of the 1797 Philadelphia title page, not a photograph or facsimile</desc>
<rect width="600" height="800" fill="#e5d9be"/><rect x="28" y="25" width="544" height="750" fill="#f7f0df" stroke="#927e5b" stroke-width="2"/>
<g fill="#312a22" font-family="Georgia,serif" text-anchor="middle">
<text x="300" y="95" font-size="33" letter-spacing="6">A VIEW</text>
<text x="300" y="136" font-size="22" font-style="italic">OF THE</text>
<text x="300" y="195" font-size="32" letter-spacing="3">CONDUCT</text>
<text x="300" y="237" font-size="22">OF THE</text>
<text x="300" y="291" font-size="35" letter-spacing="3">EXECUTIVE,</text>
<text x="300" y="340" font-size="20">IN THE FOREIGN AFFAIRS OF THE</text>
<text x="300" y="379" font-size="26">UNITED STATES:</text>
<text x="300" y="424" font-size="18">CONNECTED WITH THE MISSION TO THE</text>
<text x="300" y="459" font-size="24">FRENCH REPUBLIC,</text>
<text x="300" y="493" font-size="18">DURING THE YEARS 1794, 5, &amp; 6.</text>
<path d="M145 525H455" stroke="#9b825b" stroke-width="1.7"/>
<text x="300" y="565" font-size="24">BY JAMES MONROE.</text>
<text x="300" y="608" font-size="15">ILLUSTRATED BY HIS INSTRUCTIONS,</text>
<text x="300" y="630" font-size="15">CORRESPONDENCE, AND OTHER DOCUMENTS.</text>
<text x="300" y="681" font-size="20">PHILADELPHIA:</text>
<text x="300" y="713" font-size="17">BENJ. FRANKLIN BACHE.</text>
<text x="300" y="744" font-size="22">M.DCC.XCVII.</text>
</g></svg>