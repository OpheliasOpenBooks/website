<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title description">
<title id="title">Little Women by Louisa May Alcott — inspired by the 1868 Roberts Brothers cloth first edition</title>
<desc id="description">Victorian green cloth book cover with an embossed circular gold title medallion, ornamental Greek-key rules, fine gold lettering and decorative gilt floral flourishes recalling the original 1868 Roberts Brothers first edition.</desc>
